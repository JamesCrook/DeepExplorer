<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D - DeepExplorer demos</title>
  <link rel="icon" type="image/x-icon" href="../wheel.ico">
  <link rel="stylesheet" href="../css/panopticon.css">
  <script type="importmap">
    { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <!-- Phylotaxis spirals, an atom dumbbell and a ground plane, in Three.js panes. -->
  <header>
    <h1>3D</h1>
    <span class="tag" id="pane-count"></span>
  </header>

  <div id="container"></div>

  <div id="tooltip">
    <div class="tt-name"></div>
    <div class="tt-detail"></div>
    <div class="tt-extra"></div>
  </div>

<script type="module">
// Each model registers itself in SYS.MODELS as it loads, importing the nodes
// it draws with; App lays out one pane per model.
import '../js/models/phylotaxis-model.js';
import '../js/models/dumbbell-model.js';
import '../js/models/ground-plane-model.js';
import { App } from '../js/omni-support/app.js';

new App();
</script>
</body>
</html>
