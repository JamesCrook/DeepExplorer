<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panopticon - DeepExplorer demos</title>
  <link rel="icon" type="image/x-icon" href="../wheel.ico">
  <link rel="stylesheet" href="../css/panopticon.css">
  <script type="importmap">
    { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <!-- Every demo panel at once: the whole node system, as a check that it loads together. -->
  <header>
    <h1>Panopticon</h1>
    <span class="tag" id="pane-count"></span>
  </header>

  <div id="container"></div>

  <div id="tooltip">
    <div class="tt-name"></div>
    <div class="tt-detail"></div>
    <div class="tt-extra"></div>
  </div>

<script type="module">
// Each model registers itself in SYS.MODELS as it loads, importing the nodes
// it draws with; App lays out one pane per model.
import '../js/models/tca-cycle-model.js';
import '../js/models/silhouette-model.js';
import '../js/models/procedural-tree-model.js';
import '../js/models/procedural-complete-model.js';
import '../js/models/benzene-model.js';
import '../js/models/butanol-model.js';
import '../js/models/seed-model.js';
import '../js/models/climate-model.js';
import '../js/models/ramachandran-model.js';
import '../js/models/heatmap-model.js';
import '../js/models/tree-ring-model.js';
import '../js/models/hex-view-model.js';
import '../js/models/word-cloud-model.js';
import '../js/models/chromosome-model.js';
import '../js/models/deep-sky-model.js';
import '../js/models/planet-model.js';
import '../js/models/annular-label-model.js';
import '../js/models/phylotaxis-model.js';
import '../js/models/dumbbell-model.js';
import '../js/models/ground-plane-model.js';
import '../js/models/mouse-model.js';
import '../js/models/piano-model.js';
import '../js/models/bga-model.js';
import '../js/models/button-set-model.js';
// Stock strip needs to be after all modules that donate items to the stock strip
import '../js/models/stock-strip-model.js';
import { App } from '../js/omni-support/app.js';

new App();
</script>
</body>
</html>
