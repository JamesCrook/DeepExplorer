<script>

// ═══════════════════════════════════════════════════════════════
//  PORTABLE CLASSES — ready to import into the scene graph.
//
//  Convention (matching ButtonNode / DragPointNode):
//    ctxMix  — context bag:  .ctx, .T, .W, .H, .hitPoint, .hitResult
//    node    — scene node:   .data (zone data), .value (instance state)
//    params  — layer-level style/anim knobs
//
//  ctxMix.T is the transform / iteration context.  The core sets:
//    T.index      — current zone index
//    T.pass       — drawing pass (0-based)
//    T.isHovered  — true if this zone is hovered
//    T.isSelected — true if this zone is selected
// ═══════════════════════════════════════════════════════════════


//<< import { ZonedNode, HIGHLIGHT, rrPath } from './zoned-node.js';
//-- file: ./zoned-node.js --
//>> import { sceneRegistry } from '../deep-explorer/js/omni-support/scene.js';
//>> export { ZonedNode, HIGHLIGHT, rrPath };
// ── Helpers ─────────────────────────────────────────────────

const HIGHLIGHT = '#daa02e';

function rrPath(ctx, x, y, w, h, rtl, rtr, rbr, rbl) {
  ctx.beginPath();
  ctx.moveTo(x + rtl, y);
  ctx.lineTo(x + w - rtr, y);
  ctx.arcTo(x + w, y, x + w, y + rtr, rtr);
  ctx.lineTo(x + w, y + h - rbr);
  ctx.arcTo(x + w, y + h, x + w - rbr, y + h, rbr);
  ctx.lineTo(x + rbl, y + h);
  ctx.arcTo(x, y + h, x, y + h - rbl, rbl);
  ctx.lineTo(x, y + rtl);
  ctx.arcTo(x, y, x + rtl, y, rtl);
  ctx.closePath();
}


// ═══════════════════════════════════════════════════════════════
//  CORE — ZonedNode
//
//  Orchestrator node class.  Iterates zones, sets T.index,
//  delegates to the zone class found on node.value.zoneClass.
//
//  Zone classes must provide:
//    static getCount(data)                          → number
//    static draw2d(ctxMix, node, params)            — draw zone T.index
//    static drawBackground(ctxMix, node, params)    — before zones
//    static hit_test(ctxMix, node, params)          — test zone T.index
//
//  Zone classes may provide:
//    static drawOverlay(ctxMix, node, params)       — after zones
//    static getPasses(params)                       → number (default 1)
//    static getHitOrder(data, count)                → index[] | null
//    static getZoneInfo(ctxMix, node, params)       → { name, detail, extra }
// ═══════════════════════════════════════════════════════════════

// #zone/node/code
class ZonedNode {

  static draw2d(ctxMix, node, params) {
    const Zone   = node.value.zoneClass;
    const T      = ctxMix.T;
    const count  = Zone.getCount(node.data);
    const passes = Zone.getPasses ? Zone.getPasses(params) : 1;

    Zone.drawBackground(ctxMix, node, params);

    for (let pass = 0; pass < passes; pass++) {
      T.pass = pass;
      for (let i = 0; i < count; i++) {
        T.index      = i;
        T.isHovered  = (i === node.value.hovered);
        T.isSelected = node.value.selected.has(i);
        Zone.draw2d(ctxMix, node, params);
      }
    }

    if (Zone.drawOverlay) Zone.drawOverlay(ctxMix, node, params);
  }

  static hit_test(ctxMix, node, params) {
    const Zone  = node.value.zoneClass;
    const T     = ctxMix.T;
    const count = Zone.getCount(node.data);
    const order = Zone.getHitOrder
                    ? Zone.getHitOrder(node.data, count) : null;

    const tryIndex = i => {
      T.index = i;
      ctxMix.hitResult = null;
      Zone.hit_test(ctxMix, node, params);
      return ctxMix.hitResult != null;
    };

    if (order) {
      for (let j = 0; j < order.length; j++) if (tryIndex(order[j])) return;
    } else {
      for (let i = count - 1; i >= 0; i--)   if (tryIndex(i)) return;
    }
  }
}

//>> sceneRegistry.registerNodeClass('zoned', ZonedNode);
//-- endfile --

//<< import { ChromosomeZone } from './chromosome-zone.js';
//-- file: ./chromosome-zone.js --
//>> import { HIGHLIGHT } from './zoned-node.js';
//>> export { ChromosomeZone };
// ═══════════════════════════════════════════════════════════════
//  ZONE CLASS 1 — ChromosomeZone
//
//  node.data:  { bands[], length, cenStart, cenEnd }
//  T.index:    band index → lookup in node.data.bands
// ═══════════════════════════════════════════════════════════════
// #mol/chromosome/code

const STAIN_COLORS = {
  gneg:    '#E8E0D0', gpos25: '#B0A890', gpos50: '#808068',
  gpos75:  '#505040', gpos100:'#282820', acen:   '#B84430',
  gvar:    '#A0A090', stalk:  '#707060',
};

function chromosomePath(ctx, cx, topY, botY, cenY, armW, cenW, capR) {
  ctx.beginPath();
  ctx.moveTo(cx - armW, topY + capR);
  ctx.quadraticCurveTo(cx - armW, topY, cx, topY);
  ctx.quadraticCurveTo(cx + armW, topY, cx + armW, topY + capR);
  ctx.lineTo(cx + armW, cenY - 8);
  ctx.quadraticCurveTo(cx + cenW, cenY, cx + armW, cenY + 8);
  ctx.lineTo(cx + armW, botY - capR);
  ctx.quadraticCurveTo(cx + armW, botY, cx, botY);
  ctx.quadraticCurveTo(cx - armW, botY, cx - armW, botY - capR);
  ctx.lineTo(cx - armW, cenY + 8);
  ctx.quadraticCurveTo(cx - cenW, cenY, cx - armW, cenY - 8);
  ctx.lineTo(cx - armW, topY + capR);
  ctx.closePath();
}

function chrLayout(ctxMix, node) {
  const data   = node.data;
  const margin = 30;
  const chrH   = ctxMix.H - margin * 2;
  const cx     = ctxMix.W / 2;
  const topY   = margin;
  const botY   = margin + chrH;
  const scale  = chrH / data.length;
  const cenY   = topY + ((data.cenStart + data.cenEnd) / 2) * scale;
  const armW   = Math.min(28, ctxMix.W * 0.14);
  const cenW   = armW * 0.35;
  const capR   = armW * 0.7;
  return { cx, topY, botY, chrH, scale, cenY, armW, cenW, capR };
}

class ChromosomeZone {

  static getCount(data) { return data.bands.length; }

  static drawBackground(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const lo  = chrLayout(ctxMix, node);
    node._layout = lo;

    ctx.save();
    chromosomePath(ctx, lo.cx, lo.topY, lo.botY, lo.cenY,
                   lo.armW, lo.cenW, lo.capR);
    ctx.clip();
  }

  static draw2d(ctxMix, node, params) {
    const ctx  = ctxMix.ctx;
    const T    = ctxMix.T;
    const lo   = node._layout;
    if (!lo) return;

    const band = node.data.bands[T.index];
    const y1   = lo.topY + band.start / node.data.length * lo.chrH;
    const y2   = lo.topY + band.end   / node.data.length * lo.chrH;

    if (T.isSelected)       ctx.fillStyle = T.isHovered ? '#E8B840' : HIGHLIGHT;
    else if (T.isHovered)   ctx.fillStyle = '#504838';
    else                    ctx.fillStyle = STAIN_COLORS[band.stain] || '#E8E0D0';

    ctx.fillRect(lo.cx - 60, y1, 120, Math.max(y2 - y1, 0.5));
  }

  static drawOverlay(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const lo  = node._layout;
    if (!lo) { ctx.restore(); return; }

    ctx.restore();

    ctx.strokeStyle = '#504838';
    ctx.lineWidth   = 1;
    chromosomePath(ctx, lo.cx, lo.topY, lo.botY, lo.cenY,
                   lo.armW, lo.cenW, lo.capR);
    ctx.stroke();

    ctx.fillStyle = '#B84430';
    ctx.beginPath();
    ctx.arc(lo.cx, lo.cenY, lo.armW * 0.28, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle    = '#908878';
    ctx.font         = '600 12px monospace';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('chr1', lo.cx, lo.botY + 8);
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    const T  = ctxMix.T;
    const lo = node._layout;
    if (!pt || !lo) return;

    const band = node.data.bands[T.index];
    if (band.stain === 'acen') return;

    const y1 = lo.topY + band.start / node.data.length * lo.chrH;
    const y2 = lo.topY + band.end   / node.data.length * lo.chrH;
    if (pt.y < y1 || pt.y > y2) return;
    if (Math.abs(pt.x - lo.cx) > lo.armW + 2) return;

    ctxMix.hitResult = { node, zoneIndex: T.index };
  }

  static getZoneInfo(ctxMix, node, params) {
    const band = node.data.bands[ctxMix.T.index];
    return {
      name:   band.label,
      detail: (band.start / 1e6).toFixed(1) + '–' + (band.end / 1e6).toFixed(1) + ' Mb',
      extra:  band.stain + ' · ' + ((band.end - band.start) / 1e6).toFixed(2) + ' Mb',
    };
  }
}

//>> sceneRegistry.registerNodeClass('chromosome-zone', ChromosomeZone);
//-- endfile --

//<< import { PianoKeyZone } from './piano-zone.js';
//-- file: ./piano-zone.js --
//>> import { HIGHLIGHT, rrPath } from './zoned-node.js';
//>> export { PianoKeyZone };
// ═══════════════════════════════════════════════════════════════
//  ZONE CLASS 2 — PianoKeyZone
//
//  node.data:  { startMidi, count }
//  T.index:    semitone offset → computed black/white, position
//  Two passes: 0 = white keys, 1 = black keys on top
// ═══════════════════════════════════════════════════════════════

const BLACK_SET  = new Set([1, 3, 6, 8, 10]);
const NOTE_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

function keyLayout(ctxMix, node, idx) {
  const data  = node.data;
  const midi  = data.startMidi + idx;
  const black = BLACK_SET.has(midi % 12);

  let totalWhites = 0;
  for (let i = 0; i < data.count; i++)
    if (!BLACK_SET.has((data.startMidi + i) % 12)) totalWhites++;

  const margin = 20;
  const kbW    = ctxMix.W - margin * 2;
  const kbH    = ctxMix.H - margin * 2;
  const wW     = kbW / totalWhites;
  const bW     = wW * 0.58;
  const bH     = kbH * 0.6;
  const topY   = margin;
  const leftX  = margin;

  let whitesBefore = 0;
  for (let i = 0; i < idx; i++)
    if (!BLACK_SET.has((data.startMidi + i) % 12)) whitesBefore++;

  if (!black) return { black, midi, x: leftX + whitesBefore * wW,
                       y: topY, w: wW, h: kbH };
  return { black, midi, x: leftX + whitesBefore * wW - bW / 2,
           y: topY, w: bW, h: bH };
}

class PianoKeyZone {

  static getCount(data) { return data.count; }
  static getPasses()     { return 2; }

  static getHitOrder(data, count) {
    const blacks = [], whites = [];
    for (let i = 0; i < count; i++) {
      if (BLACK_SET.has((data.startMidi + i) % 12)) blacks.push(i);
      else whites.push(i);
    }
    return blacks.concat(whites);
  }

  static drawBackground(ctxMix, node, params) { /* keyboard has no background */ }

  static draw2d(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const T   = ctxMix.T;
    const lay = keyLayout(ctxMix, node, T.index);

    if (T.pass === 0 && lay.black)  return;
    if (T.pass === 1 && !lay.black) return;

    if (lay.black) {
      let fill = '#1a1a18';
      if (T.isSelected)      fill = HIGHLIGHT;
      else if (T.isHovered)  fill = '#3a3830';
      ctx.fillStyle = fill;
      rrPath(ctx, lay.x, lay.y, lay.w, lay.h, 0, 0, 3, 3);
      ctx.fill();
      ctx.fillStyle = T.isSelected ? '#E8B840' : '#2a2a28';
      ctx.fillRect(lay.x + 1, lay.y, lay.w - 2, lay.h * 0.04);
    } else {
      let fill = '#F0EDE4';
      if (T.isSelected)      fill = HIGHLIGHT;
      else if (T.isHovered)  fill = '#D8D0C0';
      ctx.fillStyle = fill;
      rrPath(ctx, lay.x + 0.5, lay.y, lay.w - 1, lay.h, 0, 0, 3, 3);
      ctx.fill();
      ctx.strokeStyle = '#B0A890';
      ctx.lineWidth   = 0.5;
      rrPath(ctx, lay.x + 0.5, lay.y, lay.w - 1, lay.h, 0, 0, 3, 3);
      ctx.stroke();

      if (NOTE_NAMES[lay.midi % 12] === 'C') {
        const oct = Math.floor(lay.midi / 12) - 1;
        ctx.fillStyle    = '#908878';
        ctx.font         = '500 10px monospace';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('C' + oct, lay.x + lay.w / 2, lay.y + lay.h - 6);
      }
    }
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    const T  = ctxMix.T;
    if (!pt) return;
    const lay = keyLayout(ctxMix, node, T.index);
    if (pt.x >= lay.x && pt.x <= lay.x + lay.w &&
        pt.y >= lay.y && pt.y <= lay.y + lay.h) {
      ctxMix.hitResult = { node, zoneIndex: T.index };
    }
  }

  static getZoneInfo(ctxMix, node, params) {
    const lay  = keyLayout(ctxMix, node, ctxMix.T.index);
    const name = NOTE_NAMES[lay.midi % 12];
    const oct  = Math.floor(lay.midi / 12) - 1;
    return {
      name:   name + oct,
      detail: 'MIDI ' + lay.midi,
      extra:  lay.black ? 'black key' : 'white key',
    };
  }
}

//>> sceneRegistry.registerNodeClass('piano-zone', PianoKeyZone);
//-- endfile --

//<< import { BGAZone } from './bga-zone.js';
//-- file: ./bga-zone.js --
//>> import { HIGHLIGHT } from './zoned-node.js';
//>> export { BGAZone };
// ═══════════════════════════════════════════════════════════════
//  ZONE CLASS 3 — BGAZone (Ball Grid Array)
//
//  node.data:  { rows, cols, pins[] }
//  T.index:    row * cols + col → lookup pin type
// ═══════════════════════════════════════════════════════════════

const ROW_LETTERS = 'ABCDEFGHJKLMNPRTUVWY';
const BGA_COLORS  = {
  power: '#c0392b', ground: '#2c3e50',
  signal: '#27ae60', nc: '#3a3828',
};

function pinLayout(ctxMix, node, idx) {
  const data    = node.data;
  const cols    = data.cols;
  const row     = Math.floor(idx / cols);
  const col     = idx % cols;
  const margin  = 30;
  const spacing = Math.min((ctxMix.W - margin * 2) / cols,
                           (ctxMix.H - margin * 2) / data.rows);
  const gridW   = spacing * cols;
  const gridH   = spacing * data.rows;
  const ox      = (ctxMix.W - gridW) / 2 + spacing / 2;
  const oy      = (ctxMix.H - gridH) / 2 + spacing / 2;
  return {
    cx: ox + col * spacing, cy: oy + row * spacing,
    r: spacing * 0.32, row, col,
    pin:  data.pins[idx],
    name: (ROW_LETTERS[row] || '?') + (col + 1),
    spacing, gridW, gridH,
    ox: ox - spacing / 2, oy: oy - spacing / 2,
  };
}

class BGAZone {

  static getCount(data) { return data.rows * data.cols; }

  static drawBackground(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const lo  = pinLayout(ctxMix, node, 0);
    const pad = lo.spacing * 0.45;

    ctx.fillStyle   = '#1a1918';
    ctx.strokeStyle = '#333028';
    ctx.lineWidth   = 1;
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(lo.ox - pad, lo.oy - pad,
                    lo.gridW + pad * 2, lo.gridH + pad * 2, 6);
      ctx.fill(); ctx.stroke();
    } else {
      ctx.fillRect(  lo.ox - pad, lo.oy - pad, lo.gridW + pad * 2, lo.gridH + pad * 2);
      ctx.strokeRect(lo.ox - pad, lo.oy - pad, lo.gridW + pad * 2, lo.gridH + pad * 2);
    }
    ctx.fillStyle = '#5a5448';
    ctx.beginPath();
    ctx.arc(lo.ox - pad / 2, lo.oy - pad / 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  static draw2d(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const T   = ctxMix.T;
    const lo  = pinLayout(ctxMix, node, T.index);
    if (!lo.pin) return;

    let fill = BGA_COLORS[lo.pin.type] || '#555';
    if (T.isSelected)      fill = HIGHLIGHT;
    else if (T.isHovered)  fill = '#B0A070';

    ctx.beginPath();
    ctx.arc(lo.cx, lo.cy, lo.r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();

    if (!T.isSelected) {
      const g = ctx.createRadialGradient(
        lo.cx - lo.r * 0.3, lo.cy - lo.r * 0.3, 0,
        lo.cx, lo.cy, lo.r);
      g.addColorStop(0, 'rgba(255,255,255,0.18)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fill();
    }
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    const T  = ctxMix.T;
    if (!pt) return;
    const lo = pinLayout(ctxMix, node, T.index);
    if (!lo.pin) return;
    const dx = pt.x - lo.cx, dy = pt.y - lo.cy;
    if (dx * dx + dy * dy <= lo.r * lo.r) {
      ctxMix.hitResult = { node, zoneIndex: T.index };
    }
  }

  static getZoneInfo(ctxMix, node, params) {
    const lo = pinLayout(ctxMix, node, ctxMix.T.index);
    if (!lo.pin) return { name: lo.name, detail: 'no connect' };
    return {
      name:   lo.name,
      detail: lo.pin.net || lo.pin.type,
      extra:  lo.pin.type,
    };
  }
}

//>> sceneRegistry.registerNodeClass('bga-zone', BGAZone);
//-- endfile --

//<< import { TreeRingZone } from './tree-ring-zone.js';
//-- file: ./tree-ring-zone.js --
//>> import { HIGHLIGHT } from './zoned-node.js';
//>> export { TreeRingZone };
// ═══════════════════════════════════════════════════════════════
//  ZONE CLASS 4 — TreeRingZone
//
//  node.data:  { rings[{ innerR, outerR, width, year, lightness }], totalR }
//  T.index:    ring number, 0 = innermost (oldest)
// ═══════════════════════════════════════════════════════════════

function ringLayout(ctxMix, node, idx) {
  const data  = node.data;
  const ring  = data.rings[idx];
  const cx    = ctxMix.W / 2;
  const cy    = ctxMix.H / 2;
  const maxR  = Math.min(ctxMix.W, ctxMix.H) / 2 - 16;
  const scale = maxR / data.totalR;
  return { cx, cy, innerR: ring.innerR * scale,
           outerR: ring.outerR * scale, ring, maxR, scale };
}

class TreeRingZone {

  static getCount(data) { return data.rings.length; }

  static getHitOrder(data, count) {
    const order = [];
    for (let i = count - 1; i >= 0; i--) order.push(i);
    return order;
  }

  static drawBackground(ctxMix, node, params) {
    const ctx  = ctxMix.ctx;
    const cx   = ctxMix.W / 2, cy = ctxMix.H / 2;
    const maxR = Math.min(ctxMix.W, ctxMix.H) / 2 - 16;
    ctx.fillStyle = '#3a2818';
    ctx.beginPath();
    ctx.arc(cx, cy, maxR + 4, 0, Math.PI * 2);
    ctx.fill();
  }

  static draw2d(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const T   = ctxMix.T;
    const lo  = ringLayout(ctxMix, node, T.index);
    const L   = lo.ring.lightness || 0.5;

    let earlyCol, lateCol;
    if (T.isSelected) {
      earlyCol = '#E8B840'; lateCol = '#B08020';
    } else if (T.isHovered) {
      earlyCol = '#907850'; lateCol = '#685838';
    } else {
      earlyCol = `rgb(${140 + L * 80 | 0},${110 + L * 65 | 0},${60 + L * 40 | 0})`;
      lateCol  = `rgb(${90  + L * 50 | 0},${65  + L * 35 | 0},${30 + L * 25 | 0})`;
    }

    ctx.beginPath();
    ctx.arc(lo.cx, lo.cy, lo.outerR, 0, Math.PI * 2);
    ctx.arc(lo.cx, lo.cy, lo.innerR, 0, Math.PI * 2, true);
    ctx.closePath();

    if (lo.outerR - lo.innerR > 1) {
      const g = ctx.createRadialGradient(lo.cx, lo.cy, lo.innerR,
                                         lo.cx, lo.cy, lo.outerR);
      g.addColorStop(0, earlyCol);
      g.addColorStop(1, lateCol);
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = lateCol;
    }
    ctx.fill();
  }

  static drawOverlay(ctxMix, node, params) {
    const ctx   = ctxMix.ctx;
    const cx    = ctxMix.W / 2, cy = ctxMix.H / 2;
    const maxR  = Math.min(ctxMix.W, ctxMix.H) / 2 - 16;
    const pithR = (node.data.rings[0]?.innerR || 3) * maxR / node.data.totalR;
    ctx.fillStyle = '#6a4828';
    ctx.beginPath();
    ctx.arc(cx, cy, pithR, 0, Math.PI * 2);
    ctx.fill();
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    const T  = ctxMix.T;
    if (!pt) return;
    const lo   = ringLayout(ctxMix, node, T.index);
    const dx   = pt.x - lo.cx, dy = pt.y - lo.cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist >= lo.innerR && dist <= lo.outerR) {
      ctxMix.hitResult = { node, zoneIndex: T.index };
    }
  }

  static getZoneInfo(ctxMix, node, params) {
    const ring = node.data.rings[ctxMix.T.index];
    return {
      name:   'Year ' + ring.year,
      detail: 'Ring ' + (ctxMix.T.index + 1) + ' · ' + ring.width.toFixed(1) + ' mm',
      extra:  ring.note || '',
    };
  }
}

function pianoData(startMidi, count) { return { startMidi, count }; }

function bgaData(rows, cols) {
  const pins = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cr = Math.max(Math.abs(r), Math.abs(r - rows + 1));
      const cc = Math.max(Math.abs(c), Math.abs(c - cols + 1));
      if (cr + cc <= 1) { pins.push(null); continue; }
      if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1)
        pins.push({ type: (r + c) % 2 === 0 ? 'power' : 'ground',
                    net:  (r + c) % 2 === 0 ? 'VCC'   : 'GND' });
      else if (r === 1 || r === rows - 2 || c === 1 || c === cols - 2)
        pins.push({ type: 'ground', net: 'GND' });
      else
        pins.push({ type: 'signal', net: 'IO_' + (r * cols + c) });
    }
  }
  return { rows, cols, pins };
}

function treeRingData(count) {
  const rings = [];
  let r = 5;
  for (let i = 0; i < count; i++) {
    const base  = 2.5 + Math.sin(i * 0.7) * 1.2 + Math.cos(i * 1.3) * 0.8;
    const width = Math.max(0.8, base + (((i * 137) % 17) / 17 - 0.5) * 2);
    const lightness = 0.3 + (((i * 53) % 23) / 23) * 0.5;
    const year = 2026 - count + i;
    let note = '';
    if (width < 1.5) note = 'drought year';
    else if (width > 4)  note = 'strong growth';
    rings.push({ innerR: r, outerR: r + width, width, year, lightness, note });
    r += width;
  }
  return { rings, totalR: r };
}


// ═══════════════════════════════════════════════════════════════
//  DEMO HARNESS
//
//  Lightweight stand-in for the scene graph.  Builds ctxMix and
//  node shims, handles canvas sizing and mouse events, then
//  calls ZonedNode.draw2d / ZonedNode.hit_test with the exact
//  signatures the real scene will use.
//
//  In the real scene graph, replace this with:
//    ctxMix.ctx       → ctxMix.directCtx()   (balanced by restore)
//    ctxMix.T         → the scene's transform (already has .sx, .toScreen…)
//    ctxMix.W / .H    → already on ctxMix
//    ctxMix.hitPoint  → already on ctxMix
//    ctxMix.hitResult → already on ctxMix
//    node.data        → populated from scene data
//    node.value       → instance state on the scene node
// ═══════════════════════════════════════════════════════════════

const ttEl = document.getElementById('tooltip');
function showTooltip(ex, ey, info) {
  ttEl.querySelector('.tt-name').textContent   = info.name   || '';
  ttEl.querySelector('.tt-detail').textContent = info.detail || '';
  ttEl.querySelector('.tt-extra').textContent  = info.extra  || '';
  ttEl.querySelector('.tt-name').style.color =
    info.selected ? '#daa02e' : '#e4dac6';
  ttEl.style.display = 'block';
  ttEl.style.left = (ex + 14) + 'px';
  ttEl.style.top  = (ey - 10) + 'px';
}
function hideTooltip() { ttEl.style.display = 'none'; }


class DemoHarness {
  constructor(canvas, zoneClass, data) {
    this.canvas = canvas;
    this.rawCtx = canvas.getContext('2d');

    // ── node shim ──
    this.node = {
      data:    data,
      value:   { zoneClass, hovered: -1, selected: new Set() },
      _layout: null,
    };
    this.params = {};

    this._resize();
    this._listen();
    this.draw();
    new ResizeObserver(() => { this._resize(); this.draw(); }).observe(canvas);
  }

  _resize() {
    const dpr  = window.devicePixelRatio || 1;
    const rect = this.canvas.getBoundingClientRect();
    this.W = rect.width;
    this.H = rect.height;
    this.canvas.width  = rect.width  * dpr;
    this.canvas.height = rect.height * dpr;
    this.rawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ── ctxMix shim ──
  _ctxMix(hitPoint) {
    return {
      ctx:       this.rawCtx,
      T:         { index: 0, pass: 0, isHovered: false, isSelected: false },
      W:         this.W,
      H:         this.H,
      hitPoint:  hitPoint || null,
      hitResult: null,
    };
  }

  draw() {
    this.rawCtx.clearRect(0, 0, this.W, this.H);
    ZonedNode.draw2d(this._ctxMix(), this.node, this.params);
  }

  hitTest(mx, my) {
    const mix = this._ctxMix({ x: mx, y: my });
    ZonedNode.hit_test(mix, this.node, this.params);
    return mix.hitResult;
  }

  _listen() {
    const toLocal = e => {
      const r = this.canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top,
               ex: e.clientX, ey: e.clientY };
    };

    this.canvas.addEventListener('mousemove', e => {
      const { x, y, ex, ey } = toLocal(e);
      const hit = this.hitTest(x, y);
      const idx = hit ? hit.zoneIndex : -1;
      if (idx !== this.node.value.hovered) {
        this.node.value.hovered = idx;
        this.draw();
      }
      this.canvas.style.cursor = idx >= 0 ? 'pointer' : 'default';
      if (idx >= 0) {
        const Zone = this.node.value.zoneClass;
        const mix  = this._ctxMix();
        mix.T.index = idx;
        const info = Zone.getZoneInfo(mix, this.node, this.params);
        info.selected = this.node.value.selected.has(idx);
        showTooltip(ex, ey, info);
      } else hideTooltip();
    });

    this.canvas.addEventListener('mouseleave', () => {
      if (this.node.value.hovered >= 0) {
        this.node.value.hovered = -1; this.draw();
      }
      hideTooltip();
    });

    this.canvas.addEventListener('click', e => {
      const { x, y } = toLocal(e);
      const hit = this.hitTest(x, y);
      if (hit) {
        const sel = this.node.value.selected;
        if (sel.has(hit.zoneIndex)) sel.delete(hit.zoneIndex);
        else sel.add(hit.zoneIndex);
        this.draw();
      }
    });
  }
}
