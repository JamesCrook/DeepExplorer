<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathway Editor Harness</title>
<style>
  :root {
    --bg: #0e1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --text-muted: #8b949e; --accent: #58a6ff;
    --accent-dim: #1f3a5f; --green: #3fb950; --green-dim: #1a3a2a;
    --orange: #d29922; --red: #f85149; --purple: #bc8cff;
    --mono: 'SF Mono','Cascadia Code','Fira Code',Consolas,monospace;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--sans); background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
  .page { display:flex; height:100vh; }
  .info-panel { width:280px; min-width:220px; border-right:1px solid var(--border); overflow-y:auto; padding:20px; background:var(--surface); flex-shrink:0; }
  .info-panel h1 { font-size:16px; font-weight:600; color:var(--accent); font-family:var(--mono); margin-bottom:4px; }
  .info-panel .subtitle { font-size:12px; color:var(--text-muted); margin-bottom:20px; }
  .info-section { margin-bottom:16px; }
  .info-section summary { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--green); cursor:pointer; padding:6px 0; border-bottom:1px solid var(--border); list-style:none; }
  .info-section summary::before { content:'▸ '; color:var(--text-muted); }
  .info-section[open] summary::before { content:'▾ '; }
  .info-item { font-family:var(--mono); font-size:11px; padding:4px 0 4px 12px; color:var(--text-muted); border-left:1px solid var(--border); margin-left:4px; }
  .info-item .name { color:var(--text); }
  .info-item .ret { color:var(--purple); }
  .info-prose { font-size:12px; color:var(--text-muted); padding:8px 0 4px 12px; border-left:1px solid var(--border); margin-left:4px; line-height:1.6; }
  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .toolbar { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap; flex-shrink:0; }
  .toolbar .group { display:flex; gap:4px; align-items:center; }
  .toolbar .sep { width:1px; height:24px; background:var(--border); margin:0 4px; }
  button { font-family:var(--mono); font-size:11px; padding:5px 10px; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--text); cursor:pointer; transition:background .15s,border-color .15s; }
  button:hover { border-color:var(--accent); background:var(--accent-dim); }
  button.active { border-color:var(--accent); background:var(--accent-dim); color:var(--accent); }
  button.green:hover { border-color:var(--green); background:var(--green-dim); }
  button.danger:hover { border-color:var(--red); background:#3d1a1a; }
  .mode-indicator { font-family:var(--mono); font-size:11px; color:var(--text-muted); margin-left:auto; }
  .mode-indicator .mode-name { color:var(--orange); }
  .canvas-wrap { flex:1; position:relative; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .console-panel { height:120px; min-height:50px; border-top:1px solid var(--border); background:var(--surface); overflow-y:auto; padding:10px 16px; font-family:var(--mono); font-size:11px; color:var(--text-muted); line-height:1.7; flex-shrink:0; }
  .console-panel .log-entry { padding:1px 0; }
  .console-panel .log-entry.info { color:var(--accent); }
  .console-panel .log-entry.success { color:var(--green); }
  .console-panel .log-entry.warn { color:var(--orange); }
  .console-panel .log-entry.error { color:var(--red); }
</style>
</head>
<body>
<div class="page">
  <div id="info-panel" class="info-panel"></div>
  <div class="main">
    <div class="toolbar" id="toolbar"></div>
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div id="console-panel" class="console-panel"></div>
  </div>
</div>
<script>

// ═══════════════════════════════════════════════════════════════
//  SHIMS
// ═══════════════════════════════════════════════════════════════

//-- file: ./shim-transform.js --
class Transform {
  constructor(sx=1,panX=0,panY=0) { this.sx=sx; this.panX=panX; this.panY=panY; }
  toScreen({x,y}) { return {x:x*this.sx+this.panX, y:y*this.sx+this.panY}; }
  toLocal({x,y})  { return {x:(x-this.panX)/this.sx, y:(y-this.panY)/this.sx}; }
  clone() { return new Transform(this.sx,this.panX,this.panY); }
}
//-- endfile --

//-- file: ./shim-vector2d.js --
class Vector2D {
  constructor(x,y) { this.x=x; this.y=y; }
  sub(v)  { return new Vector2D(this.x-v.x, this.y-v.y); }
  add(v)  { return new Vector2D(this.x+v.x, this.y+v.y); }
  perp()  { return new Vector2D(-this.y, this.x); }
  rot(a)  { const c=Math.cos(a),s=Math.sin(a); return new Vector2D(this.x*c-this.y*s, this.x*s+this.y*c); }
  normalize(len) { const m=Math.sqrt(this.x*this.x+this.y*this.y)||1; return new Vector2D(this.x/m*len, this.y/m*len); }
}
//-- endfile --

//-- file: ./shim-warped-polygon-curve.js --
/**
 * Enhanced WarpedPolygon shim — supports curved edges.
 * bend is a signed angle in radians: 0 = straight, π = half-circle arc.
 * Edges with |bend| > 3 (caps at ±π) are drawn straight.
 * Uses quadratic bezier approximation for curves.
 */
class WarpedPolygon {
  static path(corners, bends) {
    if (!corners || corners.length < 2) return '';
    let d = `M ${corners[0].x} ${corners[0].y}`;
    for (let i = 0; i < corners.length; i++) {
      const next = corners[(i + 1) % corners.length];
      const b = bends ? (bends[i] || 0) : 0;
      if (Math.abs(b) > 3 || Math.abs(b) < 0.001) {
        d += ` L ${next.x} ${next.y}`;
      } else {
        const curr = corners[i];
        const mx = (curr.x + next.x) / 2;
        const my = (curr.y + next.y) / 2;
        const ex = next.x - curr.x;
        const ey = next.y - curr.y;
        const len = Math.sqrt(ex * ex + ey * ey) || 1;
        const bulge = len * Math.tan(b / 2) / 2;
        const cx = mx + (-ey / len) * bulge;
        const cy = my + (ex / len) * bulge;
        d += ` Q ${cx} ${cy} ${next.x} ${next.y}`;
      }
    }
    return d + ' Z';
  }
}
//-- endfile --


// ═══════════════════════════════════════════════════════════════
//  NUGGETS
// ═══════════════════════════════════════════════════════════════

//<< import { ButtonNode, DEFAULTS, hexToRgb, shiftColor, roundRectPath } from '../nodes2d/button-node.js';
//-- file: ../nodes2d/button-node.js --
//>> import { sceneRegistry } from '../omni-support/scene.js';
//>> export { ButtonNode, DEFAULTS };
// ── helpers ─────────────────────────────────────────────────

function hexToRgb(hex) {
  hex = (hex || '#888888').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  if (hex.length === 8) hex = hex.slice(0, 6);
  const n = parseInt(hex, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function shiftColor({ r, g, b }, amt) {
  const f = v => Math.round(Math.min(255, Math.max(0,
    amt > 0 ? v + (255 - v) * amt : v + v * amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  } else {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
}

const DEFAULTS = Object.freeze({
  fill:           '#e0ddd4',
  color:          '#2a2a2a',
  cornerRadius:   12,
  borderWidth:    2.5,
  bevel:          1,
  bevelStrength:  0.38,
  lightAngle:     315,
  lightIntensity: 0.55,
  shadowColor:    'rgba(0,0,0,0.28)',
  shadowOffsetX:  2,
  shadowOffsetY:  3,
  shadowBlur:     6,
  fontSize:       32,
  subOffset:      0,
  badgeFill:      '#e74c3c',
  badgeColor:     '#ffffff',
  scale:          1.0,
  liftY:          0.0,
  brightness:     1.0,
  hoverScale:     1.08,
  hoverLift:      -2,
  pressScale:     0.96,
  pressDepth:     1,
});


class ButtonNode {

  static draw2d(ctxMix, node, params) {
    const T = ctxMix.T;
    if (!T) return;

    const v = node.value || {};
    const p = { ...DEFAULTS, ...params };
    const zoom = T.sx;

    const rawW   = v.width  || 64;
    const rawH   = v.height || 64;
    const sc     = (p.scale || 1);
    const w      = rawW * zoom * sc;
    const h      = rawH * zoom * sc;
    const screen = T.toScreen({ x: v.x || 0, y: v.y || 0 });
    const cx     = screen.x;
    const cy     = screen.y + (p.liftY || 0) * zoom;
    const left   = cx - w / 2;
    const top    = cy - h / 2;
    const r      = (p.cornerRadius || 0) * zoom * sc;
    const bw     = (p.borderWidth  || 0) * zoom * sc;

    const fillHex = v.color || p.fill;

    const ctx = ctxMix.directCtx();

    if (v.disabled) ctx.globalAlpha *= 0.42;

    if (p.shadowBlur > 0) {
      ctx.save();
      ctx.shadowColor   = p.shadowColor;
      ctx.shadowOffsetX = (p.shadowOffsetX || 0) * zoom;
      ctx.shadowOffsetY = (p.shadowOffsetY || 0) * zoom;
      ctx.shadowBlur    = (p.shadowBlur    || 0) * zoom;
      roundRectPath(ctx, left, top, w, h, r);
      ctx.fillStyle = fillHex;
      ctx.fill();
      ctx.restore();
    }

    const base    = hexToRgb(fillHex);
    const bevel   = p.bevel || 0;
    const bStr    = p.bevelStrength || 0;
    const lInt    = p.lightIntensity || 0;
    const angle   = p.lightAngle || 315;
    const rad     = angle * Math.PI / 180;
    const dx      = Math.sin(rad);
    const dy      = -Math.cos(rad);

    const faceLit = shiftColor(base,  lInt * 0.14 * bevel);
    const faceSh  = shiftColor(base, -lInt * 0.10 * bevel);

    const gx0 = cx + dx * w / 2;
    const gy0 = cy + dy * h / 2;
    const gx1 = cx - dx * w / 2;
    const gy1 = cy - dy * h / 2;

    const faceGrad = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
    faceGrad.addColorStop(0, faceLit);
    faceGrad.addColorStop(1, faceSh);

    roundRectPath(ctx, left, top, w, h, r);
    ctx.fillStyle = faceGrad;
    ctx.fill();

    if (bevel !== 0 && bStr > 0) {
      const litAmt = bStr * lInt * bevel;
      const hi     = shiftColor(base,  litAmt);
      const lo     = shiftColor(base, -litAmt);
      const edgeW  = bw * 1.4;

      ctx.save();
      roundRectPath(ctx, left, top, w, h, r);
      ctx.clip();

      ctx.strokeStyle = hi;
      ctx.lineWidth   = edgeW;
      roundRectPath(ctx, left + dx * bw * 0.5,
                         top  + dy * bw * 0.5, w, h, r);
      ctx.stroke();

      ctx.strokeStyle = lo;
      ctx.lineWidth   = edgeW;
      roundRectPath(ctx, left - dx * bw * 0.5,
                         top  - dy * bw * 0.5, w, h, r);
      ctx.stroke();

      ctx.restore();
    }

    if ((p.brightness || 1) < 1.0) {
      roundRectPath(ctx, left, top, w, h, r);
      ctx.fillStyle = `rgba(0,0,0,${(1 - p.brightness).toFixed(3)})`;
      ctx.fill();
    }

    const label = v.label ?? v.emoji ?? v.symbol
               ?? v.name?.substring(0, 2) ?? '';

    if (label) {
      const fSize = (p.fontSize || 32) * zoom * sc;
      ctx.fillStyle    = p.color;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.font         = `600 ${fSize.toFixed(1)}px "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif`;

      const labelY = v.sub ? cy - h * 0.06 : cy;
      ctx.fillText(label, cx, labelY);
    }

    if (v.sub) {
      const subSize = (p.fontSize || 32) * 0.36 * zoom * sc;
      ctx.fillStyle    = p.color;
      ctx.globalAlpha  = (v.disabled ? 0.42 : 1.0) * 0.65;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.font         = `400 ${subSize.toFixed(1)}px "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif`;

      const subY = cy + h * 0.22 + (p.subOffset || 0) * zoom;
      ctx.fillText(v.sub, cx, subY);
    }

    if (v.badge != null && v.badge !== '') {
      const badgeR = 10 * zoom;
      const badgeX = left + w - badgeR * 0.4;
      const badgeY = top  - badgeR * 0.4;

      ctx.globalAlpha = v.disabled ? 0.42 : 1.0;
      ctx.beginPath();
      ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
      ctx.fillStyle = p.badgeFill || '#e74c3c';
      ctx.fill();

      ctx.fillStyle    = p.badgeColor || '#fff';
      ctx.font         = `700 ${(11 * zoom).toFixed(1)}px system-ui, sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(v.badge), badgeX, badgeY + 0.5);
    }

    if (ctxMix.highlighted?.has(node)) {
      ctx.setLineDash([4 * zoom, 4 * zoom]);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth   = 2 * zoom;
      roundRectPath(ctx, left - 4 * zoom, top - 4 * zoom,
                    w + 8 * zoom, h + 8 * zoom,
                    r + 4 * zoom);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    const T  = ctxMix.T;
    if (!pt || !T) return;

    const v = node.value || {};
    if (v.disabled) return;

    const p    = { ...DEFAULTS, ...params };
    const zoom = T.sx;

    const sc   = p.scale || 1;
    const rawW = v.width  || 64;
    const rawH = v.height || 64;
    const w    = rawW * zoom * sc;
    const h    = rawH * zoom * sc;
    const r    = Math.min((p.cornerRadius || 0) * zoom * sc, w / 2, h / 2);

    const screen = T.toScreen({ x: v.x || 0, y: v.y || 0 });
    const sx   = screen.x;
    const sy   = screen.y + (p.liftY || 0) * zoom;
    const left = sx - w / 2;
    const top  = sy - h / 2;

    if (pt.x < left || pt.x > left + w ||
        pt.y < top  || pt.y > top  + h) return;

    const lx = pt.x - left;
    const ly = pt.y - top;
    if (lx < r && ly < r && (lx - r) ** 2 + (ly - r) ** 2 > r * r) return;
    if (lx > w - r && ly < r && (lx - (w - r)) ** 2 + (ly - r) ** 2 > r * r) return;
    if (lx < r && ly > h - r && (lx - r) ** 2 + (ly - (h - r)) ** 2 > r * r) return;
    if (lx > w - r && ly > h - r && (lx - (w - r)) ** 2 + (ly - (h - r)) ** 2 > r * r) return;

    const dxHit = pt.x - sx;
    const dyHit = pt.y - sy;
    const Ts = T.clone();

    ctxMix.hitResult = {
      node,
      interactions: {
        applyDrag(screenX, screenY) {
          const local = Ts.toLocal({ x: screenX - dxHit, y: screenY - dyHit });
          node.value.x = local.x;
          node.value.y = local.y;
        },
      },
    };
  }
}

//>> sceneRegistry.registerNodeClass('button-node', ButtonNode);
//-- endfile --

//<< import { EdgeRefNode } from '../nodes2d/edge-ref-node.js';
//-- file: ../nodes2d/edge-ref-node.js --
//>> import { sceneRegistry } from '../omni-support/scene.js';
//>> import { Vector2D } from '../2d-support/vector2d.js';
//>> import { WarpedPolygon } from '../nodes2d/warped-polygon.js';

/**
 * edge-ref-node.js — edge that references two drag-point nodes
 *
 * value.fromNode / value.toNode — live references to drag-point MiniAstNodes
 * value.from / value.to — stable uid strings (for display / serialisation)
 *
 * Place in: nodes2d/edge-ref-node.js
 */

class EdgeRefNode {

  static draw2d(ctxMix, node, params) {
    const T = ctxMix.T;
    if (!T) return;
    const v  = node.value || {};
    const fn = v.fromNode, tn = v.toNode;
    if (!fn || !tn) return;

    const zoom = T.sx;
    const s0 = T.toScreen({ x: fn.value?.x || 0, y: fn.value?.y || 0 });
    const s1 = T.toScreen({ x: tn.value?.x || 0, y: tn.value?.y || 0 });

    const selected = ctxMix.highlighted?.has(node);
    const width = ((params.pathWidth || 2) + (selected ? 2 : 0)) * zoom;
    const strokeWidth = (params.strokeWidth ?? 1) * zoom;
    const p0 = new Vector2D(s0.x, s0.y);
    const p1 = new Vector2D(s1.x, s1.y);
    const bend = params.bend ?? 0;
    const perp1 = p1.sub(p0).perp().rot(bend / 2).normalize(width);
    const perp2 = p1.sub(p0).perp().rot(-bend / 2).normalize(width);
    const corners = [p0.sub(perp1), p0.add(perp1), p1.add(perp2), p1.sub(perp2)];
    const bends = [-3.14, bend, -3.14, -bend];
    const pathD = WarpedPolygon.path(corners, bends);
    const path2D = new Path2D(pathD);

    const ctx = ctxMix.directCtx();

    ctx.globalAlpha = params.fillOpacity ?? 0.7;
    ctx.fillStyle   = params.pathColor || '#ffffffaa';
    ctx.fill(path2D);

    if (strokeWidth > 0) {
      ctx.globalAlpha = 1;
      ctx.lineWidth   = strokeWidth;
      ctx.lineCap     = 'round';
      ctx.strokeStyle = '#ffffff';
      ctx.stroke(path2D);
    }

    ctx.restore();
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    const T  = ctxMix.T;
    if (!pt || !T) return;
    const v  = node.value || {};
    const fn = v.fromNode, tn = v.toNode;
    if (!fn || !tn) return;

    const s0 = T.toScreen({ x: fn.value?.x || 0, y: fn.value?.y || 0 });
    const s1 = T.toScreen({ x: tn.value?.x || 0, y: tn.value?.y || 0 });

    // Point-to-segment distance in screen space
    const dx = s1.x - s0.x, dy = s1.y - s0.y;
    const lenSq = dx * dx + dy * dy;
    if (lenSq < 1) return;

    const t = Math.max(0, Math.min(1,
      ((pt.x - s0.x) * dx + (pt.y - s0.y) * dy) / lenSq));

    // Exclude zones near endpoints so node hit-test wins
    const len     = Math.sqrt(lenSq);
    const exclude = ((params.pointRadius || 6) + 5) / len;
    if (t < exclude || t > 1 - exclude) return;

    const px = s0.x + t * dx, py = s0.y + t * dy;
    const dist = Math.sqrt((pt.x - px) ** 2 + (pt.y - py) ** 2);

    const threshold = Math.max(params.pathWidth || 2, 4) + 5;
    if (dist > threshold) return;

    ctxMix.hitResult = { node, cursor: node };
  }
}

//>> sceneRegistry.registerNodeClass('edge-ref', EdgeRefNode);
//>> export { EdgeRefNode };
//-- endfile --


// ═══════════════════════════════════════════════════════════════
//  CORE — ConsolePanel, InfoPanel, NetworkEditor
// ═══════════════════════════════════════════════════════════════

class ConsolePanel {
  constructor(el) { this.el = typeof el === 'string' ? document.getElementById(el) : el; }
  log(msg, cls='') {
    const div = document.createElement('div');
    div.className = 'log-entry ' + cls; div.innerHTML = msg;
    this.el.appendChild(div); this.el.scrollTop = this.el.scrollHeight;
  }
  clear() { this.el.innerHTML = ''; }
}

class InfoPanel {
  constructor(el) { this.el = typeof el === 'string' ? document.getElementById(el) : el; }
  setContent(c) {
    let h = `<h1>${c.title}</h1><div class="subtitle">${c.subtitle}</div>`;
    for (const s of c.sections) h += this._renderSection(s);
    this.el.innerHTML = h;
  }
  addSection(s) { this.el.insertAdjacentHTML('beforeend', this._renderSection(s)); }
  _renderSection(s) {
    let h = `<details class="info-section"${s.open?' open':''}><summary>${s.name}</summary>`;
    if (s.items) for (const it of s.items)
      h += `<div class="info-item"><span class="name">${it.name}</span>${it.args||''} ${it.ret?'→ <span class="ret">'+it.ret+'</span>':''}</div>`;
    if (s.prose) h += `<div class="info-prose">${s.prose}</div>`;
    return h + '</details>';
  }
}

// ── NetworkEditor ───────────────────────────────────────────
//  Parameterised by NodeClass — works with DragPointNode,
//  ButtonNode, or any class with static draw2d / hit_test
//  matching the ctxMix signature.
// ────────────────────────────────────────────────────────────

class NetworkEditor {
  constructor({ canvasId, toolbarId, console,
                NodeClass, nodeType = 'drag-point',
                nodeParams = {}, edgeParams = {}, defaultNodeValue = {} }) {
    this.canvas  = document.getElementById(canvasId);
    this.ctx     = this.canvas.getContext('2d');
    this.toolbarEl = document.getElementById(toolbarId);
    this.console = console;

    this.NodeClass = NodeClass;
    this.nodeType  = nodeType;
    this.nodeParams = { ...nodeParams };
    this.edgeParams = { pathWidth:2, strokeWidth:0.8, pathColor:'#ffffff66',
                        fillOpacity:0.5, pointRadius:7, ...edgeParams };
    this.defaultNodeValue = defaultNodeValue;

    this.T = new Transform(1,0,0);
    this.highlighted = new Set();
    this.sceneNodes = [];
    this.sceneEdges = [];
    this._nodeMap   = new Map();
    this._nextId = 0;
    this.mode = 'pointer';
    this._edgeStart = null;
    this._dragResult = null;
    this.onExtraDraw = null;

    this._buildToolbar();
    this._bindEvents();
    this._resize();
  }

  addNode(localX, localY, overrides = {}) {
    const id = overrides.id || ('n' + this._nextId++);
    const value = { x:localX, y:localY, ...this.defaultNodeValue, ...overrides };
    delete value.id;
    if (!value.name && !value.label) value.name = id;
    const node = { type:this.nodeType, id, value };
    this.sceneNodes.push(node);
    this._nodeMap.set(id, node);
    return node;
  }

  addEdge(fromNode, toNode, overrides = {}) {
    const dup = this.sceneEdges.find(e =>
      (e.value.fromNode===fromNode && e.value.toNode===toNode) ||
      (e.value.fromNode===toNode   && e.value.toNode===fromNode));
    if (dup) return null;
    const id = overrides.id || ('e' + this._nextId++);
    const edge = { type:'edge-ref', id, value:{
      fromNode:fromNode, toNode:toNode,
      from:fromNode.id, to:toNode.id, ...overrides,
    }};
    delete edge.value.id;
    this.sceneEdges.push(edge);
    return edge;
  }

  removeNode(node) {
    const rm = this.sceneEdges.filter(e => e.value.fromNode===node||e.value.toNode===node);
    for (const e of rm) this.removeEdge(e);
    const i = this.sceneNodes.indexOf(node);
    if (i>=0) this.sceneNodes.splice(i,1);
    this._nodeMap.delete(node.id);
    this.highlighted.delete(node);
  }

  removeEdge(edge) {
    const i = this.sceneEdges.indexOf(edge);
    if (i>=0) this.sceneEdges.splice(i,1);
    this.highlighted.delete(edge);
  }

  nodeById(id) { return this._nodeMap.get(id); }
  allNodes()   { return this.sceneNodes; }
  allEdges()   { return this.sceneEdges; }

  setMode(name) {
    this.mode = name; this._edgeStart = null;
    this._updateModeLabel(); this.draw();
  }

  clearAll() {
    this.sceneEdges.length = 0; this.sceneNodes.length = 0;
    this._nodeMap.clear(); this.highlighted.clear();
    this._nextId = 0; this._edgeStart = null; this._dragResult = null;
  }

  _makeCtxMix(hitPoint) {
    const self = this;
    return { ctx:self.ctx, T:self.T, W:self._W, H:self._H,
      hitPoint:hitPoint||null, hitResult:null, highlighted:self.highlighted,
      directCtx() { self.ctx.save(); return self.ctx; } };
  }

  draw() {
    this.ctx.clearRect(0,0,this._W,this._H);
    const eMix = this._makeCtxMix();
    for (const e of this.sceneEdges) EdgeRefNode.draw2d(eMix, e, this.edgeParams);
    if (this.onExtraDraw) this.onExtraDraw(eMix);
    const nMix = this._makeCtxMix();
    for (const n of this.sceneNodes) this.NodeClass.draw2d(nMix, n, this.nodeParams);
    if (this._edgeStart) {
      const s = this.T.toScreen({x:this._edgeStart.value.x||0, y:this._edgeStart.value.y||0});
      this.ctx.save();
      this.ctx.beginPath(); this.ctx.arc(s.x, s.y, 30, 0, Math.PI*2);
      this.ctx.strokeStyle='#58a6ff'; this.ctx.lineWidth=2;
      this.ctx.setLineDash([4,4]); this.ctx.stroke(); this.ctx.setLineDash([]);
      this.ctx.restore();
    }
  }

  _hitTest(mx, my) {
    for (let i=this.sceneNodes.length-1; i>=0; i--) {
      const mix = this._makeCtxMix({x:mx,y:my});
      this.NodeClass.hit_test(mix, this.sceneNodes[i], this.nodeParams);
      if (mix.hitResult) return {kind:'node', result:mix.hitResult};
    }
    for (let i=this.sceneEdges.length-1; i>=0; i--) {
      const mix = this._makeCtxMix({x:mx,y:my});
      EdgeRefNode.hit_test(mix, this.sceneEdges[i], this.edgeParams);
      if (mix.hitResult) return {kind:'edge', result:mix.hitResult};
    }
    return null;
  }

  _buildToolbar() {
    this.toolbarEl.innerHTML = `
      <div class="group">
        <button id="btn-pointer" class="active">Pointer</button>
        <button id="btn-add-node">+ Node</button>
        <button id="btn-add-edge">+ Edge</button>
        <button id="btn-delete" class="danger">Delete</button>
      </div>
      <div class="sep"></div>
      <div class="group" id="toolbar-extra"></div>
      <div class="mode-indicator">mode: <span class="mode-name" id="mode-label">pointer</span></div>`;
    for (const [bid,m] of [['btn-pointer','pointer'],['btn-add-node','add-node'],['btn-add-edge','add-edge'],['btn-delete','delete']])
      document.getElementById(bid).onclick = () => this.setMode(m);
  }

  _updateModeLabel() {
    const el = document.getElementById('mode-label');
    if (el) el.textContent = this.mode;
    for (const [bid,m] of [['btn-pointer','pointer'],['btn-add-node','add-node'],['btn-add-edge','add-edge'],['btn-delete','delete']]) {
      const b = document.getElementById(bid);
      if (b) b.classList.toggle('active', this.mode===m);
    }
  }

  _bindEvents() {
    const cv = this.canvas;
    cv.addEventListener('mousedown', e => { const r=cv.getBoundingClientRect(); this._onDown(e.clientX-r.left, e.clientY-r.top); });
    cv.addEventListener('mousemove', e => { const r=cv.getBoundingClientRect(); this._onMove(e.clientX-r.left, e.clientY-r.top); });
    cv.addEventListener('mouseup', () => { this._dragResult=null; });
    cv.addEventListener('mouseleave', () => { this._dragResult=null; });
    new ResizeObserver(() => { this._resize(); this.draw(); }).observe(cv.parentElement);
  }

  _onDown(mx, my) {
    const hit = this._hitTest(mx, my);
    switch (this.mode) {
      case 'pointer':
        if (hit?.kind==='node') { this._dragResult=hit.result; const n=hit.result.node; this.highlighted.has(n)?this.highlighted.delete(n):this.highlighted.add(n); this.draw(); }
        else if (hit?.kind==='edge') { const e=hit.result.node; this.highlighted.has(e)?this.highlighted.delete(e):this.highlighted.add(e); this.draw(); }
        break;
      case 'add-node':
        if (!hit) { const l=this.T.toLocal({x:mx,y:my}); const n=this.addNode(l.x,l.y); this.console.log(`+ <b>${n.id}</b>`,'info'); this.draw(); }
        else if (hit.kind==='node') this._dragResult=hit.result;
        break;
      case 'add-edge':
        if (hit?.kind==='node') {
          const n=hit.result.node;
          if (!this._edgeStart) { this._edgeStart=n; this.console.log(`edge from <b>${n.id}</b>`,'info'); this.draw(); }
          else if (n!==this._edgeStart) { const e=this.addEdge(this._edgeStart,n); if(e) this.console.log(`+ edge <b>${e.value.from}</b>→<b>${e.value.to}</b>`,'info'); else this.console.log('exists','warn'); this._edgeStart=null; this.draw(); }
        }
        break;
      case 'delete':
        if (hit?.kind==='node') { this.console.log(`− <b>${hit.result.node.id}</b>`,'warn'); this.removeNode(hit.result.node); this.draw(); }
        else if (hit?.kind==='edge') { const e=hit.result.node; this.console.log(`− edge <b>${e.value.from}</b>→<b>${e.value.to}</b>`,'warn'); this.removeEdge(e); this.draw(); }
        break;
    }
  }

  _onMove(mx, my) {
    if (this._dragResult) { this._dragResult.interactions.applyDrag(mx,my); this.draw(); return; }
    this.canvas.style.cursor = this._hitTest(mx,my) ? 'pointer' : (this.mode==='add-node'?'crosshair':'default');
  }

  _resize() {
    const dpr=devicePixelRatio||1, rect=this.canvas.parentElement.getBoundingClientRect();
    this._W=rect.width; this._H=rect.height;
    this.canvas.width=this._W*dpr; this.canvas.height=this._H*dpr;
    this.canvas.style.width=this._W+'px'; this.canvas.style.height=this._H+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.T.panX=this._W/2; this.T.panY=this._H/2;
  }
}


// ═══════════════════════════════════════════════════════════════
//  DOMAIN — TCA Cycle
// ═══════════════════════════════════════════════════════════════

const TCA_STEPS = [
  { id: 'oaa', label: 'OAA',  sub: 'Oxaloacetate',    color: '#4a7eff' },
  { id: 'cit', label: 'Cit',  sub: 'Citrate',          color: '#3fb950' },
  { id: 'iso', label: 'Iso',  sub: 'Isocitrate',       color: '#3fb950' },
  { id: 'akg', label: 'αKG',  sub: 'α-Ketoglutarate',  color: '#d29922' },
  { id: 'sca', label: 'SCoA', sub: 'Succinyl-CoA',     color: '#d29922' },
  { id: 'suc', label: 'Suc',  sub: 'Succinate',         color: '#bc8cff' },
  { id: 'fum', label: 'Fum',  sub: 'Fumarate',          color: '#bc8cff' },
  { id: 'mal', label: 'Mal',  sub: 'Malate',            color: '#4a7eff' },
];

function loadTCA(editor, con) {
  editor.clearAll();
  con.clear();

  const R = 170, N = TCA_STEPS.length;
  const nodes = TCA_STEPS.map((step, i) => {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2;
    return editor.addNode(
      R * Math.cos(a), R * Math.sin(a),
      { id: step.id, label: step.label, sub: step.sub,
        width: 82, height: 48, color: step.color }
    );
  });

  // Cyclic edges
  for (let i = 0; i < N; i++) editor.addEdge(nodes[i], nodes[(i + 1) % N]);

  con.log('Loaded <b>TCA Cycle</b> (Krebs cycle)', 'success');
  con.log(`${N} intermediates in cycle.`, 'info');
  con.log('Drag compounds to rearrange. Edges curve via bend parameter.', 'info');
  editor.draw();
}


// ═══════════════════════════════════════════════════════════════
//  HARNESS — init
// ═══════════════════════════════════════════════════════════════

const con = new ConsolePanel('console-panel');

const info = new InfoPanel('info-panel');
info.setContent({
  title: 'Pathway Editor',
  subtitle: 'ButtonNode · curved EdgeRefNode · biochem pathways',
  sections: [
    { name: 'TCA Cycle', open: true, items:
      TCA_STEPS.map(s => ({
        name: s.label,
        args: ` <span style="color:${s.color}">●</span>`,
        ret: s.sub,
      }))
    },
    { name: 'ButtonNode params', open: false, items: [
      { name: 'fontSize',     ret: 'number (14)' },
      { name: 'cornerRadius', ret: 'number (8)' },
      { name: 'bevel',        ret: 'number (1)' },
      { name: 'shadowBlur',   ret: 'number (4)' },
    ]},
    { name: 'Edge params', open: false, items: [
      { name: 'bend', args: '', ret: 'radians (-0.55)' },
      { name: 'pathWidth', ret: 'number (2.5)' },
      { name: 'pathColor', ret: 'hex' },
    ]},
    { name: 'Shim note', open: false, prose:
      'WarpedPolygon shim (shim-warped-polygon-curve.js) supports curved edges via quadratic bezier. Bend is a signed angle: 0 = straight, π = half-circle. Caps (|bend| > 3) draw straight.' },
  ],
});

const editor = new NetworkEditor({
  canvasId: 'canvas', toolbarId: 'toolbar', console: con,
  NodeClass: ButtonNode, nodeType: 'button-node',
  nodeParams: { fontSize: 14, cornerRadius: 8, bevel: 1, shadowBlur: 4,
                shadowOffsetX: 1, shadowOffsetY: 2, borderWidth: 1.5 },
  edgeParams: { pathWidth: 2.5, strokeWidth: 0.6, pathColor: '#8b949eaa',
                fillOpacity: 0.45, bend: -0.55, pointRadius: 40 },
  defaultNodeValue: { label: '?', sub: 'New', width: 82, height: 48, color: '#555555' },
});

// Preset buttons
const extra = document.getElementById('toolbar-extra');
extra.innerHTML = `
  <button id="btn-tca" class="green">TCA Cycle</button>
  <div class="sep"></div>
  <button id="btn-clear" class="danger">Clear</button>
`;
document.getElementById('btn-tca').onclick = () => loadTCA(editor, con);
document.getElementById('btn-clear').onclick = () => { editor.clearAll(); con.clear(); con.log('Cleared.','warn'); editor.draw(); };

con.log('Load a preset pathway or build one manually.', 'info');
editor.draw();

</script>
