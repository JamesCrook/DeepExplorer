<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widgets — a panopticon with HTML panes</title>
  <link rel="icon" type="image/x-icon" href="../../wheel.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111210; color: #c8c0b0;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }

:root {
  --bg: #14151e; --surface: #1c1d2b; --surface-2: #242536;
  --surface-hover: #2a2c3e; --border: #2e3048;
  --text-1: #d8dae5; --text-2: #8789a3; --text-3: #5c5e78;
  --accent: #6e9ef7; --accent-dim: #6e9ef733;
  --wiki: #dba06a; --docstring: #6b7a8d;
  --channel-active: #2e3050;
  --msg-font-size: 13.5px;
  --srv-btn-size: 44;
  --srv-icon-pct: 65;
  /* morphable slider geometry */
  --ms-track-h: 24; --ms-pip-h: 28; --ms-pip-w: 3;
  --ms-fill-op: 0.18; --ms-track-r: 4; --ms-text-y: 0;
  --ms-pip-bri: 1.4; --ms-label-inset: 8;
  /* server icon dormant state */
  --srv-dormant-sat: 0.33; --srv-dormant-bri: 0.66;
}

    header {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 20px; border-bottom: 1px solid #2a2824;
      background: #17160f; flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 700; color: #e4dac6; letter-spacing: -0.03em; }
    header .tag {
      font-size: 10px; font-family: monospace; color: #6a6256;
      background: #222018; padding: 2px 7px; border-radius: 4px; border: 1px solid #2a2824;
    }
    #container {
      flex: 1; display: flex; flex-wrap: wrap;
      gap: 1px; background: #2a2824; overflow: hidden;
    }
    .pane {
      background: #111210; display: flex;
      flex-direction: column; overflow: hidden;
      position: relative;
      transition: opacity 0.15s;
      flex-grow: 1;    
    }
    .pane.pane-hidden { display: none !important; }
    .pane .label {
      padding: 8px 14px; font-size: 11px; font-weight: 600;
      color: #6a6256; text-transform: uppercase;
      letter-spacing: 0.08em; flex-shrink: 0;
    }
    .pane canvas { flex: 1; width: 100%; height: 100%; display: block; }
    .pane.pane-3d canvas { width: 100% !important; height: 100% !important; }
    .pane.pane-3d .pane-title-3d {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 10px; font-weight: 700; letter-spacing: 3px;
      color: rgba(255,255,255,0.35); z-index: 5;
      text-transform: uppercase; white-space: nowrap;
    }
    /* A title is a handle for soloing its pane; the rest of the overlay is
       not, so the canvas beneath keeps its drags. */
    .pane .label, .pane .pane-3d-spacer { pointer-events: none; }
    .pane .label, .pane .pane-title-3d { cursor: pointer; user-select: none; }
    .pane .label { pointer-events: auto; }
    .pane .label:hover, .pane .pane-title-3d:hover { color: #e4dac6; }
    #tooltip {
      position: fixed; pointer-events: none;
      background: #222018; border: 1px solid #3d3a32;
      border-radius: 6px; padding: 6px 10px; z-index: 100;
      box-shadow: 0 6px 18px rgba(0,0,0,.45);
      display: none; white-space: nowrap; font-size: 12px;
    }
    #tooltip .tt-name   { font-weight: 600; color: #e4dac6; font-family: monospace; }
    #tooltip .tt-detail { color: #7a7060; font-size: 10px; margin-top: 2px; }
    #tooltip .tt-extra  { color: #5a5448; font-size: 10px; margin-top: 1px; }

    .sel-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .sel-row span { min-width: 60px; color: #999; font-size: 11px; }
    .sel-row input[type=text], .sel-row input[type=number] {
      flex: 1; background: rgba(0,0,0,0.5); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); padding: 4px 6px;
      border-radius: 4px; font-size: 11px; outline: none;
      font-family: monospace;
    }
    .sel-row input:focus { border-color: #6cf; }
    /* ExpandingText: a one-line textarea that opens when clicked if its text
       does not fit.  The open box sets its own width, so its row and the
       panel grow with it. */
    /* Collapsed: no bottom padding and a line-height that fills the box,
       so exactly one line shows and none peeks in under the padding. */
    .sel-row textarea.xt {
      flex: 1; min-width: 0; height: 24px; resize: none; overflow: hidden;
      background: rgba(0,0,0,0.5); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); padding: 3px 6px 0;
      border-radius: 4px; font: 11px/19px monospace; outline: none;
    }
    .sel-row textarea.xt:focus { border-color: #6cf; }
    .sel-row textarea.xt.xt-open {
      flex: 0 0 auto; border-color: #6cf; background: rgba(0,0,0,0.75);
      padding: 4px 6px; line-height: 15px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .sel-row.xt-row-open { align-items: flex-start; }
    .sel-scene { display: flex; flex-direction: column; }
    .sel-btn {
      width: 100%; margin: 6px 0 4px; padding: 5px 8px; cursor: pointer;
      font-size: 11px; font-weight: 600; letter-spacing: 0.03em; color: #999;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06);
      border-radius: 4px; transition: background 0.15s;
    }
    .sel-btn:hover { background: rgba(255,255,255,0.12); }
    .sel-tools { margin-top: 8px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.1); }
    .sel-row.xt-row-open > span { padding-top: 5px; }
    .sel-row input[type=color] {
      width: 32px; height: 22px; padding: 1px; cursor: pointer; border-radius: 4px;
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); outline: none;
    }
    .sel-row input[type=checkbox] { accent-color: #6cf; cursor: pointer; }
    .sel-row select { flex: 1; }

    /* The selected HTML node, in the same amber as a selected 2D item. */
    .html-pane .is-selected {
      outline: 1px solid #daa02e; outline-offset: 3px; border-radius: 4px;
    }

/* ── Morphable slider (ms-*) — track/fill/pip whose geometry is CSS-var-driven ── */
.morph-slider {
  position: relative; height: 32px; margin: 2px 6px; padding: 0 8px;
  cursor: ew-resize; user-select: none; touch-action: none;
  display: flex; align-items: center;
}
.ms-track {
  position: absolute; left: 8px; right: 8px; top: 50%;
  transform: translateY(-50%);
  height: calc(var(--ms-track-h) * 1px);
  border-radius: calc(var(--ms-track-r) * 1px);
  background: var(--surface-2); overflow: hidden;
}
.ms-fill {
  height: 100%; width: 50%;
  background: rgba(110,158,247, var(--ms-fill-op));
  pointer-events: none;
}
.ms-pip {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: calc(var(--ms-pip-w) * 1px);
  height: calc(var(--ms-pip-h) * 1px);
  border-radius: 12px;
  background: var(--surface-hover);
  pointer-events: none; transition: background 0.15s;
  filter: brightness(var(--ms-pip-bri));
}
.morph-slider:hover .ms-pip { background: var(--accent-dim); transition-duration: 0.06s; }
.morph-slider.engaged .ms-pip { background: var(--accent); }
.ms-label, .ms-val {
  position: absolute;
  top: calc(50% + var(--ms-text-y) * 1px);
  transform: translateY(-50%); pointer-events: none;
}
.ms-label {
  left: calc(var(--ms-label-inset) * 1px + 8px);
  font-size: 11px; color: var(--text-2);
}
.ms-val {
  right: calc(var(--ms-label-inset) * 1px + 8px);
  font-family: 'SF Mono','Consolas',monospace;
  font-size: 10px; color: var(--text-3);
}
.morph-slider.engaged .ms-val { color: var(--accent); }

/* ── HTML panes (DemoHarnessHtml) ── */
.html-pane {
  flex: 1; min-height: 0; overflow: auto;
  padding: 2px 18px 18px;
  color: var(--text-2); font: 12px/1.5 system-ui, -apple-system, sans-serif;
}
.html-demo { display: flex; flex-direction: column; gap: 12px; max-width: 440px; }
.html-demo h4 {
  font: 600 11px/1 'SF Mono','Consolas',monospace;
  color: var(--text-3); letter-spacing: 0.04em;
}
.html-readout {
  white-space: pre-line;
  font: 11px/1.6 'SF Mono','Consolas',monospace; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px;
}
.html-bar-track { height: 6px; margin: 0 14px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.html-bar { height: 100%; background: var(--accent); }
.html-checker {
  height: 56px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border);
  background: repeating-conic-gradient(#2a2c3e 0% 25%, #1c1d2b 0% 50%) 0 0 / 16px 16px;
}
.html-preview { height: 100%; }

/* filedrop — from css/omni-controls.css */
.file-drop {
  border: 2px dashed #333; border-radius: 8px; padding: 16px;
  text-align: center; color: #666; font-size: 11px;
  cursor: pointer; transition: all 0.2s;
}
.file-drop:hover, .file-drop.dragover {
  border-color: #4fc3f7; background: rgba(79, 195, 247, 0.05); color: #4fc3f7;
}
.file-drop-icon { font-size: 24px; margin-bottom: 8px; opacity: 0.5; }

/* color-picker — from css/omni-controls.css */
.sc-color-control { position: relative; }
.sc-color-control label {
  display: flex; justify-content: space-between; margin-bottom: 6px;
  font-size: 11px; color: var(--text-2);
}
.sc-color-control label span:last-child { font-family: 'SF Mono','Consolas',monospace; color: var(--text-3); }
.sc-color-swatch {
  width: 100%; height: 28px; padding: 0; cursor: pointer;
  border: 1px solid #ffffff20; border-radius: 4px; transition: border-color 0.15s;
}
.sc-color-swatch:hover { border-color: #ffffff50; }
.sc-color-popup {
  position: relative; margin-top: 6px; padding: 8px; z-index: 20;
  background: #1a1a2e; border: 1px solid #ffffff20; border-radius: 6px;
}
.sc-color-popup input[type="color"] {
  width: 100%; height: 36px; padding: 0; cursor: pointer;
  border: none; border-radius: 4px; background: transparent;
}
.sc-color-popup input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.sc-color-popup input[type="color"]::-webkit-color-swatch { border: 1px solid #ffffff20; border-radius: 4px; }
.sc-color-alpha-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.sc-color-alpha-row span { font-size: 11px; color: #888; flex-shrink: 0; }
.sc-color-alpha-row input[type="range"] { flex: 1; margin: 0; }

/* spectrum — from spectrum-lab.html, on the panopticon's colours */
.html-demo.html-wide { max-width: none; }
.spectrum {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 0; outline: none;
}
.spectrum:focus-visible { border-color: #ffd34d; }
.spectrum canvas { display: block; width: 100%; touch-action: none; }
.html-gradient { height: 28px; border-radius: 6px; border: 1px solid var(--border); }
.html-hint { font-size: 11px; color: var(--text-3); line-height: 1.5; }
.spec-popover {
  position: fixed; z-index: 1100; width: 276px;
  display: flex; flex-direction: column; gap: 8px; padding: 10px;
  background: #25282d; border: 1px solid #484e57; border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0,0,0,.55);
  color: #e6e7ea; font: 13px/1.4 system-ui, -apple-system, sans-serif;
}
.spec-popover[hidden] { display: none; }
.spec-popover canvas { display: block; border-radius: 4px; cursor: crosshair; touch-action: none; }
.spec-popover .pe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.spec-popover .pe-grid label { display: flex; align-items: center; gap: 4px; color: #9aa0a8; }
.spec-popover input {
  width: 100%; min-width: 0; padding: 4px 6px; font: inherit;
  background: #292c31; color: #e6e7ea; border: 1px solid #363a41; border-radius: 5px;
}
.spec-popover .pe-row { display: flex; align-items: center; gap: 8px; }
.spec-popover .pe-sw { display: flex; flex: 1; height: 24px; overflow: hidden; border-radius: 5px; border: 1px solid rgba(255,255,255,.35); }
.spec-popover .pe-sw span { flex: 1; }
.spec-popover .pe-old { cursor: pointer; }
.spec-popover .pe-hex { width: 82px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
.spec-popover .pe-gamut { color: #9aa0a8; font-size: 12px; }

/* html-template — the templates in the Templates panel's book */
.tpl-list { display: flex; flex-direction: column; gap: 2px; }
.tpl-topic {
  display: flex; align-items: center; gap: 10px; padding: 5px 8px;
  border-radius: 6px; color: var(--text-2); cursor: pointer;
}
.tpl-topic:hover { background: var(--surface-hover); color: var(--text-1); }
.tpl-ico {
  width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #e8e2d0;
}
.tpl-lbl { flex: 1; font-size: 13px; }
.tpl-meta { font: 10px 'SF Mono','Consolas',monospace; color: var(--text-3); }
.tpl-msg { display: flex; gap: 10px; padding: 4px 2px; }
.tpl-av {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff;
}
.tpl-msg-bd { min-width: 0; }
.tpl-msg-hd { display: flex; gap: 8px; align-items: baseline; }
.tpl-nm { font-weight: 600; color: var(--text-1); font-size: 13px; }
.tpl-tm { font-size: 10px; color: var(--text-3); }
.tpl-msg-tx { color: var(--text-2); font-size: 13px; line-height: 1.5; }
.tpl-card {
  display: flex; flex-direction: column; gap: 8px; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
}
.tpl-card-hd { font-weight: 600; color: var(--text-1); }
.tpl-card-bd { font-size: 12px; color: var(--text-2); }
.tpl-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.tpl-chip {
  font: 600 10px/1 'SF Mono','Consolas',monospace; letter-spacing: .04em;
  padding: 4px 7px; border-radius: 10px;
  color: var(--chip); border: 1px solid var(--chip);
  background: color-mix(in srgb, var(--chip) 12%, transparent);
}
.tpl-missing { color: #d07070; font-size: 12px; }
.tpl-book { max-height: 260px; overflow: auto; white-space: pre; }

/* html-box layout fields, selection groups, hosts, repeats, variants */
.is-scroll-y { overflow-y: auto; min-height: 0; }
.is-scroll-x { overflow-x: auto; }
.is-scroll-both { overflow: auto; min-height: 0; }
.is-sticky { position: sticky; top: 0; z-index: 2; background: #111210; }
.is-sticky.is-stuck { box-shadow: 0 6px 12px -6px rgba(0,0,0,0.7); }
.sticky-sentinel { height: 1px; margin-bottom: -1px; }
.is-active > .tpl-topic, .tpl-topic.is-active { background: var(--channel-active); color: var(--text-1); }
.html-host {
  border: 1px solid var(--border); border-radius: 8px; padding: 4px;
  background: #0d0e14; transition: border-color .15s;
}
.html-host.is-engaged { border-color: #6cf; }
.html-host canvas { display: block; width: 100%; height: 100%; }
.var-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.var-row { display: flex; flex-wrap: wrap; gap: 10px; }
.html-variant { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.html-variant figcaption { font: 10px/1.45 'SF Mono','Consolas',monospace; color: var(--text-3);
  display: flex; flex-direction: column; }
.html-variant figcaption b { font: 600 11px/1.4 system-ui, sans-serif; color: var(--text-2); }
.var-grid.var-wide { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-items: start; }

/* D+ Mini and its templates */
.dpm { display: grid; grid-template-columns: 52px 170px minmax(0, 1fr); gap: 0; height: 430px;
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.dpm-servers { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0;
  background: #0d0e14; border-right: 1px solid var(--border); }
.tpl-srv { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
  background: var(--surface-2); font-size: 16px; cursor: pointer; transition: border-radius .15s, background .15s; }
.tpl-srv:hover { border-radius: 9px; }
.is-active.tpl-srv { background: var(--accent); border-radius: 9px; box-shadow: -6px 0 0 -2px #e8e2d0; }
.dpm-topics { display: flex; flex-direction: column; gap: 2px; padding: 8px 6px;
  background: #15161f; border-right: 1px solid var(--border); min-height: 0; }
.dpm-colhead { font: 600 10px/1 system-ui; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 6px 8px; }
.dpm-nav { margin-top: auto; font: 10px 'SF Mono','Consolas',monospace; color: var(--text-3); padding: 6px 8px; }
.dpm-chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.dpm-flow { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.dpm-flow .scroller { flex: 1; padding: 0 12px 8px; display: flex; flex-direction: column; gap: 6px; }
.sticky-section { display: flex; flex-direction: column; gap: 6px; }
.sticky-head { padding-top: 6px; }
.dpm-input { padding: 8px 12px; border-top: 1px solid var(--border); }
.tpl-chathdr { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-1); font-weight: 600; font-size: 13px; }
.tpl-hash { color: var(--text-3); }
.tpl-desc { font-weight: 400; color: var(--text-3); font-size: 11px; margin-left: 6px; }
.tpl-chatin { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 8px; padding: 2px 10px; }
.tpl-chatin-box { flex: 1; background: none; border: 0; outline: none; color: var(--text-1); font: 13px system-ui; padding: 8px 0; }
.tpl-chatin-key { font: 10px 'SF Mono','Consolas',monospace; color: var(--text-3); }
.tpl-stage { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; }
.tpl-stage-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
.tpl-badge { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font: 700 10px system-ui; }

/* Markdown+ blocks */
.md-note { gap: 8px; max-width: 560px; }
.md-block { margin: 0; color: var(--text-2); font-size: 13px; line-height: 1.55; }
h1.md-block, h2.md-block, h3.md-block, h4.md-block { color: var(--text-1); line-height: 1.25; }
h2.md-block { font-size: 17px; }
blockquote.md-block { border-left: 3px solid var(--border); padding-left: 10px; color: var(--text-3); }
pre.md-block { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; overflow: auto; }
.md-block code { font: 12px 'SF Mono','Consolas',monospace; color: #c8b888; }
.md-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 2px; }
hr.md-block { border: 0; border-top: 1px solid var(--border); }
.md-block a { color: var(--accent); }
.md-note > .tpl-chip { align-self: flex-start; }   /* an inline island keeps its own width */

/* nav-link — from js/utilities2/nav.js */
.nav-menu-list {
  display: flex; flex-direction: column; padding: 4px 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
}
.nav-menu-item {
  display: block; padding: 8px 16px;
  color: #b0b8c8; text-decoration: none; font-size: 13px;
  cursor: pointer; transition: background 0.15s, color 0.15s;
}
.nav-menu-item:hover { background: rgba(79, 195, 247, 0.1); color: #e0e8f0; }

  <header>
    <h1>Widget Panopticon</h1>
    <span class="tag" id="pane-count"></span>
  </header>

  <div id="container"></div>

  <div id="tooltip">
    <div class="tt-name"></div>
    <div class="tt-detail"></div>
    <div class="tt-extra"></div>
  </div>

<script type="module">
/* R, P, MODELS, STOCK, CONTROLS, makeNode and cloneProto now live in the
   ./sys.js nugget, below scene-registry, and are reached as SYS.MODELS and so
   on.  See the prose there. */


/* Essential core defs of Geo.  A build that drops ./geo.js still needs the two
   constants, so they are defined here rather than in the nugget.  globalThis
   rather than window: a slice is sometimes loaded outside a browser, and there
   the assignment must still produce a resolvable binding. */
if (typeof Geo === 'undefined') {
  globalThis.Geo = class {};
}

Geo.PI = Math.PI;
Geo.TAU = Math.PI * 2;

/* ─────────────────────────────────────────────────────────────────────────────
Values — the one channel through which anything reads or writes a node, and
the identity resolver: the answer when there is no context to ask.

  getValue(res, node, params)         -> the node's value
  setValue(res, node, params, patch)  -> true if anything changed
  getNode (res, node, params)         -> the node itself, or its stand-in

A *resolver* is anything answering those three.  A ctxMix is one, because the
pane spreads Values into it and may override a member; Values itself is the
other, for callers that are not inside a walk at all — the pip manager, the
controllers, a model building its scene.  So a geometry method is called
`fn(ctxMix, node, params)` inside a walk and `fn(Values, node, params)`
outside one, and never has to ask which it got.

A leaf asks for its value and gets everything: its data, its tooltip, whether
it is selected.  It never learns whether it is one node or one of a thousand,
nor whether an ancestor is rewriting what it reads.

Ephemeral keys are routed to node.state, so a universal write channel does not
become the way ephemera creeps back into value.  That rule lives here alone.

A note on the read discipline.  getValue may return a *copy* — it does so as
soon as a node carries ephemera.  So a value is for reading; to write, call
setValue.  A drag closure that captured `v` and assigned to `v.x` would work
until the node was first selected, and then quietly stop.
──────────────────────────────────────────────────────────────────────────── */
const EPHEMERAL = new Set(['selected', 'hovered']);

/* A plain node's value, with its ephemera folded in — but only when there
   is any, so the common case allocates nothing. */
function plainValue(node) {
  const s = node?.state;
  if (!s || (s.selected === undefined && s.hovered === undefined)) return node?.value;
  return { ...node.value, selected: s.selected, hovered: s.hovered };
}

function applyPlain(node, patch) {
  if (!node) return false;
  let changed = false;
  for (const key of Object.keys(patch)) {
    const target = EPHEMERAL.has(key) ? (node.state ||= {}) : node.value;
    if (target[key] === patch[key]) continue;
    target[key] = patch[key];
    changed = true;
  }
  return changed;
}

/* An object literal rather than a class: its members must be enumerable, so
   that a ctxMix is built by spreading these and overriding what it means to
   change.  A class's statics are not, which is how the pane came to carry a
   second copy of getValue that had drifted from this one. */
const Values = Object.freeze({

  getValue(res, node, params) {
    if (node?.flyFn) return node.flyFn(res, node, params);
    return plainValue(node);
  },

  setValue(res, node, params, patch) {
    if (node?.setFn) return node.setFn(res, node, params, patch);
    return applyPlain(node, patch);
  },

  getNode(res, node, params) {
    return node?.nodeFn ? node.nodeFn(res, node, params) : node;
  },

  plain: plainValue,
  applyPlain,

  /* Everything the app may do with a hit, whether it landed on an ordinary
     node or on one item of a flyweight.  The app calls these and nothing
     else — it never reaches into hit.node. */
  access(res, hit, params) {
    const i = hit?.interactions || {}, node = hit?.node;
    return {
      node,
      applyDrag:  i.applyDrag,
      endDrag:    i.endDrag,
      draggable:  !!i.applyDrag,
      getValue:   i.getValue   ?? (() => Values.getValue(res, node, params)),
      setValue:   i.setValue   ?? (patch => Values.setValue(res, node, params, patch)),
      getTooltip: i.getTooltip ?? (() => Values.getValue(res, node, params)?.tooltip ?? null),
    };
  },
});
//-- endfile --

//<< import { PipKinds } from './pip-kind.js';
//-- file: ./pip-kind.js --
//>> export { PipKinds };

/* ─────────────────────────────────────────────────────────────────────────────
PipKinds — frozen capability records describing what a pip may do.

A kind record is never mutated in place.  To change a pip's capabilities at
run time, swap in a different frozen record.

A node class declares a uniform kind in meta.pipKind, or answers per pip with
a static getPipKinds(node) returning one record per pip — so a node may in
future anchor one pip and follow another (an 'in pip' and an 'out pip').

  anchors  the pip's position derives from the node's own geometry: it drives
  follows  the pip's position may be driven by another pip: it can be set
  splits   landing on an edge divides that edge in two
  absorbs  the pip may be dissolved when it is only a pass-through

PipSetManager owns the vocabulary of questions; node classes only answer.
Adding a question here does not disturb classes that never ask it.
──────────────────────────────────────────────────────────────────────────── */
const PipKinds = {
  TILE:     Object.freeze({ name: 'tile',     anchors: true,  follows: false, splits: false, absorbs: false }),
  EDGE_END: Object.freeze({ name: 'edge-end', anchors: false, follows: true,  splits: false, absorbs: false }),
  JUNCTION: Object.freeze({
    name: 'junction', anchors: false, follows: true, splits: true, absorbs: true,
    // A junction is a point.  Classes that want no more than that need not
    // implement getPips/setPipPos at all — the kind answers for them.
    getPips: (res, node, params) => {
      const v = res.getValue(res, node, params) || {};
      return [{ x: v.x || 0, y: v.y || 0, out: 0 }];
    },
    setPipPos: (res, node, params) => {
      res.setValue(res, node, params, { x: params.x, y: params.y });
    },
  }),
};

/* Pip geometry reads through the value channel, so a caller outside a walk
   passes Values and a caller inside one passes its ctxMix.  Both answer
   getValue/setValue; nothing else is required of a resolver. */
//-- endfile --


//<< import { SubtreeIterator } from './subtree-iterator.js';
//-- file: ./subtree-iterator.js --
//>> export { SubtreeIterator };

/* ─────────────────────────────────────────────────────────────────────────────
SubtreeIterator — the default child walk: every child, in order.

A node class may push its own iterator to cull or reorder its children, which
is how a clip node skips what lies outside its rectangle.
──────────────────────────────────────────────────────────────────────────── */

class SubtreeIterator {
  constructor() { this.index = 0; }
  next(subtree) {
    if (this.index >= subtree.length) return null;
    return subtree[this.index++];
  }
}
//-- endfile --

//<< import { SceneRegistry } from './scene-registry.js';
//-- file: ./scene-registry.js --
//>> import { SubtreeIterator } from './subtree-iterator.js';
//>> export { SceneRegistry };
/* ─────────────────────────────────────────────────────────────────────────────
SceneRegistry — the phase handlers of every node type, and the walker.

Node types arrive as records pushed into a list, normally SYS.NODE_CLASSES:
    SYS.NODE_CLASSES.push({ name: 'button-node', cls: ButtonNode, defaults });
The registry absorbs records it has not seen before its next dispatch, and
whenever meta is read, so a push takes effect at the next walk, from any
nugget, at load or later.  A cursor per list makes the check one comparison.

Other lists can feed it too, through an adapter that turns a record into
{ name, cls, defaults } or null.  html-template-node adds SYS.TEMPLATES this
way, which is what makes every template a node type of the same name.

A name pushed twice: the later record wins, with a console warning, and the
earlier class's handlers are removed rather than left to mix with the new.
registerNodeClass remains for code outside the panopticon; it is what
absorbing a record calls.
──────────────────────────────────────────────────────────────────────────── */
class SceneRegistry {
  constructor(source = null) {
    this.handlers = {};      // { phase: { nodeType: handler } }
    this._meta = {};         // { nodeType: { nodeClass, defaultParams, ...cls.meta } }
    this.sources = [];       // { list, adapt, seen }
    if (source) this.addSource(source);
  }

  addSource(list, adapt = (r) => r) {
    this.sources.push({ list, adapt, seen: 0 });
  }

  get meta() { this.absorb(); return this._meta; }

  absorb() {
    for (const src of this.sources) {
      while (src.seen < src.list.length) {
        const r = src.adapt(src.list[src.seen++]);
        if (r) this.registerNodeClass(r.name, r.cls, r.defaults ?? null);
      }
    }
  }

  hasCtxMix(fn, name) {
    const fnStr = fn.toString().trim();
    const codeOnly = fnStr.replace(/\/\*[\s\S]*?\*\/|\/\/.*/g, '');
    const match = codeOnly.match(/^[^(]*\(\s*([^,)\s]+)/);
    let firstParam = '';
    if (match) firstParam = match[1];
    else {
      const arrowMatch = codeOnly.match(/^([^=()\s]+)\s*=>/);
      if (arrowMatch) firstParam = arrowMatch[1];
    }
    return firstParam === 'ctxMix';
  }

  /* Indexed phase first, as handlers is.  (It was indexed the other way round,
     so it never found anything; harmless only because every handler calls
     nodeClass[name], which resolves to the subclass's own method anyway.) */
  _hasHandler(nodeType, name) { return !!this.handlers[name]?.[nodeType]; }

  registerNodeClass(nodeType, nodeClass, defaultParams=null) {
    const prev = this._meta[nodeType];
    if (prev) {
      if (prev.nodeClass !== nodeClass) {
        console.warn(`node type '${nodeType}': ${prev.nodeClass.name} replaced by ${nodeClass.name}; the later push wins`);
      }
      for (const phase in this.handlers) delete this.handlers[phase][nodeType];
    }
    for (let cls = nodeClass; cls && cls !== Function.prototype; cls = Object.getPrototypeOf(cls)) {
      for (const name of Object.getOwnPropertyNames(cls)) {
        if (['length', 'name', 'prototype'].includes(name))
          continue;
        const method = cls[name];
        if (typeof method !== 'function')
          continue;
        if (this.hasCtxMix(method, name)) {
          if (!this._hasHandler?.(nodeType, name)) {
            this._registerHandler(nodeType, name, (ctxMix, node, params, child) => {
              return nodeClass[name](ctxMix, node, params, child);
            });
          }
        }
      }
    }
    this._meta[nodeType] = { nodeClass, defaultParams, ...(nodeClass.meta || {}) };
  }

  _registerHandler(nodeType, phase, handler) {
    if (!this.handlers[phase]) this.handlers[phase] = {};
    this.handlers[phase][nodeType] = handler;
  }

  dispatch(ctxMix, phase, node, params, child) {
    this.absorb();
    const phaseHandlers = this.handlers[phase];
    if (!phaseHandlers) return;
    const meta = this._meta[node.type];
    const mergedParams = meta?.defaultParams ? { ...meta.defaultParams, ...params } : params;
    const handler = phaseHandlers[node.type] || phaseHandlers['default'];
    if (handler) return handler(ctxMix, node, mergedParams, child);
  }

  hasPhase(nodeType, phase) { this.absorb(); return !!this.handlers[phase]?.[nodeType]; }
  
  // ── AST tree walk ──────────────────────────────────────────
  runPhases(ctxMix, root, params, phases = ['measure', 'position', 'draw']) {
    ctxMix.iterators = [];
    ctxMix.flyweight = {};
    for (const phase of phases) {
      this.walkPhase(ctxMix, phase, root, params);
    }
  }

  walkPhase(ctxMix, phase, node, params) {
    if (!node) return;

    if (!node?.subtree || node?.subtree?.length === 0) {
      this.dispatch(ctxMix, phase, node, params);
      return;
    }

    if (!ctxMix.iterators) ctxMix.iterators = [];
    ctxMix.iterators.push(new SubtreeIterator());

    this.dispatch(ctxMix, 'before_' + phase, node, params);

    let child;
    while ((child = ctxMix.iterators.at(-1).next(node.subtree)) !== null) {
      if (ctxMix.abortPhase) break; 

      this.dispatch(ctxMix, 'before_child_' + phase, node, params, child);
      if (ctxMix.abortPhase) break; 

      this.walkPhase(ctxMix, phase, child, params);
      if (ctxMix.abortPhase) break; 

      this.dispatch(ctxMix, 'after_child_' + phase, node, params, child);
      if (ctxMix.abortPhase) break;
    }
    ctxMix.abortPhase = false;

    this.dispatch(ctxMix, 'after_' + phase, node, params);
    ctxMix.iterators.pop();
  }
}

//-- endfile --

//<< import { SYS, sceneRegistry } from './sys.js';
//-- file: ./sys.js --
//>> import { SceneRegistry } from './scene-registry.js';
//>> export { SYS, sceneRegistry };

/* ─────────────────────────────────────────────────────────────────────────────
SYS — the things that exist once.

A node factory, the collections a nugget registers itself into, and the two
parameter bags.  Nothing here has behaviour worth reading; what matters is
that it is named.  A bare `makeNode` in a nugget is a hidden dependency on the
harness; `SYS.makeNode` is a declared one, and the import line above it says so.

This is the only import whose order matters.  Every other nugget reaches its
dependencies from inside a method body, so the concatenated file may hold them
in any order; SYS is constructed at load and must precede its consumers.

  registry / sceneRegistry  the singleton that walks scenes.  It reads its
                            node types from NODE_CLASSES.  Exported under both
                            names: `sceneRegistry` for the nuggets that walk,
                            SYS.registry for code that would rather say where
                            it came from.
  MODELS, STOCK, CONTROLS   registration sinks.  A model nugget pushes itself
                            into MODELS at load; that is what makes a model a
                            usable slice entry point.
  NODE_CLASSES              { name, cls, defaults? } per node type.  Absorbed
                            by the registry before its next walk.
  TEMPLATES                 { name, markup, from? } per HTML template.  A book
                            of Markdown+ fences pushes one record per fence.
  FUNCTIONS                 { name, fn, label? }, dotted by kind: format.pct now;
                            value.*, draw.*, action.* as they move here.  The
                            name is what a serialised node refers to.

Every sink is a plain array, pushed to at load or later.  When a name occurs
twice, the last record pushed wins: named() searches from the end.  audit()
reports such names once at startup, so an accident shows and an override is
still possible.
  P, R                      shared drawing parameters.  Not every nugget needs
                            them, but the cost of declaring them is a line.
──────────────────────────────────────────────────────────────────────────── */

const NODE_CLASSES = [];
const TEMPLATES = [];
const FUNCTIONS = [];
const sceneRegistry = new SceneRegistry(NODE_CLASSES);

const R = 30;
const P = {
  opacity: 80, edgeWidth: 5, edgeOutline: 1.5, edgeBend: 0,
  showChartBounds: false, screenMode: false,
  colors: { 4: { fill: '#c08428', stroke: '#9a6a1e' } },
};

const MODELS = [];
const STOCK = [];
const CONTROLS = [];

let _nodeId = 0;
function makeNode(type, value, subtree) {
  return { type, value: { ...value, id: ++_nodeId }, subtree: subtree || [] };
}
function cloneProto(proto, overrides) {
  const { id: _, ...rest } = proto.value;
  return makeNode(proto.type, { ...rest, ...overrides });
}

/** The record with this name that was pushed last, or null. */
function named(list, name) {
  for (let i = list.length - 1; i >= 0; i--) if (list[i].name === name) return list[i];
  return null;
}
/** Distinct names in a sink, in push order, optionally only those with a prefix. */
function namesIn(list, prefix = '') {
  return [...new Set(list.map(r => r.name))].filter(n => n.startsWith(prefix));
}
/** Warn once about names pushed more than once.  NODE_CLASSES is left out:
    the registry warns as it absorbs, which also covers pushes made later. */
function audit() {
  for (const [sink, list] of Object.entries({ TEMPLATES, FUNCTIONS })) {
    const count = new Map();
    for (const r of list) count.set(r.name, (count.get(r.name) || 0) + 1);
    for (const [name, n] of count) {
      if (n > 1) console.warn(`SYS.${sink}: '${name}' pushed ${n} times; the last one wins`);
    }
  }
}

const SYS = {
  R, P, MODELS, STOCK, CONTROLS, NODE_CLASSES, TEMPLATES, FUNCTIONS,
  named, namesIn, audit,
  makeNode, cloneProto,
  registry: sceneRegistry,
};
//-- endfile --

//<< import { hexToRgb, hexToRgba, shiftColor, roundRectPath, rrPath, HIGHLIGHT } from './paint.js';
//-- file: ./paint.js --
//>> export { HIGHLIGHT, hexToRgb, hexToRgba, roundRectPath, rrPath, shiftColor };

/* ─────────────────────────────────────────────────────────────────────────────
paint — colour arithmetic and canvas paths.  No scene-graph knowledge.

These were strays: the colour helpers lived at the foot of model-utils, where a
builder facade had quietly become a helper bag, and rrPath/HIGHLIGHT lived in
zone-support, which existed for no other reason.  Both homes are now here.

roundRectPath takes one radius, rrPath takes four.  They are near-duplicates and
sit next to each other so that stays visible.
──────────────────────────────────────────────────────────────────────────── */

const HIGHLIGHT = '#daa02e';

function hexToRgb(hex) {
  hex = (hex || '#888888').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  if (hex.length === 8) hex = hex.slice(0, 6);
  const n = parseInt(hex, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function hexToRgba(hex, alpha) {
  hex = (hex || '#888888').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  if (hex.length === 8) hex = hex.slice(0, 6);
  const n = parseInt(hex, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

function shiftColor({ r, g, b }, amt) {
  const f = v => Math.round(Math.min(255, Math.max(0, amt > 0 ? v + (255 - v) * amt : v + v * amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  else {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
  }
}

function rrPath(ctx, x, y, w, h, rtl, rtr, rbr, rbl) {
  ctx.beginPath();
  ctx.moveTo(x + rtl, y); ctx.lineTo(x + w - rtr, y);
  ctx.arcTo(x + w, y, x + w, y + rtr, rtr); ctx.lineTo(x + w, y + h - rbr);
  ctx.arcTo(x + w, y + h, x + w - rbr, y + h, rbr); ctx.lineTo(x + rbl, y + h);
  ctx.arcTo(x, y + h, x, y + h - rbl, rbl); ctx.lineTo(x, y + rtl);
  ctx.arcTo(x, y, x + rtl, y, rtl); ctx.closePath();
}
//-- endfile --

//<< import { Utils } from './utils.js';
//-- file: ./utils.js --
//>> import { sceneRegistry } from './sys.js';
//>> import { Values } from './values.js';
//>> export { Utils };
class Utils {
  static classOfNode(node) {
    if (!node) return null;
    return sceneRegistry.meta[node.type]?.nodeClass || null;
  }
  static hasAffordance(node, phaseName) {
    return node && sceneRegistry.hasPhase(node.type, phaseName);
  }

  /* Pip affordances may come from the class or, failing that, from its
     declared pip kind — so a decorative node becomes draggable-by-edge
     merely by declaring itself a junction. */
  static pipsFn(node) {
    const cls = Utils.classOfNode(node);
    return cls?.getPips ?? cls?.meta?.pipKind?.getPips ?? null;
  }

  static setPipFn(node) {
    const cls = Utils.classOfNode(node);
    return cls?.setPipPos ?? cls?.meta?.pipKind?.setPipPos ?? null;
  }

  /* Detach a child without knowing what else its parent holds it by.  Most
     parents hold a subtree and nothing more; an arena also holds pip sets,
     and says so by answering removeChild. */
  static removeChild(parent, child, params) {
    const cls = Utils.classOfNode(parent);
    if (cls?.removeChild) return cls.removeChild(parent, child, params);
    const idx = parent?.subtree?.indexOf(child) ?? -1;
    if (idx >= 0) parent.subtree.splice(idx, 1);
  }

  /* Translate a node without knowing how it stores its position. */
  static moveBy(node, dx, dy) {
    const cls = Utils.classOfNode(node);
    if (cls?.moveBy) return cls.moveBy(Values, node, { dx, dy });
    const c = cls?.getCentreXY?.(Values, node, {});
    if (c && cls?.setXY) return cls.setXY(Values, node, { x: c.x + dx, y: c.y + dy });
    const v = Values.getValue(Values, node, {}) || {};
    Values.setValue(Values, node, {}, { x: (v.x || 0) + dx, y: (v.y || 0) + dy });
  }
}

//-- endfile --

/* ─────────────────────────────────────────────────────────────────────────────
make-camera — wrap a node so a pane can pan and zoom over it.

Split out of ModelUtils, which had become a facade over six node types: any
model that called one builder appeared to depend on all of them.  Three
nuggets, three honest dependency sets.
──────────────────────────────────────────────────────────────────────────── */

function makeZoomableCamera(child, opts = {}) {
  const cam = SYS.makeNode('pane-camera', {
    centerOrigin: opts.centerOrigin || false,
    zoom: opts.zoom || 1,
    scrollX: opts.scrollX || 0,
    scrollY: opts.scrollY || 0,
  }, [child]);
  return cam;
}


function autoFitCamera(camNode, paneW, paneH) {
  const frame = camNode._frameNode;
  if (!frame || !paneW || !paneH) return;

  const cw = frame.value.cw || 700, ch = frame.value.ch || 400;
  const p = frame.value.padding;
  let pl = 80, pr = 80, pt = 100, pb = 100;
  if (p != null) {
    if (typeof p === 'number') { pl = pr = pt = pb = p; }
    else { pl = p.left ?? 80; pr = p.right ?? 80; pt = p.top ?? 100; pb = p.bottom ?? 100; }
  }
  const totalW = cw + pl + pr;
  const totalH = ch + pt + pb;
  camNode.value.zoom = Math.min(paneW / totalW, paneH / totalH) * 0.92;
  camNode.value.scrollX = 0;
  camNode.value.scrollY = 0;
}
//-- endfile --


//<< import { PaneCameraNode } from './pane-camera-node.js';
//-- file: ./pane-camera-node.js --
//>> import { SYS } from './sys.js';
//>> export { PaneCameraNode };

/* ─────────────────────────────────────────────────────────────────────────────
PaneCameraNode — lightweight camera for per-pane 2D canvases.

Node value properties:
 centerOrigin — true  → world (0,0) maps to pane centre  (charts)
                false → world (0,0) maps to pane top-left (zones)
 zoom, scrollX, scrollY — pan / zoom state (mutated by DemoHarness2D)

DemoHarness2D applies DPR scaling with setTransform(dpr,0,0,dpr,0,0).
This node multiplies on top via ctx.transform so both layers compose.
──────────────────────────────────────────────────────────────────────────── */
class PaneCameraNode {

  static _offsets(ctxMix, node) {
    const v = node.value;
    const cx = v.centerOrigin ? ctxMix.W / 2 : 0;
    const cy = v.centerOrigin ? ctxMix.H / 2 : 0;
    return { cx, cy, z: v.zoom || 1, sx: v.scrollX || 0, sy: v.scrollY || 0 };
  }

  static before_draw2d(ctxMix, node, params) {
    const { cx, cy, z, sx, sy } = PaneCameraNode._offsets(ctxMix, node);
    ctxMix.ctx.transform(z, 0, 0, z, cx - sx * z, cy - sy * z);
  }

/* after_draw2d intentionally omitted — DemoHarness2D resets the 
 transform at the start of every frame so no restore is needed. */

  static before_hit_test(ctxMix, node, params) {
    const { cx, cy, z, sx, sy } = PaneCameraNode._offsets(ctxMix, node);
    node.value._savedHit = ctxMix.hitPoint;
    node.value._savedHitResult = ctxMix.hitResult;
    if (ctxMix.hitPoint) {
      ctxMix.hitPoint = {
        x: (ctxMix.hitPoint.x - cx) / z + sx,
        y: (ctxMix.hitPoint.y - cy) / z + sy,
      };
    }
  }

  static after_hit_test(ctxMix, node, params) {
    ctxMix.hitPoint = node.value._savedHit;

// Only wrap hits produced within this camera's subtree, not pre-existing ones
    if (ctxMix.hitResult?.interactions && ctxMix.hitResult !== node.value._savedHitResult) {
      const inner = ctxMix.hitResult.interactions;
      const { cx, cy, z, sx, sy } = PaneCameraNode._offsets(ctxMix, node);
      const toWorld = (px, py) => ({
        x: (px - cx) / z + sx,
        y: (py - cy) / z + sy,
      });

      if (inner.applyDrag) {
        const origDrag = inner.applyDrag;
        inner.applyDrag = (px, py) => {
          const w = toWorld(px, py);
          return origDrag(w.x, w.y);
        };
      }
      if (inner.endDrag) {
        const origEnd = inner.endDrag;
        inner.endDrag = (...args) => 
          origEnd(...args);
      }
    }
  }
}

//<< import { WordNode } from './word-node.js';
//-- file: ./word-node.js --
//>> import { SYS } from './sys.js';
//>> import { hexToRgba } from './paint.js';
//>> import { PipKinds } from './pip-kind.js';
//>> import { Values } from './values.js';
//>> export { WordNode };
function measureWord(ctx, text, font) {
  ctx.font = font;
  ctx.textBaseline = 'alphabetic'; // <-- Add this line to fix the offset

  const m = ctx.measureText(text);
  const asc = m.actualBoundingBoxAscent  || m.emHeightAscent  || 0;
  const dsc = m.actualBoundingBoxDescent || m.emHeightDescent || 0;

  return { width: m.width, ascent: asc, descent: dsc, height: asc + dsc };
}

const WORD_DEFAULTS = Object.freeze({
  fontFamily:     '"Inter", "Helvetica Neue", system-ui, sans-serif',
  fontSize:       28,
  fontWeight:     700,
  color:          '#e4dac6',
  opacity:        1.0,
  rotation:       0,
  haloColor:      '#000000',
  haloWidth:      0,
  haloOpacity:    0.35,
  highlightFill:  'rgba(255,255,255,0.06)',
  highlightPad:   6,
  highlightRadius: 4,
  scale:          1.0,
});

class WordNode {
// New Style: Metadata tells the system how to interact with this node
  static meta = {
    pipKind: PipKinds.JUNCTION,
    zOrder: 1,
    spawnOverrides: (wp) => ({ x: wp.x, y: wp.y, text: 'word' }),
    editableFields: (node) => [
      { key: 'text', label: 'Text', type: 'text', value: node.value.text || '' },
      { key: 'fontSize', label: 'Size', type: 'number', value: node.value.fontSize || WORD_DEFAULTS.fontSize },
      { key: 'rotation', label: 'Rotation', type: 'number', value: node.value.rotation || WORD_DEFAULTS.rotation },
      { key: 'color', label: 'Color', type: 'color', value: node.value.color || WORD_DEFAULTS.color },
    ],
  };

  static getCentreXY(res, node, params) {
    const v = res.getValue(res, node, params) || {};
    return { x: v.x || 0, y: v.y || 0 };
  }

  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params) || {};
    const p = { ...WORD_DEFAULTS, ...params };
    const text = v.text || '';
    if (!text) return;

// New Style: Zoom is handled naturally by the Camera context scale. 
// We no longer multiply fSize by zoom.
    const sc      = (p.scale || 1) * (v.scale || 1);
    const fSize   = (v.fontSize || p.fontSize) * sc;
    const weight  = v.fontWeight || p.fontWeight;
    const family  = v.fontFamily || p.fontFamily;
    const font    = `${weight} ${fSize.toFixed(1)}px ${family}`;
    const rot     = (v.rotation != null ? v.rotation : p.rotation) * Math.PI / 180;
    const opacity = (v.opacity != null ? v.opacity : p.opacity);

// Position is one field of the value like any other, read through the channel.
    const { x: cx, y: cy } = WordNode.getCentreXY(ctxMix, node, params);
    const ctx = ctxMix.ctx;

    ctx.save();
    ctx.globalAlpha *= opacity;
    ctx.translate(cx, cy);
    if (rot) ctx.rotate(rot);

    const meas = measureWord(ctx, text, font);

// ── highlight box behind selected words ──
    if (v.selected || v.hovered) {
    const pad = (p.highlightPad || 0); // No zoom multiplier needed
    const hr  = (p.highlightRadius || 0);
    const hx  = -meas.width / 2 - pad;
    const hy  = -meas.ascent - pad;
    const hw  = meas.width + pad * 2;
    const hh  = meas.height + pad * 2;
    
    ctx.fillStyle = p.highlightFill;
    if (ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(hx, hy, hw, hh, hr); ctx.fill();
    } else {
      ctx.fillRect(hx, hy, hw, hh);
    }

    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth   = 1.5;
    if (ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(hx, hy, hw, hh, hr); ctx.stroke();
    } else {
      ctx.strokeRect(hx, hy, hw, hh);
    }
    ctx.setLineDash([]);
  }

  // ── halo / outline ──
  const haloW = (v.haloWidth != null ? v.haloWidth : p.haloWidth) * sc;
  if (haloW > 0) {
    ctx.strokeStyle = hexToRgba(
      v.haloColor || p.haloColor,
      v.haloOpacity != null ? v.haloOpacity : p.haloOpacity
      );
    ctx.lineWidth   = haloW;
    ctx.lineJoin    = 'round';
    ctx.font        = font;
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.strokeText(text, 0, 0);
  }

  // ── text fill ──
  ctx.fillStyle    = v.color || p.color;
  ctx.font         = font;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, 0, 0);

  ctx.restore();
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt) return;

    const v = ctxMix.getValue(ctxMix, node, params) || {};
    const text = v.text || '';
    if (!text) return;

    const p = { ...WORD_DEFAULTS, ...params };
    const sc = (p.scale || 1) * (v.scale || 1);
    const fSize = (v.fontSize || p.fontSize) * sc;
    const weight = v.fontWeight || p.fontWeight;
    const family = v.fontFamily || p.fontFamily;
    const font = `${weight} ${fSize.toFixed(1)}px ${family}`;
    const rot = (v.rotation != null ? v.rotation : p.rotation) * Math.PI / 180;

  // No screen conversion needed: pt is already in world space.
    const { x: cx, y: cy } = WordNode.getCentreXY(ctxMix, node, params);

  // Transform hit point into the word's local frame
    let lx = pt.x - cx;
    let ly = pt.y - cy;
    if (rot) {
      const cos = Math.cos(-rot), sin = Math.sin(-rot);
      const rx = lx * cos - ly * sin;
      const ry = lx * sin + ly * cos;
      lx = rx; ly = ry;
    }

    const ctx = ctxMix.ctx;
    const meas = measureWord(ctx, text, font);
    const pad = 4;
    const halfW = meas.width / 2 + pad;
    const top = -meas.ascent - pad;
    const bot = meas.descent + pad;

    if (lx < -halfW || lx > halfW || ly < top || ly > bot) return;

    const dxHit = pt.x - cx;
    const dyHit = pt.y - cy;

  // New Style: Pass world coordinates directly in applyDrag
    ctxMix.hitResult = {
      node,
      interactions: {
        applyDrag(wx, wy) {
          Values.setValue(Values, node, params, { x: wx - dxHit, y: wy - dyHit });
          return node;
        },
      },
    };
  }
}

SYS.NODE_CLASSES.push({ name: 'word-node',        cls: WordNode });
//-- endfile --

//<< import { THREE, OrbitControls, loadThree, make3DPane } from './three-boot.js';
//-- file: ./three-boot.js --
//>> export { THREE, loadThree, make3DPane };

/* ─────────────────────────────────────────────────────────────────────────────
three-boot — the one place that knows Three.js exists.

THREE is a live binding: undefined until loadThree() resolves, and shared by
every 3D node thereafter.  Nodes import the binding, not a snapshot, so a
nugget may be read (and typed against) without Three.js being present at all.
A build with no 3D model drops this nugget and never touches the importmap.
──────────────────────────────────────────────────────────────────────────── */

let THREE, OrbitControls;
async function loadThree() {
  if (THREE) return;
  try {
    THREE = await import('three');
    OrbitControls = (await import('three/addons/controls/OrbitControls.js')).OrbitControls;
  } catch(e) { console.warn('Three.js failed to load.'); }
}

function make3DPane(container) {
  if (!THREE) return null;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, container.clientWidth / Math.max(1, container.clientHeight), 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const view = { scene, camera, renderer, controls, container };

  view.ro = new ResizeObserver(() => {
    if (view.container.clientWidth > 0 && view.container.clientHeight > 0) {
      view.camera.aspect = view.container.clientWidth / view.container.clientHeight;
      view.camera.updateProjectionMatrix();
      view.renderer.setSize(view.container.clientWidth, view.container.clientHeight);
    }
  });
  view.ro.observe(container);

  return view;
}

//>> import { SYS, sceneRegistry } from './sys.js';

/* ─────────────────────────────────────────────────────────────────────────────
HudPanel — standalone floating panel using sceneRegistry.walkPhase

Compatible with OmniWidget conventions so hud-* node types work in either
system. The ctxMix shape matches what OmniWidgets expect:

  parentEl       current DOM parent (pushed/popped by containers)
  parentStack    push/pop array
  params         live params object (built from controls); nodes read the
                 params argument of the walk, never this directly
  setParam       (id, val) => the one way to write a param
  render         () => trigger redraw
  onParamChange  (id, val) => notification callback
  clearActivePreset  () => clear preset highlights
  panel          null (no OmniControlPanel)

Node conventions (same as OmniWidget):
  node.value     serialisable data (id, label, min, max, step, options, …)
  node.inst      non-serialisable (action callbacks)
  node.subtree   child nodes

Drop this file into an all-in-one stnda build by pasting after the
sceneRegistry definition. No imports needed.
──────────────────────────────────────────────────────────────────────────── */


// ═══════════════════════════════════════════════════════════════
//  NODE CLASSES — compatible with both HudPane and OmniWidget
// ═══════════════════════════════════════════════════════════════

class HudPanelNode {

  static before_mount(ctxMix, node, params) {
    const v = node.value || {};

    const root = document.createElement('div');
    root.className = 'hud-panel';
    root.style.top  = (v.position?.top  ?? 60) + 'px';
    root.style.left = (v.position?.left ?? 12) + 'px';

    const header = document.createElement('h3');
    header.innerHTML = `::: &nbsp; ${v.title || 'Controls'}`;
    root.appendChild(header);
    HudPanelNode._makeDraggable(root, header);

    node._el = root;

    ctxMix.parentStack.push(ctxMix.parentEl);
    ctxMix.parentEl = root;
  }

  static after_mount(ctxMix, node, params) {
    const container = ctxMix.parentStack.pop();
    container.appendChild(node._el);
    ctxMix.parentEl = container;
  }

  static _makeDraggable(root, handle) {
    let dragging = false, sx, sy, sl, st;
    handle.addEventListener('mousedown', e => {
      dragging = true; handle.style.cursor = 'grabbing';
      sx = e.clientX; sy = e.clientY;
      const r = root.getBoundingClientRect();
      sl = r.left; st = r.top;
      root.style.right = 'auto';
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      root.style.left = (sl + e.clientX - sx) + 'px';
      root.style.top  = (st + e.clientY - sy) + 'px';
    });
    window.addEventListener('mouseup', () => {
      if (dragging) { dragging = false; handle.style.cursor = 'grab'; }
    });
  }
}


class HudSliderNode {
  static mount(ctxMix, node, params) {
    const v = node.value || {};
    const { id, label, min = 0, max = 1, step = 0.01 } = v;
    const initVal = params[id] ?? v.value ?? min;

    const row = document.createElement('label');
    const span = document.createElement('span');
    span.textContent = label;
    row.appendChild(span);

    const input = document.createElement('input');
    Object.assign(input, { type: 'range', min, max, step, value: initVal });
    row.appendChild(input);

    const val = document.createElement('span');
    val.className = 'val';
    val.textContent = parseFloat(initVal).toFixed(step % 1 === 0 ? 0 : 2);
    row.appendChild(val);

    input.addEventListener('input', () => {
      const num = parseFloat(input.value);
      val.textContent = num.toFixed(step % 1 === 0 ? 0 : 2);
      ctxMix.setParam(id, num);
      ctxMix.onParamChange(id, num);
      ctxMix.render();
    });

    if (id) { input.id = id; val.id = `${id}-val`; }
    ctxMix.parentEl.appendChild(row);
  }
}


class HudButtonNode {
  static mount(ctxMix, node, params) {
    const v = node.value || {};
    const btn = document.createElement('button');
    btn.className = 'hud-btn' + (v.cls ? ' ' + v.cls : '');
    btn.textContent = v.label;
    btn.addEventListener('click', node.inst?.action || (() => {}));
    ctxMix.parentEl.appendChild(btn);
  }
}


class HudCheckboxNode {
  static mount(ctxMix, node, params) {
    const v = node.value || {};
    const { id, label } = v;
    const initVal = params[id] ?? v.value ?? false;

    const row = document.createElement('label');
    const span = document.createElement('span');
    span.textContent = label;
    row.appendChild(span);

    const sw = document.createElement('div');
    sw.className = 'toggle-switch';

    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!initVal;
    input.addEventListener('change', () => {
      ctxMix.setParam(id, input.checked);
      ctxMix.onParamChange(id, input.checked);
      ctxMix.render();
    });

    const slider = document.createElement('span');
    slider.className = 'toggle-slider';

    sw.appendChild(input);
    sw.appendChild(slider);
    row.appendChild(sw);

    if (id) input.id = id;
    ctxMix.parentEl.appendChild(row);
  }
}


class HudSelectNode {
  static mount(ctxMix, node, params) {
    const v = node.value || {};
    const { id, label, options = [] } = v;
    const initVal = params[id] ?? v.value;

    const row = document.createElement('label');
    const span = document.createElement('span');
    span.textContent = label;
    row.appendChild(span);

    const select = document.createElement('select');
    for (const opt of options) {
      const option = document.createElement('option');
      option.value = opt[0];
      option.textContent = opt[1];
      if (opt[0] === String(initVal)) option.selected = true;
      select.appendChild(option);
    }
    select.addEventListener('change', () => {
      ctxMix.setParam(id, select.value);
      ctxMix.onParamChange(id, select.value);
      ctxMix.render();
    });

    row.appendChild(select);
    if (id) select.id = id;
    ctxMix.parentEl.appendChild(row);
  }
}


class HudColorNode {
  static mount(ctxMix, node, params) {

// ═══════════════════════════════════════════════════════════════
//  CONTROL TYPES — a control's type, resolved through the registry
// ═══════════════════════════════════════════════════════════════
//
//  'hud-<type>' if a node class of that name is registered, else <type>
//  itself (so { type: 'morph-slider' } mounts the widget), else a slider,
//  which is also what a control with no type is.  There is no map to keep in
//  step: pushing a 'hud-<type>' class is what makes a control type exist.

function hudNodeType(type) {
  const meta = sceneRegistry.meta;
  if (!type) return 'hud-slider';
  if (meta['hud-' + type]) return 'hud-' + type;
  if (meta[type]) return type;
  return 'hud-slider';
}


// ═══════════════════════════════════════════════════════════════
//  HudPanel
// ═══════════════════════════════════════════════════════════════

class HudPanel {

  /**
   * @param {Object}   opts
   * @param {string}   opts.title       — panel heading
   * @param {Element}  opts.container   — DOM parent for the floating panel
   * @param {Array}    opts.controls    — control definitions
   * @param {Function} opts.onChange     — (id, val) notification
   * @param {Function} [opts.onRender]  — () called after every param change
   * @param {Object}   [opts.position]  — { top, left }
   * @param {Object}   [opts.params]    — reuse an existing params object
   */
  constructor({
    title     = 'Controls',
    container = document.body,
    controls  = [],
    onChange,
    onRender,
    position  = { top: 60, left: 12 },
    params,
  } = {}) {
    this._onChange = onChange || (() => {});
    this._onRender = onRender || (() => {});

    HudPanel._injectStyles();

    // ── Build params from controls (or reuse provided) ──
    this.params = params || {};
    if (!params) {
      for (const c of controls) {
        if (c.id && c.value !== undefined) {
          this.params[c.id] = c.value;
        }
      }
    }

    // ── Coerce controls into AST ────────────────────────
    const children = controls.map(c => {
      const type = hudNodeType(c.type);
      // Separate serialisable from non-serialisable
      const { action, ...rest } = c;
      return {
        type,
        value:   rest,
        inst:    action ? { action } : {},
        subtree: [],
      };
    });

    const root = {
      type:    'hud-panel',
      value:   { title, position },
      subtree: children,
    };

    // ── Minimal WidgetContext-compatible ctxMix ──────────
    const self = this;

    const ctxMix = {
      parentEl:       container,
      parentStack:    [],
      iterators:      [],
      flyweight:      {},

      setParam(id, val) {
        self.params[id] = val;
      },
      render() {
        self._onRender();
      },
      onParamChange(id, val) {
        self._onChange(id, val);
      },
      clearActivePreset() {
        // Future: clear preset button highlights
      },
      closeMenu() {},
    };

    // ── Walk ─────────────────────────────────────────────
    sceneRegistry.runPhases(ctxMix, root, this.params, ['mount']);

    // ── Collect results ──────────────────────────────────
    this._root = root._el;
    this._ast  = root;  // retained for future update walks
  }

  destroy() {
    if (this._root?.parentNode) {
      this._root.parentNode.removeChild(this._root);
    }
  }

  /** Update a control's DOM to reflect a new value (e.g. from a preset). */
  updateControl(id, value) {
    this.params[id] = value;
    const input = document.getElementById(id);
    if (input) {
      if (input.type === 'checkbox') input.checked = !!value;
      else input.value = value;
    }
    const valEl = document.getElementById(`${id}-val`);
    if (valEl) {
      valEl.textContent = typeof value === 'number'
        ? value.toFixed(value % 1 === 0 ? 0 : 2) : String(value);
    }
  }

  /** Bulk update from a preset snapshot. */
  applyPreset(preset) {
    for (const [id, value] of Object.entries(preset)) {
      this.updateControl(id, value);
    }
  }


  // ── Styles (injected once) ────────────────────────────

  static _injected = false;

  static _injectStyles() {
    if (HudPanel._injected) return;

//<< import { PlanetNode } from './planet-node.js';
//-- file: ./planet-node.js --
//>> import { SYS } from './sys.js';
//>> import { THREE } from './three-boot.js';
//>> export { PlanetNode };
class PlanetNode {
  static build3d(ctxMix, node, params) {
    if (node.value.group) return;
    const v = node.value;
    v._crustRadius = v.crustRadius ?? 1;
    v._coreRadius = v.coreRadius ?? 0.6;
    v.group = new THREE.Group();
    v.clipPlane1 = new THREE.Plane(new THREE.Vector3(1,0,0), 0);
    v.clipPlane2 = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
    v.clippingPlanes = [v.clipPlane1, v.clipPlane2];
    const tl = new THREE.TextureLoader();
    const et = tl.load(v.earthTexture ?? 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    v.crustMat = new THREE.MeshPhongMaterial({map:et, clippingPlanes:v.clippingPlanes, clipIntersection:true, side:THREE.DoubleSide});
    v.coreMat = new THREE.MeshPhongMaterial({color:0xff6600, emissive:0x441100, clippingPlanes:v.clippingPlanes, clipIntersection:true, side:THREE.DoubleSide});
    v.gridMat = new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:0.2, clippingPlanes:v.clippingPlanes, clipIntersection:true});
    v.planeMat1 = new THREE.MeshPhongMaterial({side:THREE.DoubleSide, transparent:true, opacity:0.9});
    v.planeMat2 = new THREE.MeshPhongMaterial({side:THREE.DoubleSide, transparent:true, opacity:0.9});
    const r = v._crustRadius;
    v.crust = new THREE.Mesh(new THREE.SphereGeometry(r, 64, 64), v.crustMat);
    v.core = new THREE.Mesh(new THREE.SphereGeometry(v._coreRadius, 64, 64), v.coreMat);
    v.grid = new THREE.Mesh(new THREE.SphereGeometry(r*1.005, 32, 32), v.gridMat);
    const pg = new THREE.CircleGeometry(r, 64, -Math.PI/2, Math.PI);
    v.plane1 = new THREE.Mesh(pg, v.planeMat1);
    v.plane1.rotation.y = Math.PI/2;
    v.plane2 = new THREE.Mesh(pg, v.planeMat2);
    v.plane2.rotation.z = Math.PI;
    v.group.add(v.crust, v.core, v.grid, v.plane1, v.plane2);
    PlanetNode._updateRadialTexture(node, v._coreRadius, 1.0);
  }
  static update3d(ctxMix, node, params) {
    const v = node.value;
    if (!v.group) return;
    const rotRad = ((params.rotation??0)*Math.PI)/180;
    const radStart = -((params.wedgeStart??0)*Math.PI)/180;
    const rad1 = radStart - rotRad;
    v.clipPlane1.normal.set(Math.cos(rad1), 0, Math.sin(rad1));
    v.plane1.rotation.y = -radStart + Math.PI/2;
    const radEnd = radStart + Math.PI - ((params.wedgeAngle??90)*Math.PI)/180;
    const rad2 = radEnd - rotRad;
    v.clipPlane2.normal.set(Math.cos(rad2), 0, Math.sin(rad2));
    v.plane2.rotation.y = -radEnd + Math.PI/2;
    const cr = params.coreRadius ?? v._coreRadius;
    if (cr !== v._coreRadius) {
      v._coreRadius = cr;
      v.group.remove(v.core);
      v.core.geometry.dispose();
      v.core.geometry = new THREE.SphereGeometry(cr, 64, 64);
      v.group.add(v.core);
    }
    if (params.planeOpacity !== undefined) {
      v.planeMat1.opacity = params.planeOpacity;
      v.planeMat2.opacity = params.planeOpacity;
    }
    PlanetNode._updateRadialTexture(node, v._coreRadius, params.coreOpacity ?? 1.0);
  }
  static _updateRadialTexture(node, coreRadius, coreOpacity) {
    const v = node.value;
    if (v.radialTexture) v.radialTexture.dispose();
    const cv = document.createElement('canvas');
    const sz = 512; cv.width = sz; cv.height = sz;
    const ctx = cv.getContext('2d');
    const cx = sz/2, cy = sz/2, maxR = sz/2;
    ctx.clearRect(0,0,sz,sz);
    const mg = ctx.createRadialGradient(cx,cy,0,cx,cy,maxR);
    mg.addColorStop(0,'#d4a373'); mg.addColorStop(0.5,'#8b6f47'); mg.addColorStop(1,'#654321');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(cx,cy,maxR,0,Math.PI*2); ctx.fill();
    const cR = maxR * coreRadius;
    if (coreOpacity < 1) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = `rgba(0,0,0,${1-coreOpacity})`;
      ctx.beginPath(); ctx.arc(cx,cy,cR,0,Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    if (coreOpacity > 0) {
      ctx.globalAlpha = coreOpacity;
      const cg = ctx.createRadialGradient(cx,cy,0,cx,cy,cR);
      cg.addColorStop(0,'#ffff00'); cg.addColorStop(0.3,'#ff8800');
      cg.addColorStop(0.7,'#ff4500'); cg.addColorStop(1,'#cc3300');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(cx,cy,cR,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
    for (let r=0.2; r<=1; r+=0.2) { ctx.beginPath(); ctx.arc(cx,cy,maxR*r,0,Math.PI*2); ctx.stroke(); }
      v.radialTexture = new THREE.CanvasTexture(cv);
    v.radialTexture.needsUpdate = true;
    v.planeMat1.map = v.radialTexture; v.planeMat1.needsUpdate = true;
    v.planeMat2.map = v.radialTexture; v.planeMat2.needsUpdate = true;
  }
}
SYS.NODE_CLASSES.push({ name: 'planet-node',      cls: PlanetNode });

//<< import { HtmlBoxNode, HtmlTextNode, HtmlFill } from './html-nodes.js';
//-- file: ./html-nodes.js --
//>> import { SYS } from './sys.js';
//>> export { HtmlBoxNode, HtmlTextNode, HtmlAdoptNode, HtmlFill, skipChildren };

/* ─────────────────────────────────────────────────────────────────────────────
html-nodes — the structural HTML node types: a box that holds nodes, a text
leaf, and an adopted element.  The widget panels are laid out with nothing
else.

Both are retained: mount creates the element once, update re-applies what can
change.  What can change is written as a template, '{level}' in a text or a
style being filled from params, so neither type needs a bind field, and a node
whose text has no braces costs nothing on update.

Named html-box and html-text because 'box' and 'text' are already 2D types in
the library's registry.  A type may carry handlers for several backends, but a
name that means two different things is a rosetta problem waiting.
──────────────────────────────────────────────────────────────────────────── */

/** Stop the walk descending into this node's children: they belong to
    another backend, or the node mounts copies of them itself.  The walker
    pushed an iterator before calling before_*; replacing it ends the loop at
    once.  Only for before_* handlers: a leaf has no iterator of its own. */
function skipChildren(ctxMix) {
  ctxMix.iterators[ctxMix.iterators.length - 1] = { next: () => null };
}

class HtmlFill {
  static has(s) { return typeof s === 'string' && s.includes('{'); }
  static fill(s, params) {
    return String(s ?? '').replace(/\{(\w+)\}/g, (_, k) => params?.[k] ?? '');
  }
}

class HtmlBoxNode {

  /* What the Selected panel offers when a box is clicked.  Every node class
     here declares its own; the panel builds itself from the list. */
  static meta = {
    editableFields: (node) => [
      { key: 'class', label: 'Class', type: 'text', value: node.value.class || '' },
      { key: 'style', label: 'Style', type: 'text', value: node.value.style || '' },
    ],
  };

  /* attrs: { id, role, 'data-x', … } are set as attributes, for markup that
     CSS or other code finds by attribute.  (Not value.id, which is the
     node's own id.)

     Layout fields, as classes so a style template never clobbers them:
       scroll: 'y' | 'x' | 'both'   the box scrolls (D+'s chat scroller)
       sticky: true                 the box pins to the top of the nearest
                                    scrolling box, and gets is-stuck while
                                    pinned (D+'s sticky heads)
     The first parameter is deliberately not named ctxMix: the registry
     registers any static whose first parameter is, as a phase. */
  static _make(mix, node, params) {
    const v = node.value || {};
    const el = document.createElement(v.tag || 'div');
    if (v.class) el.className = v.class;
    if (v.style) el.style.cssText = HtmlFill.fill(v.style, params);
    for (const [k, x] of Object.entries(v.attrs || {})) el.setAttribute(k, x);
    if (v.scroll) el.classList.add('is-scroll-' + v.scroll);
    node.inst = { ...(node.inst || {}), el };
    mix.parentEl.appendChild(el);
    if (v.sticky) HtmlBoxNode._stick(node, el);
    return el;
  }

  /* is-stuck needs the scroller as an observer root, which exists only once
     the pane is in the document; so the observer is made on the first frame
     the element is connected. */
  static _stick(node, el) {
    el.classList.add('is-sticky');
    const sentinel = document.createElement('div');
    sentinel.className = 'sticky-sentinel';
    sentinel.style.cssText = 'height:1px;margin-bottom:-1px';   // a line to observe, taking no space
    el.before(sentinel);
    let io = null, frame = 0;
    const setup = () => {
      if (!el.isConnected) { frame = requestAnimationFrame(setup); return; }
      const root = el.parentElement.closest('.is-scroll-y, .is-scroll-both');
      io = new IntersectionObserver(([entry]) => {
        const above = entry.boundingClientRect.top < (entry.rootBounds?.top ?? 0);
        el.classList.toggle('is-stuck', !entry.isIntersecting && above);
      }, { root, threshold: 0 });
      io.observe(sentinel);
    };
    frame = requestAnimationFrame(setup);
    node.inst.unstick = () => { cancelAnimationFrame(frame); io?.disconnect(); sentinel.remove(); };
  }
  static before_teardown(ctxMix, node, params) { node.inst?.unstick?.(); }
  static teardown(ctxMix, node, params)        { node.inst?.unstick?.(); }

  // A box with children: they mount inside it.
  static before_mount(ctxMix, node, params) {
    const el = HtmlBoxNode._make(ctxMix, node, params);
    ctxMix.parentStack.push(ctxMix.parentEl);
    ctxMix.parentEl = el;
  }
  static after_mount(ctxMix, node, params) {
    ctxMix.parentEl = ctxMix.parentStack.pop();
  }
  // An empty box: the walker calls the bare phase for a leaf.
  static mount(ctxMix, node, params) {
    HtmlBoxNode._make(ctxMix, node, params);
  }

  static _restyle(node, params) {
    const v = node.value || {}, el = node.inst?.el;
    if (el && HtmlFill.has(v.style)) el.style.cssText = HtmlFill.fill(v.style, params);
  }
  static before_update(ctxMix, node, params) { HtmlBoxNode._restyle(node, params); }
  static update(ctxMix, node, params)        { HtmlBoxNode._restyle(node, params); }
}

class HtmlTextNode {

  static meta = {
    editableFields: (node) => [
      { key: 'text',  label: 'Text',  type: 'text', value: node.value.text || '' },
      { key: 'class', label: 'Class', type: 'text', value: node.value.class || '' },
    ],
  };
  static mount(ctxMix, node, params) {
    const v = node.value || {};
    const el = document.createElement(v.tag || 'div');
    if (v.class) el.className = v.class;
    el.textContent = HtmlFill.fill(v.text, params);
    node.inst = { ...(node.inst || {}), el };
    ctxMix.parentEl.appendChild(el);
  }
  static update(ctxMix, node, params) {
    const v = node.value || {}, el = node.inst?.el;
    if (el && HtmlFill.has(v.text)) el.textContent = HtmlFill.fill(v.text, params);
  }
}

/* An element made outside the scene, placed in it: a control panel that holds
   its container for life, say.  from names it in the harness's paneConfig
   elements.  The scene owns where it goes, not what is inside it, so
   teardown leaves it alone; a remount just moves it. */
class HtmlAdoptNode {
  static mount(ctxMix, node, params) {
    const el = ctxMix.harness?.paneConfig?.elements?.[node.value?.from];
    if (!el) { console.warn(`html-adopt: no element '${node.value?.from}'`); return; }
    node.inst = { ...(node.inst || {}), el };
    ctxMix.parentEl.appendChild(el);
  }
}

SYS.NODE_CLASSES.push({ name: 'html-box',         cls: HtmlBoxNode });
SYS.NODE_CLASSES.push({ name: 'html-text',        cls: HtmlTextNode });
SYS.NODE_CLASSES.push({ name: 'html-adopt',       cls: HtmlAdoptNode });

//>> import { SYS } from './sys.js';

/* ─────────────────────────────────────────────────────────────────────────────
FileDropWidget — a drop zone that is also a click-to-choose button.

Ported from FileDropWidget in js/omni-support/omni-widget.js.  Changes:
- The label is set as text, not innerHTML.
- No element id: ids are page-global, and the HUD finds its controls by id.
- accept and multiple are read at click time, so a model that changes them
  (the HUD's Accept select, here) takes effect without a remount.
- update re-applies the label; node.inst keeps the elements, beside onDrop.

The dropped files are the node's own event, 'files': on: { files: 'emit
received' } hands them to the model as ctx.data.files.  (node.inst.onDrop,
the route this replaced, still works where nothing handles the event.)
──────────────────────────────────────────────────────────────────────────── */

class FileDropWidget {

  static meta = {
    editableFields: (node) => [
      { key: 'label',    label: 'Label',    type: 'text',     value: node.value.label || '' },
      { key: 'accept',   label: 'Accept',   type: 'text',     value: node.value.accept || '*' },
      { key: 'multiple', label: 'Multiple', type: 'checkbox', value: !!node.value.multiple },
    ],
  };

  static mount(ctxMix, node, params) {
    const v = node.value || {};
    const drop = document.createElement('div');
    drop.className = 'file-drop';

    const icon = document.createElement('div');
    icon.className = 'file-drop-icon';
    icon.textContent = '📁';
    const label = document.createElement('div');
    label.textContent = v.label || 'Drop files here';
    drop.append(icon, label);

    // The drop is an event of this node's own: on: { files: … } handles it.
    // inst.onDrop is the older route, kept for callers that set it.
    const deliver = (files) => {
      if (ctxMix.fire?.(node, 'files', { files })) return;
      if (node.inst?.onDrop) node.inst.onDrop(files, ctxMix.panel);
    };

    drop.addEventListener('dragover', (e) => {
      e.preventDefault();
      drop.classList.add('dragover');
    });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('dragover');
      deliver(e.dataTransfer.files);
    });
    drop.addEventListener('click', () => {
      const now = node.value || {};
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = !!now.multiple;
      input.accept = now.accept || '*';
      input.onchange = () => deliver(input.files);
      input.click();
    });

    node.inst = { ...(node.inst || {}), el: drop, labelEl: label };
    ctxMix.parentEl.appendChild(drop);
  }

  static update(ctxMix, node, params) {
    const labelEl = node.inst?.labelEl;
    if (labelEl) labelEl.textContent = node.value?.label || 'Drop files here';
  }
}

SYS.NODE_CLASSES.push({ name: 'filedrop',         cls: FileDropWidget });
