/* ─────────────────────────────────────────────────────────────────────────────
MorphSliderWidget — the morphable range slider: a track, a fill and a thin
pip whose geometry is driven by the --ms-* CSS variables.

Taken from the panopticon's own copy, which lived inside pipped-edge-ref-node
(it belongs in a nugget of its own; here it has one) and which is the HUD
dialect of the OmniWidget original: it writes through ctxMix.setParam rather
than ctxMix.currentParams.  Changes:
- The param is node.value.bind, falling back to node.value.id, so a pane
  widget can be bound without its node id doubling as a param name.
- Element ids only for a HUD control (an id and no bind).  HudPanel's
  updateControl finds controls by id; a pane widget sharing that id would
  steal the lookup.
- format names a format.<name> function in SYS.FUNCTIONS.  The panopticon
  copy called a formatValue that no nugget declared, which only mattered once
  a node set format.
- update moves the slider when the param changed from elsewhere (the HUD).
- The compatibility hack that allowed values directly on the node is gone.

Registered as 'morph-slider', so HudPanel's type map bridges to it: a HUD
control of type 'morph-slider' mounts this class.
──────────────────────────────────────────────────────────────────────────── */

class MorphSliderWidget {

  /* bind is editable too: point a slider at another param and it follows
     that one instead. */
  static meta = {
    editableFields: (node) => [
      { key: 'label',  label: 'Label',  type: 'text',   value: node.value.label || '' },
      { key: 'bind',   label: 'Param',  type: 'text',   value: node.value.bind ?? node.value.id ?? '' },
      { key: 'min',    label: 'Min',    type: 'number', value: node.value.min ?? 0 },
      { key: 'max',    label: 'Max',    type: 'number', value: node.value.max ?? 100 },
      { key: 'step',   label: 'Step',   type: 'number', value: node.value.step ?? 1 },
      { key: 'format', label: 'Format', type: 'select', value: node.value.format ?? '',
        options: [['', 'auto'], ...SYS.FUNCTIONS
          .filter((r, i, all) => r.name.startsWith('format.') && SYS.named(all, r.name) === r)
          .map(r => [r.name.slice(7), r.label ?? r.name.slice(7)])] },
    ],
  };

  static mount(ctxMix, node, params) {
    const v = node.value || {};
    const pid = v.bind ?? v.id;
    const initVal = v.isData
      ? (v.dataValue || v.default)
      : (params[pid] ?? v.default ?? v.min ?? 0);

    const { el, valEl } = MorphSliderWidget.buildMorphSlider({
      label:    v.label,
      min:      v.min ?? 0,
      max:      v.max ?? 100,
      step:     v.step,
      value:    initVal,
      disabled: v.disabled,
      format:   v.format ? (x => MorphSliderWidget.formatValue(x, v.format)) : undefined,
      onChange: x => {
        if (v.isData) {
          ctxMix.onParamChange(pid, x, true, ctxMix.panel);
        } else {
          ctxMix.setParam(pid, x);
          ctxMix.onParamChange(pid, x, false, ctxMix.panel);
        }
        if (node.inst?.onChange) node.inst.onChange(x, ctxMix.panel);
        ctxMix.render();
        ctxMix.clearActivePreset();
      },
    });

    if (v.id !== undefined && v.bind === undefined) {
      el.id = pid;
      valEl.id = `${pid}-val`;
    }
    el.dataset.sliderId = pid;
    node.inst = { ...(node.inst || {}), el };
    ctxMix.parentEl?.appendChild(el);
    return el;
  }

  static update(ctxMix, node, params) {
    const v = node.value || {}, el = node.inst?.el;
    const x = params[v.bind ?? v.id];
    if (el && x !== undefined && el._getValue() !== +x) el._setValue(x);
  }

  /* A named format from SYS.FUNCTIONS, else a plain number at sensible precision. */
  static formatValue(val, format) {
    if (typeof format === 'function') return format(val);
    if (typeof val !== 'number') return String(val ?? '');
    const named = SYS.named(SYS.FUNCTIONS, 'format.' + format);
    if (named) return named.fn(val);
    if (Math.abs(val) >= 100) return val.toFixed(0);
    if (Math.abs(val) >= 10)  return val.toFixed(1);
    return val.toFixed(2);
  }

  // ── Static factory — the core DOM builder ───────────────────
  //
  //  Returns { el, setValue(v), getValue(), valEl } where el is the root
  //  .morph-slider div and setValue repositions the pip, fill and readout
  //  programmatically (preset morph, param sync and so on).

  static buildMorphSlider(opts) {
    const min = +opts.min, max = +opts.max, step = +(opts.step || 1);
    const fmt = opts.format || (v => {
      // Auto-format: up to 2 decimals if step is fractional
      return step % 1 !== 0 ? (+v).toFixed(2) : String(Math.round(+v));
    });

    const el = document.createElement('div');
    el.className = 'morph-slider';
    if (opts.disabled) el.style.opacity = '0.4';

    const track = document.createElement('div');
    track.className = 'ms-track';
    const fill = document.createElement('div');
    fill.className = 'ms-fill';
    track.appendChild(fill);

    const pip = document.createElement('div');
    pip.className = 'ms-pip';

    const lbl = document.createElement('span');
    lbl.className = 'ms-label';
    lbl.textContent = opts.label || '';

    const val = document.createElement('span');
    val.className = 'ms-val';

    el.append(track, pip, lbl, val);

    // ── Internal state ───────────────────────────────────
    let currentValue = +(opts.value ?? min);

    function pctFromValue(v) {
      return max === min ? 0 : (v - min) / (max - min);
    }

    function valueFromPct(pct) {
      let v = min + pct * (max - min);
      // Snap to step
      v = Math.round(v / step) * step;
      return Math.max(min, Math.min(max, +v.toFixed(10)));
    }

    function render(v) {
      const pct = pctFromValue(v) * 100;
      fill.style.width = pct + '%';
      pip.style.left   = pct + '%';
      val.textContent  = fmt(v);
    }

    // Public: set value from outside (preset morph, param sync)
    function setValue(v) {
      currentValue = +v;
      render(currentValue);
    }

    render(currentValue);

    // ── Pointer interaction ──────────────────────────────
    if (!opts.disabled) {
      const update = (clientX) => {
        const rect = track.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        currentValue = valueFromPct(pct);
        render(currentValue);
        if (opts.onChange) opts.onChange(currentValue);
      };

      let engaged = false;

      el.addEventListener('pointerdown', e => {
        engaged = true;
        el.classList.add('engaged');
        el.setPointerCapture(e.pointerId);
        update(e.clientX);
      });
      el.addEventListener('pointermove', e => {
        if (engaged) update(e.clientX);
      });
      el.addEventListener('pointerup', () => {
        engaged = false;
        el.classList.remove('engaged');
      });
      el.addEventListener('pointercancel', () => {
        engaged = false;
        el.classList.remove('engaged');
      });
    }

    el._valEl    = val;
    el._setValue = setValue;
    el._getValue = () => currentValue;

    // Backward-compat: the panel reads/writes .value like an <input>.
    // defineProperty so it's not enumerable (won't confuse iteration).
    Object.defineProperty(el, 'value', {
      get: () => currentValue,
      set: v => { setValue(+v); },
      configurable: true,
    });

    return { el, setValue, getValue: () => currentValue, valEl: val };
  }
}

SYS.NODE_CLASSES.push({ name: 'morph-slider',     cls: MorphSliderWidget });
//-- endfile --

/* ─────────────────────────────────────────────────────────────────────────────
ColorPickerWidget — a swatch that opens a popup of colour input plus alpha
slider, writing an eight-digit #rrggbbaa.

Ported from ColorPickerWidget in js/omni-support/omni-widget.js.  Changes:
- Writes through ctxMix.setParam and reports through ctxMix.onParamChange.
  The original wrote currentParams directly and never reported, so nothing
  outside the panel heard a colour change.
- The param is node.value.bind, falling back to node.value.id; no element ids.
- The document-level click that closes the popup is removed at teardown.  The
  original added one per mount and never removed it.
- update re-applies the colour when the param changed from elsewhere.
- parseHex and formatHex are statics, not module functions.
──────────────────────────────────────────────────────────────────────────── */

class ColorPickerWidget {

  static meta = {
    editableFields: (node) => [
      { key: 'label', label: 'Label', type: 'text', value: node.value.label || '' },
      { key: 'bind',  label: 'Param', type: 'text', value: node.value.bind ?? node.value.id ?? '' },
    ],
  };

  static mount(ctxMix, node, params) {
    const v = node.value || {};
    const pid = v.bind ?? v.id;
    const initVal = params[pid] ?? v.default ?? '#ffffffff';

    const controlEl = document.createElement('div');
    controlEl.className = 'control sc-color-control';

    const label = document.createElement('label');
    const nameSpan = document.createElement('span');
    nameSpan.textContent = v.label || '';
    const valSpan = document.createElement('span');
    valSpan.textContent = initVal;
    label.append(nameSpan, valSpan);

    const swatch = document.createElement('button');
    swatch.className = 'sc-color-swatch';
    swatch.style.backgroundColor = initVal;

    const popup = document.createElement('div');
    popup.className = 'sc-color-popup';
    popup.style.display = 'none';

    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = initVal.slice(0, 7);

    const alphaRow = document.createElement('div');
    alphaRow.className = 'sc-color-alpha-row';
    const alphaLabel = document.createElement('span');
    alphaLabel.textContent = 'Alpha';
    const alphaSlider = document.createElement('input');
    alphaSlider.type = 'range';
    alphaSlider.min = 0; alphaSlider.max = 1; alphaSlider.step = 0.01;
    alphaSlider.value = ColorPickerWidget.parseHex(initVal).a;
    alphaRow.append(alphaLabel, alphaSlider);
    popup.append(colorInput, alphaRow);

    const writeColor = () => {
      const rgb = ColorPickerWidget.parseHex(colorInput.value);
      rgb.a = parseFloat(alphaSlider.value);
      const hex = ColorPickerWidget.formatHex(rgb);
      swatch.style.backgroundColor = hex;
      valSpan.textContent = hex;
      ctxMix.setParam(pid, hex);
      ctxMix.onParamChange(pid, hex, false, ctxMix.panel);
      ctxMix.render();
      ctxMix.clearActivePreset();
    };
    colorInput.addEventListener('input', writeColor);
    alphaSlider.addEventListener('input', writeColor);

    swatch.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasHidden = popup.style.display === 'none';
      document.querySelectorAll('.sc-color-popup')
              .forEach(p => p.style.display = 'none');
      popup.style.display = wasHidden ? '' : 'none';
    });
    const closeOnOutside = (e) => {
      if (!popup.contains(e.target) && e.target !== swatch) popup.style.display = 'none';
    };
    document.addEventListener('click', closeOnOutside);

    controlEl.append(label, swatch, popup);
    node.inst = {
      ...(node.inst || {}),
      el: controlEl, swatch, valSpan, colorInput, alphaSlider,
      offDocument: () => document.removeEventListener('click', closeOnOutside),
    };
    ctxMix.parentEl.appendChild(controlEl);
  }

  static update(ctxMix, node, params) {
    const v = node.value || {}, i = node.inst;
    const hex = params[v.bind ?? v.id];
    if (!i?.el || typeof hex !== 'string' || hex === i.valSpan.textContent) return;
    i.swatch.style.backgroundColor = hex;
    i.valSpan.textContent = hex;
    i.colorInput.value = hex.slice(0, 7);
    i.alphaSlider.value = ColorPickerWidget.parseHex(hex).a;
  }

  static teardown(ctxMix, node, params) {
    node.inst?.offDocument?.();
  }

  static parseHex(hex) {
    const h = String(hex).replace('#', '');
    return {
      r: parseInt(h.slice(0, 2), 16),
      g: parseInt(h.slice(2, 4), 16),
      b: parseInt(h.slice(4, 6), 16),
      a: h.length >= 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1,
    };
  }

  static formatHex({ r, g, b, a }) {
    const hx = (x) => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, '0');
    return '#' + hx(r) + hx(g) + hx(b) + hx((a ?? 1) * 255);
  }
}

SYS.NODE_CLASSES.push({ name: 'color-picker',     cls: ColorPickerWidget });

/* ─────────────────────────────────────────────────────────────────────────────
NavLinkWidget — one menu entry that is a real link.

Ported from NavLinkWidget in js/omni-support/omni-widget.js.  Changes:
- An optional target field, with rel="noopener" when it opens a new tab.
- update re-applies href, label and target, so a model can retarget its links
  by writing node values and asking for an update; no remount.
──────────────────────────────────────────────────────────────────────────── */

class NavLinkWidget {

  /* selectFirst: a click on a link that is not yet selected selects it and
     does not follow it, so a link can be chosen for editing.  Once selected,
     a click follows the link as usual. */
  static meta = {
    selectFirst: true,
    editableFields: (node) => [
      { key: 'label',  label: 'Label',   type: 'text',   value: node.value.label || '' },
      { key: 'href',   label: 'Href',    type: 'text',   value: node.value.href || '' },
      { key: 'target', label: 'Open in', type: 'select', value: node.value.target || '',
        options: [['', 'Same tab'], ['_blank', 'New tab']] },
    ],
  };

  static mount(ctxMix, node, params) {
    const el = document.createElement('a');
    el.className = 'nav-menu-item';
    node.inst = { ...(node.inst || {}), el };
    NavLinkWidget._apply(node);
    ctxMix.parentEl.appendChild(el);
  }

  static update(ctxMix, node, params) {
    NavLinkWidget._apply(node);
  }

  static _apply(node) {
    const v = node.value || {}, el = node.inst?.el;
    if (!el) return;
    el.href = v.href || '#';
    el.textContent = v.label || '';
    if (v.target) {
      el.target = v.target;
      el.rel = v.target === '_blank' ? 'noopener' : '';
    } else {
      el.removeAttribute('target');
      el.removeAttribute('rel');
    }
  }
}

SYS.NODE_CLASSES.push({ name: 'nav-link',         cls: NavLinkWidget });

/* The drop zone, and a readout of what it last received.  The HUD's Accept
   and Multiple write straight into the widget's node value, which the widget
   reads at click time. */
class FileDropModel {
  get name() { return 'File Drop'; }
  get displayType() { return 'html'; }

  constructor() {
    this.visible = true;
    this.controls = [
      { type: 'separator', label: 'File drop' },
      { type: 'select', id: 'accept', label: 'Accept', value: '*',
        options: [['*', 'Any file'], ['image/*', 'Images'], ['.md,.txt,.json', 'Text and data']] },
      { type: 'checkbox', id: 'multiple', label: 'Multiple', value: true },
    ];
    this.params = { fileList: 'Nothing received yet.' };

    this.drop = SYS.makeNode('filedrop', {
      label: 'Drop files here, or click to choose', accept: '*', multiple: true,
      on: { files: 'emit received' },
    });

    this.sceneRoot = SYS.makeNode('html-box', { class: 'html-demo' }, [
      SYS.makeNode('html-text', { tag: 'h4', text: 'filedrop' }),
      this.drop,
      SYS.makeNode('html-text', { class: 'html-readout', text: '{fileList}' }),
    ]);
  }

  onEmit(event, ctx) {
    if (event === 'received') this.received(ctx.data.files);
  }

  received(files) {
    const lines = [...files].map(f => `${f.name} · ${FileDropModel.size(f.size)}`);
    this.harness?.setParam('fileList', lines.length ? lines.join('\n') : 'Nothing received yet.');
  }

  static size(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  onControl(id, val) {
    if (id === 'accept' || id === 'multiple') this.drop.value[id] = val;
  }
}

   onParamChange translates outward (picker → HUD) and onControl inward
   (HUD → picker, keeping the alpha the picker last set).  This is the one
   place a model needs to know that two dialects of colour exist. */
class ColorPickerModel {
  get name() { return 'Color Picker'; }
  get displayType() { return 'html'; }

  constructor() {
    this.visible = true;
    this.controls = [
      { type: 'separator', label: 'Color picker' },
      { type: 'color', id: 'swatchRgb', label: 'Colour', value: '#6e9ef7' },
    ];
    this.params = { swatchColor: '#6e9ef7ff' };

    this.sceneRoot = SYS.makeNode('html-box', { class: 'html-demo' }, [
      SYS.makeNode('html-text', { tag: 'h4', text: 'color-picker' }),
      { type: 'color-picker', value: { bind: 'swatchColor', label: 'Swatch' }, subtree: [] },
      SYS.makeNode('html-box', { class: 'html-checker' }, [

const lerp = (a, b, t) => a + (b - a) * t;

//<< import { OkColour, ColourType } from './ok-colour.js';

/* From spectrum-lab.html, unchanged: OKLab / OKLCH / sRGB maths, and the value-type
   adapter the gradient machinery talks to. */

/* =====================================================================
   OkColour — pure OKLab / OKLCH / sRGB maths
   ===================================================================== */
class OkColour {
  static toLinear(c) { const a = Math.abs(c); const v = a <= 0.04045 ? a / 12.92 : Math.pow((a + 0.055) / 1.055, 2.4); return c < 0 ? -v : v; }
  static toGamma(c) { const a = Math.abs(c); const v = a <= 0.0031308 ? 12.92 * a : 1.055 * Math.pow(a, 1 / 2.4) - 0.055; return c < 0 ? -v : v; }
  static linToLab(r, g, b) {
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
            1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
            0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
  }
  static labToLin(L, a, b) {
    const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
    const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
    const s_ = L - 0.0894841775 * a - 1.2914855480 * b;

    hc.putImageData(this.hueImg, 0, 0);
    const hx = Math.round(v.h / 360 * (this.hue.width - 1)) + 0.5;
    hc.fillStyle = '#000'; hc.fillRect(hx - 2.5, 0, 5, this.hue.height);
    hc.fillStyle = '#fff'; hc.fillRect(hx - 1, 0, 2, this.hue.height);
    if (from !== 'L') this.$('.pe-L').value = (v.L * 100).toFixed(1);
    if (from !== 'C') this.$('.pe-C').value = v.C.toFixed(3);
    if (from !== 'h') this.$('.pe-H').value = v.h.toFixed(1);
    const lab = OkColour.lchToLab(v.L, v.C, v.h), hex = T.hexOf(lab);
    if (from !== 'hex') this.$('.pe-hex').value = hex;
    this.$('.pe-new').style.background = hex;
    this.$('.pe-old').style.background = T.hexOf(OkColour.lchToLab(this.orig.L, this.orig.C, this.orig.h));
    const ing = OkColour.inGamut(OkColour.labToLin(lab[0], lab[1], lab[2]));
    this.$('.pe-gamut').textContent = ing ? 'Inside sRGB' : `Outside sRGB: displayed ${T.options.gamut === 'chroma' ? 'with reduced chroma' : 'with clipped channels'}`;
  }
}

//<< import { SpectrumNode } from './spectrum-node.js';
//-- file: ./spectrum-node.js --
//>> import { SYS } from './sys.js';
//>> import { clamp } from './spectrum-math.js';
//>> import { ColourType } from './ok-colour.js';
//>> import { Gradient, History, ColourLUT } from './gradient-core.js';
//>> import { SpectrumStyle } from './spectrum-view.js';
//>> import { SpectrumWidget } from './spectrum-interaction.js';
//>> import { ColourEditor } from './colour-editor.js';
//>> export { SpectrumNode };

/* ─────────────────────────────────────────────────────────────────────────────
SpectrumNode — the spectrum lab's gradient editor as an HTML node: a strip of
stops with draggable handles, skew diamonds between them, a histogram lane,
and the OKLCH popover for editing a stop's colour.

node.value is the whole widget, serialisable:
  stops        [{ pos, skew, L, C, h }] or the lab's [hex, pos, skew?] form
  hist         optional array of 0..1 bars for the histogram lane
  space, easing, gamut, cyclic, skewOn, maxStops     gradient settings
  stripH, stripRound, handleSize, handleRound,
  handleOffset, skewH, histH                         SpectrumStyle settings
  bind         the param that receives the gradient as a CSS background

Every edit writes the stops back into node.value, so a remount (an edit in the
Selected panel) rebuilds the same gradient.  The undo history lives on
node.inst and is handed to each new Gradient, so undo reaches past remounts.

Published params
  {bind}       linear-gradient(...) sampled from the LUT, so a preview shows
               exactly what the strip shows, cyclic and easing included
  {bind}Info   'n stops · space · cyclic'
──────────────────────────────────────────────────────────────────────────── */

class SpectrumNode {

  static DEFAULTS = {
    space: 'oklab', easing: 'linear', gamut: 'chroma', cyclic: false, skewOn: true, maxStops: 64,
    stripH: 40, stripRound: 0, handleSize: 18, handleRound: 0.44, handleOffset: 1, skewH: 16, histH: 34,
  };
  static STYLE_KEYS = ['stripH', 'stripRound', 'handleSize', 'handleRound', 'handleOffset', 'skewH', 'histH'];
  static SPACES = [['oklab', 'OKLab'], ['oklch', 'OKLCH · shorter hue'], ['oklch-long', 'OKLCH · longer hue'],
                   ['srgb', 'sRGB (gamma-encoded)'], ['srgb-linear', 'Linear sRGB']];

  static meta = {
    editableFields: (node) => {
      const v = { ...SpectrumNode.DEFAULTS, ...node.value };
      const num = (key, label) => ({ key, label, type: 'number', value: v[key] });
      return [
        { key: 'bind',   label: 'Param',    type: 'text',   value: v.bind ?? '' },
        { key: 'space',  label: 'Space',    type: 'select', value: v.space, options: SpectrumNode.SPACES },
        { key: 'easing', label: 'Easing',   type: 'select', value: v.easing, options: [['linear', 'Linear'], ['smooth', 'Smoothstep']] },
        { key: 'gamut',  label: 'Gamut',    type: 'select', value: v.gamut, options: [['chroma', 'Reduce chroma'], ['clip', 'Clip channels']] },
        { key: 'cyclic', label: 'Cyclic',   type: 'checkbox', value: !!v.cyclic },
        { key: 'skewOn', label: 'Skew',     type: 'checkbox', value: !!v.skewOn },
        num('maxStops', 'Max stops'),
        num('stripH', 'Strip px'), num('stripRound', 'Strip round'),
        num('handleSize', 'Handle px'), num('handleRound', 'Handle round'), num('handleOffset', 'Placement'),
        num('skewH', 'Skew lane'), num('histH', 'Histogram'),
      ];
    },
  };

  static mount(ctxMix, node, params) {
    const v = { ...SpectrumNode.DEFAULTS, ...(node.value || {}) };

    const g = new Gradient(new ColourType());
    g.type.options.space = v.space;
    g.type.options.gamut = v.gamut;
    g.easing = v.easing; g.cyclic = !!v.cyclic; g.skewOn = !!v.skewOn;
    g.maxStops = Math.max(2, v.maxStops | 0);
    g.stops = SpectrumNode.toStops(g, v.stops || SpectrumNode.FALLBACK); g.sort();
    for (const s of g.stops) g.nextId = Math.max(g.nextId, s.id + 1);

    const history = node.inst?.history || new History(g);
    history.model = g;

    const lut = new ColourLUT(g);
    lut.build();

    const style = new SpectrumStyle();
    for (const k of SpectrumNode.STYLE_KEYS) if (Number.isFinite(+v[k])) style[k] = +v[k];

    const host = document.createElement('div');
    host.className = 'spectrum';
    host.tabIndex = 0;
    host.setAttribute('aria-label', 'Gradient editor');
    ctxMix.parentEl.appendChild(host);

    const widget = new SpectrumWidget(host, g, lut, history, style);
    widget.setHist(Array.isArray(v.hist) ? v.hist : null);
    const editor = new ColourEditor(g, history);

    /* The lab redrew from one frame loop; here each spectrum has its own. */
    let frame = 0;
    const paint = () => {
      if (frame) return;
      frame = requestAnimationFrame(() => { frame = 0; widget.draw(); editor.sync(); });
    };
    widget.onHover = () => paint();
    widget.onSelect = () => paint();
    widget.onEdit = (id, rect) => editor.open(id, rect);
    widget.onFull = () => {};
    editor.onClose = (refocus) => { if (refocus) host.focus({ preventScroll: true }); };

    const publish = (notify) => {
      node.value.stops = SpectrumNode.serialise(g);
      if (!v.bind) return;
      const css = SpectrumNode.cssOf(lut, g.cyclic);
      const info = `${g.stops.length} stop${g.stops.length === 1 ? '' : 's'} · ${v.space}${g.cyclic ? ' · cyclic' : ''}`;
      ctxMix.setParam(v.bind, css);
      ctxMix.setParam(v.bind + 'Info', info);
      if (!notify) return;
      ctxMix.onParamChange(v.bind, css, false, ctxMix.panel);
      ctxMix.onParamChange(v.bind + 'Info', info, false, ctxMix.panel);
      ctxMix.render();
    };
    g.on(() => { lut.build(); publish(true); paint(); });
    /* Quietly at mount: the params are set before any later sibling mounts
       and reads them.  render() then catches up the nodes already mounted,
       which matters on a remount, when the readout is older than the edit. */
    publish(false);
    ctxMix.render?.();
    paint();

    node.inst = {
      ...(node.inst || {}),
      el: host, g, history, widget, editor,
      cancelFrame: () => cancelAnimationFrame(frame),
    };
  }

  static teardown(ctxMix, node, params) {
    const i = node.inst;
    if (!i?.widget) return;
    i.cancelFrame();
    i.widget.destroy();
    i.editor.destroy();
  }

  /* The lab's PresetLibrary.toStops: [hex, pos, skew?] or { pos, skew?, L, C, h }. */
  static toStops(g, list) {
    return list.map(s => Array.isArray(s)
      ? g.newStop(s[1], g.type.fromHex(s[0]), s[2] ?? 0.5)
      : g.newStop(clamp(s.pos, 0, 1), g.type.sanitize(s), clamp(s.skew ?? 0.5, 0.03, 0.97)));
  }

  /* The lab's saveCurrent rounding. */
  static serialise(g) {
    return g.stops.map(s => ({
      pos: +s.pos.toFixed(5), skew: +s.skew.toFixed(4),
      L: +s.value.L.toFixed(5), C: +s.value.C.toFixed(5), h: +s.value.h.toFixed(3),
    }));
  }

  /* A CSS background that matches the strip, from 33 evenly spaced LUT samples. */
  static cssOf(lut, cyclic, n = 33) {
    const parts = [];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      parts.push(`${lut.css(cyclic ? Math.min(t, 1 - 1e-6) : t)} ${(t * 100).toFixed(1)}%`);
    }
    return `linear-gradient(to right, ${parts.join(', ')})`;
  }

  static FALLBACK = [['#440154', 0], ['#3b528b', 0.25], ['#21918c', 0.5], ['#5ec962', 0.75], ['#fde725', 1]];
}

SYS.NODE_CLASSES.push({ name: 'spectrum',         cls: SpectrumNode });
//-- endfile --

/* The spectrum widget, a full-width preview of the gradient it publishes, and
   a one-line readout.  The HUD loads a preset and drives undo, redo and
   reverse; everything about the widget's look and interpolation is in the
   Selected panel when the strip is clicked.

   The histogram has no heatmap to come from here, so the model supplies a
   made-up two-humped one, to show what the lane is for. */
class SpectrumModel {
  get name() { return 'Spectrum'; }
  get displayType() { return 'html'; }

  /* A handful of the lab's presets, one from each of its groups. */
  static PRESETS = {
    'Classic fractal': { cyclic: true, stops: [['#000764', 0], ['#206bcb', 0.16], ['#edffff', 0.42], ['#ffaa00', 0.6425], ['#000200', 0.8575]] },
    'Viridis-like':    { stops: [['#440154', 0], ['#3b528b', 0.25], ['#21918c', 0.5], ['#5ec962', 0.75], ['#fde725', 1]] },
    'Turbo-like':      { stops: [['#30123b', 0], ['#4686fb', 0.15], ['#1ae4b6', 0.35], ['#a2fc3c', 0.5], ['#faba39', 0.7], ['#e4460a', 0.85], ['#7a0403', 1]] },
    'Sunset':          { stops: [['#0b1d51', 0, 0.6], ['#5b2a86', 0.3], ['#c33c54', 0.55], ['#f28c28', 0.78], ['#ffd56b', 1]] },
    'Blue–red':        { stops: [['#2b59c3', 0], ['#f7f7f7', 0.5], ['#c8322c', 1]] },
    'Phase wheel':     { cyclic: true, stops: [0, 72, 144, 216, 288].map((h, i) => ({ pos: i / 5, L: 0.72, C: 0.14, h: h + 20 })) },
    'Hard bands':      { stops: [['#1b1f3a', 0], ['#1b1f3a', 0.25], ['#4a6fa5', 0.25], ['#4a6fa5', 0.5], ['#e2c290', 0.5], ['#e2c290', 0.75], ['#c0504d', 0.75], ['#c0504d', 1]] },
  };

  static hist(bins = 64) {
    const bump = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s));
    const h = Array.from({ length: bins }, (_, b) => {
      const x = (b + 0.5) / bins;
      return 0.9 * bump(x, 0.28, 0.09) + 0.55 * bump(x, 0.72, 0.13) + 0.04;
    });
    const top = Math.max(...h);
    return h.map(v => +(v / top).toFixed(3));
  }

  constructor() {
    this.visible = true;
    const first = 'Classic fractal', p = SpectrumModel.PRESETS[first];

    this.spec = {
      type: 'spectrum',
      value: { bind: 'gradientCss', stops: p.stops, cyclic: !!p.cyclic, hist: SpectrumModel.hist() },
      subtree: [],
    };
    const g = () => this.spec.inst?.g, h = () => this.spec.inst?.history;

    this.controls = [
      { type: 'separator', label: 'Spectrum' },
      { type: 'select', id: 'spectrumPreset', label: 'Preset', value: first,
        options: Object.keys(SpectrumModel.PRESETS).map(k => [k, k]) },
      { type: 'button', label: 'Reverse', action: () => {
        if (!g() || g().stops.length < 2) return;
        h().push(); g().reverse(); g().emit('reverse');
      } },
      { type: 'button', label: 'Undo', action: () => h()?.undo() },
      { type: 'button', label: 'Redo', action: () => h()?.redo() },
    ];

    this.sceneRoot = SYS.makeNode('html-box', { class: 'html-demo html-wide' }, [
      SYS.makeNode('html-text', { tag: 'h4', text: 'spectrum' }),
      this.spec,
      SYS.makeNode('html-box', { class: 'html-gradient', style: 'background:{gradientCss}' }),
      SYS.makeNode('html-text', { class: 'html-readout', text: '{gradientCssInfo}' }),
      SYS.makeNode('html-text', { class: 'html-hint',
        text: 'Click the strip to add a stop · drag a handle to move it, off the strip to delete · Alt-drag duplicates · click a handle to edit its colour · drag a diamond to skew · Ctrl-Z undoes' }),
    ]);
  }

  /* A preset replaces the stops in place, as one undoable step.  Cyclic comes
     with it, so the Selected panel's Cyclic box is written too. */
  onControl(id, val) {
    if (id !== 'spectrumPreset') return;
    const p = SpectrumModel.PRESETS[val], i = this.spec.inst;
    if (!p || !i?.g) return;
    i.history.push();
    i.g.stops = SpectrumNode.toStops(i.g, p.stops); i.g.sort();
    i.g.cyclic = !!p.cyclic;
    this.spec.value.cyclic = i.g.cyclic;
    i.g.emit('preset');
  }
}
SYS.MODELS.push(new SpectrumModel());

//<< import { HtmlTemplateNode } from './html-template-node.js';
//-- file: ./html-template-node.js --
//>> import { SYS } from './sys.js';
//>> export { HtmlTemplateNode };

/* ─────────────────────────────────────────────────────────────────────────────
HtmlTemplateNode — an element whose markup comes from a named template, with
the node's own value fields filled in.  The type from html-node-types.md that
replaces D+'s dozen chat widgets (server icon, topic, message, embed card…),
which are template strings with fields already.

Templates are records in SYS.TEMPLATES, { name, markup, from }.  Any nugget
may push one.  A book of Markdown+ text holding fences of the form

    ```html template=message
    <div class="tpl-msg"> … {name} … {!body} … </div>
    ```

is pushed with pushBook(), one record per fence; plain Markdown shows the book
as code.  A name pushed again overrides the earlier one: lookups take the
last record with the name.

Every template is a node type
  This nugget adds SYS.TEMPLATES to the registry's sources, so pushing a
  template named 'message' also registers a node type 'message': a subclass
  of this one that knows its template.  A scene says { type: 'message', value:
  { name, body } }, which is what D+'s rules emit.  The generic form,
  { type: 'html-template', value: { template: 'message' } }, still works.

Placeholders
  {key}    node.value[key], HTML-escaped
  {!key}   node.value[key] as markup, for text the Markdown+ pipeline has
           already rendered.  Trusted, like the raw-html island.
  with     a fence attribute, with=name: template.<name> in SYS.FUNCTIONS
           computes more fields from the value before the fill, fn(value) →
           { key: … }.  What a template cannot say (a coverage bar from two
           numbers, an icon or a picture) is a named function, and the
           markup stays in the book.
  <slot>   where the node's children mount.  It becomes a display:contents
           div, so children lay out as if they were the template's own.

A template has one root element.  Its inner elements are not nodes, so a
click inside one selects the template; a child mounted in the slot is a node
of its own and selects itself.

Editing
  The Selected panel offers the template (for a typed node, its type: '@type'
  writes node.type, so a message can become a card), one field per
  placeholder, and the markup itself.  Edited markup is kept on the node
  under 'markup:<name>', an override for this node only; the book is shared
  and is edited where it lives, in its Markdown+ file.
──────────────────────────────────────────────────────────────────────────── */

class HtmlTemplateNode {
  static TEMPLATE = null;          // set on each per-template subclass

  /** One { name, markup, attrs, from } record per ```html template=name fence.
      Words after the name are attributes: a bare word is a flag (sticky),
      key=value a value.  They become the node type's meta, which is how a
      book says a stage pins while the chat scrolls under it. */
  static parseBook(markdown, from = 'book') {
    return [...String(markdown).matchAll(/```html[ \t]+template=([\w-]+)([^\n]*)\n([\s\S]*?)```/g)]
      .map(m => {
        const attrs = {};
        for (const w of m[2].trim().split(/\s+/).filter(Boolean)) {
          const [k, v] = w.split('=');
          attrs[k] = v === undefined ? true : v;
        }
        return { name: m[1], markup: m[3].trim(), attrs, from };
      });
  }
  static pushBook(markdown, from) {
    SYS.TEMPLATES.push(...HtmlTemplateNode.parseBook(markdown, from));
  }

  /** The node class for one template record: knows its template, and carries
      the record's attributes as meta. */
  static typed(record) {
    const cls = class extends HtmlTemplateNode {
      static TEMPLATE = record.name;
      static meta = { ...HtmlTemplateNode.meta, ...(record.attrs || {}) };
    };
    Object.defineProperty(cls, 'name', { value: `Template(${record.name})` });
    return cls;
  }

  /** Which template a node uses: its own field, else its type's. */
  static nameOf(node) {
    return node.value?.template ?? SYS.registry.meta[node.type]?.nodeClass?.TEMPLATE ?? null;
  }

  static markupOf(node) {
    const name = HtmlTemplateNode.nameOf(node), v = node.value || {};
    return v['markup:' + name] ?? SYS.named(SYS.TEMPLATES, name)?.markup
      ?? `<div class="tpl-missing">No template called “${HtmlTemplateNode.esc(name ?? '')}”</div>`;
  }

  /** The fields a fill sees: the node's value, plus what its template's
      with= function computes from it. */
  static fieldsOf(node) {
    const v = node.value || {};
    const w = SYS.named(SYS.TEMPLATES, HtmlTemplateNode.nameOf(node))?.attrs?.with;
    const rec = w && SYS.named(SYS.FUNCTIONS, 'template.' + w);
    return rec ? { ...v, ...rec.fn(v) } : v;
  }

  static keys(markup) {
    return [...new Set([...markup.matchAll(/\{!?(\w+)\}/g)].map(m => m[1]))];
  }

  static esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  static fill(markup, v) {
    return markup.replace(/\{(!?)(\w+)\}/g, (_, raw, k) => {
      const x = v[k] ?? '';
      return raw ? String(x) : HtmlTemplateNode.esc(x);
    });
  }

  static meta = {
    editableFields: (node) => {
      const v = node.value || {}, markup = HtmlTemplateNode.markupOf(node);
      const name = HtmlTemplateNode.nameOf(node);
      const typed = !!SYS.registry.meta[node.type]?.nodeClass?.TEMPLATE;
      const names = SYS.namesIn(SYS.TEMPLATES).map(k => [k, k]);
      return [
        typed
          ? { key: '@type',    label: 'Template', type: 'select', value: node.type, reselect: true, options: names }
          : { key: 'template', label: 'Template', type: 'select', value: v.template, reselect: true, options: names },
        ...HtmlTemplateNode.keys(markup)
          .filter(k => k !== 'template')
          .map(k => ({ key: k, label: k, type: 'text', value: v[k] ?? '' })),
        { key: 'markup:' + name, label: 'Markup', type: 'text', multiline: true, value: markup },
      ];
    },
  };

  /* First parameter not named ctxMix, so the registry does not take it for a phase. */
  static _build(mix, node) {
    const t = document.createElement('template');
    t.innerHTML = HtmlTemplateNode.fill(HtmlTemplateNode.markupOf(node), HtmlTemplateNode.fieldsOf(node)).trim();
    let el = t.content.firstElementChild;
    if (!el || t.content.children.length > 1) {        // not one root: wrap what there is
      el = document.createElement('div');
      el.append(...t.content.childNodes);
    }
    let slotEl = null;
    const slot = el.matches('slot') ? null : el.querySelector('slot');
    if (slot) {
      slotEl = document.createElement('div');
      slotEl.className = 'tpl-slot';
      slotEl.style.display = 'contents';
      slot.replaceWith(slotEl);
    }
    node.inst = { ...(node.inst || {}), el, slotEl };
    mix.parentEl.appendChild(el);
    return node.inst;
  }

  // With children: they mount in the slot, or after the content if there is none.
  static before_mount(ctxMix, node, params) {
    const i = HtmlTemplateNode._build(ctxMix, node);
    ctxMix.parentStack.push(ctxMix.parentEl);
    ctxMix.parentEl = i.slotEl ?? i.el;
  }
  static after_mount(ctxMix, node, params) {
    ctxMix.parentEl = ctxMix.parentStack.pop();
  }
  static mount(ctxMix, node, params) {
    HtmlTemplateNode._build(ctxMix, node);
  }
}

SYS.NODE_CLASSES.push({ name: 'html-template',    cls: HtmlTemplateNode });

/* Every template is also a node type of its own name. */
SYS.registry.addSource(SYS.TEMPLATES, (r) => ({ name: r.name, cls: HtmlTemplateNode.typed(r) }));
//-- endfile --

/* ─────────────────────────────────────────────────────────────────────────────
actions — what an on entry can do, as action.<name> records in SYS.FUNCTIONS.

Each record names its arguments, which is what lets the short form be
positional: 'nav note {label}' is { kind: 'note', target: '{label}' }.  The
harness has already filled {key} placeholders from the item and params, and
hands fn a ctx of { harness, app, model, params, node, item, event?, data? }.

  set     param value     write a param ('true', 'false' and numbers coerced)
  toggle  param           flip a boolean param
  select  group key?      make key (default: the item's) active in group
  nav     kind target     go somewhere.  The panopticon has nowhere to go, so
                          it records 'kind → target' in the nav param and
                          tells the model (onNav), which is where D+ would
                          load a note, a server or an index.
  emit    event           hand a named event to the model (onEmit), for what
                          only the application knows: sending a message,
                          receiving files.
  scroll  key             bring the node with that key into view

Adding an action is a push from any nugget; nothing else changes.
──────────────────────────────────────────────────────────────────────────── */

const coerceArg = (v) => {
  if (typeof v !== 'string') return v;
  if (v === 'true') return true;
  if (v === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(v)) return Number(v);
  return v;
};

SYS.FUNCTIONS.push(
  { name: 'action.set', args: ['param', 'value'],
    fn: (ctx, a) => ctx.harness.setParam(a.param, coerceArg(a.value)) },
  { name: 'action.toggle', args: ['param'],
    fn: (ctx, a) => ctx.harness.setParam(a.param, !ctx.params[a.param]) },
  { name: 'action.select', args: ['group', 'key'],
    fn: (ctx, a) => ctx.harness.setParam(a.group, a.key ?? ctx.item?.value?.key ?? ctx.item?.value?.id) },
  { name: 'action.nav', args: ['kind', 'target'],
    fn: (ctx, a) => { ctx.harness.setParam('nav', `${a.kind} → ${a.target}`); ctx.model.onNav?.(a.kind, a.target, ctx); } },
  { name: 'action.emit', args: ['event'],
    fn: (ctx, a) => ctx.model.onEmit?.(a.event, ctx) },
  { name: 'action.scroll', args: ['key'],
    fn: (ctx, a) => ctx.harness.find(n => String(n.value?.key) === String(a.key))
      ?.inst?.el?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }) },
);

//<< import './prepasses.js';
//-- file: ./prepasses.js --
//>> import { SYS } from './sys.js';
//>> import './html-nodes.js';   // the html-box nodes the passes make

/* ─────────────────────────────────────────────────────────────────────────────
prepasses — turn a flat list of nodes into the nested scene D+ draws.

Markdown+ rules emit nodes one block at a time, in document order: a header,
a card, a few messages.  D+'s _render then built structure by hand.  These
are that structure as pure functions, prepass.<name> in SYS.FUNCTIONS, each
(subtree, node) → new subtree.  A node asks for them with
value.prepare: ['scroller', 'zones'], and the harness runs them once, before
the first mount, then visits the result, so a pass may make a node that
asks for another.

  scroller   a node with opens: 'scroller' is followed by a scrolling box
             holding everything after it; that box asks for sections.  Its
             class is the node's scrollerClass, else 'scroller'.  Both may be
             said by the node or by its type's meta, so a template book can
             say it once: ```html template=chatheader opens=scroller```.
             (D+: the chat header opens the message scroller.)
  sections   a node with section: 'head', or whose class meta says sticky,
             opens a section whose head pins while the rest scrolls under it;
             the next head closes it.  (D+: sticky cards and stages.)
  zones      a node with zoneOut: 'name', anywhere below, moves under the box
             with zone: 'name'.  (D+: the chat input goes to its own zone.)

The passes are ordinary data in, data out, so a test can run one on a list
without a page.
──────────────────────────────────────────────────────────────────────────── */

/** A field from the node, else from its type's meta. */
const said = (n, key) => n.value?.[key] ?? SYS.registry.meta[n.type]?.[key];

function prepassScroller(list) {
  const i = list.findIndex(n => said(n, 'opens') === 'scroller');
  if (i < 0) return list;
  const cls = said(list[i], 'scrollerClass') ?? 'scroller';
  const box = SYS.makeNode('html-box', { class: cls, scroll: 'y', prepare: ['sections'] }, list.slice(i + 1));
  return [...list.slice(0, i + 1), box];
}

function prepassSections(list) {
  const out = [];
  let section = null;
  for (const n of list) {
    const head = n.value?.section === 'head' || SYS.registry.meta[n.type]?.sticky;
    if (head) {
      section = SYS.makeNode('html-box', { class: 'sticky-section' }, [
        SYS.makeNode('html-box', { class: 'sticky-head', sticky: true }, [n]),
      ]);
      out.push(section);
    } else if (section) section.subtree.push(n);
    else out.push(n);
  }
  return out;
}

function prepassZones(list, root) {
  const moving = [];
  const lift = (node) => {
    if (!node.subtree) return;
    node.subtree = node.subtree.filter(k => (k.value?.zoneOut ? (moving.push(k), false) : true));
    node.subtree.forEach(lift);
  };
  const holder = { subtree: list };
  lift(holder);
  const zoneOf = (node, name) => {
    if (node.value?.zone === name) return node;
    for (const k of node.subtree || []) { const z = zoneOf(k, name); if (z) return z; }
    return null;
  };
  for (const n of moving) {
    const z = zoneOf(holder, n.value.zoneOut);
    if (z) (z.subtree ||= []).push(n);
    else console.warn(`zoneOut '${n.value.zoneOut}': no box with that zone`);
  }
  return holder.subtree;
}

SYS.FUNCTIONS.push(
  { name: 'prepass.scroller', fn: prepassScroller },
  { name: 'prepass.sections', fn: prepassSections },
  { name: 'prepass.zones',    fn: prepassZones },
);
//-- endfile --

//<< import { HtmlHostNode, skipChildren } from './html-host-node.js';
//-- file: ./html-host-node.js --
//>> import { SYS } from './sys.js';
//>> import { DemoHarness2D } from './demo-harness2-d.js';
//>> import { skipChildren } from './html-nodes.js';
//>> export { HtmlHostNode };

/* ─────────────────────────────────────────────────────────────────────────────
HtmlHostNode — a 2D canvas inside the HTML tree.  The boundary between
backends, and what D+'s stage cards are.

The HTML walk stops here: in every HTML phase the host swaps the walker's
iterator for an empty one, so its children are never mounted, updated or
torn down as HTML.  Its first child is a 2D scene (normally a pane-camera
over a group), and a DemoHarness2D draws, hit-tests and pans it, exactly as
it does a 2D pane.  Selecting a word inside a host fills the Selected panel
as it does in the Word Cloud pane.

  height    px, the canvas box height (the width follows the layout)
  engage    'click'  the wheel scrolls the page until the host is pressed,
                     then zooms the scene until something outside is pressed
                     (D+'s stage cards: scrolling the chat must not zoom)
            'always' the wheel always zooms

The 2D harness is made on the first frame the canvas has a size, because
autoFitCamera needs one; a host mounted into a detached fragment (an edit)
waits until it is placed.  Teardown releases the observers and listeners.
3D hosts come next, by the same route with DemoHarness3D.
──────────────────────────────────────────────────────────────────────────── */

class HtmlHostNode {
  static meta = {
    editableFields: (node) => [
      { key: 'height', label: 'Height', type: 'number', value: node.value.height ?? 240 },
      { key: 'engage', label: 'Wheel', type: 'select', value: node.value.engage ?? 'click',
        options: [['click', 'zooms after a press'], ['always', 'always zooms']] },
    ],
  };

  static _make(mix, node, params) {
    const v = { height: 240, engage: 'click', ...node.value };
    const el = document.createElement('div');
    el.className = 'html-host';
    el.style.height = v.height + 'px';
    const canvas = document.createElement('canvas');
    el.appendChild(canvas);
    mix.parentEl.appendChild(el);

    const inst = node.inst = { ...(node.inst || {}), el, canvas, engaged: v.engage === 'always' };
    const scene = node.subtree?.[0];
    const app = mix.harness?.app;

    // The 2D harness, once the canvas has a size.
    inst.ro = new ResizeObserver(() => {
      if (inst.h2d || !scene || canvas.clientWidth === 0) return;
      inst.h2d = new DemoHarness2D(canvas, { sceneRoot: scene, controls: v.controls || [], name: v.label || 'host' }, app);
      // A 2D pane's canvas carries its harness too; tools and tests find it there.
      canvas.harness = inst.h2d;
    });
    inst.ro.observe(canvas);

    // Wheel gating: until engaged, the canvas never sees the wheel.
    const wheel = (e) => { if (!inst.engaged) e.stopPropagation(); };
    el.addEventListener('wheel', wheel, { capture: true });
    if (v.engage !== 'always') {
      el.addEventListener('pointerdown', () => { inst.engaged = true; el.classList.add('is-engaged'); });
      inst.outside = (e) => {
        if (!el.contains(e.target)) { inst.engaged = false; el.classList.remove('is-engaged'); }
      };
      document.addEventListener('pointerdown', inst.outside, true);
    }
    return inst;
  }

  static _release(node) {
    const i = node.inst;
    if (!i) return;
    i.ro?.disconnect();
    i.h2d?.destroy?.();
    if (i.outside) document.removeEventListener('pointerdown', i.outside, true);
    i.h2d = null;
  }

  static before_mount(ctxMix, node, params)    { HtmlHostNode._make(ctxMix, node, params); skipChildren(ctxMix); }
  static mount(ctxMix, node, params)           { HtmlHostNode._make(ctxMix, node, params); }
  static before_update(ctxMix, node, params)   { skipChildren(ctxMix); }
  static before_resize(ctxMix, node, params)   { skipChildren(ctxMix); }
  static before_teardown(ctxMix, node, params) { HtmlHostNode._release(node); skipChildren(ctxMix); }
  static teardown(ctxMix, node, params)        { HtmlHostNode._release(node); }
}

SYS.NODE_CLASSES.push({ name: 'html-host',        cls: HtmlHostNode });
//-- endfile --

//<< import { HtmlRepeatNode, HtmlVariantsNode, Clones } from './html-repeat-node.js';
//-- file: ./html-repeat-node.js --
//>> import { SYS, sceneRegistry } from './sys.js';
//>> import { skipChildren } from './html-nodes.js';
//>> export { HtmlRepeatNode, HtmlVariantsNode, Clones };

/* ─────────────────────────────────────────────────────────────────────────────
html-repeat and html-variants — one pattern node, many mounted copies.

Both keep their first child as a pattern that is never mounted itself.  They
deep-copy it once per item, overlay the item's fields on the copy's value,
and mount the copies inside their own element.  The copies live on
node.inst.clones, which the harness indexes, so a click on a copy finds it,
its on entries run, and its group membership shows.

html-repeat     a list from data.  D+'s chat log, topic list and server column.
  items         an array of objects (a string becomes { text })
  itemsFrom     or the name of a param holding one; when the param is given a
                new array, the copies are rebuilt on the next update
  itemsSource   with itemsFrom: the name of a source.<name> in SYS.FUNCTIONS,
                fn(node, params) → items or a promise of them.  It is asked
                at each mount and its answer goes into the param, so a note
                that shows a live stream shows it fresh each time it opens.
                On failure the element says so (failText, then the error).
  pattern       a node type, for a repeat with no child: the copies are that
                type with each item as its value.  So a Markdown+ rule can
                emit a repeat of messages without a pattern node.
  class         for the element holding the copies

html-variants   one subject at several settings, side by side, each captioned
                with what differs.  For comparing design choices.
  variants      [{ label?, key: value, … }, …], each a hand-picked set of
                overrides; label is the caption's first line, not a field
  vary          or { key: [v1, v2, …] } for every combination of the lists
  class         for the grid

Copies are made from the pattern, so editing a copy in the Selected panel
changes that copy only, until the copies are rebuilt.  To change them all,
edit the pattern (in the model, or the Markdown+ it came from).
──────────────────────────────────────────────────────────────────────────── */

class Clones {
  /** A deep copy of a node with no runtime state, value overlaid with extra. */
  static copy(node, extra = {}) {
    return {
      type: node.type,
      value: { ...JSON.parse(JSON.stringify(node.value || {})), ...extra },
      subtree: (node.subtree || []).map(k => Clones.copy(k)),
    };
  }

  /* A context of its own for mounting copies, so the walk that reached this
     node keeps its iterator stack. */
  static mount(mix, clones, parentEl, params) {
    const sub = { ...mix, parentEl, parentStack: [], iterators: [], flyweight: {} };
    for (const c of clones) sceneRegistry.walkPhase(sub, 'mount', c, params);
  }
  static walk(mix, clones, phase, params) {
    const sub = { ...mix, parentStack: [], iterators: [], flyweight: {} };
    for (const c of clones) sceneRegistry.walkPhase(sub, phase, c, params);
  }
}

class HtmlRepeatNode {
  static meta = {
    editableFields: (node) => [
      { key: 'itemsFrom', label: 'Items from', type: 'text', value: node.value.itemsFrom ?? '' },
      { key: 'class',     label: 'Class',      type: 'text', value: node.value.class ?? '' },
    ],
  };

  static _items(node, params) {
    const v = node.value || {};
    const list = v.itemsFrom ? params[v.itemsFrom] : v.items;
    return (Array.isArray(list) ? list : []).map(x => (x && typeof x === 'object') ? x : { text: x });
  }

  static _pattern(node) {
    return node.subtree?.[0] ?? (node.value?.pattern ? { type: node.value.pattern, value: {}, subtree: [] } : null);
  }

  static _build(mix, node, params) {
    const pattern = HtmlRepeatNode._pattern(node);
    const items = HtmlRepeatNode._items(node, params);
    node.inst.itemsRef = node.value.itemsFrom ? params[node.value.itemsFrom] : node.value.items;
    node.inst.clones = pattern ? items.map(item => Clones.copy(pattern, item)) : [];
    Clones.mount(mix, node.inst.clones, node.inst.el, params);
  }

  /* Ask the source, if there is one, and put its answer in the param; the
     update that follows rebuilds the copies. */
  static _fetch(mix, node, params) {
    const v = node.value || {};
    if (!v.itemsSource || !v.itemsFrom) return;
    const rec = SYS.named(SYS.FUNCTIONS, 'source.' + v.itemsSource);
    if (!rec) { console.warn(`html-repeat: no source.${v.itemsSource} in SYS.FUNCTIONS`); return; }
    const el = node.inst.el, harness = mix.harness;
    Promise.resolve().then(() => rec.fn(node, params)).then(
      (items) => harness?.setParam(v.itemsFrom, Array.isArray(items) ? items : []),
      (err) => {
        if (!el.isConnected) return;
        const p = document.createElement('p');
        p.className = 'html-repeat-fail';
        p.textContent = `${v.failText ?? 'Not available'}: ${err?.message ?? err}`;
        el.replaceChildren(p);
      });
  }

  static _open(mix, node, params) {
    const el = document.createElement('div');
    el.className = 'html-repeat ' + (node.value.class || '');
    mix.parentEl.appendChild(el);
    node.inst = { ...(node.inst || {}), el };
    HtmlRepeatNode._build(mix, node, params);
    HtmlRepeatNode._fetch(mix, node, params);
  }

  static _update(mix, node, params) {
    const v = node.value, i = node.inst;
    if (!i?.el) return;
    if (v.itemsFrom && params[v.itemsFrom] !== i.itemsRef) {
      Clones.walk(mix, i.clones, 'teardown', params);
      i.el.replaceChildren();
      HtmlRepeatNode._build(mix, node, params);
      mix.harness?._index(node);
    } else {
      Clones.walk(mix, i.clones, 'update', params);
    }
  }

  // With a pattern child the walk calls before_*, and must not descend into
  // the pattern; with none (pattern by name) it calls the bare phase.
  static before_mount(ctxMix, node, params)    { HtmlRepeatNode._open(ctxMix, node, params); skipChildren(ctxMix); }
  static mount(ctxMix, node, params)           { HtmlRepeatNode._open(ctxMix, node, params); }
  static before_update(ctxMix, node, params)   { skipChildren(ctxMix); HtmlRepeatNode._update(ctxMix, node, params); }
  static update(ctxMix, node, params)          { HtmlRepeatNode._update(ctxMix, node, params); }
  static before_teardown(ctxMix, node, params) {
    skipChildren(ctxMix);
    Clones.walk(ctxMix, node.inst?.clones || [], 'teardown', params);
  }
  static teardown(ctxMix, node, params) {
    Clones.walk(ctxMix, node.inst?.clones || [], 'teardown', params);
  }
}

class HtmlVariantsNode {
  /* The list (or vary) is edited as JSON text; before_mount takes it when it
     parses, and keeps the last good one when it does not. */
  static meta = {
    editableFields: (node) => node.value.variants
      ? [{ key: 'variantsText', label: 'Variants', type: 'text', multiline: true,
           value: JSON.stringify(node.value.variants, null, 1) }]
      : [{ key: 'varyText', label: 'Vary', type: 'text', value: JSON.stringify(node.value.vary ?? {}) }],
  };

  static _takeText(v, textKey, key) {
    if (v[textKey] === undefined) return;
    try { v[key] = JSON.parse(v[textKey]); } catch { /* keep the last good one */ }
    delete v[textKey];
  }

  /** Every combination of the vary lists, as override objects. */
  static combos(vary) {
    let out = [{}];
    for (const [k, vals] of Object.entries(vary || {})) {
      out = out.flatMap(o => (Array.isArray(vals) ? vals : [vals]).map(x => ({ ...o, [k]: x })));
    }
    return out;
  }

  static before_mount(ctxMix, node, params) {
    HtmlVariantsNode._takeText(node.value, 'variantsText', 'variants');
    HtmlVariantsNode._takeText(node.value, 'varyText', 'vary');
    const el = document.createElement('div');
    el.className = 'html-variants ' + (node.value.class || '');
    ctxMix.parentEl.appendChild(el);
    node.inst = { ...(node.inst || {}), el, clones: [] };
    const subject = node.subtree?.[0];
    const list = Array.isArray(node.value.variants) ? node.value.variants : HtmlVariantsNode.combos(node.value.vary);
    for (const { label, ...o } of list) {
      const cell = document.createElement('figure');
      cell.className = 'html-variant';
      const cap = document.createElement('figcaption');
      if (label) {
        const b = document.createElement('b');
        b.textContent = label;
        cap.appendChild(b);
      }
      const what = document.createElement('span');
      what.textContent = Object.entries(o).map(([k, x]) => `${k} ${JSON.stringify(x)}`).join(' · ');
      cap.appendChild(what);
      cell.appendChild(cap);
      el.appendChild(cell);
      if (!subject) continue;
      const copy = Clones.copy(subject, o);
      node.inst.clones.push(copy);
      Clones.mount(ctxMix, [copy], cell, params);
    }
    skipChildren(ctxMix);
  }
  static before_update(ctxMix, node, params) {
    skipChildren(ctxMix);
    Clones.walk(ctxMix, node.inst?.clones || [], 'update', params);
  }
  static before_teardown(ctxMix, node, params) {
    skipChildren(ctxMix);
    Clones.walk(ctxMix, node.inst?.clones || [], 'teardown', params);
  }
}

SYS.NODE_CLASSES.push({ name: 'html-repeat',      cls: HtmlRepeatNode });
SYS.NODE_CLASSES.push({ name: 'html-variants',    cls: HtmlVariantsNode });
//-- endfile --

/* ─────────────────────────────────────────────────────────────────────────────
D+ Mini — D+'s three columns, built the way D+ is to be built: no class
knows a widget by name, and no code builds structure by hand.

  servers   a repeat over server records; on: click selects the server
            (group 'server') and navigates to it

class DPlusMiniModel {

      n('message', { avatar: 'rp', colour: '#4a6fa5', name: 'r_patel', time: '15:45', body: 'Is the isoform situation as bad as people say?' }),
      n('message', { avatar: '深', colour: '#7b5ea7', name: 'Deep Explorer', time: '15:45', body: 'It is genuinely complicated: alternative promoters give a family of shorter forms.' }),
      n('message', { avatar: 'jm', colour: '#a07040', name: 'j_martinez', time: '15:52', body: 'Can we see the terms that co-occur?' }),
      n('stage', { badge: 'O', title: 'Word cloud — a 2D scene in the chat' }, [

      ]),
      n('message', { avatar: '深', colour: '#7b5ea7', name: 'Deep Explorer', time: '15:53', body: 'Press the stage to zoom it; scrolling the chat passes over it.' }),
      n('html-repeat', { itemsFrom: 'messages' }, [n('message', {})]),

      n('html-repeat', {
        class: 'dpm-servers',

          { key: 'blender', icon: '🦊', name: 'Blender', group: 'server' },
          { key: 'garden', icon: '❀', name: 'The Garden', group: 'server' },
        ],

        n('html-repeat', {

  onEmit(event, ctx) {

      ({ avatar, colour, name, time: new Date().toTimeString().slice(0, 5), body: HtmlTemplateNode.esc(body) });

     - handles bigger than the strip (circles over a thin bar) and smaller
       (square chips inside a tall strip)
     - handles above, below and half over the strip; histogram lanes on and off

   visibly moves the blends, not just the diamonds. */

    const h = Array.from({ length: bins }, (_, b) => {
      const x = (b + 0.5) / bins;
      return 0.8 * bump(x, 0.3, 0.1) + 0.6 * bump(x, 0.75, 0.08) + 0.05;
    });
    const top = Math.max(...h);
    return h.map(v => +(v / top).toFixed(3));
  }

  static SPECTRA = [
    { label: 'The lab’s defaults',

    { label: 'Centred circles, bigger than the strip',

    { label: 'Centred squares, smaller than the strip, no skew',

    { label: 'Tall strip, handles below, no skew',

    { label: 'Big handles above a mid strip',
      stripH: 22, handleSize: 30, handleRound: 0.6, handleOffset: -1, skewOn: true, skewH: 10, histH: 0 },
    { label: 'Minimal hairline, centred, no skew',

  constructor() {

//>> import { SYS } from './sys.js';
//>> import './html-nodes.js';   // 'html-box', for lists
//>> export { MdBlockNode, MarkdownPlus };

/* ─────────────────────────────────────────────────────────────────────────────
markdown-plus — Markdown+ text becomes scene nodes, so prose and widgets are
one tree, not two systems.

A node { type: 'markdown', value: { text } } is expanded by prepass.markdown
(asked for with prepare: ['markdown'] on its parent) into:

  md-block       one per heading, paragraph, quote, list item or code block,
                 holding its own Markdown source in value.md and its tag.  It
                 renders that source at mount, so the Selected panel edits a
                 paragraph as Markdown, and the source is there to write back.
  html-box       ul / ol around list items
  any node       for an island, a fence that names a node type:

                     ```node type=chip colour=#6e9ef7
                     text: DOMAIN
                     ```

                 Words on the fence line are fields; key: value lines in the
                 body are more, for values with spaces.  A plain Markdown
                 viewer shows the island as a code block, which is the
                 Markdown+ rule: it reads acceptably without its renderer.

This parser is a placeholder for the PEG one in the library: blocks are found
line by line, inline markup is code, bold, italic and links.  What matters
here is the shape of the output: nodes with their source kept.  Swapping the
parser changes nothing downstream.
──────────────────────────────────────────────────────────────────────────── */

class MarkdownPlus {
  static esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /** Inline Markdown to HTML: `code`, **bold**, *italic*, [text](url). */
  static inline(md) {
    const code = [];
    let s = MarkdownPlus.esc(md).replace(/`([^`]+)`/g, (_, c) => `\u0000${code.push(c) - 1}\u0000`);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
         .replace(/\*([^*]+)\*/g, '<em>$1</em>')
         .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) =>
           /^(https?:|#|\.{0,2}\/|[\w-]+\.html)/.test(u) ? `<a href="${u}">${t}</a>` : t);
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${code[i]}</code>`);
  }

  static coerce(v) {
    if (v === 'true') return true;
    if (v === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(v)) return Number(v);
    return v;
  }

  /** Fields from a fence line (k=v, "quoted values") and body lines (k: v). */
  static islandFields(line, body) {
    const f = {};
    for (const m of line.matchAll(/([\w-]+)=("([^"]*)"|\S+)/g)) f[m[1]] = MarkdownPlus.coerce(m[3] ?? m[2]);
    for (const l of body) {
      const m = l.match(/^\s*([\w-]+)\s*:\s?(.*)$/);
      if (m) f[m[1]] = MarkdownPlus.coerce(m[2]);
    }
    return f;
  }

  /** Markdown+ text to a list of nodes. */
  static parse(text) {
    const lines = String(text).replace(/\r/g, '').split('\n');
    const out = [], n = SYS.makeNode;
    let para = [], list = null;
    const block = (tag, md) => n('md-block', { tag, md });
    const flushPara = () => { if (para.length) out.push(block('p', para.join('\n'))); para = []; };
    const flushList = () => { if (list) out.push(list); list = null; };

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const fence = line.match(/^```(\S*)\s*(.*)$/);
      if (fence) {
        flushPara(); flushList();
        const body = [];
        while (++i < lines.length && !/^```\s*$/.test(lines[i])) body.push(lines[i]);
        if (fence[1] === 'node') {
          const { type, ...fields } = MarkdownPlus.islandFields(fence[2], body);
          out.push(type ? n(String(type), fields) : block('pre', body.join('\n')));
        } else {
          out.push(n('md-block', { tag: 'pre', md: body.join('\n'), lang: fence[1] }));
        }
        continue;
      }
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      const item = line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
      if (h) { flushPara(); flushList(); out.push(block('h' + h[1].length, h[2])); }
      else if (/^(---+|\*\*\*+)\s*$/.test(line)) { flushPara(); flushList(); out.push(block('hr', '')); }
      else if (/^>\s?/.test(line)) { flushPara(); flushList(); out.push(block('blockquote', line.replace(/^>\s?/, ''))); }
      else if (item) {
        flushPara();
        const tag = /\d/.test(item[1]) ? 'ol' : 'ul';
        if (!list || list.value.tag !== tag) { flushList(); list = n('html-box', { tag, class: 'md-list' }, []); }
        list.subtree.push(block('li', item[2]));
      }
      else if (!line.trim()) { flushPara(); flushList(); }
      else { flushList(); para.push(line); }
    }
    flushPara(); flushList();
    return out;
  }
}

class MdBlockNode {
  static meta = {
    editableFields: (node) => [
      { key: 'md', label: 'Markdown', type: 'text', multiline: true, value: node.value.md ?? '' },
      { key: 'tag', label: 'Block', type: 'select', value: node.value.tag ?? 'p',
        options: ['p', 'h1', 'h2', 'h3', 'h4', 'blockquote', 'li', 'pre'].map(t => [t, t]) },
    ],
  };

  static mount(ctxMix, node, params) {
    const v = node.value || {}, tag = v.tag || 'p';
    const el = document.createElement(tag);
    el.className = 'md-block';
    if (tag === 'pre') {
      const code = document.createElement('code');
      code.textContent = v.md ?? '';
      el.appendChild(code);
    } else if (tag !== 'hr') {
      el.innerHTML = MarkdownPlus.inline(v.md ?? '');
    }
    node.inst = { ...(node.inst || {}), el };
    ctxMix.parentEl.appendChild(el);
  }
}

SYS.NODE_CLASSES.push({ name: 'md-block',         cls: MdBlockNode });

/* Expand each markdown node in a list into its blocks and islands, in place. */
SYS.FUNCTIONS.push({
  name: 'prepass.markdown',
  fn: (list) => list.flatMap(k => k.type === 'markdown' ? MarkdownPlus.parse(k.value?.text ?? '') : [k]),
});

/* ═══════════════════════════════════════════════════════════════════════════
DemoHarness2D — owns a 2D canvas pane: drawing, hit-testing, pan/zoom,
and control-value routing.

Changes from original:
- Seeds this.params from paneConfig.controls on construction so that
 control values (regionSet, showGrid, screenMode …) reach draw2d params
 immediately, not just after user interaction.
- applyControl(id, val, getValues) merges into params and redraws,
 fixing the bug where HUD controls displayed but had no effect on 2D.
- Adds getWH() to ctxMix (pane dims + camera state) so FrameNode's
 screenMode path works (it calls ctxMix.getWH(), distinct from getWH).
═══════════════════════════════════════════════════════════════════════════ */
class DemoHarness2D {
  constructor(canvas, paneConfig, app) {
    this.canvas = canvas;
    this.rawCtx = canvas.getContext('2d', { willReadFrequently: true });
    this.app = app;
    this.paneConfig = paneConfig;
    paneConfig.harness = this;

// Every 2D model provides a sceneRoot wrapped in a pane-camera node
    this.node = paneConfig.sceneRoot;

// ── Seed params from model controls so draw2d gets them on first frame ──
    this.params = {};
    if (paneConfig.controls) {
      for (const c of paneConfig.controls) {
        if (c.id && c.value !== undefined) this.params[c.id] = c.value;
      }
    }

    this.dragHit = null;
    this.selectedHit = null;   // an opaque handle: only ever called, never inspected
    this.hoveredHit = null;

// Pan state
    this.isPanning = false;
    this.lastMouseX = 0;
    this.lastMouseY = 0;

    this._resize();
    autoFitCamera(this.node, this.W, this.H);
    this._listen();
    this.draw();
    this.ro = new ResizeObserver(() => { this._resize(); this.draw(); });
    this.ro.observe(canvas);
  }

/* ── teardown (called by an HTML host when its node is torn down) ── */

  destroy() {
    this.ro.disconnect();
    if (this._raf) cancelAnimationFrame(this._raf);
  }

/* ── control routing (called by App.handleHudChange) ───────────── */

  applyControl(id, val, getValues) {
    this.params[id] = val;
    if (this.paneConfig.onControl) {
      this.paneConfig.onControl(id, val, getValues, this.app);
    }
    this.draw();
  }

/* ── camera accessors ──────────────────────────────────────────── */

  get cam() { return (this.paneConfig.cameraNode || this.node).value; }

  _screenToWorldXXX(sx, sy) {
    const v = this.cam, z = v.zoom || 1;
    const cx = v.centerOrigin ? this.W / 2 : 0;
    const cy = v.centerOrigin ? this.H / 2 : 0;
    return { x: (sx - cx) / z + (v.scrollX || 0), y: (sy - cy) / z + (v.scrollY || 0) };

  _resize() {

    const rect = this.canvas.getBoundingClientRect();
    this.W = rect.width;
    this.H = rect.height;
    if (this.W === 0 || this.H === 0) return;
    this.canvas.width = rect.width * this.dpr;
    this.canvas.height = rect.height * this.dpr;
  }

/* ── ctxMix factory ────────────────────────────────────────────── */

  _ctxMix(hpScreen) {
    const cam = this.cam;
    return {
  // The value channel, taken whole.  A node that wants to rewrite what its
  // subtree reads overrides getValue here; nothing redefines it from scratch.
      ...Values,

      ctx: this.rawCtx,
      iterators: [],
      state: { index: 0, pass: 0, isHovered: false, isSelected: false },

  // Stable pane + camera info (never overwritten) — used by FrameNode screenMode
      getWH: () => ({
        W: this.W, H: this.H,
        Z: cam.zoom || 1,
        ox: cam.scrollX || 0,
        oy: cam.scrollY || 0,
      }),

      viewport: {
        x: cam.scrollX || 0, y: cam.scrollY || 0,
        w: this.W / (cam.zoom || 1), h: this.H / (cam.zoom || 1),
      },
      W: this.W,
      H: this.H,
      hitPoint: hpScreen || null,
      hitResult: null,
    };

/* ── drawing ───────────────────────────────────────────────────── */

  draw() {
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => { this._raf = null; this.drawInRaf(); });
  }

  drawInRaf() {
    if (!this.W || !this.H) return;

// 1. Clear physical canvas
    this.rawCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.rawCtx.clearRect(0, 0, this.canvas.width, this.canvas.height);

// 2. Apply DPR base — PaneCameraNode multiplies zoom/scroll on top
    this.rawCtx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    /* Selection and hover live with the items themselves, reached through
       setValue, so nothing about them travels in params. */
    const ctxMix = this._ctxMix();
    sceneRegistry.walkPhase(ctxMix, 'layout', this.node, this.params);
    sceneRegistry.walkPhase(ctxMix, 'draw2d', this.node, this.params);

/* ── hit-testing ───────────────────────────────────────────────── */

  hitTest(screenX, screenY) {
    const c = this._ctxMix({ x: screenX, y: screenY });
    sceneRegistry.walkPhase(c, 'hit_test', this.node, this.params);
    return c.hitResult;
  }

/* ── input listeners ───────────────────────────────────────────── */

  _listen() {
    const toL = e => {
      const r = this.canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top, ex: e.clientX, ey: e.clientY };
    };

// --- ZOOM ---
    this.canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const { x, y } = toL(e);
      const stripH = this.paneConfig.stockStripHeight || 0;
      if (stripH > 0 && y > this.H - stripH) return;
      const cam = this.cam;
      const oldZ = cam.zoom || 1;
      const newZ = Math.max(0.1, Math.min(10.0, oldZ * (e.deltaY > 0 ? 0.9 : 1.1)));
      const cx = cam.centerOrigin ? this.W / 2 : 0;
      const cy = cam.centerOrigin ? this.H / 2 : 0;
      cam.scrollX = (cam.scrollX || 0) + (x - cx) * (1 / oldZ - 1 / newZ);
      cam.scrollY = (cam.scrollY || 0) + (y - cy) * (1 / oldZ - 1 / newZ);
      cam.zoom = newZ;

// --- MOUSE DOWN ---
    this.canvas.addEventListener('mousedown', e => {
      const { x, y, ex, ey } = toL(e);
      const stripH = this.paneConfig.stockStripHeight || 0;
      const overStrip = stripH > 0 && y > this.H - stripH;
      const hit = this.hitTest(x, y);

      // A node that can be dragged is selected singly; one that cannot —
      // a zone, a ring, a key — toggles, so a set can be built up.
      const access = hit ? Values.access(this._ctxMix(), hit, this.params) : null;

      /* Something draggable is selected singly; something only selectable —
         a ring, a key, a band — toggles, so a set can be built up. */
      const additive = e.shiftKey || e.metaKey || e.ctrlKey || (access && !access.draggable);

      if (!access) this.clearSelection();
      else if (!additive) { this.clearSelection(); access.setValue({ selected: true }); }
      else access.setValue({ selected: !access.getValue()?.selected });

      this.selectedHit = access?.getValue()?.selected ? hit : null;
      this.dragHit = hit;
      if (this.app?.selectNode) this.app.selectNode(this.selectedHit, this);

      if (!hit?.node && !overStrip) {

    });

// Selection lives with the items, so clearing it is a walk, not a set to empty.
    this.clearSelection = () => {
      const mix = this._ctxMix();
      sceneRegistry.walkPhase(mix, 'clear_selection', this.node, this.params);
      if (this.selectedHit) Values.access(mix, this.selectedHit, this.params).setValue({ selected: false });
      this.selectedHit = null;
    };

// --- MOUSE MOVE ---
    this.canvas.addEventListener('mousemove', e => {
      if (this.isPanning) {

        cam.scrollX = (cam.scrollX || 0) - (e.clientX - this.lastMouseX) / z;
        cam.scrollY = (cam.scrollY || 0) - (e.clientY - this.lastMouseY) / z;
        this.lastMouseX = e.clientX;
        this.lastMouseY = e.clientY;
        this.draw();
        if (typeof hideTooltip !== 'undefined') hideTooltip();
        return;
      }

      const { x, y, ex, ey } = toL(e);

      if (this.dragHit) {
        if (this.dragHit.interactions?.applyDrag) {
      // Pass screen-local coords; PaneCameraNode's wrap converts
      // to the correct world space for whatever camera nesting exists.
          this.dragHit.interactions.applyDrag(x, y);
          this.draw();
        }
        return;
      }      

      const hit = this.hitTest(x, y);

      const mixNow = this._ctxMix();
      const prev = this.hoveredHit;
      if (prev && prev !== hit) Values.access(mixNow, prev, this.params).setValue({ hovered: false });

      const access = hit ? Values.access(mixNow, hit, this.params) : null;
      let changed = (prev == null) !== (hit == null);
      if (access) changed = access.setValue({ hovered: true }) || changed;
      this.hoveredHit = hit;
      if (changed) this.draw();

      const tip = access?.getTooltip();
      if (tip) showTooltip?.(ex, ey, { ...tip, selected: !!access.getValue()?.selected });
      else hideTooltip?.();

      this.canvas.style.cursor = access ? (access.draggable ? 'grab' : 'pointer') : 'default';
    });

// --- MOUSE UP ---

    this.canvas.addEventListener('mouseup', (e) => {
      if (this.dragHit) {
        if (this.dragHit.interactions?.endDrag) {
      // Detect if dropped over the stock-strip area
          const { y } = toL(e);
          const stripH = this.paneConfig.stockStripHeight || 0;
          const onStrip = stripH > 0 && y > this.H - stripH;
          this.dragHit.interactions.endDrag(onStrip);
        }
        this.dragHit = null;
        this.draw();
      }
      if (this.isPanning) {
        this.isPanning = false;
        this.canvas.style.cursor = this.hoveredHit ? 'pointer' : 'default';
      }
    });


// --- MOUSE LEAVE ---
    this.canvas.addEventListener('mouseleave', () => {
      if (this.hoveredHit) {
        Values.access(this._ctxMix(), this.hoveredHit, this.params).setValue({ hovered: false });
        this.hoveredHit = null;
        this.draw();
      }
      hideTooltip?.();
      if (this.dragHit) {
        if (this.dragHit.interactions?.endDrag) this.dragHit.interactions.endDrag(false);
        this.dragHit = null;
        this.draw();
      }
      this.isPanning = false;
      this.canvas.style.cursor = 'default';
    });
  }
}

DemoHarness3D — owns a 3D pane: init / re-attach, per-frame render,
resize, and control routing.

//<< import { DemoHarness3D } from './demo-harness3-d.js';
//-- file: ./demo-harness3-d.js --
//>> export { DemoHarness3D };
class DemoHarness3D {
  constructor(div, paneConfig, app) {
    this.container = div;
    this.paneConfig = paneConfig;
    this.app = app;
    this.view = null;

    if (typeof paneConfig.init !== 'function') return;

    if (paneConfig._view) {
  // ── Re-attach an existing view (happens on layout rebuild) ──
      this.view = paneConfig._view;
      const title = div.querySelector('.pane-title-3d');
      div.insertBefore(this.view.renderer.domElement, title);
      if (this.view.ro) {
        this.view.ro.unobserve(this.view.container);
        this.view.ro.observe(div);
      }
      this.view.container = div;
    } else {
  // ── First-time init ──
      this.view = paneConfig.init(div);
      paneConfig._view = this.view;

  // Push initial control values through onControl
      if (this.view && paneConfig.onControl) {
        const initVals = {};
        (paneConfig.controls || []).forEach(c => { if (c.id) initVals[c.id] = c.value; });
        paneConfig.onControl(null, null, () => initVals, app);
      }
    }
  }

/* ── per-frame (called from App.animate) ───────────────────────── */

  animate() {
    const v = this.view;
    if (!v) return;
    v.controls.update();
    if (v.phyloNode) {
      v.phyloNode.value.group.rotation.z += 0.001;
      v.phyloNode.value.group.rotation.x = Math.sin(Date.now() * 0.0003) * 0.1;
    }
    v.renderer.render(v.scene, v.camera);
  }

/* ── resize (called from App.resize as a safety net;
    the ResizeObserver in make3DPane also fires) ──────────────── */

  resize() {
    const v = this.view;
    if (!v) return;
    const w = v.container.clientWidth, h = v.container.clientHeight;
    if (w > 0 && h > 0) {
      v.camera.aspect = w / h;
      v.camera.updateProjectionMatrix();
      v.renderer.setSize(w, h);
    }
  }

/* ── control routing (called by App.handleHudChange) ───────────── */

  applyControl(id, val, getValues) {
    if (this.paneConfig.onControl) {
      this.paneConfig.onControl(id, val, getValues, this.app);
    }
  }
}

//>> import { SYS, sceneRegistry } from './sys.js';
//>> import { HtmlFill } from './html-nodes.js';
