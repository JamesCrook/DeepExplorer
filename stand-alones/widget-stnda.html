/* ═══════════════════════════════════════════════════════════════════════════
DemoHarnessHtml — owns an HTML pane: mount once, update on change, events,
selection, and control-value routing.  The third harness, beside
DemoHarness2D and DemoHarness3D, and the panopticon's counterpart to the
library's OmniHtml.

Retained, not immediate.  The 2D harness redraws the whole pane every frame;
this one walks 'mount' once, keeps the elements, and afterwards walks only
'update', which re-applies whatever params can change.  No new phases: mount,
update, resize and teardown are the four OmniHtml already uses.

The ctxMix is the HudPanel shape (parentEl, parentStack, setParam,
onParamChange, render, clearActivePreset), so a node type written for the HUD
mounts here unchanged.  Params follow the HUD's one-channel rule: a node reads
the params the walk passes it, and writes only through ctxMix.setParam.

Param flow
  widget  → setParam + onParamChange → _paramChanged → model, controls, app
  HUD     → App.handleHudChange → applyControl → model.onControl → update
A model may translate a widget's param into the HUD's by returning a map from
onParamChange (the colour picker writes #rrggbbaa; the HUD's colour input
only takes #rrggbb).

Pre-passes
  Before the first mount, any node whose value has prepare: ['scroller', …]
  has its children rewritten by the prepass.<name> functions in
  SYS.FUNCTIONS, and so on down the tree, including nodes a pre-pass made.
  This is how a flat list, as Markdown+ rules emit it, becomes the nested
  scene D+ draws (sections with sticky heads, a scroller, zones).

Events as data
  A node's value may carry on: { click: …, 'keydown:Enter': …, files: … }.
  One listener per DOM event kind sits on the pane's root.  On an event, the
  harness walks from the target up through elements that are nodes; the
  first with a matching entry runs it, and the walk stops.  The deepest node
  passed on the way is the item, so a list can hold one on for all its
  items.  Widgets raise their own events (a file drop raises 'files') with
  ctxMix.fire(node, name, data), which looks up the same way.

  Markup that is not a node (a template's inner button, raw HTML from a
  note) says the same with attributes: data-on="…" for a click,
  data-on-<event>="…" for another event, data-on-<event>-<key> for a key
  (data-on-keydown-enter).  The item is the nearest node above it.

  An entry is an action, or a list of them.  An action is a record
  action.<name> in SYS.FUNCTIONS, { args: [names], fn(ctx, args) }:
      'nav note {label}'                            short form, positional
      { action: 'nav', kind: 'note', target: '{label}' }
  {key} in an argument is filled from the item's value, then from params.
  The last named argument takes the rest of a short form, spaces and all.

Selection groups
  A node with value.group belongs to a group; the param of the same name
  holds the key of the group's active member (value.groupKey, else
  value.key, else value.id).  After each mount, update and edit, members get
  is-active, and the rest lose it.  A node or its type's meta may name the
  classes instead, activeClass and inactiveClass, for CSS that already has
  its own words (D+: .active, .dormant).  action.select sets the param, so
  "active topic" is data, not toggled classes.

Selection for editing, without a mode
  Only when the app can show a selection (app.selectNode).  A pointerdown anywhere in the pane is watched in the capture phase, before
  the widget sees it, and never stopped.  The nearest node whose class
  declares meta.editableFields becomes the selection and goes to
  App.selectNode, which fills the Selected panel.  The widget then handles
  the same pointerdown as usual: one press both selects and drags a slider.
  A class with meta.selectFirst (links) has the click that selected it
  swallowed, so it can be chosen without being followed.  Elements map back
  to nodes through node.inst.el, which every html node sets, and through
  node.inst.clones for the nodes a repeat or variants made.

  An edit arrives as edited(node): the node is torn down and mounted again in
  place.  wrap(node, type) and unwrap(node) change the tree around a node and
  remount its parent.

Loading
  replace(node, kids) swaps a node's children for new ones: the old are torn
  down, the new are prepared (their prepare lists run), and any with zoneOut
  go to the box with that zone anywhere in the scene, replacing what it held.
  The node itself stays mounted, so a zone keeps its element while each
  document loaded into it comes and goes.  append(node, kid) adds one child
  at the end, mounted.

Layout rebuilds detach the pane's div, not the harness.  App calls attach()
each time, which re-parents the same root, so widget state survives solo and
unsolo.
═══════════════════════════════════════════════════════════════════════════ */
class DemoHarnessHtml {
  static EVENTS = ['click', 'dblclick', 'input', 'change', 'keydown'];

  /** Reuse the pane's harness if it has one, else make it; then attach. */
  static attach(div, paneConfig, app) {
    const h = paneConfig.harness instanceof DemoHarnessHtml
      ? paneConfig.harness
      : new DemoHarnessHtml(paneConfig, app);
    h.container = div;
    div.appendChild(h.root);
    return h;
  }

  constructor(paneConfig, app) {
    this.paneConfig = paneConfig;
    this.app = app;
    this.node = paneConfig.sceneRoot;
    paneConfig.harness = this;

// ── Seed params: HUD control values, then the model's own non-HUD params ──
    this.params = {};
    for (const c of paneConfig.controls || []) {
      if (c.id && c.value !== undefined) this.params[c.id] = c.value;
    }
    Object.assign(this.params, paneConfig.params || {});

    this._prepare(this.node);
    this.root = document.createElement('div');
    this.root.className = 'html-pane';

    this._walk('mount', this.root);
    this._index(this.node);
    this._applyGroups();
    this._listen();

/* ── tree ──────────────────────────────────────────────────────── */

  static classOf(node) { return node ? sceneRegistry.meta[node.type]?.nodeClass ?? null : null; }

  /** A node's children for traversal: its subtree, and any clones it made. */
  static kids(node) {
    return [...(node.subtree || []), ...(node.inst?.clones || [])];
  }

  /** The first node, depth first, that satisfies pred. */
  find(pred, node = this.node) {
    if (pred(node)) return node;
    for (const k of DemoHarnessHtml.kids(node)) { const f = this.find(pred, k); if (f) return f; }
    return null;
  }

  /** The node whose subtree holds child (clones have no parent to edit). */
  parentOf(child, node = this.node) {
    if (node.subtree?.includes(child)) return node;
    for (const k of node.subtree || []) { const p = this.parentOf(child, k); if (p) return p; }
    return null;
  }

  _prepare(node) {
    for (const name of node.value?.prepare || []) {
      const rec = SYS.named(SYS.FUNCTIONS, 'prepass.' + name);
      if (rec) node.subtree = rec.fn(node.subtree || [], node);
      else console.warn(`no prepass.${name} in SYS.FUNCTIONS`);

    for (const k of node.subtree || []) this._prepare(k);

  _index(node) {

      const on = node.value?.on;
      const spec = on && ((e.key && on[`${e.type}:${e.key}`]) ?? on[e.type]);
      if (spec === undefined || spec === null) continue;

  run(spec, ctx) {

        ({ action, ...args } = one);
      }
      const rec = SYS.named(SYS.FUNCTIONS, 'action.' + action);
      if (!rec) { console.warn(`no action.${action} in SYS.FUNCTIONS`); continue; }
      const scope = { ...this.params, ...(ctx.item?.value || {}) };
      for (const k in args) if (typeof args[k] === 'string') args[k] = HtmlFill.fill(args[k], scope);

  static keyOf(node) { return node?.value?.groupKey ?? node?.value?.key ?? node?.value?.id; }

  _applyGroups(node = this.node) {
    const g = node.value?.group;
    if (g && node.inst?.el) {
      const meta = sceneRegistry.meta[node.type];
      const on = node.value.activeClass ?? meta?.activeClass ?? 'is-active';
      const off = node.value.inactiveClass ?? meta?.inactiveClass;
      const active = String(DemoHarnessHtml.keyOf(node)) === String(this.params[g]);
      node.inst.el.classList.toggle(on, active);
      if (off) node.inst.el.classList.toggle(off, !active);

    for (const k of DemoHarnessHtml.kids(node)) this._applyGroups(k);

/* ── selection for editing ─────────────────────────────────────── */

  /** The nearest node at or above an element that has something to edit. */
  _nodeAt(target) {

      // HUD or the widget itself changed since selection shows up.
      if (node === this.selectedNode) { if (node) this.app?.updateSelectedPanel?.(); return; }

  /** Called by App when the selection moves to another pane. */
  clearSelection() { this._select(null); }

  /** Called by App after it has spliced a node out of the scene. */

    if (this.selectedNode === node) this._select(null);
  }

  /** Put node inside a new node of the given type (a template with a slot,
      a box), in node's place.  Returns the wrapper, or null at the root. */
  wrap(node, type, value = {}) {
    const parent = this.parentOf(node);
    if (!parent) return null;
    const wrapper = SYS.makeNode(type, value, [node]);
    parent.subtree[parent.subtree.indexOf(node)] = wrapper;
    this.edited(parent);
    return wrapper;
  }

  /** Replace node by its children.  Returns the parent, or null. */
  unwrap(node) {
    const parent = this.parentOf(node);
    if (!parent) return null;
    parent.subtree.splice(parent.subtree.indexOf(node), 1, ...(node.subtree || []));
    sceneRegistry.runPhases(this._ctxMix(this.root), node, this.params, ['teardown']);
    this.edited(parent);
    return parent;
  }

/* ── loading ───────────────────────────────────────────────────── */

  /** Lift every zoneOut node out of a tree, depth first; return them. */
  static liftZoneOut(node) {
    const out = [];
    const lift = (n) => {
      if (!n.subtree) return;
      n.subtree = n.subtree.filter(k => (k.value?.zoneOut ? (out.push(k), false) : true));
      n.subtree.forEach(lift);
    };
    lift(node);
    return out;
  }

  /** Replace node's children with kids, prepared; zoneOut kids go to their
      zones, replacing what those held.  Returns the zones touched. */
  replace(node, kids) {
    const tmp = { type: node.type, value: node.value, subtree: kids };
    this._prepare(tmp);
    const moving = DemoHarnessHtml.liftZoneOut(tmp);    // reassigns tmp.subtree
    const plan = new Map([[node, tmp.subtree]]);
    for (const k of moving) {
      const z = this.find(x => x.value?.zone === k.value.zoneOut);
      if (!z) { console.warn(`zoneOut '${k.value.zoneOut}': no box with that zone`); continue; }
      if (!plan.has(z)) plan.set(z, []);
      plan.get(z).push(k);
    }
    for (const [z, list] of plan) this._swapKids(z, list);
    return [...plan.keys()];
  }

  _swapKids(node, kids) {
    const el = node.inst?.el;
    for (const k of node.subtree || []) sceneRegistry.runPhases(this._ctxMix(el), k, this.params, ['teardown']);
    el?.replaceChildren();
    node.subtree = kids;
    if (!el) return;
    for (const k of kids) sceneRegistry.runPhases(this._ctxMix(el), k, this.params, ['mount']);
    this._index(node);
    this._applyGroups(node);
  }

  /** Add one child at the end of node's subtree, and mount it. */
  append(node, kid) {
    (node.subtree ||= []).push(kid);
    this._prepare(kid);
    const el = node.inst?.slotEl ?? node.inst?.el;
    if (!el) return kid;
    sceneRegistry.runPhases(this._ctxMix(el), kid, this.params, ['mount']);
    this._index(kid);
    this._applyGroups(kid);
    return kid;
  }

/* ── ctxMix factory ────────────────────────────────────────────── */

  _ctxMix(parentEl) {
    const h = this;
    return {
      parentEl,
      parentStack: [],
      iterators: [],
      flyweight: {},
      harness: this,
      panel: null,
      setParam: (id, val) => { h.params[id] = val; },
      onParamChange: (id, val) => h._paramChanged(id, val),
      render: () => h.update(),
      fire: (node, name, data) => h.fire(node, name, data),
      clearActivePreset() {},
      closeMenu() {},
    };
  }

  _walk(phase, parentEl = this.root) {
    sceneRegistry.runPhases(this._ctxMix(parentEl), this.node, this.params, [phase]);
  }

/* ── update — batched to one walk per frame, like DemoHarness2D.draw ── */

  update() {
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => {
      this._raf = null;
      this._walk('update');
      this._applyGroups();
    });
  }

/* ── params ────────────────────────────────────────────────────── */

  /** For models and actions: write a param from outside any widget and show it. */
  setParam(id, val) {
    this.params[id] = val;
    this._paramChanged(id, val);
    this.update();
  }

  _paramChanged(id, val) {
    const echo = this.paneConfig.onParamChange?.(id, val, this) ?? { [id]: val };
    for (const [k, v] of Object.entries(echo)) {
      this._recordControl(k, v);
      this.app?.onPaneParamChange?.(this, k, v);
    }
  }

  /* Keep the model's control list current, so a HUD rebuilt for this pane
     opens where the widgets left it rather than at the declared default. */
  _recordControl(id, val) {
    const c = this.paneConfig.controls?.find(c => c.id === id);
    if (c) c.value = val;
  }

/* ── control routing (called by App.handleHudChange) ───────────── */

  applyControl(id, val, getValues) {
    this.params[id] = val;
    this._recordControl(id, val);
    if (this.paneConfig.onControl) {
      this.paneConfig.onControl(id, val, getValues, this.app);
    }
    this.update();
  }

/* ── lifecycle ─────────────────────────────────────────────────── */

  /** Called from App.resize.  The browser lays HTML out itself; the walk is
      for the rare node that must react to size. */
  resize() { this._walk('resize'); }

  /** Release listeners a node attached outside its own element, then drop
      the elements.  Nothing in the panopticon calls this yet: panes are only
      hidden, never destroyed. */
  teardown() {
    this._walk('teardown');
    this.root.remove();
    if (this.paneConfig.harness === this) this.paneConfig.harness = null;
  }
}
//-- endfile --


//<< import { ExpandingText } from './expanding-text.js';
//-- file: ./expanding-text.js --
//>> export { ExpandingText };

/* ─────────────────────────────────────────────────────────────────────────────
ExpandingText — a one-line text box that opens up when its text does not fit.

The box is a <textarea> throughout, so opening and closing it never swaps
elements: focus, the caret and any selection survive both.  Collapsed it is one
line with wrap="off", scrolling sideways like an <input>.

Clicking in a box whose text overflows opens it, sized to the text:
  - fits in two lines at its present width    → two lines, same width
  - longer                                    → wider, about two lines,
                                                up to MAX_W; past that,
                                                more lines at MAX_W
  - several lines already (a multiline field) → as wide as the longest line,
                                                up to MAX_W
Height follows the wrapped text, up to MAX_LINES, then it scrolls.  The width
is set on the box, so the row and the panel holding it widen with it.

One box is open at a time.  Typing in an open box refits it.  Esc, Enter (in
a single-line box), or clicking away closes it, and the caret is scrolled
back into view on the one line.
──────────────────────────────────────────────────────────────────────────── */

class ExpandingText {
  static MAX_W = 520;
  static MAX_LINES = 14;
  static current = null;

  /** A box for one field.  multiline lets Enter insert a newline. */
  static make(value, { multiline = false } = {}) {
    const ta = document.createElement('textarea');
    ta.className = 'xt';
    ta.rows = 1;
    ta.wrap = 'off';
    ta.spellcheck = false;
    ta.value = value ?? '';
    ta._multiline = multiline;

    ta.addEventListener('click', () => {
      if (ExpandingText.current !== ta && ExpandingText.overflows(ta)) ExpandingText.open(ta);
    });
    ta.addEventListener('input', () => {
      if (ExpandingText.current === ta) ExpandingText.fit(ta);
    });
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && ExpandingText.current === ta) {
        e.preventDefault(); e.stopPropagation();
        ExpandingText.close(ta);
      } else if (e.key === 'Enter' && !ta._multiline) {
        e.preventDefault();                       // one-line field: Enter is "done"
        ExpandingText.close(ta);
      }
    });
    ta.addEventListener('blur', () => ExpandingText.closeSoon(ta));
    ExpandingText._watchPointer();
    return ta;
  }

  /* Clicking from an open box into another field blurs the open one at
     pointerdown.  Closing it then would move everything below it before the
     pointer comes up, and the click would land on whatever slid under it.
     So a blur during a press closes once the click has been delivered. */
  static _pending = new Set();
  static _down = false;
  static _watchPointer() {
    if (ExpandingText._watching) return;
    ExpandingText._watching = true;
    document.addEventListener('pointerdown', () => { ExpandingText._down = true; }, true);
    document.addEventListener('pointerup', () => {
      ExpandingText._down = false;
      setTimeout(() => {                               // after the click event
        for (const ta of ExpandingText._pending) if (document.activeElement !== ta) ExpandingText.close(ta);
        ExpandingText._pending.clear();
      }, 0);
    }, true);
  }
  static closeSoon(ta) {
    if (ExpandingText._down) ExpandingText._pending.add(ta);
    else ExpandingText.close(ta);
  }

  static overflows(ta) {
    return ta.scrollWidth > ta.clientWidth + 1 || ta.value.includes('\n');
  }

  static open(ta) {
    if (ExpandingText.current && ExpandingText.current !== ta) ExpandingText.close(ExpandingText.current);
    ExpandingText.current = ta;
    ta._w0 = ta.getBoundingClientRect().width;    // the collapsed width, before anything moves
    ta.classList.add('xt-open');
    ta.parentElement?.classList.add('xt-row-open');
    ta.wrap = 'soft';
    ExpandingText.fit(ta);
  }

  static close(ta) {
    if (!ta.classList.contains('xt-open')) return;
    if (ExpandingText.current === ta) ExpandingText.current = null;
    ta.classList.remove('xt-open');
    ta.parentElement?.classList.remove('xt-row-open');
    ta.wrap = 'off';
    ta.style.width = ta.style.height = ta.style.overflowY = '';
    ta.scrollTop = 0;
    ExpandingText.revealCaret(ta);
  }

  static fit(ta) {
    const cs = getComputedStyle(ta);
    const ctx = ExpandingText._ctx ??= document.createElement('canvas').getContext('2d');
    ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const px = (k) => parseFloat(cs[k]) || 0;
    const padX = px('paddingLeft') + px('paddingRight') + px('borderLeftWidth') + px('borderRightWidth') + 4;
    const padY = px('paddingTop') + px('paddingBottom') + px('borderTopWidth') + px('borderBottomWidth');

    const widths = ta.value.split('\n').map(l => ctx.measureText(l).width);
    const longest = Math.max(0, ...widths), total = widths.reduce((a, b) => a + b, 0);
    const w0 = ta._w0 || ta.clientWidth;
    const wMax = Math.max(w0, Math.min(ExpandingText.MAX_W, innerWidth * 0.6));
    const clampW = (w) => Math.max(w0, Math.min(wMax, w));

    let w;
    if (widths.length > 1)           w = clampW(longest + padX);
    else if (total + padX <= 2 * w0) w = w0;
    else                             w = clampW(total / 2 + padX + 16);   // slack for word breaks
    ta.style.width = w + 'px';

    ta.style.height = 'auto';
    const lineH = px('lineHeight') || 1.3 * px('fontSize');
    const maxH = lineH * ExpandingText.MAX_LINES + padY;
    const h = Math.min(ta.scrollHeight, maxH);
    ta.style.height = h + 'px';
    ta.style.overflowY = ta.scrollHeight > maxH + 1 ? 'auto' : 'hidden';
  }

  /* Collapsed, the box shows one line scrolled sideways; show the caret's. */
  static revealCaret(ta) {
    const ctx = ExpandingText._ctx; if (!ctx) return;
    const before = ta.value.slice(0, ta.selectionEnd);
    const lineIndex = before.split('\n').length - 1;
    const line = before.slice(before.lastIndexOf('\n') + 1);
    const cs = getComputedStyle(ta);
    ta.scrollTop = lineIndex * (parseFloat(cs.lineHeight) || 1.3 * parseFloat(cs.fontSize));
    ta.scrollLeft = Math.max(0, ctx.measureText(line).width - ta.clientWidth + 24);
  }
}
//-- endfile --


//<< import { FieldNode } from './field-node.js';
//-- file: ./field-node.js --
//>> import { SYS } from './sys.js';
//>> import { ExpandingText } from './expanding-text.js';
//>> export { FieldNode };

/* ─────────────────────────────────────────────────────────────────────────────
FieldNode — one labelled control for editing one value: the row of a
property panel.  The Selected panel is built from these.

  key, label        what it edits, what it is called
  kind              text | number | select | checkbox | color
  value             the starting value
  options           [[value, label], …] for select
  multiline         text only: Enter makes a newline (template markup)

A text field is an ExpandingText.  On every change the field raises its own
event, 'edit', with { key, value, field } as data; whatever holds the fields
says what an edit means with on: { edit: … }.  The field knows nothing about
what it is editing, which is what lets the same node serve the Selected
panel now and the HUD later.

The field descriptors that classes return from meta.editableFields are
exactly these values (type is accepted for kind), so a class's own list is
the panel's scene with nothing translated.
──────────────────────────────────────────────────────────────────────────── */

class FieldNode {
  static mount(ctxMix, node, params) {
    const f = node.value || {}, kind = f.kind ?? f.type ?? 'text';
    const row = document.createElement('div');
    row.className = 'sel-row';
    const span = document.createElement('span');
    span.textContent = f.label ?? f.key;
    row.appendChild(span);

    let inp;
    if (kind === 'text') {
      inp = ExpandingText.make(f.value, { multiline: !!f.multiline });
    } else if (kind === 'select') {
      inp = document.createElement('select');
      for (const [val, text] of f.options || []) {
        const o = document.createElement('option');
        o.value = val; o.textContent = text ?? val;
        if (String(f.value ?? '') === String(val)) o.selected = true;
        inp.appendChild(o);
      }
    } else {
      inp = document.createElement('input');
      inp.type = kind;
      if (kind === 'checkbox') inp.checked = !!f.value; else inp.value = f.value ?? '';
    }
    const read = () => kind === 'number' ? Number(inp.value)
      : kind === 'checkbox' ? inp.checked
      : kind === 'text' && !f.multiline ? inp.value.replace(/\n/g, ' ')
      : inp.value;
    inp.addEventListener(kind === 'select' || kind === 'checkbox' ? 'change' : 'input', () => {
      ctxMix.fire?.(node, 'edit', { key: f.key, value: read(), field: f });
    });
    row.appendChild(inp);
    node.inst = { ...(node.inst || {}), el: row, input: inp };
    ctxMix.parentEl.appendChild(row);
  }
}

SYS.NODE_CLASSES.push({ name: 'field',            cls: FieldNode });

/* The panel's buttons are a template like any other. */
SYS.TEMPLATES.push({ name: 'tool-button', markup: '<button class="sel-btn">{label}</button>', from: 'field-node' });
//-- endfile --


//<< import { App } from './app.js';
//-- file: ./app.js --
//>> import { SYS } from './sys.js';
//>> import './organiser-model.js';   // self-registers the show/hide panel
//>> import { loadThree } from './three-boot.js';
//>> import { Values } from './values.js';
//>> import { Utils } from './utils.js';
//>> import { DemoHarness2D } from './demo-harness2-d.js';
//>> import { DemoHarness3D } from './demo-harness3-d.js';
//>> import { DemoHarnessHtml } from './demo-harness-html.js';
//>> import { HudPanel } from './hud-panel.js';
//>> import './field-node.js';   // 'field', 'tool-button': the Selected panel's scene
//>> export { App };
/* ═══════════════════════════════════════════════════════════════════════════
App — the application shell.

Changes from original:
- this.views3D replaced by this.harnesses (holds both 2D and 3D).
- buildLayout creates DemoHarness2D / DemoHarness3D uniformly.
- resize / animate delegate to harnesses instead of inlining 3D logic.
- handleHudChange routes control changes through the active model's
 harness, so 2D controls now take effect (not just display).

Changes for widget-stnda:
- buildLayout gives a displayType 'html' model a DemoHarnessHtml.  The
 harness is kept on the model and re-attached on each rebuild, as a 3D
 pane keeps its view.
- onPaneParamChange lets an HTML pane's widgets move the HUD's controls,
 the reverse of handleHudChange.
- The constructor calls SYS.audit(), so a template or function name pushed
 twice is reported once at startup.
═══════════════════════════════════════════════════════════════════════════ */
class App {
  constructor() {
    SYS.audit();   // a template or function name pushed twice, reported once
    this.container = document.getElementById('container');
    this.paneEls = [];
    this.harnesses = [];
    this.hudState = {};

    SYS.MODELS.forEach((m, i) => {
      this.hudState['vis_' + i] = m.visible !== false;
      if (m.controls) {
        m.controls.forEach(c => {
          if (c.id && c.value !== undefined) this.hudState[c.id] = c.value;
        });
      }
    });

    this.activeModel = SYS.MODELS.find(m => (m.displayType || '2d') !== 'none' && m.visible !== false);
    this.buildHud();

    loadThree().then(() => {
      this.buildLayout();
      this.animate();
    });

    const handleResize = () => {
      if (this._resizeTimer) clearTimeout(this._resizeTimer);
      this._resizeTimer = setTimeout(() => this.resize(), 50);
    };
    new ResizeObserver(handleResize).observe(document.body);
    window.addEventListener('resize', handleResize);
  }

/* ── HUD ───────────────────────────────────────────────────────── */

  solo() {
    this._applyVisibility(
      SYS.MODELS.map(m => m === this.activeModel ?? 0),
      SYS.MODELS.map(m => m.visible !== false)
      );
  }

  unsolo() {
    this._applyVisibility(
      this._soloRestore ?? [], 
      null
      );
  }

  _applyVisibility(visibilities, saved) {
    SYS.MODELS.forEach((m, i) => this.hudState[`vis_${i}`] = m.visible = visibilities[i]);
    this._soloRestore = saved;
    this.buildHud();
    this.buildLayout();
  }

  buildHud() {
    let savedPosition = {
      top: parseInt(this?.hud?._root?.style?.top, 10) || 60,
      left: parseInt(this?.hud?._root?.style?.left, 10) || 12
    };
    this?.hud?.destroy?.();

    const controls = [];

    const dropdownModels = SYS.MODELS.filter(m => m.visible !== false);
    if (!dropdownModels.includes(this.activeModel) && dropdownModels.length > 0) {
      this.activeModel = dropdownModels[0];
    }

    if (dropdownModels.length > 0) {
      controls.push({ type: 'separator', label: 'Active Panel' });
      controls.push({
        type: 'select', id: 'activePanel', label: 'Controls For',
        options: dropdownModels.map(m => [
          String(SYS.MODELS.indexOf(m)),
          m.name?.split(/[.·]/)[0].trim() || 'Unnamed',
        ]),
        value: String(SYS.MODELS.indexOf(this.activeModel)),
      });
      controls.push(
      {
        type: 'button',
        label: this._soloRestore ? 'Unsolo' : 'Solo',
        action: () => this._soloRestore ? this.unsolo() : this.solo()
      }
      );

      controls.push(...(
        this.activeModel?.controls ?? 
        this.activeModel?.getControls?.(this) ?? 
        [])
      );
    }

    this.hud = new HudPanel({
      title: 'Widgets',
      controls,
      position: savedPosition, 
      onChange: (id, val) => this.handleHudChange(id, val),
    });

    if (!this._selPanel) {
      this._selPanel = document.createElement('div');
      this._selPanel.className = 'hud-panel';
      this._selPanel.style.cssText = 'position:absolute; top:12px; right:12px; display:none; min-width:220px;';
      document.body.appendChild(this._selPanel);
      this._dragByHeading(this._selPanel);
    }
  }

/* The Selected panel is rebuilt on every selection, heading included, so it is
   dragged by delegation: a press on whatever h3 it holds now.  Listeners are
   attached once.  Its position persists because the panel element does. */
  _dragByHeading(panel) {
    let drag = null;
    panel.addEventListener('mousedown', e => {
      if (e.target.tagName !== 'H3') return;
      const r = panel.getBoundingClientRect();
      drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
      panel.style.right = 'auto';
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!drag) return;
      panel.style.left = (e.clientX - drag.dx) + 'px';
      panel.style.top  = (e.clientY - drag.dy) + 'px';
    });
    window.addEventListener('mouseup', () => { drag = null; });
  }

/* ── selection ──────────────────────────────────────────────────── */

  /* Choosing a panel (the HUD's Controls For, or a pane's title) starts
     afresh: nothing selected in any pane, and the Selected box hidden, since
     what it showed may belong to another panel. */
  clearSelection() { this.selectNode(null, null); }

  selectNode(hit, harness) {
    /* One selection for the whole page: when it moves to another pane, the
       pane it leaves drops its highlight. */
    const prev = this.activeHarness;
    if (prev && prev !== harness) {
      prev.clearSelection?.();
      prev.selectedHit = null;
      prev.draw?.();
    }
    this.selectedHit = hit;
    this.selectedNode = hit?.node ?? null;
    this.activeHarness = harness;
    this.updateSelectedPanel();
  }

  removeSelectedNode() {
    const node = this.selectedNode;
    if (!node) return;

    let params = {};
    const removeFrom = (parent) => {
      if (!parent.subtree) return false;
      const idx = parent.subtree.indexOf(node);
      if (idx >= 0) { Utils.removeChild(parent, node, params); return true; }
      for (const child of parent.subtree) {
        if (removeFrom(child)) return true;
      }
      return false;
    };

// Search the harness the node was selected from first,
// then fall back to all 2D non-zoned harnesses
    const candidates = this.activeHarness
    ? [this.activeHarness, ...this.harnesses.filter(h => h !== this.activeHarness)]
    : this.harnesses;

    for (const h of candidates) {
      if (!h.node)
        continue;
      params = h.params || {};
      if (removeFrom(h.node)) {
        this.selectedNode = null;
        this.selectedHit = null;
        this.activeHarness = null;
        this.updateSelectedPanel();
        h.selectedHit = null;
        h.hoveredHit = null;
        if (h.removed) h.removed(node);   // retained: take its elements out
        else h.draw();                    // immediate: the next frame omits it
        return;
      }
    }
  }

  /* The Selected panel is a scene, mounted by its own DemoHarnessHtml in the
     floating panel: a heading, a Remove button, one field node per entry of
     the class's meta.editableFields, and the wrap tools.  It is rebuilt on
     each selection.  Its harness is given no app, so pressing in it selects
     nothing; what its buttons and fields mean arrives at _selectedPanelEvent
     through on entries, like any other scene's events. */
  updateSelectedPanel() {
    const el = this._selPanel, node = this.selectedNode;
    this._selHarness?.teardown();
    this._selHarness = null;
    if (!node) { el.style.display = 'none'; return; }

    const cls = Utils.classOfNode(node);
    const mixNow = this.activeHarness?._ctxMix();
    const shown = this.selectedHit && mixNow
      ? { ...node, value: Values.access(mixNow, this.selectedHit, this.activeHarness.params).getValue() }
      : node;
    const fields = cls?.meta?.editableFields?.(shown) ?? [];
    const n = SYS.makeNode;

    const tools = [];
    const h = this.activeHarness;
    if (h?.wrap && h.parentOf(node)) {
      const wrappers = [['html-box', 'a box'], ...SYS.namesIn(SYS.TEMPLATES)
        .filter(t => /<slot\b/.test(SYS.named(SYS.TEMPLATES, t).markup)).map(t => [t, t])];
      tools.push(
        n('field', { key: '$wrapWith', label: 'Wrap in', kind: 'select', value: wrappers[0][0], options: wrappers }),
        n('tool-button', { label: '⧉ Wrap', on: { click: 'emit wrap' } }),
      );
      if (node.subtree?.length) tools.push(n('tool-button', { label: '⇱ Unwrap (keep children)', on: { click: 'emit unwrap' } }));
    }

    const scene = n('html-box', { class: 'sel-scene', on: { edit: 'emit edit' } }, [
      n('html-text', { tag: 'h3', text: `SELECTED ${node.type.toUpperCase()}` }),
      n('tool-button', { label: '✕ Remove Node', on: { click: 'emit remove' } }),
      ...fields.map(f => n('field', { ...f, kind: f.kind ?? f.type })),
      ...(tools.length ? [n('html-box', { class: 'sel-tools' }, tools)] : []),
    ]);

    el.style.display = 'block';
    el.replaceChildren();
    this._selHarness = DemoHarnessHtml.attach(el, {
      sceneRoot: scene,
      params: { $wrapWith: tools.length ? tools[0].value.value : null },
      onEmit: (event, ctx) => this._selectedPanelEvent(event, ctx, node),
    }, null);
  }

  _selectedPanelEvent(event, ctx, node) {
    const h = this.activeHarness;
    if (event === 'remove') { this.removeSelectedNode(); return; }

    if (event === 'wrap') {
      const wrapper = h?.wrap?.(node, ctx.params.$wrapWith);
      if (wrapper) { h._select(wrapper); this.selectNode(h.selectedHit, h); }
      return;
    }
    if (event === 'unwrap') {
      if (h?.unwrap?.(node)) { h._select(null); this.selectNode(null, h); }
      return;
    }
    if (event !== 'edit') return;

    const { key, value, field } = ctx.data;
    if (key.startsWith('$')) { ctx.params[key] = value; return; }   // the panel's own setting

    // Through the interaction, so editing one item of a flyweight works
    // exactly as editing an ordinary node does.
    const mix = h?._ctxMix();
    const access = this.selectedHit && mix ? Values.access(mix, this.selectedHit, h.params) : null;
    if (key.startsWith('@')) node[key.slice(1)] = value;            // '@type': the node itself
    else if (access) access.setValue({ [key]: value });
    else node.value[key] = value;
    if (h?.edited) h.edited(node);   // retained: remount the node
    else h?.draw();                  // immediate: redraw the pane
    // A field that changes which fields exist (a template's name) rebuilds
    // the panel.  Only ever a select, so no half-typed text is lost.
    if (field.reselect) this.updateSelectedPanel();
  }


/* ── control dispatch ──────────────────────────────────────────── */

/* An HTML pane's widget changed a param: show it in the HUD if the HUD is
   currently showing that pane.  HudPanel finds its controls by element id,
   which is why the pane widgets carry none. */
  onPaneParamChange(harness, id, val) {
    this.hudState[id] = val;
    if (harness.paneConfig === this.activeModel) this.hud?.updateControl(id, val);
  }

  handleHudChange(id, val) {
    this.hudState[id] = val;

    if (id === 'activePanel') {
      this.activeModel = SYS.MODELS[parseInt(val, 10)];
      this.clearSelection();
      this.buildHud();
    } else if (id.startsWith('vis_')) {
      const mIdx = parseInt(id.split('_')[1], 10);
      if (SYS.MODELS[mIdx]) SYS.MODELS[mIdx].visible = val;
    } else {
  // Route to the active model's harness — works for 2D, 3D and HTML
      const harness = this.harnesses.find(h => h.paneConfig === this.activeModel);
      if (harness) {
        harness.applyControl(id, val, () => this.hudState);
      }
    }
  }

/* ── grid layout ───────────────────────────────────────────────── */

  bestGrid(n) {
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contW = Math.max(1, window.innerWidth);
    const contH = Math.max(1, window.innerHeight - headerH - 1);
    let bestCols = 1, bestScore = Infinity;
    for (let c = 1; c <= n; c++) {
      const r = Math.ceil(n / c), aspect = (contW / c) / (contH / r);
      const score = Math.abs(Math.log(aspect)) + (n - c * r !== 0 ? 0.3 : 0);
      if (score < bestScore) { bestScore = score; bestCols = c; }
    }
    return { cols: bestCols, rows: Math.ceil(n / bestCols) };
  }

/* ── build panes ───────────────────────────────────────────────── */

  buildLayout() {
    this.container.innerHTML = '';
    this.paneEls.length = 0;
    this.harnesses.length = 0;

    const visibleModels = SYS.MODELS.filter(p => (p.visible !== false) && (p.displayType || '2d') !== 'none');
    const N = visibleModels.length;
    document.getElementById('pane-count').textContent = `${N} of ${SYS.MODELS.length - 1} panels`;

    if (N === 0) { this.container.style.background = '#111210'; return; }

    const grid = this.bestGrid(N);
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contH = Math.max(1, window.innerHeight - headerH - 1);

    for (const pane of visibleModels) {
      const i = SYS.MODELS.indexOf(pane);
      const type = pane.displayType || '2d';
      const div = document.createElement('div');
      div.className = 'pane' + (type === '3d' ? ' pane-3d' : '');
      div.style.flexBasis = `calc(${100 / grid.cols}% - 1px)`;
      div.style.height = `${contH / grid.rows}px`;
      div.style.minWidth = '0';
      if (pane.background) div.style.background = pane.background;
      div.dataset.paneIndex = i;

      /* Clicking a pane's title makes it the active panel and solos it;
         clicking again restores the others. */
      const soloOnClick = (el) => {
        el.title = 'Click to solo this panel';
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          this.clearSelection();
          if (this._soloRestore) { this.unsolo(); return; }
          this.activeModel = pane;
          this.hudState.activePanel = String(i);
          this.solo();
        });
      };

      if (type === '2d') {
        const label = document.createElement('div');
        label.className = 'label'; label.textContent = pane.name;
        soloOnClick(label);
        div.appendChild(label);
        const canvas = document.createElement('canvas');
        div.appendChild(canvas);
        this.container.appendChild(div);

        if (pane.sceneRoot) {
          const harness = new DemoHarness2D(canvas, pane, this);
          canvas.harness = harness;
          this.harnesses.push(harness);
        }
      } else if (type === '3d') {
        const title = document.createElement('div');
        title.className = 'pane-title-3d'; title.textContent = pane.name;
        soloOnClick(title);
        div.appendChild(title);
        this.container.appendChild(div);

        const harness = new DemoHarness3D(div, pane, this);
        if (harness.view) this.harnesses.push(harness);
      } else if (type === 'html') {
        div.classList.add('pane-html');
        const label = document.createElement('div');
        label.className = 'label'; label.textContent = pane.name;
        soloOnClick(label);
        div.appendChild(label);
        this.container.appendChild(div);

        this.harnesses.push(DemoHarnessHtml.attach(div, pane, this));
      }

      this.paneEls[i] = div;
    }
  }

/* ── resize ────────────────────────────────────────────────────── */

  resize() {
    const visibleModels = SYS.MODELS.filter(p => p.visible && (p.displayType || '2d') !== 'none');
    const N = visibleModels.length;
    if (!N) return;

    const grid = this.bestGrid(N);
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contH = Math.max(1, window.innerHeight - headerH - 1);

// Adjust div sizes — individual harness ResizeObservers handle the rest
    for (const pane of visibleModels) {
      const i = SYS.MODELS.indexOf(pane);
      const el = this.paneEls[i];
      if (!el)
        continue;
      el.style.flexBasis = `calc(${100 / grid.cols}% - 1px)`;
      el.style.height = `${contH / grid.rows}px`;
    }
  }

/* ── render loop ───────────────────────────────────────────────── */

  animate() {
    requestAnimationFrame(() => this.animate());
    for (const h of this.harnesses) {
      if (h.animate) h.animate();
    }
  }
}
//-- endfile --

new App();

</script>
