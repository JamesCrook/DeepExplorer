<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexView Shingled Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #08090d; color: #e2e8f0; font-family: 'Inter', sans-serif; user-select: none; }
        #canvas-container { position: absolute; inset: 0; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        /* Scrollbar styling for the controls panel */
        #controls::-webkit-scrollbar { width: 6px; }
        #controls::-webkit-scrollbar-track { background: transparent; }
        #controls::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .control-group { margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
        .control-group:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        
        /* Custom range slider styling */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.1); border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 14px; width: 14px; border-radius: 50%; background: #a78bfa;
            cursor: pointer; -webkit-appearance: none; margin-top: -5px; box-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }
        
        /* Color input styling */
        input[type="color"] {
            -webkit-appearance: none; border: none; width: 22px; height: 22px;
            border-radius: 4px; cursor: pointer; padding: 0; background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; }

        .helper-text { position: absolute; bottom: 20px; left: 20px; font-size: 12px; color: rgba(255,255,255,0.4); pointer-events: none; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="viewer"></canvas>
    </div>
    <div class="helper-text">Pan: Drag | Zoom: Scroll Wheel | Shingle Rows: Lower 'Row H %' in controls</div>
    
    <div id="controls">
        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 border-b border-gray-700 pb-2">Layout Settings</div>
        <div id="layout-settings" class="mb-4">
            <div class="flex items-center gap-2 mb-1 text-xs text-gray-400">
                <span class="w-14 text-left">Width px</span>
                <input type="range" class="flex-1" id="layout_width" min="400" max="4000" value="1600" step="10">
                <span class="w-8 text-right tabular-nums" id="layout_width_val">1600</span>
            </div>
            <div class="flex items-center gap-2 mb-1 text-xs text-gray-400">
                <span class="w-14 text-left">Log2 B/R</span>
                <input type="range" class="flex-1" id="layout_log2" min="2" max="8" value="5" step="1">
                <span class="w-8 text-right tabular-nums" id="layout_log2_val">5</span>
            </div>
            <div class="flex items-center gap-2 mb-1 text-xs text-gray-400">
                <span class="w-14 text-left">Gap / 8B</span>
                <input type="range" class="flex-1" id="layout_gap" min="0" max="64" value="4" step="1">
                <span class="w-8 text-right tabular-nums" id="layout_gap_val">4</span>
            </div>
        </div>

        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 border-b border-gray-700 pb-2">Shingling Settings</div>
        <div id="settings-container"></div>
    </div>

    <script>
        // Configuration state for the four row types
        const configs = {
            hex: { enabled: true, bgColor: '#141047', flashColor: '#5b8def', fontSize: 34, rowHeight: 75, bgHeight: 100, flashHeight: 0 },
            ascii: { enabled: false, bgColor: '#2d1b0b', flashColor: '#5b8def', fontSize: 46, rowHeight: 70, bgHeight: 70, flashHeight: 0 },
            bit10: { enabled: false, bgColor: '#0c0a08', flashColor: '#1b22d6', fontSize: 8, rowHeight: 75, bgHeight: 100, flashHeight: 100 },
            bitsym: { enabled: false, bgColor: '#0c0a08', flashColor: '#1b22d6', fontSize: 6, rowHeight: 170, bgHeight: 170, flashHeight: 40 }
        };

        // Layout configurations
        const layoutConfig = { width: 1850, log2: 5, gap: 22 };

        const isPrint = (b) => b >= 0x20 && b <= 0x7e;

        // TCP Flag labels for BITSYM (mapping 8 bits)
        const SYMBOLS = ['FIN', 'SYN', 'RST', 'PSH', 'ACK', 'URG', 'ECE', 'CWR'];

        // Generate synthetic mock data
        const DATA_SIZE = 4096;
        const data = new Uint8Array(DATA_SIZE);
        for(let i = 0; i < DATA_SIZE; i++) {
            data[i] = (Math.sin(i * 0.1) * 127 + 128) | 0; // Wavy binary data
            if (i % 64 < 16) data[i] = 0; // Inject some zeros
        }
        // Inject readable string data to verify ASCII view
        const msg = "Welcome to the Hexaview Shingled Canvas. This data overlaps intentionally.";
        for(let i = 0; i < msg.length; i++) data[128 + i] = msg.charCodeAt(i);

        function buildUI() {
            // Bind layout controls
            ['width', 'log2', 'gap'].forEach(prop => {
                const el = document.getElementById(`layout_${prop}`);
                el.addEventListener('input', (e) => {
                    layoutConfig[prop] = Number(e.target.value);
                    document.getElementById(`layout_${prop}_val`).textContent = layoutConfig[prop];
                    requestAnimationFrame(render);
                });
            });

            const container = document.getElementById('settings-container');
            
            Object.keys(configs).forEach(type => {
                const conf = configs[type];
                
                const group = document.createElement('div');
                group.className = 'control-group';
                
                const isBit = type === 'bit10' || type === 'bitsym';
                const minFont = isBit ? 1 : 6;
                const maxFont = isBit ? 22 : 64;
                const enab = conf.enabled ? "checked " : ""
                
                group.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-sm font-bold tracking-wide text-white flex items-center gap-2">
                            <input type="checkbox" ${enab} id="${type}_enabled" class="accent-purple-500 rounded">
                            ${type.toUpperCase()}
                        </label>
                        <div class="flex items-center gap-2">
                            <input type="color" id="${type}_bgColor" value="${conf.bgColor}" title="Background Color">
                            <input type="color" id="${type}_flashColor" value="${conf.flashColor}" title="Flash Color">
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 mb-1 text-xs text-gray-400">
                        <span class="w-12 text-left">Font</span>
                        <input type="range" class="flex-1" id="${type}_fontSize" min="${minFont}" max="${maxFont}" value="${conf.fontSize}">
                        <span class="w-8 text-right tabular-nums" id="${type}_fontSize_val">${conf.fontSize}</span>
                    </div>
                    
                    <div class="flex items-center gap-2 mb-1 text-xs text-gray-400">
                        <span class="w-12 text-left">Row%</span>
                        <input type="range" class="flex-1" id="${type}_rowHeight" min="0" max="200" value="${conf.rowHeight}">
                        <span class="w-8 text-right tabular-nums" id="${type}_rowHeight_val">${conf.rowHeight}</span>
                    </div>
                    
                    <div class="flex items-center gap-2 mb-1 text-xs text-gray-400">
                        <span class="w-12 text-left">Bg%</span>
                        <input type="range" class="flex-1" id="${type}_bgHeight" min="0" max="200" value="${conf.bgHeight}">
                        <span class="w-8 text-right tabular-nums" id="${type}_bgHeight_val">${conf.bgHeight}</span>
                    </div>
                    
                    <div class="flex items-center gap-2 mb-1 text-xs text-gray-400">
                        <span class="w-12 text-left">Flash%</span>
                        <input type="range" class="flex-1" id="${type}_flashHeight" min="0" max="200" value="${conf.flashHeight}">
                        <span class="w-8 text-right tabular-nums" id="${type}_flashHeight_val">${conf.flashHeight}</span>
                    </div>
                `;
                
                container.appendChild(group);

                // Wire up event listeners
                const bindControl = (prop, isCheckbox = false) => {
                    const el = document.getElementById(`${type}_${prop}`);
                    if (!el) return;
                    el.addEventListener('input', (e) => {
                        configs[type][prop] = isCheckbox ? e.target.checked : (el.type === 'number' || el.type === 'range' ? Number(e.target.value) : e.target.value);
                        if(el.type === 'range') document.getElementById(`${type}_${prop}_val`).textContent = el.value;
                        requestAnimationFrame(render);
                    });
                };

                bindControl('enabled', true);
                bindControl('bgColor');
                bindControl('flashColor');
                bindControl('fontSize');
                bindControl('rowHeight');
                bindControl('bgHeight');
                bindControl('flashHeight');
            });
        }

        buildUI();

        const canvas = document.getElementById('viewer');
        const ctx = canvas.getContext('2d');
        
        let cvsW, cvsH;
        let zoom = 1.0;
        let scrollX = -20; // Initial padding
        let scrollY = -20;
        
        function resize() {
            cvsW = window.innerWidth;
            cvsH = window.innerHeight;
            // Handle high DPI displays
            const dpr = window.devicePixelRatio || 1;
            canvas.width = cvsW * dpr;
            canvas.height = cvsH * dpr;
            ctx.scale(dpr, dpr);
            requestAnimationFrame(render);
        }
        window.addEventListener('resize', resize);
        
        // Pan logic
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;
        
        canvas.addEventListener('mousedown', e => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            scrollX -= (e.clientX - lastMouseX) / zoom;
            scrollY -= (e.clientY - lastMouseY) / zoom;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            requestAnimationFrame(render);
        });
        
        // Zoom via wheel (always zoom towards mouse)
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            const newZoom = Math.max(0.1, Math.min(5.0, zoom * zoomFactor));
            
            // Adjust scroll to zoom towards mouse
            scrollX += (mouseX / zoom) - (mouseX / newZoom);
            scrollY += (mouseY / zoom) - (mouseY / newZoom);
            zoom = newZoom;
            
            requestAnimationFrame(render);
        }, { passive: false });

        /**
         * Renders a single logical row chunk for any of the 4 types.
         * Returns the Y advancement amount (supporting shingling).
         * 
         * Important constraint: NO clipping. Text is allowed to overflow backgrounds.
         */
        function drawGenericRow(ctx, x, y, width, bytes, expectedLength, type, config, gap8) {
            if (!config.enabled) return 0;

            const baseH = config.fontSize * 1.25;
            const advanceY = baseH * (config.rowHeight / 100);
            const bgH = baseH * (config.bgHeight / 100);
            const flashH = baseH * (config.flashHeight / 100);

            // Draw Background (precisely sized, unclipped)
            if (config.bgColor && config.bgColor !== 'transparent') {
                ctx.fillStyle = config.bgColor;
                ctx.fillRect(x, y, width, bgH);
            }

            // Setup Font
            // Using a strictly monospace system font for alignment
            ctx.font = `${config.fontSize}px "SF Mono", "Consolas", monospace`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            const textY = y + (bgH / 2); // Center text vertically within the defined background

            const isBitLevel = (type === 'bit10' || type === 'bitsym');
            const itemCount = isBitLevel ? bytes.length * 8 : bytes.length;
            
            // Calculate dynamic byte width incorporating the configurable gaps every 8 bytes
            const numGaps = Math.max(0, Math.floor((expectedLength - 1) / 8));
            const availableW = width - (numGaps * gap8);
            const byteW = availableW / expectedLength;

            // Render Elements
            for (let i = 0; i < itemCount; i++) {
                let itemX, itemW;
                const byteIdx = isBitLevel ? Math.floor(i / 8) : i;
                
                // Add staggered gaps based on which 8-byte group we are in
                const gapOffset = Math.floor(byteIdx / 8) * gap8;
                const byteStartX = x + byteIdx * byteW + gapOffset;
                
                if (isBitLevel) {
                    const groupGap = byteW * 0.15; // 15% gap between 8-bit groups
                    const activeByteW = byteW - groupGap;
                    const bitW = activeByteW / 8;
                    itemX = byteStartX + (i % 8) * bitW;
                    itemW = bitW;
                } else {
                    itemW = byteW;
                    itemX = byteStartX;
                }
                
                const bitOffset = isBitLevel ? (7 - (i % 8)) : -1; 
                const b = bytes[byteIdx];
                const val = isBitLevel ? ((b >> bitOffset) & 1) : b;

                // 1. Draw Flash Markings
                if (flashH > 0) {
                    let drawW;
                    if (isBitLevel) {
                        drawW = Math.max(1, itemW - 1);
                        // Show for both 0 and 1: 1 is full opacity, 0 is lower opacity (approx 40%)
                        ctx.fillStyle = config.flashColor + (val ? '' : '66');
                    } else {
                        drawW = Math.max(1, itemW - 4);
                        ctx.fillStyle = val !== 0 ? config.flashColor + '80' : 'rgba(255,255,255,0.03)';
                    }
                    // Flash at the top of the background
                    ctx.fillRect(itemX, y, drawW, flashH);
                }

                // 2. Format and Draw Text
                let str = '';
                let color = '#ccc';
                let rotate = false;

                if (type === 'hex') {
                    str = val.toString(16).padStart(2, '0').toUpperCase();
                    if (val === 0) color = '#4a5468';
                    else if (isPrint(val)) color = '#9ca8be';
                    else color = '#7eaaef';
                } else if (type === 'ascii') {
                    // ASCII Printable range
                    const print = isPrint(val);
                    str = print ? String.fromCharCode(val) : '\u00b7';
                    color = print ? '#e8b634' : '#2e2840';
                } else if (type === 'bit10') {
                    str = val.toString();
                    color = val ? '#c084fc' : '#586070';
                } else if (type === 'bitsym') {
                    // Symbolic display (SYN ACK, etc.)
                    str = SYMBOLS[7 - bitOffset];
                    color = val ? '#c084fc' : '#5a6278';
                    rotate = true;
                }

                ctx.fillStyle = color;
                
                if (config.fontSize < 6) {
                    // Render marker instead of tiny text
                    const markW = Math.max(1, itemW * 0.5);
                    const markH = Math.max(1, config.fontSize);
                    ctx.fillRect(itemX + (itemW - markW) / 2, textY - markH / 2, markW, markH);
                } else {
                    // Allow elements to naturally overlap, overflow, and overprint!
                    if (rotate) {
                        ctx.save();
                        ctx.translate(itemX + itemW / 2, textY);
                        ctx.rotate(-Math.PI / 2);
                        ctx.fillText(str, 0, 0);
                        ctx.restore();
                    } else {
                        ctx.fillText(str, itemX + itemW / 2, textY);
                    }
                }
            }

            return advanceY;
        }

        function render() {
            // Clear view
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Apply global camera transform
            ctx.setTransform(zoom, 0, 0, zoom, -scrollX * zoom, -scrollY * zoom);

            const currentBPR = 1 << layoutConfig.log2;
            const numChunks = Math.ceil(DATA_SIZE / currentBPR);
            const types = ['hex', 'ascii', 'bit10', 'bitsym'];
            
            // Calculate height of a single chunk group 
            let chunkH = 0;
            types.forEach(t => {
                const c = configs[t];
                if (c.enabled) {
                    chunkH += (c.fontSize * 1.25) * (c.rowHeight / 100);
                }
            });

            if (chunkH === 0) return; // Nothing to draw

            // Culling logic to maintain performance at any zoom
            const viewportTopY = scrollY;
            const viewportBottomY = scrollY + (canvas.height / zoom);
            
            // Render buffer logic: +/- 5 chunks to ensure shingled overlapping texts 
            // originating outside the viewport still render their overprints properly into the viewport
            const startChunk = Math.max(0, Math.floor(viewportTopY / chunkH) - 5);
            const endChunk = Math.min(numChunks, Math.ceil(viewportBottomY / chunkH) + 5);

            let currentY = startChunk * chunkH;

            // Main layout & draw loop
            for (let i = startChunk; i < endChunk; i++) {
                const chunkStart = i * currentBPR;
                const chunkBytes = data.slice(chunkStart, chunkStart + currentBPR);
                
                // Draw Offset Label
                ctx.font = `14px "SF Mono", monospace`;
                ctx.fillStyle = '#64748b';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillText(`0x${chunkStart.toString(16).padStart(4, '0').toUpperCase()}`, -15, currentY);

                // Draw each active sub-row type for this chunk.
                // The 'y' progressively advances by returned 'advanceY', naturally creating overlaps
                // when configured via UI to be less than 100%.
                types.forEach(type => {
                    currentY += drawGenericRow(ctx, 0, currentY, layoutConfig.width, chunkBytes, currentBPR, type, configs[type], layoutConfig.gap);
                });
            }
        }

        // Initialize and launch
        resize();

    </script>
</body>
</html>
