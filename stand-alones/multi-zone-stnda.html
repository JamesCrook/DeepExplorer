<title>Zoned Elements — Combined</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111210; color: #c8c0b0;
    font-family: system-ui, -apple-system, sans-serif;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px; border-bottom: 1px solid #2a2824;
    background: #17160f; flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 700; color: #e4dac6; letter-spacing: -0.03em; }
  header .tag {
    font-size: 10px; font-family: monospace; color: #6a6256;
    background: #222018; padding: 2px 7px; border-radius: 4px; border: 1px solid #2a2824;
  }
  #container {
    flex: 1; display: flex; flex-wrap: wrap;
    gap: 1px; background: #2a2824; overflow: hidden;
  }
  .pane {
    background: #111210; display: flex;
    flex-direction: column; overflow: hidden;
    position: relative;
    transition: opacity 0.15s;
    flex-grow: 1;    
  }
  .pane.pane-hidden { display: none !important; }
  .pane .label {
    padding: 8px 14px; font-size: 11px; font-weight: 600;
    color: #6a6256; text-transform: uppercase;
    letter-spacing: 0.08em; flex-shrink: 0;
  }
  .pane canvas { flex: 1; width: 100%; height: 100%; display: block; }
  .pane.pane-3d canvas { width: 100% !important; height: 100% !important; }
  .pane.pane-3d .pane-title-3d {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 10px; font-weight: 700; letter-spacing: 3px;
    color: rgba(255,255,255,0.35); pointer-events: none; z-index: 5;
    text-transform: uppercase; white-space: nowrap;
  }

  /* ── Global HUD ── */
  .hud-panel {
    position: fixed;
    background: rgba(15, 20, 25, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px; padding: 14px 18px;
    color: #ddd; font: 11px/1.6 system-ui, sans-serif;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 50; min-width: 220px; max-width: 280px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4); user-select: none;
    max-height: calc(100vh - 80px); overflow-y: auto;
  }
  .hud-panel::-webkit-scrollbar { width: 4px; }
  .hud-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  .hud-panel h3 {
    margin: 0 0 10px; font-size: 10px; color: #aaa; letter-spacing: 1px;
    cursor: grab; padding-bottom: 5px;
    border-bottom: 1px solid rgba(255,255,255,0.05); text-transform: uppercase;
  }
  .hud-panel h3:active { cursor: grabbing; }
  .hud-panel label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .hud-panel label span { min-width: 80px; color: #999; font-size: 10px; }
  .hud-panel input[type=range] { flex: 1; accent-color: #6cf; cursor: pointer; }
  .hud-panel select {
    flex: 1; background: rgba(0,0,0,0.5); color: #fff;
    border: 1px solid rgba(255,255,255,0.2); padding: 3px;
    border-radius: 4px; font-size: 10px; cursor: pointer; outline: none;
  }
  .hud-panel .val {
    min-width: 28px; text-align: right;
    font-variant-numeric: tabular-nums; color: #8cf; font-weight: 600; font-size: 10px;
  }
  .hud-panel .separator {
    margin: 10px 0 6px 0; padding-top: 6px;
    border-top: 1px dashed rgba(255,255,255,0.1);
    font-size: 9px; color: #6cf; text-transform: uppercase; letter-spacing: 1px;
  }
  .hud-panel .check-row {
    display: flex; align-items: center; gap: 8px; margin: 3px 0;
    cursor: pointer; font-size: 11px; color: #bbb;
  }
  .hud-panel .check-row input[type=checkbox] { accent-color: #6cf; cursor: pointer; }
  .hud-panel .check-row:hover { color: #fff; }
  .hud-panel .hud-btn {
    display: block; width: 100%; margin: 6px 0 2px;
    padding: 6px 0; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; background: rgba(255,255,255,0.06);
    color: #ccc; font-size: 10px; letter-spacing: 0.5px;
    cursor: pointer; text-align: center; text-transform: uppercase;
  }
  .hud-panel .hud-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .hud-panel .hud-btn.primary { border-color: rgba(102,204,255,0.3); color: #8cf; }
  .hud-panel .hud-btn.primary:hover { background: rgba(102,204,255,0.12); }
  .hud-panel .no-controls { color: #555; font-style: italic; font-size: 10px; margin: 6px 0; }

  #tooltip {
    position: fixed; pointer-events: none;
    background: #222018; border: 1px solid #3d3a32;
    border-radius: 6px; padding: 6px 10px; z-index: 100;
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
    display: none; white-space: nowrap; font-size: 12px;
  }
  #tooltip .tt-name   { font-weight: 600; color: #e4dac6; font-family: monospace; }

  #tooltip .tt-extra  { color: #5a5448; font-size: 10px; margin-top: 1px; }

<body>

<header>
  <h1>Zoned Elements</h1>
  <span class="tag" id="pane-count"></span>
</header>

<div id="container"></div>

<div id="tooltip">
  <div class="tt-name"></div>

<script type="module">

// ═══════════════════════════════════════════════════════════════
//  REGISTRY — each zone class pushes here. Remove a class
//  section and the layout simply skips it.
//
//  Pane shape:
//    { label, type:'2d'|'3d', visible:true,
//      zoneClass?, data?,           // 2D
//      background?, init?,          // 3D: init(container) → view
//      controls:[], onControl? }    // HUD controls for this pane
// ═══════════════════════════════════════════════════════════════

const PANES = [];


// ═══════════════════════════════════════════════════════════════
//  GLOBAL HUD — always present, manages panel switching
// ═══════════════════════════════════════════════════════════════

//<< import { HudPanel } from './hud-panel.js';
//-- file: ./hud-panel.js --
//>> export { HudPanel };

class HudPanel {
  constructor({ title = 'Controls', position = { top: 12, left: 12 } } = {}) {
    this._inputs = {};
    this._valDisplays = {};

    this._root = document.createElement('div');
    this._root.className = 'hud-panel';
    this._root.style.top = position.top + 'px';
    this._root.style.left = position.left + 'px';

    const header = document.createElement('h3');
    header.innerHTML = `::: &nbsp; ${title}`;
    this._root.appendChild(header);
    this._makeDraggable(header);

    // Content container — rebuilt when switching views
    this._content = document.createElement('div');
    this._root.appendChild(this._content);

    document.body.appendChild(this._root);
  }

  get root() { return this._root; }

  get(id) {
    const inp = this._inputs[id];
    if (!inp) return undefined;
    if (inp.tagName === 'SELECT') return inp.value;
    if (inp.type === 'checkbox') return inp.checked;
    return parseFloat(inp.value);
  }

  set(id, value) {
    const inp = this._inputs[id];
    if (!inp) return;
    if (inp.type === 'checkbox') { inp.checked = !!value; return; }
    inp.value = value;
    if (this._valDisplays[id]) this._valDisplays[id].textContent = parseFloat(value).toFixed(2);
  }

  setMax(id, max) {
    const inp = this._inputs[id];
    if (inp && inp.type === 'range') inp.max = max;
  }

  // Clears content and registered inputs; header stays.
  clearContent() {
    this._content.innerHTML = '';
    this._inputs = {};
    this._valDisplays = {};
  }

  addSeparator(label) {
    const sep = document.createElement('div');
    sep.className = 'separator';
    if (label) sep.textContent = label;
    this._content.appendChild(sep);
  }

  addSlider(ctrl, onChange) {
    const { id, label, min = 0, max = 1, step = 0.01, value = min } = ctrl;
    const row = document.createElement('label');
    const span = document.createElement('span'); span.textContent = label; row.appendChild(span);
    const input = document.createElement('input');
    Object.assign(input, { type: 'range', min, max, step, value });
    row.appendChild(input);
    const val = document.createElement('span');
    val.className = 'val'; val.textContent = parseFloat(value).toFixed(2);
    row.appendChild(val);
    input.addEventListener('input', () => {
      val.textContent = parseFloat(input.value).toFixed(2);
      if (onChange) onChange(id, parseFloat(input.value));
    });
    this._inputs[id] = input;
    this._valDisplays[id] = val;
    this._content.appendChild(row);
  }

  addSelect(ctrl, onChange) {
    const { id, label, options = [], value } = ctrl;
    const row = document.createElement('label');
    const span = document.createElement('span'); span.textContent = label; row.appendChild(span);
    const select = document.createElement('select');
    for (const opt of options) {
      const o = document.createElement('option');
      o.value = opt[0]; o.textContent = opt[1];
      if (opt[0] === String(value)) o.selected = true;
      select.appendChild(o);
    }
    select.addEventListener('change', () => { if (onChange) onChange(id, select.value); });
    row.appendChild(select);
    this._inputs[id] = select;
    this._content.appendChild(row);
  }

  addCheckbox(id, label, checked, onChange) {
    const row = document.createElement('label');
    row.className = 'check-row';
    const input = document.createElement('input');
    input.type = 'checkbox'; input.checked = checked;
    input.addEventListener('change', () => { if (onChange) onChange(id, input.checked); });
    row.appendChild(input);
    const span = document.createElement('span');
    span.style.minWidth = 'auto'; span.textContent = label;
    row.appendChild(span);
    this._inputs[id] = input;
    this._content.appendChild(row);
  }

  addButton(label, onClick, cls) {
    const btn = document.createElement('button');
    btn.className = 'hud-btn' + (cls ? ' ' + cls : '');
    btn.textContent = label;
    btn.addEventListener('click', onClick);
    this._content.appendChild(btn);
  }

  addNote(text) {
    const p = document.createElement('div');
    p.className = 'no-controls'; p.textContent = text;
    this._content.appendChild(p);
  }

  addControl(ctrl, onChange) {
    if (ctrl.type === 'separator') this.addSeparator(ctrl.label);
    else if (ctrl.type === 'select') this.addSelect(ctrl, onChange);
    else this.addSlider(ctrl, onChange);
  }

  _makeDraggable(handle) {
    let isDragging = false, startX, startY, startLeft, startTop;
    handle.addEventListener('mousedown', e => {
      isDragging = true; handle.style.cursor = 'grabbing';
      startX = e.clientX; startY = e.clientY;
      startLeft = parseInt(this._root.style.left || 0, 10);
      startTop = parseInt(this._root.style.top || 0, 10);
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      this._root.style.left = `${startLeft + e.clientX - startX}px`;
      this._root.style.top = `${startTop + e.clientY - startY}px`;
    });
    window.addEventListener('mouseup', () => {
      if (isDragging) { isDragging = false; handle.style.cursor = 'grab'; }
    });
  }
}

//-- endfile --


// ═══════════════════════════════════════════════════════════════
//  SHARED — ZonedNode core + helpers
// ═══════════════════════════════════════════════════════════════

//<< import { ZonedNode, HIGHLIGHT, rrPath } from './zoned-node.js';
//-- file: ./zoned-node.js --
//>> export { ZonedNode, HIGHLIGHT, rrPath };

const HIGHLIGHT = '#daa02e';

function rrPath(ctx, x, y, w, h, rtl, rtr, rbr, rbl) {
  ctx.beginPath();
  ctx.moveTo(x + rtl, y); ctx.lineTo(x + w - rtr, y);
  ctx.arcTo(x + w, y, x + w, y + rtr, rtr); ctx.lineTo(x + w, y + h - rbr);
  ctx.arcTo(x + w, y + h, x + w - rbr, y + h, rbr); ctx.lineTo(x + rbl, y + h);
  ctx.arcTo(x, y + h, x, y + h - rbl, rbl); ctx.lineTo(x, y + rtl);
  ctx.arcTo(x, y, x + rtl, y, rtl); ctx.closePath();
}

class ZonedNode {
  static draw2d(ctxMix, node, params) {
    const Zone = node.value.zoneClass, state = ctxMix.state;
    const count = Zone.getCount(node.data);
    const passes = Zone.getPasses ? Zone.getPasses(params) : 1;
    Zone.drawBackground(ctxMix, node, params);
    for (let pass = 0; pass < passes; pass++) {
      state.pass = pass;
      for (let i = 0; i < count; i++) {
        state.index = i;
        state.isHovered  = (i === node.value.hovered);
        state.isSelected = node.value.selected.has(i);
        Zone.draw2d(ctxMix, node, params);
      }
    }
    if (Zone.drawOverlay) Zone.drawOverlay(ctxMix, node, params);
  }
  static hit_test(ctxMix, node, params) {
    const Zone = node.value.zoneClass, state = ctxMix.state;
    const count = Zone.getCount(node.data);
    const order = Zone.getHitOrder ? Zone.getHitOrder(node.data, count) : null;
    const tryIndex = i => { state.index = i; ctxMix.hitResult = null; Zone.hit_test(ctxMix, node, params); return ctxMix.hitResult != null; };
    if (order) { for (let j = 0; j < order.length; j++) if (tryIndex(order[j])) return; }
    else { for (let i = count - 1; i >= 0; i--) if (tryIndex(i)) return; }
  }
}
//-- endfile --


// ═══════════════════════════════════════════════════════════════
//  ZONE 1 — ChromosomeZone
// ═══════════════════════════════════════════════════════════════

//<< import { ChromosomeZone, chromosomeData } from './chromosome-zone.js';
//-- file: ./chromosome-zone.js --
//>> import { HIGHLIGHT } from './zoned-node.js';
//>> export { ChromosomeZone, chromosomeData };

const STAIN_COLORS = { gneg:'#E8E0D0', gpos25:'#B0A890', gpos50:'#808068', gpos75:'#505040', gpos100:'#282820', acen:'#B84430', gvar:'#A0A090', stalk:'#707060' };

function chromosomePath(ctx, cx, topY, botY, cenY, armW, cenW, capR) {
  ctx.beginPath(); ctx.moveTo(cx-armW, topY+capR);
  ctx.quadraticCurveTo(cx-armW,topY,cx,topY); ctx.quadraticCurveTo(cx+armW,topY,cx+armW,topY+capR);
  ctx.lineTo(cx+armW,cenY-8); ctx.quadraticCurveTo(cx+cenW,cenY,cx+armW,cenY+8);
  ctx.lineTo(cx+armW,botY-capR); ctx.quadraticCurveTo(cx+armW,botY,cx,botY);
  ctx.quadraticCurveTo(cx-armW,botY,cx-armW,botY-capR); ctx.lineTo(cx-armW,cenY+8);
  ctx.quadraticCurveTo(cx-cenW,cenY,cx-armW,cenY-8); ctx.lineTo(cx-armW,topY+capR); ctx.closePath();
}

function chrLayout(W,H,data) {
  const margin=30, chrH=Math.max(1,H-margin*2), cx=W/2, topY=margin, botY=margin+chrH;
  const scale=chrH/data.length, cenY=topY+((data.cenStart+data.cenEnd)/2)*scale;
  const armW=Math.max(1,Math.min(28,W*0.14)), cenW=armW*0.35, capR=armW*0.7;
  return { cx, topY, botY, chrH, scale, cenY, armW, cenW, capR };
}

class ChromosomeZone {
  static getCount(data) { return data.bands.length; }
  static drawBackground(ctxMix, node, params) {
    const ctx=ctxMix.ctx, {W,H}=ctxMix.getHW(ctxMix,node,params);
    const lo=chrLayout(W,H,node.data); node._layout=lo;
    ctx.save(); chromosomePath(ctx,lo.cx,lo.topY,lo.botY,lo.cenY,lo.armW,lo.cenW,lo.capR); ctx.clip();
  }
  static draw2d(ctxMix, node, params) {
    const ctx=ctxMix.ctx, state=ctxMix.state, lo=node._layout; if(!lo) return;
    const band=node.data.bands[state.index];
    const y1=lo.topY+band.start/node.data.length*lo.chrH, y2=lo.topY+band.end/node.data.length*lo.chrH;
    if(state.isSelected) ctx.fillStyle=state.isHovered?'#E8B840':HIGHLIGHT;
    else if(state.isHovered) ctx.fillStyle='#504838';
    else ctx.fillStyle=STAIN_COLORS[band.stain]||'#E8E0D0';
    ctx.fillRect(lo.cx-60,y1,120,Math.max(y2-y1,0.5));
  }
  static drawOverlay(ctxMix, node, params) {
    const ctx=ctxMix.ctx, lo=node._layout; if(!lo){ctx.restore();return;} ctx.restore();
    ctx.strokeStyle='#504838'; ctx.lineWidth=1;
    chromosomePath(ctx,lo.cx,lo.topY,lo.botY,lo.cenY,lo.armW,lo.cenW,lo.capR); ctx.stroke();
    ctx.fillStyle='#B84430'; ctx.beginPath(); ctx.arc(lo.cx,lo.cenY,lo.armW*0.28,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#908878'; ctx.font='600 12px monospace'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('chr1',lo.cx,lo.botY+8);
  }
  static hit_test(ctxMix, node, params) {
    const pt=ctxMix.hitPoint, state=ctxMix.state, lo=node._layout; if(!pt||!lo) return;
    const band=node.data.bands[state.index]; if(band.stain==='acen') return;
    const y1=lo.topY+band.start/node.data.length*lo.chrH, y2=lo.topY+band.end/node.data.length*lo.chrH;
    if(pt.y<y1||pt.y>y2) return; if(Math.abs(pt.x-lo.cx)>lo.armW+2) return;
    ctxMix.hitResult={node,zoneIndex:state.index};
  }
  static getZoneInfo(ctxMix, node, params) {
    const band=node.data.bands[ctxMix.state.index];
    return {name:band.label,detail:(band.start/1e6).toFixed(1)+'–'+(band.end/1e6).toFixed(1)+' Mb',extra:band.stain};
  }
}

function chromosomeData() {
  const raw=[['p36.33','gneg',0,2300000],['p36.32','gpos25',2300000,5400000],['p36.31','gneg',5400000,7200000],['p36.23','gpos25',7200000,9200000],['p36.22','gneg',9200000,12700000],['p36.21','gpos50',12700000,16200000],['p36.13','gneg',16200000,20400000],['p36.12','gpos25',20400000,23900000],['p36.11','gneg',23900000,28000000],['p35.3','gpos25',28000000,30200000],['p35.2','gneg',30200000,32400000],['p35.1','gpos25',32400000,34600000],['p34.3','gneg',34600000,40100000],['p33','gpos75',46800000,50500000],['p32.3','gneg',50500000,55600000],['p31.1','gpos100',69400000,84400000],['p22.2','gpos75',88300000,92000000],['p21.1','gpos100',101800000,106700000],['p13.2','gpos50',111200000,115300000],['p12','gpos100',117800000,120600000],['p11.2','acen',121700000,125100000],['p11.1','acen',125100000,125800000],['q11','acen',125800000,128900000],['q12','gpos50',128900000,142600000],['q21.1','gneg',142600000,147950000],['q21.2','gpos25',147950000,150600000],['q21.3','gneg',150600000,155000000],['q23.1','gneg',160500000,166200000],['q24.2','gpos50',169700000,172900000],['q25.2','gpos50',176000000,180300000],['q31.1','gneg',185800000,190800000],['q32.1','gneg',198700000,207200000],['q41','gneg',218500000,224100000],['q42.13','gpos50',229900000,233600000],['q43','gneg',236400000,243500000],['q44','gpos25',243500000,248956422]];
  return { bands:raw.map(r=>({label:r[0],stain:r[1],start:r[2],end:r[3]})), length:248956422, cenStart:121700000, cenEnd:128900000 };
}

PANES.push({ label:'Chromosome 1 · Cytobands', type:'2d', visible:true, zoneClass:ChromosomeZone, data:chromosomeData(), controls:[], onControl:null });
//-- endfile --


// ═══════════════════════════════════════════════════════════════
//  ZONE 2 — PianoKeyZone
// ═══════════════════════════════════════════════════════════════

//<< import { PianoKeyZone, pianoData } from './piano-zone.js';
//-- file: ./piano-zone.js --
//>> import { HIGHLIGHT, rrPath } from './zoned-node.js';
//>> export { PianoKeyZone, pianoData };

const BLACK_SET=new Set([1,3,6,8,10]), NOTE_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function noteOfIndex(data,idx){const midi=data.startMidi+idx;return{midi,black:BLACK_SET.has(midi%12)};}
function keyLayout(W,H,node,idx){
  const data=node.data, {midi,black}=noteOfIndex(data,idx);
  let totalWhites=0; for(let i=0;i<data.count;i++) if(!BLACK_SET.has((data.startMidi+i)%12)) totalWhites++;
  const margin=20, kbW=W-margin*2, kbH=H-margin*2, wW=kbW/totalWhites, bW=wW*0.58, bH=kbH*0.6, topY=margin, leftX=margin;
  let whitesBefore=0; for(let i=0;i<idx;i++) if(!BLACK_SET.has((data.startMidi+i)%12)) whitesBefore++;
  if(!black) return{black,midi,x:leftX+whitesBefore*wW,y:topY,w:wW,h:kbH};
  return{black,midi,x:leftX+whitesBefore*wW-bW/2,y:topY,w:bW,h:bH};
}
class PianoKeyZone {
  static getCount(data){return data.count;} static getPasses(){return 2;}
  static getHitOrder(data,count){const b=[],w=[];for(let i=0;i<count;i++){if(BLACK_SET.has((data.startMidi+i)%12))b.push(i);else w.push(i);}return b.concat(w);}
  static drawBackground(){}
  static draw2d(ctxMix,node,params){
    const ctx=ctxMix.ctx,state=ctxMix.state,{W,H}=ctxMix.getHW(ctxMix,node,params);

              if (j <= i) continue;

              if (checked.has(pairKey)) continue;
              checked.add(pairKey);

              const atom2 = atoms[j];
              if (atom1.element === 'H' || atom2.element === 'H') continue;

              const dx = atom2.x - atom1.x;
              const dy = atom2.y - atom1.y;
              const dz = atom2.z - atom1.z;
              const distSq = dx * dx + dy * dy + dz * dz;

              if (distSq <= scaledCutoffSq && distSq > 0.01) {
                bonds.push({
                  atomIndex1: i,
                  atomIndex2: j,
                  element1: atom1.element || 'C',
                  element2: atom2.element || 'C'
                });
              }
            }
          }
        }
      }
    });

    return bonds;
  }

  detectRings() {
    const adjacency = new Map();

    this.bonds.forEach((bond, bondIndex) => {
      const a1 = bond.atomIndex1;
      const a2 = bond.atomIndex2;

      if (!adjacency.has(a1)) adjacency.set(a1, []);
      if (!adjacency.has(a2)) adjacency.set(a2, []);

      adjacency.get(a1).push({ neighbor: a2, bondIndex });
      adjacency.get(a2).push({ neighbor: a1, bondIndex });
    });

    const ringBonds = new Set();

    this.bonds.forEach((bond, bondIndex) => {
      const start = bond.atomIndex1;
      const end = bond.atomIndex2;
      const queue = [{ atom: end, path: [end], bondPath: [] }];
      const visited = new Set([end]);

      while (queue.length > 0) {
        const { atom, path, bondPath } = queue.shift();

        if (atom === start && path.length >= 2) {
          if (path.length === 5 || path.length === 6) {
            ringBonds.add(bondIndex);
            bondPath.forEach(bi => ringBonds.add(bi));
          }
          break;
        }

        if (path.length > 6) continue;

        for (const { neighbor, bondIndex: bi } of (adjacency.get(atom) || [])) {
          if (bi === bondIndex || visited.has(neighbor)) continue;
          visited.add(neighbor);
          queue.push({ atom: neighbor, path: [...path, neighbor], bondPath: [...bondPath, bi] });
        }
      }
    });

    this.bonds.forEach((bond, index) => { bond.isRing = ringBonds.has(index); });
  }

  createBondGeometry() {
    if (this.bonds.length === 0) return;

    const THREE = this.THREE;
    const instanceCount = this.bonds.length * 2;

    const geometry = new THREE.CylinderGeometry(
      this.radius * this.modelScale * 0.1,
      this.radius * this.modelScale * 0.1,
      1.0, 8, 1, true
    );

    const material = new THREE.MeshPhongMaterial({
      shininess: 30,
      transparent: this.opacity < 1,
      opacity: this.opacity,
      side: THREE.FrontSide
    });

    this.bondMesh = new THREE.InstancedMesh(geometry, material, instanceCount);
    this.bondMesh.frustumCulled = false;
    this.bondMesh.userData.bonds = this.bonds;

    this._initTransformObjects();
    this.updateAllBondInstances();
  }

  bondColor(bond, baseColor, atom) {
    const THREE = this.THREE;
    let color = new THREE.Color(baseColor);

    if (this.params && this.params.bondColorByAminoAcid > 0 && atom) {
      const ribbonColor = getResidueColor(atom, this.params, NEUTRAL_CHAIN_COLOR, THREE);
      color.lerp(ribbonColor, this.params.bondColorByAminoAcid);
    }

    let lightness = this.params?.bondLightness ?? 0.5;
    if( lightness < 0.5 )
      color.lerp(new THREE.Color(BOND_BLACK), 1 - lightness * 2);
    else
      color.lerp(new THREE.Color(BOND_WHITE), lightness * 2 -1);

    let ringPink = this.params?.bondRingPink ?? 0;
    if (bond.isRing && ringPink > 0) {
      color.lerp(new THREE.Color(BOND_RING_PINK), ringPink);
    }

    return color;
  }

  // Core method: set transform and color for a single bond (two segments)
  setBondInstance(bondIndex, visible = true) {
    const THREE = this.THREE;
    const bond = this.bonds[bondIndex];
    const atom1 = this.atoms[bond.atomIndex1];
    const atom2 = this.atoms[bond.atomIndex2];

    let dotVisible = true;
    if (this.referenceAxis && this.sidechainFade > 0) {
      const t1 = this.residueTangents.get((atom1.chainID || '') + '_' + atom1.resSeq);
      const t2 = this.residueTangents.get((atom2.chainID || '') + '_' + atom2.resSeq);

      let dot = 1.0;
      if (t1 && t2) {
        dot = (Math.abs(t1.dot(this.referenceAxis)) + Math.abs(t2.dot(this.referenceAxis))) / 2;
      } else if (t1) {
        dot = Math.abs(t1.dot(this.referenceAxis));
      } else if (t2) {
        dot = Math.abs(t2.dot(this.referenceAxis));
      }
      dotVisible = dot >= this.sidechainFade;
    }

    if (!visible || !dotVisible) {
      this.bondMesh.setMatrixAt(bondIndex * 2, this._hiddenMatrix);
      this.bondMesh.setMatrixAt(bondIndex * 2 + 1, this._hiddenMatrix);
      return;
    }

    const start = new THREE.Vector3(atom1.x, atom1.y, atom1.z);
    const end = new THREE.Vector3(atom2.x, atom2.y, atom2.z);
    const direction = new THREE.Vector3().subVectors(end, start).normalize();

    this._quaternion.setFromUnitVectors(this._yAxis, direction);

    const data1 = CPK_ATOM_DATA[bond.element1.toUpperCase()] || CPK_ATOM_DATA['DEFAULT'];
    const data2 = CPK_ATOM_DATA[bond.element2.toUpperCase()] || CPK_ATOM_DATA['DEFAULT'];

    const isAtom1Lower = data1.atomicNumber <= data2.atomicNumber;
    const lowerData = isAtom1Lower ? data1 : data2;
    const higherData = isAtom1Lower ? data2 : data1;
    const lowerStart = isAtom1Lower ? start : end;
    const higherStart = isAtom1Lower ? end : start;

    const splitPoint = new THREE.Vector3().lerpVectors(lowerStart, higherStart, this.halfColor);

    // First segment (lower atomic number side)
    const length1 = lowerStart.distanceTo(splitPoint);
    this._position.lerpVectors(lowerStart, splitPoint, 0.5);
    this._scale.set(1, length1, 1);
    this._matrix.compose(this._position, this._quaternion, this._scale);
    this.bondMesh.setMatrixAt(bondIndex * 2, this._matrix);
    this.bondMesh.setColorAt(bondIndex * 2, this.bondColor(bond, lowerData.color, isAtom1Lower ? atom1 : atom2));

    // Second segment (higher atomic number side)
    const length2 = splitPoint.distanceTo(higherStart);
    this._position.lerpVectors(splitPoint, higherStart, 0.5);
    this._scale.set(1, length2, 1);
    this._matrix.compose(this._position, this._quaternion, this._scale);
    this.bondMesh.setMatrixAt(bondIndex * 2 + 1, this._matrix);
    this.bondMesh.setColorAt(bondIndex * 2 + 1, this.bondColor(bond, higherData.color, isAtom1Lower ? atom2 : atom1));
  }

  updateAllBondInstances() {
    if (!this.bondMesh || this.bonds.length === 0) return;

    for (let i = 0; i < this.bonds.length; i++) {
      this.setBondInstance(i, true);
    }

    this.bondMesh.instanceMatrix.needsUpdate = true;
    if (this.bondMesh.instanceColor) this.bondMesh.instanceColor.needsUpdate = true;
  }

  updateBondRadius(radius) {
    this.radius = radius;
    if (!this.bondMesh || this.bonds.length === 0) return;

    const THREE = this.THREE;
    this.bondMesh.geometry.dispose();
    this.bondMesh.geometry = new THREE.CylinderGeometry(
      radius * this.modelScale * 0.1,
      radius * this.modelScale * 0.1,
      1.0, 8, 1, true
    );

    this.updateVisibility();
  }

  setOpacity(opacity) { this.opacity = opacity; this.updateVisibility(); }
  setRadius(radius) { this.updateBondRadius(radius); }

  setHalfColor(halfColor) {
    this.halfColor = halfColor;
    if (this.bondMesh) { this.updateAllBondInstances(); this.updateVisibility(); }
  }

  setbondLightness(bondLightness) {
    this.bondLightness = bondLightness;
    if (this.bondMesh) { this.updateAllBondInstances(); this.updateVisibility(); }
  }

  setRingPink(ringPink) {
    this.ringPink = ringPink;
    if (this.bondMesh) { this.updateAllBondInstances(); this.updateVisibility(); }
  }

  setAtomRange(startPercent, endPercent) {
    this.atomRangeStart = Math.max(0, Math.min(1, startPercent / 100));
    this.atomRangeEnd = Math.max(0, Math.min(1, endPercent / 100));
    this.updateVisibility();
  }

  updateVisibility() {
    if (!this.bondMesh) return;

    this.sceneManager.remove(this.bondMesh);

    if (this.opacity <= 0 || this.bonds.length === 0) return;

    const start = Math.min(this.atomRangeStart, this.atomRangeEnd);
    const end = Math.max(this.atomRangeStart, this.atomRangeEnd);
    const startIndex = Math.floor(start * this.totalAtomCount);
    const endIndex = Math.ceil(end * this.totalAtomCount);

    let visibleCount = 0;

    for (let i = 0; i < this.bonds.length; i++) {
      const bond = this.bonds[i];
      const atom1InRange = bond.atomIndex1 >= startIndex && bond.atomIndex1 < endIndex;
      const atom2InRange = bond.atomIndex2 >= startIndex && bond.atomIndex2 < endIndex;
      const visible = atom1InRange && atom2InRange;

      this.setBondInstance(i, visible);
      if (visible) visibleCount++;
    }

    this.bondMesh.instanceMatrix.needsUpdate = true;
    if (this.bondMesh.instanceColor) this.bondMesh.instanceColor.needsUpdate = true;

    let transparent = this.opacity < 0.98
    this.bondMesh.material.opacity = transparent ? this.opacity : 1.0;
    this.bondMesh.material.transparent = transparent;
    this.bondMesh.material.needsUpdate = true;

    if (visibleCount > 0) this.sceneManager.add(this.bondMesh);
  }

  clear() {
    if (this.bondMesh) {
      this.bondMesh.geometry.dispose();
      this.bondMesh.material.dispose();
      this.sceneManager.remove(this.bondMesh);
      this.bondMesh = null;
    }
    this.bonds = [];
    this.atoms = [];
    this.totalAtomCount = 0;
  }
}

const VERTEX_SHADER = /* glsl */ `
  in vec3 instancePosition;
  in float instanceRadius;
  in vec3 instanceColor;

  out vec3 vViewCenter;
  out float vRadius;
  out vec3 vColor;
  out vec3 vFragViewPos;

  void main() {
    vColor = instanceColor;
    vRadius = instanceRadius;

    vec4 viewCenter = modelViewMatrix * vec4(instancePosition, 1.0);
    vViewCenter = viewCenter.xyz;

    vec3 viewPos = viewCenter.xyz + vec3(position.xy * instanceRadius * 1.3, 0.0);
    vFragViewPos = viewPos;

    gl_Position = projectionMatrix * vec4(viewPos, 1.0);
  }
`;

const FRAGMENT_SHADER = /* glsl */ `
  precision highp float;

  uniform mat4 projectionMatrix;

  uniform float uOpacity;
  uniform float uLightness;
  uniform vec3 uAmbientColor;
  uniform vec3 uLightDir0;
  uniform vec3 uLightColor0;
  uniform float uLightIntensity0;
  uniform vec3 uLightDir1;
  uniform vec3 uLightColor1;
  uniform float uLightIntensity1;
  uniform vec3 uLightDir2;
  uniform vec3 uLightColor2;
  uniform float uLightIntensity2;

  in vec3 vViewCenter;
  in float vRadius;
  in vec3 vColor;
  in vec3 vFragViewPos;

  out vec4 fragColor;

  void main() {
    if (vRadius <= 0.0) discard;

    vec3 rayDir = normalize(vFragViewPos);

    vec3 oc = -vViewCenter;
    float b = dot(oc, rayDir);
    float c = dot(oc, oc) - vRadius * vRadius;
    float disc = b * b - c;

    if (disc < 0.0) discard;

    float t = -b - sqrt(disc);
    if (t < 0.0) discard;

    vec3 hitPoint = rayDir * t;
    vec3 normal = normalize(hitPoint - vViewCenter);

    vec4 clipPos = projectionMatrix * vec4(hitPoint, 1.0);
    gl_FragDepth = (clipPos.z / clipPos.w) * 0.5 + 0.5;

    vec3 ld0 = normalize((viewMatrix * vec4(uLightDir0, 0.0)).xyz);
    vec3 ld1 = normalize((viewMatrix * vec4(uLightDir1, 0.0)).xyz);
    vec3 ld2 = normalize((viewMatrix * vec4(uLightDir2, 0.0)).xyz);

    vec3 viewDir = normalize(-hitPoint);
    float shininess = 30.0;
    float specStrength = 0.15;

    vec3 effectiveColor = vColor;
    if (uLightness < 0.5) {
      effectiveColor = mix(effectiveColor, vec3(0.0), 1.0 - uLightness * 2.0);
    } else {
      effectiveColor = mix(effectiveColor, vec3(1.0), uLightness * 2.0 - 1.0);
    }

    vec3 color = uAmbientColor * effectiveColor;

    for (int i = 0; i < 3; i++) {
      vec3 ld    = (i == 0) ? ld0    : (i == 1) ? ld1    : ld2;
      vec3 lc    = (i == 0) ? uLightColor0 : (i == 1) ? uLightColor1 : uLightColor2;
      float li   = (i == 0) ? uLightIntensity0 : (i == 1) ? uLightIntensity1 : uLightIntensity2;

      float diff = max(dot(normal, ld), 0.0);
      vec3 half_ = normalize(ld + viewDir);
      float spec = pow(max(dot(normal, half_), 0.0), shininess);
      color += (diff * effectiveColor + spec * specStrength) * lc * li;
    }

    fragColor = vec4(color, uOpacity);
  }
`;

const DEFAULT_LIGHTS = [
  { dir: new THREE.Vector3( 5, 15,  10).normalize(), color: new THREE.Color(0xffffff), intensity: 1.2 },
  { dir: new THREE.Vector3(-10,  5,  -5).normalize(), color: new THREE.Color(0x4488ff), intensity: 0.5 },
  { dir: new THREE.Vector3( -5,-10, -10).normalize(), color: new THREE.Color(0xffdddd), intensity: 1.2 },
];

const DEFAULT_AMBIENT = new THREE.Color(0x404040).multiplyScalar(0.5);

// ImposterAtomNode's own computeResidueTangents (single-arg; module-scope THREE).
// In the spike this harmlessly re-declares the harness version — both
// implementations are equivalent when THREE is module-scoped.
function computeResidueTangents(atoms) {
  const residueTangents = new Map();
  const residues = new Map();
  for (const atom of atoms) {
    const key = (atom.chainID || '') + '_' + atom.resSeq;
    if (!residues.has(key)) residues.set(key, []);
    residues.get(key).push(atom);
  }
  for (const [key, resAtoms] of residues) {
    const ca = resAtoms.find(a => a.name === 'CA');
    if (!ca) continue;
    const [chainID, resSeqStr] = key.split('_');
    const resSeq = parseInt(resSeqStr, 10);
    const prev = residues.get(chainID + '_' + (resSeq - 1));
    const next = residues.get(chainID + '_' + (resSeq + 1));
    const prevCA = prev ? prev.find(a => a.name === 'CA') : null;
    const nextCA = next ? next.find(a => a.name === 'CA') : null;
    let T;
    if (prevCA && nextCA)  T = new THREE.Vector3(nextCA.x - prevCA.x, nextCA.y - prevCA.y, nextCA.z - prevCA.z);
    else if (prevCA)       T = new THREE.Vector3(ca.x - prevCA.x, ca.y - prevCA.y, ca.z - prevCA.z);
    else if (nextCA)       T = new THREE.Vector3(nextCA.x - ca.x, nextCA.y - ca.y, nextCA.z - ca.z);
    else                   T = new THREE.Vector3(1, 0, 0);
    residueTangents.set(key, T.normalize());
  }
  return residueTangents;
}

const IMPOSTER_UPDATE_PARAMS = [
  'atomRadius', 'atomOpacity', 'atomRangeStart', 'atomRangeEnd',
  'atomLightness',
  'sidechainFade', 'mainLight', 'fillLight', 'backLight'
];

class ImposterAtomNode extends SceneNode {

  static rebuildParams = [];
  static updateParams = IMPOSTER_UPDATE_PARAMS;

  build(ctxMix, node, params) {
    if (this.group) return;

    this.group = new THREE.Group();
    this.mesh = null;
    this.atoms = [];
    this.totalAtomCount = 0;
    this.modelScale = 1;
    this.residueTangents = new Map();

    this._basePositions = null;
    this._baseRadii     = null;
    this._baseColors    = null;

    if (this._pendingData) {
      const { atoms, scale, chainColorMap } = this._pendingData;
      this._pendingData = null;
      this._applyData(atoms, scale, chainColorMap);
    }
  }

  setData(atoms, scale, chainColorMap) {
    if (this.group) {
      this._applyData(atoms, scale, chainColorMap);
    } else {
      this._pendingData = { atoms, scale, chainColorMap };
    }
  }

  _applyData(atoms, scale, chainColorMap) {
    if (this.mesh) {
      this.mesh.geometry.dispose();
      this.group.remove(this.mesh);
      this.mesh = null;
    }

    this.atoms = [...atoms];
    this.totalAtomCount = atoms.length;
    this.modelScale = scale;

    if (atoms.length === 0) return;

    this.residueTangents = computeResidueTangents(atoms);

    const n = atoms.length;
    this._basePositions = new Float32Array(n * 3);
    this._baseRadii     = new Float32Array(n);
    this._baseColors    = new Float32Array(n * 3);

    const color = new THREE.Color();

    for (let i = 0; i < n; i++) {
      const atom = atoms[i];
      this._basePositions[i * 3]     = atom.x;
      this._basePositions[i * 3 + 1] = atom.y;
      this._basePositions[i * 3 + 2] = atom.z;

      const element = (atom.element || 'C').toUpperCase();
      const data = CPK_ATOM_DATA[element] || CPK_ATOM_DATA['DEFAULT'];
      this._baseRadii[i] = data.radius * scale * 0.35;

      color.set(data.color);
      this._baseColors[i * 3]     = color.r;
      this._baseColors[i * 3 + 1] = color.g;
      this._baseColors[i * 3 + 2] = color.b;
    }

    this._buildMesh(n);
  }

  _buildMesh(instanceCount) {
    const quadPositions = new Float32Array([
      -1, -1, 0,
       1, -1, 0,
       1,  1, 0,
      -1,  1, 0,
    ]);
    const quadIndices = new Uint16Array([0, 1, 2, 0, 2, 3]);

    const geometry = new THREE.InstancedBufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(quadPositions, 3));
    geometry.setIndex(new THREE.BufferAttribute(quadIndices, 1));
    geometry.instanceCount = instanceCount;

    this._instancePositions = new THREE.InstancedBufferAttribute(
      new Float32Array(this._basePositions), 3
    );
    this._instanceRadii = new THREE.InstancedBufferAttribute(
      new Float32Array(instanceCount), 1
    );
    this._instanceColors = new THREE.InstancedBufferAttribute(
      new Float32Array(this._baseColors), 3
    );

    geometry.setAttribute('instancePosition', this._instancePositions);
    geometry.setAttribute('instanceRadius',   this._instanceRadii);

      glslVersion: THREE.GLSL3,
      vertexShader: VERTEX_SHADER,
      fragmentShader: FRAGMENT_SHADER,
      transparent: false,
      depthWrite: true,
      uniforms: {
        uOpacity:         { value: 1.0 },
        uLightness:       { value: 0.5 },
        uAmbientColor:    { value: DEFAULT_AMBIENT.clone() },
        uLightDir0:       { value: DEFAULT_LIGHTS[0].dir.clone() },
        uLightColor0:     { value: DEFAULT_LIGHTS[0].color.clone() },
        uLightIntensity0: { value: DEFAULT_LIGHTS[0].intensity },
        uLightDir1:       { value: DEFAULT_LIGHTS[1].dir.clone() },
        uLightColor1:     { value: DEFAULT_LIGHTS[1].color.clone() },
        uLightIntensity1: { value: DEFAULT_LIGHTS[1].intensity },
        uLightDir2:       { value: DEFAULT_LIGHTS[2].dir.clone() },
        uLightColor2:     { value: DEFAULT_LIGHTS[2].color.clone() },
        uLightIntensity2: { value: DEFAULT_LIGHTS[2].intensity },
      },
    });

    this.mesh.frustumCulled = false;
    this.group.add(this.mesh);

  update(ctxMix, node, params) {
    if (!this.mesh || this.totalAtomCount === 0) return;

    const opacity = params.atomOpacity ?? 1;
    const atomRadius = params.atomRadius ?? 1;

    if (opacity <= 0 || atomRadius <= 0.001) {
      if (this.mesh.parent) this.group.remove(this.mesh);
      return;
    }
    if (!this.mesh.parent) this.group.add(this.mesh);

    const effectiveOpacity = opacity >= 0.98 ? 1.0 : opacity;
    const mat = this.mesh.material;
    mat.uniforms.uOpacity.value = effectiveOpacity;
    mat.transparent = effectiveOpacity < 1.0;

    mat.uniforms.uLightness.value = params.atomLightness ?? 0.5;

    if (params.mainLight !== undefined) mat.uniforms.uLightIntensity0.value = params.mainLight;
    if (params.fillLight !== undefined) mat.uniforms.uLightIntensity1.value = params.fillLight;
    if (params.backLight !== undefined) mat.uniforms.uLightIntensity2.value = params.backLight;

    this._updateRadii(atomRadius, params);
  }




  _updateRadii(atomRadius, params) {
    const n = this.totalAtomCount;
    const radii = this._instanceRadii.array;

    const rangeStart = Math.max(0, Math.min(1, (params.atomRangeStart ?? 0) / 100));
    const rangeEnd   = Math.max(0, Math.min(1, (params.atomRangeEnd ?? 100) / 100));
    const lo = Math.floor(Math.min(rangeStart, rangeEnd) * n);
    const hi = Math.ceil(Math.max(rangeStart, rangeEnd) * n);

    const sidechainFade = params.sidechainFade || 0;
    const referenceAxis = params.referenceAxis || null;
    const useFade = referenceAxis && sidechainFade > 0;

    for (let i = 0; i < n; i++) {
      if (i < lo || i >= hi) {
        radii[i] = 0;
        continue;
      }

      if (useFade) {
        const atom = this.atoms[i];
        const key = (atom.chainID || '') + '_' + atom.resSeq;
        const T = this.residueTangents.get(key);
        if (T) {
          const dot = Math.abs(T.dot(referenceAxis));
          if (dot < sidechainFade) { radii[i] = 0; continue; }
        }
      }

      radii[i] = this._baseRadii[i] * atomRadius;
    }

    this._instanceRadii.needsUpdate = true;
  }

  sortInstances(camera) {
    const n = this.totalAtomCount;
    if (n === 0 || !this._basePositions) return;

    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);

    const depths = new Float32Array(n);
    const bp = this._basePositions;
    for (let i = 0; i < n; i++) {
      depths[i] = bp[i * 3] * forward.x + bp[i * 3 + 1] * forward.y + bp[i * 3 + 2] * forward.z;
    }

    const indices = new Uint32Array(n);
    for (let i = 0; i < n; i++) indices[i] = i;
    indices.sort((a, b) => depths[a] - depths[b]);

    this._permuteFloat32(this._basePositions, indices, 3);
    this._permuteFloat32(this._baseRadii, indices, 1);
    this._permuteFloat32(this._baseColors, indices, 3);
    this._permuteFloat32(this._instancePositions.array, indices, 3);
    this._permuteFloat32(this._instanceRadii.array, indices, 1);
    this._permuteFloat32(this._instanceColors.array, indices, 3);
    this._permuteObjects(this.atoms, indices);

    this._instancePositions.needsUpdate = true;
    this._instanceRadii.needsUpdate = true;
    this._instanceColors.needsUpdate = true;
  }

  _permuteFloat32(arr, indices, stride) {
    const n = indices.length;
    const tmp = new Float32Array(n * stride);
    for (let i = 0; i < n; i++) {
      const src = indices[i] * stride;
      const dst = i * stride;
      for (let s = 0; s < stride; s++) tmp[dst + s] = arr[src + s];
    }
    arr.set(tmp);
  }

  _permuteObjects(arr, indices) {

const BOND_UPDATE_PARAMS = [
  'bondRadius', 'bondOpacity', 'bondHalfColor', 'bondLightness', 'bondRingPink',
  'atomRangeStart', 'atomRangeEnd', 'sidechainFade'
];

class MolamBondNode extends SceneNode {

  static rebuildParams = [];
  static updateParams = BOND_UPDATE_PARAMS;

  build(ctxMix, node, params) {
    if (this.group) return;

    this.group = new THREE.Group();

    this._sceneShim = {
      add:    (obj) => this.group.add(obj),
      remove: (obj) => this.group.remove(obj),
    };

    this.renderer = new BondRenderer(THREE, this._sceneShim);

    if (this._pendingData) {
      const { atoms, scale, chainColorMap } = this._pendingData;
      this._pendingData = null;
      this.renderer.detectAndSetBonds(atoms, scale, chainColorMap);
    }
  }

  setData(atoms, scale, chainColorMap) {
    if (this.renderer) {
      this.renderer.detectAndSetBonds(atoms, scale, chainColorMap);
    } else {
      this._pendingData = { atoms, scale, chainColorMap };
    }
  }

  update(ctxMix, node, params) {
    if (!this.renderer) return;

    this.renderer.params = params;

    if (params.bondRadius !== undefined) this.renderer.setRadius(params.bondRadius);
    this.renderer.updateAllBondInstances();
    if (params.bondHalfColor !== undefined) this.renderer.setHalfColor(params.bondHalfColor);
    if (params.bondLightness !== undefined) this.renderer.setbondLightness(params.bondLightness);
    if (params.bondRingPink !== undefined) this.renderer.setRingPink(params.bondRingPink);
    this.renderer.setOpacity(params.bondOpacity ?? 1);
    this.renderer.setAtomRange(params.atomRangeStart ?? 0, params.atomRangeEnd ?? 100);

    this.renderer.setFade(
      params.sidechainFade || 0,
      params.referenceAxis || null
    );
  }
  teardown(ctxMix, node, params) { this.clear(); }

  clear() {
    if (this.renderer) {
      this.renderer.clear();
      this.renderer = null;
    }
    this._sceneShim = null;
    this._pendingData = null;
    if (this.group) {
      while (this.group.children.length > 0) this.group.remove(this.group.children[0]);
      this.group = null;
    }
  }
}

class DemoHarness2D {
  constructor(canvas,zoneClass,data){this.canvas=canvas;this.rawCtx=canvas.getContext('2d',{willReadFrequently:true});this.node={data,value:{zoneClass,hovered:-1,selected:new Set()},_layout:null};this.params={};this._resize();this._listen();this.draw();new ResizeObserver(()=>{this._resize();this.draw();}).observe(canvas);}
  _resize(){const dpr=window.devicePixelRatio||1;const rect=this.canvas.getBoundingClientRect();this.W=rect.width;this.H=rect.height;this.canvas.width=rect.width*dpr;this.canvas.height=rect.height*dpr;this.rawCtx.setTransform(dpr,0,0,dpr,0,0);}
  _ctxMix(hp){return{ctx:this.rawCtx,state:{index:0,pass:0,isHovered:false,isSelected:false},getHW:(c,n,p)=>({W:c.W,H:c.H,Z:p.zoom||1}),W:this.W,H:this.H,hitPoint:hp||null,hitResult:null};}
  draw(){this.rawCtx.clearRect(0,0,this.W,this.H);ZonedNode.draw2d(this._ctxMix(),this.node,this.params);}
  hitTest(mx,my){const c=this._ctxMix({x:mx,y:my});ZonedNode.hit_test(c,this.node,this.params);return c.hitResult;}
  _listen(){const toL=e=>{const r=this.canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,ex:e.clientX,ey:e.clientY};};
    this.canvas.addEventListener('mousemove',e=>{const{x,y,ex,ey}=toL(e);const hit=this.hitTest(x,y);const idx=hit?hit.zoneIndex:-1;if(idx!==this.node.value.hovered){this.node.value.hovered=idx;this.draw();}this.canvas.style.cursor=idx>=0?'pointer':'default';if(idx>=0){const Z=this.node.value.zoneClass,c=this._ctxMix();c.state.index=idx;const info=Z.getZoneInfo(c,this.node,this.params);info.selected=this.node.value.selected.has(idx);showTooltip(ex,ey,info);}else hideTooltip();});
    this.canvas.addEventListener('mouseleave',()=>{if(this.node.value.hovered>=0){this.node.value.hovered=-1;this.draw();}hideTooltip();});
    this.canvas.addEventListener('click',e=>{const{x,y}=toL(e);const hit=this.hitTest(x,y);if(hit){const sel=this.node.value.selected;if(sel.has(hit.zoneIndex))sel.delete(hit.zoneIndex);else sel.add(hit.zoneIndex);this.draw();}});

const container = document.getElementById('container');
const headerH = document.querySelector('header').getBoundingClientRect().height;
const paneEls = [];    // DOM elements per PANE index
const views3D = [];    // { view, paneIndex }

function bestGrid(n) {
  const contW = window.innerWidth, contH = window.innerHeight - headerH - 1;
  let bestCols = 1, bestScore = Infinity;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c), aspect = (contW / c) / (contH / r);
    const score = Math.abs(Math.log(aspect)) + (n - c * r !== 0 ? 0.3 : 0);
    if (score < bestScore) { bestScore = score; bestCols = c; }
  }
  return { cols: bestCols, rows: Math.ceil(n / bestCols) };
}

function buildLayout() {
  // Clear existing
  container.innerHTML = '';
  paneEls.length = 0;
  views3D.length = 0;

  const visiblePanes = PANES.filter(p => p.visible);
  const N = visiblePanes.length;
  document.getElementById('pane-count').textContent = `${N} of ${PANES.length} panels`;

  if (N === 0) { container.style.background = '#111210'; return; }

  const grid = bestGrid(N);
  const contH = window.innerHeight - headerH - 1;

  for (const pane of visiblePanes) {
    const i = PANES.indexOf(pane);
    const div = document.createElement('div');
    div.className = 'pane' + (pane.type === '3d' ? ' pane-3d' : '');
    div.style.flexBasis = `calc(${100 / grid.cols}% - 1px)`;
    div.style.height = `${contH / grid.rows}px`;
    div.style.minWidth = '0';
    if (pane.background) div.style.background = pane.background;
    div.dataset.paneIndex = i;

    if (pane.type === '2d') {
      const label = document.createElement('div'); label.className = 'label'; label.textContent = pane.label;
      div.appendChild(label);
      const canvas = document.createElement('canvas'); div.appendChild(canvas);
      container.appendChild(div);
      new DemoHarness2D(canvas, pane.zoneClass, pane.data);
    } else {
      const title = document.createElement('div'); title.className = 'pane-title-3d'; title.textContent = pane.label;
      div.appendChild(title);
      container.appendChild(div);
      if (pane.init && !pane._view) {
        pane._view = pane.init(div);
      } else if (pane._view) {
        // Re-attach existing renderer
        div.insertBefore(pane._view.renderer.domElement, title);
        pane._view.container = div;
        pane._view.camera.aspect = div.clientWidth / div.clientHeight;
        pane._view.camera.updateProjectionMatrix();
        pane._view.renderer.setSize(div.clientWidth, div.clientHeight);
      }
      if (pane._view) views3D.push({ view: pane._view, paneIndex: i });
    }
    paneEls[i] = div;
  }
}

buildLayout();

// 3D animation loop
const animate = () => {
  requestAnimationFrame(animate);
  for (const { view: v } of views3D) {
    v.controls.update();
    if (v.phylo) { v.phylo.group.rotation.z += 0.001; v.phylo.group.rotation.x = Math.sin(Date.now() * 0.0003) * 0.1; }
    v.renderer.render(v.scene, v.camera);
  }
};
animate();

window.addEventListener('resize', () => {
  // Recalculate pane sizes
  const visiblePanes = PANES.filter(p => p.visible);
  const N = visiblePanes.length; if (!N) return;
  const grid = bestGrid(N);
  const contH = window.innerHeight - headerH - 1;
  for (const pane of visiblePanes) {
    const i = PANES.indexOf(pane);
    const el = paneEls[i]; if (!el) continue;
    el.style.flexBasis = `calc(${100 / grid.cols}% - 1px)`;
    el.style.height = `${contH / grid.rows}px`;
  }
  for (const { view: v } of views3D) {
    v.camera.aspect = v.container.clientWidth / v.container.clientHeight;
    v.camera.updateProjectionMatrix();
    v.renderer.setSize(v.container.clientWidth, v.container.clientHeight);
  }
});

const hud = new HudPanel({ title: 'Zoned Elements', position: { top: 60, left: 12 } });
let currentView = 'controls';  // 'controls' | 'configure'
let selectedPaneIndex = 0;

function renderControlsView() {
  currentView = 'controls';
  hud.clearContent();

  // ── Shared section ──
  hud.addSeparator('Panel');

  const visiblePanes = PANES.filter(p => p.visible);
  const options = visiblePanes.map(p => [String(PANES.indexOf(p)), p.label]);

  if (options.length === 0) {
    hud.addNote('No panels visible');
    hud.addButton('Configure Panels…', () => renderConfigureView());
    return;
  }

  // Ensure selectedPaneIndex is valid
  if (!PANES[selectedPaneIndex] || !PANES[selectedPaneIndex].visible) {
    selectedPaneIndex = parseInt(options[0][0], 10);
  }

  hud.addSelect(
    { id: '_paneSelector', label: 'Active', options, value: String(selectedPaneIndex) },
    (id, val) => { selectedPaneIndex = parseInt(val, 10); renderControlsView(); }
  );

  hud.addButton('Configure Panels…', () => renderConfigureView());

  // ── Per-panel controls ──
  const pane = PANES[selectedPaneIndex];
  if (!pane) return;

  if (pane.controls && pane.controls.length > 0) {
    const getAll = () => {
      const vals = {};
      for (const c of pane.controls) {
        if (c.id) vals[c.id] = hud.get(c.id);
      }
      return vals;
    };

    for (const ctrl of pane.controls) {
      hud.addControl(ctrl, (ctrlId, val) => {
        if (pane.onControl) pane.onControl(ctrlId, val, getAll, hud);
      });
    }
  } else {
    hud.addSeparator(pane.label);
    hud.addNote('Hover and click to interact');
  }
}

function renderConfigureView() {
  currentView = 'configure';
  hud.clearContent();

  hud.addSeparator('Show / Hide Panels');

  for (let i = 0; i < PANES.length; i++) {
    hud.addCheckbox('_vis_' + i, PANES[i].label, PANES[i].visible);
  }

  hud.addButton('Refresh Layout', () => {
    // Read checkbox states
    for (let i = 0; i < PANES.length; i++) {
      PANES[i].visible = hud.get('_vis_' + i);
    }
    buildLayout();
    renderControlsView();
  }, 'primary');

  hud.addButton('Back', () => renderControlsView());
}

// Initial render
renderControlsView();
