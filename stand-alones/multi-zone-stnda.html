const MODELS = []; // Array of registered model instances

class SubtreeIterator {
  constructor() { this.index = 0; }
  next(subtree) {
    if (this.index >= subtree.length) return null;
    return subtree[this.index++];
  }
}

//<< import { SceneRegistry } from './scene-registry.js';
//-- file: ./scene-registry.js --
class SceneRegistry {
  constructor() {
    this.handlers = {};
    this.meta = {};
  }

  hasCtxMix(fn, name) {
    const fnStr = fn.toString().trim();
    const codeOnly = fnStr.replace(/\/\*[\s\S]*?\*\/|\/\/.*/g, '');
    const match = codeOnly.match(/^[^(]*\(\s*([^,)\s]+)/);
    let firstParam = '';
    if (match) firstParam = match[1];
    else {
      const arrowMatch = codeOnly.match(/^([^=()\s]+)\s*=>/);
      if (arrowMatch) firstParam = arrowMatch[1];
    }
    return firstParam === 'ctxMix';
  }
  
  _hasHandler(nodeType, name) { return !!this.handlers[nodeType]?.[name]; }

  registerNodeClass(nodeType, nodeClass, defaultParams=null) {
    const proto = nodeClass.prototype;
    for (let cls = nodeClass; cls && cls !== Function.prototype; cls = Object.getPrototypeOf(cls)) {
      for (const name of Object.getOwnPropertyNames(cls)) {
        if (['length', 'name', 'prototype'].includes(name)) continue;
        const method = cls[name];
        if (typeof method !== 'function') continue;
        if (this.hasCtxMix(method, name)) {
          if (!this._hasHandler?.(nodeType, name)) {
            this._registerHandler(nodeType, name, (ctxMix, node, params, child) => {
              return nodeClass[name](ctxMix, node, params, child);
            });
          }
        }
      }
    }
    this.meta[nodeType] = { nodeClass, defaultParams, ...(nodeClass.meta || {}) };
  }

  _registerHandler(nodeType, phase, handler) {
    if (!this.handlers[phase]) this.handlers[phase] = {};
    this.handlers[phase][nodeType] = handler;
  }

  dispatch(ctxMix, phase, node, params, child) {
    const phaseHandlers = this.handlers[phase];
    if (!phaseHandlers) return;
    const meta = this.meta[node.type];
    const mergedParams = meta?.defaultParams ? { ...meta.defaultParams, ...params } : params;
    const handler = phaseHandlers[node.type] || phaseHandlers['default'];
    if (handler) return handler(ctxMix, node, mergedParams, child);
  }
  
  hasPhase(nodeType, phase) { return !!this.handlers[phase]?.[nodeType]; }

  walkPhase(ctxMix, phase, node, params) {
    if (!node) return;
    
    if (!node?.subtree || node?.subtree?.length === 0) {
      this.dispatch(ctxMix, phase, node, params);
      return;
    }
    
    if (!ctxMix.iterators) ctxMix.iterators = [];
    ctxMix.iterators.push(new SubtreeIterator());
    
    this.dispatch(ctxMix, 'before_' + phase, node, params);
    
    let child;
    while ((child = ctxMix.iterators.at(-1).next(node.subtree)) !== null) {
      if (ctxMix.abortPhase) break; 

      this.dispatch(ctxMix, 'before_child_' + phase, node, params, child);
      if (ctxMix.abortPhase) break; 
      
      this.walkPhase(ctxMix, phase, child, params);
      if (ctxMix.abortPhase) break; 
      
      this.dispatch(ctxMix, 'after_child_' + phase, node, params, child);
      if (ctxMix.abortPhase) break;
    }
    ctxMix.abortPhase = false;
    
    this.dispatch(ctxMix, 'after_' + phase, node, params);
    ctxMix.iterators.pop();
  }
}

let sceneRegistry = new SceneRegistry();

//<< import { Utils } from './utils.js';
//-- file: ./utils.js --
class Utils {
  static classOfNode(node) {
    if (!node) return null;
    return sceneRegistry.meta[node.type]?.nodeClass || null;
  }
  static hasAffordance(node, phaseName) {
    return node && sceneRegistry.hasPhase(node.type, phaseName);
  }
}

let _nodeId = 0;
function makeNode(type, value, subtree) {
  return { type, value: { ...value, id: ++_nodeId }, subtree: subtree || [] };
}

let THREE, OrbitControls;
async function loadThree() {
  if (THREE) return;
  try {
    THREE = await import('three');
    OrbitControls = (await import('three/addons/controls/OrbitControls.js')).OrbitControls;
  } catch(e) { console.warn('Three.js failed to load.'); }
}

function make3DPane(container) {
  if (!THREE) return null;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, container.clientWidth / Math.max(1, container.clientHeight), 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const view = { scene, camera, renderer, controls, container };

  view.ro = new ResizeObserver(() => {
    if (view.container.clientWidth > 0 && view.container.clientHeight > 0) {
      view.camera.aspect = view.container.clientWidth / view.container.clientHeight;
      view.camera.updateProjectionMatrix();
      view.renderer.setSize(view.container.clientWidth, view.container.clientHeight);
    }
  });
  view.ro.observe(container);

  return view;
}

class HudPanel {
  constructor({ title = 'Controls', container = document.body, controls = [], onChange, position = { top: 60, left: 12 } } = {}) {
    this._onChange = onChange || (() => {});
    this._inputs = {}; 
    this._valDisplays = {}; 
    this._injectStyles();

    this._root = document.createElement('div');
    this._root.className = 'hud-panel';
    this._root.style.top = position.top + 'px'; 
    this._root.style.left = position.left + 'px';
    
    const header = document.createElement('h3'); 
    header.innerHTML = `::: &nbsp; ${title}`;
    this._root.appendChild(header); 
    this._makeDraggable(header);
    
    for (const ctrl of controls) this._addControl(ctrl);
    container.appendChild(this._root);
  }

  destroy() {
    if (this._root.parentNode) {
      this._root.parentNode.removeChild(this._root);
    }
  }

  _addControl(ctrl) {
    if (ctrl.type === 'separator') this._addSeparator(ctrl);
    else if (ctrl.type === 'button')   this._addButton(ctrl);
    else if (ctrl.type === 'checkbox') this._addCheckbox(ctrl);
    else if (ctrl.type === 'select') this._addSelect(ctrl);
    else this._addSlider(ctrl);
  }

  _addSlider(ctrl) {
    const { id, label, min = 0, max = 1, step = 0.01, value = min } = ctrl;
    const row = document.createElement('label'), span = document.createElement('span');
    span.textContent = label; row.appendChild(span);
    const input = document.createElement('input'); Object.assign(input, { type: 'range', min, max, step, value });
    row.appendChild(input);
    const val = document.createElement('span'); val.className = 'val'; val.textContent = parseFloat(value).toFixed(step % 1 === 0 ? 0 : 2);
    row.appendChild(val);
    input.addEventListener('input', () => {
      const v = parseFloat(input.value); val.textContent = v.toFixed(step % 1 === 0 ? 0 : 2);
      this._onChange(id, v);
    });
    this._inputs[id] = input; this._valDisplays[id] = val; this._root.appendChild(row);
  }

  _addButton(ctrl) {
    const btn = document.createElement('button'); btn.className = 'hud-btn' + (ctrl.cls ? ' ' + ctrl.cls : '');
    btn.textContent = ctrl.label; btn.addEventListener('click', ctrl.action || (() => {}));
    this._root.appendChild(btn);
  }

  _addCheckbox(ctrl) {
    const { id, label, value = false } = ctrl;
    const row = document.createElement('label'), span = document.createElement('span');
    span.textContent = label; row.appendChild(span);
    const sw = document.createElement('div'); sw.className = 'toggle-switch';
    const input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!value;
    input.addEventListener('change', () => this._onChange(id, input.checked));
    const slider = document.createElement('span'); slider.className = 'toggle-slider';
    sw.appendChild(input); sw.appendChild(slider); row.appendChild(sw);
    this._inputs[id] = input; this._root.appendChild(row);
  }

  _addSelect(ctrl) {
    const { id, label, options = [], value } = ctrl;
    const row = document.createElement('label'); const span = document.createElement('span');
    span.textContent = label; row.appendChild(span);
    const select = document.createElement('select');
    for (const opt of options) {
      const option = document.createElement('option');
      option.value = opt[0]; option.textContent = opt[1];
      if (opt[0] === String(value)) option.selected = true;
      select.appendChild(option);
    }
    select.addEventListener('change', () => this._onChange(id, select.value));
    row.appendChild(select); this._inputs[id] = select; this._root.appendChild(row);
  }  

  _addSeparator(ctrl) {
    const sep = document.createElement('div'); sep.className = 'separator';
    if (ctrl.label) sep.textContent = ctrl.label;
    this._root.appendChild(sep);
  }

  _makeDraggable(handle) {
    let isDragging = false, startX, startY, startLeft, startTop;
    handle.addEventListener('mousedown', e => {
      isDragging = true; handle.style.cursor = 'grabbing';
      startX = e.clientX; startY = e.clientY;
      startLeft = parseInt(this._root.style.left || 0, 10); startTop  = parseInt(this._root.style.top  || 0, 10);
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      this._root.style.left = `${startLeft + e.clientX - startX}px`; this._root.style.top  = `${startTop  + e.clientY - startY}px`;
    });
    window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; handle.style.cursor = 'grab'; } });
  }

  _injectStyles() {
    if (document.getElementById('hud-panel-css')) return;
    const s = document.createElement('style'); s.id = 'hud-panel-css';
    s.textContent = `
      .hud-panel { position: absolute; background: rgba(18, 18, 22, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 14px 18px; color: #ddd; font: 11px/1.6 system-ui, sans-serif; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 1000; min-width: 220px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); user-select: none; }
      .hud-panel h3 { margin: 0 0 12px; font-size: 11px; color: #b0a898; letter-spacing: 1px; cursor: grab; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); text-transform: uppercase; }
      .hud-panel h3:active { cursor: grabbing; }
      .hud-panel label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
      .hud-panel label > span:first-child { min-width: 90px; color: #999; }
      .hud-panel input[type=range] { flex: 1; accent-color: #6cf; cursor: pointer; }
      .hud-panel select { flex: 1; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 4px; border-radius: 4px; font-size: 10px; outline: none; cursor: pointer; }
      .hud-panel .toggle-switch { position: relative; width: 28px; height: 16px; display: inline-block; flex-shrink: 0; }
      .hud-panel .toggle-switch input { opacity: 0; width: 0; height: 0; margin: 0; position: absolute; }
      .hud-panel .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); transition: .2s; border-radius: 16px; }
      .hud-panel .toggle-slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 2px; bottom: 2px; background-color: #889; transition: .2s; border-radius: 50%; }
      .hud-panel .toggle-switch input:checked + .toggle-slider { background-color: rgba(102, 204, 255, 0.15); border-color: #6cf; }
      .hud-panel .toggle-switch input:checked + .toggle-slider:before { transform: translateX(12px); background-color: #6cf; box-shadow: 0 0 4px #6cf; }
      .hud-panel .val { min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; color: #8cf; font-weight: 600; }
      .hud-panel .separator { margin: 14px 0 8px 0; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); font-size: 9px; color: #a59d8c; text-transform: uppercase; letter-spacing: 1px; }
      .hud-btn { display: block; width: 100%; margin: 4px 0; padding: 6px 0; background: rgba(0,0,0,0.4); color: #ccc; font-size: 11px; font-family: system-ui, sans-serif; text-align: center; border: 1px solid rgba(255,255,255,0.12); border-radius: 5px; cursor: pointer; transition: background .15s, border-color .15s; }
      .hud-btn:hover { border-color: #6cf; background: rgba(102,204,255,0.08); }
      .hud-btn.primary { color: #8cf; border-color: rgba(102,204,255,0.3); }
      .hud-btn.primary:hover { background: rgba(102,204,255,0.12); }
      .hud-btn.green { color: #5b5; }
      .hud-btn.green:hover { border-color: #5b5; background: rgba(80,180,80,0.08); }
      .hud-btn.danger { color: #c55; }
      .hud-btn.danger:hover { border-color: #c55; background: rgba(200,80,80,0.08); }
    `;
    document.head.appendChild(s);
  }
}

class GroundPlaneNode {
  static build3d(ctxMix, node, params) {
    if (node.value.group) return;
    const v = node.value;
    v.group = new THREE.Group();
    v._gridSize = v.grid?.size ?? 20;
    v._gridDivisions = v.grid?.divisions ?? 20;
    v._gridColor1 = v.grid?.color1 ?? 0x444444;
    v._gridColor2 = v.grid?.color2 ?? 0x333333;
    v._gridY = v.grid?.y ?? -4;
    GroundPlaneNode._buildGrid(node);
    if (v.axes) {
      v.axesHelper = new THREE.AxesHelper(v.axes.size ?? 2);
      if (v.axes.position) v.axesHelper.position.set(...v.axes.position);
      v.group.add(v.axesHelper);
    }
  }
  static update3d(ctxMix, node, params) {
    const v = node.value;
    if (!v.group) return;
    const sz = params.gridSize ?? v._gridSize;
    const dv = Math.round(params.gridDivisions ?? v._gridDivisions);
    if (sz !== v._gridSize || dv !== v._gridDivisions) {
      v._gridSize = sz; v._gridDivisions = dv;
      GroundPlaneNode._removeGrid(node);
      GroundPlaneNode._buildGrid(node);
    }
    const y = params.gridY ?? v._gridY;
    if (y !== v._gridY) {
      v._gridY = y;
      if (v.gridHelper) v.gridHelper.position.y = y;
    }
    if (params.gridOpacity !== undefined && v.gridHelper) {
      v.gridHelper.material.opacity = params.gridOpacity;
      v.gridHelper.material.transparent = params.gridOpacity < 1;
      v.gridHelper.material.needsUpdate = true;
    }
  }
  static _buildGrid(node) {
    const v = node.value;
    v.gridHelper = new THREE.GridHelper(v._gridSize, v._gridDivisions, v._gridColor1, v._gridColor2);
    v.gridHelper.position.y = v._gridY;
    v.gridHelper.material.transparent = true;
    v.group.add(v.gridHelper);
  }
  static _removeGrid(node) {
    const v = node.value;
    if (v.gridHelper) {
      v.gridHelper.geometry.dispose();
      v.gridHelper.material.dispose();
      v.group.remove(v.gridHelper);
      v.gridHelper = null;
    }
  }
}
sceneRegistry.registerNodeClass('ground-plane', GroundPlaneNode);

class GroundPlaneModel {
  get name() { return 'Ground Plane'; }
  get displayType() { return '3d'; }
  get background() { return '#111116'; }
  constructor() {
    this.visible = true;
    this.controls = [
      {type:'separator',label:'Ground'},{id:'gridSize',label:'Grid size',min:2,max:60,step:1,value:20},
      {id:'gridDivisions',label:'Divisions',min:2,max:60,step:1,value:20},{id:'gridY',label:'Grid Y',min:-10,max:2,step:0.1,value:-4},
      {id:'gridOpacity',label:'Opacity',min:0,max:1,step:0.01,value:1.0}
    ];
  }
  init(container) {
    const v = make3DPane(container);
    if (!v) return null;
    v.camera.position.set(8,6,12); v.camera.lookAt(0,-2,0); v.controls.target.set(0,-2,0);
    v.scene.add(new THREE.AmbientLight(0xffffff,0.6)); 
    const sun=new THREE.DirectionalLight(0xffffff,0.8); sun.position.set(5,8,4); v.scene.add(sun);
    this.nv = makeNode('ground-plane', {grid:{size:20,divisions:20,y:-4,color1:0x444444,color2:0x333333},axes:{size:2,position:[-9,-3.9,-9]}});
    sceneRegistry.walkPhase({iterators:[]}, 'build3d', this.nv, {}); 
    v.scene.add(this.nv.value.group);
    return v;
  }
  onControl(id, val, getValues) {
    if (this.nv && this.nv.value.group) sceneRegistry.walkPhase({iterators:[]}, 'update3d', this.nv, getValues());
  }
}

class PlanetNode {
  static build3d(ctxMix, node, params) {
    if (node.value.group) return;
    const v = node.value;
    v._crustRadius = v.crustRadius ?? 1;
    v._coreRadius = v.coreRadius ?? 0.6;
    v.group = new THREE.Group();
    v.clipPlane1 = new THREE.Plane(new THREE.Vector3(1,0,0), 0);
    v.clipPlane2 = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
    v.clippingPlanes = [v.clipPlane1, v.clipPlane2];
    const tl = new THREE.TextureLoader();
    const et = tl.load(v.earthTexture ?? 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    v.crustMat = new THREE.MeshPhongMaterial({map:et, clippingPlanes:v.clippingPlanes, clipIntersection:true, side:THREE.DoubleSide});
    v.coreMat = new THREE.MeshPhongMaterial({color:0xff6600, emissive:0x441100, clippingPlanes:v.clippingPlanes, clipIntersection:true, side:THREE.DoubleSide});
    v.gridMat = new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:0.2, clippingPlanes:v.clippingPlanes, clipIntersection:true});
    v.planeMat1 = new THREE.MeshPhongMaterial({side:THREE.DoubleSide, transparent:true, opacity:0.9});
    v.planeMat2 = new THREE.MeshPhongMaterial({side:THREE.DoubleSide, transparent:true, opacity:0.9});
    const r = v._crustRadius;
    v.crust = new THREE.Mesh(new THREE.SphereGeometry(r, 64, 64), v.crustMat);
    v.core = new THREE.Mesh(new THREE.SphereGeometry(v._coreRadius, 64, 64), v.coreMat);
    v.grid = new THREE.Mesh(new THREE.SphereGeometry(r*1.005, 32, 32), v.gridMat);
    const pg = new THREE.CircleGeometry(r, 64, -Math.PI/2, Math.PI);
    v.plane1 = new THREE.Mesh(pg, v.planeMat1);
    v.plane1.rotation.y = Math.PI/2;
    v.plane2 = new THREE.Mesh(pg, v.planeMat2);
    v.plane2.rotation.z = Math.PI;
    v.group.add(v.crust, v.core, v.grid, v.plane1, v.plane2);
    PlanetNode._updateRadialTexture(node, v._coreRadius, 1.0);
  }
  static update3d(ctxMix, node, params) {

function hexToRgb(hex) {
  hex = (hex || '#888888').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  if (hex.length === 8) hex = hex.slice(0, 6);
  const n = parseInt(hex, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function shiftColor({ r, g, b }, amt) {
  const f = v => Math.round(Math.min(255, Math.max(0, amt > 0 ? v + (255 - v) * amt : v + v * amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  } else {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
}

class ButtonNode {
  static meta = {
    zOrder: 1,
    raftable: true,
    spawnOverrides: (wp) => ({ x: wp.x, y: wp.y, label: 'Btn', sub: '' }),
    editableFields: (node) => [
      { key: 'label', label: 'Label', type: 'text', value: node.value.label || '' },
      { key: 'sub', label: 'Subtext', type: 'text', value: node.value.sub || '' },
      { key: 'badge', label: 'Badge', type: 'number', value: node.value.badge || 0 },
      { key: 'color', label: 'Fill Color', type: 'color', value: node.value.color || BUTTON_DEFAULTS.fill },
      { key: 'fontSize', label: 'Font Size', type: 'number', value: node.value.fontSize || BUTTON_DEFAULTS.fontSize },
      { key: 'cornerRadius', label: 'Corner Radius', type: 'number', value: node.value.cornerRadius || BUTTON_DEFAULTS.cornerRadius },
      { key: 'borderWidth', label: 'Border Width', type: 'number', value: node.value.borderWidth || BUTTON_DEFAULTS.borderWidth },
      { key: 'bevel', label: 'Bevel', type: 'number', value: node.value.bevel ?? BUTTON_DEFAULTS.bevel },
      { key: 'bevelStrength', label: 'Bevel Strength', type: 'number', value: node.value.bevelStrength ?? BUTTON_DEFAULTS.bevelStrength },
      { key: 'scale', label: 'Scale', type: 'number', value: node.value.scale || BUTTON_DEFAULTS.scale },
      { key: 'brightness', label: 'Brightness', type: 'number', value: node.value.brightness ?? BUTTON_DEFAULTS.brightness },
    ],
  };

  static draw2d(ctxMix, node, params) {
    const v = node.value || {};
    const p = { ...BUTTON_DEFAULTS, ...params };
    const zoom = 1;

    const rawW   = v.width  || 64;
    const rawH   = v.height || 64;
    const sc     = v.scale ?? p.scale ?? 1;
    const w      = rawW * zoom * sc;
    const h      = rawH * zoom * sc;
    const screen = ctxMix.getXY(ctxMix, node, params);
    const cx     = screen.x;
    const cy     = screen.y + (v.liftY ?? p.liftY ?? 0) * zoom;
    const left   = cx - w / 2;
    const top    = cy - h / 2;
    const r      = (v.cornerRadius ?? p.cornerRadius ?? 0) * zoom * sc;
    const bw     = (v.borderWidth  ?? p.borderWidth  ?? 0) * zoom * sc;

    const fillHex = v.color || p.fill;

    const ctx = ctxMix.ctx;

    if (v.disabled) ctx.globalAlpha *= 0.42;

    if (p.shadowBlur > 0) {
      ctx.save();
      ctx.shadowColor   = p.shadowColor;
      ctx.shadowOffsetX = (p.shadowOffsetX || 0) * zoom;
      ctx.shadowOffsetY = (p.shadowOffsetY || 0) * zoom;
      ctx.shadowBlur    = (p.shadowBlur    || 0) * zoom;
      roundRectPath(ctx, left, top, w, h, r);
      ctx.fillStyle = fillHex;
      ctx.fill();
      ctx.restore();
    }

    const base    = hexToRgb(fillHex);
    const bevel   = p.bevel || 0;
    const bStr    = p.bevelStrength || 0;
    const lInt    = p.lightIntensity || 0;
    const angle   = p.lightAngle || 315;
    const rad     = angle * Math.PI / 180;
    const dx      = Math.sin(rad);
    const dy      = -Math.cos(rad);

    const faceLit = shiftColor(base,  lInt * 0.14 * bevel);
    const faceSh  = shiftColor(base, -lInt * 0.10 * bevel);

    const gx0 = cx + dx * w / 2;
    const gy0 = cy + dy * h / 2;
    const gx1 = cx - dx * w / 2;
    const gy1 = cy - dy * h / 2;

    const faceGrad = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
    faceGrad.addColorStop(0, faceLit);
    faceGrad.addColorStop(1, faceSh);

    roundRectPath(ctx, left, top, w, h, r);
    ctx.fillStyle = faceGrad;
    ctx.fill();

    if (bevel !== 0 && bStr > 0) {
      const litAmt = bStr * lInt * bevel;
      const hi     = shiftColor(base,  litAmt);
      const lo     = shiftColor(base, -litAmt);
      const edgeW  = bw * 1.4;

      ctx.save();
      roundRectPath(ctx, left, top, w, h, r);
      ctx.clip();

      ctx.strokeStyle = hi;
      ctx.lineWidth   = edgeW;
      roundRectPath(ctx, left + dx * bw * 0.5,
                         top  + dy * bw * 0.5, w, h, r);
      ctx.stroke();

      ctx.strokeStyle = lo;
      ctx.lineWidth   = edgeW;
      roundRectPath(ctx, left - dx * bw * 0.5,
                         top  - dy * bw * 0.5, w, h, r);
      ctx.stroke();

      ctx.restore();
    }

    if ((p.brightness || 1) < 1.0) {
      roundRectPath(ctx, left, top, w, h, r);
      ctx.fillStyle = `rgba(0,0,0,${(1 - p.brightness).toFixed(3)})`;
      ctx.fill();
    }

    const label = v.label ?? v.emoji ?? v.symbol
               ?? v.name?.substring(0, 2) ?? '';

    if (label) {
      const fSize = (p.fontSize || 32) * zoom * sc;
      ctx.fillStyle    = p.color;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.font         = `600 ${fSize.toFixed(1)}px "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif`;

      const labelY = v.sub ? cy - h * 0.06 : cy;
      ctx.fillText(label, cx, labelY);
    }

    if (v.sub) {
      const subSize = (p.fontSize || 32) * 0.36 * zoom * sc;
      ctx.fillStyle    = p.color;
      ctx.globalAlpha  = (v.disabled ? 0.42 : 1.0) * 0.65;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.font         = `400 ${subSize.toFixed(1)}px "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif`;

      const subY = cy + h * 0.22 + (p.subOffset || 0) * zoom;
      ctx.fillText(v.sub, cx, subY);
    }

    if (v.badge != null && v.badge !== '') {
      const badgeR = 10 * zoom;
      const badgeX = left + w - badgeR * 0.4;
      const badgeY = top  - badgeR * 0.4;

      ctx.globalAlpha = v.disabled ? 0.42 : 1.0;
      ctx.beginPath();
      ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
      ctx.fillStyle = p.badgeFill || '#e74c3c';
      ctx.fill();

      ctx.fillStyle    = p.badgeColor || '#fff';
      ctx.font         = `700 ${(11 * zoom).toFixed(1)}px system-ui, sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(v.badge), badgeX, badgeY + 0.5);
    }

    if (params.indicatedIds && params.indicatedIds.has(v.id)) {
      ctx.setLineDash([4 * zoom, 4 * zoom]);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth   = 2 * zoom;
      roundRectPath(ctx, left - 4 * zoom, top - 4 * zoom,
                    w + 8 * zoom, h + 8 * zoom,
                    r + 4 * zoom);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;

    const v = node.value || {};
    if (v.disabled) return;

    const p    = { ...BUTTON_DEFAULTS, ...params };
    const zoom = 1;

    const sc   = p.scale || 1;
    const rawW = v.width  || 64;
    const rawH = v.height || 64;
    const w    = rawW * zoom * sc;
    const h    = rawH * zoom * sc;
    const r    = Math.min((p.cornerRadius || 0) * zoom * sc, w / 2, h / 2);

    const screen = ctxMix.getXY(ctxMix,node,params)
    const sx   = screen.x;
    const sy   = screen.y + (p.liftY || 0) * zoom;
    const left = sx - w / 2;
    const top  = sy - h / 2;

    if (pt.x < left || pt.x > left + w ||
        pt.y < top  || pt.y > top  + h) return;

    const lx = pt.x - left;
    const ly = pt.y - top;
    if (lx < r && ly < r && (lx - r) ** 2 + (ly - r) ** 2 > r * r) return;
    if (lx > w - r && ly < r && (lx - (w - r)) ** 2 + (ly - r) ** 2 > r * r) return;
    if (lx < r && ly > h - r && (lx - r) ** 2 + (ly - (h - r)) ** 2 > r * r) return;
    if (lx > w - r && ly > h - r && (lx - (w - r)) ** 2 + (ly - (h - r)) ** 2 > r * r) return;

    const dxHit = pt.x - sx;
    const dyHit = pt.y - sy;

    ctxMix.hitResult = {
      node,
      interactions: {
        applyDrag(wx, wy) {
          node.value.x = wx - dxHit;
          node.value.y = wy - dyHit;
        },
      },
    };
  }
}

class PhyllotaxisModel {
  constructor(label, state) {
    this._label = label;
    this.visible = true;
    this._phyloState = JSON.parse(JSON.stringify(state));
    this._currentLevel = 0;
    this._maxCounts = [20,20,500];
    this.controls = [
      {type:'separator',label:'Global'},{id:'baseHue',label:'Base Hue',min:0,max:1,step:0.01,value:state.baseHue},{id:'splatSize',label:'Splat Size',min:0.1,max:5,step:0.1,value:state.splatSize},{id:'splatLength',label:'Splat Len',min:0.1,max:10,step:0.1,value:state.splatLength},{id:'splatWidth',label:'Splat W',min:0.1,max:10,step:0.1,value:state.splatWidth},
      {type:'separator',label:'Level'},{id:'level',type:'select',label:'Target',options:[['0','Lvl 1'],['1','Lvl 2'],['2','Lvl 3']],value:'0'},
      {id:'count',label:'Count',min:1,max:this._maxCounts[0],step:1,value:state.levels[0].count},
      {id:'angle',label:'Div. Angle',min:100,max:180,step:0.1,value:state.levels[0].angle},
      {id:'height',label:'Height',min:0,max:50,step:0.1,value:state.levels[0].height},
      {id:'initialRadius',label:'Init R',min:0,max:30,step:0.1,value:state.levels[0].initialRadius},
      {id:'finalRadius',label:'Final R',min:0,max:30,step:0.1,value:state.levels[0].finalRadius},
      {id:'bulge',label:'Bulge',min:-2,max:2,step:0.01,value:state.levels[0].bulge},
      {id:'tilt',label:'Tilt',min:-90,max:90,step:1,value:state.levels[0].tilt},
      {id:'hueShift',label:'Hue Shift',min:-1,max:1,step:0.01,value:state.levels[0].hueShift}
    ];
  }
  get name() { return this._label; }
  get displayType() { return '3d'; }
  get background() { return '#090a0f'; }

  init(container) {
    const v = make3DPane(container);
    if (!v) return null;
    v.camera.position.set(0,-50,80);
    this.nv = makeNode('phylo-node', {}); 
    sceneRegistry.walkPhase({iterators:[]}, 'build3d', this.nv, this._phyloState); 
    v.scene.add(this.nv.value.group); 
    v.phyloNode = this.nv; 
    return v;
  }

  onControl(id, val, getValues, app) {
    if (id === 'level') {
      this._currentLevel = parseInt(val, 10);
      const l = this._phyloState.levels[this._currentLevel];
      this.controls.find(c => c.id === 'count').max = this._maxCounts[this._currentLevel];
      ['count','angle','height','initialRadius','finalRadius','bulge','tilt','hueShift'].forEach(k => {
        const ctrl = this.controls.find(c => c.id === k);
        if (ctrl) ctrl.value = l[k];
      });
      app.buildHud(); 
    } else if (['baseHue','splatSize','splatLength','splatWidth'].includes(id)) {
      this._phyloState[id] = val;
      if (this.nv && this.nv.value.group) sceneRegistry.walkPhase({iterators:[]}, 'update3d', this.nv, this._phyloState);
      const ctrl = this.controls.find(c => c.id === id);
      if (ctrl) ctrl.value = val;
    } else {
      this._phyloState.levels[this._currentLevel][id] = val;
      if (this.nv && this.nv.value.group) sceneRegistry.walkPhase({iterators:[]}, 'update3d', this.nv, this._phyloState);
      const ctrl = this.controls.find(c => c.id === id);
      if (ctrl) ctrl.value = val;
    }
  }
}

//<< import { DemoHarness2D } from './demo-harness2-d.js';
//-- file: ./demo-harness2-d.js --
class DemoHarness2D {
  constructor(canvas, paneConfig, app){
    this.canvas=canvas;this.rawCtx=canvas.getContext('2d',{willReadFrequently:true});
    this.app = app;
    if (paneConfig.zoneClass) {
        this.isZone = true;
        this.node = makeNode('zoned-node', {zoneClass: paneConfig.zoneClass, hovered:-1, selected:new Set()});
        this.node.data = paneConfig.data;
    } else if (paneConfig.sceneRoot) {
        this.isZone = false;
        this.node = paneConfig.sceneRoot;
    }
    this.params={};
    this.dragHit = null;
    this.selectedNode = null;
    this.hoveredNode = null;
    this._resize();this._listen();this.draw();
    new ResizeObserver(()=>{this._resize();this.draw();}).observe(canvas);
  }
  _resize(){const dpr=window.devicePixelRatio||1;const rect=this.canvas.getBoundingClientRect();this.W=rect.width;this.H=rect.height;if(this.W===0||this.H===0)return;this.canvas.width=rect.width*dpr;this.canvas.height=rect.height*dpr;this.rawCtx.setTransform(dpr,0,0,dpr,0,0);}
  
  _ctxMix(hp){
    return {
      ctx: this.rawCtx, iterators: [],
      state: {index:0, pass:0, isHovered:false, isSelected:false},
      getHW: (c,n,p) => ({W: c.W, H: c.H, Z: p?.zoom||1}),
      getXY: (m, n) => {
        if (this.isZone) return {x:0, y:0};
        return { x: this.W/2 + (n.value.x || 0), y: this.H/2 + (n.value.y || 0) };
      },
      W: this.W, H: this.H, hitPoint: hp||null, hitResult: null
    };
  }

  draw(){
    if(!this.W||!this.H)return;
    this.rawCtx.clearRect(0,0,this.W,this.H);
    
    if (!this.isZone) {
        this.params.indicatedIds = new Set();
        if (this.selectedNode) this.params.indicatedIds.add(this.selectedNode.value.id);
        if (this.hoveredNode) this.params.indicatedIds.add(this.hoveredNode.value.id);
    }
    sceneRegistry.walkPhase(this._ctxMix(), 'draw2d', this.node, this.params);
  }
  
  hitTest(mx,my){
    const c=this._ctxMix({x:mx,y:my});
    sceneRegistry.walkPhase(c, 'hit_test', this.node, this.params);
    return c.hitResult;
  }
  
  _listen(){
    const toL=e=>{const r=this.canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,ex:e.clientX,ey:e.clientY};};
    
    this.canvas.addEventListener('mousedown',e=>{
      const{x,y,ex,ey}=toL(e);
      const hit=this.hitTest(x,y);
      if (this.isZone) {
          if(hit){
              const sel=this.node.value.selected;
              if(sel.has(hit.zoneIndex)) sel.delete(hit.zoneIndex); else sel.add(hit.zoneIndex);
          }
      } else {
          if (hit && hit.node) {
              this.selectedNode = hit.node;
              this.dragHit = hit;
              this.app.selectNode(hit.node, this);
          } else {
              this.selectedNode = null;
              this.app.selectNode(null, this);
          }
      }
      this.draw();
    });
    
    this.canvas.addEventListener('mousemove',e=>{
      const{x,y,ex,ey}=toL(e);
      if (this.dragHit) {
          if (this.dragHit.interactions?.applyDrag) {
              this.dragHit.interactions.applyDrag(x - this.W/2, y - this.H/2);
              this.draw();
          }
          return;
      }
      const hit=this.hitTest(x,y);
      if (this.isZone) {
          const idx=hit?hit.zoneIndex:-1;
          if(idx!==this.node.value.hovered){this.node.value.hovered=idx;this.draw();}
          this.canvas.style.cursor=idx>=0?'pointer':'default';
          if(idx>=0){
              const Z=this.node.value.zoneClass,c=this._ctxMix();c.state.index=idx;
              const info=Z.getZoneInfo(c,this.node,this.params);
              info.selected=this.node.value.selected.has(idx);
              showTooltip(ex,ey,info);
          } else hideTooltip();
      } else {
          this.canvas.style.cursor = hit ? 'grab' : 'default';
          if (hit && hit.node !== this.hoveredNode) {
              this.hoveredNode = hit.node;
              this.draw();
          } else if (!hit && this.hoveredNode) {
              this.hoveredNode = null;
              this.draw();
          }
      }
    });
    
    this.canvas.addEventListener('mouseup', ()=>{ this.dragHit = null; });
    this.canvas.addEventListener('mouseleave',()=>{
      if(this.isZone) {
          if(this.node.value.hovered>=0){this.node.value.hovered=-1;this.draw();}
          hideTooltip();
      }
      this.dragHit = null;
    });
  }
}

class App {
  constructor() {
    this.container = document.getElementById('container');
    this.paneEls = [];
    this.views3D = [];
    this.hudState = {}; 
    
    MODELS.forEach((m, i) => {
      this.hudState['vis_' + i] = m.visible !== false;
      if (m.controls) {
        m.controls.forEach(c => {
          if (c.id && c.value !== undefined) this.hudState[c.id] = c.value;
        });
      }
    });
    
    this.activeModel = MODELS.find(m => (m.displayType || '2d') !== 'none' && m.visible !== false);
    this.buildHud();

    loadThree().then(() => {
      this.buildLayout();
      this.animate();
    });

    const handleResize = () => {
      if (this._resizeTimer) clearTimeout(this._resizeTimer);
      this._resizeTimer = setTimeout(() => this.resize(), 50);
    };
    new ResizeObserver(handleResize).observe(document.body);
    window.addEventListener('resize', handleResize);
  }

  buildHud() {
    if (this.hud) {
      this.hud.destroy();
    }
    
    const controls = [];
    
    const dropdownModels = MODELS.filter(m => m.visible !== false);
    if (!dropdownModels.includes(this.activeModel) && dropdownModels.length > 0) {
      this.activeModel = dropdownModels[0];
    }
    
    if (dropdownModels.length > 0) {
      controls.push({ type: 'separator', label: 'Active Panel' });
      controls.push({
        type: 'select',
        id: 'activePanel',
        label: 'Controls For',
        options: dropdownModels.map(m => [String(MODELS.indexOf(m)), 
          m.name?.split(/[.·]/)[0].trim() || 'Unnamed']),
        value: String(MODELS.indexOf(this.activeModel))
      });
      
      if (this.activeModel) {
        if (this.activeModel.controls) {
          controls.push(...this.activeModel.controls);
        } else if (this.activeModel.getControls) {
          controls.push(...this.activeModel.getControls(this));
        }
      }
    }
    
    this.hud = new HudPanel({
      title: 'Zoned Elements',
      controls,
      onChange: (id, val) => this.handleHudChange(id, val)
    });
    
    if (!this._selPanel) {
      this._selPanel = document.createElement('div');
      this._selPanel.className = 'hud-panel';
      this._selPanel.style.cssText = 'position:absolute; top:12px; right:12px; display:none; min-width:220px;';
      document.body.appendChild(this._selPanel);
    }
  }

  selectNode(node, harness) {
    this.selectedNode = node;
    this.activeHarness = harness;
    this.updateSelectedPanel();
  }

  updateSelectedPanel() {
    const el = this._selPanel, node = this.selectedNode;
    const cls = node ? Utils.classOfNode(node) : null;
    const fields = cls?.meta?.editableFields?.(node);
    if (!node || !fields || fields.length === 0) { el.style.display = 'none'; return; }
    el.style.display = 'block'; el.innerHTML = '';
    const header = document.createElement('h3'); header.textContent = `SELECTED ${node.type.toUpperCase()}`; el.appendChild(header);
    for (const f of fields) {
      const row = document.createElement('div'); row.className = 'sel-row';
      const span = document.createElement('span'); span.textContent = f.label; row.appendChild(span);
      const inp = document.createElement('input'); inp.type = f.type; inp.value = f.value;
      inp.addEventListener('input', () => { 
        node.value[f.key] = f.type === 'number' ? Number(inp.value) : inp.value; 
        if (this.activeHarness) this.activeHarness.draw();
      });
      row.appendChild(inp); el.appendChild(row);
    }
  }

  handleHudChange(id, val) {
    this.hudState[id] = val;
    if (id === 'activePanel') {
      this.activeModel = MODELS[parseInt(val, 10)];
      this.buildHud();
    } else if (id.startsWith('vis_')) {
      const mIdx = parseInt(id.split('_')[1], 10);
      if (MODELS[mIdx]) MODELS[mIdx].visible = val;
    } else {
      if (this.activeModel && this.activeModel.onControl) {
        this.activeModel.onControl(id, val, () => this.hudState, this);
      }
    }
  }

  bestGrid(n) {
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contW = Math.max(1, window.innerWidth);
    const contH = Math.max(1, window.innerHeight - headerH - 1);
    let bestCols = 1, bestScore = Infinity;
    for (let c = 1; c <= n; c++) {
      const r = Math.ceil(n / c), aspect = (contW / c) / (contH / r);
      const score = Math.abs(Math.log(aspect)) + (n - c * r !== 0 ? 0.3 : 0);
      if (score < bestScore) { bestScore = score; bestCols = c; }
    }
    return { cols: bestCols, rows: Math.ceil(n / bestCols) };
  }

  buildLayout() {
    this.container.innerHTML = '';
    this.paneEls.length = 0;
    this.views3D.length = 0;

    const visibleModels = MODELS.filter(p => p.visible && (p.displayType || '2d') !== 'none');
    const N = visibleModels.length;
    document.getElementById('pane-count').textContent = `${N} of ${MODELS.length - 1} panels`;

    if (N === 0) { this.container.style.background = '#111210'; return; }

    const grid = this.bestGrid(N);
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contH = Math.max(1, window.innerHeight - headerH - 1);

    for (const pane of visibleModels) {
      const i = MODELS.indexOf(pane);
      const type = pane.displayType || '2d';
      const div = document.createElement('div');
      div.className = 'pane' + (type === '3d' ? ' pane-3d' : '');
      div.style.flexBasis = `calc(${100 / grid.cols}% - 1px)`;
      div.style.height = `${contH / grid.rows}px`;
      div.style.minWidth = '0';
      if (pane.background) div.style.background = pane.background;
      div.dataset.paneIndex = i;

      if (type === '2d') {
        const label = document.createElement('div'); label.className = 'label'; label.textContent = pane.name;
        div.appendChild(label);
        const canvas = document.createElement('canvas'); div.appendChild(canvas);
        this.container.appendChild(div);
        new DemoHarness2D(canvas, pane, this);
      } else if (type === '3d') {
        const title = document.createElement('div'); title.className = 'pane-title-3d'; title.textContent = pane.name;
        div.appendChild(title);
        this.container.appendChild(div);
        
        if (typeof pane.init === 'function') {
           if (!pane._view) {
             pane._view = pane.init(div);
             if (pane.onControl) {
                const initVals = {};
                (pane.controls || []).forEach(c => { if(c.id) initVals[c.id] = c.value; });
                pane.onControl(null, null, () => initVals, this);
             }
           } else if (pane._view) {
             div.insertBefore(pane._view.renderer.domElement, title);
             if (pane._view.ro) {
                 pane._view.ro.unobserve(pane._view.container);
                 pane._view.ro.observe(div);
             }
             pane._view.container = div;
           }
           if (pane._view) this.views3D.push({ view: pane._view, paneIndex: i });
        }
      }
      this.paneEls[i] = div;
    }
  }

  resize() {
    const visibleModels = MODELS.filter(p => p.visible && (p.displayType || '2d') !== 'none');
    const N = visibleModels.length; if (!N) return;
    const grid = this.bestGrid(N);
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contH = Math.max(1, window.innerHeight - headerH - 1);
    
    for (const pane of visibleModels) {
      const i = MODELS.indexOf(pane);
      const el = this.paneEls[i]; if (!el) continue;
      el.style.flexBasis = `calc(${100 / grid.cols}% - 1px)`;
      el.style.height = `${contH / grid.rows}px`;
    }
    for (const { view: v } of this.views3D) {
      if (v.container.clientWidth > 0 && v.container.clientHeight > 0) {
        v.camera.aspect = v.container.clientWidth / v.container.clientHeight;
        v.camera.updateProjectionMatrix();
        v.renderer.setSize(v.container.clientWidth, v.container.clientHeight);
      }
    }
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    for (const { view: v } of this.views3D) {
      v.controls.update();
      if (v.phyloNode) { 
        v.phyloNode.value.group.rotation.z += 0.001; 
        v.phyloNode.value.group.rotation.x = Math.sin(Date.now() * 0.0003) * 0.1; 
      }
      v.renderer.render(v.scene, v.camera);
    }
  }
}

new App();
