//<< import { BasicCollectionNode } from './basic-collection-node.js';
//-- file: ./basic-collection-node.js --
//>> export { BasicCollectionNode };
class BasicCollectionNode {
  // Selection lives on the item, so clearing it is a walk over the scene.
  static clear_selection(ctxMix, node, params) {
    if (node.state) node.state.selected = undefined;
  }

  static _sortSubtree(sub) {
    sub.sort((a, b) => {
      const az = Utils.classOfNode(a)?.meta?.zOrder ?? 0;
      const bz = Utils.classOfNode(b)?.meta?.zOrder ?? 0;
      return az - bz;
    });
  }

  static after_child_hit_test(ctxMix, node, params, child) {

  static before_draw2d(ctxMix, node, params) {

    for (let x = Math.floor(l / spacing) * spacing; x <= r; x += spacing)

    }

  static after_hit_test(ctxMix, node, params) {
    ctxMix.hitPoint = node.value.savedHit;

    const cls = Utils.classOfNode(node);
    if (cls && cls.setXY) 
      cls.setXY(Values, node, { x: x, y: y });
    else 
      Values.setValue(Values, node, {}, { x, y });

    ctx.restore();

// Call the before_draw2d, so that we still draw the (empty) background 
  static draw2d(ctxMix, node, params) {
    StockStripNode.before_draw2d(ctxMix, node, params)
  }

  static before_child_draw2d(ctxMix, node, params, child) {
    ctxMix.ctx.save();
    ctxMix.ctx.globalAlpha = 1.0;
  }

    let cx = child.value.x, cy = child.value.y;

    if (cls && cls.getCentreXY) {
      const center = cls.getCentreXY(ctxMix, child, params);
      cx = center.x; cy = center.y;
    }

    const stripPips = Utils.pipsFn(child);
    if (stripPips) {
      for (const p of stripPips(ctxMix, child, params)) {
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Geo.TAU); 
        ctx.strokeStyle = '#666'; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    ctx.restore();

    ctx.fillText(child.value.label || '', cx, cy + 27);
  }

  static before_hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt || pt.y < ctxMix.getWH().H - node.value.height) {
      ctxMix.abortPhase = true; 
      return;
    }
    StockStripNode.layout(ctxMix, node);
  }

  static after_child_hit_test(ctxMix, node, params, child) {
    if (!ctxMix.hitResult) return;

    const arena = node.inst?.arenaNode;
    const camNode = node.inst?.cameraNode;

    if (!arena || !camNode) {
      ctxMix.hitResult.isStockPrototype = true;
      ctxMix.abortPhase = true;
      return;
    }

    const proto = ctxMix.hitResult.node;
    const pt = ctxMix.hitPoint;

    const toWorld = (sx, sy) => {
      const v = camNode.value;
      const cx = v.centerOrigin ? ctxMix.W / 2 : 0;
      const cy = v.centerOrigin ? ctxMix.H / 2 : 0;
      const z  = v.zoom || 1;
      return {
        x: (sx - cx) / z + (v.scrollX || 0),
        y: (sy - cy) / z + (v.scrollY || 0),
      };
    };

// Capture click offset relative to proto centre (in screen space)
    const cls = Utils.classOfNode(proto);
    let protoCx = proto.value.x || 0, protoCy = proto.value.y || 0;
    if (cls?.getCentreXY) {

    const offY = pt.y - protoCy;

// (after_child_hit_test also fires on hover, where we must not spawn)
    let clone = null;
    let innerDrag = null;
    let innerEnd = null;

    ctxMix.hitResult = {
      node: proto,
      interactions: {
        applyDrag(sx, sy) {
          const w = toWorld(sx - offX, sy - offY);

          if (!clone) {
      // First drag: create clone, run hit_test, wrap with controllers
            const overrides = cls?.meta?.spawnOverrides?.(w) ?? { x: w.x, y: w.y };
            clone = cloneProto(proto, overrides);
            arena.subtree.push(clone);
            BasicCollectionNode._sortSubtree(arena.subtree);

            const cloneCls = Utils.classOfNode(clone);
            // The strip is a sibling of the camera, so its coords are already
            // world coords for the arena: carry the incoming context through.
            const cloneMix = { ...ctxMix, hitPoint: w, hitResult: null };
            cloneCls.hit_test(cloneMix, clone, params);

            if (cloneMix.hitResult) {
              PipperNode.claim(cloneMix, arena, cloneMix.hitResult, params);
              innerDrag = cloneMix.hitResult.interactions?.applyDrag;
              innerEnd  = cloneMix.hitResult.interactions?.endDrag;
            }
          }

          if (innerDrag) innerDrag(w.x, w.y);
          else StockStripNode.setXY(clone, w.x, w.y);
          return clone;
        },
        endDrag(onStrip) {
          if (!clone) return;
          if (onStrip) {
            if (innerEnd) innerEnd(true);
      // Belt-and-suspenders: ensure clone is removed
            const idx = arena.subtree.indexOf(clone);
            if (idx >= 0) arena.subtree.splice(idx, 1);
            PipperNode.manager(arena).removeNode(clone);
          } else {
            if (innerEnd) innerEnd(false);
          }
        },
      },
    };
    ctxMix.abortPhase = true;
  }
}

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {

        const bp = PippedPolygonNode.getPips(Values, nodes[j], {});

            if (!Geo.pipsOpposite(ap[ai].out, bp[bi].out)) continue;
            if (Geo.dist(ap[ai], bp[bi]) >= 2) continue;
            if (taken.has(key(nodes[i], ai)) || taken.has(key(nodes[j], bi))) continue;

            taken.add(key(nodes[j], bi));
            conns.push({ a: nodes[i].value.id, pipA: ai, b: nodes[j].value.id, pipB: bi });

/* Visiting order as a generator, not an array: a large dump need never
   materialise one index per byte, and the range visited can be narrowed to
   what is actually on screen. */
class FlyweightIterator {
  constructor(order) {
    this.gen = order[Symbol.iterator]();
    this.current = -1;
  }

  next(subtree) {
    const step = this.gen.next();
    if (step.done) return null;
    this.current = step.value;
    return subtree[0];
  }
}

//<< import { FlyweightArrayNode } from './flyweight-array-node.js';
//-- file: ./flyweight-array-node.js --
//>> export { FlyweightArrayNode };

/* ─────────────────────────────────────────────────────────────────────────────
FlyweightArrayNode — draws N copies of one proto child.

The proto is written as an ordinary node and never learns that it is shared.
The model says how an index becomes a value, and what a write to an item
means; this class only scopes those to the item currently being visited.

  value.count            how many items
  value.drawOrder        visiting order for layout and drawing
  value.hitOrder         visiting order for hit testing (default: reverse draw)

  inst.getValue(ctxMix, node, params, i)         -> the item's value
  inst.setValue(ctxMix, node, params, i, patch)  -> true if changed
  inst.visibleRange(ctxMix, node, params)        -> [start, end) to cull to

Selection needs no flag: a model whose setValue does something with `selected`
has selectable items, and one whose setValue drops it does not.
──────────────────────────────────────────────────────────────────────────── */
class FlyweightArrayNode {
  static clear_selection(ctxMix, node, params) {
    const st = node.state;
    if (st?.selected?.size) st.selected.clear();
  }

  /* Asked for rather than frozen: a control that changes bytes-per-row
     changes how many chunks there are. */
  static count(node) { return node.inst?.getCount?.(node) ?? node.value.count ?? 0; }

  static *_order(ctxMix, node, params, phase) {
    const v = node.value;
    const [from, to] = node.inst?.visibleRange?.(ctxMix, node, params)
                    ?? [0, FlyweightArrayNode.count(node)];

    const listed = phase === 'hit_test' ? (v.hitOrder ?? v.drawOrder) : v.drawOrder;
    if (listed) {
      const seq = (phase === 'hit_test' && !v.hitOrder) ? [...listed].reverse() : listed;
      for (const i of seq) if (i >= from && i < to) yield i;
      return;
    }
    if (phase === 'hit_test') { for (let i = to - 1; i >= from; i--) yield i; return; }
    for (let i = from; i < to; i++) yield i;
  }

  static valueAt(node, ctxMix, params, index) {
    const getValue = node.inst?.getValue;
    return getValue ? getValue(ctxMix, node, params, index) : { index };
  }

  static writeAt(node, ctxMix, params, index, patch) {
    const setValue = node.inst?.setValue;
    return setValue ? !!setValue(ctxMix, node, params, index, patch) : false;
  }

  static _install(ctxMix, node, params, phase) {
    ctxMix.iterators.pop();
    const iter = new FlyweightIterator(FlyweightArrayNode._order(ctxMix, node, params, phase));
    ctxMix.iterators.push(iter);

    const proto = node.subtree?.[0];
    if (!proto) return;

    // Scoped to whichever item the iterator is on when these are called.
    proto.flyFn = (mix, n, p)    => FlyweightArrayNode.valueAt(node, mix, p, iter.current);
    proto.setFn = (mix, n, p, x) => FlyweightArrayNode.writeAt(node, mix, p, iter.current, x);
  }

  static before_layout(ctxMix, node, params)   { FlyweightArrayNode._install(ctxMix, node, params, 'layout'); }
  static before_draw2d(ctxMix, node, params)   { FlyweightArrayNode._install(ctxMix, node, params, 'draw2d'); }
  static before_hit_test(ctxMix, node, params) { FlyweightArrayNode._install(ctxMix, node, params, 'hit_test'); }

  /* A hit landed on the shared proto.  Bind every interaction to this item,
     so that the app can act on the hit long after the walk has ended without
     ever knowing that an index exists.  Wrapping composes: a nested flyweight
     wraps these again, adding its own scope. */
  static after_child_hit_test(ctxMix, node, params, child) {
    const hit = ctxMix.hitResult;
    if (!hit || hit.node !== child) return;

    const index = ctxMix.iterators.at(-1)?.current ?? 0;
    const inner = hit.interactions || {};

    hit.interactions = {
      ...inner,
      getValue:   ()      => FlyweightArrayNode.valueAt(node, ctxMix, params, index),
      setValue:   (patch) => FlyweightArrayNode.writeAt(node, ctxMix, params, index, patch),
      getTooltip: inner.getTooltip
        ?? (() => FlyweightArrayNode.valueAt(node, ctxMix, params, index)?.tooltip ?? null),
    };
    ctxMix.abortPhase = true;
  }
}

function measureWord(ctx, text, font) {
  ctx.font = font;
  ctx.textBaseline = 'alphabetic'; // <-- Add this line to fix the offset

        },
      },
    };

class Camera {
  constructor() { this.ox = 0; this.oy = 0; this.z = 1; }
  toWorld(sx, sy)  { return { x: sx / this.z + this.ox, y: sy / this.z + this.oy }; }
  toScreen(wx, wy) { return { x: (wx - this.ox) * this.z, y: (wy - this.oy) * this.z }; }
  apply(ctx) { ctx.setTransform(this.z, 0, 0, this.z, -this.ox * this.z, -this.oy * this.z); }
  reset(ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); }
  pan(dsx, dsy) { this.ox -= dsx / this.z; this.oy -= dsy / this.z; }
  zoomAt(sx, sy, factor) {
    const wp = this.toWorld(sx, sy);
    this.z = Math.max(0.15, Math.min(5, this.z * factor));
    this.ox = wp.x - sx / this.z; this.oy = wp.y - sy / this.z;
  }
}


let THREE, OrbitControls;
async function loadThree() {
  if (THREE) return;
  try {
    THREE = await import('three');
    OrbitControls = (await import('three/addons/controls/OrbitControls.js')).OrbitControls;
  } catch(e) { console.warn('Three.js failed to load.'); }

function make3DPane(container) {
  if (!THREE) return null;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, container.clientWidth / Math.max(1, container.clientHeight), 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const view = { scene, camera, renderer, controls, container };

  view.ro = new ResizeObserver(() => {
    if (view.container.clientWidth > 0 && view.container.clientHeight > 0) {
      view.camera.aspect = view.container.clientWidth / view.container.clientHeight;
      view.camera.updateProjectionMatrix();
      view.renderer.setSize(view.container.clientWidth, view.container.clientHeight);
    }
  });
  view.ro.observe(container);

  return view;
}


class HudPanel {
  constructor({ title = 'Controls', container = document.body, controls = [], onChange, position = { top: 60, left: 12 } } = {}) {
    this._onChange = onChange || (() => {});
    this._inputs = {}; 
    this._valDisplays = {}; 
    this._injectStyles();

    this._root = document.createElement('div');
    this._root.className = 'hud-panel';
    this._root.style.top = position.top + 'px'; 
    this._root.style.left = position.left + 'px';

    const header = document.createElement('h3'); 
    header.innerHTML = `::: &nbsp; ${title}`;
    this._root.appendChild(header); 
    this._makeDraggable(header);

    for (const ctrl of controls) this._addControl(ctrl);
      container.appendChild(this._root);
  }

  destroy() {
    if (this._root.parentNode) {
      this._root.parentNode.removeChild(this._root);
    }
  }

  _addControl(ctrl) {
    if (ctrl.type === 'separator') this._addSeparator(ctrl);
    else if (ctrl.type === 'button')   this._addButton(ctrl);
    else if (ctrl.type === 'checkbox') this._addCheckbox(ctrl);
    else if (ctrl.type === 'select') this._addSelect(ctrl);
    else if (ctrl.type === 'color') this._addColor(ctrl);
    else this._addSlider(ctrl);
  }

  _addSlider(ctrl) {
    const { id, label, min = 0, max = 1, step = 0.01, value = min } = ctrl;
    const row = document.createElement('label'), span = document.createElement('span');
    span.textContent = label; row.appendChild(span);
    const input = document.createElement('input'); Object.assign(input, { type: 'range', min, max, step, value });
    row.appendChild(input);
    const val = document.createElement('span'); val.className = 'val'; val.textContent = parseFloat(value).toFixed(step % 1 === 0 ? 0 : 2);
    row.appendChild(val);
    input.addEventListener('input', () => {
      const v = parseFloat(input.value); val.textContent = v.toFixed(step % 1 === 0 ? 0 : 2);
      this._onChange(id, v);
    });
    this._inputs[id] = input; this._valDisplays[id] = val; this._root.appendChild(row);
  }

  _addButton(ctrl) {
    const btn = document.createElement('button'); btn.className = 'hud-btn' + (ctrl.cls ? ' ' + ctrl.cls : '');
    btn.textContent = ctrl.label; btn.addEventListener('click', ctrl.action || (() => {}));
    this._root.appendChild(btn);
  }

  _addCheckbox(ctrl) {
    const { id, label, value = false } = ctrl;
    const row = document.createElement('label'), span = document.createElement('span');
    span.textContent = label; row.appendChild(span);
    const sw = document.createElement('div'); sw.className = 'toggle-switch';
    const input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!value;
    input.addEventListener('change', () => this._onChange(id, input.checked));
    const slider = document.createElement('span'); slider.className = 'toggle-slider';
    sw.appendChild(input); sw.appendChild(slider); row.appendChild(sw);
    this._inputs[id] = input; this._root.appendChild(row);
  }

  _addSelect(ctrl) {
    const { id, label, options = [], value } = ctrl;
    const row = document.createElement('label'); const span = document.createElement('span');
    span.textContent = label; row.appendChild(span);
    const select = document.createElement('select');
    for (const opt of options) {
      const option = document.createElement('option');
      option.value = opt[0]; option.textContent = opt[1];
      if (opt[0] === String(value)) option.selected = true;
      select.appendChild(option);
    }
    select.addEventListener('change', () => this._onChange(id, select.value));
    row.appendChild(select); this._inputs[id] = select; this._root.appendChild(row);
  }  

  _addColor(ctrl) {
    const { id, label, value = '#ffffff' } = ctrl;
    const row = document.createElement('label'); const span = document.createElement('span');
    span.textContent = label; row.appendChild(span);
    const input = document.createElement('input'); Object.assign(input, { type: 'color', value });
    input.addEventListener('input', () => this._onChange(id, input.value));
    row.appendChild(input); this._inputs[id] = input; this._root.appendChild(row);
  }

  _addSeparator(ctrl) {
    const sep = document.createElement('div'); sep.className = 'separator';
    if (ctrl.label) sep.textContent = ctrl.label;
    this._root.appendChild(sep);
  }

  _makeDraggable(handle) {
    let isDragging = false, startX, startY, startLeft, startTop;
    handle.addEventListener('mousedown', e => {
      isDragging = true; handle.style.cursor = 'grabbing';
      startX = e.clientX; startY = e.clientY;

  }

    const s = document.createElement('style'); s.id = 'hud-panel-css';
    s.textContent = `

  .hud-panel h3:active { cursor: grabbing; }

  .hud-panel label > span:first-child { min-width: 90px; color: #999; }
  .hud-panel input[type=range] { flex: 1; accent-color: #6cf; cursor: pointer; }

    ctx.restore();
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;

    const v = ctxMix.getValue(ctxMix, node, params) || {};
    if (v.disabled) return;

    const p    = { ...BUTTON_DEFAULTS, ...params };
    const zoom = 1;

    const sc   = p.scale || 1;
    const rawW = v.width  || 64;
    const rawH = v.height || 64;
    const w    = rawW * zoom * sc;
    const h    = rawH * zoom * sc;
    const r    = Math.min((p.cornerRadius || 0) * zoom * sc, w / 2, h / 2);

    const screen = ButtonNode.getCentreXY(ctxMix, node, params);
    const sx   = screen.x;
    const sy   = screen.y + (p.liftY || 0) * zoom;
    const left = sx - w / 2;
    const top  = sy - h / 2;

    if (pt.x < left || pt.x > left + w ||
      pt.y < top  || pt.y > top  + h) return;

      const lx = pt.x - left;
    const ly = pt.y - top;
    if (lx < r && ly < r && (lx - r) ** 2 + (ly - r) ** 2 > r * r) return;
    if (lx > w - r && ly < r && (lx - (w - r)) ** 2 + (ly - r) ** 2 > r * r) return;
    if (lx < r && ly > h - r && (lx - r) ** 2 + (ly - (h - r)) ** 2 > r * r) return;
    if (lx > w - r && ly > h - r && (lx - (w - r)) ** 2 + (ly - (h - r)) ** 2 > r * r) return;

    const dxHit = pt.x - sx;
    const dyHit = pt.y - sy;

    ctxMix.hitResult = {
      node,
      interactions: {
        applyDrag(wx, wy) {
          Values.setValue(Values, node, params, { x: wx - dxHit, y: wy - dyHit });
          return node;
        },
      },
    };
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
DemoHarness2D — owns a 2D canvas pane: drawing, hit-testing, pan/zoom,
and control-value routing.

Changes from original:
- Seeds this.params from paneConfig.controls on construction so that
 control values (regionSet, showGrid, screenMode …) reach draw2d params
 immediately, not just after user interaction.
- applyControl(id, val, getValues) merges into params and redraws,
 fixing the bug where HUD controls displayed but had no effect on 2D.
- Adds getWH() to ctxMix (pane dims + camera state) so FrameNode's
 screenMode path works (it calls ctxMix.getWH(), distinct from getWH).
═══════════════════════════════════════════════════════════════════════════ */
//<< import { DemoHarness2D } from './demo-harness2-d.js';
//-- file: ./demo-harness2-d.js --
class DemoHarness2D {
  constructor(canvas, paneConfig, app) {
    this.canvas = canvas;
    this.rawCtx = canvas.getContext('2d', { willReadFrequently: true });
    this.app = app;
    this.paneConfig = paneConfig;
    paneConfig.harness = this;

// Every 2D model provides a sceneRoot wrapped in a pane-camera node
    this.node = paneConfig.sceneRoot;

// ── Seed params from model controls so draw2d gets them on first frame ──
    this.params = {};
    if (paneConfig.controls) {
      for (const c of paneConfig.controls) {
        if (c.id && c.value !== undefined) this.params[c.id] = c.value;
      }
    }

    this.dragHit = null;
    this.selectedHit = null;   // an opaque handle: only ever called, never inspected
    this.hoveredHit = null;

// Pan state
    this.isPanning = false;
    this.lastMouseX = 0;
    this.lastMouseY = 0;

    this._resize();
    ModelUtils.autoFitCamera(this.node, this.W, this.H);
    this._listen();
    this.draw();
    new ResizeObserver(() => { this._resize(); this.draw(); }).observe(canvas);
  }

/* ── control routing (called by App.handleHudChange) ───────────── */

  applyControl(id, val, getValues) {
    this.params[id] = val;
    if (this.paneConfig.onControl) {
      this.paneConfig.onControl(id, val, getValues, this.app);
    }
    this.draw();
  }

/* ── camera accessors ──────────────────────────────────────────── */

  get cam() { return (this.paneConfig.cameraNode || this.node).value; }

  _screenToWorldXXX(sx, sy) {
    const v = this.cam, z = v.zoom || 1;
    const cx = v.centerOrigin ? this.W / 2 : 0;
    const cy = v.centerOrigin ? this.H / 2 : 0;
    return { x: (sx - cx) / z + (v.scrollX || 0), y: (sy - cy) / z + (v.scrollY || 0) };
  }

/* ── sizing ────────────────────────────────────────────────────── */

  _resize() {
    this.dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.getBoundingClientRect();
    this.W = rect.width;
    this.H = rect.height;
    if (this.W === 0 || this.H === 0) return;
    this.canvas.width = rect.width * this.dpr;
    this.canvas.height = rect.height * this.dpr;
  }

/* ── ctxMix factory ────────────────────────────────────────────── */

  _ctxMix(hpScreen) {
    const cam = this.cam;
    return {
  // The value channel, taken whole.  A node that wants to rewrite what its
  // subtree reads overrides getValue here; nothing redefines it from scratch.
      ...Values,

      ctx: this.rawCtx,
      iterators: [],
      state: { index: 0, pass: 0, isHovered: false, isSelected: false },

  // Stable pane + camera info (never overwritten) — used by FrameNode screenMode
      getWH: () => ({
        W: this.W, H: this.H,
        Z: cam.zoom || 1,
        ox: cam.scrollX || 0,
        oy: cam.scrollY || 0,
      }),

      viewport: {
        x: cam.scrollX || 0, y: cam.scrollY || 0,
        w: this.W / (cam.zoom || 1), h: this.H / (cam.zoom || 1),
      },
      W: this.W,
      H: this.H,
      hitPoint: hpScreen || null,
      hitResult: null,
    };
  }

/* ── drawing ───────────────────────────────────────────────────── */

  draw() {
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => { this._raf = null; this.drawInRaf(); });
  }

  drawInRaf() {
    if (!this.W || !this.H) return;

// 1. Clear physical canvas
    this.rawCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.rawCtx.clearRect(0, 0, this.canvas.width, this.canvas.height);

// 2. Apply DPR base — PaneCameraNode multiplies zoom/scroll on top
    this.rawCtx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    /* Selection and hover live with the items themselves, reached through
       setValue, so nothing about them travels in params. */
    const ctxMix = this._ctxMix();
    sceneRegistry.walkPhase(ctxMix, 'layout', this.node, this.params);
    sceneRegistry.walkPhase(ctxMix, 'draw2d', this.node, this.params);
  }

/* ── hit-testing ───────────────────────────────────────────────── */

  hitTest(screenX, screenY) {
    const c = this._ctxMix({ x: screenX, y: screenY });
    sceneRegistry.walkPhase(c, 'hit_test', this.node, this.params);
    return c.hitResult;
  }

/* ── input listeners ───────────────────────────────────────────── */

  _listen() {
    const toL = e => {
      const r = this.canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top, ex: e.clientX, ey: e.clientY };
    };

// --- ZOOM ---
    this.canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const { x, y } = toL(e);
      const stripH = this.paneConfig.stockStripHeight || 0;
      if (stripH > 0 && y > this.H - stripH) return;
      const cam = this.cam;
      const oldZ = cam.zoom || 1;
      const newZ = Math.max(0.1, Math.min(10.0, oldZ * (e.deltaY > 0 ? 0.9 : 1.1)));
      const cx = cam.centerOrigin ? this.W / 2 : 0;
      const cy = cam.centerOrigin ? this.H / 2 : 0;
      cam.scrollX = (cam.scrollX || 0) + (x - cx) * (1 / oldZ - 1 / newZ);
      cam.scrollY = (cam.scrollY || 0) + (y - cy) * (1 / oldZ - 1 / newZ);
      cam.zoom = newZ;
      this.draw();
    }, { passive: false });

// --- MOUSE DOWN ---
    this.canvas.addEventListener('mousedown', e => {
      const { x, y, ex, ey } = toL(e);
      const stripH = this.paneConfig.stockStripHeight || 0;
      const overStrip = stripH > 0 && y > this.H - stripH;
      const hit = this.hitTest(x, y);

      // A node that can be dragged is selected singly; one that cannot —
      // a zone, a ring, a key — toggles, so a set can be built up.
      const access = hit ? Values.access(this._ctxMix(), hit, this.params) : null;

      /* Something draggable is selected singly; something only selectable —
         a ring, a key, a band — toggles, so a set can be built up. */
      const additive = e.shiftKey || e.metaKey || e.ctrlKey || (access && !access.draggable);

      if (!access) this.clearSelection();
      else if (!additive) { this.clearSelection(); access.setValue({ selected: true }); }
      else access.setValue({ selected: !access.getValue()?.selected });

      this.selectedHit = access?.getValue()?.selected ? hit : null;
      this.dragHit = hit;
      if (this.app?.selectNode) this.app.selectNode(this.selectedHit, this);

      if (!hit?.node && !overStrip) {
        this.isPanning = true;
        this.lastMouseX = e.clientX;
        this.lastMouseY = e.clientY;
        this.canvas.style.cursor = 'grabbing';
      }
      this.draw();
    });

// Selection lives with the items, so clearing it is a walk, not a set to empty.
    this.clearSelection = () => {
      const mix = this._ctxMix();
      sceneRegistry.walkPhase(mix, 'clear_selection', this.node, this.params);
      if (this.selectedHit) Values.access(mix, this.selectedHit, this.params).setValue({ selected: false });
      this.selectedHit = null;
    };

// --- MOUSE MOVE ---
    this.canvas.addEventListener('mousemove', e => {
      if (this.isPanning) {
        const cam = this.cam, z = cam.zoom || 1;
        cam.scrollX = (cam.scrollX || 0) - (e.clientX - this.lastMouseX) / z;
        cam.scrollY = (cam.scrollY || 0) - (e.clientY - this.lastMouseY) / z;
        this.lastMouseX = e.clientX;
        this.lastMouseY = e.clientY;
        this.draw();
        if (typeof hideTooltip !== 'undefined') hideTooltip();
        return;
      }

      const { x, y, ex, ey } = toL(e);

      if (this.dragHit) {
        if (this.dragHit.interactions?.applyDrag) {
      // Pass screen-local coords; PaneCameraNode's wrap converts
      // to the correct world space for whatever camera nesting exists.
          this.dragHit.interactions.applyDrag(x, y);
          this.draw();
        }
        return;
      }      

      const hit = this.hitTest(x, y);

      const mixNow = this._ctxMix();
      const prev = this.hoveredHit;
      if (prev && prev !== hit) Values.access(mixNow, prev, this.params).setValue({ hovered: false });

      const access = hit ? Values.access(mixNow, hit, this.params) : null;
      let changed = (prev == null) !== (hit == null);
      if (access) changed = access.setValue({ hovered: true }) || changed;
      this.hoveredHit = hit;
      if (changed) this.draw();

      const tip = access?.getTooltip();
      if (tip) showTooltip?.(ex, ey, { ...tip, selected: !!access.getValue()?.selected });
      else hideTooltip?.();

      this.canvas.style.cursor = access ? (access.draggable ? 'grab' : 'pointer') : 'default';
    });

// --- MOUSE UP ---

    this.canvas.addEventListener('mouseup', (e) => {
      if (this.dragHit) {
        if (this.dragHit.interactions?.endDrag) {
      // Detect if dropped over the stock-strip area
          const { y } = toL(e);
          const stripH = this.paneConfig.stockStripHeight || 0;
          const onStrip = stripH > 0 && y > this.H - stripH;
          this.dragHit.interactions.endDrag(onStrip);
        }
        this.dragHit = null;
        this.draw();
      }
      if (this.isPanning) {
        this.isPanning = false;
        this.canvas.style.cursor = this.hoveredHit ? 'pointer' : 'default';
      }
    });


// --- MOUSE LEAVE ---
    this.canvas.addEventListener('mouseleave', () => {
      if (this.hoveredHit) {
        Values.access(this._ctxMix(), this.hoveredHit, this.params).setValue({ hovered: false });
        this.hoveredHit = null;
        this.draw();
      }
      hideTooltip?.();
      if (this.dragHit) {
        if (this.dragHit.interactions?.endDrag) this.dragHit.interactions.endDrag(false);
        this.dragHit = null;
        this.draw();
      }
      this.isPanning = false;
      this.canvas.style.cursor = 'default';
    });
  }
}


/* ═══════════════════════════════════════════════════════════════════════════
DemoHarness3D — owns a 3D pane: init / re-attach, per-frame render,
resize, and control routing.

Extracted from the 3D branches previously scattered across
App.buildLayout, App.resize, and App.animate.
═══════════════════════════════════════════════════════════════════════════ */
//>> export { DemoHarness2D };
//-- endfile --


class App {
  constructor() {
    this.container = document.getElementById('container');
    this.paneEls = [];
    this.harnesses = [];
    this.hudState = {};

    MODELS.forEach((m, i) => {
      this.hudState['vis_' + i] = m.visible !== false;
      if (m.controls) {
        m.controls.forEach(c => {
          if (c.id && c.value !== undefined) this.hudState[c.id] = c.value;
        });
      }
    });

    this.activeModel = MODELS.find(m => (m.displayType || '2d') !== 'none' && m.visible !== false);
    this.buildHud();

    loadThree().then(() => {
      this.buildLayout();
      this.animate();
    });

    const handleResize = () => {
      if (this._resizeTimer) clearTimeout(this._resizeTimer);
      this._resizeTimer = setTimeout(() => this.resize(), 50);
    };
    new ResizeObserver(handleResize).observe(document.body);
    window.addEventListener('resize', handleResize);
  }

/* ── HUD ───────────────────────────────────────────────────────── */

  solo() {
    this._applyVisibility(
      MODELS.map(m => m === this.activeModel ?? 0),
      MODELS.map(m => m.visible !== false)
      );
  }

  unsolo() {
    this._applyVisibility(
      this._soloRestore ?? [], 
      null
      );
  }

  _applyVisibility(visibilities, saved) {
    MODELS.forEach((m, i) => this.hudState[`vis_${i}`] = m.visible = visibilities[i]);
    this._soloRestore = saved;
    this.buildHud();
    this.buildLayout();
  }

  buildHud() {
    let savedPosition = {
      top: parseInt(this?.hud?._root?.style?.top, 10) || 60,
      left: parseInt(this?.hud?._root?.style?.left, 10) || 12
    };
    this?.hud?.destroy?.();

    const controls = [];

    const dropdownModels = MODELS.filter(m => m.visible !== false);
    if (!dropdownModels.includes(this.activeModel) && dropdownModels.length > 0) {
      this.activeModel = dropdownModels[0];
    }

    if (dropdownModels.length > 0) {
      controls.push({ type: 'separator', label: 'Active Panel' });
      controls.push({
        type: 'select', id: 'activePanel', label: 'Controls For',
        options: dropdownModels.map(m => [
          String(MODELS.indexOf(m)),
          m.name?.split(/[.·]/)[0].trim() || 'Unnamed',
        ]),
        value: String(MODELS.indexOf(this.activeModel)),
      });
      controls.push(
      {
        type: 'button',
        label: this._soloRestore ? 'Unsolo' : 'Solo',
        action: () => this._soloRestore ? this.unsolo() : this.solo()
      }
      );

      controls.push(...(
        this.activeModel?.controls ?? 
        this.activeModel?.getControls?.(this) ?? 
        [])
      );
    }

    this.hud = new HudPanel({
      title: 'Zoned Elements',
      controls,
      position: savedPosition, 
      onChange: (id, val) => this.handleHudChange(id, val),
    });

    if (!this._selPanel) {
      this._selPanel = document.createElement('div');
      this._selPanel.className = 'hud-panel';
      this._selPanel.style.cssText = 'position:absolute; top:12px; right:12px; display:none; min-width:220px;';
      document.body.appendChild(this._selPanel);
    }
  }

/* ── selection ──────────────────────────────────────────────────── */

  selectNode(hit, harness) {
    this.selectedHit = hit;
    this.selectedNode = hit?.node ?? null;
    this.activeHarness = harness;
    this.updateSelectedPanel();
  }

  removeSelectedNode() {
    const node = this.selectedNode;
    if (!node) return;

    let params = {};
    const removeFrom = (parent) => {
      if (!parent.subtree) return false;
      const idx = parent.subtree.indexOf(node);
      if (idx >= 0) { Utils.removeChild(parent, node, params); return true; }
      for (const child of parent.subtree) {
        if (removeFrom(child)) return true;
      }
      return false;
    };

// Search the harness the node was selected from first,
// then fall back to all 2D non-zoned harnesses
    const candidates = this.activeHarness
    ? [this.activeHarness, ...this.harnesses.filter(h => h !== this.activeHarness)]
    : this.harnesses;

    for (const h of candidates) {
      if (!h.node)
        continue;
      params = h.params || {};
      if (removeFrom(h.node)) {
        this.selectedNode = null;
        this.selectedHit = null;
        this.activeHarness = null;
        this.updateSelectedPanel();
        h.selectedHit = null;
        h.hoveredHit = null;
        h.draw();
        return;
      }
    }
  }

  updateSelectedPanel() {
    const el = this._selPanel, node = this.selectedNode;
    const cls = node ? Utils.classOfNode(node) : null;
    const mixNow = this.activeHarness?._ctxMix();
    const shown = this.selectedHit && mixNow
      ? { ...node, value: Values.access(mixNow, this.selectedHit, this.activeHarness.params).getValue() }
      : node;
    const fields = cls?.meta?.editableFields?.(shown);
    if (!node ) { el.style.display = 'none'; return; }
//  if (!node || !fields || fields.length === 0) { el.style.display = 'none'; return; }
    el.style.display = 'block'; el.innerHTML = '';
    const header = document.createElement('h3');
    header.textContent = `SELECTED ${node.type.toUpperCase()}`;
    el.appendChild(header);

// Remove button
    const rmBtn = document.createElement('button');
    rmBtn.textContent = '✕ Remove Node';
    rmBtn.style.cssText = 'width:100%; margin:6px 0 4px; padding:5px 8px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.06); color:#999; border-radius:4px; letter-spacing:0.03em; transition:background 0.15s;';
    rmBtn.addEventListener('mouseenter', () => rmBtn.style.background = 'rgba(255,255,255,0.12)');
    rmBtn.addEventListener('mouseleave', () => rmBtn.style.background = 'rgba(255,255,255,0.06)');
    rmBtn.addEventListener('click', () => this.removeSelectedNode());
    el.appendChild(rmBtn);

    for (const f of fields ?? []) {
      const row = document.createElement('div'); row.className = 'sel-row';
      const span = document.createElement('span'); span.textContent = f.label; row.appendChild(span);
      const inp = document.createElement('input'); inp.type = f.type; inp.value = f.value;
      inp.addEventListener('input', () => {
        const v = f.type === 'number' ? Number(inp.value) : inp.value;
        // Through the interaction, so editing one item of a flyweight works
        // exactly as editing an ordinary node does.
        const mix = this.activeHarness?._ctxMix();
        const access = this.selectedHit && mix
          ? Values.access(mix, this.selectedHit, this.activeHarness.params) : null;
        if (access) access.setValue({ [f.key]: v });
        else node.value[f.key] = v;
        if (this.activeHarness) this.activeHarness.draw();
      });
      row.appendChild(inp); el.appendChild(row);
    }
  }


/* ── control dispatch ──────────────────────────────────────────── */

  handleHudChange(id, val) {
    this.hudState[id] = val;

    if (id === 'activePanel') {
      this.activeModel = MODELS[parseInt(val, 10)];
      this.buildHud();
    } else if (id.startsWith('vis_')) {
      const mIdx = parseInt(id.split('_')[1], 10);
      if (MODELS[mIdx]) MODELS[mIdx].visible = val;
    } else {
  // Route to the active model's harness — works for both 2D and 3D
      const harness = this.harnesses.find(h => h.paneConfig === this.activeModel);
      if (harness) {
        harness.applyControl(id, val, () => this.hudState);
      }
    }
  }

/* ── grid layout ───────────────────────────────────────────────── */

  bestGrid(n) {
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contW = Math.max(1, window.innerWidth);
    const contH = Math.max(1, window.innerHeight - headerH - 1);
    let bestCols = 1, bestScore = Infinity;
    for (let c = 1; c <= n; c++) {
      const r = Math.ceil(n / c), aspect = (contW / c) / (contH / r);
      const score = Math.abs(Math.log(aspect)) + (n - c * r !== 0 ? 0.3 : 0);
      if (score < bestScore) { bestScore = score; bestCols = c; }
    }
    return { cols: bestCols, rows: Math.ceil(n / bestCols) };
  }

/* ── build panes ───────────────────────────────────────────────── */

  buildLayout() {
    this.container.innerHTML = '';
    this.paneEls.length = 0;
    this.harnesses.length = 0;

    const visibleModels = MODELS.filter(p => (p.visible !== false) && (p.displayType || '2d') !== 'none');
    const N = visibleModels.length;
    document.getElementById('pane-count').textContent = `${N} of ${MODELS.length - 1} panels`;

    if (N === 0) { this.container.style.background = '#111210'; return; }

    const grid = this.bestGrid(N);
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contH = Math.max(1, window.innerHeight - headerH - 1);

    for (const pane of visibleModels) {
      const i = MODELS.indexOf(pane);
      const type = pane.displayType || '2d';
      const div = document.createElement('div');
      div.className = 'pane' + (type === '3d' ? ' pane-3d' : '');
      div.style.flexBasis = `calc(${100 / grid.cols}% - 1px)`;
      div.style.height = `${contH / grid.rows}px`;
      div.style.minWidth = '0';
      if (pane.background) div.style.background = pane.background;
      div.dataset.paneIndex = i;

      /* Clicking a pane's title makes it the active panel and solos it;
         clicking again restores the others. */
      const soloOnClick = (el) => {
        el.title = 'Click to solo this panel';
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (this._soloRestore) { this.unsolo(); return; }
          this.activeModel = pane;
          this.hudState.activePanel = String(i);
          this.solo();
        });
      };

      if (type === '2d') {
        const label = document.createElement('div');
        label.className = 'label'; label.textContent = pane.name;
        soloOnClick(label);
        div.appendChild(label);
        const canvas = document.createElement('canvas');
        div.appendChild(canvas);
        this.container.appendChild(div);

        if (pane.sceneRoot) {
          const harness = new DemoHarness2D(canvas, pane, this);
          canvas.harness = harness;
          this.harnesses.push(harness);
        }
      } else if (type === '3d') {
        const title = document.createElement('div');
        title.className = 'pane-title-3d'; title.textContent = pane.name;
        soloOnClick(title);
        div.appendChild(title);
        this.container.appendChild(div);

        const harness = new DemoHarness3D(div, pane, this);
        if (harness.view) this.harnesses.push(harness);
      }

      this.paneEls[i] = div;
    }
  }

/* ── resize ────────────────────────────────────────────────────── */

  resize() {
    const visibleModels = MODELS.filter(p => p.visible && (p.displayType || '2d') !== 'none');
    const N = visibleModels.length;
    if (!N) return;

    const grid = this.bestGrid(N);
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contH = Math.max(1, window.innerHeight - headerH - 1);

// Adjust div sizes — individual harness ResizeObservers handle the rest
    for (const pane of visibleModels) {
      const i = MODELS.indexOf(pane);
      const el = this.paneEls[i];
      if (!el)
        continue;
      el.style.flexBasis = `calc(${100 / grid.cols}% - 1px)`;
      el.style.height = `${contH / grid.rows}px`;
    }
  }

/* ── render loop ───────────────────────────────────────────────── */

  animate() {
    requestAnimationFrame(() => this.animate());
    for (const h of this.harnesses) {
      if (h.animate) h.animate();
    }
  }
}

new App();

</script>
