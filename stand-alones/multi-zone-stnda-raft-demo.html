<script type="module">
const R = 30;
const P = { 
  opacity: 80, edgeWidth: 5, edgeOutline: 1.5, edgeBend: 0, 
  showChartBounds: false, screenMode: false,
  colors: { 4: { fill: '#c08428', stroke: '#9a6a1e' } }, 
};

const MODELS = []
const STOCK = []  
const CONTROLS = []

let _nodeId = 0;
function makeNode(type, value, subtree) {
  return { type, value: { ...value, id: ++_nodeId }, subtree: subtree || [] };
}
function cloneProto(proto, overrides) {
  const { id: _, ...rest } = proto.value;
  return makeNode(proto.type, { ...rest, ...overrides });
}

//<< import { Geo } from './geo.js';
//-- file: ./geo.js --
//>> export { Geo };
class Geo {

  static norm(a) { return ((a % Geo.TAU) + Geo.TAU + Geo.PI) % Geo.TAU - Geo.PI; }
  static adiff(a, b) { return Math.abs(Geo.norm(a - b)); }
  static dist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
  static dist2(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }
  static pipsOpposite(a, b) { return Geo.adiff(a, b) > Geo.PI * 0.85; }

  static verts(n, cx, cy, r, tilt) {
    const v = [];
    for (let i = 0; i < n; i++) {
      const a = tilt + (i * Geo.TAU) / n - Geo.PI;
      v.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
    }
    return v;
  }

  static pips(n, cx, cy, r, tilt) {
    const vs = Geo.verts(n, cx, cy, r, tilt);
    const p = [];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const mx = (vs[i].x + vs[j].x) / 2;
      const my = (vs[i].y + vs[j].y) / 2;
      p.push({ x: mx, y: my, out: Math.atan2(my - cy, mx - cx) });
    }
    return p;
  }

  static ptInPoly(px, py, vs) {
    let ins = false;
    for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
      if ((vs[i].y > py) !== (vs[j].y > py) &&
        px < (vs[j].x - vs[i].x) * (py - vs[i].y) / (vs[j].y - vs[i].y) + vs[i].x)
        ins = !ins;
    }
    return ins;
  }
}
//-- endfile --

// Essential core defs of Geo.
if (typeof Geo === 'undefined') {
  window.Geo = class {}; 
}

Geo.PI = Math.PI;
Geo.TAU = Math.PI * 2;


//<< import { Values } from './values.js';
//-- file: ./values.js --
//>> export { Values };

/* ─────────────────────────────────────────────────────────────────────────────
Values — the one channel through which anything reads or writes a node, and
the identity resolver: the answer when there is no context to ask.

  getValue(res, node, params)         -> the node's value
  setValue(res, node, params, patch)  -> true if anything changed
  getNode (res, node, params)         -> the node itself, or its stand-in

A *resolver* is anything answering those three.  A ctxMix is one, because the
pane spreads Values into it and may override a member; Values itself is the
other, for callers that are not inside a walk at all — the pip manager, the
controllers, a model building its scene.  So a geometry method is called
`fn(ctxMix, node, params)` inside a walk and `fn(Values, node, params)`
outside one, and never has to ask which it got.

A leaf asks for its value and gets everything: its data, its tooltip, whether
it is selected.  It never learns whether it is one node or one of a thousand,
nor whether an ancestor is rewriting what it reads.

Ephemeral keys are routed to node.state, so a universal write channel does not
become the way ephemera creeps back into value.  That rule lives here alone.

A note on the read discipline.  getValue may return a *copy* — it does so as
soon as a node carries ephemera.  So a value is for reading; to write, call
setValue.  A drag closure that captured `v` and assigned to `v.x` would work
until the node was first selected, and then quietly stop.
──────────────────────────────────────────────────────────────────────────── */
const EPHEMERAL = new Set(['selected', 'hovered']);

/* A plain node's value, with its ephemera folded in — but only when there
   is any, so the common case allocates nothing. */
function plainValue(node) {
  const s = node?.state;
  if (!s || (s.selected === undefined && s.hovered === undefined)) return node?.value;
  return { ...node.value, selected: s.selected, hovered: s.hovered };
}

function applyPlain(node, patch) {
  if (!node) return false;
  let changed = false;
  for (const key of Object.keys(patch)) {
    const target = EPHEMERAL.has(key) ? (node.state ||= {}) : node.value;
    if (target[key] === patch[key]) continue;
    target[key] = patch[key];
    changed = true;
  }
  return changed;
}

/* An object literal rather than a class: its members must be enumerable, so
   that a ctxMix is built by spreading these and overriding what it means to
   change.  A class's statics are not, which is how the pane came to carry a
   second copy of getValue that had drifted from this one. */
const Values = Object.freeze({

  getValue(res, node, params) {
    if (node?.flyFn) return node.flyFn(res, node, params);
    return plainValue(node);
  },

  setValue(res, node, params, patch) {
    if (node?.setFn) return node.setFn(res, node, params, patch);
    return applyPlain(node, patch);
  },

  getNode(res, node, params) {
    return node?.nodeFn ? node.nodeFn(res, node, params) : node;
  },

  plain: plainValue,
  applyPlain,

  /* Everything the app may do with a hit, whether it landed on an ordinary
     node or on one item of a flyweight.  The app calls these and nothing
     else — it never reaches into hit.node. */
  access(res, hit, params) {
    const i = hit?.interactions || {}, node = hit?.node;
    return {
      node,
      applyDrag:  i.applyDrag,
      endDrag:    i.endDrag,
      draggable:  !!i.applyDrag,
      getValue:   i.getValue   ?? (() => Values.getValue(res, node, params)),
      setValue:   i.setValue   ?? (patch => Values.setValue(res, node, params, patch)),
      getTooltip: i.getTooltip ?? (() => Values.getValue(res, node, params)?.tooltip ?? null),
    };
  },
});
//-- endfile --

//<< import { PipKinds } from './pip-kind.js';
//-- file: ./pip-kind.js --
//>> export { PipKinds };

/* ─────────────────────────────────────────────────────────────────────────────
PipKinds — frozen capability records describing what a pip may do.

A kind record is never mutated in place.  To change a pip's capabilities at
run time, swap in a different frozen record.

A node class declares a uniform kind in meta.pipKind, or answers per pip with
a static getPipKinds(node) returning one record per pip — so a node may in
future anchor one pip and follow another (an 'in pip' and an 'out pip').

  anchors  the pip's position derives from the node's own geometry: it drives
  follows  the pip's position may be driven by another pip: it can be set
  splits   landing on an edge divides that edge in two
  absorbs  the pip may be dissolved when it is only a pass-through

PipSetManager owns the vocabulary of questions; node classes only answer.
Adding a question here does not disturb classes that never ask it.
──────────────────────────────────────────────────────────────────────────── */
const PipKinds = {
  TILE:     Object.freeze({ name: 'tile',     anchors: true,  follows: false, splits: false, absorbs: false }),
  EDGE_END: Object.freeze({ name: 'edge-end', anchors: false, follows: true,  splits: false, absorbs: false }),
  JUNCTION: Object.freeze({
    name: 'junction', anchors: false, follows: true, splits: true, absorbs: true,
    // A junction is a point.  Classes that want no more than that need not
    // implement getPips/setPipPos at all — the kind answers for them.
    getPips: (res, node, params) => {
      const v = res.getValue(res, node, params) || {};
      return [{ x: v.x || 0, y: v.y || 0, out: 0 }];
    },
    setPipPos: (res, node, params) => {
      res.setValue(res, node, params, { x: params.x, y: params.y });
    },
  }),
};

/* Pip geometry reads through the value channel, so a caller outside a walk
   passes Values and a caller inside one passes its ctxMix.  Both answer
   getValue/setValue; nothing else is required of a resolver. */
//-- endfile --

//<< import { PipSetManager } from './pip-set-manager.js';
//-- file: ./pip-set-manager.js --
//>> export { PipSetManager };

/* ─────────────────────────────────────────────────────────────────────────────
PipSetManager — owns the pip sets of one arena, and the rules they obey.

A pip set is a dumb array of entries { node, pip }: pips that are coincident
in space.  It needs no class of its own.  The manager holds the collection and
the configured constraints.

Bidirectional without identifiers
  pip -> set   node.state.pipSets[pipIndex]  — a direct reference, or null
  set -> pips  the array itself, holding real node references

A pip belongs to at most one set, so the back-reference is a slot, not a list.
Sets are mutated in place and never recreated, so held references stay valid;
only a merge repoints slots, and only for the absorbed set's members.

There are no run-time ids.  Ids exist at rest: a scene is loaded from
{ a, pipA, b, pipB } specs and projected back out again at save time.  The
identifiers are like BASIC line numbers — structure survives the round trip,
the numbers need not.

Configured constraints (held in inst, not value — they persist with the
program, not with the model)
  maxTilePips  2 permits rafting, 1 forbids it outright
  exclusive    a set holding two tile pips admits nothing further
  abutment     joining tile pips must face oppositely
──────────────────────────────────────────────────────────────────────────── */
class PipSetManager {
  static SNAP_DIST = 12;

  constructor(rules = {}) {
    this.maxTilePips = rules.maxTilePips ?? 2;
    this.snapDist    = rules.snapDist ?? PipSetManager.SNAP_DIST;
    this.sets        = [];
  }

  // ── pip access ───────────────────────────────────────────────────

  pipsOf(node, params) {
    const fn = Utils.pipsFn(node);
    return fn ? fn(Values, node, params) : [];
  }

  posOf(ref, params) { return this.pipsOf(ref.node, params)[ref.pip] || null; }

  kindAt(node, pip) {
    const cls = Utils.classOfNode(node);
    const kinds = cls?.getPipKinds?.(node);
    return kinds?.[pip] || cls?.meta?.pipKind || PipKinds.TILE;
  }

  kindOf(ref) { return this.kindAt(ref.node, ref.pip); }

  // Does every pip of this node follow?  (An edge or a junction, not a tile.)
  isFollower(node) {
    if (!Utils.pipsFn(node)) return false;
    const n = this.pipsOf(node, {}).length;
    if (n === 0) return false;
    for (let i = 0; i < n; i++)
      if (!this.kindAt(node, i).follows) return false;
    return true;
  }

  // A follower that is not a junction: a plain edge.
  isEdge(node) {
    if (!this.isFollower(node)) return false;
    const n = this.pipsOf(node, {}).length;
    for (let i = 0; i < n; i++)
      if (this.kindAt(node, i).splits) return false;
    return true;
  }

  isJunction(node) {
    const n = this.pipsOf(node, {}).length;
    for (let i = 0; i < n; i++)
      if (this.kindAt(node, i).splits) return true;
    return false;
  }

  // ── set membership ───────────────────────────────────────────────

  slots(node) {
    const state = (node.state ||= {});
    return (state.pipSets ||= []);
  }

  setFor(node, pip) { return this.slots(node)[pip] || null; }

  // Every occupied slot of a node, as { set, entry }.
  entriesOf(node) {
    const out = [], slots = this.slots(node);
    for (let pip = 0; pip < slots.length; pip++) {
      const set = slots[pip];
      if (set) out.push({ set, entry: { node, pip } });
    }
    return out;
  }

  has(ref) { return this.setFor(ref.node, ref.pip) != null; }

  same(a, b) {
    const sa = this.setFor(a.node, a.pip);
    return sa != null && sa === this.setFor(b.node, b.pip);
  }

  tileCount(members) {
    let n = 0;
    for (const e of members)
      if (this.kindAt(e.node, e.pip).anchors) n++;
    return n;
  }

  // ── constraints ──────────────────────────────────────────────────

  _abut(a, b, params) {
    const pa = this.posOf(a, params), pb = this.posOf(b, params);
    return !!(pa && pb && Geo.pipsOpposite(pa.out, pb.out));
  }

  /* The single predicate that replaces pipUsed / pipUsedDirect /
     _pipCanConnect / the opposite-facing test. */
  canJoin(a, b, params) {
    if (a.node === b.node && a.pip === b.pip) return false;
    if (this.same(a, b)) return false;

    const sa = this.setFor(a.node, a.pip), sb = this.setFor(b.node, b.pip);

    // A tile pip is single-use: once it is in a set it takes no further joins.
    if (this.kindOf(a).anchors && sa) return false;
    if (this.kindOf(b).anchors && sb) return false;

    const members = [...(sa || [a]), ...(sb || [b])];
    const tiles = this.tileCount(members);
    if (tiles > this.maxTilePips) return false;

    if (tiles === 2) {
      // A tile-to-tile join is exclusive — neither side may bring anything else.
      if (members.length > 2) return false;
      if (!this._abut(a, b, params)) return false;
    }
    return true;
  }

  /* A tile pip already carrying followers is not blocked: a tile-to-tile
     join outranks them, and they are squeezed out to make room.  A pip held
     by another tile is not squeezable — that join is already exclusive. */
  squeezable(ref) {
    if (!this.kindOf(ref).anchors) return false;
    const set = this.setFor(ref.node, ref.pip);
    if (!set) return false;
    return !set.some(e => e.node !== ref.node && this.kindAt(e.node, e.pip).anchors);
  }

  /* Whether two tile pips may abut, ignoring followers that would give way.
     Callers must free the pips (freeForTileJoin) before calling join. */
  canTileJoin(a, b, params) {
    if (a.node === b.node && a.pip === b.pip) return false;
    if (this.same(a, b)) return false;
    if (this.maxTilePips < 2) return false;
    if (!this.kindOf(a).anchors || !this.kindOf(b).anchors) return false;
    if (this.has(a) && !this.squeezable(a)) return false;
    if (this.has(b) && !this.squeezable(b)) return false;
    return this._abut(a, b, params);
  }

  // Release a tile pip from whatever followers are holding it.
  freeForTileJoin(ref) {
    if (this.squeezable(ref)) this.disjoin(ref.node, ref.pip);
  }

  // ── joining and parting ──────────────────────────────────────────

  join(a, b, params) {
    if (!this.canJoin(a, b, params)) return null;

    const sa = this.setFor(a.node, a.pip), sb = this.setFor(b.node, b.pip);
    if (sa && sb) return this._merge(sa, sb);
    if (sa) return this._insert(sa, b);
    if (sb) return this._insert(sb, a);

    const set = [{ node: a.node, pip: a.pip }, { node: b.node, pip: b.pip }];
    this.slots(a.node)[a.pip] = set;
    this.slots(b.node)[b.pip] = set;
    this.sets.push(set);
    return set;
  }

  _insert(set, ref) {
    set.push({ node: ref.node, pip: ref.pip });
    this.slots(ref.node)[ref.pip] = set;
    return set;
  }

  // Mutate `into` in place so references held elsewhere stay valid.
  _merge(into, from) {
    for (const e of from) {
      into.push(e);
      this.slots(e.node)[e.pip] = into;
    }
    from.length = 0;
    const i = this.sets.indexOf(from);
    if (i >= 0) this.sets.splice(i, 1);
    return into;
  }

  disjoin(node, pip) {
    const set = this.setFor(node, pip);
    if (!set) return;
    this.slots(node)[pip] = null;
    const i = set.findIndex(e => e.node === node && e.pip === pip);
    if (i >= 0) set.splice(i, 1);
    this._prune(set);
  }

  // Drop a whole set, freeing every member's slot.
  drop(set) {
    for (const e of set) this.slots(e.node)[e.pip] = null;
    set.length = 0;
    const i = this.sets.indexOf(set);
    if (i >= 0) this.sets.splice(i, 1);
  }

  _prune(set) {
    if (set.length >= 2) return;
    this.drop(set);
  }

  removeNode(node) {
    for (const { set, entry } of this.entriesOf(node)) {
      this.slots(node)[entry.pip] = null;
      const i = set.findIndex(e => e.node === node);
      if (i >= 0) set.splice(i, 1);
      this._prune(set);
    }
    this.slots(node).length = 0;
  }

  // Remove every member of `set` that is not a follower, keeping the
  // followers grouped.  Used when a cluster is dragged off its tiles.
  detachTiles(set) {
    for (let i = set.length - 1; i >= 0; i--) {
      const e = set[i];
      if (this.kindAt(e.node, e.pip).follows) continue;
      this.slots(e.node)[e.pip] = null;
      set.splice(i, 1);
    }
    this._prune(set);
  }

  // ── traversal ────────────────────────────────────────────────────

  /* One walk, parameterised by a membership predicate.  This replaces
     component / _directComponent / _expandGroupWithEdges' inner walk.
     Returns a Set of nodes — not ids. */
  walk(startNode, via = () => true) {
    const seen = new Set([startNode]), queue = [startNode];
    while (queue.length) {
      const cur = queue.shift();
      for (const { set, entry } of this.entriesOf(cur)) {
        for (const other of set) {
          if (other.node === cur) continue;
          if (seen.has(other.node)) continue;
          if (!via(other, entry, set)) continue;
          seen.add(other.node);
          queue.push(other.node);
        }
      }
    }
    return seen;
  }

  // Everything reachable, edges included.
  component(node) { return this.walk(node); }

  // Tiles reachable through tile-to-tile joins only: the raft.
  raft(node) { return this.walk(node, other => this.kindOf(other).anchors); }

  /* A cluster of coincident follower pips is now simply the set itself —
     coalescing already put them in one array, so no walk is needed. */
  followerCluster(node, pip) {
    const set = this.setFor(node, pip);
    if (!set) return [{ node, pip }];
    return set.filter(e => this.kindAt(e.node, e.pip).follows);
  }

  // ── queries ──────────────────────────────────────────────────────

  /* The single nearest-pip scan.  Replaces _findNearestPip, the inner loop
     of connectFreeEdgePips, and the candidate half of SnapEngine._findPairs. */
  nearest(subtree, pos, params, opts = {}) {
    const maxDist = opts.maxDist ?? this.snapDist;
    const skip    = opts.skip ?? (() => false);
    const accept  = opts.accept ?? (() => true);

    let best = null, bestD = maxDist;
    for (const node of subtree) {
      const pips = this.pipsOf(node, params);
      for (let pip = 0; pip < pips.length; pip++) {
        const ref = { node, pip };
        if (skip(ref, pips[pip])) continue;
        if (!accept(ref, pips[pip])) continue;
        const d = Math.hypot(pos.x - pips[pip].x, pos.y - pips[pip].y);
        if (d < bestD) { bestD = d; best = ref; }
      }
    }
    return best;
  }

  // Every free pip of the given nodes, as { ref, pos }.
  freePips(nodes, params, accept = () => true) {
    const out = [];
    for (const node of nodes) {
      const pips = this.pipsOf(node, params);
      for (let pip = 0; pip < pips.length; pip++) {
        const ref = { node, pip };
        if (!accept(ref, pips[pip])) continue;
        out.push({ ref, pos: pips[pip] });
      }
    }
    return out;
  }

  // ── strain ───────────────────────────────────────────────────────
  // Only exclusive tile-to-tile sets break under strain; nexuses are
  // maintained by layout and simply follow.
  breakStrained(maxDist, params) {
    for (let i = this.sets.length - 1; i >= 0; i--) {
      const set = this.sets[i];
      if (set.length !== 2) continue;
      if (this.tileCount(set) !== 2) continue;
      const pa = this.posOf(set[0], params), pb = this.posOf(set[1], params);
      if (!pa || !pb) { this.drop(set); continue; }
      if (Geo.dist(pa, pb) > maxDist) this.drop(set);
    }
  }

  // ── ids at rest ──────────────────────────────────────────────────

  /* Build sets from id-based specs.  Accepts the pair form the models and
     the PEG parser emit, { a, pipA, b, pipB }, and the older array form
     [{ id, pip }, ...].  Ids are resolved to references and then discarded. */
  resolve(subtree, specs, params) {
    if (!specs || !specs.length) return;
    const byId = new Map(subtree.map(n => [n.value.id, n]));
    const ref = (id, pip) => {
      const node = byId.get(id);
      return node ? { node, pip } : null;
    };
    for (const spec of specs) {
      if (Array.isArray(spec)) {
        const first = ref(spec[0]?.id, spec[0]?.pip);
        if (!first) continue;
        for (let i = 1; i < spec.length; i++) {
          const other = ref(spec[i].id, spec[i].pip);
          if (other) this.join(first, other, params);
        }
        continue;
      }
      const a = ref(spec.a, spec.pipA), b = ref(spec.b, spec.pipB);
      if (a && b) this.join(a, b, params);
    }
  }

  /* Project fresh ids back out.  The identifiers are generated here and are
     not the ones the scene was loaded with. */
  toSpecs(subtree) {
    const idOf = new Map(subtree.map((n, i) => [n, i]));
    return this.sets
      .filter(set => set.length >= 2)
      .map(set => set
        .filter(e => idOf.has(e.node))
        .map(e => ({ id: idOf.get(e.node), pip: e.pip })));
  }
}

//<< import { ConeEngine } from './cone-engine.js';
//-- file: ./cone-engine.js --
//>> export { ConeEngine };
class ConeEngine {

  static computeCone(n, tilt, angle) {
    const step = Geo.PI / n;
    const offsetAngle = angle - (tilt - Geo.PI);
    const index = Math.round(offsetAngle / step);
    const center = Geo.norm(tilt - Geo.PI + index * step);
    const isCorner = index % 2 === 0;

    return {
      centerAngle: center,
      halfSpan: isCorner ? step : Geo.TAU / n,
    };
  }

  // Which connected nodes lie inside the fracture cone, measured from the
  // dragged node's position at the moment the drag began.
  static walkGroup(mgr, dragNode, cone) {
    const origin = dragNode.state?.dragOrigin;
    if (!origin) return new Set([dragNode]);

    return mgr.walk(dragNode, (other) => {
      const at = other.node.state?.dragOrigin;
      if (!at) return false;
      const angle = Math.atan2(at.y - origin.y, at.x - origin.x);
      return Geo.adiff(cone.centerAngle, angle) <= cone.halfSpan + 0.01;
    });
  }
}
//-- endfile --

//<< import { SnapEngine } from './snap-engine.js';
//-- file: ./snap-engine.js --
//>> export { SnapEngine };

/* ─────────────────────────────────────────────────────────────────────────────
SnapEngine — ranks admissible tile-to-tile joins by distance, and applies them.

Every question about whether a join is legal now belongs to PipSetManager:
this class only asks canJoin and sorts what comes back.  Whether a build
permits rafting at all is a manager rule (maxTilePips), not a test here.
──────────────────────────────────────────────────────────────────────────── */
class SnapEngine {

  // Candidate joins between the moving group and everything else.
  static find(mgr, subtree, group, maxDist, params) {
    const moving = [], resting = [];
    for (const node of subtree)
      (group.has(node) ? moving : resting).push(node);

    const free = nodes => mgr.freePips(nodes, params, ref => mgr.kindOf(ref).anchors);
    const movingPips = free(moving), restingPips = free(resting);

    const pairs = [];
    for (const m of movingPips) {
      for (const r of restingPips) {
        if (!mgr.canTileJoin(m.ref, r.ref, params)) continue;
        const dist = Geo.dist(m.pos, r.pos);
        if (dist >= maxDist) continue;
        pairs.push({
          from: m.ref, to: r.ref,
          dx: r.pos.x - m.pos.x,
          dy: r.pos.y - m.pos.y,
          dist,
        });
      }
    }
    return pairs.sort((a, b) => a.dist - b.dist);
  }

  static _connect(mgr, arena, pair, params) {
    // Anything occupying either pip must give way before tiles may abut:
    // controllers reap what they own, then any survivor is released.
    PipperNode.notify(arena, 'clearForTileJoin', arena, [pair.from, pair.to], params);
    mgr.freeForTileJoin(pair.from);
    mgr.freeForTileJoin(pair.to);
    mgr.join(pair.from, pair.to, params);
  }

  static apply(mgr, arena, subtree, group, snapDist, params) {
    const candidates = SnapEngine.find(mgr, subtree, group, snapDist, params);
    if (!candidates.length) return false;

    const primary = candidates[0];
    for (const node of group)
      Utils.moveBy(node, primary.dx, primary.dy);

    SnapEngine._connect(mgr, arena, primary, params);

    /* Whatever else came into exact alignment as a result now joins too.
       Bounded: if canTileJoin ever admits a pair that join then refuses, an
       unbounded loop would spin forever rather than merely misbehave. */
    let again = true, guard = subtree.length + 8;
    while (again && guard-- > 0) {
      again = false;
      for (const pair of SnapEngine.find(mgr, subtree, group, 2, params)) {
        if (!mgr.canTileJoin(pair.from, pair.to, params)) continue;
        const before = mgr.sets.length;
        SnapEngine._connect(mgr, arena, pair, params);
        if (mgr.sets.length !== before || mgr.same(pair.from, pair.to)) again = true;
      }
    }
    return true;
  }
}

class SubtreeIterator {
  constructor() { this.index = 0; }
  next(subtree) {
    if (this.index >= subtree.length) return null;
    return subtree[this.index++];
  }
}

//<< import { SceneRegistry } from './scene-registry.js';
//-- file: ./scene-registry.js --
//>> export { SceneRegistry };
class SceneRegistry {
  constructor() {
    this.handlers = {};
    this.meta = {};
  }

  hasCtxMix(fn, name) {
    const fnStr = fn.toString().trim();
    const codeOnly = fnStr.replace(/\/\*[\s\S]*?\*\/|\/\/.*/g, '');
    const match = codeOnly.match(/^[^(]*\(\s*([^,)\s]+)/);
    let firstParam = '';
    if (match) firstParam = match[1];
    else {
      const arrowMatch = codeOnly.match(/^([^=()\s]+)\s*=>/);
      if (arrowMatch) firstParam = arrowMatch[1];
    }
    return firstParam === 'ctxMix';
  }

  _hasHandler(nodeType, name) { return !!this.handlers[nodeType]?.[name]; }

  registerNodeClass(nodeType, nodeClass, defaultParams=null) {
    const proto = nodeClass.prototype;
    for (let cls = nodeClass; cls && cls !== Function.prototype; cls = Object.getPrototypeOf(cls)) {
      for (const name of Object.getOwnPropertyNames(cls)) {
        if (['length', 'name', 'prototype'].includes(name))
          continue;
        const method = cls[name];
        if (typeof method !== 'function')
          continue;
        if (this.hasCtxMix(method, name)) {
          if (!this._hasHandler?.(nodeType, name)) {
            this._registerHandler(nodeType, name, (ctxMix, node, params, child) => {
              return nodeClass[name](ctxMix, node, params, child);
            });
          }
        }
      }
    }
    this.meta[nodeType] = { nodeClass, defaultParams, ...(nodeClass.meta || {}) };
  }

  _registerHandler(nodeType, phase, handler) {
    if (!this.handlers[phase]) this.handlers[phase] = {};
    this.handlers[phase][nodeType] = handler;
  }

  dispatch(ctxMix, phase, node, params, child) {
    const phaseHandlers = this.handlers[phase];
    if (!phaseHandlers) return;
    const meta = this.meta[node.type];
    const mergedParams = meta?.defaultParams ? { ...meta.defaultParams, ...params } : params;
    const handler = phaseHandlers[node.type] || phaseHandlers['default'];
    if (handler) return handler(ctxMix, node, mergedParams, child);
  }

  hasPhase(nodeType, phase) { return !!this.handlers[phase]?.[nodeType]; }

  walkPhase(ctxMix, phase, node, params) {
    if (!node) return;

    if (!node?.subtree || node?.subtree?.length === 0) {
      this.dispatch(ctxMix, phase, node, params);
      return;
    }

    if (!ctxMix.iterators) ctxMix.iterators = [];
    ctxMix.iterators.push(new SubtreeIterator());

    this.dispatch(ctxMix, 'before_' + phase, node, params);

    let child;
    while ((child = ctxMix.iterators.at(-1).next(node.subtree)) !== null) {
      if (ctxMix.abortPhase) break; 

      this.dispatch(ctxMix, 'before_child_' + phase, node, params, child);
      if (ctxMix.abortPhase) break; 

      this.walkPhase(ctxMix, phase, child, params);
      if (ctxMix.abortPhase) break; 

      this.dispatch(ctxMix, 'after_child_' + phase, node, params, child);
      if (ctxMix.abortPhase) break;
    }
    ctxMix.abortPhase = false;

    this.dispatch(ctxMix, 'after_' + phase, node, params);
    ctxMix.iterators.pop();
  }
}

let sceneRegistry = new SceneRegistry();

//<< import { Utils } from './utils.js';
//-- file: ./utils.js --
//>> export { Utils };
class Utils {
  static classOfNode(node) {
    if (!node) return null;
    return sceneRegistry.meta[node.type]?.nodeClass || null;
  }
  static hasAffordance(node, phaseName) {
    return node && sceneRegistry.hasPhase(node.type, phaseName);
  }

  /* Pip affordances may come from the class or, failing that, from its
     declared pip kind — so a decorative node becomes draggable-by-edge
     merely by declaring itself a junction. */
  static pipsFn(node) {
    const cls = Utils.classOfNode(node);
    return cls?.getPips ?? cls?.meta?.pipKind?.getPips ?? null;
  }

  static setPipFn(node) {
    const cls = Utils.classOfNode(node);
    return cls?.setPipPos ?? cls?.meta?.pipKind?.setPipPos ?? null;
  }

  /* Detach a child without knowing what else its parent holds it by.  Most
     parents hold a subtree and nothing more; an arena also holds pip sets,
     and says so by answering removeChild. */
  static removeChild(parent, child, params) {
    const cls = Utils.classOfNode(parent);
    if (cls?.removeChild) return cls.removeChild(parent, child, params);
    const idx = parent?.subtree?.indexOf(child) ?? -1;
    if (idx >= 0) parent.subtree.splice(idx, 1);
  }

  /* Translate a node without knowing how it stores its position. */
  static moveBy(node, dx, dy) {
    const cls = Utils.classOfNode(node);
    if (cls?.moveBy) return cls.moveBy(Values, node, { dx, dy });
    const c = cls?.getCentreXY?.(Values, node, {});
    if (c && cls?.setXY) return cls.setXY(Values, node, { x: c.x + dx, y: c.y + dy });
    const v = Values.getValue(Values, node, {}) || {};
    Values.setValue(Values, node, {}, { x: (v.x || 0) + dx, y: (v.y || 0) + dy });
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
ModelUtils — centralised factory for scene-graph construction.

Every 2D model's sceneRoot is wrapped in a pane-camera node so that
DemoHarness2D never needs to branch on model type for transforms.
──────────────────────────────────────────────────────────────────────────── */
class ModelUtils {
  static makeNode(type, value, subtree) {
    return { type, value: { ...value, id: ++_nodeId }, subtree: subtree || [] };
  }

  static cloneProto(proto, overrides) {
    const { id: _, ...rest } = proto.value;
    return ModelUtils.makeNode(proto.type, { ...rest, ...overrides });
  }

/* ── makeZoomableCamera ───────────────────────────────────────────────────
 Wraps any child node in a pane-camera with pan/zoom support.
 Used by zone models: the camera starts at (scrollX, scrollY), no centering.
 ──────────────────────────────────────────────────────────────────────── */
  static makeZoomableCamera(child, opts = {}) {
    const cam = ModelUtils.makeNode('pane-camera', {
      centerOrigin: opts.centerOrigin || false,
      zoom: opts.zoom || 1,
      scrollX: opts.scrollX || 0,
      scrollY: opts.scrollY || 0,
    }, [child]);
    return cam;
  }

/* ── makeZoomableFrame ────────────────────────────────────────────────────
 Creates  camera → frame-node → children.  The camera centres
 world (0,0) in the pane and auto-fit is computed from the frame extents.
 Returns the camera node; the frame is stored on camera._frameNode.
 ──────────────────────────────────────────────────────────────────────── */
  static makeZoomableFrame(frameValue, children) {
    const frame = ModelUtils.makeNode('frame-node', frameValue, children);
    const cam = ModelUtils.makeNode('pane-camera', {
      centerOrigin: true,
      zoom: 1,
      scrollX: 0,
      scrollY: 0,
    }, [frame]);
    cam._frameNode = frame;
    return cam;
  }

/* ── autoFitCamera ────────────────────────────────────────────────────────
 Sets the camera zoom so its _frameNode fits inside (W × H) with margin.
 Called once by DemoHarness2D after the pane has measured its size.
 ──────────────────────────────────────────────────────────────────────── */
/* ── makeArray ────────────────────────────────────────────────────────────
 Builds a family: whatever it draws behind, N copies of one leaf, whatever it
 draws in front, all inside a clip if the leaf wants one.  Each part is an
 ordinary node, so a family with no background simply has no background node.

 The model supplies getValue.  This wraps it so that every item also carries
 the shared geometry its family needs, its tooltip, and whether it is
 selected — everything a leaf reads, through the one channel it already uses.
 ──────────────────────────────────────────────────────────────────────── */
  static makeArray(leafType, data, opts = {}) {
    const cls = sceneRegistry.meta[leafType]?.nodeClass;
    const count = opts.count ?? cls?.getCount?.(data) ?? data?.length ?? 0;

    const proto = ModelUtils.makeNode(leafType, {});
    const fly = ModelUtils.makeNode('flyweight-array', {
      count,
      drawOrder: opts.drawOrder ?? cls?.getDrawOrder?.(data, count),
      hitOrder:  opts.hitOrder  ?? cls?.getHitOrder?.(data, count),
      data,
    }, [proto]);

    /* Shared geometry is cheap arithmetic derived from the pane and the data,
       and both can change between frames, so it is simply recomputed.  Caching
       it needed a key over everything a control might touch, and got it wrong. */

    const itemValue = opts.getValue ?? ((mix, n, p, i) => data?.[i]);
    const selectable = opts.selectable !== false;

    fly.inst = {
      visibleRange: opts.visibleRange,
      getCount: cls?.getCount ? (node) => cls.getCount(node.value.data) : null,

      getValue: (mix, node, params, i) => {
        const base = itemValue(mix, node, params, i);
        if (!base) return base;
        return {
          ...base,
          selected: !!node.state?.selected?.has(i),
          hovered: node.state?.hovered === i,
        };
      },

      /* Selection needs no flag of its own: a family whose setValue keeps
         `selected` has selectable items, and one that drops it does not. */
      setValue: (mix, node, params, i, patch) => {
        const st = (node.state ||= {});
        let changed = false;

        if ('selected' in patch && selectable) {
          const set = (st.selected ||= new Set());
          const was = set.has(i);
          if (patch.selected && !was) { set.add(i); changed = true; }
          else if (!patch.selected && was) { set.delete(i); changed = true; }
        }
        if ('hovered' in patch) {
          const now = patch.hovered ? i : (st.hovered === i ? null : st.hovered);
          if (st.hovered !== now) { st.hovered = now; changed = true; }
        }
        if (opts.setValue) changed = opts.setValue(mix, node, params, i, patch) || changed;
        return changed;
      },
    };

    const kids = [];
    const chrome = (which) => {
      const n = ModelUtils.makeNode('chrome-node', { data });
      n.inst = { drawFn: (mix, node, p) => cls[which](mix, node, p) };
      return n;
    };
    if (cls?.drawBackground) kids.push(chrome('drawBackground'));
    kids.push(fly);
    if (cls?.drawOverlay) kids.push(chrome('drawOverlay'));

    /* Whatever the root turns out to be, it carries the data and a way to
       reach the array, so a model need not know how it was assembled. */
    const finish = (root) => {
      root.inst = { ...(root.inst || {}), flyweight: fly };
      return root;
    };

    if (!cls?.clipPath) return finish(ModelUtils.makeNode('basic-collection', { data }, kids));

    /* A clip brackets only what it should contain.  The overlay is drawn
       after it is released, so it sits outside. */
    const overlay = cls?.drawOverlay ? kids.pop() : null;
    const clip = ModelUtils.makeNode('clip-node', { data }, [
      ModelUtils.makeNode('basic-collection', { data }, kids),
    ]);
    clip.inst = { pathFn: (mix, node, p) => cls.clipPath(mix, node, p) };
    return finish(ModelUtils.makeNode('basic-collection', { data }, overlay ? [clip, overlay] : [clip]));
  }

  static autoFitCamera(camNode, paneW, paneH) {
    const frame = camNode._frameNode;
    if (!frame || !paneW || !paneH) return;

    const cw = frame.value.cw || 700, ch = frame.value.ch || 400;
    const p = frame.value.padding;
    let pl = 80, pr = 80, pt = 100, pb = 100;
    if (p != null) {
      if (typeof p === 'number') { pl = pr = pt = pb = p; }
      else { pl = p.left ?? 80; pr = p.right ?? 80; pt = p.top ?? 100; pb = p.bottom ?? 100; }
    }
    const totalW = cw + pl + pr;
    const totalH = ch + pt + pb;
    camNode.value.zoom = Math.min(paneW / totalW, paneH / totalH) * 0.92;
    camNode.value.scrollX = 0;
    camNode.value.scrollY = 0;
  }
}

// These are small and commonly used, so we place them here.
function hexToRgb(hex) {
  hex = (hex || '#888888').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  if (hex.length === 8) hex = hex.slice(0, 6);
  const n = parseInt(hex, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function hexToRgba(hex, alpha) {
  hex = (hex || '#888888').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  if (hex.length === 8) hex = hex.slice(0, 6);
  const n = parseInt(hex, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

function shiftColor({ r, g, b }, amt) {
  const f = v => Math.round(Math.min(255, Math.max(0, amt > 0 ? v + (255 - v) * amt : v + v * amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  else {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
PaneCameraNode — lightweight camera for per-pane 2D canvases.

Node value properties:
 centerOrigin — true  → world (0,0) maps to pane centre  (charts)
                false → world (0,0) maps to pane top-left (zones)
 zoom, scrollX, scrollY — pan / zoom state (mutated by DemoHarness2D)

DemoHarness2D applies DPR scaling with setTransform(dpr,0,0,dpr,0,0).
This node multiplies on top via ctx.transform so both layers compose.
──────────────────────────────────────────────────────────────────────────── */
class PaneCameraNode {

  static _offsets(ctxMix, node) {
    const v = node.value;
    const cx = v.centerOrigin ? ctxMix.W / 2 : 0;
    const cy = v.centerOrigin ? ctxMix.H / 2 : 0;
    return { cx, cy, z: v.zoom || 1, sx: v.scrollX || 0, sy: v.scrollY || 0 };
  }

  static before_draw2d(ctxMix, node, params) {
    const { cx, cy, z, sx, sy } = PaneCameraNode._offsets(ctxMix, node);
    ctxMix.ctx.transform(z, 0, 0, z, cx - sx * z, cy - sy * z);
  }

/* after_draw2d intentionally omitted — DemoHarness2D resets the 
 transform at the start of every frame so no restore is needed. */

  static before_hit_test(ctxMix, node, params) {
    const { cx, cy, z, sx, sy } = PaneCameraNode._offsets(ctxMix, node);
    node.value._savedHit = ctxMix.hitPoint;
    node.value._savedHitResult = ctxMix.hitResult;
    if (ctxMix.hitPoint) {
      ctxMix.hitPoint = {
        x: (ctxMix.hitPoint.x - cx) / z + sx,
        y: (ctxMix.hitPoint.y - cy) / z + sy,
      };
    }
  }

  static after_hit_test(ctxMix, node, params) {
    ctxMix.hitPoint = node.value._savedHit;

// Only wrap hits produced within this camera's subtree, not pre-existing ones
    if (ctxMix.hitResult?.interactions && ctxMix.hitResult !== node.value._savedHitResult) {
      const inner = ctxMix.hitResult.interactions;
      const { cx, cy, z, sx, sy } = PaneCameraNode._offsets(ctxMix, node);
      const toWorld = (px, py) => ({
        x: (px - cx) / z + sx,
        y: (py - cy) / z + sy,
      });

      if (inner.applyDrag) {
        const origDrag = inner.applyDrag;
        inner.applyDrag = (px, py) => {
          const w = toWorld(px, py);
          return origDrag(w.x, w.y);
        };
      }
      if (inner.endDrag) {
        const origEnd = inner.endDrag;
        inner.endDrag = (...args) => 
          origEnd(...args);
      }
    }
  }
}

sceneRegistry.registerNodeClass('pane-camera', PaneCameraNode);

//<< import { PipperNode } from './pipper-node.js';
//-- file: ./pipper-node.js --
//>> export { PipperNode };

/* ─────────────────────────────────────────────────────────────────────────────
PipperNode — the arena.  It owns the pip sets and the controllers, and is the
substrate both controllers stand on, so neither has to name the other.

  node.inst.pipSets      PipSetManager, configured with this build's rules
  node.inst.controllers  live controller instances, in claim order
  node.state.*           drag-time state: recomputable, never serialised

Controllers are optional and independently droppable.  They talk to each other
only through hooks announced here:

  claim(hit)          first controller to return true owns the drag
  clearForTileJoin    make way: two tile pips are about to abut
  onFracture          a tile-to-tile set is being broken by a drag
  settle              re-derive dependent geometry after anything moved
  onDropped           a drag finished; nodes came to rest
──────────────────────────────────────────────────────────────────────────── */
class PipperNode {
  static PROXIMITY_DIST = 12;   // pips this close highlight during a drag
  static GRAB_DIST      = 10;   // how near the pointer must be to seize a pip

  // ── arena services ───────────────────────────────────────────────

  static manager(node) {
    const inst = (node.inst ||= {});
    return (inst.pipSets ||= new PipSetManager(inst.pipSetRules));
  }

  static controllers(node) {
    const list = node.inst?.controllers || [];
    return [...list].sort((a, b) => (b.claimPriority ?? 0) - (a.claimPriority ?? 0));
  }

  // Announce a hook to every controller that answers it.
  static notify(node, hook, ...args) {
    for (const ctrl of PipperNode.controllers(node)) ctrl[hook]?.(...args);
  }

  // The first controller to return true owns the drag.
  static claim(ctxMix, node, hitResult, params, endpointInfo) {
    for (const ctrl of PipperNode.controllers(node))
      if (ctrl.wrapHit?.(ctxMix, node, hitResult, params, endpointInfo)) return true;
    return false;
  }

  // Install a scene: subtree plus id-based connection specs, resolved to
  // references.  The ids do not survive the call.
  static loadScene(node, scene, params) {
    node.subtree = scene.subtree || [];
    const mgr = PipperNode.manager(node);
    mgr.sets.length = 0;
    for (const child of node.subtree) if (child.state) child.state.pipSets = [];
    mgr.resolve(node.subtree, scene.value?.connections, params || {});
    BasicCollectionNode._sortSubtree(node.subtree);
  }

  /* Drop a child from the arena.  The subtree and the pip sets are two
     separate holdings of the same node: splicing one leaves the other with a
     live reference to something no longer in the scene, still walked, still
     driving followers to pips that are no longer drawn.  So both go, and the
     controllers are then given the chance to reap what that orphaned. */
  static removeChild(node, child, params) {
    const idx = node.subtree.indexOf(child);
    if (idx >= 0) node.subtree.splice(idx, 1);
    // Announced while the joins still exist: a controller may want to reap
    // what was only there on this node's account.
    PipperNode.notify(node, 'onRemoving', node, child, params || {});
    PipperNode.manager(node).removeNode(child);
    PipperNode.notify(node, 'settle', node, params || {});
  }

  // ── phases ───────────────────────────────────────────────────────

  static layout(ctxMix, node, params) {
    BasicCollectionNode._sortSubtree(node.subtree);
    PipperNode.notify(node, 'layout', node, params);
  }

  // Intercept pip hit-testing before child bodies are considered.
  static before_hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt || ctxMix.hoverOnly) return;

    const mgr = PipperNode.manager(node), sub = node.subtree;

    for (let i = sub.length - 1; i >= 0; i--) {
      const child = sub[i];
      if (!mgr.isFollower(child)) continue;

      const pipsFn = Utils.pipsFn(child), setPip = Utils.setPipFn(child);
      if (!pipsFn || !setPip) continue;
      const pips = pipsFn(ctxMix, child, params);

      for (let pip = 0; pip < pips.length; pip++) {
        // A pip that splits is grabbed by its body, not its endpoint —
        // that path carries the snap-to-edge behaviour.
        if (mgr.kindAt(child, pip).splits) continue;

        const ox = pt.x - pips[pip].x, oy = pt.y - pips[pip].y;
        if (Math.hypot(ox, oy) > PipperNode.GRAB_DIST) continue;

        ctxMix.hitResult = {
          node: child,
          interactions: {
            applyDrag(wx, wy) {
              setPip(Values, child, { idx: pip, x: wx - ox, y: wy - oy });
            },
            endDrag(onStrip) {
              if (!onStrip) return;
              const idx = sub.indexOf(child);
              if (idx >= 0) sub.splice(idx, 1);
            },
          },
        };

        PipperNode.claim(ctxMix, node, ctxMix.hitResult, params, { pipIdx: pip });
        ctxMix.abortPhase = true;
        return;
      }
    }
  }

  // Wrap a body drag if no pip was hit.
  static after_child_hit_test(ctxMix, node, params, child) {
    if (!ctxMix.hitResult || ctxMix.hitResult.node !== child || ctxMix.hoverOnly) return;

    const inner = ctxMix.hitResult.interactions;
    const sub = node.subtree;
    const mgr = PipperNode.manager(node);

    ctxMix.hitResult.interactions = {
      applyDrag: (wx, wy) => inner?.applyDrag?.(wx, wy),
      endDrag: (onStrip) => {
        inner?.endDrag?.(onStrip);
        if (!onStrip) return;
        const idx = sub.indexOf(child);
        if (idx >= 0) sub.splice(idx, 1);
        mgr.removeNode(child);
      },
    };

    PipperNode.claim(ctxMix, node, ctxMix.hitResult, params);
    ctxMix.abortPhase = true;
  }

  // ── drag-time state (node.state, recomputable) ───────────────────

  static setDraggedPips(node, nodes, params) {
    const mgr = PipperNode.manager(node);
    const dragged = new Map();
    for (const child of nodes) {
      const pips = mgr.pipsOf(child, params);
      if (!pips.length) continue;
      dragged.set(child, new Set(pips.map((_, pip) => pip)));
    }
    (node.state ||= {}).draggedPips = dragged;
    PipperNode.updateProximity(node, params);
  }

  // As above, but for an explicit list of { node, pip } references.
  static setDraggedRefs(node, refs, params) {
    const dragged = new Map();
    for (const ref of refs) {
      if (!dragged.has(ref.node)) dragged.set(ref.node, new Set());
      dragged.get(ref.node).add(ref.pip);
    }
    (node.state ||= {}).draggedPips = dragged;
    PipperNode.updateProximity(node, params);
  }

  static isDragged(node, child, pip) {
    return !!node.state?.draggedPips?.get(child)?.has(pip);
  }

  static clearDragState(node) {
    const state = (node.state ||= {});
    state.draggedPips = null;
    state.proximityPairs = null;
    state.snapEdges = null;
  }

  /* Pips in motion, and the resting pips they are close to.  Purely a
     drawing hint — derived every time the drag moves, never persisted. */
  static updateProximity(node, params) {
    const state = (node.state ||= {});
    const dragged = state.draggedPips;
    if (!dragged || dragged.size === 0) { state.proximityPairs = null; return; }

    const mgr = PipperNode.manager(node);
    const all = [];
    for (const child of node.subtree) {
      const pips = mgr.pipsOf(child, params);
      for (let pip = 0; pip < pips.length; pip++) {
        all.push({
          node: child, pip,
          pos: pips[pip],
          follows: mgr.kindAt(child, pip).follows,
          moving: !!dragged.get(child)?.has(pip),
        });
      }
    }

    const pairs = [];
    for (const a of all) {
      if (!a.moving) continue;
      for (const b of all) {
        if (b.moving) continue;
        if (mgr.same(a, b)) continue;
        if (Math.hypot(a.pos.x - b.pos.x, a.pos.y - b.pos.y) >= PipperNode.PROXIMITY_DIST) continue;
        pairs.push({ a, b, edgeInvolved: a.follows || b.follows });
      }
    }
    state.proximityPairs = pairs.length ? pairs : null;
  }

  // ── pip rendering ────────────────────────────────────────────────

  static _classifyPip(node, child, pip) {
    const isThis = e => e.node === child && e.pip === pip;

    for (const p of node.state?.proximityPairs || [])
      if (isThis(p.a) || isThis(p.b)) return p.edgeInvolved ? 'edge' : 'raft';

    const mgr = PipperNode.manager(node);
    const set = mgr.setFor(child, pip);
    if (!set) return 'default';
    if (set.length > 2) return 'edge';
    return set.some(e => mgr.kindAt(e.node, e.pip).follows) ? 'edge' : 'raft';
  }

  static after_child_draw2d(ctxMix, node, params, child) {
    const pipsFn = Utils.pipsFn(child);
    if (!pipsFn) return;

    const pips = pipsFn(ctxMix, child, params);
    for (let pip = 0; pip < pips.length; pip++)
      PipperNode._drawPipShape(ctxMix.ctx, pips[pip].x, pips[pip].y,
        PipperNode._classifyPip(node, child, pip));
  }

  static _drawPipShape(ctx, x, y, state) {
    const highlight = state === 'raft' || state === 'edge';

    ctx.beginPath();
    ctx.arc(x, y, highlight ? 5 : 3.5, 0, Geo.TAU);

    if (state === 'raft')      { ctx.fillStyle = '#4d4'; ctx.fill(); }
    else if (state === 'edge') { ctx.fillStyle = '#48f'; ctx.fill(); }
    else                       { ctx.strokeStyle = '#666'; ctx.lineWidth = 1.5; ctx.stroke(); }
  }

  static after_draw2d(ctxMix, node, params) {
    for (const ctrl of PipperNode.controllers(node))
      for (const extra of ctrl.getExtraAffordances?.(node) || [])
        PipperNode._drawPipShape(ctxMix.ctx, extra.x, extra.y, extra.state);
  }
}

  static meta = {
    zOrder: 1,

    coneParams: () => ({ n: 4, tilt: Math.PI / 4 }),
    spawnOverrides: (wp) => ({ x: wp.x, y: wp.y, width: 70, height: 42, label: 'Btn', sub: '', color: '#e0ddd4' }),

      { key: 'sub',   label: 'Subtitle', type: 'text', value: node.value.sub || '' },
      { key: 'color', label: 'Color', type: 'color', value: node.value.color || BTN_DEFAULTS.fill },

    const v = res.getValue(res, node, params) || {};
    return { x: v.x || 0, y: v.y || 0 };

    const x = v.x || 0, y = v.y || 0;
    return [
      { x, y: y - hh, out: -Math.PI/2 },
      { x: x + hw, y, out: 0 },
      { x, y: y + hh, out: Math.PI/2 },
      { x: x - hw, y, out: Math.PI }

  }
  static draw2d(ctxMix, node, params) {
    const ctx = ctxMix.ctx, v = ctxMix.getValue(ctxMix, node, params), p = BTN_DEFAULTS;
    const w = v.width || 70, h = v.height || 42;
    const {x: cx, y: cy} = PippedButtonNode.getCentreXY(ctxMix, node, params);
    const left = cx - w / 2, top = cy - h / 2, cr = p.cornerRadius;
    const bw = p.borderWidth, fillHex = v.color || p.fill, base = hexToRgb(fillHex);

    ctx.save(); ctx.shadowColor = p.shadowColor; ctx.shadowOffsetX = p.shadowOffsetX;
    ctx.shadowOffsetY = p.shadowOffsetY; ctx.shadowBlur = p.shadowBlur;
    roundRectPath(ctx, left, top, w, h, cr);
    ctx.fillStyle = fillHex; ctx.fill(); ctx.restore();

    const angle = p.lightAngle * Math.PI / 180, dx = Math.sin(angle), dy = -Math.cos(angle);
    const faceLit = shiftColor(base, p.lightIntensity * 0.14 * p.bevel), faceSh = shiftColor(base, -p.lightIntensity * 0.10 * p.bevel);
    const fGrad = ctx.createLinearGradient(cx + dx * w / 2, cy + dy * h / 2, cx - dx * w / 2, cy - dy * h / 2);
    fGrad.addColorStop(0, faceLit); fGrad.addColorStop(1, faceSh);
    roundRectPath(ctx, left, top, w, h, cr);
    ctx.fillStyle = fGrad; ctx.fill();

    if (p.bevel > 0 && p.bevelStrength > 0) {
      const litAmt = p.bevelStrength * p.lightIntensity * p.bevel;
      const hi = shiftColor(base, litAmt), lo = shiftColor(base, -litAmt), edgeW = bw * 1.4;
      ctx.save(); roundRectPath(ctx, left, top, w, h, cr); ctx.clip();
      ctx.strokeStyle = hi; ctx.lineWidth = edgeW; roundRectPath(ctx, left + dx * bw * 0.5, top + dy * bw * 0.5, w, h, cr); ctx.stroke();
      ctx.strokeStyle = lo; ctx.lineWidth = edgeW; roundRectPath(ctx, left - dx * bw * 0.5, top - dy * bw * 0.5, w, h, cr); ctx.stroke();
      ctx.restore();
    }

    const label = v.label ?? '';
    if (label) {
      ctx.fillStyle = p.textColor; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `600 ${p.fontSize}px system-ui, sans-serif`; ctx.fillText(label, cx, v.sub ? cy - h * 0.06 : cy);
    }
    if (v.sub) {
      ctx.fillStyle = p.textColor; ctx.globalAlpha = 0.6; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `400 ${p.fontSize * 0.4}px system-ui, sans-serif`; ctx.fillText(v.sub, cx, cy + h * 0.22); ctx.globalAlpha = 1;
    }

    if (v.selected || v.hovered) {
      ctx.setLineDash([4, 4]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;

      ctx.stroke(); ctx.setLineDash([]);
    }
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt) return;
    const v = ctxMix.getValue(ctxMix, node, params), w = v.width || 70, h = v.height || 42;
    const {x, y} = PippedButtonNode.getCentreXY(ctxMix, node, params);
    const left = x - w / 2, top = y - h / 2;

    if (lx < cr && ly > h - cr && (lx - cr) ** 2 + (ly - (h - cr)) ** 2 > cr * cr) return;

    const dx = pt.x - x, dy = pt.y - y;
    ctxMix.hitResult = { node, interactions: {
      applyDrag(wx, wy) { Values.setValue(Values, node, params, { x: wx - dx, y: wy - dy }); },

  }
}

//<< import { FractureConeNode } from './fracture-cone-node.js';
//-- file: ./fracture-cone-node.js --
//>> export { FractureConeNode };
class FractureConeNode {
  static draw2d(ctxMix, node, params) {
    const target = node.inst?.target;
    const drag = target?.state?.raftDrag;
    if (!drag || !drag.cone || drag.phase !== 'preLock') return;

    const ctx = ctxMix.ctx;
    const at = drag.node.state?.dragOrigin;
    if (!at) return;

    // draw the actual cone
    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.beginPath();
    ctx.moveTo(at.x, at.y);
    ctx.arc(at.x, at.y, 240, 
      drag.cone.centerAngle - drag.cone.halfSpan, 
      drag.cone.centerAngle + drag.cone.halfSpan);
    ctx.closePath();
    ctx.fillStyle = '#6699ee';
    ctx.fill();

    // draw obver the raft of items.
    // This is not that helpful.
    for (const t of drag.previewGroup || []) {
      const from = t.state?.dragOrigin;
      if (!from)
        continue;
      ctx.globalAlpha = 0.30;
      const cls = Utils.classOfNode(t);
      const verts = cls.getVerts ? cls.getVerts(ctxMix, { value: { ...t.value, x: from.x, y: from.y } }, params) : [];
      if (verts.length > 0) {
        ctx.beginPath();
        ctx.moveTo(verts[0].x, verts[0].y);
        for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
          ctx.closePath();
        ctx.fillStyle = '#229922';
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
RaftSnapController — tiles that abut travel together, and fracture along a
cone when pulled apart.

This class is droppable.  It names no other controller: everything it once
asked EdgeSnapController to do is now announced through PipperNode as a hook,
so a build without edges still rafts, and a build without rafting still keeps
edges attached.

Note that the manager's maxTilePips rule and this controller are independent
switches.  With the rule left at 2 and this class dropped, rafts remain legal
— loaded scenes keep their joins — but nothing new forms them.
──────────────────────────────────────────────────────────────────────────── */
class RaftSnapController {
  static MOVE_THRESHOLD = 3;   // a drag is under way: show the cone
  static LOCK_IN        = 8;   // far enough to commit to a direction
  static SNAP_DIST      = 12;  // pips near enough to join on drop
  static FRACTURE_DIST  = 5;   // a join stretched this far gives way

  constructor() {
    this.drag = null;
    this.claimPriority = 10;   // offered drags before other controllers
  }

  layout(arenaNode, params) {}

  // ── group formation ──────────────────────────────────────────────

  /* Followers whose every neighbour is already inside the group come along
     with it — an edge spanning only moving tiles is itself moving. */
  _drawInFollowers(group, subtree, mgr) {
    let added = true;
    while (added) {
      added = false;
      for (const child of subtree) {
        if (group.has(child) || !mgr.isFollower(child)) continue;
        const entries = mgr.entriesOf(child);
        if (!entries.length) continue;
        const wholly = entries.every(({ set, entry }) =>
          set.every(e => e.node === entry.node || group.has(e.node)));
        if (!wholly) continue;
        group.add(child);
        added = true;
      }
    }
  }

  // ── fracture ─────────────────────────────────────────────────────

  /* Break every exclusive tile-to-tile set that straddles the group boundary.
     When the raft was a pair, announce the break so that a controller which
     understands edges can put one where the join used to be. */
  _fractureBoundary(arenaNode, mgr, group, params, announce) {
    for (let i = mgr.sets.length - 1; i >= 0; i--) {
      const set = mgr.sets[i];
      if (set.length !== 2 || mgr.tileCount(set) !== 2) continue;

      const inside = set.filter(e => group.has(e.node)).length;
      if (inside === 0 || inside === set.length) continue;

      const a = { node: set[0].node, pip: set[0].pip };
      const b = { node: set[1].node, pip: set[1].pip };
      mgr.drop(set);
      if (announce) PipperNode.notify(arenaNode, 'onFracture', arenaNode, a, b, params);
    }
  }

  // ── position snapshots ───────────────────────────────────────────

  _snapshot(subtree) {
    for (const child of subtree) {
      if (typeof child.value.x !== 'number') continue;
      (child.state ||= {}).dragOrigin = { x: child.value.x, y: child.value.y };
    }
  }

  _restore(subtree) {
    for (const child of subtree) {
      const at = child.state?.dragOrigin;
      if (!at) continue;
      Values.setValue(Values, child, {}, { x: at.x, y: at.y });
    }
  }

  _clearSnapshot(subtree) {
    for (const child of subtree) if (child.state) child.state.dragOrigin = null;
  }

  _offsetGroup(subtree, dx, dy) {
    for (const child of subtree) {
      const at = child.state?.dragOrigin;
      if (!at) continue;
      const k = this.drag.group.has(child) ? 1 : 0;
      Values.setValue(Values, child, {}, { x: at.x + k * dx, y: at.y + k * dy });
    }
  }

  // ── drag ─────────────────────────────────────────────────────────

  wrapHit(ctxMix, arenaNode, hitResult, params, endpointInfo) {
    if (endpointInfo) return false;

    const dragged = hitResult.node;
    const mgr = PipperNode.manager(arenaNode);
    if (mgr.isFollower(dragged)) return false;

    const subtree = arenaNode.subtree;
    const inner = hitResult.interactions;

    this._snapshot(subtree);

    // Bring the whole connected component to the front.
    const component = mgr.component(dragged);
    const back = [], front = [];
    for (const child of subtree) (component.has(child) ? front : back).push(child);
    subtree.length = 0;
    subtree.push(...back, ...front);

    this.drag = {
      node: dragged,
      ox: ctxMix.hitPoint.x - dragged.value.x,
      oy: ctxMix.hitPoint.y - dragged.value.y,
      startWx: ctxMix.hitPoint.x,
      startWy: ctxMix.hitPoint.y,
      phase: 'preLock',
      group: new Set([dragged]),
      cone: null,
      previewGroup: null,
    };
    (arenaNode.state ||= {}).raftDrag = this.drag;

    hitResult.interactions = {
      applyDrag: (wx, wy) => this._applyDrag(arenaNode, mgr, inner, params, wx, wy),
      endDrag: (onStockStrip) => this._endDrag(arenaNode, mgr, inner, params, onStockStrip),
    };
    return true;
  }

  _applyDrag(arenaNode, mgr, inner, params, wx, wy) {
    const subtree = arenaNode.subtree;
    const drag = this.drag;
    const travelled = Geo.dist2(wx, wy, drag.startWx, drag.startWy);

    if (drag.phase !== 'preLock') {
      this._offsetGroup(subtree, wx - drag.ox - drag.node.state.dragOrigin.x,
                                 wy - drag.oy - drag.node.state.dragOrigin.y);
      PipperNode.notify(arenaNode, 'settle', arenaNode, params);
      PipperNode.updateProximity(arenaNode, params);
      return;
    }

    inner.applyDrag(wx, wy);

    if (travelled > RaftSnapController.MOVE_THRESHOLD) {
      const cp = Utils.classOfNode(drag.node)?.meta?.coneParams?.(drag.node) ?? { n: 4, tilt: 0 };
      const angle = Math.atan2(wy - drag.startWy, wx - drag.startWx);
      drag.cone = ConeEngine.computeCone(cp.n, cp.tilt, angle);
      drag.previewGroup = ConeEngine.walkGroup(mgr, drag.node, drag.cone);

      const raftSize = mgr.raft(drag.node).size;
      if (raftSize === 1) drag.cone = null;   // nothing to fracture

      if (travelled > RaftSnapController.LOCK_IN) {
        drag.phase = 'locked';
        drag.group = drag.previewGroup;
        drag.previewGroup = null;
        this._drawInFollowers(drag.group, subtree, mgr);

        // Splitting a pair leaves an edge behind, if edges exist in this build.
        this._fractureBoundary(arenaNode, mgr, drag.group, params, raftSize === 2);
        PipperNode.setDraggedPips(arenaNode, drag.group, params);
      }
    }
    PipperNode.notify(arenaNode, 'settle', arenaNode, params);
  }

  _endDrag(arenaNode, mgr, inner, params, onStockStrip) {
    const subtree = arenaNode.subtree;
    const drag = this.drag;

    if (onStockStrip) {
      for (const child of drag.group) {
        mgr.removeNode(child);
        const idx = subtree.indexOf(child);
        if (idx >= 0) subtree.splice(idx, 1);
      }
    } else {
      const snapped = SnapEngine.apply(mgr, arenaNode, subtree, drag.group,
        RaftSnapController.SNAP_DIST, params);
      if (!snapped && drag.phase === 'preLock') this._restore(subtree);

      PipperNode.notify(arenaNode, 'settle', arenaNode, params);
      mgr.breakStrained(RaftSnapController.FRACTURE_DIST, params);
      PipperNode.notify(arenaNode, 'settle', arenaNode, params);
      PipperNode.notify(arenaNode, 'onDropped', arenaNode, drag.group, params);
      PipperNode.notify(arenaNode, 'settle', arenaNode, params);
    }

    PipperNode.clearDragState(arenaNode);
    this._clearSnapshot(subtree);
    BasicCollectionNode._sortSubtree(subtree);
    inner.endDrag?.(onStockStrip);

    this.drag = null;
    if (arenaNode.state) arenaNode.state.raftDrag = null;
  }
}

CONTROLS.push({ type: 'checkbox', id: 'enableRaftSnap', label: 'Raft Snap', value: true })

/* ─────────────────────────────────────────────────────────────────────────────
EdgeSnapController — edges and junctions stay attached to the pips they meet.

This class is droppable, and names no other controller.  It answers hooks
announced by PipperNode rather than being called by RaftSnapController:

  onFracture        a tile pair came apart — put an edge where the join was
  clearForTileJoin  two tiles want to abut — remove the edges in the way
  onDropped         a drag came to rest — attach free edge ends nearby
  settle            re-derive edge geometry after anything moved

With this class dropped, tiles still raft: they simply never grow edges.
──────────────────────────────────────────────────────────────────────────── */
class EdgeSnapController {
  static SNAP_DIST = 12;
  static SPLIT_DIST = 10;

  constructor(edgeType = 'pipped-edge') {
    this.edgeType = edgeType;
    this.claimPriority = 0;   // offered drags after more specific controllers
  }

  // ── shared helpers ───────────────────────────────────────────────

  _remove(arenaNode, mgr, node) {
    mgr.removeNode(node);
    const idx = arenaNode.subtree.indexOf(node);
    if (idx >= 0) arenaNode.subtree.splice(idx, 1);
  }

  _driverOf(arenaNode, mgr, set) {
    for (const e of set) if (mgr.kindAt(e.node, e.pip).anchors) return e;
    for (const e of set) if (PipperNode.isDragged(arenaNode, e.node, e.pip)) return e;
    return set[0] || null;
  }

  // ── layout ───────────────────────────────────────────────────────
  /* Every follower in a set moves to the driving pip.  Two passes let a
     position propagate along a chain of edges within one frame. */

  layout(arenaNode, params) {
    const mgr = PipperNode.manager(arenaNode);

    for (let pass = 0; pass < 2; pass++) {
      for (const set of mgr.sets) {
        if (!set.some(e => mgr.kindAt(e.node, e.pip).follows)) continue;

        const driver = this._driverOf(arenaNode, mgr, set);
        if (!driver) continue;
        const pos = mgr.posOf(driver, params);
        if (!pos) continue;

        for (const e of set) {
          if (e === driver) continue;
          if (!mgr.kindAt(e.node, e.pip).follows) continue;
          Utils.setPipFn(e.node)?.(Values, e.node, { idx: e.pip, x: pos.x, y: pos.y });
        }
      }
    }
  }

  settle(arenaNode, params) {
    this.deleteOrphanEdges(arenaNode);
    this.layout(arenaNode, params);
  }

  // ── hooks from other controllers ─────────────────────────────────
  //   onFracture / clearForTileJoin / onDropped / onRemoving / settle

  onFracture(arenaNode, a, b, params) {
    this.spawnEdge(arenaNode, a, b, params);
  }

  clearForTileJoin(arenaNode, refs, params) {
    for (const ref of refs) this.deleteEdgesOnPip(arenaNode, ref);
  }

  onDropped(arenaNode, movedNodes, params) {
    this.connectFreeEdgePips(arenaNode, movedNodes, params);
  }

  /* A tile is leaving.  Its edges were there to reach it, so they go with it
     — the same judgement clearForTileJoin makes when a pip is needed for
     something else.  A departing follower takes nothing with it: an edge
     dragged away is just an edge. */
  onRemoving(arenaNode, child, params) {
    const mgr = PipperNode.manager(arenaNode);
    if (mgr.isFollower(child)) return;
    for (const { entry } of mgr.entriesOf(child)) this.deleteEdgesOnPip(arenaNode, entry);
  }

  // ── spawning and reaping ─────────────────────────────────────────

  spawnEdge(arenaNode, a, b, params) {
    if (!sceneRegistry.meta[this.edgeType]) return null;
    const mgr = PipperNode.manager(arenaNode);

    const pa = mgr.posOf(a, params), pb = mgr.posOf(b, params);
    if (!pa || !pb) return null;

    const cls = sceneRegistry.meta[this.edgeType]?.nodeClass;
    const edge = makeNode(this.edgeType, cls.spanValue(pa, pb));
    arenaNode.subtree.push(edge);
    mgr.join({ node: edge, pip: 0 }, a, params);
    mgr.join({ node: edge, pip: 1 }, b, params);
    return edge;
  }

  deleteEdgesOnPip(arenaNode, ref) {
    const mgr = PipperNode.manager(arenaNode);
    const set = mgr.setFor(ref.node, ref.pip);
    if (!set) return;

    const doomed = set.filter(e => e.node !== ref.node && mgr.isEdge(e.node)).map(e => e.node);
    for (const edge of doomed) this._remove(arenaNode, mgr, edge);
  }

  deleteOrphanEdges(arenaNode) {
    const mgr = PipperNode.manager(arenaNode);
    for (let i = arenaNode.subtree.length - 1; i >= 0; i--) {
      const child = arenaNode.subtree[i];
      if (!mgr.isEdge(child)) continue;
      if (mgr.entriesOf(child).length) continue;
      arenaNode.subtree.splice(i, 1);
    }
  }

  // ── attaching on drop ────────────────────────────────────────────

  // Free pips of a moved node reach for the nearest pip that will take them.
  connectNearbyPips(arenaNode, moved, params) {
    const mgr = PipperNode.manager(arenaNode);
    const pips = mgr.pipsOf(moved, params);

    for (let pip = 0; pip < pips.length; pip++) {
      const ref = { node: moved, pip };
      const match = mgr.nearest(arenaNode.subtree, pips[pip], params, {
        skip: cand => cand.node === moved,
        accept: cand => mgr.canJoin(ref, cand, params),
      });
      if (match) mgr.join(ref, match, params);
    }
  }

  // After a raft comes to rest, free tile pips pick up any edge end nearby.
  connectFreeEdgePips(arenaNode, movedNodes, params) {
    const mgr = PipperNode.manager(arenaNode);

    for (const body of movedNodes) {
      if (mgr.isFollower(body)) continue;
      const pips = mgr.pipsOf(body, params);

      for (let pip = 0; pip < pips.length; pip++) {
        const ref = { node: body, pip };
        if (mgr.has(ref)) continue;
        const match = mgr.nearest(arenaNode.subtree, pips[pip], params, {
          accept: cand => mgr.kindOf(cand).follows && mgr.canJoin(ref, cand, params),
        });
        if (match) mgr.join(ref, match, params);
      }
    }
  }

  // A dragged cluster of follower pips lands on whatever is nearest.
  _connectClusterOnDrop(arenaNode, cluster, params) {
    if (!cluster.length) return;
    const mgr = PipperNode.manager(arenaNode);
    const head = cluster[0];
    const pos = mgr.posOf(head, params);
    if (!pos) return;

    const inCluster = ref => cluster.some(c => c.node === ref.node && c.pip === ref.pip);
    const match = mgr.nearest(arenaNode.subtree, pos, params, {
      skip: inCluster,
      accept: cand => mgr.canJoin(head, cand, params),
    });
    if (match) mgr.join(head, match, params);
  }

  // ── drag interaction factory ─────────────────────────────────────

  _createDragInteractions(arenaNode, targetNode, inner, params, hooks) {
    const mgr = PipperNode.manager(arenaNode);
    let initialised = false;

    const init = () => {
      if (initialised) return;
      initialised = true;
      hooks.onInit?.(mgr);
    };

    return {
      applyDrag: (wx, wy) => {
        init();
        inner.applyDrag(wx, wy);
        hooks.onApply?.(mgr);
        PipperNode.updateProximity(arenaNode, params);
      },
      endDrag: (onStockStrip) => {
        if (onStockStrip) {
          this._remove(arenaNode, mgr, targetNode);
          this.deleteOrphanEdges(arenaNode);
        } else if (initialised) {
          hooks.onConnect?.(mgr);
          this._absorbJunctions(arenaNode, params);
          this.settle(arenaNode, params);
        }
        PipperNode.clearDragState(arenaNode);
        BasicCollectionNode._sortSubtree(arenaNode.subtree);
        inner.endDrag?.(onStockStrip);
      },
    };
  }

  // ── the three drags ──────────────────────────────────────────────

  // An edge end, grabbed at the pip.  Its whole coincident cluster travels.
  _wrapEndpointDrag(arenaNode, hitResult, pipIdx, params) {
    const inner = hitResult.interactions;
    if (!inner) return;

    const edge = hitResult.node;
    const mgr = PipperNode.manager(arenaNode);
    const cluster = mgr.followerCluster(edge, pipIdx).map(e => ({ node: e.node, pip: e.pip }));

    hitResult.interactions = this._createDragInteractions(arenaNode, edge, inner, params, {
      onInit: () => {
        const set = mgr.setFor(edge, pipIdx);
        if (set) mgr.detachTiles(set);
        PipperNode.setDraggedRefs(arenaNode, cluster, params);
      },
      onApply: () => {
        const pos = mgr.pipsOf(edge, params)[pipIdx];
        if (pos) {
          for (const ref of cluster) {
            if (ref.node === edge && ref.pip === pipIdx) continue;
            Utils.setPipFn(ref.node)?.(Values, ref.node, { idx: ref.pip, x: pos.x, y: pos.y });
          }
        }
        this.layout(arenaNode, params);
      },
      onConnect: () => this._connectClusterOnDrop(arenaNode, cluster, params),
    });
  }

  // An edge or junction grabbed by its body: it parts from everything, then
  // takes up whatever it is dropped beside.
  _wrapFollowerBodyDrag(arenaNode, hitResult, child, params) {
    const inner = hitResult.interactions;
    if (!inner) return;

    hitResult.interactions = this._createDragInteractions(arenaNode, child, inner, params, {
      onInit: (mgr) => {
        mgr.removeNode(child);
        PipperNode.setDraggedPips(arenaNode, [child], params);
      },
      onConnect: () => this.connectNearbyPips(arenaNode, child, params),
    });
  }

  // A tile nobody else claimed.  Its pips anchor, so its edges simply follow.
  _wrapTileBodyDrag(arenaNode, hitResult, child, params) {
    const inner = hitResult.interactions;
    if (!inner) return;

    hitResult.interactions = this._createDragInteractions(arenaNode, child, inner, params, {
      onInit: () => PipperNode.setDraggedPips(arenaNode, [child], params),
      onApply: () => this.layout(arenaNode, params),
      onConnect: () => this.connectNearbyPips(arenaNode, child, params),
    });
  }

  // A junction: its tile joins become real edges so it can be pulled away.
  _wrapJunctionDrag(arenaNode, hitResult, child, params) {
    const inner = hitResult.interactions;
    if (!inner) return;

    hitResult.interactions = this._createDragInteractions(arenaNode, child, inner, params, {
      onInit: (mgr) => {
        for (const { set, entry } of mgr.entriesOf(child)) {
          const tiles = set.filter(e => mgr.kindAt(e.node, e.pip).anchors)
                           .map(e => ({ node: e.node, pip: e.pip }));
          for (const tile of tiles) {
            mgr.disjoin(tile.node, tile.pip);
            this.spawnEdge(arenaNode, tile, entry, params);
          }
        }
        PipperNode.setDraggedPips(arenaNode, [child], params);
      },
      onApply: () => {
        this.layout(arenaNode, params);
        this._scanSnapEdge(arenaNode, child, params);
      },
      onConnect: () => {
        const snaps = arenaNode.state?.snapEdges;
        if (snaps?.length) {
          for (const snap of snaps) this._splitEdgeAtJunction(arenaNode, child, snap, params);
          return;
        }
        this.connectNearbyPips(arenaNode, child, params);
      },
    });
  }

  // ── snap-to-edge ─────────────────────────────────────────────────

  _scanSnapEdge(arenaNode, junction, params) {
    const state = (arenaNode.state ||= {});
    state.snapEdges = null;

    const jx = junction.value.x, jy = junction.value.y;
    const snaps = [];

    for (const child of arenaNode.subtree) {
      const segments = Utils.classOfNode(child)?.getSnapSegments?.(Values, child, params);
      if (!segments) continue;

      for (const seg of segments) {
        const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1, lenSq = dx * dx + dy * dy;
        if (lenSq < 1) continue;

        const t = Math.max(0, Math.min(1, ((jx - seg.x1) * dx + (jy - seg.y1) * dy) / lenSq));
        const exclude = 8 / Math.sqrt(lenSq);
        if (t < exclude || t > 1 - exclude) continue;

        const px = seg.x1 + t * dx, py = seg.y1 + t * dy;
        if (Math.hypot(jx - px, jy - py) < EdgeSnapController.SPLIT_DIST)
          snaps.push({ edge: child, t, x: px, y: py });
      }
    }
    state.snapEdges = snaps.length ? snaps : null;
  }

  _splitEdgeAtJunction(arenaNode, junction, snap, params) {
    const mgr = PipperNode.manager(arenaNode);
    const edge = snap.edge;
    if (!arenaNode.subtree.includes(edge)) return;

    const group = edge.value.group;
    Values.setValue(Values, junction, params,
      group ? { x: snap.x, y: snap.y, group } : { x: snap.x, y: snap.y });

    // What the old edge reached at either end.
    const reach = pip => {
      const set = mgr.setFor(edge, pip);
      const other = set?.find(e => e.node !== edge);
      return other ? { node: other.node, pip: other.pip } : null;
    };
    const near = reach(0), far = reach(1);

    const values = Utils.classOfNode(edge).splitValues(edge, snap);
    if (group) for (const v of values) v.group = group;

    this._remove(arenaNode, mgr, edge);

    const halves = values.map(v => makeNode(edge.type, v));
    arenaNode.subtree.push(...halves);

    const jRef = { node: junction, pip: 0 };
    if (near) mgr.join({ node: halves[0], pip: 0 }, near, params);
    mgr.join({ node: halves[0], pip: 1 }, jRef, params);
    mgr.join({ node: halves[1], pip: 0 }, jRef, params);
    if (far) mgr.join({ node: halves[1], pip: 1 }, far, params);
  }

  getExtraAffordances(arenaNode) {
    const out = [];
    for (const snap of arenaNode.state?.snapEdges || []) {
      const v = snap.edge.value;
      out.push(
        { x: snap.x, y: snap.y, state: 'edge' },
        { x: v.x1,   y: v.y1,   state: 'edge' },
        { x: v.x2,   y: v.y2,   state: 'edge' },
      );
    }
    return out;
  }

  // ── absorbing pass-through junctions ─────────────────────────────
  /* A junction sharing a set with a tile and with real edge ends was only
     a staging post for those edges reaching the tile.  A junction sitting
     alone on a tile survives: it is a handle for edges yet to come. */

  /* A pip set holds at most one junction.  When another is dragged onto it
     the newcomer wins and the incumbent is absorbed, its other connections
     rehomed onto the survivor. */
  _absorbDuplicateJunctions(arenaNode, params) {
    const mgr = PipperNode.manager(arenaNode);
    let changed = true;

    while (changed) {
      changed = false;
      for (const set of [...mgr.sets]) {
        const junctions = [...new Set(set.filter(e => mgr.isJunction(e.node)).map(e => e.node))];
        if (junctions.length < 2) continue;

        const winner = junctions.find(n => PipperNode.isDragged(arenaNode, n, 0)) ?? junctions[0];
        for (const loser of junctions) {
          if (loser === winner) continue;
          for (const { set: other, entry } of mgr.entriesOf(loser)) {
            if (other === set) continue;
            mgr.disjoin(loser, entry.pip);
            const survivor = other.find(e => e.node !== loser);
            if (survivor) mgr.join({ node: winner, pip: 0 }, survivor, params);
          }
          this._remove(arenaNode, mgr, loser);
          changed = true;
        }
      }
    }
  }

  _absorbJunctions(arenaNode, params) {
    const mgr = PipperNode.manager(arenaNode);
    this._absorbDuplicateJunctions(arenaNode, params);
    let changed = true;

    while (changed) {
      changed = false;
      for (const child of [...arenaNode.subtree]) {
        if (!mgr.isJunction(child)) continue;

        const absorbable = mgr.entriesOf(child).some(({ set, entry }) =>
          set.some(e => e.node !== child && mgr.kindAt(e.node, e.pip).anchors) &&
          set.some(e => e.node !== child && mgr.isEdge(e.node)));

        if (!absorbable) continue;
        this._remove(arenaNode, mgr, child);
        changed = true;
      }
    }
    this.deleteOrphanEdges(arenaNode);
  }

  // ── claim ────────────────────────────────────────────────────────

  wrapHit(ctxMix, arenaNode, hitResult, params, endpointInfo) {
    const mgr = PipperNode.manager(arenaNode);
    const node = hitResult.node;

    if (endpointInfo) {
      this._wrapEndpointDrag(arenaNode, hitResult, endpointInfo.pipIdx, params);
    } else if (mgr.isJunction(node)) {
      this._wrapJunctionDrag(arenaNode, hitResult, node, params);
    } else if (mgr.isFollower(node)) {
      this._wrapFollowerBodyDrag(arenaNode, hitResult, node, params);
    } else {
      this._wrapTileBodyDrag(arenaNode, hitResult, node, params);
    }
    return true;
  }
}
