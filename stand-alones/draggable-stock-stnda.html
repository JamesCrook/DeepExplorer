<script>
const R = 30;
const P = { opacity: 80, edgeWidth: 5, edgeOutline: 1.5, edgeBend: 0, indicatedIds: new Set(), colors: { 4: { fill: '#c08428', stroke: '#9a6a1e' } }, };
const MODELS = []
const STOCK = []  
const CONTROLS = []

let _nodeId = 0;
function makeNode(type, value, subtree) {
  return { type, value: { ...value, id: ++_nodeId }, subtree: subtree || [] };
}
function cloneProto(proto, overrides) {
  const { id: _, ...rest } = proto.value;
  return makeNode(proto.type, { ...rest, ...overrides });
}

/*------------------------------------
DEPENDENCIES:

 class Utils { ... }

//<< import { Geo } from './geo.js';
//-- file: ./geo.js --
//>> export { Geo };
class Geo {
  static TAU = Math.PI * 2;
  static PI  = Math.PI;

  static norm(a) { return ((a % Geo.TAU) + Geo.TAU + Geo.PI) % Geo.TAU - Geo.PI; }
  static adiff(a, b) { return Math.abs(Geo.norm(a - b)); }
  static dist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
  static dist2(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }
  static pipsOpposite(a, b) { return Geo.adiff(a, b) > Geo.PI * 0.85; }

  static verts(n, cx, cy, r, tilt) {
    const v = [];
    for (let i = 0; i < n; i++) {
      const a = tilt + (i * Geo.TAU) / n - Geo.PI;
      v.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
    }
    return v;
  }

  static pips(n, cx, cy, r, tilt) {
    const vs = Geo.verts(n, cx, cy, r, tilt);
    const p = [];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const mx = (vs[i].x + vs[j].x) / 2;
      const my = (vs[i].y + vs[j].y) / 2;
      p.push({ x: mx, y: my, out: Math.atan2(my - cy, mx - cx) });
    }
    return p;
  }

  static ptInPoly(px, py, vs) {
    let ins = false;
    for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
      if ((vs[i].y > py) !== (vs[j].y > py) &&
          px < (vs[j].x - vs[i].x) * (py - vs[i].y) / (vs[j].y - vs[i].y) + vs[i].x)
        ins = !ins;
    }
    return ins;
  }
}
//-- endfile --

//<< import { ConnHelper } from './conn-helper.js';
//-- file: ./conn-helper.js --
//>> export { ConnHelper };
class ConnHelper {
  static forNode(conns, id) {
    const out = [];
    for (const c of conns) {
      if (c.a === id) out.push({ other: c.b, myPip: c.pipA, otherPip: c.pipB });
      else if (c.b === id) out.push({ other: c.a, myPip: c.pipB, otherPip: c.pipA });
    }
    return out;
  }
  static removeFor(conns, id) {
    for (let i = conns.length - 1; i >= 0; i--) {
      if (conns[i].a === id || conns[i].b === id) conns.splice(i, 1);
    }
  }
  // seems not to be used.
  static breakBoundary(conns, groupIds) {
    for (let i = conns.length - 1; i >= 0; i--) {
      const c = conns[i];
      if (groupIds.has(c.a) !== groupIds.has(c.b)) conns.splice(i, 1);
    }
  }
}
//-- endfile --

//<< import { PipHelper } from './pip-helper.js';
//-- file: ./pip-helper.js --
//>> export { PipHelper };
class PipHelper extends ConnHelper {
  static pipUsed(conns, id, pi) {
    return conns.some(c => (c.a === id && c.pipA === pi) || (c.b === id && c.pipB === pi));
  }
  // Only counts direct body-to-body connections as "used" (ignores edge-mediated ones)
  static pipUsedDirect(conns, id, pi, subtree) {
    return conns.some(c => {
      const match = (c.a === id && c.pipA === pi) || (c.b === id && c.pipB === pi);
      if (!match) return false;
      const otherId = c.a === id ? c.b : c.a;
      const other = subtree.find(n => n.value.id === otherId);
      return other && !Utils.hasAffordance(other, 'setPipPos');
    });
  }
  // Remove edge nodes connected to a pip, deleting the edge and all its connections
  static cleanEdgesOnPip(conns, id, pip, subtree) {
    const edgeIds = [];
    for (const c of conns) {
      const match = (c.a === id && c.pipA === pip) || (c.b === id && c.pipB === pip);
      if (!match) continue;
      const otherId = c.a === id ? c.b : c.a;
      const other = subtree.find(n => n.value.id === otherId);
      if (other && Utils.hasAffordance(other, 'setPipPos')) edgeIds.push(otherId);
    }
    for (const edgeId of edgeIds) {
      ConnHelper.removeFor(conns, edgeId);
      const idx = subtree.findIndex(n => n.value.id === edgeId);
      if (idx >= 0) subtree.splice(idx, 1);
    }
  }
  static add(conns, aId, aPip, bId, bPip) {
    if (PipHelper.pipUsed(conns, aId, aPip) || PipHelper.pipUsed(conns, bId, bPip)) return false;
    conns.push({ a: aId, pipA: aPip, b: bId, pipB: bPip });
    return true;
  }

  static breakStrained(conns, getPipsFn, subtree, maxDist) {
    const nodeMap = new Map(subtree.map(c => [c.value.id, c]));
    for (let i = conns.length - 1; i >= 0; i--) {
      const c = conns[i];
      const na = nodeMap.get(c.a), nb = nodeMap.get(c.b);
      if (!na || !nb) { conns.splice(i, 1); continue; }
      const pa = getPipsFn(na)[c.pipA], pb = getPipsFn(nb)[c.pipB];
      if (Geo.dist(pa, pb) > maxDist) conns.splice(i, 1);
    }
  }
  static component(conns, startId) {
    const vis = new Set([startId]), q = [startId];
    while (q.length) {
      for (const c of ConnHelper.forNode(conns, q.shift())) {
        if (!vis.has(c.other)) { vis.add(c.other); q.push(c.other); }
      }
    }
    return vis;
  }
}
//-- endfile --

//<< import { ConeEngine } from './cone-engine.js';
//-- file: ./cone-engine.js --
//>> export { ConeEngine };
class ConeEngine {
  static compute(n, tilt, angle) {
    let bestA = 0, bestD = Infinity, bestType = 'edge';
    for (let i = 0; i < n; i++) {
      const ca = Geo.norm(tilt + (i * Geo.TAU) / n - Geo.PI);
      const cd = Geo.adiff(angle, ca);
      if (cd < bestD) { bestD = cd; bestA = ca; bestType = 'corner'; }
      const ea = Geo.norm(tilt + ((i + 0.5) * Geo.TAU) / n - Geo.PI);
      const ed = Geo.adiff(angle, ea);
      if (ed < bestD) { bestD = ed; bestA = ea; bestType = 'edge'; }
    }
    return { center: bestA, half: bestType === 'corner' ? Geo.PI / n : Geo.TAU / n };
  }
  static walkGroup(dragId, cone, subtree, conns) {
    const findNode = id => subtree.find(c => c.value.id === id);
    const dt = findNode(dragId);
    if (!dt) return new Set([dragId]);
    const group = new Set([dragId]), q = [dragId];
    while (q.length) {
      for (const c of ConnHelper.forNode(conns, q.shift())) {
        if (group.has(c.other)) continue;
        const ot = findNode(c.other);
        if (!ot) continue;
        const a = Math.atan2(ot._sy - dt._sy, ot._sx - dt._sx);
        if (Geo.adiff(cone.center, a) <= cone.half + 0.01) { group.add(c.other); q.push(c.other); }
      }
    }
    return group;
  }
}
//-- endfile --

//<< import { SnapEngine } from './snap-engine.js';
//-- file: ./snap-engine.js --
//>> export { SnapEngine };
class SnapEngine {
  static find(groupIds, maxDist, subtree, conns, getPipsFn) {
    const snaps = [];
    for (const gn of subtree) {
      if (!groupIds.has(gn.value.id)) continue;
      const gps = getPipsFn(gn);
      for (let gi = 0; gi < gps.length; gi++) {
        if (PipHelper.pipUsedDirect(conns, gn.value.id, gi, subtree)) continue;
        for (const on of subtree) {
          if (groupIds.has(on.value.id)) continue;
          const ops = getPipsFn(on);
          for (let oi = 0; oi < ops.length; oi++) {
            if (PipHelper.pipUsedDirect(conns, on.value.id, oi, subtree)) continue;
            if (!Geo.pipsOpposite(gps[gi].out, ops[oi].out)) continue;
            const d = Geo.dist(gps[gi], ops[oi]);
            if (d < maxDist) snaps.push({
              gId: gn.value.id, gPip: gi, oId: on.value.id, oPip: oi,
              dx: ops[oi].x - gps[gi].x, dy: ops[oi].y - gps[gi].y, dist: d,
            });
          }
        }
      }
    }
    return snaps.sort((a, b) => a.dist - b.dist);
  }

  static apply(groupIds, snapDist, subtree, conns, getPipsFn) {
    const snaps = SnapEngine.find(groupIds, snapDist, subtree, conns, getPipsFn);
    if (!snaps.length) return false;
    const s = snaps[0];
    for (const n of subtree) {
      if (groupIds.has(n.value.id)) { n.value.x += s.dx; n.value.y += s.dy; }
    }
    // Clean edges off the snapping pips, then form the direct connection
    PipHelper.cleanEdgesOnPip(conns, s.gId, s.gPip, subtree);
    PipHelper.cleanEdgesOnPip(conns, s.oId, s.oPip, subtree);
    PipHelper.add(conns, s.gId, s.gPip, s.oId, s.oPip);
    
    let again = true;
    while (again) {
      again = false;
      for (const gn of subtree) {
        if (!groupIds.has(gn.value.id)) continue;
        const gps = getPipsFn(gn);
        for (let gi = 0; gi < gps.length; gi++) {
          if (PipHelper.pipUsedDirect(conns, gn.value.id, gi, subtree)) continue;
          for (const on of subtree) {
            if (groupIds.has(on.value.id)) continue;
            const ops = getPipsFn(on);
            for (let oi = 0; oi < ops.length; oi++) {
              if (PipHelper.pipUsedDirect(conns, on.value.id, oi, subtree)) continue;
              if (!Geo.pipsOpposite(gps[gi].out, ops[oi].out)) continue;
              if (Geo.dist(gps[gi], ops[oi]) < 2) {
                PipHelper.cleanEdgesOnPip(conns, gn.value.id, gi, subtree);
                PipHelper.cleanEdgesOnPip(conns, on.value.id, oi, subtree);
                PipHelper.add(conns, gn.value.id, gi, on.value.id, oi);
                again = true;
              }
            }
          }
        }
      }
    }
    return true;
  }
}
//-- endfile --

function hexToRgb(hex) {
  hex = (hex || '#888888').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  if (hex.length === 8) hex = hex.slice(0, 6);
  const n = parseInt(hex, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function shiftColor({ r, g, b }, amt) {
  const f = v => Math.round(Math.min(255, Math.max(0, amt > 0 ? v + (255 - v) * amt : v + v * amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  else {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
  }
}

class SubtreeIterator {
  constructor() { this.index = 0; }
  next(subtree) {
    if (this.index >= subtree.length) return null;
    return subtree[this.index++];
  }
}

//<< import { SceneRegistry } from './scene-registry.js';
//-- file: ./scene-registry.js --
//>> export { SceneRegistry };
class SceneRegistry {
  constructor() {
    this.handlers = {};
    this.meta = {};
  }

  hasCtxMix(fn, name) {
    const fnStr = fn.toString().trim();
    const codeOnly = fnStr.replace(/\/\*[\s\S]*?\*\/|\/\/.*/g, '');
    const match = codeOnly.match(/^[^(]*\(\s*([^,)\s]+)/);
    let firstParam = '';
    if (match) firstParam = match[1];
    else {
      const arrowMatch = codeOnly.match(/^([^=()\s]+)\s*=>/);
      if (arrowMatch) firstParam = arrowMatch[1];
    }
    return firstParam === 'ctxMix';
  }
  
  _hasHandler(nodeType, name) { return !!this.handlers[nodeType]?.[name]; }

  registerNodeClass(nodeType, nodeClass, defaultParams=null) {
    const proto = nodeClass.prototype;
    for (let cls = nodeClass; cls && cls !== Function.prototype; cls = Object.getPrototypeOf(cls)) {
      for (const name of Object.getOwnPropertyNames(cls)) {
        if (['length', 'name', 'prototype'].includes(name)) continue;
        const method = cls[name];
        if (typeof method !== 'function') continue;
        if (this.hasCtxMix(method, name)) {
          if (!this._hasHandler?.(nodeType, name)) {
            this._registerHandler(nodeType, name, (ctxMix, node, params, child) => {
              return nodeClass[name](ctxMix, node, params, child);
            });
          }
        }
      }
    }
    this.meta[nodeType] = { nodeClass, defaultParams, ...(nodeClass.meta || {}) };
  }

  _registerHandler(nodeType, phase, handler) {
    if (!this.handlers[phase]) this.handlers[phase] = {};
    this.handlers[phase][nodeType] = handler;
  }

  dispatch(ctxMix, phase, node, params, child) {
    const phaseHandlers = this.handlers[phase];
    if (!phaseHandlers) return;
    const meta = this.meta[node.type];
    const mergedParams = meta?.defaultParams ? { ...meta.defaultParams, ...params } : params;
    const handler = phaseHandlers[node.type] || phaseHandlers['default'];
    if (handler) return handler(ctxMix, node, mergedParams, child);
  }
  
  hasPhase(nodeType, phase) { return !!this.handlers[phase]?.[nodeType]; }

  walkPhase(ctxMix, phase, node, params) {
    if (!node) return;
    
    if (!node?.subtree || node?.subtree?.length === 0) {
      this.dispatch(ctxMix, phase, node, params);
      return;
    }
    
    if (!ctxMix.iterators) ctxMix.iterators = [];
    ctxMix.iterators.push(new SubtreeIterator());
    
    this.dispatch(ctxMix, 'before_' + phase, node, params);
    
    let child;
    while ((child = ctxMix.iterators.at(-1).next(node.subtree)) !== null) {
      if (ctxMix.abortPhase) break; 

      this.dispatch(ctxMix, 'before_child_' + phase, node, params, child);
      if (ctxMix.abortPhase) break; 
      
      this.walkPhase(ctxMix, phase, child, params);
      if (ctxMix.abortPhase) break; 
      
      this.dispatch(ctxMix, 'after_child_' + phase, node, params, child);
      if (ctxMix.abortPhase) break;
    }
    ctxMix.abortPhase = false;
    
    this.dispatch(ctxMix, 'after_' + phase, node, params);
    ctxMix.iterators.pop();
  }
}

let sceneRegistry = new SceneRegistry();
//-- endfile --

//<< import { Utils } from './utils.js';
//-- file: ./utils.js --
//>> export { Utils };
class Utils {
  static classOfNode(node) {
    if (!node) return null;
    return sceneRegistry.meta[node.type]?.nodeClass || null;
  }
  static hasAffordance(node, phaseName) {
    return node && sceneRegistry.hasPhase(node.type, phaseName);
  }
}

//-- endfile --

//<< import { PipperNode } from './pipper-node.js';
//-- file: ./pipper-node.js --
//>> export { PipperNode };
class PipperNode {
  // 1. Z-Sorting and Controller Layout
  static layout(ctxMix, node, params) {
    node.subtree.sort((a, b) => {
      const az = Utils.classOfNode(a)?.meta?.zOrder ?? 0;
      const bz = Utils.classOfNode(b)?.meta?.zOrder ?? 0;
      return az - bz;
    });
    
    const ctrls = node.value.controllers || [];
    ctrls.forEach(c => c.layout?.(node, params));
  }

  // 2. Intercept Pip Hit Testing BEFORE checking child bodies
  static before_hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt || ctxMix.hoverOnly) return;

    const sub = node.subtree;
    const ctrls = node.value.controllers || [];

    // Test top-down (reverse z-order)
    for (let i = sub.length - 1; i >= 0; i--) {
      const child = sub[i];
      const cls = Utils.classOfNode(child);

      if (Utils.hasAffordance(child, 'setPipPos') && cls.getPips) {
        const pips = cls.getPips(ctxMix, child, params);
        
        for (let pi = 0; pi < pips.length; pi++) {
          const ox = pt.x - pips[pi].x;
          const oy = pt.y - pips[pi].y;
          
          // Cheap distance test first
          if (Math.hypot(ox, oy) > 10) continue;
          
          // Expensive controller traversal only if we are physically hitting the pip
          const isPipUsed = ctrls.some(c => c.isPipUsed?.(node, child.value.id, pi));
          if (isPipUsed) continue;
          
          ctxMix.hitResult = {
            node: child, 
            interactions: { 
              applyDrag(wx, wy) { cls.setPipPos(null, child, {idx: pi, x: wx - ox, y: wy - oy}); },
              endDrag(onStrip) {
                if (onStrip) {
                  const idx = sub.indexOf(child);
                  if (idx >= 0) sub.splice(idx, 1);
                }
              }
            }
          };
          
          // Let controllers wrap the pip drag (e.g., for snapping)
          ctrls.forEach(c => c.wrapHit?.(ctxMix, node, ctxMix.hitResult, params, { pipIdx: pi }));
          
          ctxMix.abortPhase = true; // We hit a pip; skip testing bodies!
          return;
        }
      }
    }
  }

  // 3. Wrap standard body drags if no pip was hit
  static after_child_hit_test(ctxMix, node, params, child) {
    if (ctxMix.hitResult && ctxMix.hitResult.node === child && !ctxMix.hoverOnly) {
       const inner = ctxMix.hitResult.interactions;
       const sub = node.subtree;
       const ctrls = node.value.controllers || [];

       ctxMix.hitResult.interactions = {
          applyDrag: (wx, wy) => { if (inner?.applyDrag) inner.applyDrag(wx, wy); },
          endDrag: (onStrip) => {
             if (inner?.endDrag) inner.endDrag(onStrip);
             if (onStrip) {
                 const idx = sub.indexOf(child);
                 if (idx >= 0) sub.splice(idx, 1);
                 
                 // Clean up orphaned connections
                 const conns = node.value.connections;
                 if (conns) {
                   for (let k = conns.length - 1; k >= 0; k--) {
                     if (conns[k].a === child.value.id || conns[k].b === child.value.id) conns.splice(k, 1);
                   }
                 }
             }
          }
       };

       // Let controllers wrap the body drag (e.g., Raft dragging)
       ctrls.forEach(c => c.wrapHit?.(ctxMix, node, ctxMix.hitResult, params));
       ctxMix.abortPhase = true; // Stop testing nodes underneath this one
    }
  }

  // 4. Draw the pips for a child immediately after drawing the child itself
  static after_child_draw2d(ctxMix, node, params, child) {
    const cls = Utils.classOfNode(child);
    if (!cls || !cls.getPips) return;

    const pips = cls.getPips(ctxMix, child, params);
    const ctrls = node.value.controllers || [];
    const ctx = ctxMix.ctx;

    for (let i = 0; i < pips.length; i++) {
      let bestState = 'default';
      for (const ctrl of ctrls) {
        if (ctrl.classifyPip) {
          const state = ctrl.classifyPip(node, child.value.id, i);
          if (state === 'snapping') bestState = 'snapping';
          else if (state === 'near' && bestState !== 'snapping') bestState = 'near';
          else if (state === 'connected' && bestState === 'default') bestState = 'connected';
        }
      }
      PipperNode._drawPipShape(ctx, pips[i].x, pips[i].y, bestState);
    }
  }

  // 5. Draw floating/extra affordances (like edge split markers) after everything
  static after_draw2d(ctxMix, node, params) {
    const ctrls = node.value.controllers || [];
    for (const ctrl of ctrls) {
      if (ctrl.getExtraAffordances) {
        for (const extra of ctrl.getExtraAffordances(node)) {
          PipperNode._drawPipShape(ctxMix.ctx, extra.x, extra.y, extra.state, extra.rBonus);
        }
      }
    }
  }

  // Helper for pip rendering

        { x: v.x1, y: v.y1, out: a + Math.PI }, 
        { x: v.x2, y: v.y2, out: a }
    ]; 
  }
  static setPipPos(ctxMix, node, params) {

    else                  { node.value.x2 = params.x; node.value.y2 = params.y; }
  }
  static getSnapSegments(ctxMix, node, params) {
    return [{ x1: node.value.x1, y1: node.value.y1, x2: node.value.x2, y2: node.value.y2 }];
  }
  static setXY(ctxMix, node, params){
    node.value.x1 = params.x - 18; node.value.y1 = params.y; 
    node.value.x2 = params.x + 18; node.value.y2 = params.y; 
  }
  static _curveTo(ctx, v, bend) {
    if (Math.abs(bend) > 0.001) {
      const mx = (v.x1 + v.x2) / 2, my = (v.y1 + v.y2) / 2, dx = v.x2 - v.x1, dy = v.y2 - v.y1;
      const len = Math.sqrt(dx * dx + dy * dy) || 1, bulge = len * Math.tan(bend / 2) / 2;

    const w = params.edgeWidth ?? 6, outline = params.edgeOutline ?? 1, bend = params.edgeBend ?? 0;
    if (outline > 0) {
      ctx.beginPath(); ctx.moveTo(v.x1, v.y1); PippedEdgeRefNode._curveTo(ctx, v, bend);
      ctx.strokeStyle = '#aa8'; ctx.lineWidth = w + outline * 2; ctx.lineCap = 'round'; ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(v.x1, v.y1); PippedEdgeRefNode._curveTo(ctx, v, bend);
    ctx.strokeStyle = '#557'; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();

    if (params.indicatedIds && params.indicatedIds.has(v.id)) {
      ctx.beginPath(); ctx.moveTo(v.x1, v.y1); PippedEdgeRefNode._curveTo(ctx, v, bend);
      ctx.setLineDash([4, 4]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;

    }
  }
  static hit_test(ctxMix, node, params) {

    if (lenSq < 1) return;

      node, interactions: { applyDrag(wx, wy) {
        const cx = wx - ox, cy = wy - oy;
        node.value.x1 = cx - hdx; node.value.y1 = cy - hdy;
        node.value.x2 = cx + hdx; node.value.y2 = cy + hdy;
      }}
    };
  }
}

//<< import { FractureConeNode } from './fracture-cone-node.js';
//-- file: ./fracture-cone-node.js --
//>> export { FractureConeNode };
class FractureConeNode {
    static draw2d(ctxMix, node, params) {
        const target = node.value.target;
        const drag = target.value._raftDrag;
        if (!drag || !drag.cone || drag.phase !== 'preLock') return;
        
        const ctx = ctxMix.ctx;
        const dt = target.subtree.find(c => c.value.id === drag.nodeId);
        if(!dt) return;

        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.beginPath();
        ctx.moveTo(dt._sx, dt._sy);
        ctx.arc(dt._sx, dt._sy, 140, drag.cone.center - drag.cone.half, drag.cone.center + drag.cone.half);
        ctx.closePath();
        ctx.fillStyle = '#6699ee';
        ctx.fill();

        if (drag.previewGroup) {
            for (const id of drag.previewGroup) {
                if (id === drag.nodeId) continue;
                const t = target.subtree.find(c => c.value.id === id);
                if (!t) continue;
                ctx.globalAlpha = 0.25;
                const cls = Utils.classOfNode(t);
                const verts = cls.getVerts ? cls.getVerts(ctxMix, {value:{...t.value, x: t._sx, y: t._sy}}, params) : [];
                if (verts.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(verts[0].x, verts[0].y);
                    for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
                    ctx.closePath();
                    ctx.fillStyle = '#6699ee';
                    ctx.fill();
                }
            }
        }
        ctx.restore();
    }
}

//<< import { RaftSnapController } from './raft-snap-controller.js';
//-- file: ./raft-snap-controller.js --
//>> export { RaftSnapController };
class RaftSnapController {
  constructor() { this.drag = null; }

  layout(collNode, params) {} 

  // Find the edge snap controller (if any) from the controllers list
  _edgeCtrl(collNode) {
    return (collNode.value.controllers || []).find(c => c.layout && c.formConnections);
  }

  // After computing raftable group, include edges whose BOTH body-node neighbors are in the group
  _expandGroupWithEdges(group, subtree, conns) {
    let added = true;
    while (added) {
      added = false;
      for (const c of subtree) {
        if (group.has(c.value.id)) continue;
        if (!Utils.hasAffordance(c, 'setPipPos')) continue;
        const nodeConns = ConnHelper.forNode(conns, c.value.id);
        if (nodeConns.length > 0 && nodeConns.every(nc => group.has(nc.other))) {
          group.add(c.value.id);
          added = true;
        }
      }
    }
  }

  // For solo blocks at lock-in: convert direct boundary connections into edge-mediated ones
  // so the block stays visually linked to the raft it's being pulled from.
  _spawnBoundaryEdges(groupIds, conns, subtree, collNode, params) {
    const ec = this._edgeCtrl(collNode);
    if (!ec || !sceneRegistry.meta[ec.edgeType]) return;
    const getPF = (n) => {
      const cls = Utils.classOfNode(n);
      return cls.getPips ? cls.getPips({getXY: (m, nd) => ({x: nd.value.x, y: nd.value.y})}, n, params) : [];
    };
    for (let i = conns.length - 1; i >= 0; i--) {
      const c = conns[i];
      if (groupIds.has(c.a) === groupIds.has(c.b)) continue;
      const na = subtree.find(n => n.value.id === c.a);
      const nb = subtree.find(n => n.value.id === c.b);
      if (!na || !nb) continue;
      // Only convert direct body-to-body connections
      if (Utils.hasAffordance(na, 'setPipPos') || Utils.hasAffordance(nb, 'setPipPos')) continue;
      const pA = getPF(na)[c.pipA], pB = getPF(nb)[c.pipB];
      if (!pA || !pB) continue;
      const edge = makeNode(ec.edgeType, { x1: pA.x, y1: pA.y, x2: pB.x, y2: pB.y });
      subtree.push(edge);
      conns.splice(i, 1);
      conns.push({ a: edge.value.id, pipA: 0, b: c.a, pipB: c.pipA });
      conns.push({ a: edge.value.id, pipA: 1, b: c.b, pipB: c.pipB });
    }
  }

  // Only break direct body-to-body boundary connections.
  // Edge-mediated connections are preserved so edges stretch during raft drags.
  _breakRaftBoundary(conns, groupIds, subtree) {
    for (let i = conns.length - 1; i >= 0; i--) {
      const c = conns[i];
      if (groupIds.has(c.a) === groupIds.has(c.b)) continue;
      const na = subtree.find(n => n.value.id === c.a);
      const nb = subtree.find(n => n.value.id === c.b);
      if ((na && Utils.hasAffordance(na, 'setPipPos')) || (nb && Utils.hasAffordance(nb, 'setPipPos'))) continue;
      conns.splice(i, 1);
    }
  }

  wrapHit(ctxMix, collNode, hitResult, params, endpointInfo) {
     if (endpointInfo) return;

     const childNode = hitResult.node;
     if (!Utils.classOfNode(childNode)?.meta?.raftable) return;

     const conns = collNode.value.connections;
     const subtree = collNode.subtree;
     const inner = hitResult.interactions;

     // Snapshot all positions at drag start
     for (const c of subtree) { c._sx = c.value.x; c._sy = c.value.y; }

     const comp = PipHelper.component(conns, childNode.value.id);
     const back = [], front = [];
     for (const c of subtree) (comp.has(c.value.id) ? front : back).push(c);
     subtree.length = 0; subtree.push(...back, ...front);

     this.drag = {
        nodeId: childNode.value.id,
        ox: ctxMix.hitPoint.x - childNode.value.x,
        oy: ctxMix.hitPoint.y - childNode.value.y,
        startWx: ctxMix.hitPoint.x,
        startWy: ctxMix.hitPoint.y,
        phase: 'preLock',
        group: new Set([childNode.value.id]),
        cone: null,
        previewGroup: null,
        snaps: []
     };
     
     collNode.value._raftDrag = this.drag;

     const getPF = (n) => {
         const cls = Utils.classOfNode(n);
         return cls.getPips ? cls.getPips({getXY: (m, node) => ({x: node.value.x, y: node.value.y})}, n, params) : [];
     };
     
     const lockIn = 8, snapD = 12, fracD = 5;

     hitResult.interactions = {
        applyDrag: (wx, wy) => {
            const dt = subtree.find(c => c.value.id === this.drag.nodeId);
            if (!dt) return;
            const totalDist = Geo.dist2(wx, wy, this.drag.startWx, this.drag.startWy);

            if (this.drag.phase === 'preLock') {
                inner.applyDrag(wx, wy); 

                const computeCone = (angle) => {
                    const cp = Utils.classOfNode(dt)?.meta?.coneParams?.(dt) ?? { n: 4, tilt: 0 };
                    return ConeEngine.compute(cp.n, cp.tilt, angle);
                };

                if (totalDist > 3) {
                    const a = Math.atan2(wy - this.drag.startWy, wx - this.drag.startWx);
                    this.drag.cone = computeCone(a);
                    this.drag.previewGroup = ConeEngine.walkGroup(this.drag.nodeId, this.drag.cone, subtree, conns);
                }
                if (totalDist > lockIn) {
                    const a = Math.atan2(wy - this.drag.startWy, wx - this.drag.startWx);
                    this.drag.cone = computeCone(a);
                    this.drag.group = ConeEngine.walkGroup(this.drag.nodeId, this.drag.cone, subtree, conns);
                    // Include edges that connect group members so they travel with the raft
                    this._expandGroupWithEdges(this.drag.group, subtree, conns);
                    this.drag.previewGroup = null;
                    this.drag.phase = 'locked';
                    // Solo block pulled off a raft: convert direct connections to edges
                    const raftableBodies = [...this.drag.group].filter(id => {
                        const n = subtree.find(c => c.value.id === id);
                        return n && Utils.classOfNode(n)?.meta?.raftable;
                    });
                    if (raftableBodies.length === 1) {
                        this._spawnBoundaryEdges(this.drag.group, conns, subtree, collNode, params);
                    }
                    this._breakRaftBoundary(conns, this.drag.group, subtree);
                }

                // Keep edges following during preLock movement
                const ec = this._edgeCtrl(collNode);
                if (ec) ec.layout(collNode, params);

            } else {
                // Locked phase: move group by offset from original snapshot
                const intentX = wx - this.drag.ox;
                const intentY = wy - this.drag.oy;
                const diffX = intentX - dt._sx;
                const diffY = intentY - dt._sy;

                for (const c of subtree) {
                    if (this.drag.group.has(c.value.id)) {
                        if (typeof c._sx === 'number') {
                            c.value.x = c._sx + diffX;
                            c.value.y = c._sy + diffY;
                        }
                    } else {
                        // Hold non-group nodes at their snapshot positions
                        if (typeof c._sx === 'number') {
                            c.value.x = c._sx;
                            c.value.y = c._sy;
                        }
                    }
                }
                // Update edge endpoints to follow their connected body nodes
                const ec = this._edgeCtrl(collNode);
                if (ec) ec.layout(collNode, params);
            }

            if (this.drag.phase === 'locked' || this.drag.phase === 'preLock') {
               this.drag.snaps = SnapEngine.find(this.drag.group, snapD, subtree, conns, getPF);
            }
        },
        endDrag: (onStockStrip) => {
            const isSolo = this.drag.group.size === 1 ||
                // Solo means one raftable body in the group (rest are edges)
                [...this.drag.group].filter(id => {
                    const n = subtree.find(c => c.value.id === id);
                    return n && Utils.classOfNode(n)?.meta?.raftable;
                }).length === 1;

            if (onStockStrip) {
                for (const id of this.drag.group) {
                    ConnHelper.removeFor(conns, id);
                    const idx = subtree.findIndex(c => c.value.id === id);
                    if (idx >= 0) subtree.splice(idx, 1);
                }
            } else {
                const snapped = SnapEngine.apply(this.drag.group, snapD, subtree, conns, getPF);
                if (!snapped && this.drag.phase === 'preLock') {
                    // Revert all nodes to drag-start positions
                    for (const c of subtree) {
                        if (typeof c._sx === 'number') { c.value.x = c._sx; c.value.y = c._sy; }
                    }
                }

                const ec = this._edgeCtrl(collNode);
                // Update edges to follow snapped positions BEFORE checking strain
                ec?.layout(collNode, params);
                PipHelper.breakStrained(conns, getPF, subtree, fracD);

                // For solo blocks: let edge controller create new edge connections
                if (ec && isSolo) {
                    ec.formConnections(collNode, params, this.drag.nodeId);
                }
                ec?.layout(collNode, params);
            }
            // Clean up
            for (const c of subtree) { delete c._sx; delete c._sy; }
            BasicCollectionNode._sortSubtree(subtree);
            if (inner.endDrag) inner.endDrag(onStockStrip);
            this.drag = null; collNode.value._raftDrag = null;
        }
     };
  }

  classifyPip(collNode, childId, pipIndex) {
      if (!this.drag || !this.drag.snaps) return 'default';
      for (const s of this.drag.snaps) {
          if ((s.gId === childId && s.gPip === pipIndex) || (s.oId === childId && s.oPip === pipIndex)) {
              return 'snapping';
          }
      }
      return 'default';
  }
}

//<< import { EdgeSnapController } from './edge-snap-controller.js';

//>> export { EdgeSnapController };
class EdgeSnapController {
  static SNAP_DIST = 12;

  constructor(edgeType = 'pipped-edge') { this.edgeType = edgeType; }

  _getPips(node, params) {
    const cls = Utils.classOfNode(node);
    return cls && cls.getPips ? cls.getPips({ getXY: (m, n) => ({x: n.value.x, y: n.value.y}) }, node, params) : [];
  }
  _findNode(sub, id) { return sub.find(c => c.value.id === id); }
  isPipUsed(collNode, id, pip) { return collNode.value.connections.some(c => (c.a === id && c.pipA === pip) || (c.b === id && c.pipB === pip)); }
  _connExists(conns, idA, pipA, idB, pipB) {
    return conns.some(c => (c.a === idA && c.pipA === pipA && c.b === idB && c.pipB === pipB) ||
                           (c.a === idB && c.pipA === pipB && c.b === idA && c.pipB === pipA));
  }

  layout(collNode, params) {
    const conns = collNode.value.connections, sub = collNode.subtree;
    for (let pass = 0; pass < 2; pass++) {
      for (const c of conns) {

        if (!na || !nb) continue;
        const pA = this._getPips(na, params)[c.pipA], pB = this._getPips(nb, params)[c.pipB];

        const aIsEdge = Utils.hasAffordance(na, 'setPipPos'), bIsEdge = Utils.hasAffordance(nb, 'setPipPos');
        if (aIsEdge && !bIsEdge) {
          const cls = Utils.classOfNode(na);
          if(cls && cls.setPipPos) cls.setPipPos(null, na, {idx: c.pipA, x: pB.x, y: pB.y});
        }
        else if (bIsEdge && !aIsEdge) {
          const cls = Utils.classOfNode(nb);

  formConnections(collNode, params, movedId) {

          newEdges.push(edge);
          newConns.push({ a: movedId, pipA: mi, b: edge.value.id, pipB: 0 });
          newConns.push({ a: bestNode.value.id, pipA: bestPip, b: edge.value.id, pipB: 1 });

      if (other && Utils.hasAffordance(other, 'setPipPos')) depIds.add(otherId);

    this._removeConns(conns, childId);
    const ci = sub.findIndex(c => c.value.id === childId);
    if (ci >= 0) sub.splice(ci, 1);
    for (const eid of depIds) {
      this._removeConns(conns, eid);
      const ei = sub.findIndex(c => c.value.id === eid);

  _splitEdgeAtJunction(collNode, params, junction, snap) {

    const edge = this._findNode(sub, snap.edgeId);
    if (!edge) return;
    const jId = junction.value.id, eId = edge.value.id;
    junction.value.x = snap.x; junction.value.y = snap.y;
    const grp = edge.value.group;
    if (grp) junction.value.group = grp;

    for (const c of conns) {
      if (c.a === eId && c.pipA === 0) pip0Target = { id: c.b, pip: c.pipB };
      else if (c.b === eId && c.pipB === 0) pip0Target = { id: c.a, pip: c.pipA };
      if (c.a === eId && c.pipA === 1) pip1Target = { id: c.b, pip: c.pipB };
      else if (c.b === eId && c.pipB === 1) pip1Target = { id: c.a, pip: c.pipA };

    conns.push({ a: edgeB.value.id, pipA: 0, b: jId, pipB: 0 });

      applyDrag: (wx, wy) => {
        inner.applyDrag(wx, wy);
        this.layout(collNode, params);
        this._scanNearPips(collNode, params, childId);
        if (Utils.classOfNode(child)?.meta?.canSnapToEdge) this._scanSnapEdge(collNode, params, childId);

      endDrag: (onStockStrip) => {
        collNode.value._nearPips = null;

        collNode.value._snapEdge = null;

function hexToRgba(hex, alpha) {
  hex = (hex || '#888888').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  if (hex.length === 8) hex = hex.slice(0, 6);
  const n = parseInt(hex, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function measureWord(ctx, text, font) {
  ctx.font = font;
  ctx.textBaseline = 'alphabetic'; // <-- Add this line to fix the offset
  
  const m = ctx.measureText(text);
  const asc = m.actualBoundingBoxAscent  || m.emHeightAscent  || 0;
  const dsc = m.actualBoundingBoxDescent || m.emHeightDescent || 0;
  
  return { width: m.width, ascent: asc, descent: dsc, height: asc + dsc };
}

class StockStripNode {
  static layout(ctxMix, node) {
    const { W, H } = ctxMix.getWH();
    const stripH = node.value.height, protos = node.subtree, y = H - stripH / 2;
    const gap = Math.min(120, W / (protos.length + 1)), x0 = (W - gap * (protos.length - 1)) / 2;
    protos.forEach((p, i) => {
      const cx = x0 + gap * i, cy = y;
      const cls = Utils.classOfNode(p);
      if (cls && cls.setXY) cls.setXY(null, p, { x: cx, y: cy });

    });
  }

  static before_draw2d(ctxMix, node, params) {
    StockStripNode.layout(ctxMix, node);
    const ctx = ctxMix.ctx, { W, H } = ctxMix.getWH(), stripH = node.value.height;
    const opacity = (params.opacity ?? 100) / 100;
    
    ctx.save(); 
    ctx.globalAlpha = opacity; 
    ctx.fillStyle = '#16163a'; 
    ctx.fillRect(0, H - stripH, W, stripH); 
    ctx.restore();
    
    ctx.strokeStyle = '#282850'; ctx.lineWidth = 1; 
    ctx.beginPath(); ctx.moveTo(0, H - stripH); ctx.lineTo(W, H - stripH); ctx.stroke();
  }

  static before_child_draw2d(ctxMix, node, params, child) {
    ctxMix.ctx.save();
    ctxMix.ctx.globalAlpha = 0.5;
  }

  static after_child_draw2d(ctxMix, node, params, child) {
    const ctx = ctxMix.ctx, cls = Utils.classOfNode(child);
    let cx = child.value.x, cy = child.value.y;
    
    if (cls && cls.getCentreXY) {
      const center = cls.getCentreXY(ctxMix, child, params);
      cx = center.x; cy = center.y;
    }

    if (cls && cls.getPips) {
      for (const p of cls.getPips({ getXY: () => ({x: cx, y: cy}) }, child, params)) {
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Geo.TAU);

  static before_hit_test(ctxMix, node, params) {

class Camera {
  constructor() { this.ox = 0; this.oy = 0; this.z = 1; }
  toWorld(sx, sy)  { return { x: sx / this.z + this.ox, y: sy / this.z + this.oy }; }
  toScreen(wx, wy) { return { x: (wx - this.ox) * this.z, y: (wy - this.oy) * this.z }; }
  apply(ctx) { ctx.setTransform(this.z, 0, 0, this.z, -this.ox * this.z, -this.oy * this.z); }
  reset(ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); }
  pan(dsx, dsy) { this.ox -= dsx / this.z; this.oy -= dsy / this.z; }
  zoomAt(sx, sy, factor) {
    const wp = this.toWorld(sx, sy);
    this.z = Math.max(0.15, Math.min(5, this.z * factor));
    this.ox = wp.x - sx / this.z; this.oy = wp.y - sy / this.z;
  }
}

class SeedModel{
  get name() { return 'Load Starter Set'; }
  get btnClass() { return 'green'; }
  load(app) {
    app.clearAll();
    const step = R * Math.cos(Math.PI / 4) * 2;
    const wc = app.cam.toWorld(app.W / 2, (app.H - app.stockNode.value.height) / 2);
    const sub = app.collNode.subtree;
    
    for (let row = -1; row <= 1; row++) {
      for (let col = -1; col <= 1; col++) {
        sub.push(makeNode('pipped-polygon', { x: wc.x + col * step, y: wc.y + row * step, r: R, n: 4, tilt: Math.PI / 4 }));
      }
    }
    BasicCollectionNode._sortSubtree(sub);
    
    if( typeof PipHelper !== 'undefined')
      this.makeConnections(app,sub);
    app.centerOnWorld(wc.x, wc.y);
  }

  makeConnections(app,sub){
    const conns = app.collNode.value.connections;
    const nodes = sub.filter(n => n.type === 'pipped-polygon');
    
    // Auto-connect properly positioned starter tiles
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const ap = PippedPolygonNode.getPips({getXY:(m,n)=>({x:n.value.x,y:n.value.y})}, nodes[i], app.params);
        const bp = PippedPolygonNode.getPips({getXY:(m,n)=>({x:n.value.x,y:n.value.y})}, nodes[j], app.params);
        for (let ai = 0; ai < ap.length; ai++) {
          for (let bi = 0; bi < bp.length; bi++) {
            if (Geo.pipsOpposite(ap[ai].out, bp[bi].out) && Geo.dist(ap[ai], bp[bi]) < 2) {
              PipHelper.add(conns, nodes[i].value.id, ai, nodes[j].value.id, bi);
            }
          }
        }
      }
    }
  }
}
MODELS.push( new SeedModel() )

// Generates complete (fully-connected) graphs procedurally in a radial layout





class App {
  constructor(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.cam = new Camera(); this.W = 0; this.H = 0;
    this.panState = null; this.dragHit = null; this._downPos = null; this.selectedNode = null;
    this.params = P;
    
    this.enableEdgeSnap = true;
    this.enableRaftSnap = true;
    this.edgeSnapController = typeof EdgeSnapController !== 'undefined' ? new EdgeSnapController() : null;
    this.raftSnapController = typeof RaftSnapController !== 'undefined' ? new RaftSnapController() : null;

    this.stockNode = makeNode('stock-strip', { height: 78 }, STOCK);
    
    this.collNode = makeNode('pipper-node', { 
      connections: [], 
      controllers: [
        this.edgeSnapController, 
        this.raftSnapController
      ].filter(Boolean)
    });
    this.affordanceNode = makeNode('affordance-overlay', { target: this.collNode });
    this.coneNode = makeNode('fracture-cone', { target: this.collNode });
    
    this.camNode = makeNode('camera-node', { cam: this.cam }, [ this.collNode, /*this.affordanceNode,*/ this.coneNode ]);
    this.rootNode = makeNode('scene-root', {}, [ this.camNode, this.stockNode ]);

    this._seedLayoutDone = false;

    this.resize(); this.buildHud(); this.bindInput(); this.loop();
  }

  resize() {
    this.W = this.canvas.width = window.innerWidth;
    this.H = this.canvas.height = window.innerHeight;
  }

  buildHud() {
    //const P = this.params;
    const models = MODELS;
    const modelControls = models.map(m => ({ type: 'button', label: m.name, cls: m.btnClass, action: () => m.load(this) }));

    this.hud = new HudPanel({
      title: 'Network Editor',
      position: { top: 12, left: 12 },
      controls: [
        ...modelControls,
        { type: 'button', label: 'Copy Points',      action: () => this.copyPoints() },
        { type: 'button', label: 'Clear All', cls: 'danger', action: () => this.clearAll() },
        ...CONTROLS
      ],
      onChange: (id, val) => {
        if (id === 'showHints') {
          document.getElementById('help').style.display = val ? 'block' : 'none';
        } else if (id === 'enableEdgeSnap' || id === 'enableRaftSnap') {
          this[id] = val;
          this.collNode.value.controllers = [
            this.enableEdgeSnap && this.edgeSnapController, 
            this.enableRaftSnap && this.raftSnapController
          ].filter(Boolean)
        } else {
          P[id] = val;
        }
      },
    });

    this._selPanel = document.createElement('div');
    this._selPanel.className = 'hud-panel';
    this._selPanel.style.cssText = 'position:absolute; top:12px; right:12px; display:none; min-width:220px;';
    document.body.appendChild(this._selPanel);
  }

  updateSelectedPanel() {
    const el = this._selPanel, node = this.selectedNode;
    const cls = node ? Utils.classOfNode(node) : null;
    const fields = cls?.meta?.editableFields?.(node);
    if (!node || !fields || fields.length === 0) { el.style.display = 'none'; return; }
    el.style.display = 'block'; el.innerHTML = '';
    const header = document.createElement('h3'); header.textContent = `SELECTED ${node.type.toUpperCase()}`; el.appendChild(header);
    for (const f of fields) {
      const row = document.createElement('div'); row.className = 'sel-row';
      const span = document.createElement('span'); span.textContent = f.label; row.appendChild(span);
      const inp = document.createElement('input'); inp.type = f.type; inp.value = f.value;
      inp.addEventListener('input', () => { 
        node.value[f.key] = f.type === 'number' ? Number(inp.value) : inp.value; 
      });
      row.appendChild(inp); el.appendChild(row);
    }
  }

  selectNode(node) { this.selectedNode = node; this.updateSelectedPanel(); }

  centerOnWorld(wx, wy) {
    const stripH = this.stockNode.value.height;
    this.cam.ox = wx - this.W / (2 * this.cam.z);
    this.cam.oy = wy - (this.H - stripH) / (2 * this.cam.z);
  }

  copyPoints() {
    const pts = SilhouetteModel?.extractSilhouettePoints?.(this.collNode);
    if (!pts || pts.length === 0) return;
    const text = '[\n' + pts.map(p => `  [${p[0]},${p[1]}],`).join('\n') + '\n]';
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  clearAll() {
    this.collNode.subtree.length = 0; this.collNode.value.connections.length = 0;
    this.selectNode(null);
  }

  screenPos(e) {
    if (e.touches) { const t = e.touches[0] || e.changedTouches[0]; return { x: t.clientX, y: t.clientY }; }
    return { x: e.clientX, y: e.clientY };
  }
  
  createCtxMix(sp) {
    return { 
      ctx: this.ctx, iterators: [], hitPoint: sp, hitResult: null, 
      W: this.W, H: this.H, getWH: () => ({W: this.W, H: this.H}), 
      getXY: (m, n) => ({x: n.value.x, y: n.value.y}) 
    };
  }

  _onHud(e) { return e.target.closest && e.target.closest('.hud-panel'); }

  onDown(e) {
    if (this._onHud(e)) return;
    e.preventDefault();
    const sp = this.screenPos(e); this._downPos = { x: sp.x, y: sp.y };
    const ctxMix = this.createCtxMix(sp);
    
    sceneRegistry.walkPhase(ctxMix, 'hit_test', this.rootNode, this.params);
    
    if (ctxMix.hitResult) {
      if (ctxMix.hitResult.isStockPrototype) {
        const proto = ctxMix.hitResult.node;
        const wp = this.cam.toWorld(sp.x, sp.y);
        const cls = Utils.classOfNode(proto);
        const overrides = cls?.meta?.spawnOverrides?.(wp) ?? { x: wp.x, y: wp.y };
        
        const clone = cloneProto(proto, overrides);
        this.collNode.subtree.push(clone);
        BasicCollectionNode._sortSubtree(this.collNode.subtree);
        
        const cloneWmix = this.createCtxMix(wp);
        const cloneCls = Utils.classOfNode(clone);
        cloneCls.hit_test(cloneWmix, clone, this.params);
        
        if (cloneWmix.hitResult) { 
          const ctrls = this.collNode.value.controllers;
          if (ctrls) {
            ctrls.forEach(c => c.wrapHit && c.wrapHit(cloneWmix, this.collNode, cloneWmix.hitResult, this.params));
          }
          this.dragHit = cloneWmix.hitResult; 
        }
        return;
      } else {
        if (this.selectedNode && this.selectedNode !== ctxMix.hitResult.node) this.selectNode(null);
        this.dragHit = ctxMix.hitResult;
        return;
      }
    }
    
    this.panState = { lx: sp.x, ly: sp.y };
  }

  onMove(e) {
    if (this._onHud(e)) return;
    e.preventDefault();
    const sp = this.screenPos(e);
    if (this.dragHit) {
      const wp = this.cam.toWorld(sp.x, sp.y);
      this.dragHit.interactions.applyDrag(wp.x, wp.y);
      this.canvas.style.cursor = 'grabbing'; return;
    }
    if (this.panState) {
      this.cam.pan(sp.x - this.panState.lx, sp.y - this.panState.ly);
      this.panState.lx = sp.x; this.panState.ly = sp.y;
      this.canvas.style.cursor = 'move'; return;
    }
    
    const ctxMix = this.createCtxMix(sp);
    ctxMix.hoverOnly = true;
    sceneRegistry.walkPhase(ctxMix, 'hit_test', this.rootNode, this.params);
    this.canvas.style.cursor = ctxMix.hitResult ? 'grab' : 'default';
  }

  onUp(e) {
    if (this._onHud(e)) return;
    e.preventDefault();
    const sp = this.screenPos(e), dist = this._downPos ? Math.hypot(sp.x - this._downPos.x, sp.y - this._downPos.y) : 999;
    if (this.dragHit) {
      const onStrip = sp.y > this.H - this.stockNode.value.height, draggedNode = this.dragHit.node;
      
      if (this.dragHit.interactions && typeof this.dragHit.interactions.endDrag === 'function') {
        this.dragHit.interactions.endDrag(onStrip);
      }
      
      this.dragHit = null;
      if (onStrip) {
        // Node was deleted — clear selection if it pointed to the deleted node
        if (this.selectedNode && !this.collNode.subtree.some(c => c === this.selectedNode)) {
          this.selectNode(null);
        }
      } else if (dist < 3) {
        this.selectNode(draggedNode);
      } else {
        // Drag completed — clear stale selection
        this.selectNode(null);
      }
    } else {
      if (dist < 3) this.selectNode(null);
      this.panState = null;
    }
    this._downPos = null; this.canvas.style.cursor = 'default';
  }

  onWheel(e) {
    if (this._onHud(e)) return;
    e.preventDefault();
    const sp = { x: e.clientX, y: e.clientY };
    if (sp.y > this.H - this.stockNode.value.height) return;
    this.cam.zoomAt(sp.x, sp.y, e.deltaY > 0 ? 0.9 : 1.1);
  }

  bindInput() {
    const c = this.canvas;
    c.addEventListener('mousedown',  e => this.onDown(e)); c.addEventListener('mousemove',  e => this.onMove(e));
    c.addEventListener('mouseup',    e => this.onUp(e));   c.addEventListener('mouseleave', e => this.onUp(e));
    c.addEventListener('wheel',      e => this.onWheel(e), { passive: false });
    c.addEventListener('touchstart', e => this.onDown(e),  { passive: false });
    c.addEventListener('touchmove',  e => this.onMove(e),  { passive: false });
    c.addEventListener('touchend',   e => this.onUp(e),    { passive: false });
    window.addEventListener('resize', () => this.resize());
  }

  loop() {
    if (!this._seedLayoutDone && this.W > 0 && this.H > 0) {
      MODELS[0]?.load(this);
      this._seedLayoutDone = true;
    }

    const c = this.ctx, P = this.params;
    P.indicatedIds.clear();
    if (this.selectedNode) P.indicatedIds.add(this.selectedNode.value.id);
    if (this.dragHit) P.indicatedIds.add(this.dragHit.node.value.id);

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#12122a'; c.fillRect(0, 0, this.W, this.H);
    
    const ctxMix = this.createCtxMix(null);
    sceneRegistry.walkPhase(ctxMix, 'layout', this.rootNode, P);
    sceneRegistry.walkPhase(ctxMix, 'draw2d', this.rootNode, P);

    requestAnimationFrame(() => this.loop());
  }
}
