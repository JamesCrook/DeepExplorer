<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Cascade Tool</title>
  <link rel="icon" type="image/x-icon" href="../wheel.ico">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap');

/* ═══════════════════════════════════════════════════════════════
   omni-theme.css — shared design system
   Variables, shell layout, panel system, buttons, drop zone,
   stat badges, preview modal, status bar, scrollbar.
   Tools extend this with their own domain-specific classes
   and override --panel-columns for their layout.
   ═══════════════════════════════════════════════════════════════ */

/*<< @import url('./omni-theme.css'); */
/*-- file: ./omni-theme.css --*/

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #0a0a0b; --bg-secondary: #131316; --bg-tertiary: #1a1a1f;
    --bg-hover: #222228; --border: #2a2a32; --border-focus: #4a4a55;
    --text-primary: #e8e8ec; --text-secondary: #9898a4; --text-muted: #5a5a66;
    --accent: #f59e0b; --accent-dim: #b45309;
    --success: #22c55e; --success-dim: rgba(34, 197, 94, 0.15);
    --danger: #ef4444; --danger-dim: rgba(239, 68, 68, 0.15);
    --warning: #eab308; --warning-dim: rgba(234, 179, 8, 0.15);
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'Space Grotesk', sans-serif;
    --panel-columns: 260px 1fr 1fr;
  }

  html, body { height: 100%; }
  body { font-family: var(--font-sans); background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; }

  /* ── Shell layout ──────────────────────────────────────────── */

  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }

  header {
    padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary);
  }
  header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; color: var(--text-primary); }
  header h1 span { color: var(--accent); }
  .header-left  { display: flex; align-items: center; gap: 0.75rem; }
  .header-right { display: flex; gap: 0.75rem; align-items: center; }

  main { display: grid; grid-template-columns: var(--panel-columns); overflow: hidden; }

  /* ── Panels ────────────────────────────────────────────────── */

  .panel { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel:last-child { border-right: none; }

  .panel-header {
    padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); background: var(--bg-secondary);
    font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center;
  }
  .panel-header .count {
    background: var(--bg-tertiary); padding: 0.15rem 0.5rem; border-radius: 3px;
    font-family: var(--font-mono); font-size: 0.7rem;
  }
  .panel-tabs { display: flex; gap: 0.25rem; }
  .panel-tab {
    background: none; border: none; padding: 0.2rem 0.5rem;
    font-family: var(--font-sans); font-size: 0.75rem; font-weight: 500;
    color: var(--text-muted); cursor: pointer; border-radius: 3px; transition: all 0.15s;
  }
  .panel-tab:hover { color: var(--text-secondary); background: var(--bg-tertiary); }
  .panel-tab.active { color: var(--text-primary); background: var(--bg-tertiary); }
  .panel-content { flex: 1; overflow-y: auto; padding: 0.5rem; }

  /* ── Filter row ────────────────────────────────────────────── */

  .filter-row {
    display: flex; gap: 0.25rem; padding: 0.4rem 0.5rem;
    border-bottom: 1px solid var(--border); background: var(--bg-secondary);
  }
  .filter-input {
    flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 3px;
    padding: 0.25rem 0.5rem; font-family: var(--font-mono); font-size: 0.7rem;
    color: var(--text-primary); outline: none;
  }
  .filter-input:focus { border-color: var(--accent); }
  .filter-input::placeholder { color: var(--text-muted); }
  .filter-input.active { border-color: var(--accent); background: rgba(245, 158, 11, 0.1); }
  .filter-clear {
    background: none; border: none; color: var(--text-muted);
    font-size: 1rem; cursor: pointer; padding: 0 0.25rem; line-height: 1;
  }
  .filter-clear:hover { color: var(--text-primary); }

  /* ── Buttons ───────────────────────────────────────────────── */

  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.45rem 0.85rem; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg-tertiary); color: var(--text-primary);
    font-family: var(--font-sans); font-size: 0.78rem; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--border-focus); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn svg { width: 14px; height: 14px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #000; }
  .btn-primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-danger:hover { background: #dc2626; border-color: #dc2626; }

  /* ── Toggle switch ─────────────────────────────────────────── */

  .toggle { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; }
  .toggle-track {
    width: 36px; height: 20px; background: var(--bg-tertiary); border: 1px solid var(--border);
    border-radius: 10px; position: relative; transition: all 0.2s;
  }
  .toggle-track::after {
    content: ''; position: absolute; width: 14px; height: 14px;
    background: var(--text-muted); border-radius: 50%; top: 2px; left: 2px; transition: all 0.2s;
  }
  .toggle.active .toggle-track { background: var(--accent); border-color: var(--accent); }
  .toggle.active .toggle-track::after { background: #000; left: 18px; }

  /* ── Drop zone ─────────────────────────────────────────────── */

  .drop-zone {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem; border: 2px dashed var(--border); margin: 0.5rem; border-radius: 6px;
    cursor: pointer; transition: all 0.2s;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: rgba(245,158,11,0.05); }
  .drop-zone.secondary { border-style: dotted; opacity: 0.7; padding: 1rem; }
  .drop-zone.secondary:hover { opacity: 1; }
  .drop-zone-icon { width: 48px; height: 48px; margin-bottom: 1rem; color: var(--text-muted); }
  .drop-zone p { font-size: 0.85rem; color: var(--text-secondary); text-align: center; }
  .drop-zone small { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem; }

  /* ── Stat badges ───────────────────────────────────────────── */

  .stat-badge {
    display: flex; align-items: center; gap: 0.3rem; font-family: var(--font-mono); font-size: 0.65rem;
    padding: 0.25rem 0.5rem; border-radius: 4px; background: var(--bg-tertiary); border: 1px solid var(--border);
    position: relative; cursor: default;
  }
  .stat-badge[data-tip]::after {
    content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%;
    transform: translateX(-50%); white-space: nowrap;
    background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border-focus);
    font-family: var(--font-sans); font-size: 0.7rem; font-weight: 400;
    padding: 0.3rem 0.6rem; border-radius: 4px;
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
    z-index: 100;
  }
  .stat-badge[data-tip]:hover::after { opacity: 1; }
  .stat-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .stat-badge.ok     { color: var(--success); border-color: rgba(34,197,94,0.3); }
  .stat-badge.broken { color: var(--danger);  border-color: rgba(239,68,68,0.3); }
  .stat-badge.warn   { color: var(--warning); border-color: rgba(234,179,8,0.3); }
  .stat-badge.info   { color: var(--accent);  border-color: rgba(245,158,11,0.3); }

  /* ── File / list items ─────────────────────────────────────── */

  .file-item {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.5rem;
    border-radius: 4px; font-size: 0.8rem; cursor: pointer;
  }
  .file-item:hover { background: var(--bg-hover); }
  .file-item.active { background: rgba(245, 158, 11, 0.1); border-left: 2px solid var(--accent); margin-left: -2px; }
  .file-item .filename {
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .file-item .filename:hover { color: var(--accent); }
  .file-item .ext { color: var(--accent); font-size: 0.65rem; text-transform: uppercase; flex-shrink: 0; }

  .list-item {
    display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.5rem;
    border-radius: 4px; font-size: 0.8rem; border: 1px solid transparent; margin-bottom: 0.15rem;
  }
  .list-item:hover { background: var(--bg-hover); border-color: var(--border); }
  .list-item .item-label {
    font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-primary);
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .list-item .item-meta { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-muted); flex-shrink: 0; }

  /* ── Empty state ───────────────────────────────────────────── */

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem; color: var(--text-muted); font-size: 0.8rem; text-align: center; height: 100%;
  }

  /* ── Preview modal ─────────────────────────────────────────── */

  .preview-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.2s;
  }
  .preview-overlay.visible { opacity: 1; visibility: visible; }
  .preview-modal {
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px;
    width: 90%; max-width: 800px; height: 85vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .preview-header {
    padding: 0.75rem 1rem; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .preview-header h3 { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; }
  .preview-actions { display: flex; gap: 0.4rem; align-items: center; }
  .preview-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.25rem; }
  .preview-close:hover { color: var(--text-primary); }
  .preview-content {
    padding: 1rem; overflow: auto; flex: 1;
    font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.6; white-space: pre;
  }
  .preview-line { display: flex; }
  .preview-line.highlight { background: rgba(245,158,11,0.15); margin: 0 -1rem; padding: 0 1rem; }
  .preview-line-num {
    color: var(--text-muted); width: 4ch; text-align: right;
    margin-right: 1rem; user-select: none; flex-shrink: 0;
  }
  .preview-line-text { white-space: pre; }
  .preview-editor-wrap {
    flex: 1; display: flex; overflow: hidden;
  }
  .preview-gutter {
    min-width: 3rem; padding: 1rem 0.5rem 1rem 0.75rem; text-align: right;
    font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.6;
    color: var(--text-muted); background: var(--bg-tertiary); user-select: none;
    overflow: hidden; flex-shrink: 0; border-right: 1px solid var(--border);
    box-sizing: content-box;
  }
  .preview-gutter div { line-height: 1.6; box-sizing: border-box; }
  .preview-editor {
    flex: 1; width: 0; padding: 1rem; min-height: 0;
    font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.6;
    background: var(--bg-primary); color: var(--text-primary);
    border: none; outline: none; resize: none; tab-size: 2;
    overflow: auto; white-space: pre-wrap; word-wrap: break-word;
  }
  .preview-mirror {
    position: absolute; visibility: hidden; pointer-events: none;
    font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.6;
    tab-size: 2; white-space: pre-wrap; word-wrap: break-word;
    padding: 0; border: none; overflow: hidden;
  }

  /* ── Status bar ────────────────────────────────────────────── */

  .status {
    font-size: 0.75rem; color: var(--text-muted); padding: 0.5rem 1rem;
    border-top: 1px solid var(--border); background: var(--bg-secondary); font-family: var(--font-mono);
  }
  .status.success { color: var(--success); }
  .status.error   { color: var(--danger); }

  /* ── Scrollbar ─────────────────────────────────────────────── */

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-focus); }

/*-- endfile --*/


/* ═══════════════════════════════════════════════════════════════
   dot-status.css — reusable multi-dot status indicator
   Size and gap configurable via --ds-size and --ds-gap custom
   properties on the container. Dot colour via --dot-color on
   each dot.
   ═══════════════════════════════════════════════════════════════ */

/*<< @import url('./dot-status.css'); */
/*-- file: ./dot-status.css --*/

  .ds { display: flex; gap: var(--ds-gap, 3px); flex-shrink: 0; align-items: center; }
  .ds-dot {
    width: var(--ds-size, 9px); height: var(--ds-size, 9px);
    border-radius: 50%; position: relative; flex-shrink: 0;
    background: var(--dot-color, var(--text-muted)); opacity: 0.15;
  }
  .ds-dot.active { opacity: 1; }
  .ds-dot.has-checked::after {
    content: ''; position: absolute;
    width: calc(var(--ds-size, 9px) * 0.33); height: calc(var(--ds-size, 9px) * 0.33);
    background: var(--bg-primary); border-radius: 50%;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .ds-dot.excluded { opacity: 0.55; }
  .ds-dot.excluded::after {
    content: ''; position: absolute;
    width: calc(var(--ds-size, 9px) * 0.78); height: calc(var(--ds-size, 9px) * 0.17);
    min-height: 1.5px;
    background: var(--bg-primary);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }

/*-- endfile --*/


/* ═══════════════════════════════════════════════════════════════
   Cascade-specific styles
   ═══════════════════════════════════════════════════════════════ */

  :root {
    --panel-columns: 280px 1fr 380px;
  }

  .tag-row { display: flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.4rem; border-radius: 3px; cursor: pointer; font-size: 0.78rem; min-height: 26px; user-select: none; }
  .tag-row:hover { background: var(--bg-hover); }
  .tag-row.selected { background: rgba(245,158,11,0.12); border-left: 2px solid var(--accent); margin-left: -2px; }
  .tag-row.dep-target { background: rgba(59,130,246,0.10); }
  .tag-row.dep-target .tag-name { color: var(--accent); }
  .tag-arrow { width: 14px; flex-shrink: 0; color: var(--text-muted); transition: transform 0.15s; font-size: 0.6rem; text-align: center; }
  .tag-arrow.expanded { transform: rotate(90deg); }
  .tag-arrow.leaf { visibility: hidden; }
  .tag-name { font-family: var(--font-mono); font-size: 0.75rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--accent); }
  .tag-frac { font-family: var(--font-mono); font-size: 0.55rem; color: var(--text-muted); min-width: 28px; text-align: right; flex-shrink: 0; }
  .tag-frac.all-done { color: var(--success); }
  .tag-frac.none-done { color: var(--danger); }
  .tag-idio-mark { color: var(--accent); font-size: 0.6rem; flex-shrink: 0; margin-right: 1px; }
  .tag-children { margin-left: 14px; }
  .tag-children.collapsed { display: none; }

  .file-list { flex: 1; overflow: hidden; padding: 0.4rem; display: flex; flex-direction: column; }
  .stnda-item { padding: 0.4rem 0.5rem; border-radius: 4px; margin-bottom: 0.2rem; cursor: pointer; border: 1px solid transparent; font-size: 0.78rem; }
  .stnda-item:hover { background: var(--bg-hover); border-color: var(--border); }
  .stnda-item.selected { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.3); }
  .stnda-item-name { font-weight: 500; margin-bottom: 0.25rem; }
  .stnda-item-tag-row { display: flex; align-items: center; gap: 0.35rem; padding: 0.1rem 0; }
  .stnda-item-tag-name { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-secondary); flex: 1; }
  .stnda-item-desc { font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.2rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .st-header { display: flex; gap: 0.4rem; padding: 0.25rem 0.4rem; border-bottom: 1px solid var(--border); user-select: none; }
  .st-hcell { font-family: var(--font-mono); font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted); cursor: pointer; letter-spacing: 0.04em; }
  .st-hcell:hover { color: var(--text-primary); }
  .st-body { overflow-y: auto; flex: 1; }
  .st-row { display: flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.4rem; font-size: 0.7rem; border-radius: 3px; cursor: pointer; }
  .st-row:hover { background: var(--bg-hover); }
  .st-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-entry { display: flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.4rem; font-size: 0.7rem; border-radius: 3px; }
  .file-entry:hover { background: var(--bg-hover); }
  .file-entry .fname { font-family: var(--font-mono); font-size: 0.65rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-role { font-family: var(--font-mono); font-size: 0.5rem; text-transform: uppercase; padding: 0.05rem 0.25rem; border-radius: 2px; flex-shrink: 0; }
  /* .file-role.{stage} and .role-header.{stage} injected dynamically from pipeline config */
  .file-role.idiolect { background: rgba(152,152,164,0.15); color: var(--text-secondary); }
  .file-role.prefix { background: rgba(236,72,153,0.15); color: #ec4899; }
  .file-role.manifest { background: rgba(152,152,164,0.15); color: var(--text-secondary); }

  .role-group { margin-bottom: 0.75rem; }
  .role-header { font-family: var(--font-mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.3rem 0.5rem; margin-bottom: 0.2rem; border-radius: 3px; font-weight: 600; }
  /* role-header styles injected dynamically */

  .item { padding: 0.4rem 0.5rem; border-radius: 4px; margin-bottom: 0.2rem; border: 1px solid transparent; font-size: 0.78rem; }
  .item:hover { background: var(--bg-hover); border-color: var(--border); }
  .item-top { display: flex; align-items: center; gap: 0.4rem; }
  .item-text { flex: 1; line-height: 1.4; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .item-tag-right { font-family: var(--font-mono); font-size: 0.6rem; color: var(--accent); flex-shrink: 0; margin-left: auto; white-space: nowrap; }
  .item-sub { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-muted); margin-top: 0.15rem; margin-left: 31px; }
  .item-sub.clickable { cursor: pointer; }
  .item-sub.clickable:hover { color: var(--accent); text-decoration: underline; }
  .item-uses { font-family: var(--font-mono); font-size: 0.6rem; color: var(--accent); margin-top: 0.15rem; margin-left: 31px; }
  .item-no { font-family: var(--font-mono); font-size: 0.55rem; color: var(--text-muted); margin-top: 0.1rem; margin-left: 31px; text-transform: uppercase; letter-spacing: 0.03em; }
  .item-warn { font-family: var(--font-mono); font-size: 0.55rem; color: var(--warning); margin-top: 0.15rem; margin-left: 31px; }
  .item-classes { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-secondary); margin-top: 0.2rem; margin-left: 31px; }
  .item-content { margin-top: 0.4rem; padding: 0.5rem; background: var(--bg-tertiary); border-radius: 4px; font-family: var(--font-mono); font-size: 0.68rem; line-height: 1.5; white-space: pre-wrap; max-height: 200px; overflow-y: auto; color: var(--text-secondary); }
  .item-content.expanded { max-height: none; }
  .item-expand { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.65rem; font-family: var(--font-sans); padding: 0.1rem 0; }

  .idio-term { display: flex; align-items: flex-start; gap: 0.4rem; padding: 0.3rem 0.5rem; border-radius: 3px; margin-bottom: 0.15rem; font-size: 0.75rem; }
  .idio-term.lit { background: rgba(245,158,11,0.08); border-left: 2px solid var(--accent); }
  .idio-term.dim { opacity: 0.35; }
  .idio-term input[type="checkbox"] { accent-color: var(--accent); margin-top: 2px; flex-shrink: 0; cursor: pointer; }
  .idio-toolbar { display: flex; gap: 0.3rem; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); background: var(--bg-secondary); flex-wrap: wrap; align-items: center; }
  .idio-toolbar .btn { padding: 0.2rem 0.5rem; font-size: 0.65rem; }
  .idio-toolbar .sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }
  .idio-term-body { flex: 1; min-width: 0; }

  <script type="module">

    // ═══════════════════════════════════════════════════════════════
    // omni-fs — File System Access API helpers
    // ═══════════════════════════════════════════════════════════════

    //<< import { setupDropZone, suppressBrowserDragDrop, walkDirectory, readFileContent, writeFileContent } from './omni-fs.js';
    //-- file: ./omni-fs.js --
    //>> export { setupDropZone, suppressBrowserDragDrop, walkDirectory, readFileContent, writeFileContent };

    /** Prevent the browser's default drag-drop behaviour on the whole page. */
    function suppressBrowserDragDrop() {
      document.addEventListener('dragover', e => e.preventDefault());
      document.addEventListener('drop', e => e.preventDefault());
    }

    /**
     * Wire a drop-zone element: drag-over highlight, drop → directory handle,
     * click → showDirectoryPicker() fallback.
     * @param {HTMLElement} el         The drop-zone element.
     * @param {function}    onDir      async callback(directoryHandle).
     * @param {function}    [onError]  optional error reporter; receives a message string.
     */
    function setupDropZone(el, onDir, onError) {
      if (!el) return;
      el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('drag-over'); });
      el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
      el.addEventListener('drop', async e => {
        e.preventDefault(); e.stopPropagation(); el.classList.remove('drag-over');
        for (const item of e.dataTransfer.items) {
          if (item.kind === 'file') {
            const handle = await item.getAsFileSystemHandle();
            if (handle.kind === 'directory') { await onDir(handle); return; }
          }
        }
        if (onError) onError('Please drop a folder, not individual files');
      });
      el.addEventListener('click', async () => {
        try { const handle = await window.showDirectoryPicker(); await onDir(handle); }
        catch (err) { if (err.name !== 'AbortError' && onError) onError(err.message); }
      });
    }

    /**
     * Recursively walk a directory, returning { handle, path } entries.
     * @param {FileSystemDirectoryHandle} dirHandle
     * @param {object} [opts]
     * @param {RegExp} [opts.extensions]   Only include files matching this.
     * @param {string[]} [opts.skipDirs]   Extra directory names to skip.
     * @param {string} [opts._prefix]      Internal accumulated path.
     */
    async function walkDirectory(dirHandle, opts = {}) {
      const extensions = opts.extensions || null;
      const skipDirs   = opts.skipDirs   || null;
      const prefix     = opts._prefix    || '';
      const entries    = [];
      for await (const entry of dirHandle.values()) {
        if (entry.name.startsWith('.')) continue;
        const entryPath = prefix ? `${prefix}/${entry.name}` : entry.name;
        if (entry.kind === 'directory') {
          if (entry.name === 'node_modules') continue;
          if (skipDirs && skipDirs.includes(entry.name)) continue;
          entries.push(...await walkDirectory(entry, { extensions, skipDirs, _prefix: entryPath }));
        } else if (entry.kind === 'file') {
          if (extensions && !extensions.test(entry.name)) continue;
          entries.push({ handle: entry, path: entryPath });
        }
      }
      return entries;
    }

    /** Read a file handle to a string. */
    async function readFileContent(fileHandle) {
      const file = await fileHandle.getFile();
      return file.text();
    }

    /** Overwrite a file handle with new content. */
    async function writeFileContent(fileHandle, content) {
      const writable = await fileHandle.createWritable();
      await writable.write(content);
      await writable.close();
    }

    //-- endfile --


    // ═══════════════════════════════════════════════════════════════
    // omni-shell — shared UI helpers
    // ═══════════════════════════════════════════════════════════════

    //<< import { escapeHtml, setStatus, renderStatBadges, setupTabs, setupFilter } from './omni-shell.js';
    //-- file: ./omni-shell.js --
    //>> export { escapeHtml, setStatus, renderStatBadges, setupTabs, setupFilter };

    /** Escape a string for safe insertion into HTML. */
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    /**
     * Set the status bar text and optional type class.
     * @param {HTMLElement} statusEl
     * @param {string}      msg
     * @param {string}      [type]  'success' | 'error' | ''
     */
    function setStatus(statusEl, msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    /**
     * Render stat badges in a container.
     * Each stat: { label, count, type?, color? }.
     * type: 'ok'|'broken'|'warn'|'info'|''
     * color: optional inline colour for the dot (overrides type).
     */
    function renderStatBadges(container, stats, insertBefore) {
      container.querySelectorAll('.stat-badge').forEach(el => el.remove());
      for (const stat of stats) {
        const badge = document.createElement('div');
        badge.className = 'stat-badge' + (stat.type ? ' ' + stat.type : '');
        const dotStyle = stat.color ? ` style="background:${stat.color}"` : '';
        const countStr = stat.checked ? `${stat.checked}/${stat.count}` : String(stat.count);
        if (stat.description) badge.dataset.tip = stat.description;
        badge.innerHTML = `<span class="stat-dot"${dotStyle}></span>${escapeHtml(countStr)} ${escapeHtml(stat.label)}`;
        if (insertBefore) container.insertBefore(badge, insertBefore);
        else container.appendChild(badge);
      }
    }

    /**
     * Wire tab buttons: clicking a tab activates it and calls the callback.
     * @param {HTMLElement} container   Element containing .panel-tab buttons.
     * @param {function}    callback    Receives the data-tab string.
     */
    function setupTabs(container, callback) {
      container.querySelectorAll('.panel-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          container.querySelectorAll('.panel-tab').forEach(t =>
            t.classList.toggle('active', t === tab));
          callback(tab.dataset.tab);
        });
      });
    }

    /**
     * Wire a filter input and its clear button.
     * @param {HTMLInputElement} inputEl
     * @param {HTMLElement}      clearEl
     * @param {function}         callback  Receives the current filter string.
     */
    function setupFilter(inputEl, clearEl, callback) {
      inputEl.addEventListener('input', () => {
        inputEl.classList.toggle('active', inputEl.value !== '');
        callback(inputEl.value);
      });
      clearEl.addEventListener('click', () => {
        inputEl.value = '';
        inputEl.classList.remove('active');
        callback('');
      });
    }

    //-- endfile --


    // ═══════════════════════════════════════════════════════════════
    // DotStatus — reusable multi-dot status indicator
    //
    // Constructor takes a stages array describing each dot position:
    //   [{ name: 'todo', color: 'var(--role-todo)', label: 'Todo' }, ...]
    //
    // render(maturity) produces HTML where maturity maps stage names
    // to { count, checked, excluded }.
    //
    // The number and meaning of stages is not baked in — the same
    // class works for a 4-dot cascade pipeline, a 6-dot server
    // health strip, or a 3-dot facility indicator.
    // ═══════════════════════════════════════════════════════════════

    //<< import { DotStatus } from './dot-status.js';
    //-- file: ./dot-status.js --
    //>> export { DotStatus };

    class DotStatus {
      /**
       * @param {Array<{name:string, color:string, label?:string}>} stages
       * @param {object} [opts]
       * @param {number} [opts.size]  Dot diameter in px (default: CSS --ds-size, 9px).
       * @param {number} [opts.gap]   Gap between dots in px (default: CSS --ds-gap, 3px).
       */
      constructor(stages, opts = {}) {
        this.stages = stages;
        this.size = opts.size || null;
        this.gap  = opts.gap  || null;
      }

      /**
       * Render dot strip as an HTML string.
       * @param {object} maturity  { stageName: { count, checked, excluded } }
       * @returns {string}
       */
      render(maturity) {
        const style = [];
        if (this.size) style.push(`--ds-size:${this.size}px`);
        if (this.gap)  style.push(`--ds-gap:${this.gap}px`);
        const attr = style.length ? ` style="${style.join(';')}"` : '';

        let h = `<span class="ds"${attr}>`;
        for (const s of this.stages) {
          const m = maturity?.[s.name] || {};
          const active   = m.count > 0;
          const checked  = m.checked > 0;
          const excluded = m.excluded && !active;
          const cls = 'ds-dot'
            + (active   ? ' active'      : '')
            + (checked  ? ' has-checked'  : '')
            + (excluded ? ' excluded'     : '');
          const label = s.label || s.name;
          const title = `${label}: ${m.count || 0}`
            + (m.checked ? ` (${m.checked}✓)` : '')
            + (excluded  ? ' (excluded)' : '');
          h += `<span class="${cls}" style="--dot-color:${s.color}" title="${title}"></span>`;
        }
        return h + '</span>';
      }
    }

    //-- endfile --


    // ═══════════════════════════════════════════════════════════════
    // PreviewModal — source preview overlay with optional edit mode
    //
    // Creates its own DOM on construction. In read mode, shows
    // numbered lines with an optional highlight. An Edit button
    // toggles to a textarea; Save calls the onSave callback and
    // closes.
    // ═══════════════════════════════════════════════════════════════

    //<< import { PreviewModal } from './preview-modal.js';
    //-- file: ./preview-modal.js --
    //>> export { PreviewModal };

    class PreviewModal {
      /**
       * @param {object} [opts]
       * @param {function} [opts.onSave]  async (filename, newContent) => void.
       *   If provided, the Save button is shown.
       */
      constructor(opts = {}) {
        this.onSave = opts.onSave || null;
        this._filename = '';
        this._build();
      }

      _build() {
        this.overlay = document.createElement('div');
        this.overlay.className = 'preview-overlay';
        this.overlay.innerHTML = `
          <div class="preview-modal">
            <div class="preview-header">
              <h3></h3>
              <div class="preview-actions">
                <button class="btn btn-primary pm-save">Save</button>
                <button class="preview-close">✕</button>
              </div>
            </div>
            <div class="preview-editor-wrap">
              <div class="preview-gutter"></div>
              <textarea class="preview-editor"></textarea>
              <div class="preview-mirror"></div>
            </div>
          </div>`;
        document.body.appendChild(this.overlay);

        this._titleEl  = this.overlay.querySelector('h3');
        this._editorEl = this.overlay.querySelector('.preview-editor');
        this._gutterEl = this.overlay.querySelector('.preview-gutter');
        this._mirrorEl = this.overlay.querySelector('.preview-mirror');
        this._saveBtn  = this.overlay.querySelector('.pm-save');

        this._editorEl.addEventListener('scroll', () => {
          this._gutterEl.scrollTop = this._editorEl.scrollTop;
        });
        this._editorEl.addEventListener('input', () => this._syncGutter());
        this._resizeObs = new ResizeObserver(() => this._syncGutter());
        this._resizeObs.observe(this._editorEl);

        this.overlay.querySelector('.preview-close').addEventListener('click', () => this.hide());
        this.overlay.addEventListener('click', e => { if (e.target === this.overlay) this.hide(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') this.hide(); });
        this._saveBtn.addEventListener('click', () => this._save());
      }

      _syncGutter() {
        const lines = this._editorEl.value.split('\n');
        const mirror = this._mirrorEl;
        // Match the textarea's *text* width (clientWidth includes padding; mirror has none)
        const cs = getComputedStyle(this._editorEl);
        const padL = parseFloat(cs.paddingLeft) || 0;
        const padR = parseFloat(cs.paddingRight) || 0;
        mirror.style.width = (this._editorEl.clientWidth - padL - padR) + 'px';
        mirror.style.font = cs.font;
        mirror.style.letterSpacing = cs.letterSpacing;

        let html = '';
        for (let i = 0; i < lines.length; i++) {
          // Measure each line's rendered height via the mirror
          mirror.textContent = lines[i] || '\u200b';
          const h = mirror.getBoundingClientRect().height;
          html += `<div style="height:${h}px;overflow:hidden">${i + 1}</div>`;
        }
        this._gutterEl.innerHTML = html;
      }

      /**
       * Open the editor on a file, optionally scrolled to a line.
       * @param {string}   filename        Identifier passed back to onSave.
       * @param {string[]} lines           Array of source lines.
       * @param {number}   [highlightLine] 1-based line to scroll to.
       */
      show(filename, lines, highlightLine) {
        this._filename = filename;
        this._titleEl.textContent = highlightLine ? `${filename} : ${highlightLine}` : filename;
        this._saveBtn.style.display = this.onSave ? '' : 'none';
        this._editorEl.value = lines.join('\n');
        this._syncGutter();
        this.overlay.classList.add('visible');
        this._editorEl.focus();

        if (highlightLine) {
          const pos = lines.slice(0, highlightLine - 1).join('\n').length + 1;
          this._editorEl.setSelectionRange(pos, pos);
          const lh = parseFloat(getComputedStyle(this._editorEl).lineHeight) || 19;
          this._editorEl.scrollTop = Math.max(0, highlightLine - 8) * lh;
        }
      }

      async _save() {
        if (this.onSave) await this.onSave(this._filename, this._editorEl.value);
        this.hide();
      }

      hide() { this.overlay.classList.remove('visible'); }
    }

    //-- endfile --


    // ═══════════════════════════════════════════════════════════════
    // SortableTable — reusable sortable table with click delegation
    // ═══════════════════════════════════════════════════════════════

    class SortableTable {
      /**
       * @param {HTMLElement} container
       * @param {object} opts
       * @param {Array<{key:string, label:string, flex?:number, render:(row)=>string}>} opts.columns
       * @param {function} [opts.onRowClick]  (row) => void
       */
      constructor(container, opts) {
        this.container = container;
        this.columns = opts.columns;
        this.onRowClick = opts.onRowClick || null;
        this._rows = [];
        this._sortKey = null;
        this._sortAsc = true;
      }

      setData(rows) {
        this._rows = rows.slice();
        this._applySort();
        this.render();
      }

      _applySort() {
        if (!this._sortKey) return;
        const key = this._sortKey, asc = this._sortAsc;
        this._rows.sort((a, b) => {
          const va = (typeof a[key] === 'string' ? a[key].toLowerCase() : a[key]) || '';
          const vb = (typeof b[key] === 'string' ? b[key].toLowerCase() : b[key]) || '';
          return va < vb ? (asc ? -1 : 1) : va > vb ? (asc ? 1 : -1) : 0;
        });
      }

      render() {
        let html = '<div class="st-header">';
        for (const col of this.columns) {
          const arrow = this._sortKey === col.key ? (this._sortAsc ? ' ▲' : ' ▼') : '';
          html += `<span class="st-hcell" data-sort-key="${col.key}" style="flex:${col.flex || 1}">${col.label}${arrow}</span>`;
        }
        html += '</div><div class="st-body">';
        for (let i = 0; i < this._rows.length; i++) {
          html += `<div class="st-row" data-st-idx="${i}">`;
          for (const col of this.columns) {
            html += `<span class="st-cell" style="flex:${col.flex || 1}">${col.render(this._rows[i])}</span>`;
          }
          html += '</div>';
        }
        html += '</div>';
        this.container.innerHTML = html;

        this.container.querySelectorAll('.st-hcell').forEach(hcell => {
          hcell.addEventListener('click', () => {
            const key = hcell.dataset.sortKey;
            if (this._sortKey === key) this._sortAsc = !this._sortAsc;
            else { this._sortKey = key; this._sortAsc = true; }
            this._applySort();
            this.render();
          });
        });

        if (this.onRowClick) {
          this.container.querySelectorAll('.st-row').forEach(row => {
            row.addEventListener('click', () => this.onRowClick(this._rows[parseInt(row.dataset.stIdx, 10)]));
          });
        }
      }
    }


    // ═══════════════════════════════════════════════════════════════
    // CascadeParse — tag extraction, role detection, markdown parsing
    // ═══════════════════════════════════════════════════════════════
    //-- file: ./cascade-parse.js --
    //>> export { CascadeParse };
    // ── Pipeline configuration ──────────────────────────────────
    const DEFAULT_CONFIG = {
      pipeline: [
        { name: 'TODO',   color: '#f59e0b', checkbox: true,  description: 'Work item identified' },
        { name: 'PROMPT', color: '#58a6ff',                   description: 'Elicited design or algorithm prompt' },
        { name: 'SPEC',   color: '#bc8cff',                   description: 'Detailed specification' },
        { name: 'CODE',   color: '#3fb950',                   description: 'Implementation' },
        { name: 'STNDA',  color: '#e8e8ec',                   description: 'Standalone normalised spike' },
      ],
      manifest: {
        default_role: 'CODE',
        patterns: [
          { match: '-grammar', role: 'SPEC' },
          { match: '-stnda',   role: 'STNDA' },
        ],
      },
      tabs1: [{ title: 'STNDA', with: ['STNDA'], style: 'role' }],
      tabs2: [{ title: 'Queue', with: ['PROMPT'], without: ['CODE'], style: 'queue' }],
    };
    let pipelineConfig = DEFAULT_CONFIG;

    class CascadeParse {
      static get ROLES() { return pipelineConfig.pipeline.map(s => s.name.toLowerCase()); }
      static get ROLE_LABELS() {
        const m = {};
        for (const s of pipelineConfig.pipeline) m[s.name.toLowerCase()] = s.name;
        return m;
      }
      static TAG_RE = /#([a-zA-Z0-9_]+(?:\/[a-zA-Z0-9_]+)*)/g;

      /**
       * Find a pipeline config island (```json block with "pipeline" key) in file content.
       * Returns { config, error, line } — error and line set if a plausible block failed to parse.
       */
      static extractPipelineConfig(content) {
        const re = /```json\s*\n([\s\S]*?)```/gi;
        let m;
        while ((m = re.exec(content)) !== null) {
          const blockLine = content.slice(0, m.index).split('\n').length;
          const raw = m[1];
          // Skip the simple role block (single-key object with "role")
          if (/^\s*\{\s*"role"\s*:/.test(raw)) continue;
          // Only attempt blocks that look like they might contain pipeline config
          if (!raw.includes('"pipeline"')) continue;
          try {
            const obj = JSON.parse(raw);
            if (obj.pipeline && Array.isArray(obj.pipeline)) return { config: obj, error: null, line: null };
          } catch (e) {
            return { config: null, error: e.message, line: blockLine };
          }
        }
        return { config: null, error: null, line: null };
      }

      static extractTags(text, requireSlash = false) {
        const tags = [], re = new RegExp(this.TAG_RE.source, 'g');
        let m; while ((m = re.exec(text)) !== null) {
          if (!requireSlash || m[1].includes('/')) tags.push(m[1]);
        }
        return tags;
      }

      static stripTags(text) {
        return text.replace(/#[a-zA-Z0-9_]+(?:\/[a-zA-Z0-9_]+)*/g, '').trim();
      }

      static parseItemText(raw) {
        let main = raw, uses = [];
        const usesIdx = raw.search(/\s+USES\s+/);
        if (usesIdx !== -1) {
          main = raw.slice(0, usesIdx);
          uses = this.extractTags(raw.slice(raw.indexOf('USES', usesIdx) + 4));
        }
        const noRoles = [];
        const noRoleNames = pipelineConfig.pipeline.filter(s => !s.checkbox).map(s => s.name.toUpperCase());
        if (noRoleNames.length) {
          const noRe = new RegExp(`\\bNO-(${noRoleNames.join('|')})\\b`, 'gi');
          let nm;
          while ((nm = noRe.exec(main)) !== null) noRoles.push(nm[1].toLowerCase());
          main = main.replace(new RegExp(`\\bNO-(${noRoleNames.join('|')})\\b`, 'gi'), '');
        }
        const tags = this.extractTags(main);
        const text = this.stripTags(main).replace(/\s{2,}/g, ' ').trim();
        return { text, tags, uses, noRoles };
      }

      static detectRole(content) {
        const m = content.match(/```json\s*\n\s*\{[^}]*"role"\s*:\s*"([^"]+)"[^}]*\}\s*\n\s*```/i);
        if (!m) return null;
        return m[1].toLowerCase();
      }

      static parse(content, filename, role) {
        if (role === 'idiolect') return { items: [], idiolectTerms: this._parseIdiolect(content, filename), prefixItems: [] };
        if (role === 'manifest') return { items: this._parseManifest(content, filename), idiolectTerms: [], prefixItems: [] };
        if (role === 'prefix') return { items: [], idiolectTerms: [], prefixItems: this._parseMd(content, filename, role) };
        return { items: this._parseMd(content, filename, role), idiolectTerms: [], prefixItems: [] };
      }

      static _parseMd(content, filename, role) {
        const lines = content.split('\n'), items = [];
        let secHead = null, secTags = [], secUses = [], secNoRoles = [], secLines = [], secStart = 0, secLevel = 0, secChecked = null;
        const flush = () => {
          if (secHead && secTags.length) {
            const item = { type:'section', heading: this.stripTags(secHead), tags: secTags,
              uses: secUses, noRoles: secNoRoles,
              content: secLines.join('\n').trim(), line: secStart, file: filename, role };
            if (secChecked !== null) item.checked = secChecked;
            items.push(item);
          }
          secHead = null; secTags = []; secUses = []; secNoRoles = []; secLines = []; secLevel = 0; secChecked = null;
        };
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const hm = line.match(/^(#{1,6})\s+(.+)/);
          if (hm) {
            const level = hm[1].length;
            let headText = hm[2];
            let checked = null;
            const cbm = headText.match(/^\[([xX ])\]\s+(.*)/);
            if (cbm) { checked = cbm[1].toLowerCase() === 'x'; headText = cbm[2]; }
            const p = this.parseItemText(headText);
            if (p.tags.length || !secHead || level <= secLevel) {
              flush();
              if (p.tags.length) { secHead = headText; secTags = p.tags; secUses = p.uses; secNoRoles = p.noRoles; secStart = i+1; secLevel = level; secLines = []; secChecked = checked; }
            } else { secLines.push(line); }

          }

          if (cm) { const p = this.parseItemText(cm[2]); if (p.tags.length) items.push({ type:'checkbox', checked: cm[1].toLowerCase()==='x', text: p.text, tags: p.tags, uses: p.uses, noRoles: p.noRoles, line: i+1, file: filename, role }); if (secHead) secLines.push(line); continue; }
          const bm = line.match(/^\s*[*\-]\s+(.+)/);
          if (bm) { const p = this.parseItemText(bm[1]); if (p.tags.length) items.push({ type:'bullet', text: p.text, tags: p.tags, uses: p.uses, noRoles: p.noRoles, line: i+1, file: filename, role }); if (secHead) secLines.push(line); continue; }
          const fp = this.parseItemText(line);
          if (fp.tags.length && !line.startsWith('#') && line.trim()) {
            flush();
            const pLines = [line]; let j = i+1;
            while (j < lines.length && lines[j].trim() && !lines[j].match(/^#{1,6}\s/) && !lines[j].match(/^\s*\[/) && !(this.extractTags(lines[j]).length && !lines[j].startsWith(' '))) { pLines.push(lines[j]); j++; }
            items.push({ type:'section', heading: fp.text, tags: fp.tags, uses: fp.uses, noRoles: fp.noRoles, content: pLines.slice(1).join('\n').trim(), line: i+1, file: filename, role });
            i = j-1; continue;
          }
          if (secHead) secLines.push(line);
        }
        flush();
        return items;
      }

      static _manifestRole(filepath) {
        const mcfg = pipelineConfig.manifest || {};
        const patterns = mcfg.patterns || [];
        for (const p of patterns) {
          if (filepath.includes(p.match)) return p.role.toLowerCase();
        }
        return (mcfg.default_role || 'code').toLowerCase();
      }

      static _parseManifest(content, filename) {
        const lines = content.split('\n'), items = []; let cur = null;
        const flush = () => { if (cur) items.push(cur); cur = null; };

          const line = lines[i];
          const cm = line.match(/^\[([xX ])\]\s+(\S+)\s*(.*)/);
          if (cm) { flush(); cur = { type:'manifest', checked: cm[1].toLowerCase()==='x', path:cm[2], text:cm[2], tags: this.extractTags(cm[3]), classes:[], grammars:[], line:i+1, file:filename, role: this._manifestRole(cm[2]) }; continue; }

        flush(); return items;
      }

      static _parseIdiolect(content, filename) {
        const lines = content.split('\n'), terms = [];
        const skipH = new Set(['project idiolect', 'bijou', 'standard']);
        let curH2 = null, curH2Tags = [], curDef = [], curStart = 0, category = null;
        const flush = () => {
          if (curH2 && !skipH.has(curH2.toLowerCase()))

          if (curH2) curDef.push(line);
        }
        flush(); return terms;
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // CascadeTree — tag hierarchy, queries, maturity
    // ═══════════════════════════════════════════════════════════════
    //<< import { CascadeParse } from './cascade-parse.js';
    //-- file: ./cascade-tree.js --
    //>> import { CascadeParse } from './cascade-parse.js';
    //>> export { CascadeTree };
    class CascadeTree {
      static build(items) {
        const root = { name:'', fullTag:'', children: new Map(), directItems:[], allItems:[] };
        for (const item of items) for (const tag of item.tags) {
          let node = root, path = '';
          for (const part of tag.split('/')) {
            path = path ? path+'/'+part : part;
            if (!node.children.has(part)) node.children.set(part, { name:part, fullTag:path, children: new Map(), directItems:[], allItems:[] });
            node = node.children.get(part);
          }
          node.directItems.push(item);
        }
        this._computeAll(root); return root;
      }

      static _computeAll(node) {
        const seen = new Set(), all = [];
        const add = it => { const k = it.file+':'+it.line; if (!seen.has(k)) { seen.add(k); all.push(it); } };
        node.directItems.forEach(add);
        for (const c of node.children.values()) { this._computeAll(c); c.allItems.forEach(add); }
        node.allItems = all;
      }

      static find(root, tag) {
        let n = root; for (const p of tag.split('/')) { n = n.children?.get(p); if (!n) return null; } return n;
      }

      static count(n) { let c = n.children.size; for (const ch of n.children.values()) c += this.count(ch); return c; }

      static getMaturity(node) {
        const mat = {};
        for (const r of CascadeParse.ROLES) {
          const inR = node.allItems.filter(i => i.role === r);
          mat[r] = { count: inR.length, checked: inR.filter(i => i.checked).length,
            excluded: node.allItems.some(i => i.noRoles?.includes(r)) };
        }
        return mat;
      }

      static getDependencies(node) {
        const deps = new Set();
        if (!node) return deps;
        for (const item of node.allItems)
          if (item.uses) for (const u of item.uses) deps.add(u);
        return deps;
      }

      static getUsedBy(root, tag, allItems) {
        const results = [];
        for (const item of allItems) {
          if (!item.uses?.length) continue;
          for (const u of item.uses) {
            if (u === tag || u.startsWith(tag + '/') || tag.startsWith(u + '/'))
              results.push({ tag: item.tags[0] || '?', text: item.text || item.heading || '', file: item.file });
          }
        }
        return results;
      }

      static relevantIdiolect(node, terms) {
        if (!node || !terms.length) return new Set();
        const nodeTag = node.fullTag;
        const text = node.allItems.map(i => [i.text, i.heading, i.content].filter(Boolean).join(' ')).join(' ').toLowerCase();
        const hits = new Set();
        for (const t of terms) {
          if (t.tags?.length && nodeTag) {
            for (const tt of t.tags) {
              if (tt === nodeTag || nodeTag.startsWith(tt + '/') || tt.startsWith(nodeTag + '/')) { hits.add(t.term); break; }
            }
            if (hits.has(t.term)) continue;
          }
          const tl = t.term.toLowerCase();
          if (text.includes(tl) || tl.split(/[\s\/,]+/).some(w => w.length > 3 && text.includes(w)))
            hits.add(t.term);
        }
        return hits;
      }

      static idiolectTagHits(root, checkedNames, terms) {
        if (!checkedNames.size) return new Set();
        const checkedTerms = terms.filter(x => checkedNames.has(x.term));
        const words = [];
        for (const t of checkedTerms) {
          words.push(t.term.toLowerCase());
          t.term.toLowerCase().split(/[\s\/,]+/).forEach(w => { if (w.length > 3) words.push(w); });
        }
        const hits = new Set();
        const walk = node => {
          for (const t of checkedTerms) {
            if (t.tags?.length) for (const tt of t.tags) {
              if (tt === node.fullTag || node.fullTag.startsWith(tt + '/') || tt.startsWith(node.fullTag + '/')) { hits.add(node.fullTag); break; }
            }
          }
          if (!hits.has(node.fullTag)) {
            const text = node.allItems.map(i => [i.text, i.heading, i.content].filter(Boolean).join(' ')).join(' ').toLowerCase();
            if (words.some(w => text.includes(w))) hits.add(node.fullTag);
          }
          for (const c of node.children.values()) walk(c);
        };
        for (const c of root.children.values()) walk(c);
        return hits;
      }
    }

    // CascadeReport — analysis and health checks
    // ═══════════════════════════════════════════════════════════════
    //<< import { CascadeParse } from './cascade-parse.js';
    //<< import { CascadeTree } from './cascade-tree.js';
    //-- file: ./cascade-report.js --
    //>> import { CascadeParse } from './cascade-parse.js';
    //>> import { CascadeTree } from './cascade-tree.js';
    //>> export { CascadeReport };
    class CascadeReport {
      /** Find checked checkbox-stage items whose tag has no items in any other pipeline stage. */
      static cascadeGaps(items, tree) {
        const cbRoles = new Set(pipelineConfig.pipeline.filter(s => s.checkbox).map(s => s.name.toLowerCase()));
        if (!cbRoles.size) return [];
        const gaps = [];
        for (const item of items) {
          if (!cbRoles.has(item.role) || !item.checked) continue;
          for (const tag of item.tags) {
            const node = CascadeTree.find(tree, tag);
            if (!node) continue;
            if (node.allItems.some(i => i !== item && !cbRoles.has(i.role))) continue;
            const noRoles = new Set();
            for (const ni of node.allItems) if (ni.noRoles) ni.noRoles.forEach(r => noRoles.add(r));
            if (noRoles.size > 0) continue;
            gaps.push({ tag, text: item.text || item.heading || tag, file: item.file, line: item.line });
          }
        }
        return gaps;
      }

      /**
       * Find tags that have ALL withRoles and NONE of the withoutRoles.
       * @param {string[]} withRoles    Role names (lowercase) that must be present.
       * @param {string[]} withoutRoles Role names (lowercase) that must be absent.
       */
      static readyItems(items, tree, withRoles, withoutRoles) {
        const withSet = new Set(withRoles.map(r => r.toLowerCase()));
        const withoutSet = new Set((withoutRoles || []).map(r => r.toLowerCase()));
        const cbRoles = new Set(pipelineConfig.pipeline.filter(s => s.checkbox).map(s => s.name.toLowerCase()));
        const allTags = [...new Set(items.flatMap(i => i.tags))], ready = [];
        for (const tag of allTags) {
          const node = CascadeTree.find(tree, tag);
          if (!node) continue;
          const roles = new Set(node.allItems.map(i => i.role));
          const hasAll = [...withSet].every(r => roles.has(r));
          const hasNone = ![...withoutSet].some(r => roles.has(r));
          if (hasAll && hasNone) {
            const cbItem = node.allItems.find(i => cbRoles.has(i.role));
            const otherRoles = [...roles].filter(r => !withSet.has(r) && !cbRoles.has(r));
            ready.push({ tag, otherRoles, text: cbItem?.text || node.allItems[0]?.heading || tag });
          }
        }
        return ready;
      }

      static tagTypos(items) {
        const allTags = [...new Set(items.flatMap(i => i.tags))].sort();
        const typos = [], seen = new Set();
        const add = (a, b) => { const k = a+'|'+b; if (!seen.has(k)) { seen.add(k); typos.push([a, b]); } };
        for (let i = 0; i < allTags.length; i++) for (let j = i+1; j < allTags.length; j++)
          if (this._editDist(allTags[i], allTags[j]) === 1) add(allTags[i], allTags[j]);
        const roots = [...new Set(allTags.map(t => t.split('/')[0]))].sort();
        for (let i = 0; i < roots.length; i++) for (let j = i+1; j < roots.length; j++)
          if (this._editDist(roots[i], roots[j]) <= 1) add(roots[i]+'/*', roots[j]+'/*');
        return typos;
      }

      static singleFileTags(items) {
        const allTags = [...new Set(items.flatMap(i => i.tags))];
        return allTags.filter(tag => {
          const files = new Set(items.filter(i => i.tags.includes(tag)).map(i => i.file));
          return files.size === 1;
        }).map(tag => {
          const first = items.find(i => i.tags.includes(tag));
          return { tag, file: first?.file || '?', line: first?.line };
        });
      }

      static _editDist(a, b) {
        if (Math.abs(a.length - b.length) > 1) return 99;
        const m = a.length, n = b.length;
        const dp = Array.from({length:m+1}, (_,i) => Array.from({length:n+1}, (_,j) => i===0?j:j===0?i:0));
        for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
          dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
        return dp[m][n];
      }
    }
