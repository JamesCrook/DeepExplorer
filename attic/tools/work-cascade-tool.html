    // ═══════════════════════════════════════════════════════════════
    // CascadeBundle — bundle generation
    // ═══════════════════════════════════════════════════════════════
    //<< import { CascadeParse } from './cascade-parse.js';
    //<< import { CascadeTree } from './cascade-tree.js';
    //-- file: ./cascade-bundle.js --
    //>> import { CascadeParse } from './cascade-parse.js';
    //>> import { CascadeTree } from './cascade-tree.js';
    //>> export { CascadeBundle };
    class CascadeBundle {

      static _parseRoutes(files) {
        const routes = [];
        for (const [, finfo] of files) {
          if (finfo.role !== 'prefix') continue;
          const m = finfo.content.match(/```routes\n([\s\S]*?)```/);
          if (!m) continue;
          for (const line of m[1].split('\n')) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('#')) continue;
            const [lhs, rhs] = trimmed.split('→').map(s => s.trim());
            if (lhs === undefined) continue;
            const segments = lhs.split(',').map(s => s.trim()).filter(Boolean);
            const prefixes = rhs ? rhs.split(',').map(s => s.trim()).filter(Boolean) : [];
            if (segments.length) routes.push({ segments, prefixes });
          }
        }
        return routes;
      }

      static _parseAttachments(files) {
        const map = new Map();
        for (const [, finfo] of files) {
          if (finfo.role !== 'prefix') continue;
          const m = finfo.content.match(/```attachments\n([\s\S]*?)```/);
          if (!m) continue;
          for (const line of m[1].split('\n')) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('#')) continue;
            const colonIdx = trimmed.indexOf(':');
            if (colonIdx < 1) continue;
            const prefixTag = trimmed.slice(0, colonIdx).trim();
            const rest = trimmed.slice(colonIdx + 1).trim();
            const dashIdx = rest.indexOf('—');
            const path = dashIdx >= 0 ? rest.slice(0, dashIdx).trim() : rest;
            const reason = dashIdx >= 0 ? rest.slice(dashIdx + 1).trim() : '';
            if (!map.has(prefixTag)) map.set(prefixTag, []);
            map.get(prefixTag).push({ path, reason });
          }
        }
        return map;
      }

      static _routePrefixes(tag, routes) {
        const parts = tag.split('/');
        for (const route of routes) {
          for (let i = parts.length - 1; i >= 0; i--) {
            if (route.segments.includes(parts[i])) return route.prefixes;
          }
        }
        return [];
      }

      static _collectAttachments(prefixTags, attachmentsMap) {
        const seen = new Set(), attachments = [];
        for (const ptag of prefixTags) {
          const entries = attachmentsMap.get(ptag);
          if (!entries) continue;
          for (const entry of entries) {
            if (!seen.has(entry.path)) { seen.add(entry.path); attachments.push(entry); }
          }
        }
        return attachments;
      }

      static build(tree, tag, files, idiolectTerms, prefixItems, checkedIdioTerms) {
        const node = CascadeTree.find(tree, tag);
        if (!node) return '';
        const items = node.allItems, parts = [];

        const routes = this._parseRoutes(files);
        const attachmentsMap = this._parseAttachments(files);
        const routedPrefixTags = this._routePrefixes(tag, routes);

        if (prefixItems.length && routedPrefixTags.length) {
          const wanted = new Set(routedPrefixTags);
          const matched = prefixItems.filter(p => p.tags.some(ptag => wanted.has(ptag)));
          if (matched.length) {
            parts.push('## Prefix Instructions');
            for (const p of matched) {
              parts.push(`### ${p.heading} [${p.tags.map(t=>'#'+t).join(' ')}]`);
              if (p.content) parts.push(p.content);
              parts.push('');
            }
          }
        }

        const attachments = this._collectAttachments(routedPrefixTags, attachmentsMap);
        const manifestItems = items.filter(i => i.type === 'manifest');
        for (const ci of manifestItems) {
          const p = ci.path || ci.text;
          if (!attachments.find(a => a.path === p)) {
            let reason = '';
            if (ci.classes?.length) reason = ci.classes.join(', ');
            if (ci.grammars?.length) reason += (reason ? ' | ' : '') + 'Grammar: ' + ci.grammars.join(', ');
            attachments.push({ path: p, reason: reason || 'tagged code file' });
          }
        }

        if (attachments.length) {
          parts.push('## Suggested Attachments');
          parts.push('Paste these files into the chat session alongside this bundle:');
          for (const a of attachments) parts.push(`- **${a.path}** — ${a.reason}`);
          parts.push('');
        }

        // Exclude manifest items from inline bundle (they go in attachments)
        const byFile = new Map();
        for (const i of items) { if (i.type === 'manifest') continue; if (!byFile.has(i.file)) byFile.set(i.file, []); byFile.get(i.file).push(i); }
        const ROLES = CascadeParse.ROLES;
        const sorted = [...byFile.entries()].sort((a,b) => ROLES.indexOf(files.get(a[0])?.role||ROLES[1]||'') - ROLES.indexOf(files.get(b[0])?.role||ROLES[1]||''));
        for (const [filename, fileItems] of sorted) {
          parts.push(`## From ${filename} (${files.get(filename)?.role || '?'})`);
          for (const i of fileItems) {
            const noStr = i.noRoles?.length ? ' ' + i.noRoles.map(r => 'NO-'+r.toUpperCase()).join(' ') : '';
            const usesStr = i.uses?.length ? ' USES ' + i.uses.map(t => '#'+t).join(' ') : '';
            if (i.type === 'checkbox') parts.push(`[${i.checked?'x':' '}] ${i.text} ${i.tags.map(t=>'#'+t).join(' ')}${noStr}${usesStr}`);
            else if (i.type === 'bullet') parts.push(`* ${i.text} ${i.tags.map(t=>'#'+t).join(' ')}${noStr}${usesStr}`);
            else if (i.type === 'section') { parts.push(`### ${i.heading}`); if (i.content) parts.push(i.content); }
            parts.push('');
          }
        }

        const deps = CascadeTree.getDependencies(node);
        if (deps.size) {
          const ownItemKeys = new Set(items.map(i => i.file + ':' + i.line));
          const cbRoles = new Set(pipelineConfig.pipeline.filter(s => s.checkbox).map(s => s.name.toLowerCase()));
          const depSections = [];
          for (const depTag of deps) {
            const depNode = CascadeTree.find(tree, depTag);
            if (!depNode) { depSections.push({ tag: depTag, items: [], missing: true }); continue; }
            // Include non-checkbox, non-manifest items from dependencies
            const depItems = depNode.allItems.filter(i => {
              if (ownItemKeys.has(i.file + ':' + i.line)) return false;
              if (cbRoles.has(i.role)) return false;
              if (i.type === 'manifest') return false;
              return true;
            });
            if (depItems.length) depSections.push({ tag: depTag, items: depItems, missing: false });
            const depManifestItems = depNode.allItems.filter(i => i.type === 'manifest');
            for (const ci of depManifestItems) {
              const p = ci.path || ci.text;
              if (!attachments.find(a => a.path === p)) {
                let reason = 'dependency #' + depTag;
                if (ci.classes?.length) reason += ' — ' + ci.classes.join(', ');
                attachments.push({ path: p, reason });
              }
            }
          }
          if (depSections.length) {
            parts.push('## Dependencies (from USES)');
            for (const dep of depSections) {
              if (dep.missing) { parts.push(`### #${dep.tag} — not found in work files`); parts.push(''); continue; }
              parts.push(`### #${dep.tag}`);
              for (const i of dep.items) {
                if (i.type === 'section') { parts.push(`#### ${i.heading}`); if (i.content) parts.push(i.content); }
                else if (i.type === 'checkbox') parts.push(`[${i.checked?'x':' '}] ${i.text}`);
                else if (i.type === 'bullet') parts.push(`* ${i.text}`);
                parts.push('');
              }
            }
          }
        }

        const relevant = CascadeTree.relevantIdiolect(node, idiolectTerms);
        const ticked = checkedIdioTerms || new Set();
        const tickedTerms = idiolectTerms.filter(t => ticked.has(t.term));
        const untickedMatches = idiolectTerms.filter(t => relevant.has(t.term) && !ticked.has(t.term));
        if (tickedTerms.length || untickedMatches.length) {
          parts.push('## Relevant Idiolect');
          if (tickedTerms.length) {
            for (const t of tickedTerms) {
              const tagStr = t.tags?.length ? ' ' + t.tags.map(x=>'#'+x).join(' ') : '';
              parts.push(`**${t.term}**${tagStr}`);
              if (t.definition) parts.push(t.definition);
              parts.push('');
            }
          }
          if (untickedMatches.length) {
            const summaries = untickedMatches.map(t => `**${t.term}** — ${(t.definition||'').split('\n')[0]}`);
            parts.push(...summaries);
            parts.push('');
          }
        }
        return parts.join('\n');
      }
    }
    //-- endfile --


    // ═══════════════════════════════════════════════════════════════
    // Harness — state, rendering, events
    // ═══════════════════════════════════════════════════════════════

    const esc = escapeHtml;

    /** Render a clickable file:line reference. Used everywhere a source location appears. */
    function fileLink(file, line) {
      const label = line ? `${esc(file)}:${line}` : esc(file);
      return `<span class="item-sub clickable" data-preview-file="${esc(file)}"${line ? ` data-preview-line="${line}"` : ''}>${label}</span>`;
    }

    // ── Cascade stage descriptors (drives DotStatus and stat badges) ──
    let cascadeStages, treeDots, itemDots;

    function rebuildStages() {
      cascadeStages = pipelineConfig.pipeline.map(s => ({
        name: s.name.toLowerCase(),
        color: s.color,
        label: s.name,
        description: s.description || '',
      }));
      treeDots = new DotStatus(cascadeStages, { size: 9 });
      itemDots = new DotStatus(cascadeStages, { size: 8 });
    }
    rebuildStages();

    // ── State ──
    const state = {
      mdHandle: null, files: new Map(), items: [], idiolectTerms: [], prefixItems: [], tagTree: null,
      selectedTag: null, selectedStnda: null, expandedTags: new Set(), treeFilter: '',
      checkedIdioTerms: new Set(), leftTab: 'tags', centerTab: 'items', rightTab: 'bundle',
    };

    // ── DOM cache ──
    const $ = id => document.getElementById(id);
    const dom = {
      status: $('status'),
      headerRight: $('headerRight'),
      btnRescan: $('btnRescan'),
      btnCopy: $('btnCopy'),
      tagCount: $('tagCount'),
      treeContent: $('treeContent'),
      centerContent: $('centerContent'),
      centerCount: $('centerCount'),
      rightContent: $('rightContent'),
      bundleActions: $('bundleActions'),
      fileList: $('fileList'),
      custom1Content: $('custom1Content'),
      filterRow: $('filterRow'),
    };
    const status = (msg, type) => setStatus(dom.status, msg, type);

    // ── Preview modal ──
    const preview = new PreviewModal({
      onSave: async (filename, newContent) => {
        const fileInfo = state.files.get(filename);
        if (!fileInfo?.handle) return;
        await writeFileContent(fileInfo.handle, newContent);
        status('Saved ' + filename, 'success');
        await scanMdFiles();
      }
    });

    // ── File table ──
    const fileTable = new SortableTable(dom.fileList, {
      columns: [
        { key: 'name', label: 'File', flex: 3, render: r => `<span class="fname" title="${esc(r.name)}">${esc(r.name)}</span>` },
        { key: 'role', label: 'Role', flex: 1, render: r => `<span class="file-role ${r.role}">${r.role}</span>` },
      ],
      onRowClick: r => {
        const fileInfo = state.files.get(r.name);
        if (fileInfo) preview.show(r.name, fileInfo.content.split('\n'));
      },
    });

    // ── Config application ──
    let _dynStyle = null;

    function applyConfig(cfg) {
      pipelineConfig = cfg;
      rebuildStages();
      _injectRoleCSS();
      _buildCustomTabs();
    }

    /** Parse a hex colour to {r,g,b}. */
    function hexToRgb(hex) {
      const n = parseInt(hex.replace('#', ''), 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    /** Inject CSS custom properties and role classes from pipeline config. */
    function _injectRoleCSS() {
      if (!_dynStyle) { _dynStyle = document.createElement('style'); document.head.appendChild(_dynStyle); }
      let css = ':root {\n';
      for (const s of pipelineConfig.pipeline) {
        css += `  --role-${s.name.toLowerCase()}: ${s.color};\n`;
      }
      css += '}\n';
      for (const s of pipelineConfig.pipeline) {
        const r = s.name.toLowerCase();
        const { r: cr, g: cg, b: cb } = hexToRgb(s.color);
        css += `.file-role.${r} { background: rgba(${cr},${cg},${cb},0.15); color: var(--role-${r}); }\n`;
        css += `.role-header.${r} { color: var(--role-${r}); background: rgba(${cr},${cg},${cb},0.08); }\n`;
      }
      _dynStyle.textContent = css;
    }

    /** Build custom tab buttons from tabs1/tabs2 config. */
    function _buildCustomTabs() {
      // Remove previously injected custom tabs
      document.querySelectorAll('.panel-tab[data-custom]').forEach(el => el.remove());

      const leftTabs = $('leftTabs');
      for (let i = 0; i < (pipelineConfig.tabs1 || []).length; i++) {
        const t = pipelineConfig.tabs1[i];
        const btn = document.createElement('button');
        btn.className = 'panel-tab';
        btn.dataset.tab = `t1-${i}`;
        btn.dataset.custom = '1';
        btn.textContent = t.title;
        leftTabs.appendChild(btn);
      }
      setupTabs(leftTabs, tab => { state.leftTab = tab; renderLeft(); });

      const centerTabs = $('centerTabs');
      for (let i = 0; i < (pipelineConfig.tabs2 || []).length; i++) {
        const t = pipelineConfig.tabs2[i];
        const btn = document.createElement('button');
        btn.className = 'panel-tab';
        btn.dataset.tab = `t2-${i}`;
        btn.dataset.custom = '1';
        btn.textContent = t.title;
        centerTabs.appendChild(btn);
      }
      setupTabs(centerTabs, tab => { state.centerTab = tab; renderCenter(); });
    }

    // ── Scanning ──
    async function scanMdFiles() {
      if (!state.mdHandle) return;
      status('Scanning…');
      state.files.clear(); state.items = []; state.idiolectTerms = []; state.prefixItems = [];
      try {
        const entries = await walkDirectory(state.mdHandle, { extensions: /\.md$/i });
        let skipped = 0;
        for (const { handle, path } of entries.sort((a,b) => a.path.localeCompare(b.path))) {
          const content = await readFileContent(handle);
          const role = CascadeParse.detectRole(content);
          if (!role) { skipped++; continue; }
          state.files.set(path, { content, role, handle });
          const { items, idiolectTerms, prefixItems } = CascadeParse.parse(content, path, role);
          state.items.push(...items);
          if (idiolectTerms.length) state.idiolectTerms = idiolectTerms;
          if (prefixItems.length) state.prefixItems.push(...prefixItems);
        }
        // Extract pipeline config from prefix files (first found wins)
        let foundConfig = null;
        let configError = null;
        for (const [filename, finfo] of state.files) {
          if (finfo.role === 'prefix' && !foundConfig && !configError) {
            const result = CascadeParse.extractPipelineConfig(finfo.content);
            if (result.config) { foundConfig = result.config; }
            else if (result.error) {
              configError = { file: filename, error: result.error, line: result.line };
            }
          }
        }
        applyConfig(foundConfig || DEFAULT_CONFIG);

        state.tagTree = CascadeTree.build(state.items);
        for (const k of state.tagTree.children.keys()) state.expandedTags.add(k);
        dom.btnRescan.disabled = false;
        renderAll();
        if (configError) {
          status(`Pipeline config error in ${configError.file}: ${configError.error} — using defaults`, 'error');
          const fileInfo = state.files.get(configError.file);
          if (fileInfo) preview.show(configError.file, fileInfo.content.split('\n'), configError.line);
        } else {
          status(`${state.files.size} files · ${state.items.length} items · ${CascadeTree.count(state.tagTree)} tags · ${state.idiolectTerms.length} idiolect · ${state.prefixItems.length} prefixes${skipped ? ' · '+skipped+' skipped (no role)' : ''}`, 'success');
        }
      } catch (err) { console.error(err); status(`Error: ${err.message}`, 'error'); }
    }

    async function scanCodeDir(handle) {
      status('Scanning code directory…');
      try {
        const entries = await walkDirectory(handle, { extensions: /\.(js|mjs|html|htm)$/i });
        let text = '# Code Manifest (generated)\n\n```json\n{ "role": "MANIFEST" }\n```\n\n', found = 0;
        for (const { handle: fh, path } of entries) {
          try {
            const content = await readFileContent(fh);
            const tags = CascadeParse.extractTags(content.slice(0, 200000), true);
            const classes = [], grammars = []; let m;
            const cRe = /\bclass\s+([A-Z][a-zA-Z0-9_]*)/g;
            while ((m = cRe.exec(content)) !== null) classes.push(m[1]);
            const gRe = /(?:const|let|var)\s+(\w*[Gg]rammar\w*)\s*=/g;
            while ((m = gRe.exec(content)) !== null) grammars.push(m[1]);
            if (tags.length || classes.length) {
              found++;
              text += `[ ] ${path}${tags.length ? ' '+tags.map(t=>'#'+t).join(' ') : ''}\n`;
              if (classes.length) text += `Classes: ${classes.join(', ')}\n`;
              if (grammars.length) text += `Grammar: ${grammars.join(', ')}\n`;
              text += '\n';
            }
          } catch(e) {}
        }
        state.rightTab = 'bundle'; renderRightTabs();
        dom.rightContent.innerHTML = `<div class="bundle-preview">${esc(text)}</div>`;
        dom.bundleActions.style.display = '';
        status(`Scanned ${entries.length} files, ${found} with classes/tags`, 'success');
      } catch(e) { if (e.name !== 'AbortError') status(e.message, 'error'); }
    }

    // ── Rendering ──
    function renderAll() { renderLeft(); renderHeaderStats(); renderCenter(); renderRight(); }

    function renderHeaderStats() {
      const stats = cascadeStages
        .map(s => {
          const roleItems = state.items.filter(i => i.role === s.name);
          const checked = roleItems.filter(i => i.checked).length;
          return { label: s.label, count: roleItems.length, checked, color: s.color, description: s.description };
        })
        .filter(s => s.count > 0);
      renderStatBadges(dom.headerRight, stats, dom.btnRescan);
    }

    function renderLeft() {
      const isCustom = state.leftTab.startsWith('t1-');
      $('leftTabs').querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.leftTab));
      dom.treeContent.style.display = state.leftTab === 'tags' ? '' : 'none';
      dom.filterRow.style.display = state.leftTab === 'tags' && state.tagTree ? '' : 'none';
      dom.fileList.style.display = state.leftTab === 'files' ? '' : 'none';
      dom.custom1Content.style.display = isCustom ? '' : 'none';
      if (state.leftTab === 'tags') { renderTree(); }
      else if (state.leftTab === 'files') {
        renderFileList();
        dom.tagCount.textContent = state.files.size;
      }
      else if (isCustom) {
        const idx = parseInt(state.leftTab.split('-')[1], 10);
        const tabCfg = pipelineConfig.tabs1[idx];
        if (tabCfg) {
          if (tabCfg.style === 'role') renderRoleTab(dom.custom1Content, tabCfg);
          else if (tabCfg.style === 'queue') renderQueueTab(dom.custom1Content, tabCfg);
        }
      }
    }

    function renderFileList() {
      fileTable.setData([...state.files.entries()].map(([n, f]) => ({ name: n, role: f.role })));
    }

    /** Render a role-style tab: cards with tag sub-rows and per-tag dots. */
    function renderRoleTab(el, tabCfg) {
      const withSet = new Set((tabCfg.with || []).map(r => r.toLowerCase()));
      const withoutSet = new Set((tabCfg.without || []).map(r => r.toLowerCase()));
      const matchItems = state.items.filter(i => {
        if (withSet.size && !withSet.has(i.role)) return false;
        if (withoutSet.size && withoutSet.has(i.role)) return false;
        return true;
      });
      const count = matchItems.length;
      dom.tagCount.textContent = count;
      if (!matchItems.length) { el.innerHTML = `<div class="empty-state">No ${esc(tabCfg.title)} items loaded</div>`; return; }
      let html = '';
      for (const item of matchItems) {
        const sel = state.selectedStnda && state.selectedStnda.file === item.file && state.selectedStnda.line === item.line;
        html += `<div class="stnda-item${sel ? ' selected' : ''}" data-stnda-idx="${matchItems.indexOf(item)}">`;
        html += `<div class="stnda-item-name">${esc(item.heading || item.text || '')}</div>`;
        for (const tag of item.tags) {
          const node = CascadeTree.find(state.tagTree, tag);
          const mat = node ? CascadeTree.getMaturity(node) : null;
          html += `<div class="stnda-item-tag-row"><span class="stnda-item-tag-name" style="color:var(--accent)">#${esc(tag)}</span>${itemDots.render(mat)}</div>`;
        }
        if (item.content) html += `<div class="stnda-item-desc">${esc(item.content.split('\n')[0])}</div>`;
        html += '</div>';
      }
      el.innerHTML = html;
      el.querySelectorAll('.stnda-item').forEach(row => {
        row.addEventListener('click', () => {
          const idx = parseInt(row.dataset.stndaIdx, 10);
          const item = matchItems[idx];
          state.selectedStnda = item;
          state.selectedTag = null;
          state.centerTab = 'items';
          dom.btnCopy.disabled = false;
          renderLeft(); renderCenter(); renderRight();
        });
      });
    }

    function renderTree() {
      const el = dom.treeContent;
      if (!state.tagTree) return;
      const filter = state.treeFilter;
      const idioHits = CascadeTree.idiolectTagHits(state.tagTree, state.checkedIdioTerms, state.idiolectTerms);
      const depTargets = new Set();
      if (state.selectedTag) {
        const selNode = CascadeTree.find(state.tagTree, state.selectedTag);
        if (selNode) for (const d of CascadeTree.getDependencies(selNode)) depTargets.add(d);
      }

      function matches(n) { if (!filter) return true; if (n.fullTag.toLowerCase().includes(filter)) return true; for (const c of n.children.values()) if (matches(c)) return true; return false; }

      function renderNode(node) {
        if (!matches(node)) return '';
        const mat = CascadeTree.getMaturity(node), hasKids = node.children.size > 0;
        const exp = state.expandedTags.has(node.fullTag), sel = state.selectedTag === node.fullTag;
        const isDep = depTargets.has(node.fullTag);
        // Sum across all checkbox-stage roles
        const cbRoles = pipelineConfig.pipeline.filter(s => s.checkbox).map(s => s.name.toLowerCase());
        let tt = 0, td = 0;
        for (const r of cbRoles) { tt += (mat[r]?.count || 0); td += (mat[r]?.checked || 0); }
        const fracCls = tt ? (td === tt ? 'all-done' : td === 0 ? 'none-done' : '') : '';

        let h = `<div class="tag-row${sel ? ' selected' : ''}${isDep ? ' dep-target' : ''}" data-tag="${esc(node.fullTag)}">`;
        h += `<span class="tag-arrow ${hasKids ? (exp ? 'expanded' : '') : 'leaf'}" data-toggle="${esc(node.fullTag)}">▸</span>`;
        h += `<span class="tag-name">${esc(node.name)}</span>`;
        if (idioHits.has(node.fullTag)) h += `<span class="tag-idio-mark" title="Matches checked idiolect">◆</span>`;
        if (tt) h += `<span class="tag-frac ${fracCls}" title="${td} of ${tt} checked">${td}/${tt}</span>`;
        h += treeDots.render(mat);
        h += '</div>';
        if (hasKids) {
          const kidHtml = [...node.children.values()].sort((a,b) => a.name.localeCompare(b.name)).map(renderNode).join('');
          h += `<div class="tag-children${exp ? '' : ' collapsed'}">${kidHtml}</div>`;
        }
        return `<div>${h}</div>`;
      }

      el.innerHTML = [...state.tagTree.children.values()].sort((a,b) => a.name.localeCompare(b.name)).map(renderNode).join('') || '<div class="empty-state">No tags found</div>';
      dom.tagCount.textContent = CascadeTree.count(state.tagTree);

      el.querySelectorAll('.tag-arrow:not(.leaf)').forEach(a => {
        a.addEventListener('click', e => { e.stopPropagation(); const t = a.dataset.toggle; state.expandedTags.has(t) ? state.expandedTags.delete(t) : state.expandedTags.add(t); renderTree(); });
      });
      el.querySelectorAll('.tag-row').forEach(row => {
        row.addEventListener('click', () => {
          state.selectedTag = row.dataset.tag;
          state.selectedStnda = null;
          renderTree(); renderCenter(); renderRight();
          dom.btnCopy.disabled = !state.selectedTag;
        });
      });
    }

    function renderCenter() {
      $('centerTabs').querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.centerTab));
      if (state.centerTab === 'idiolect') renderIdiolect();
      else if (state.centerTab.startsWith('t2-')) {
        const idx = parseInt(state.centerTab.split('-')[1], 10);
        const tabCfg = pipelineConfig.tabs2[idx];
        if (tabCfg) {
          if (tabCfg.style === 'queue') renderQueueTab(dom.centerContent, tabCfg);
          else if (tabCfg.style === 'role') renderRoleTab(dom.centerContent, tabCfg);
        }
      }
      else renderItems();
    }

    function renderGroupedItems(el, items, warnMap) {
      const roles = CascadeParse.ROLES;
      const labels = CascadeParse.ROLE_LABELS;
      const groups = Object.fromEntries(roles.map(r => [r, []]));
      for (const i of items) if (groups[i.role]) groups[i.role].push(i);
      let html = '';
      for (const role of roles) {
        if (!groups[role].length) continue;
        html += `<div class="role-group"><div class="role-header ${role}">${esc(labels[role] || role)} — ${groups[role].length}</div>`;
        for (const item of groups[role]) html += renderItem(item, warnMap?.get(item.file+':'+item.line));
        html += '</div>';
      }
      return html;
    }

    function wireExpanders(el) {
      el.querySelectorAll('.item-expand').forEach(btn => {
        btn.addEventListener('click', () => { const c = btn.previousElementSibling; c.classList.toggle('expanded'); btn.textContent = c.classList.contains('expanded') ? '▲ collapse' : '▼ expand'; });
      });
    }

    function renderItems() {
      const el = dom.centerContent;

      // Role-tab multi-tag mode (e.g. STNDA, CC)
      if (state.selectedStnda) {
        const selItem = state.selectedStnda;
        const selRole = selItem.role;
        const selColor = pipelineConfig.pipeline.find(s => s.name.toLowerCase() === selRole)?.color || 'var(--success)';
        const { r: cr, g: cg, b: cb } = hexToRgb(selColor.startsWith('#') ? selColor : '#22c55e');
        const allItems = [], seen = new Set();
        for (const tag of selItem.tags) {
          const node = CascadeTree.find(state.tagTree, tag);
          if (!node) continue;
          for (const it of node.allItems) {
            const k = it.file + ':' + it.line;
            if (!seen.has(k) && it.role !== selRole) { seen.add(k); allItems.push(it); }
          }
        }
        dom.centerCount.textContent = allItems.length;
        let html = `<div style="padding:0.5rem;margin-bottom:0.5rem;background:rgba(${cr},${cg},${cb},0.08);border:1px solid rgba(${cr},${cg},${cb},0.2);border-radius:4px">`;
        html += `<div style="font-weight:600;font-size:0.82rem;margin-bottom:0.2rem;color:${selColor}">${esc(selRole.toUpperCase())}: ${esc(selItem.heading || selItem.text || '')}</div>`;
        html += `<div style="font-family:var(--font-mono);font-size:0.65rem;color:${selColor};margin-bottom:0.3rem">${selItem.tags.map(t => '#' + esc(t)).join(' ')}</div>`;
        if (selItem.content) html += `<div style="font-size:0.75rem;color:var(--text-secondary);line-height:1.5">${esc(selItem.content)}</div>`;
        html += fileLink(selItem.file, selItem.line);
        html += '</div>';
        html += renderGroupedItems(el, allItems);
        el.innerHTML = html || '<div class="empty-state">No items</div>';
        wireExpanders(el);
        return;
      }

      if (!state.selectedTag) { el.innerHTML = '<div class="empty-state">Select a tag to see items</div>'; dom.centerCount.textContent = '0'; return; }
      const node = CascadeTree.find(state.tagTree, state.selectedTag);
      if (!node) { el.innerHTML = '<div class="empty-state">Tag not found</div>'; return; }
      const items = node.allItems;
      dom.centerCount.textContent = items.length;

      const warnMap = new Map();
      const cbRoles = new Set(pipelineConfig.pipeline.filter(s => s.checkbox).map(s => s.name.toLowerCase()));
      const cbItems = items.filter(i => cbRoles.has(i.role) && i.type === 'checkbox');
      for (const i of cbItems) {
        const hasDeeper = items.some(x => x !== i && !cbRoles.has(x.role));
        const noRoles = new Set();
        for (const ni of items) if (ni.noRoles) ni.noRoles.forEach(r => noRoles.add(r));
        if (i.checked && !hasDeeper && noRoles.size === 0) warnMap.set(i.file+':'+i.line, '[x] but no elaboration found');
      }

      let html = '';
      const deps = CascadeTree.getDependencies(node);
      const usedBy = CascadeTree.getUsedBy(state.tagTree, state.selectedTag, state.items);
      if (deps.size || usedBy.length) {
        html += '<div style="padding:0.4rem 0.5rem;margin-bottom:0.5rem;background:var(--bg-tertiary);border-radius:4px;font-family:var(--font-mono);font-size:0.68rem;line-height:1.7">';
        if (deps.size) html += '<div style="color:var(--accent)">USES ' + [...deps].map(d => '#'+esc(d)).join(' ') + '</div>';
        if (usedBy.length) html += '<div style="color:var(--text-secondary)">USED BY ' + usedBy.map(u => '<span style="color:var(--accent)">#'+esc(u.tag)+'</span>').join(' ') + '</div>';
        html += '</div>';
      }
      html += renderGroupedItems(el, items, warnMap);
      el.innerHTML = html || '<div class="empty-state">No items</div>';
      wireExpanders(el);
    }

    function renderItem(item, warn) {
      const primaryTag = item.tags?.[0];
      const tagNode = primaryTag ? CascadeTree.find(state.tagTree, primaryTag) : null;
      const mat = tagNode ? CascadeTree.getMaturity(tagNode) : null;
      let h = '<div class="item"><div class="item-top">';
      h += itemDots.render(mat);
      h += `<span class="item-text">${esc(item.text || item.heading || '')}</span>`;
      if (primaryTag) h += `<span class="item-tag-right">#${esc(primaryTag)}</span>`;
      h += '</div>';
      h += fileLink(item.file, item.line);
      if (warn) h += `<div class="item-warn">⚠ ${esc(warn)}</div>`;
      if (item.noRoles?.length) h += `<div class="item-no">${item.noRoles.map(r => 'NO-'+r.toUpperCase()).join(' ')}</div>`;
      if (item.uses?.length) h += `<div class="item-uses">USES ${item.uses.map(t => '#'+esc(t)).join(' ')}</div>`;
      if (item.classes?.length) h += `<div class="item-classes">Classes: ${item.classes.join(', ')}</div>`;
      if (item.grammars?.length) h += `<div class="item-classes">Grammar: ${item.grammars.join(', ')}</div>`;
      if (item.content) {
        const long = item.content.split('\n').length > 6;
        h += `<div class="item-content${long ? '' : ' expanded'}">${esc(item.content)}</div>`;
        if (long) h += '<button class="item-expand">▼ expand</button>';
      }
      return h + '</div>';
    }

    function renderIdiolect() {
      const el = dom.centerContent;
      if (!state.idiolectTerms.length) { el.innerHTML = '<div class="empty-state">No idiolect file loaded</div>'; dom.centerCount.textContent = '0'; return; }
      const relevantSet = state.selectedTag ? CascadeTree.relevantIdiolect(CascadeTree.find(state.tagTree, state.selectedTag), state.idiolectTerms) : null;
      let litCount = 0;

      let html = '<div class="idio-toolbar">';
      html += '<button class="btn" data-idio-action="all">Check all</button>';
      html += '<button class="btn" data-idio-action="none">Uncheck all</button>';
      if (relevantSet && relevantSet.size) {
        html += '<span class="sep"></span>';
        html += '<button class="btn" data-idio-action="check-relevant">Check matched</button>';
        html += '<button class="btn" data-idio-action="uncheck-relevant">Uncheck matched</button>';
        html += '<button class="btn" data-idio-action="only-relevant">Only matched</button>';
      }
      html += '</div>';

      for (const t of state.idiolectTerms) {
        const lit = relevantSet?.has(t.term); if (lit) litCount++;
        const cls = relevantSet ? (lit ? 'lit' : 'dim') : '';
        html += `<div class="idio-term ${cls}"><input type="checkbox" data-term="${esc(t.term)}" ${state.checkedIdioTerms.has(t.term) ? 'checked' : ''}>`;
        html += `<div class="idio-term-body"><div class="idio-term-name">${esc(t.term)}${t.tags?.length ? ' <span style="font-weight:400;font-size:0.6rem;color:var(--accent)">' + t.tags.map(x=>'#'+esc(x)).join(' ') + '</span>' : ''}</div>`;
        html += `<div class="idio-term-def">${esc((t.definition||'').split('\n')[0].slice(0,140))}</div></div></div>`;
      }
      dom.centerCount.textContent = relevantSet ? `${litCount}/${state.idiolectTerms.length}` : state.idiolectTerms.length;
      el.innerHTML = html;

      el.querySelectorAll('[data-idio-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.idioAction;
          if (action === 'all') state.idiolectTerms.forEach(t => state.checkedIdioTerms.add(t.term));
          else if (action === 'none') state.checkedIdioTerms.clear();
          else if (action === 'check-relevant' && relevantSet) relevantSet.forEach(name => state.checkedIdioTerms.add(name));
          else if (action === 'uncheck-relevant' && relevantSet) relevantSet.forEach(name => state.checkedIdioTerms.delete(name));
          else if (action === 'only-relevant' && relevantSet) { state.checkedIdioTerms.clear(); relevantSet.forEach(name => state.checkedIdioTerms.add(name)); }
          renderIdiolect(); renderTree(); renderRight();
        });
      });

      el.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => { cb.checked ? state.checkedIdioTerms.add(cb.dataset.term) : state.checkedIdioTerms.delete(cb.dataset.term); renderTree(); renderRight(); });
      });
    }

    function navigateToTag(tag) {
      if (!tag) return;
      state.selectedTag = tag;
      state.selectedStnda = null;
      const parts = tag.split('/');
      let path = '';
      for (const p of parts) { path = path ? path + '/' + p : p; state.expandedTags.add(path); }
      state.centerTab = 'items';
      dom.btnCopy.disabled = false;
      renderTree(); renderCenter(); renderRight();
    }

    /** Render a queue-style tab: ready/blocked grouping using with/without from config. */
    function renderQueueTab(el, tabCfg) {
      const withRoles = (tabCfg.with || []).map(r => r.toLowerCase());
      const withoutRoles = (tabCfg.without || []).map(r => r.toLowerCase());
      if (!state.tagTree || !state.items.length) { el.innerHTML = '<div class="empty-state">Load files to see queue</div>'; dom.centerCount.textContent = '0'; return; }

      const ready = CascadeReport.readyItems(state.items, state.tagTree, withRoles, withoutRoles);
      if (!ready.length) {
        const withLabel = withRoles.join('+').toUpperCase() || '?';
        const withoutLabel = withoutRoles.join('+').toUpperCase() || '?';
        el.innerHTML = `<div class="empty-state">No items in ${esc(tabCfg.title)} queue<br><span style="font-size:0.7rem;color:var(--text-muted)">Items need ${withLabel} and no ${withoutLabel} yet</span></div>`;
        dom.centerCount.textContent = '0'; return;
      }

      const withoutSet = new Set(withoutRoles);
      const unblocked = [], blocked = [];
      for (const r of ready) {
        const node = CascadeTree.find(state.tagTree, r.tag);
        if (!node) { unblocked.push({ ...r, deps: [], blockers: [] }); continue; }
        const deps = CascadeTree.getDependencies(node);
        const blockers = [];
        for (const depTag of deps) {
          const depNode = CascadeTree.find(state.tagTree, depTag);
          const mat = depNode ? CascadeTree.getMaturity(depNode) : null;
          // A dependency is a blocker if it lacks all the "without" roles (i.e. not yet complete)
          if (!mat || ![...withoutSet].some(r => mat[r]?.count > 0)) blockers.push(depTag);
        }
        const entry = { ...r, deps: [...deps], blockers };
        if (blockers.length) blocked.push(entry); else unblocked.push(entry);
      }

      let html = '';
      dom.centerCount.textContent = ready.length;
      if (unblocked.length) {
        html += `<div class="queue-group-label ready">Ready — no blockers (${unblocked.length})</div>`;
        for (const r of unblocked) html += renderQueueItem(r);
      }
      if (blocked.length) {
        html += `<div class="queue-group-label blocked">Blocked — unresolved USES (${blocked.length})</div>`;
        for (const r of blocked) html += renderQueueItem(r);
      }
      el.innerHTML = html;
      el.querySelectorAll('.queue-item[data-tag]').forEach(item => {
        item.addEventListener('click', () => navigateToTag(item.dataset.tag));
      });
    }

    function renderQueueItem(r) {
      const node = CascadeTree.find(state.tagTree, r.tag);
      const mat = node ? CascadeTree.getMaturity(node) : null;
      let h = `<div class="queue-item" data-tag="${esc(r.tag)}">`;
      h += '<div class="queue-item-top">';
      if (mat) h += itemDots.render(mat);
      h += `<span class="queue-item-text">${esc(r.text)}</span>`;
      h += `<span class="queue-item-tag">#${esc(r.tag)}</span>`;
      h += '</div><div class="queue-item-meta">';
      if (r.otherRoles?.length) h += `<span class="has-spec">+${r.otherRoles.join('+')}</span>`;
      if (r.deps?.length) {
        if (r.blockers?.length) h += `<span class="blocked">blocked by ${r.blockers.map(t => '#' + esc(t)).join(' ')}</span>`;
        else h += `<span class="clear">deps met</span>`;
      }
      h += '</div></div>';
      return h;
    }

    function renderRight() { renderRightTabs(); state.rightTab === 'report' ? renderReport() : renderBundle(); }
    function renderRightTabs() {
      $('rightTabs').querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.rightTab));
      dom.bundleActions.style.display = state.rightTab === 'bundle' ? '' : 'none';
    }

    function buildBundleText() {
      if (state.selectedStnda) {
        const stnda = state.selectedStnda;
        const roleLabel = (stnda.role || '').toUpperCase();
        const parts = [`## ${roleLabel}: ${stnda.heading || stnda.text || ''}`, `Tags: ${stnda.tags.map(t => '#' + t).join(' ')}`];
        if (stnda.content) parts.push('', stnda.content);
        parts.push('');
        for (const tag of stnda.tags) {
          const tagBundle = CascadeBundle.build(state.tagTree, tag, state.files, state.idiolectTerms, state.prefixItems, state.checkedIdioTerms);
          if (tagBundle) { parts.push(`# ── #${tag} ──`, '', tagBundle); }
        }
        return parts.join('\n');
      }
      if (!state.selectedTag) return '';
      return CascadeBundle.build(state.tagTree, state.selectedTag, state.files, state.idiolectTerms, state.prefixItems, state.checkedIdioTerms);
    }

    function renderBundle() {
      const el = dom.rightContent;
      if (!state.selectedTag && !state.selectedStnda) { el.innerHTML = '<div class="empty-state">Select a tag to build a bundle</div>'; return; }
      el.innerHTML = `<div class="bundle-preview">${esc(buildBundleText())}</div>`;
    }

    function renderReport() {
      const el = dom.rightContent;
      if (!state.tagTree || !state.items.length) { el.innerHTML = '<div class="empty-state">Load files to see report</div>'; return; }
      let html = '';

      // Cascade Gaps — checkbox-stage items checked but tag has no other roles
      const gaps = CascadeReport.cascadeGaps(state.items, state.tagTree);
      const cbLabel = pipelineConfig.pipeline.filter(s => s.checkbox).map(s => s.name).join('/') || 'checkbox';
      html += `<div class="report-section"><div class="report-label">Cascade Gaps — [x] ${esc(cbLabel)} no elaboration (${gaps.length})</div>`;
      if (gaps.length) for (const g of gaps.slice(0,30)) html += `<div class="report-item" data-nav-tag="${esc(g.tag)}"><span class="ri-warn">⚠</span> <span class="ri-tag">#${esc(g.tag)}</span> ${esc(g.text)} ${fileLink(g.file, g.line)}</div>`;
      else html += '<div class="report-item"><span class="ri-ok">✓</span> None</div>';
      html += '</div>';

      // One report section per queue-style tab
      const queueTabs = [...(pipelineConfig.tabs1 || []), ...(pipelineConfig.tabs2 || [])].filter(t => t.style === 'queue');
      for (const qt of queueTabs) {
        const withRoles = (qt.with || []).map(r => r.toLowerCase());
        const withoutRoles = (qt.without || []).map(r => r.toLowerCase());
        const ready = CascadeReport.readyItems(state.items, state.tagTree, withRoles, withoutRoles);
        const withLabel = (qt.with || []).join('+');
        const withoutLabel = (qt.without || []).join('+');
        html += `<div class="report-section"><div class="report-label">${esc(qt.title)} — has ${esc(withLabel)}, no ${esc(withoutLabel)} (${ready.length})</div>`;
        if (ready.length) for (const r of ready.slice(0,40)) {
          const extras = r.otherRoles.length ? ' <span style="color:var(--text-muted)">[+' + r.otherRoles.join('+') + ']</span>' : '';
          html += `<div class="report-item" data-nav-tag="${esc(r.tag)}"><span class="ri-ok">▸</span> <span class="ri-tag">#${esc(r.tag)}</span> ${esc(r.text)}${extras}</div>`;
        }
        else html += '<div class="report-item"><span class="ri-ok">✓</span> None</div>';
        html += '</div>';
      }

      // Most Depended-On — blocker detection uses first queue tab's without roles
      const allUses = state.items.filter(i => i.uses?.length);
      if (allUses.length) {
        const blockerRoles = queueTabs.length ? new Set((queueTabs[0].without || []).map(r => r.toLowerCase())) : new Set();
        const useCounts = new Map();
        for (const item of allUses)
          for (const u of item.uses) useCounts.set(u, (useCounts.get(u) || 0) + 1);
        const sorted = [...useCounts.entries()].sort((a,b) => b[1] - a[1]);
        html += `<div class="report-section"><div class="report-label">Most Depended-On (${sorted.length} targets)</div>`;
        for (const [tag, count] of sorted.slice(0, 20)) {
          const node = CascadeTree.find(state.tagTree, tag);
          const mat = node ? CascadeTree.getMaturity(node) : null;
          // Check if dep has any of the "completion" (without) roles
          const hasCompletion = blockerRoles.size && mat ? [...blockerRoles].some(r => mat[r]?.count > 0) : false;
          // Also check if it has any non-checkbox roles at all
          const cbRoles = new Set(pipelineConfig.pipeline.filter(s => s.checkbox).map(s => s.name.toLowerCase()));
          const hasAnyWork = mat ? CascadeParse.ROLES.some(r => !cbRoles.has(r) && mat[r]?.count > 0) : false;
          const indicator = hasCompletion ? `<span style="color:${cascadeStages[cascadeStages.length-1]?.color || 'var(--success)'}">●</span>`
            : hasAnyWork ? `<span style="color:${cascadeStages[Math.floor(cascadeStages.length/2)]?.color || 'var(--text-secondary)'}">●</span>`
            : '<span style="color:var(--danger)">○</span>';
          const isBlocker = !hasCompletion && !hasAnyWork;
          html += `<div class="report-item" data-nav-tag="${esc(tag)}">${indicator} <span class="ri-tag">#${esc(tag)}</span> — ${count} dependant${count > 1 ? 's' : ''}${isBlocker ? ' <span style="color:var(--danger);font-size:0.6rem">⬅ blocker</span>' : ''}</div>`;
        }
        html += '</div>';
      }

      const typos = CascadeReport.tagTypos(state.items);
      html += `<div class="report-section"><div class="report-label">Possible Tag Typos (${typos.length})</div>`;
      if (typos.length) for (const [a,b] of typos) html += `<div class="report-item" data-nav-tag="${esc(a)}"><span class="ri-err">?</span> <span class="ri-tag">#${esc(a)}</span> ↔ <span class="ri-tag">#${esc(b)}</span></div>`;
      else html += '<div class="report-item"><span class="ri-ok">✓</span> None</div>';
      html += '</div>';

      html += `<div class="report-section"><div class="report-label">Coverage by Domain</div>`;
      for (const [name, child] of [...state.tagTree.children.entries()].sort((a,b) => a[0].localeCompare(b[0]))) {
        const mat = CascadeTree.getMaturity(child), total = child.allItems.length;
        html += `<div class="report-item" data-nav-tag="${esc(name)}"><span class="ri-tag">#${esc(name)}</span> — ${total} items`;
        for (const s of cascadeStages) if (mat[s.name]?.count) html += ` · <span style="color:${s.color}">${s.name}:${mat[s.name].count}</span>`;
        html += '</div>';
        const barParts = cascadeStages.map(s => mat[s.name]?.count ? `<span style="width:${Math.max(mat[s.name].count/total*100,2)}%;background:${s.color}"></span>` : '').join('');
        html += `<div class="report-bar">${barParts}</div>`;
      }
      html += '</div>';

      const orphans = CascadeReport.singleFileTags(state.items);
      html += `<div class="report-section"><div class="report-label">Single-File Tags (${orphans.length})</div>`;
      for (const o of orphans.slice(0,40)) html += `<div class="report-item" data-nav-tag="${esc(o.tag)}"><span class="ri-tag">#${esc(o.tag)}</span> only in ${fileLink(o.file, o.line)}</div>`;
      html += '</div>';

      el.innerHTML = html;
      el.addEventListener('click', e => {
        const item = e.target.closest('[data-nav-tag]');
        if (item) navigateToTag(item.dataset.navTag);
      });
    }

    function copyBundle() {
      const text = buildBundleText();
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => status('Bundle copied', 'success')).catch(() => status('Copy failed', 'error'));
    }

    // ── Init ──
    function init() {
      suppressBrowserDragDrop();
      setupDropZone($('dropMd'), async h => { state.mdHandle = h; await scanMdFiles(); }, msg => status(msg, 'error'));
      setupDropZone($('dropCode'), scanCodeDir, msg => status(msg, 'error'));
      // Fixed tabs — custom tabs added by applyConfig / _buildCustomTabs
      setupTabs($('leftTabs'), tab => { state.leftTab = tab; renderLeft(); });
      setupTabs($('centerTabs'), tab => { state.centerTab = tab; renderCenter(); });
      setupTabs($('rightTabs'), tab => { state.rightTab = tab; renderRight(); });
      setupFilter($('treeFilter'), $('filterClear'), val => { state.treeFilter = val.toLowerCase(); renderTree(); });
      dom.btnRescan.addEventListener('click', () => scanMdFiles());
      dom.btnCopy.addEventListener('click', copyBundle);
      // Apply default config (injects CSS, builds custom tabs)
      applyConfig(DEFAULT_CONFIG);

      // Delegated click for preview modal — works across all panels
      document.addEventListener('click', e => {
        const sub = e.target.closest('[data-preview-file]');
        if (!sub) return;
        const filename = sub.dataset.previewFile;
        const line = parseInt(sub.dataset.previewLine, 10) || null;
        const fileInfo = state.files.get(filename);
        if (!fileInfo) return;
        preview.show(filename, fileInfo.content.split('\n'), line);
      });
    }
    init();
  </script>
</body>
</html>
