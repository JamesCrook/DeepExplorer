//<< import { EdgeSnapController } from './edge-snap-controller.js';
//-- file: ./edge-snap-controller.js --
//>> import { SYS, sceneRegistry } from './sys.js';
//>> import { Values } from './values.js';
//>> import { Utils } from './utils.js';
//>> import { BasicCollectionNode } from './basic-collection-node.js';
//>> import { PipperNode } from './pipper-node.js';
//>> import './pipped-edge-ref-node.js';   // 'pipped-edge'
//>> export { EdgeSnapController };

/* ─────────────────────────────────────────────────────────────────────────────
EdgeSnapController — edges and junctions stay attached to the pips they meet.

This class is droppable, and names no other controller.  It answers hooks
announced by PipperNode rather than being called by RaftSnapController:

  onFracture        a tile pair came apart — put an edge where the join was
  clearForTileJoin  two tiles want to abut — remove the edges in the way
  onDropped         a drag came to rest — attach free edge ends nearby
  settle            re-derive edge geometry after anything moved

With this class dropped, tiles still raft: they simply never grow edges.
──────────────────────────────────────────────────────────────────────────── */
class EdgeSnapController {
  static SNAP_DIST = 12;
  static SPLIT_DIST = 10;

  constructor(edgeType = 'pipped-edge') {
    this.edgeType = edgeType;
    this.claimPriority = 0;   // offered drags after more specific controllers
  }

  // ── shared helpers ───────────────────────────────────────────────

  _remove(arenaNode, mgr, node) {
    mgr.removeNode(node);
    const idx = arenaNode.subtree.indexOf(node);
    if (idx >= 0) arenaNode.subtree.splice(idx, 1);
  }

  _driverOf(arenaNode, mgr, set) {
    for (const e of set) if (mgr.kindAt(e.node, e.pip).anchors) return e;
    for (const e of set) if (PipperNode.isDragged(arenaNode, e.node, e.pip)) return e;
    return set[0] || null;
  }

  // ── layout ───────────────────────────────────────────────────────
  /* Every follower in a set moves to the driving pip.  Two passes let a
     position propagate along a chain of edges within one frame. */

  layout(arenaNode, params) {
    const mgr = PipperNode.manager(arenaNode);

    for (let pass = 0; pass < 2; pass++) {
      for (const set of mgr.sets) {
        if (!set.some(e => mgr.kindAt(e.node, e.pip).follows)) continue;

        const driver = this._driverOf(arenaNode, mgr, set);
        if (!driver) continue;
        const pos = mgr.posOf(driver, params);
        if (!pos) continue;

        for (const e of set) {
          if (e === driver) continue;
          if (!mgr.kindAt(e.node, e.pip).follows) continue;
          Utils.setPipFn(e.node)?.(Values, e.node, { idx: e.pip, x: pos.x, y: pos.y });
        }
      }
    }
  }

  settle(arenaNode, params) {
    this.deleteOrphanEdges(arenaNode);
    this.layout(arenaNode, params);
  }

  // ── hooks from other controllers ─────────────────────────────────
  //   onFracture / clearForTileJoin / onDropped / onRemoving / settle

  onFracture(arenaNode, a, b, params) {
    this.spawnEdge(arenaNode, a, b, params);
  }

  clearForTileJoin(arenaNode, refs, params) {
    for (const ref of refs) this.deleteEdgesOnPip(arenaNode, ref);
  }

  onDropped(arenaNode, movedNodes, params) {
    this.connectFreeEdgePips(arenaNode, movedNodes, params);
  }

  /* A tile is leaving.  Its edges were there to reach it, so they go with it
     — the same judgement clearForTileJoin makes when a pip is needed for
     something else.  A departing follower takes nothing with it: an edge
     dragged away is just an edge. */
  onRemoving(arenaNode, child, params) {
    const mgr = PipperNode.manager(arenaNode);
    if (mgr.isFollower(child)) return;
    for (const { entry } of mgr.entriesOf(child)) this.deleteEdgesOnPip(arenaNode, entry);
  }

  // ── spawning and reaping ─────────────────────────────────────────

  spawnEdge(arenaNode, a, b, params) {
    if (!sceneRegistry.meta[this.edgeType]) return null;
    const mgr = PipperNode.manager(arenaNode);

    const pa = mgr.posOf(a, params), pb = mgr.posOf(b, params);
    if (!pa || !pb) return null;

    const cls = sceneRegistry.meta[this.edgeType]?.nodeClass;
    const edge = SYS.makeNode(this.edgeType, cls.spanValue(pa, pb));
    arenaNode.subtree.push(edge);
    mgr.join({ node: edge, pip: 0 }, a, params);
    mgr.join({ node: edge, pip: 1 }, b, params);
    return edge;
  }

  deleteEdgesOnPip(arenaNode, ref) {
    const mgr = PipperNode.manager(arenaNode);
    const set = mgr.setFor(ref.node, ref.pip);
    if (!set) return;

    const doomed = set.filter(e => e.node !== ref.node && mgr.isEdge(e.node)).map(e => e.node);
    for (const edge of doomed) this._remove(arenaNode, mgr, edge);
  }

  deleteOrphanEdges(arenaNode) {
    const mgr = PipperNode.manager(arenaNode);
    for (let i = arenaNode.subtree.length - 1; i >= 0; i--) {
      const child = arenaNode.subtree[i];
      if (!mgr.isEdge(child)) continue;
      if (mgr.entriesOf(child).length) continue;
      arenaNode.subtree.splice(i, 1);
    }
  }

  // ── attaching on drop ────────────────────────────────────────────

  // Free pips of a moved node reach for the nearest pip that will take them.
  connectNearbyPips(arenaNode, moved, params) {
    const mgr = PipperNode.manager(arenaNode);
    const pips = mgr.pipsOf(moved, params);

    for (let pip = 0; pip < pips.length; pip++) {
      const ref = { node: moved, pip };
      const match = mgr.nearest(arenaNode.subtree, pips[pip], params, {
        skip: cand => cand.node === moved,
        accept: cand => mgr.canJoin(ref, cand, params),
      });
      if (match) mgr.join(ref, match, params);
    }
  }

  // After a raft comes to rest, free tile pips pick up any edge end nearby.
  connectFreeEdgePips(arenaNode, movedNodes, params) {
    const mgr = PipperNode.manager(arenaNode);

    for (const body of movedNodes) {
      if (mgr.isFollower(body)) continue;
      const pips = mgr.pipsOf(body, params);

      for (let pip = 0; pip < pips.length; pip++) {
        const ref = { node: body, pip };
        if (mgr.has(ref)) continue;
        const match = mgr.nearest(arenaNode.subtree, pips[pip], params, {
          accept: cand => mgr.kindOf(cand).follows && mgr.canJoin(ref, cand, params),
        });
        if (match) mgr.join(ref, match, params);
      }
    }
  }

  // A dragged cluster of follower pips lands on whatever is nearest.
  _connectClusterOnDrop(arenaNode, cluster, params) {
    if (!cluster.length) return;
    const mgr = PipperNode.manager(arenaNode);
    const head = cluster[0];
    const pos = mgr.posOf(head, params);
    if (!pos) return;

    const inCluster = ref => cluster.some(c => c.node === ref.node && c.pip === ref.pip);
    const match = mgr.nearest(arenaNode.subtree, pos, params, {
      skip: inCluster,
      accept: cand => mgr.canJoin(head, cand, params),
    });
    if (match) mgr.join(head, match, params);
  }

  // ── drag interaction factory ─────────────────────────────────────

  _createDragInteractions(arenaNode, targetNode, inner, params, hooks) {
    const mgr = PipperNode.manager(arenaNode);
    let initialised = false;

    const init = () => {
      if (initialised) return;
      initialised = true;
      hooks.onInit?.(mgr);
    };

    return {
      applyDrag: (wx, wy) => {
        init();
        inner.applyDrag(wx, wy);
        hooks.onApply?.(mgr);
        PipperNode.updateProximity(arenaNode, params);
      },
      endDrag: (onStockStrip) => {
        if (onStockStrip) {
          this._remove(arenaNode, mgr, targetNode);
          this.deleteOrphanEdges(arenaNode);
        } else if (initialised) {
          hooks.onConnect?.(mgr);
          this._absorbJunctions(arenaNode, params);
          this.settle(arenaNode, params);
        }
        PipperNode.clearDragState(arenaNode);
        BasicCollectionNode._sortSubtree(arenaNode.subtree);
        inner.endDrag?.(onStockStrip);
      },
    };
  }

  // ── the three drags ──────────────────────────────────────────────

  // An edge end, grabbed at the pip.  Its whole coincident cluster travels.
  _wrapEndpointDrag(arenaNode, hitResult, pipIdx, params) {
    const inner = hitResult.interactions;
    if (!inner) return;

    const edge = hitResult.node;
    const mgr = PipperNode.manager(arenaNode);
    const cluster = mgr.followerCluster(edge, pipIdx).map(e => ({ node: e.node, pip: e.pip }));

    hitResult.interactions = this._createDragInteractions(arenaNode, edge, inner, params, {
      onInit: () => {
        const set = mgr.setFor(edge, pipIdx);
        if (set) mgr.detachTiles(set);
        PipperNode.setDraggedRefs(arenaNode, cluster, params);
      },
      onApply: () => {
        const pos = mgr.pipsOf(edge, params)[pipIdx];
        if (pos) {
          for (const ref of cluster) {
            if (ref.node === edge && ref.pip === pipIdx) continue;
            Utils.setPipFn(ref.node)?.(Values, ref.node, { idx: ref.pip, x: pos.x, y: pos.y });
          }
        }
        this.layout(arenaNode, params);
      },
      onConnect: () => this._connectClusterOnDrop(arenaNode, cluster, params),
    });
  }

  // An edge or junction grabbed by its body: it parts from everything, then
  // takes up whatever it is dropped beside.
  _wrapFollowerBodyDrag(arenaNode, hitResult, child, params) {
    const inner = hitResult.interactions;
    if (!inner) return;

    hitResult.interactions = this._createDragInteractions(arenaNode, child, inner, params, {
      onInit: (mgr) => {
        mgr.removeNode(child);
        PipperNode.setDraggedPips(arenaNode, [child], params);
      },
      onConnect: () => this.connectNearbyPips(arenaNode, child, params),
    });
  }

  // A tile nobody else claimed.  Its pips anchor, so its edges simply follow.
  _wrapTileBodyDrag(arenaNode, hitResult, child, params) {
    const inner = hitResult.interactions;
    if (!inner) return;

    hitResult.interactions = this._createDragInteractions(arenaNode, child, inner, params, {
      onInit: () => PipperNode.setDraggedPips(arenaNode, [child], params),
      onApply: () => this.layout(arenaNode, params),
      onConnect: () => this.connectNearbyPips(arenaNode, child, params),
    });
  }

  // A junction: its tile joins become real edges so it can be pulled away.
  _wrapJunctionDrag(arenaNode, hitResult, child, params) {
    const inner = hitResult.interactions;
    if (!inner) return;

    hitResult.interactions = this._createDragInteractions(arenaNode, child, inner, params, {
      onInit: (mgr) => {
        for (const { set, entry } of mgr.entriesOf(child)) {
          const tiles = set.filter(e => mgr.kindAt(e.node, e.pip).anchors)
                           .map(e => ({ node: e.node, pip: e.pip }));
          for (const tile of tiles) {
            mgr.disjoin(tile.node, tile.pip);
            this.spawnEdge(arenaNode, tile, entry, params);
          }
        }
        PipperNode.setDraggedPips(arenaNode, [child], params);
      },
      onApply: () => {
        this.layout(arenaNode, params);
        this._scanSnapEdge(arenaNode, child, params);
      },
      onConnect: () => {
        const snaps = arenaNode.state?.snapEdges;
        if (snaps?.length) {
          for (const snap of snaps) this._splitEdgeAtJunction(arenaNode, child, snap, params);
          return;
        }
        this.connectNearbyPips(arenaNode, child, params);
      },
    });
  }

  // ── snap-to-edge ─────────────────────────────────────────────────

  _scanSnapEdge(arenaNode, junction, params) {
    const state = (arenaNode.state ||= {});
    state.snapEdges = null;

    const jx = junction.value.x, jy = junction.value.y;
    const snaps = [];

    for (const child of arenaNode.subtree) {
      const segments = Utils.classOfNode(child)?.getSnapSegments?.(Values, child, params);
      if (!segments) continue;

      for (const seg of segments) {
        const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1, lenSq = dx * dx + dy * dy;
        if (lenSq < 1) continue;

        const t = Math.max(0, Math.min(1, ((jx - seg.x1) * dx + (jy - seg.y1) * dy) / lenSq));
        const exclude = 8 / Math.sqrt(lenSq);
        if (t < exclude || t > 1 - exclude) continue;

        const px = seg.x1 + t * dx, py = seg.y1 + t * dy;
        if (Math.hypot(jx - px, jy - py) < EdgeSnapController.SPLIT_DIST)
          snaps.push({ edge: child, t, x: px, y: py });
      }
    }
    state.snapEdges = snaps.length ? snaps : null;
  }

  _splitEdgeAtJunction(arenaNode, junction, snap, params) {
    const mgr = PipperNode.manager(arenaNode);
    const edge = snap.edge;
    if (!arenaNode.subtree.includes(edge)) return;

    const group = edge.value.group;
    Values.setValue(Values, junction, params,
      group ? { x: snap.x, y: snap.y, group } : { x: snap.x, y: snap.y });

    // What the old edge reached at either end.
    const reach = pip => {
      const set = mgr.setFor(edge, pip);
      const other = set?.find(e => e.node !== edge);
      return other ? { node: other.node, pip: other.pip } : null;
    };
    const near = reach(0), far = reach(1);

    const values = Utils.classOfNode(edge).splitValues(edge, snap);
    if (group) for (const v of values) v.group = group;

    this._remove(arenaNode, mgr, edge);

    const halves = values.map(v => SYS.makeNode(edge.type, v));
    arenaNode.subtree.push(...halves);

    const jRef = { node: junction, pip: 0 };
    if (near) mgr.join({ node: halves[0], pip: 0 }, near, params);
    mgr.join({ node: halves[0], pip: 1 }, jRef, params);
    mgr.join({ node: halves[1], pip: 0 }, jRef, params);
    if (far) mgr.join({ node: halves[1], pip: 1 }, far, params);
  }

  getExtraAffordances(arenaNode) {
    const out = [];
    for (const snap of arenaNode.state?.snapEdges || []) {
      const v = snap.edge.value;
      out.push(
        { x: snap.x, y: snap.y, state: 'edge' },
        { x: v.x1,   y: v.y1,   state: 'edge' },
        { x: v.x2,   y: v.y2,   state: 'edge' },
      );
    }
    return out;
  }

  // ── absorbing pass-through junctions ─────────────────────────────
  /* A junction sharing a set with a tile and with real edge ends was only
     a staging post for those edges reaching the tile.  A junction sitting
     alone on a tile survives: it is a handle for edges yet to come. */

  /* A pip set holds at most one junction.  When another is dragged onto it
     the newcomer wins and the incumbent is absorbed, its other connections
     rehomed onto the survivor. */
  _absorbDuplicateJunctions(arenaNode, params) {
    const mgr = PipperNode.manager(arenaNode);
    let changed = true;

    while (changed) {
      changed = false;
      for (const set of [...mgr.sets]) {
        const junctions = [...new Set(set.filter(e => mgr.isJunction(e.node)).map(e => e.node))];
        if (junctions.length < 2) continue;

        const winner = junctions.find(n => PipperNode.isDragged(arenaNode, n, 0)) ?? junctions[0];
        for (const loser of junctions) {
          if (loser === winner) continue;
          for (const { set: other, entry } of mgr.entriesOf(loser)) {
            if (other === set) continue;
            mgr.disjoin(loser, entry.pip);
            const survivor = other.find(e => e.node !== loser);
            if (survivor) mgr.join({ node: winner, pip: 0 }, survivor, params);
          }
          this._remove(arenaNode, mgr, loser);
          changed = true;
        }
      }
    }
  }

  _absorbJunctions(arenaNode, params) {
    const mgr = PipperNode.manager(arenaNode);
    this._absorbDuplicateJunctions(arenaNode, params);
    let changed = true;

    while (changed) {
      changed = false;
      for (const child of [...arenaNode.subtree]) {
        if (!mgr.isJunction(child)) continue;

        const absorbable = mgr.entriesOf(child).some(({ set, entry }) =>
          set.some(e => e.node !== child && mgr.kindAt(e.node, e.pip).anchors) &&
          set.some(e => e.node !== child && mgr.isEdge(e.node)));

        if (!absorbable) continue;
        this._remove(arenaNode, mgr, child);
        changed = true;
      }
    }
    this.deleteOrphanEdges(arenaNode);
  }

  // ── claim ────────────────────────────────────────────────────────

  wrapHit(ctxMix, arenaNode, hitResult, params, endpointInfo) {
    const mgr = PipperNode.manager(arenaNode);
    const node = hitResult.node;

    if (endpointInfo) {
      this._wrapEndpointDrag(arenaNode, hitResult, endpointInfo.pipIdx, params);
    } else if (mgr.isJunction(node)) {
      this._wrapJunctionDrag(arenaNode, hitResult, node, params);
    } else if (mgr.isFollower(node)) {
      this._wrapFollowerBodyDrag(arenaNode, hitResult, node, params);
    } else {
      this._wrapTileBodyDrag(arenaNode, hitResult, node, params);
    }
    return true;
  }
}
SYS.CONTROLS.push({ type: 'checkbox', id: 'enableEdgeSnap', label: 'Edge Snap', value: true })

//<< import { BasicCollectionNode } from './basic-collection-node.js';
//-- file: ./basic-collection-node.js --
//>> import { sceneRegistry } from './sys.js';
//>> import { Utils } from './utils.js';
//>> export { BasicCollectionNode };
class BasicCollectionNode {
  // Selection lives on the item, so clearing it is a walk over the scene.
  static clear_selection(ctxMix, node, params) {
    if (node.state) node.state.selected = undefined;
  }

  static _sortSubtree(sub) {
    sub.sort((a, b) => {
      const az = Utils.classOfNode(a)?.meta?.zOrder ?? 0;
      const bz = Utils.classOfNode(b)?.meta?.zOrder ?? 0;
      return az - bz;
    });
  }

  static after_child_hit_test(ctxMix, node, params, child) {
    if (ctxMix.hitResult && ctxMix.hitResult.node === child && !ctxMix.hoverOnly) {
      const inner = ctxMix.hitResult.interactions;
      const sub = node.subtree;
      ctxMix.hitResult.interactions = {
        applyDrag: (wx, wy) => { if (inner && inner.applyDrag) inner.applyDrag(wx, wy); },
        endDrag: (onStrip) => {
          if (inner && inner.endDrag) inner.endDrag(onStrip);
          if (onStrip) {
            const idx = sub.indexOf(child);
            if (idx >= 0) sub.splice(idx, 1);
          }
        }
      };
    }
  }
}

//<< import { CameraNode } from './camera-node.js';
//-- file: ./camera-node.js --
//>> import { sceneRegistry } from './sys.js';
//>> export { CameraNode };
class CameraNode {
  static before_draw2d(ctxMix, node, params) {
    const c = ctxMix.ctx;
    const cam = node.value.cam;
    cam.apply(c);

    const spacing = 40, l = cam.ox, t = cam.oy;
    const W = ctxMix.getWH().W;
    const H = ctxMix.getWH().H;
    const r = l + W / cam.z, b = t + H / cam.z;

    c.fillStyle = '#1c1c38'; 
    const ds = 1 / cam.z;
    for (let x = Math.floor(l / spacing) * spacing; x <= r; x += spacing)
      for (let y = Math.floor(t / spacing) * spacing; y <= b; y += spacing)
        c.fillRect(x, y, ds, ds);
  }

  static after_draw2d(ctxMix, node, params) {
    node.value.cam.reset(ctxMix.ctx);
  }

  static before_hit_test(ctxMix, node, params) {
    node.value.savedHit = ctxMix.hitPoint;
    if (ctxMix.hitPoint) {
      ctxMix.hitPoint = node.value.cam.toWorld(ctxMix.hitPoint.x, ctxMix.hitPoint.y);
    }
  }

  static after_hit_test(ctxMix, node, params) {
    ctxMix.hitPoint = node.value.savedHit;
  }
}

//<< import { StockStripNode } from './stock-strip-node.js';
//-- file: ./stock-strip-node.js --
//>> import { SYS, sceneRegistry } from './sys.js';
//>> import { Geo } from './geo.js';
//>> import { Values } from './values.js';
//>> import { Utils } from './utils.js';
//>> import { BasicCollectionNode } from './basic-collection-node.js';
//>> import { PipperNode } from './pipper-node.js';
//>> export { StockStripNode };
class StockStripNode {
  static layout(ctxMix, node) {
    const { W, H } = ctxMix.getWH();
    const stripH = node.value.height, protos = node.subtree, y = H - stripH / 2;
    const gap = Math.min(120, W / (protos.length + 1)), x0 = (W - gap * (protos.length - 1)) / 2;
    protos.forEach((p, i) => {
      const cx = x0 + gap * i, cy = y;
      StockStripNode.setXY( p, cx, cy );
    });
  }

  static setXY( node, x, y ){
    const cls = Utils.classOfNode(node);
    if (cls && cls.setXY) 
      cls.setXY(Values, node, { x: x, y: y });
    else 
      Values.setValue(Values, node, {}, { x, y });
  }

  static before_draw2d(ctxMix, node, params) {
    StockStripNode.layout(ctxMix, node);
    const ctx = ctxMix.ctx, { W, H } = ctxMix.getWH(), stripH = node.value.height;
    const opacity = (params.stripOpacity ?? 100) / 100;

    ctx.save(); 
    ctx.globalAlpha = opacity; 
    ctx.fillStyle = '#16163a'; 
    ctx.fillRect(0, H - stripH, W, stripH); 
    ctx.restore();

    ctx.strokeStyle = '#282850'; ctx.lineWidth = 1; 
    ctx.beginPath(); ctx.moveTo(0, H - stripH); ctx.lineTo(W, H - stripH); ctx.stroke();
  }

// This is called if there was nothing in the stock strip.
// Call the before_draw2d, so that we still draw the (empty) background 
  static draw2d(ctxMix, node, params) {
    StockStripNode.before_draw2d(ctxMix, node, params)
  }

  static before_child_draw2d(ctxMix, node, params, child) {
    ctxMix.ctx.save();
    ctxMix.ctx.globalAlpha = 1.0;
  }

  static after_child_draw2d(ctxMix, node, params, child) {
    const ctx = ctxMix.ctx, cls = Utils.classOfNode(child);
    let cx = child.value.x, cy = child.value.y;

    if (cls && cls.getCentreXY) {
      const center = cls.getCentreXY(ctxMix, child, params);
      cx = center.x; cy = center.y;
    }

    const stripPips = Utils.pipsFn(child);
    if (stripPips) {
      for (const p of stripPips(ctxMix, child, params)) {
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Geo.TAU); 
        ctx.strokeStyle = '#666'; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    ctx.restore();

    ctx.fillStyle = '#556'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(child.value.label || '', cx, cy + 27);
  }

  static before_hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt || pt.y < ctxMix.getWH().H - node.value.height) {
      ctxMix.abortPhase = true; 
      return;
    }
    StockStripNode.layout(ctxMix, node);
  }

  static after_child_hit_test(ctxMix, node, params, child) {
    if (!ctxMix.hitResult) return;

    const arena = node.inst?.arenaNode;
    const camNode = node.inst?.cameraNode;

    if (!arena || !camNode) {
      ctxMix.hitResult.isStockPrototype = true;
      ctxMix.abortPhase = true;
      return;
    }

    const proto = ctxMix.hitResult.node;
    const pt = ctxMix.hitPoint;

// Convert screen coords → camera world coords
    const toWorld = (sx, sy) => {
      const v = camNode.value;
      const cx = v.centerOrigin ? ctxMix.W / 2 : 0;
      const cy = v.centerOrigin ? ctxMix.H / 2 : 0;
      const z  = v.zoom || 1;
      return {
        x: (sx - cx) / z + (v.scrollX || 0),
        y: (sy - cy) / z + (v.scrollY || 0),
      };
    };

// Capture click offset relative to proto centre (in screen space)
    const cls = Utils.classOfNode(proto);
    let protoCx = proto.value.x || 0, protoCy = proto.value.y || 0;
    if (cls?.getCentreXY) {
      const c = cls.getCentreXY(ctxMix, proto, params);
      protoCx = c.x; protoCy = c.y;
    }
    const offX = pt.x - protoCx;
    const offY = pt.y - protoCy;

// Clone creation and controller wrapping are deferred to first applyDrag
// (after_child_hit_test also fires on hover, where we must not spawn)
    let clone = null;
    let innerDrag = null;
    let innerEnd = null;

    ctxMix.hitResult = {
      node: proto,
      interactions: {
        applyDrag(sx, sy) {
          const w = toWorld(sx - offX, sy - offY);

          if (!clone) {
      // First drag: create clone, run hit_test, wrap with controllers
            const overrides = cls?.meta?.spawnOverrides?.(w) ?? { x: w.x, y: w.y };
            clone = SYS.cloneProto(proto, overrides);
            arena.subtree.push(clone);
            BasicCollectionNode._sortSubtree(arena.subtree);

            const cloneCls = Utils.classOfNode(clone);
            // The strip is a sibling of the camera, so its coords are already
            // world coords for the arena: carry the incoming context through.
            const cloneMix = { ...ctxMix, hitPoint: w, hitResult: null };
            cloneCls.hit_test(cloneMix, clone, params);

            if (cloneMix.hitResult) {
              PipperNode.claim(cloneMix, arena, cloneMix.hitResult, params);
              innerDrag = cloneMix.hitResult.interactions?.applyDrag;
              innerEnd  = cloneMix.hitResult.interactions?.endDrag;
            }
          }

          if (innerDrag) innerDrag(w.x, w.y);
          else StockStripNode.setXY(clone, w.x, w.y);
          return clone;
        },
        endDrag(onStrip) {
          if (!clone) return;
          if (onStrip) {
            if (innerEnd) innerEnd(true);
      // Belt-and-suspenders: ensure clone is removed
            const idx = arena.subtree.indexOf(clone);
            if (idx >= 0) arena.subtree.splice(idx, 1);
            PipperNode.manager(arena).removeNode(clone);
          } else {
            if (innerEnd) innerEnd(false);
          }
        },
      },
    };
    ctxMix.abortPhase = true;
  }
}


SYS.NODE_CLASSES.push({ name: 'stock-strip', cls: StockStripNode });;
//-- endfile --




//<< import { SeedModel } from './seed-model.js';
//-- file: ./seed-model.js --
//>> import { SYS } from './sys.js';
//>> import { Geo } from './geo.js';
//>> import { Values } from './values.js';
//>> import { BasicCollectionNode } from './basic-collection-node.js';
//>> import { EdgeSnapController } from './edge-snap-controller.js';
//>> import { makeZoomableCamera } from './make-camera.js';
//>> import { PippedPolygonNode } from './pipped-polygon-node.js';
//>> import { PipperNode } from './pipper-node.js';
//>> import { RaftSnapController } from './raft-snap-controller.js';
//>> import './fracture-cone-node.js';   // 'fracture-cone'
//>> export { SeedModel };
class SeedModel{
  get name() { return '2D Raft'; }
  get btnClass() { return 'green'; }
  get displayType() { return '2d'; }

  constructor() {
    this.visible = true;
    const scene = this.getScene();
    
    const arena = SYS.makeNode('pipper-node', {});
    arena.inst = {
      controllers: [
        typeof EdgeSnapController !== 'undefined' ? new EdgeSnapController() : null,
        typeof RaftSnapController !== 'undefined' ? new RaftSnapController() : null,
      ].filter(Boolean),
    };
    PipperNode.loadScene(arena, scene, {});

    const coneNode = SYS.makeNode('fracture-cone', {});
    coneNode.inst = { target: arena };
    const cam = makeZoomableCamera(
      SYS.makeNode('group', {}, [arena, coneNode]),
      { centerOrigin: true }
    );
    this.sceneRoot = cam;
  }
  getScene() {
    const group = SYS.makeNode('group', { connections: [] });
    const step = SYS.R * Math.cos(Math.PI / 4) * 2;
    const sub = group.subtree;
    const dim = 2;

    for (let row = -dim; row <= dim; row++) {
      for (let col = -dim; col <= dim; col++) {
        sub.push(SYS.makeNode('pipped-polygon', { x: col * step, y: row * step, 
          r: SYS.R, n: 4, tilt: Math.PI / 4 }));
      }
    }
    BasicCollectionNode._sortSubtree(sub);

    this._makeConnections(group);
    return group;
  }

  // Emits id-based specs, the same form the PEG parser produces.
  // The arena resolves them to references; the ids do not outlive the load.
  _makeConnections(group){
    const conns = group.value.connections;
    const nodes = group.subtree.filter(n => n.type === 'pipped-polygon');
    const taken = new Set();
    const key = (n, pip) => `${n.value.id}:${pip}`;

// Auto-connect properly positioned starter tiles
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const ap = PippedPolygonNode.getPips(Values, nodes[i], {});
        const bp = PippedPolygonNode.getPips(Values, nodes[j], {});
        for (let ai = 0; ai < ap.length; ai++) {
          for (let bi = 0; bi < bp.length; bi++) {
            if (!Geo.pipsOpposite(ap[ai].out, bp[bi].out)) continue;
            if (Geo.dist(ap[ai], bp[bi]) >= 2) continue;
            if (taken.has(key(nodes[i], ai)) || taken.has(key(nodes[j], bi))) continue;
            taken.add(key(nodes[i], ai));
            taken.add(key(nodes[j], bi));
            conns.push({ a: nodes[i].value.id, pipA: ai, b: nodes[j].value.id, pipB: bi });
          }
        }
      }
    }
  }
}
SYS.MODELS.push( new SeedModel() )

class TCACycleModel{
  get name() { return 'TCA Cycle'; }

  constructor() {
    this.visible = true;

    this.sceneRoot = makeZoomableCamera(group, { centerOrigin: true });
  }

  static STEPS = [
    { id: 'oaa', label: 'OAA',  sub: 'Oxaloacetate',   color: '#4a7eff' }, { id: 'cit', label: 'Cit',  sub: 'Citrate',         color: '#3fb950' },
    { id: 'iso', label: 'Iso',  sub: 'Isocitrate',      color: '#3fb950' }, { id: 'akg', label: 'αKG',  sub: 'α-Ketoglutarate', color: '#d29922' },
    { id: 'sca', label: 'SCoA', sub: 'Succinyl-CoA',    color: '#d29922' }, { id: 'suc', label: 'Suc',  sub: 'Succinate',        color: '#bc8cff' },
    { id: 'fum', label: 'Fum',  sub: 'Fumarate',         color: '#bc8cff' }, { id: 'mal', label: 'Mal',  sub: 'Malate',           color: '#4a7eff' },
  ];

  _bestPip(fromX, fromY, toX, toY) {
    const dx = toX - fromX, dy = toY - fromY, dirs = [[0,-1],[1,0],[0,1],[-1,0]];
    let best = 0, bestDot = -Infinity;
    for (let i = 0; i < 4; i++) {
      const dot = dx * dirs[i][0] + dy * dirs[i][1];
      if (dot > bestDot) { bestDot = dot; best = i; }
    }

  }

  getScene() {
    const group = SYS.makeNode('group', { connections: [] });
    const sub = group.subtree, conns = group.value.connections, tcaR1 = 170, tcaR2=190, N = TCACycleModel.STEPS.length;
    const nodes = TCACycleModel.STEPS.map((step, i) => {
      const a = (i / N) * Geo.TAU - Geo.PI / 2;
      const tcaR = (i%2==0) ? tcaR1 : tcaR2; 
      const node = SYS.makeNode('pipped-button-node', {

//<< import { ProceduralTreeModel } from './procedural-tree-model.js';
//-- file: ./procedural-tree-model.js --
//>> import { GraphModel } from './graph-model.js';
//>> import { makeZoomableCamera } from './make-camera.js';
//>> export { ProceduralTreeModel };
// Generates Trees and Stars procedurally using a top-down hierarchical layout

class ProceduralTreeModel extends GraphModel {
  constructor(name, branching) {
    super();
    this._name = name;
    this.branching = branching; // e.g. [5] for a star, [5, 2] for a 2-level tree
    this.visible = true;
    this.sceneRoot = makeZoomableCamera(this.getScene(), { centerOrigin: true });
  }

  get name() { return this._name; }

  getScene() {
    const pos = [];
    const edges = [];
    let idCounter = 0;

    const buildNode = (depth, x, y, parentId) => {
      const myId = idCounter++;
    // Root gets a distinct color
      pos.push({ x, y, color: depth === 0 ? '#c66' : '#6c6' });

      if (parentId !== null) {
        edges.push([parentId, myId]);
      }

    // If we haven't reached the bottom of our branching array, spawn children
      if (depth < this.branching.length) {
        const b = this.branching[depth];

      // Dynamically calculate horizontal spread so branches don't overlap as much
        const spread = Math.pow(2.2, this.branching.length - depth) * 20; 
        const startX = x - ((b - 1) * spread) / 2;

        for (let i = 0; i < b; i++) {
          buildNode(depth + 1, startX + i * spread, y + 70, myId);
        }
      }
    };

  // Start building from the root (adjust starting Y so deep trees fit well)
    buildNode(0, 0, -this.branching.length * 30, null);
    return this.buildScene(pos, edges);
  }
}
//-- endfile --

// Generates complete (fully-connected) graphs procedurally in a radial layout
//<< import { ProceduralCompleteModel } from './procedural-complete-model.js';
//-- file: ./procedural-complete-model.js --
//>> import { SYS } from './sys.js';
//>> import { GraphModel } from './graph-model.js';
//>> import { makeZoomableCamera } from './make-camera.js';
//>> import { ProceduralTreeModel } from './procedural-tree-model.js';
//>> export { ProceduralCompleteModel };
class ProceduralCompleteModel extends GraphModel {
  constructor(name, n) {
    super();
    this._name = name;
    this.n = n;
    this.visible = true;
    this.sceneRoot = makeZoomableCamera(this.getScene(), { centerOrigin: true });
  }

  get name() { return this._name; }

  getScene() {
    const pos = [];
    const edges = [];
    const R = Math.max(60, this.n * 15); // Scale radius dynamically with node count

    // Position nodes in a circle
    for (let i = 0; i < this.n; i++) {
      pos.push({
        x: R * Math.cos(i * Math.PI * 2 / this.n - Math.PI / 2),
        y: R * Math.sin(i * Math.PI * 2 / this.n - Math.PI / 2)
      });
    }

    // Connect every node to every other node
    for (let i = 0; i < this.n; i++) {
      for (let j = i + 1; j < this.n; j++) {
        edges.push([i, j]);
      }
    }

    return this.buildScene(pos, edges);
  }
}

//<< import { MoleculeModel } from './molecule-model.js';
//-- file: ./molecule-model.js --
//>> import { SYS } from './sys.js';
//>> import { BasicCollectionNode } from './basic-collection-node.js';
//>> import './drag-point-node.js';   // 'drag-point'
//>> import './pipped-edge-ref-node.js';   // 'pipped-edge'
//>> export { MoleculeModel };

class MoleculeModel{
  get btnClass() { return 'green'; }
  get displayType() { return '2d'; }

  static CPK = {
    C: '#777777', H: '#e0e0e0', O: '#ff4136', N: '#4169e1',
    S: '#ffd700', P: '#ff8c00', Cl: '#1eff00', Br: '#a62929',
  };

  _placeH(parent, bondedPositions, nH, dist) {
    if (nH === 0) return [];
    const angles = bondedPositions.map(b => Math.atan2(b.y - parent.y, b.x - parent.x));
    let base = 0;
    if (angles.length > 0) {
      const sx = angles.reduce((s, a) => s + Math.cos(a), 0), sy = angles.reduce((s, a) => s + Math.sin(a), 0);
      base = Math.atan2(sy, sx) + Math.PI;
    }
    const spread = nH === 1 ? 0 : Math.min(Math.PI * 0.75, Math.PI * 0.55 * nH), result = [];
    for (let i = 0; i < nH; i++) {
      const a = base + (i - (nH - 1) / 2) * (nH > 1 ? spread / (nH - 1) : 0);
      result.push({ x: parent.x + dist * Math.cos(a), y: parent.y + dist * Math.sin(a) });
    }
    return result;
  }

  buildMoleculeScene(def) {
    const group = SYS.makeNode('group', { connections: [] });
    const sub = group.subtree, conns = group.value.connections, HR = 38;
    const atoms = [], allBonds = [];
    for (const h of def.heavy) 
      atoms.push({ symbol: h.symbol, x: h.x, y: h.y });
    for (const [a, b] of def.bonds) 
      allBonds.push([a, b]);
    for (let i = 0; i < def.heavy.length; i++) {
      const h = def.heavy[i];
      if (h.nH === 0)
        continue;
      const bondedPos = def.bonds.filter(([a, b]) => a === i || b === i).map(([a, b]) => a === i ? def.heavy[b] : def.heavy[a]);
      for (const hp of this._placeH(h, bondedPos, h.nH, HR)) {
        allBonds.push([i, atoms.length]);
        atoms.push({ symbol: 'H', x: hp.x, y: hp.y });
      }
    }

    const nodes = atoms.map((a, i) => {
      const isH = a.symbol === 'H';
      const node = SYS.makeNode('drag-point', { x: a.x, y: a.y, label: a.symbol, color: MoleculeModel.CPK[a.symbol] || '#888', r: isH ? 8 : 12, stroke: '#111', labelColor: isH ? '#222' : '#fff' });
      sub.push(node); return node;
    });

    for (const [a, b] of allBonds) {
      const nA = nodes[a], nB = nodes[b];
      const edge = SYS.makeNode('pipped-edge', { x1: nA.value.x, y1: nA.value.y, x2: nB.value.x, y2: nB.value.y });
      sub.push(edge);
      conns.push({ a: edge.value.id, pipA: 0, b: nA.value.id, pipB: 0 }, { a: edge.value.id, pipA: 1, b: nB.value.id, pipB: 0 });
    }
    BasicCollectionNode._sortSubtree(sub);
    return group;
  }
}
//-- endfile --

//<< import { FlyweightIterator } from './flyweight-iterator.js';
//-- file: ./flyweight-iterator.js --
//>> export { FlyweightIterator };

/* Visiting order as a generator, not an array: a large dump need never
   materialise one index per byte, and the range visited can be narrowed to
   what is actually on screen. */
class FlyweightIterator {
  constructor(order) {
    this.gen = order[Symbol.iterator]();
    this.current = -1;
  }

  next(subtree) {
    const step = this.gen.next();
    if (step.done) return null;
    this.current = step.value;
    return subtree[0];
  }
}
//-- endfile --

//<< import { FlyweightArrayNode } from './flyweight-array-node.js';
//-- file: ./flyweight-array-node.js --
//>> import { sceneRegistry } from './sys.js';
//>> import { FlyweightIterator } from './flyweight-iterator.js';
//>> export { FlyweightArrayNode };

/* ─────────────────────────────────────────────────────────────────────────────
FlyweightArrayNode — draws N copies of one proto child.

The proto is written as an ordinary node and never learns that it is shared.
The model says how an index becomes a value, and what a write to an item
means; this class only scopes those to the item currently being visited.

  value.count            how many items
  value.drawOrder        visiting order for layout and drawing
  value.hitOrder         visiting order for hit testing (default: reverse draw)

  inst.getValue(ctxMix, node, params, i)         -> the item's value
  inst.setValue(ctxMix, node, params, i, patch)  -> true if changed
  inst.visibleRange(ctxMix, node, params)        -> [start, end) to cull to

Selection needs no flag: a model whose setValue does something with `selected`
has selectable items, and one whose setValue drops it does not.
──────────────────────────────────────────────────────────────────────────── */
class FlyweightArrayNode {
  static clear_selection(ctxMix, node, params) {
    const st = node.state;
    if (st?.selected?.size) st.selected.clear();
  }

  /* Asked for rather than frozen: a control that changes bytes-per-row
     changes how many chunks there are. */
  static count(node) { return node.inst?.getCount?.(node) ?? node.value.count ?? 0; }

  static *_order(ctxMix, node, params, phase) {
    const v = node.value;
    const [from, to] = node.inst?.visibleRange?.(ctxMix, node, params)
                    ?? [0, FlyweightArrayNode.count(node)];

    const listed = phase === 'hit_test' ? (v.hitOrder ?? v.drawOrder) : v.drawOrder;
    if (listed) {
      const seq = (phase === 'hit_test' && !v.hitOrder) ? [...listed].reverse() : listed;
      for (const i of seq) if (i >= from && i < to) yield i;
      return;
    }
    if (phase === 'hit_test') { for (let i = to - 1; i >= from; i--) yield i; return; }
    for (let i = from; i < to; i++) yield i;
  }

  static valueAt(node, ctxMix, params, index) {
    const getValue = node.inst?.getValue;
    return getValue ? getValue(ctxMix, node, params, index) : { index };
  }

  static writeAt(node, ctxMix, params, index, patch) {
    const setValue = node.inst?.setValue;
    return setValue ? !!setValue(ctxMix, node, params, index, patch) : false;
  }

  static _install(ctxMix, node, params, phase) {
    ctxMix.iterators.pop();
    const iter = new FlyweightIterator(FlyweightArrayNode._order(ctxMix, node, params, phase));
    ctxMix.iterators.push(iter);

    const proto = node.subtree?.[0];
    if (!proto) return;

    // Scoped to whichever item the iterator is on when these are called.
    proto.flyFn = (mix, n, p)    => FlyweightArrayNode.valueAt(node, mix, p, iter.current);
    proto.setFn = (mix, n, p, x) => FlyweightArrayNode.writeAt(node, mix, p, iter.current, x);
  }

  static before_layout(ctxMix, node, params)   { FlyweightArrayNode._install(ctxMix, node, params, 'layout'); }
  static before_draw2d(ctxMix, node, params)   { FlyweightArrayNode._install(ctxMix, node, params, 'draw2d'); }
  static before_hit_test(ctxMix, node, params) { FlyweightArrayNode._install(ctxMix, node, params, 'hit_test'); }

  /* A hit landed on the shared proto.  Bind every interaction to this item,
     so that the app can act on the hit long after the walk has ended without
     ever knowing that an index exists.  Wrapping composes: a nested flyweight
     wraps these again, adding its own scope. */
  static after_child_hit_test(ctxMix, node, params, child) {
    const hit = ctxMix.hitResult;
    if (!hit || hit.node !== child) return;

    const index = ctxMix.iterators.at(-1)?.current ?? 0;
    const inner = hit.interactions || {};

    hit.interactions = {
      ...inner,
      getValue:   ()      => FlyweightArrayNode.valueAt(node, ctxMix, params, index),
      setValue:   (patch) => FlyweightArrayNode.writeAt(node, ctxMix, params, index, patch),
      getTooltip: inner.getTooltip
        ?? (() => FlyweightArrayNode.valueAt(node, ctxMix, params, index)?.tooltip ?? null),
    };
    ctxMix.abortPhase = true;
  }
}

//-- file: ./clip-node.js --
//>> import { sceneRegistry } from './sys.js';
//>> export { ClipNode };

/* ─────────────────────────────────────────────────────────────────────────────
ClipNode — brackets its subtree with a clipping path.

A clip is a save/restore pair around other nodes, so it is a wrapper rather
than a sibling: as siblings the bracket would depend on nothing between them
disturbing the context.  The path comes from value.pathFn, which the model
supplies; with none, this node is a plain pass-through.
──────────────────────────────────────────────────────────────────────────── */
class ClipNode {
  static before_draw2d(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    ctx.save();
    const path = node.inst?.pathFn;
    if (!path) return;
    ctx.beginPath();
    path(ctxMix, node, params);
    ctx.clip();
  }

  static after_draw2d(ctxMix, node, params) { ctxMix.ctx.restore(); }
}

//>> import { SYS, sceneRegistry } from './sys.js';
//>> import { PipKinds } from './pip-kind.js';
//>> import { Values } from './values.js';
//>> import { BTN_DEFAULTS } from './pipped-button-node.js';
//>> export { PippedEdgeRefNode };
class PippedEdgeRefNode {
  static meta = {
    zOrder: -1,
    pipKind: PipKinds.EDGE_END,
    coneParams: (node) => ({ n: node.value.n || 4, tilt: node.value.tilt || 0 }),
    spawnOverrides: (wp) => ({ x1: wp.x - 25, y1: wp.y, x2: wp.x + 25, y2: wp.y }),
    editableFields: (node) => [
      { key: 'color', label: 'Color', type: 'color', value: node.value.color || BTN_DEFAULTS.fill },
    ]

  };
  static getCentreXY(res, node, params) {
    const v = res.getValue(res, node, params);
    return { x: (v.x1 + v.x2) / 2, y: (v.y1 + v.y2) / 2 };
  }
  static getPips(res, node, params) {
    const v = res.getValue(res, node, params);
    const a = Math.atan2(v.y2 - v.y1, v.x2 - v.x1);
    return [
      { x: v.x1, y: v.y1, out: a + Math.PI },
      { x: v.x2, y: v.y2, out: a }
    ];
  }
  static setPipPos(res, node, params) {
    if (params.idx === 0) res.setValue(res, node, params, { x1: params.x, y1: params.y });
    else                  res.setValue(res, node, params, { x2: params.x, y2: params.y });
  }
  static getSnapSegments(res, node, params) {
    const v = res.getValue(res, node, params);
    return [{ x1: v.x1, y1: v.y1, x2: v.x2, y2: v.y2 }];
  }
  static setXY(res, node, params){
    res.setValue(res, node, params, {
      x1: params.x - 18, y1: params.y,
      x2: params.x + 18, y2: params.y,
    });
  }
  // Translation keeps the edge's own length; setXY deliberately does not.
  static moveBy(res, node, params) {
    const v = res.getValue(res, node, params);
    res.setValue(res, node, params, {
      x1: v.x1 + params.dx, y1: v.y1 + params.dy,
      x2: v.x2 + params.dx, y2: v.y2 + params.dy,
    });
  }
  // How to build one spanning two points, and how to divide one in two.
  static spanValue(a, b) { return { x1: a.x, y1: a.y, x2: b.x, y2: b.y }; }
  static splitValues(node, at) {
    const v = node.value;
    return [
      { x1: v.x1,  y1: v.y1,  x2: at.x, y2: at.y  },
      { x1: at.x,  y1: at.y,  x2: v.x2, y2: v.y2  },
    ];
  }
  static _curveTo(ctx, v, bend) {
    if (Math.abs(bend) > 0.001) {
      const mx = (v.x1 + v.x2) / 2, my = (v.y1 + v.y2) / 2, dx = v.x2 - v.x1, dy = v.y2 - v.y1;
      const len = Math.sqrt(dx * dx + dy * dy) || 1, bulge = len * Math.tan(bend / 2) / 2;
      ctx.quadraticCurveTo(mx + (-dy / len) * bulge, my + (dx / len) * bulge, v.x2, v.y2);

  static draw2d(ctxMix, node, params) {
    const ctx = ctxMix.ctx, v = ctxMix.getValue(ctxMix, node, params);
    const w = params.edgeWidth ?? 6, outline = params.edgeOutline ?? 1, bend = params.edgeBend ?? 0;

    ctx.strokeStyle = v.color ?? '#557'; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();

    if (v.selected || v.hovered) {
      ctx.beginPath(); ctx.moveTo(v.x1, v.y1); PippedEdgeRefNode._curveTo(ctx, v, bend);

    const pt = ctxMix.hitPoint;
    if (!pt) return;

    if (lenSq < 1) return;
    const t = Math.max(0, Math.min(1, ((pt.x - v.x1) * dx + (pt.y - v.y1) * dy) / lenSq));

      node, interactions: { applyDrag(wx, wy) {

          x1: cx - hdx, y1: cy - hdy,
          x2: cx + hdx, y2: cy + hdy,
        });

}

class MorphSliderWidget {

  static mount(ctxMix, node, params) {
    // Compatability hack... we permit values directly on node.
    // in future they will need to be in node.value. 
    if( node.value)
      node = node.value;

    const pid = node.id;
    const initVal = node.isData
      ? (node.dataValue || node.default)
      : (params[pid] ?? node.default ?? node.min ?? 0);

    const { el, setValue, getValue, valEl } = MorphSliderWidget.buildMorphSlider({
      label:    node.label,
      min:      node.min ?? 0,
      max:      node.max ?? 100,
      step:     node.step,
      value:    initVal,
      disabled: node.disabled,
      format:   node.format
        ? (v => formatValue(v, node.format))
        : node.formatFn || undefined,
      onChange: v => {
        if (node.isData) {
          ctxMix.onParamChange(pid, v, true, ctxMix.panel);
        } else {
          ctxMix.setParam(pid, v);
          ctxMix.onParamChange(pid, v, false, ctxMix.panel);
        }
        if (node.onChange) node.onChange(v, ctxMix.panel);
        ctxMix.render();
        ctxMix.clearActivePreset();
      },
    });

    // Keep the same id conventions so preset morph / param sync can find them
    el.id = pid;
    valEl.id = `${pid}-val`;
    el.dataset.sliderId = pid;
    ctxMix.parentEl?.appendChild(el);
    return el;
  }

  // ── Static factory — the core DOM builder ───────────────────
  //
  //  Returns { el, setValue(v), getValue(), valEl } where el is the
  //  root .morph-slider div and setValue repositions the pip/fill/
  //  readout programmatically (preset morph, param sync, etc).
  //
  //  @param {Object} opts
  //  @param {string}   opts.label
  //  @param {number}   opts.min
  //  @param {number}   opts.max
  //  @param {number}   opts.step
  //  @param {number}   opts.value     — initial value
  //  @param {Function} [opts.format]  — (v) => display string
  //  @param {Function} [opts.onChange] — (v) => void
  //  @param {boolean}  [opts.disabled]

  static buildMorphSlider(opts) {
    const min = +opts.min, max = +opts.max, step = +(opts.step || 1);
    const fmt = opts.format || (v => {
      // Auto-format: up to 2 decimals if step is fractional
      return step % 1 !== 0 ? (+v).toFixed(2) : String(Math.round(+v));
    });

    const el = document.createElement('div');
    el.className = 'morph-slider';
    if (opts.disabled) el.style.opacity = '0.4';

    const track = document.createElement('div');
    track.className = 'ms-track';
    const fill = document.createElement('div');
    fill.className = 'ms-fill';
    track.appendChild(fill);

    const pip = document.createElement('div');
    pip.className = 'ms-pip';

    const lbl = document.createElement('span');
    lbl.className = 'ms-label';
    lbl.textContent = opts.label || '';

    const val = document.createElement('span');
    val.className = 'ms-val';

    el.append(track, pip, lbl, val);

    // ── Internal state ───────────────────────────────────
    let currentValue = +(opts.value ?? min);

    function pctFromValue(v) {
      return max === min ? 0 : (v - min) / (max - min);
    }

    function valueFromPct(pct) {
      let v = min + pct * (max - min);
      // Snap to step
      v = Math.round(v / step) * step;
      return Math.max(min, Math.min(max, +v.toFixed(10)));
    }

    function render(v) {
      const pct = pctFromValue(v) * 100;
      fill.style.width = pct + '%';
      pip.style.left   = pct + '%';
      val.textContent   = fmt(v);
    }

    // Public: set value from outside (preset morph, param sync)
    function setValue(v) {
      currentValue = +v;
      render(currentValue);
    }

    render(currentValue);

    // ── Pointer interaction ──────────────────────────────
    if (!opts.disabled) {
      const update = (clientX) => {
        const rect = track.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        currentValue = valueFromPct(pct);
        render(currentValue);
        if (opts.onChange) opts.onChange(currentValue);
      };

      let engaged = false;

      el.addEventListener('pointerdown', e => {
        engaged = true;
        el.classList.add('engaged');
        el.setPointerCapture(e.pointerId);
        update(e.clientX);
      });
      el.addEventListener('pointermove', e => {
        if (engaged) update(e.clientX);
      });
      el.addEventListener('pointerup', () => {
        engaged = false;
        el.classList.remove('engaged');
      });
      el.addEventListener('pointercancel', () => {
        engaged = false;
        el.classList.remove('engaged');
      });
    }

    // Expose the value element for external id assignment
    el._valEl   = val;
    el._setValue = setValue;
    el._getValue = () => currentValue;

    // Backward-compat: the panel reads/writes .value like an <input>.
    // defineProperty so it's not enumerable (won't confuse iteration).
    Object.defineProperty(el, 'value', {
      get: () => currentValue,
      set: v => { setValue(+v); },
      configurable: true,
    });

    return { el, setValue, getValue: () => currentValue, valEl: val };
  }
}

function measureWord(ctx, text, font) {
  ctx.font = font;
  ctx.textBaseline = 'alphabetic'; // <-- Add this line to fix the offset

  const m = ctx.measureText(text);
  const asc = m.actualBoundingBoxAscent  || m.emHeightAscent  || 0;
  const dsc = m.actualBoundingBoxDescent || m.emHeightDescent || 0;

  return { width: m.width, ascent: asc, descent: dsc, height: asc + dsc };
}

const WORD_DEFAULTS = Object.freeze({
  fontFamily:     '"Inter", "Helvetica Neue", system-ui, sans-serif',
  fontSize:       28,
  fontWeight:     700,
  color:          '#e4dac6',
  opacity:        1.0,
  rotation:       0,
  haloColor:      '#000000',
  haloWidth:      0,
  haloOpacity:    0.35,
  highlightFill:  'rgba(255,255,255,0.06)',
  highlightPad:   6,
  highlightRadius: 4,
  scale:          1.0,
});

class WordNode {
// New Style: Metadata tells the system how to interact with this node
  static meta = {
    pipKind: PipKinds.JUNCTION,
    zOrder: 1,
    spawnOverrides: (wp) => ({ x: wp.x, y: wp.y, text: 'word' }),
    editableFields: (node) => [
      { key: 'text', label: 'Text', type: 'text', value: node.value.text || '' },
      { key: 'fontSize', label: 'Size', type: 'number', value: node.value.fontSize || WORD_DEFAULTS.fontSize },
      { key: 'rotation', label: 'Rotation', type: 'number', value: node.value.rotation || WORD_DEFAULTS.rotation },
      { key: 'color', label: 'Color', type: 'color', value: node.value.color || WORD_DEFAULTS.color },
    ],
  };

  static getCentreXY(res, node, params) {
    const v = res.getValue(res, node, params) || {};
    return { x: v.x || 0, y: v.y || 0 };
  }

  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params) || {};
    const p = { ...WORD_DEFAULTS, ...params };
    const text = v.text || '';
    if (!text) return;

// New Style: Zoom is handled naturally by the Camera context scale. 
// We no longer multiply fSize by zoom.
    const sc      = (p.scale || 1) * (v.scale || 1);
    const fSize   = (v.fontSize || p.fontSize) * sc;
    const weight  = v.fontWeight || p.fontWeight;
    const family  = v.fontFamily || p.fontFamily;
    const font    = `${weight} ${fSize.toFixed(1)}px ${family}`;
    const rot     = (v.rotation != null ? v.rotation : p.rotation) * Math.PI / 180;
    const opacity = (v.opacity != null ? v.opacity : p.opacity);

// Position is one field of the value like any other, read through the channel.
    const { x: cx, y: cy } = WordNode.getCentreXY(ctxMix, node, params);
    const ctx = ctxMix.ctx;

    ctx.save();
    ctx.globalAlpha *= opacity;
    ctx.translate(cx, cy);
    if (rot) ctx.rotate(rot);

    const meas = measureWord(ctx, text, font);

// ── highlight box behind selected words ──
    if (v.selected || v.hovered) {
    const pad = (p.highlightPad || 0); // No zoom multiplier needed
    const hr  = (p.highlightRadius || 0);
    const hx  = -meas.width / 2 - pad;
    const hy  = -meas.ascent - pad;
    const hw  = meas.width + pad * 2;
    const hh  = meas.height + pad * 2;
    
    ctx.fillStyle = p.highlightFill;
    if (ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(hx, hy, hw, hh, hr); ctx.fill();
    } else {
      ctx.fillRect(hx, hy, hw, hh);
    }

    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth   = 1.5;
    if (ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(hx, hy, hw, hh, hr); ctx.stroke();

      ctx.strokeRect(hx, hy, hw, hh);
    }

  }

  const haloW = (v.haloWidth != null ? v.haloWidth : p.haloWidth) * sc;
  if (haloW > 0) {
    ctx.strokeStyle = hexToRgba(
      v.haloColor || p.haloColor,
      v.haloOpacity != null ? v.haloOpacity : p.haloOpacity
      );
    ctx.lineWidth   = haloW;
    ctx.lineJoin    = 'round';
    ctx.font        = font;
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.strokeText(text, 0, 0);
  }

  // ── text fill ──
  ctx.fillStyle    = v.color || p.color;
  ctx.font         = font;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, 0, 0);

  ctx.restore();
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt) return;

    const v = ctxMix.getValue(ctxMix, node, params) || {};
    const text = v.text || '';
    if (!text) return;

    const p = { ...WORD_DEFAULTS, ...params };
    const sc = (p.scale || 1) * (v.scale || 1);
    const fSize = (v.fontSize || p.fontSize) * sc;
    const weight = v.fontWeight || p.fontWeight;
    const family = v.fontFamily || p.fontFamily;
    const font = `${weight} ${fSize.toFixed(1)}px ${family}`;
    const rot = (v.rotation != null ? v.rotation : p.rotation) * Math.PI / 180;

  // No screen conversion needed: pt is already in world space.
    const { x: cx, y: cy } = WordNode.getCentreXY(ctxMix, node, params);

  // Transform hit point into the word's local frame
    let lx = pt.x - cx;
    let ly = pt.y - cy;
    if (rot) {
      const cos = Math.cos(-rot), sin = Math.sin(-rot);
      const rx = lx * cos - ly * sin;
      const ry = lx * sin + ly * cos;
      lx = rx; ly = ry;
    }

    const ctx = ctxMix.ctx;
    const meas = measureWord(ctx, text, font);
    const pad = 4;
    const halfW = meas.width / 2 + pad;
    const top = -meas.ascent - pad;
    const bot = meas.descent + pad;

    if (lx < -halfW || lx > halfW || ly < top || ly > bot) return;

    const dxHit = pt.x - cx;
    const dyHit = pt.y - cy;

  // New Style: Pass world coordinates directly in applyDrag
    ctxMix.hitResult = {
      node,
      interactions: {
        applyDrag(wx, wy) {
          Values.setValue(Values, node, params, { x: wx - dxHit, y: wy - dyHit });
          return node;
        },
      },
    };
  }
}

//<< import { FrameNode } from './frame-node.js';
//-- file: ./frame-node.js --
//>> import { sceneRegistry } from './sys.js';
//>> import { Values } from './values.js';
//>> export { FrameNode };

/* ─────────────────────────────────────────────────────────────────────────────
FrameNode — generic, content-agnostic frame with drag, resize, and screen-fit.

Node value properties:
 x, y          — world position (centre of frame)
 cw, ch        — content width / height (the "drawing area")
 padding       — { left, right, top, bottom } or a single Number (uniform)
                 defaults to { left: 80, right: 80, top: 100, bottom: 100 }
 minCw, minCh  — minimum content dimensions (default 200 × 150)
 resizeMode    — 'corners' | 'edges' | false   (default 'corners')

What it provides to children via ctxMix:
 ctxMix.getWH() → { W:cw, H:ch }   — current frame content dimensions
──────────────────────────────────────────────────────────────────────────── */
class FrameNode {
/* ── geometry helpers (private) ────────────────────────────────────────── */
  static _pad(node) {
    const p = node.value.padding;
    if (p == null) return { left: 80, right: 80, top: 100, bottom: 100 };
    if (typeof p === 'number') return { left: p, right: p, top: p, bottom: p };
    return { left: p.left ?? 80, right: p.right ?? 80, top: p.top ?? 100, bottom: p.bottom ?? 100 };
  }

  static _frameExtents(node) {
    const cw = node.value.cw || 700, ch = node.value.ch || 400;
    const pad = FrameNode._pad(node);
    return {
      hw: cw / 2 + (pad.left + pad.right) / 2,
      hh: ch / 2 + (pad.top + pad.bottom) / 2,
    };
  }

  static _corners(node) {
    const { hw, hh } = FrameNode._frameExtents(node);
    return [
      { cx: -hw, cy: -hh, signX: -1, signY: -1, cursor: 'nwse-resize' },
      { cx:  hw, cy: -hh, signX:  1, signY: -1, cursor: 'nesw-resize' },
      { cx: -hw, cy:  hh, signX: -1, signY:  1, cursor: 'nesw-resize' },
      { cx:  hw, cy:  hh, signX:  1, signY:  1, cursor: 'nwse-resize' },
    ];
  }

  static _edges(node) {
    const { hw, hh } = FrameNode._frameExtents(node);
    return [
      { side: 'top',    test: (lx, ly) => Math.abs(ly + hh) <= 8 && lx > -hw && lx < hw, cursor: 'ns-resize',   axis: 'y', sign: -1 },
      { side: 'bottom', test: (lx, ly) => Math.abs(ly - hh) <= 8 && lx > -hw && lx < hw, cursor: 'ns-resize',   axis: 'y', sign:  1 },
      { side: 'left',   test: (lx, ly) => Math.abs(lx + hw) <= 8 && ly > -hh && ly < hh, cursor: 'ew-resize',   axis: 'x', sign: -1 },
      { side: 'right',  test: (lx, ly) => Math.abs(lx - hw) <= 8 && ly > -hh && ly < hh, cursor: 'ew-resize',   axis: 'x', sign:  1 },
    ];
  }

  static _snapChildren(node) {
    return (node.subtree || []).map(ch => ({ x: ch.value.x, y: ch.value.y }));
  }

/* ── resize (content-agnostic: scales all children's x/y uniformly) ──── */

  static _applySize(node, newCw, newCh, baseCw, baseCh, childSnap) {
    const sx = newCw / baseCw, sy = newCh / baseCh;
    const minCw = node.value.minCw ?? 200, minCh = node.value.minCh ?? 150;
    Values.setValue(Values, node, {},
      { cw: Math.max(minCw, newCw), ch: Math.max(minCh, newCh) });
    for (let i = 0; i < (node.subtree || []).length; i++) {
      const child = node.subtree[i], snap = childSnap[i];
      const patch = {};
      if (snap.x !== undefined) patch.x = snap.x * sx;
      if (snap.y !== undefined) patch.y = snap.y * sy;
      if (patch.x !== undefined || patch.y !== undefined)
        Values.setValue(Values, child, {}, patch);
    }
  }

/* ── draw ──────────────────────────────────────────────────────────────── */

  static before_draw2d(ctxMix, node, params) {
    const cw = node.value.cw || 700, ch = node.value.ch || 400;

    const { W, H, Z, ox, oy } = ctxMix.getWH();
// Screen-mode auto-fit
    if (params.screenMode) {
      const pad = FrameNode._pad(node);
      const targetCw = Math.max(node.value.minCw ?? 200, W / Z - pad.left - pad.right);
      const targetCh = Math.max(node.value.minCh ?? 150, H / Z - pad.top - pad.bottom);
      /* Left as a direct write on purpose.  These are a draw phase editing
         the model — the same disease as _screenSnap below — and routing them
         through the channel would only make them look legitimate. */
      node.value.x = ox;// + W / (2 * Z);
      node.value.y = oy;// + H / (2 * Z);
      if (!node.value._screenSnap) {
        node.value._screenSnap = {
          cw, ch,
          children: FrameNode._snapChildren(node)
        };
      }
      const s = node.value._screenSnap;
      FrameNode._applySize(node, targetCw, targetCh, s.cw, s.ch, s.children);
    } else if (node.value._screenSnap) {
      delete node.value._screenSnap;
    }

    // Expose frame dimensions to children
    const frameCw = node.value.cw || 700, frameCh = node.value.ch || 400;
    ctxMix.getWH = () => ({ W: frameCw, H: frameCh, Z });

    const ctx = ctxMix.ctx;
    ctx.save();
    ctx.translate(node.value.x || 0, node.value.y || 0);

    if (params.showChartBounds) {
      ctx.fillStyle = 'rgba(55, 55, 255, 0.15)';
      const { hw, hh } = FrameNode._frameExtents(node);
      ctx.fillRect(-hw, -hh, hw * 2, hh * 2);
    }
  }

  static after_draw2d(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const fv = ctxMix.getValue(ctxMix, node, params) || {};
    const hi = !!(fv.selected || fv.hovered);
    const mode = node.value.resizeMode ?? 'corners';
    const drawFrame = (hi && mode) || params.showChartBounds; 

    if (drawFrame) {
      const { hw, hh } = FrameNode._frameExtents(node);
      const { W, H, Z, ox, oy } = ctxMix.getWH();

      ctx.strokeStyle = 'rgba(102, 204, 255, 0.4)';
      ctx.lineWidth = 1 /Z;
      ctx.strokeRect(-hw, -hh, hw * 2, hh * 2);

      if (mode === 'corners') {
        const size = 10 /Z;
        ctx.fillStyle = '#6cf';
        for (const c of FrameNode._corners(node)) ctx.fillRect(c.cx - size / 2, c.cy - size / 2, size, size);
      } else if (mode === 'edges') {
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(102, 204, 255, 0.6)';
        ctx.lineWidth = 2 / Z;
        ctx.strokeRect(-hw, -hh, hw * 2, hh * 2);
        ctx.setLineDash([]);
        const ms = 6 / Z;
        ctx.fillStyle = '#6cf';
        ctx.fillRect(-ms / 2, -hh - ms / 2, ms, ms);
        ctx.fillRect(-ms / 2, hh - ms / 2, ms, ms);
        ctx.fillRect(-hw - ms / 2, -ms / 2, ms, ms);
        ctx.fillRect(hw - ms / 2, -ms / 2, ms, ms);
      }
    }
    ctx.restore();
  }

  /* ── hit-test ─────────────────────────────────────────────────────────── */

  static before_hit_test(ctxMix, node, params) {
    const { W, H, Z, ox, oy } = ctxMix.getWH();
  // Expose frame dimensions for children's hit-test
    const frameCw = node.value.cw || 700, frameCh = node.value.ch || 400;
    ctxMix.getWH = () => ({ W: frameCw, H: frameCh, Z });
    if( ! ctxMix.getWH().W )
      debugger;


    node.value._savedHit = ctxMix.hitPoint;
    if (!ctxMix.hitPoint) return;

    const localPt = {
      x: ctxMix.hitPoint.x - (node.value.x || 0),
      y: ctxMix.hitPoint.y - (node.value.y || 0)
    };
    ctxMix.hitPoint = localPt;

    const { hw, hh } = FrameNode._frameExtents(node);
    const fv = ctxMix.getValue(ctxMix, node, params) || {};
    const isHi = !!(fv.selected || fv.hovered);
    const mode = node.value.resizeMode ?? 'corners';

  // Resize hit-test (only when selected and not in screen mode)
    if (isHi && mode && !params.screenMode) {
      const pad = FrameNode._pad(node);
      const startCw = node.value.cw || 700, startCh = node.value.ch || 400;

      if (mode === 'corners') {
        const hs = 14;
        for (const c of FrameNode._corners(node)) {
          if (Math.abs(localPt.x - c.cx) <= hs && Math.abs(localPt.y - c.cy) <= hs) {
            const fixedWx = (node.value.x || 0) - c.signX * hw;
            const fixedWy = (node.value.y || 0) - c.signY * hh;
            const childSnap = FrameNode._snapChildren(node);

            ctxMix.hitResult = {
              node,
              interactions: {
                cursor: c.cursor,
                applyDrag(wx, wy) {
                  const totalPadX = pad.left + pad.right;
                  const totalPadY = pad.top + pad.bottom;
                  const newCw = Math.abs(wx - fixedWx) - totalPadX;
                  const newCh = Math.abs(wy - fixedWy) - totalPadY;
                  Values.setValue(Values, node, params,
                    { x: (fixedWx + wx) / 2, y: (fixedWy + wy) / 2 });
                  FrameNode._applySize(node, newCw, newCh, startCw, startCh, childSnap);
                  return node;
                }
              }
            };
            return;
          }
        }
      } else if (mode === 'edges') {
        for (const e of FrameNode._edges(node)) {
          if (e.test(localPt.x, localPt.y)) {
            const childSnap = FrameNode._snapChildren(node);
            ctxMix.hitResult = {
              node,
              interactions: {
                cursor: e.cursor,
                applyDrag(wx, wy) {
                  let newCw = startCw, newCh = startCh;
                  if (e.axis === 'x') {
                    const localWx = wx - (node.value.x || 0);
                    newCw = Math.abs(localWx / e.sign) * 2;
                  } else {
                    const localWy = wy - (node.value.y || 0);
                    newCh = Math.abs(localWy / e.sign) * 2;
                  }
                  FrameNode._applySize(node, newCw, newCh, startCw, startCh, childSnap);
                  return node;
                }
              }
            };
            return;
          }
        }
      }
    }

  // Frame body drag (pan the whole frame)
    if (localPt.x >= -hw && localPt.x <= hw && localPt.y >= -hh && localPt.y <= hh) {
      const ox = node.value._savedHit.x - (node.value.x || 0);
      const oy = node.value._savedHit.y - (node.value.y || 0);
      ctxMix.hitResult = {
        node,
        interactions: {
          applyDrag(wx, wy) {
            Values.setValue(Values, node, params, { x: wx - ox, y: wy - oy });
          }
        }
      };
    }
  }

  static after_child_hit_test(ctxMix, node, params, child) {
    if (ctxMix.hitResult && ctxMix.hitResult.node === child && !ctxMix.hoverOnly) {
      const inner = ctxMix.hitResult.interactions;
      const sub = node.subtree;
      ctxMix.hitResult.interactions = {
        applyDrag: (wx, wy) => { return inner?.applyDrag?.(wx, wy); },
        endDrag: (onStrip) => {
          if (inner && inner.endDrag) inner.endDrag(onStrip);
          if (onStrip) {
            const idx = sub.indexOf(child);
            if (idx >= 0) sub.splice(idx, 1);
          }
        }
      }
    }
  }

  static after_hit_test(ctxMix, node, params) {
    ctxMix.hitPoint = node.value._savedHit; 
    if (ctxMix.hitResult && ctxMix.hitResult.node !== node) {
      const innerDrag = ctxMix.hitResult.interactions?.applyDrag;
      const cx = node.value.x || 0, cy = node.value.y || 0;
      if (innerDrag && !ctxMix.hitResult._wrappedByChartCoordMap) {
        ctxMix.hitResult.interactions.applyDrag = (wx, wy) => {
          return innerDrag(wx - cx, wy - cy);
        };
        ctxMix.hitResult._wrappedByChartCoordMap = true; 
      }
    }
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
Ramachandran-specific chart nodes — read dimensions from ctxMix.getWH()
──────────────────────────────────────────────────────────────────────────── */
const REGION_SETS = {
  general: {
    favored: [
      { label: 'β',   cx: -119, cy:  133, rx: 53, ry: 38, rot: -0.61 },
      { label: 'α',   cx:  -66, cy:  -42, rx: 32, ry: 26, rot: -0.17 },

    allowed: [

  glycine: {

    ],
    allowed: [
      { cx: -105, cy:  135, rx: 78, ry: 56, rot: -0.52 },
      { cx:  -66, cy:  -42, rx: 50, ry: 40, rot: -0.17 },
      { cx:   58, cy:   42, rx: 50, ry: 40, rot:  0.17 },

    ],

};

const RC_DEFAULTS = Object.freeze({
  aspectRatio:      1,
  bgFill:           '#1c1c24',
  borderColor:      '#3a3a4c',
  borderWidth:      1.5,
  cornerRadius:     6,
  showRegions:      true,
  regionSet:        'general',
  favoredFill:      'rgba(80, 180, 120, 0.35)',
  favoredStroke:    'rgba(80, 180, 120, 0.60)',
  allowedFill:      'rgba(80, 180, 120, 0.12)',
  allowedStroke:    'rgba(80, 180, 120, 0.30)',
  regionLineWidth:  1.5,
  showRegionLabels: true,
  regionLabelColor: 'rgba(200, 220, 200, 0.7)',
  regionLabelSize:  18,
  showGrid:         true,
  gridStep:         30,
  gridColor:        'rgba(255, 255, 255, 0.05)',
  gridLineWidth:    1,
  axisColor:        'rgba(255, 255, 255, 0.25)',
  axisLineWidth:    1.5,
  showTicks:        true,
  tickStep:         60,
  tickLength:       5,
  tickLabelColor:   '#889',
  tickLabelSize:    10,
  axisTitleColor:   '#aab',
  axisTitleSize:    14,
  showDiagonal:     false,
  diagonalColor:    'rgba(255, 255, 255, 0.08)',
});

class RamachandranChartNode {

  static _geom(ctxMix, p) {
    const { W, H } = ctxMix.getWH();
    const ASPECT_RATIO = p.aspectRatio || 1.0;

    const fitW = Math.min(W, H * ASPECT_RATIO);
    const fitH = Math.min(W / ASPECT_RATIO, H);

    const left = -fitW / 2;
    const top = -fitH / 2;

    return { fitW, fitH, left, top };
  }

  static phiPsiToScreen(phi, psi, g) {
    const nx = (phi + 180) / 360;
    const ny = (180 - psi) / 360; 
    return {
      x: g.left + nx * g.fitW,
      y: g.top + ny * g.fitH
    };
  }

  static screenToPhiPsi(sx, sy, g) {
    const nx = (sx - g.left) / g.fitW;
    const ny = (sy - g.top) / g.fitH;
    return {
      phi: nx * 360 - 180,
      psi: 180 - ny * 360
    };
  }

  static _drawEllipseRegion(ctx, region, g) {
    const srx = Math.abs(region.rx * (g.fitW / 360));
    const sry = Math.abs(region.ry * (g.fitH / 360));
    if (srx < 0.5 || sry < 0.5) return;

    for (const dPsi of [0, 360, -360]) {
      const shifted = RamachandranChartNode.phiPsiToScreen(region.cx, region.cy + dPsi, g);
      ctx.beginPath();
      ctx.ellipse(shifted.x, shifted.y, srx, sry, -(region.rot || 0), 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  static draw2d(ctxMix, node, params) {
    const p = { ...RC_DEFAULTS, ...params };
    const g = RamachandranChartNode._geom(ctxMix, p);
    const ctx = ctxMix.ctx;
    const { left, top, fitW, fitH } = g;

    ctx.save();
    ctx.fillStyle = p.bgFill;
    const cr = p.cornerRadius || 0;
    if (cr > 0 && ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(left, top, fitW, fitH, cr); ctx.fill();
    } else {
      ctx.fillRect(left, top, fitW, fitH);
    }

    ctx.save();
    ctx.beginPath();
    if (cr > 0 && ctx.roundRect) ctx.roundRect(left, top, fitW, fitH, cr);
    else ctx.rect(left, top, fitW, fitH);
    ctx.clip();

    if (p.showRegions) {
      const regions = REGION_SETS[p.regionSet] || REGION_SETS.general;

      ctx.fillStyle = p.allowedFill; ctx.strokeStyle = p.allowedStroke; ctx.lineWidth = p.regionLineWidth || 1;
      for (const reg of regions.allowed) RamachandranChartNode._drawEllipseRegion(ctx, reg, g);

        ctx.fillStyle = p.favoredFill; ctx.strokeStyle = p.favoredStroke; ctx.lineWidth = p.regionLineWidth || 1;
      for (const reg of regions.favored) RamachandranChartNode._drawEllipseRegion(ctx, reg, g);
    }

    if (p.showGrid) {
      const step = p.gridStep || 30;
      ctx.strokeStyle = p.gridColor; ctx.lineWidth = p.gridLineWidth || 1;
      for (let deg = -180 + step; deg < 180; deg += step) {
        if (deg === 0)
          continue;
        const vTop = RamachandranChartNode.phiPsiToScreen(deg, 180, g);
        const vBot = RamachandranChartNode.phiPsiToScreen(deg, -180, g);
        ctx.beginPath(); ctx.moveTo(vTop.x, vTop.y); ctx.lineTo(vBot.x, vBot.y); ctx.stroke();

        const hLt = RamachandranChartNode.phiPsiToScreen(-180, deg, g);
        const hRt = RamachandranChartNode.phiPsiToScreen(180, deg, g);
        ctx.beginPath(); ctx.moveTo(hLt.x, hLt.y); ctx.lineTo(hRt.x, hRt.y); ctx.stroke();
      }
    }

    if (p.showDiagonal) {
      const d0 = RamachandranChartNode.phiPsiToScreen(-180, 180, g);
      const d1 = RamachandranChartNode.phiPsiToScreen(180, -180, g);
      ctx.strokeStyle = p.diagonalColor; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(d0.x, d0.y); ctx.lineTo(d1.x, d1.y); ctx.stroke();
    }

    ctx.strokeStyle = p.axisColor; ctx.lineWidth = p.axisLineWidth || 1.5;

    const ax0t = RamachandranChartNode.phiPsiToScreen(0, 180, g);
    const ax0b = RamachandranChartNode.phiPsiToScreen(0, -180, g);
    ctx.beginPath(); ctx.moveTo(ax0t.x, ax0t.y); ctx.lineTo(ax0b.x, ax0b.y); ctx.stroke();

    const ax0l = RamachandranChartNode.phiPsiToScreen(-180, 0, g);
    const ax0r = RamachandranChartNode.phiPsiToScreen(180, 0, g);
    ctx.beginPath(); ctx.moveTo(ax0l.x, ax0l.y); ctx.lineTo(ax0r.x, ax0r.y); ctx.stroke();

    if (p.showRegionLabels) {
      const regions = REGION_SETS[p.regionSet] || REGION_SETS.general;
      const rlSize = p.regionLabelSize || 18;
      ctx.font = `700 italic ${rlSize.toFixed(1)}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      for (const reg of regions.favored) {
        if (!reg.label)
          continue;
        const ls = RamachandranChartNode.phiPsiToScreen(reg.cx, reg.cy, g);
        ctx.fillText(reg.label, ls.x + 1.5, ls.y + 1.5);
      }
      ctx.fillStyle = p.regionLabelColor;
      for (const reg of regions.favored) {
        if (!reg.label)
          continue;
        const ls = RamachandranChartNode.phiPsiToScreen(reg.cx, reg.cy, g);
        ctx.fillText(reg.label, ls.x, ls.y);
      }
    }

    ctx.restore(); 

    if (p.borderWidth > 0) {
      ctx.strokeStyle = p.borderColor; ctx.lineWidth = p.borderWidth;
      if (cr > 0 && ctx.roundRect) {
        ctx.beginPath(); ctx.roundRect(left, top, fitW, fitH, cr); ctx.stroke();
      } else {
        ctx.strokeRect(left, top, fitW, fitH);
      }
    }

    if (p.showTicks) {
      const step = p.tickStep || 60;
      const tLen = p.tickLength || 5;
      const tSize = p.tickLabelSize || 10;

      ctx.strokeStyle = p.axisColor; ctx.lineWidth = 1;
      ctx.fillStyle = p.tickLabelColor; ctx.font = `${tSize.toFixed(1)}px monospace`;

      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (let deg = -180; deg <= 180; deg += step) {
        const tp = RamachandranChartNode.phiPsiToScreen(deg, -180, g);
        ctx.beginPath(); ctx.moveTo(tp.x, tp.y); ctx.lineTo(tp.x, tp.y + tLen); ctx.stroke();
        ctx.fillText(deg + '°', tp.x, tp.y + tLen + 3);
      }

      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (let deg = -180; deg <= 180; deg += step) {
        const tp = RamachandranChartNode.phiPsiToScreen(-180, deg, g);
        ctx.beginPath(); ctx.moveTo(tp.x, tp.y); ctx.lineTo(tp.x - tLen, tp.y); ctx.stroke();
        ctx.fillText(deg + '°', tp.x - tLen - 4, tp.y);
      }
    }

    const atSize = p.axisTitleSize || 14;
    ctx.fillStyle = p.axisTitleColor; ctx.font = `italic 600 ${atSize.toFixed(1)}px system-ui, sans-serif`;

    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const phiPos = RamachandranChartNode.phiPsiToScreen(0, -180, g);
    ctx.fillText('φ (phi)', phiPos.x, phiPos.y + 24);

    ctx.save();
    const psiPos = RamachandranChartNode.phiPsiToScreen(-180, 0, g);
    ctx.translate(psiPos.x - 34, psiPos.y);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ψ (psi)', 0, 0);
    ctx.restore();
  }
}

//>> import { PipKinds } from './pip-kind.js';

class RamachandranPointNode {

// New Style: Metadata tells the system how to interact with this node
  static meta = {
    pipKind: PipKinds.JUNCTION,
    zOrder: 1,
    spawnOverrides: (wp) => ({ x: wp.x, y: wp.y, text: 'residue' }),
    editableFields: (node) => [
      { key: 'name', label: 'Name', type: 'text', value: node.value.name || '' },
      { key: 'color', label: 'Color', type: 'color', value: node.value.color || '#882' },
    ],
  };

  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    if (!v) return;

    const ctx = ctxMix.ctx;
//v.isHovered = true;
    ctx.beginPath(); ctx.arc(v.x, v.y, v.radius, 0, Math.PI * 2);

    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
    ctx.fillStyle = v.color || '#4fc3f7'; ctx.fill();
    ctx.shadowColor = 'transparent';

    ctx.strokeStyle = v.isHovered ? '#fff' : 'rgba(255,255,255,0.7)';
    ctx.lineWidth = v.isHovered ? 2 : 1.5; ctx.stroke();

    if (v.isHovered && v.name) {
      ctx.fillStyle = '#fff'; ctx.font = `11px monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.strokeText(v.name, v.x, v.y - v.radius - 4);
      ctx.fillText(v.name, v.x, v.y - v.radius - 4);
    }
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt) return;

    const v = ctxMix.getValue(ctxMix, node, params);
    if (!v) return;

    const dx = pt.x - v.x, dy = pt.y - v.y;

    if (dx * dx + dy * dy <= v.hitRadiusSq) {
      ctxMix.hitResult = {
        node: ctxMix.getNode(ctxMix, node, params), 
        pointIndex: v.index,
        phi: v.phi, 
        psi: v.psi, 
        name: v.name,
        interactions: { 
          applyDrag: v.applyDrag // Ensure you pass the function reference, don't invoke it
        }
      };
    }
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
Value function — reads frame dimensions from ctxMix.getWH()
──────────────────────────────────────────────────────────────────────────── */

const ramachandranPointValueFn = (ctxMix, fwParent, params, index) => {
  const v = fwParent.value;
  const data = v.data || [];
  const pt = data[index];
  if (!pt) return null;

  const p = { ...RC_DEFAULTS, ...params };
  const g = RamachandranChartNode._geom(ctxMix, p); 
  const sPos = RamachandranChartNode.phiPsiToScreen(pt.phi, pt.psi, g);

  const chartId = v.originalNode ? v.originalNode.value.id : v.id;
  const isHovered = params.hoveredPoint?.nodeId === chartId && params.hoveredPoint?.index === index;

  return {
    index, 
    x: sPos.x, 
    y: sPos.y, 
    radius: 5, 
    hitRadiusSq: 81,
    color: pt.color || '#4fc3f7', 
    name: pt.name, 
    phi: pt.phi, 
    psi: pt.psi,
    isHovered,
    originalNode: v.originalNode || fwParent,

      pt.phi = Math.max(-180, Math.min(180, angles.phi));
      pt.psi = Math.max(-180, Math.min(180, angles.psi));
    }
  };
};

//<< import { AxisNode } from './axis-node.js';
