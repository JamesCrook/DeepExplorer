/** Least-recently-used map of sprite canvases. */
class SpriteLRU {
  constructor(cap) { this.cap = cap; this.m = new Map(); this.hits = 0; this.misses = 0; }
  get(k) {
    const v = this.m.get(k);
    if (v) { this.m.delete(k); this.m.set(k, v); this.hits++; } else this.misses++;
    return v;
  }
  set(k, v) { this.m.set(k, v); if (this.m.size > this.cap) this.m.delete(this.m.keys().next().value); }
  clear() { this.m.clear(); }
}

class SkyGL {
  static MAX = 2048;
  static ok = null;            // null until first use, then true / false
  static starCache = new SpriteLRU(3000);
  static deepCache = new SpriteLRU(80);

  static init() {
    if (SkyGL.ok !== null) return SkyGL.ok;
    SkyGL.ok = false;
    try {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 256;
      const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: false });
      if (!gl) return false;
      SkyGL.canvas = canvas; SkyGL.gl = gl;
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      SkyGL.progs = { star: SkyGL._program(QUAD_VS, STAR_FS, buf), deep: SkyGL._program(QUAD_VS, DEEP_FS, buf) };
      SkyGL.ok = !!(SkyGL.progs.star && SkyGL.progs.deep);
    } catch (e) { console.warn('sky-gl: WebGL2 unavailable', e); }
    return SkyGL.ok;
  }

  static _program(vsSrc, fsSrc, buf) {
    const gl = SkyGL.gl;
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn('sky-gl shader:', gl.getShaderInfoLog(s)); return null; }
      return s;
    };
    const vs = sh(gl.VERTEX_SHADER, vsSrc), fs = sh(gl.FRAGMENT_SHADER, fsSrc);
    if (!vs || !fs) return null;
    const p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, fs);
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.warn('sky-gl link:', gl.getProgramInfoLog(p)); return null; }
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return { p, vao, locs: new Map() };
  }

  /** Render one quad of w×h device pixels and return a 2D canvas copy of it. */
  static render(name, w, h, uniforms) {
    const gl = SkyGL.gl, pr = SkyGL.progs[name], cv = SkyGL.canvas;
    if (cv.width < w || cv.height < h) {
      cv.width = Math.min(SkyGL.MAX, Math.max(cv.width, w));
      cv.height = Math.min(SkyGL.MAX, Math.max(cv.height, h));
    }
    gl.useProgram(pr.p);
    gl.bindVertexArray(pr.vao);
    for (const k in uniforms) {
      let loc = pr.locs.get(k);
      if (loc === undefined) { loc = gl.getUniformLocation(pr.p, k); pr.locs.set(k, loc); }
      if (loc === null) continue;
      const v = uniforms[k];
      if (typeof v === 'number') gl.uniform1f(loc, v);
      else if (v.length === 2) gl.uniform2fv(loc, v);
      else if (v.length === 3) gl.uniform3fv(loc, v);
      else gl.uniform4fv(loc, v);
    }
    gl.disable(gl.BLEND);
    gl.viewport(0, 0, w, h);
    gl.enable(gl.SCISSOR_TEST); gl.scissor(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disable(gl.SCISSOR_TEST);
    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    out.getContext('2d').drawImage(cv, 0, cv.height - h, w, h, 0, 0, w, h);
    return out;
  }
}

/* ── stars ─────────────────────────────────────────────────────────────── */

class StarRender {
  /** The vertex-shader arithmetic of the original, in JS, in CSS pixels. */
  static look(flux, fI, mag, p, knee, nova) {
    const on = 1 - skySmooth(3.7, 4.7, mag);
    const L = Math.min(260, p.spikeLen * Math.pow(fI / 150, 0.9)) * on;
    const a = skyClamp(p.starCore * (0.5 + 0.12 * Math.sqrt(flux)), 0.5, 6);
    const B = flux / (flux + knee);
    let ext = B > 0.003 ? a * Math.sqrt(Math.pow(0.003 / B, -1 / 2.4) - 1) : a;
    ext = Math.max(skyClamp(Math.max(ext, 2 * a), 1, 220), L * 1.25);
    if (nova) ext = Math.max(ext, p.novaR * 1.6);
    return { on, L, a, B, ext: ext + 2 };
  }

  static colourOf(star) {
    if (star.rgb) return star.rgb;
    if (star.color) return skyHex(star.color);
    return mixWhite(SPECTRAL[star.cls] || SPECTRAL.G, 0.25);
  }

  /** Draw a star centred on world (x, y).  Returns { coreR } in CSS px, or null when culled. */
  static draw(ctx, x, y, star, params) {
    const p = { ...STAR_DEFAULTS, ...params };
    const M = ctx.getTransform(), D = Math.hypot(M.a, M.b) || 1, dpr = window.devicePixelRatio || 1, z = D / dpr;
    const cx = M.a * x + M.c * y + M.e, cy = M.b * x + M.d * y + M.f;
    const mag = star.mag ?? 3, knee = star.knee ?? 20, nova = !!star.nova;
    // Quantise brightness on a log scale so neighbouring stars share sprites.
    // The grid is absolute, so after a zoom step most needed sprites already exist.
    const q = v => Math.exp(Math.round(Math.log(Math.max(v, 1e-4)) * 8) / 8);
    const flux = q(star.weight * z * p.exposure), fI = q(star.weight * p.exposure * Math.pow(z, p.couple));
    const lk = StarRender.look(flux, fI, mag, p, knee, nova);
    const coreR = lk.a * 1.4;
    let S = Math.ceil(2 * lk.ext * dpr);
    if (S > 1024) S = 1024;
    const W = ctx.canvas.width, H = ctx.canvas.height;
    if (cx + S / 2 < 0 || cy + S / 2 < 0 || cx - S / 2 > W || cy - S / 2 > H) return { coreR, z };
    if (lk.B < 0.004 && !nova) return { coreR, z };

    if (!SkyGL.init()) {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = Math.min(1, lk.B * 3); ctx.fillStyle = rgbCss(StarRender.colourOf(star));
      ctx.beginPath(); ctx.arc(cx, cy, coreR * dpr, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      return { coreR, z };
    }
    const rgb = StarRender.colourOf(star).map(v => Math.round(v * 10) / 10);
    const key = ['S', flux.toFixed(5), fI.toFixed(5), lk.on.toFixed(2), rgb.join(','), nova ? 1 : 0, knee,
                 p.starCore, p.spikeLen, p.spikeGain, p.novaR, S, dpr].join('|');
    let sprite = SkyGL.starCache.get(key);
    if (!sprite) {
      sprite = SkyGL.render('star', S, S, {
        uExt: S / (2 * dpr), vColor: rgb, vB: lk.B, vA: lk.a, vL: lk.L, vOn: lk.on, vNova: nova ? 1 : 0,
        uSpikeGain: p.spikeGain, uNovaR: p.novaR,
      });
      SkyGL.starCache.set(key, sprite);
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(sprite, cx - S / 2, cy - S / 2);
    ctx.restore();
    return { coreR, z };
  }
}

/* ── galaxies and nebulae ──────────────────────────────────────────────── */

const DEEP_TYPE = { spiral: 0, irregular: 1, emission: 2, reflection: 3, dark: 4, planetary: 5, remnant: 6 };

class DeepRender {
  /** Draw a deep-sky object.  v: { x, y, r, rot (deg), axis, type, seed, gain,
   *  arms, pitch, armS, bulge, bar, tint }. */
  static draw(ctx, v, params) {
    const p = { ...DEEP_DEFAULTS, ...params };
    const type = DEEP_TYPE[v.type] ?? 0;
    const M = ctx.getTransform(), D = Math.hypot(M.a, M.b) || 1, dpr = window.devicePixelRatio || 1;
    const x = v.x || 0, y = v.y || 0, r = Math.max(1, v.r || 40), axis = skyClamp(v.axis ?? 1, 0.05, 1);
    const rot = (v.rot || 0) * Math.PI / 180, c = Math.cos(rot), s = Math.sin(rot);
    const cx = M.a * x + M.c * y + M.e, cy = M.b * x + M.d * y + M.f;
    const e = type <= 1 ? 1.6 : 1.45;
    const hw = e * r * D * (Math.abs(c) + axis * Math.abs(s)), hh = e * r * D * (Math.abs(s) + axis * Math.abs(c));
    const W = ctx.canvas.width, H = ctx.canvas.height;
    if (cx + hw < 0 || cy + hh < 0 || cx - hw > W || cy - hh > H) return;
    if (r * D < 1.5) return;

    if (!SkyGL.init()) {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = type === 4 ? 'rgba(0,0,0,0.5)' : 'rgba(180,170,220,0.12)';
      ctx.beginPath(); ctx.ellipse(cx, cy, r * D, r * D * axis, rot, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      return;
    }

    // Which device rectangle to render: the whole sprite when it is on screen, else the visible part.
    const full = cx - hw >= 0 && cy - hh >= 0 && cx + hw <= W && cy + hh <= H && 2 * hw <= SkyGL.MAX && 2 * hh <= SkyGL.MAX;
    let x0, y0, w, h, rectKey;
    if (full) {
      w = Math.ceil(2 * hw); h = Math.ceil(2 * hh); x0 = cx - w / 2; y0 = cy - h / 2;
      rectKey = w + 'x' + h;
    } else {
      x0 = Math.max(0, Math.floor(cx - hw)); y0 = Math.max(0, Math.floor(cy - hh));
      w = Math.min(W, Math.ceil(cx + hw)) - x0; h = Math.min(H, Math.ceil(cy + hh)) - y0;
      if (w <= 0 || h <= 0) return;
      rectKey = [x0, y0, w, h, Math.round(cx * 4), Math.round(cy * 4)].join(',');
    }
    const down = Math.min(1, SkyGL.MAX / Math.max(w, h));
    const rw = Math.max(1, Math.ceil(w * down)), rh = Math.max(1, Math.ceil(h * down));

    // Device pixel -> object space q (pre-rotation, pre-squash, in radii).
    const Q = (px, py) => {
      const dx = (px - cx) / D, dy = (py - cy) / D;
      const lx = c * dx + s * dy, ly = -s * dx + c * dy;
      return [lx / r, ly / (r * axis)];
    };
    const q0 = Q(x0, y0 + h), qx = Q(x0 + w, y0 + h), qy = Q(x0, y0);
    const uQ0 = q0, uQx = [qx[0] - q0[0], qx[1] - q0[1]], uQy = [qy[0] - q0[0], qy[1] - q0[1]];

    const g = HUBBLE[v.hubble] || {};
    const pick = (k, d) => v[k] ?? g[k] ?? d;
    const tint = v.tint ? skyHex(v.tint) : [0, 0, 0];
    const vM = type === 0
      ? [pick('arms', 0), pick('pitch', 15), pick('armS', 0), pick('bulge', 0.4)]
      : [0, 15, v.unlit ? 1 : 0, v.tint && v.forceTint !== false ? 1 : 0];
    const ppu = r * D / dpr;
    const uniforms = {
      uQ0, uQx, uQy, uExt: 1,
      vType: type, vSeed: ((v.seed ?? 1) * 0.61803) % 1, vGain: v.gain ?? 1, vPpu: ppu, vAxis: axis,
      vM, vM2: [pick('bar', 0), ...tint],
      uTime: 0, uOctBias: p.deepDetail + Math.log2(dpr * down), uPalette: +p.palette || 0, uResolve: p.resolve,
      uGalGain: p.galGain, uDiscScale: p.discScale, uClump: p.clump, uDust: p.dust, uKnots: p.knots, uWarm: p.warm,
      uNebGain: p.nebGain, uNebScale: p.nebScale, uWarp: p.warp, uContrast: p.contrast, uFilament: p.filament,
      uOiii: p.oiii, uIllum: p.illum, uShell: p.shell, uLobes: p.lobes,
      uPWobble: p.pWobble, uPWaves: p.pWaves, uPRagged: p.pRagged, uRWobble: p.rWobble, uRWaves: p.rWaves, uRRagged: p.rRagged,
      uDarkGain: p.darkGain, uDarkScale: p.darkScale, uDarkThresh: p.darkThresh, uDarkSoft: p.darkSoft, uRim: p.rim,
    };
    const objKey = [type, r, rot, axis, v.seed, v.gain, ...vM, ...uniforms.vM2, ppu.toFixed(3), dpr].join(',');
    const parKey = DEEP_KEYS.map(k => p[k]).join(',');
    const passes = type === 4
      ? [[1, 'source-over'], ...(p.rim > 0 ? [[2, 'lighter']] : [])]
      : [[0, 'lighter']];

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (const [pass, op] of passes) {
      const key = ['D', pass, rectKey, rw, rh, objKey, parKey].join('|');
      let sprite = SkyGL.deepCache.get(key);
      if (!sprite) {
        sprite = SkyGL.render('deep', rw, rh, { ...uniforms, uPass: pass });
        SkyGL.deepCache.set(key, sprite);
      }
      ctx.globalCompositeOperation = op;
      ctx.drawImage(sprite, x0, y0, w, h);
    }
    ctx.restore();
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
Sky nodes — ordinary scene-graph leaves over sky-gl.

  star        a named star: value { x, y, mag, cls (B G M N), color?, nova?, label }
  field-star  an unnamed star for flyweight arrays: value { x, y, w, c }.  It has
              no hit_test, so a field of a thousand never steals a click.
  deep-sky    a galaxy or nebula: value { x, y, r, rot, axis, type, seed, ... }

star declares itself a junction, so in the stock-strip arena edges attach to
stars and join them into constellations.  deep-sky has no pip: it is a body.
──────────────────────────────────────────────────────────────────────────── */

class StarNode {
  static meta = {
    zOrder: 1,
    pipKind: PipKinds.JUNCTION,
    spawnOverrides: (wp) => ({ x: wp.x, y: wp.y }),
    editableFields: (node) => [
      { key: 'label', label: 'Name', type: 'text', value: node.value.label || '' },
      { key: 'mag', label: 'Magnitude', type: 'number', value: node.value.mag ?? 3 },
      { key: 'cls', label: 'Class B/G/M/N', type: 'text', value: node.value.cls || 'G' },
    ],
  };
  static getCentreXY(res, node, params) {
    const v = res.getValue(res, node, params) || {};
    return { x: v.x || 0, y: v.y || 0 };
  }
  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params) || {};
    const mag = v.mag ?? 3;
    const s = StarRender.draw(ctxMix.ctx, v.x || 0, v.y || 0,
      { weight: v.weight ?? magWeight(mag), mag, cls: v.cls, color: v.color, nova: v.nova || v.cls === 'N' }, params);
    if (!s) return;
    (node.state ||= {}).hitR = (Math.max(6, s.coreR) + 4) / s.z;
    if (v.selected || v.hovered) {
      const ctx = ctxMix.ctx;
      ctx.save();
      ctx.beginPath(); ctx.arc(v.x || 0, v.y || 0, (s.coreR + 7) / s.z, 0, Math.PI * 2);
      ctx.setLineDash([3 / s.z, 3 / s.z]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 / s.z; ctx.stroke();
      ctx.restore();
    }
  }
  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt) return;
    const v = ctxMix.getValue(ctxMix, node, params) || {};
    const dx = pt.x - (v.x || 0), dy = pt.y - (v.y || 0), R = node.state?.hitR ?? 12;
    if (dx * dx + dy * dy > R * R) return;
    ctxMix.hitResult = { node, interactions: {
      applyDrag(wx, wy) { Values.setValue(Values, node, params, { x: wx - dx, y: wy - dy }); return node; },
    } };
  }
}

class FieldStarNode {
  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    if (!v) return;
    StarRender.draw(ctxMix.ctx, v.x, v.y, { weight: v.w, mag: 9, rgb: v.c, knee: 6 }, params);
  }
}

class DeepSkyNode {
  static meta = {
    zOrder: 0.5,
    // No pip: a galaxy is a body, not a point, so a star dropped into a
    // nebula sits in it rather than merging with it as two junctions would.
    spawnOverrides: (wp) => ({ x: wp.x, y: wp.y, r: 50 }),
    editableFields: (node) => [
      { key: 'label', label: 'Name', type: 'text', value: node.value.label || '' },
      { key: 'type', label: 'Type', type: 'text', value: node.value.type || 'spiral' },
      { key: 'r', label: 'Radius', type: 'number', value: node.value.r ?? 50 },
      { key: 'rot', label: 'Rotation°', type: 'number', value: node.value.rot ?? 0 },
      { key: 'axis', label: 'Axis ratio', type: 'number', value: node.value.axis ?? 1 },
      { key: 'seed', label: 'Seed', type: 'number', value: node.value.seed ?? 1 },
      { key: 'gain', label: 'Gain', type: 'number', value: node.value.gain ?? 1 },
      { key: 'arms', label: 'Arms', type: 'number', value: node.value.arms ?? 2 },
      { key: 'pitch', label: 'Pitch°', type: 'number', value: node.value.pitch ?? 15 },
      { key: 'bulge', label: 'Bulge', type: 'number', value: node.value.bulge ?? 0.4 },
    ],
  };
  static getCentreXY(res, node, params) {
    const v = res.getValue(res, node, params) || {};
    return { x: v.x || 0, y: v.y || 0 };
  }
  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params) || {};
    DeepRender.draw(ctxMix.ctx, v, params);
    if (v.selected || v.hovered) {
      const ctx = ctxMix.ctx, r = v.r || 40, z = Math.hypot(ctx.getTransform().a, ctx.getTransform().b) || 1;
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(v.x || 0, v.y || 0, r * 1.05, r * 1.05 * (v.axis ?? 1), (v.rot || 0) * Math.PI / 180, 0, Math.PI * 2);
      ctx.setLineDash([4 / z * 2, 4 / z * 2]); ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2 / z; ctx.stroke();
      ctx.restore();

  }
  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt) return;
    const v = ctxMix.getValue(ctxMix, node, params) || {};
    const r = v.r || 40, axis = Math.max(0.05, v.axis ?? 1), rot = (v.rot || 0) * Math.PI / 180;
    const dx = pt.x - (v.x || 0), dy = pt.y - (v.y || 0);
    const lx = Math.cos(rot) * dx + Math.sin(rot) * dy, ly = -Math.sin(rot) * dx + Math.cos(rot) * dy;
    // A thin edge-on disc is still easy to grab.
    const ry = Math.max(r * axis, 8);
    if ((lx / (r * 0.9)) ** 2 + (ly / ry) ** 2 > 1) return;
    ctxMix.hitResult = { node, interactions: {
      applyDrag(wx, wy) { Values.setValue(Values, node, params, { x: wx - dx, y: wy - dy }); return node; },
    } };
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
annular-labels — the label sprite system from Constellation Labels, unchanged
in substance.  It knows nothing of graphs, zoom or the scene graph: it turns
label layouts into cached offscreen canvases.  ring-label-node is the adapter.

The one change: the factory's dpr is set by the caller per sprite (and is part
of the key), because in the scene graph the device scale is per node — a
camera, a stock strip and a soloed pane all differ.
──────────────────────────────────────────────────────────────────────────── */

/** Fixed-capacity cache with random replacement. evictRandom() hands back
 *  the victim so its canvas can be recycled for the next build. */
class RandomReplacementCache {
  constructor(capacity) {
    this.capacity = capacity;
    this.map = new Map();
    this.keys = [];
    this.hits = 0; this.misses = 0; this.evictions = 0;
  }
  get size() { return this.keys.length; }
  get full() { return this.keys.length >= this.capacity; }
  get(key) {
    const e = this.map.get(key);
    if (e) { this.hits++; return e.value; }
    this.misses++; return undefined;
  }
  put(key, value) {
    const e = this.map.get(key);
    if (e) { e.value = value; return; }
    this.map.set(key, { value, slot: this.keys.length });
    this.keys.push(key);
  }
  evictRandom() {
    if (!this.keys.length) return undefined;
    const i = (Math.random() * this.keys.length) | 0;
    const key = this.keys[i];
    const victim = this.map.get(key);
    this.map.delete(key);
    const last = this.keys.pop();
    if (i < this.keys.length) { this.keys[i] = last; this.map.get(last).slot = i; }
    this.evictions++;
    return victim.value;
  }
  clear() { this.map.clear(); this.keys.length = 0; }
}

/** Typographic style for a family of labels. emboldenEm / erodeEm: synthetic
 *  weight beyond the font's own range, as a fraction of the font size. */
class TextStyle {
  constructor({ id, family, weight = 400, caps = false, tracking = 0, lineHeight = 1.18,
                halo = 'rgba(5,7,13,0.9)', haloWidth = 3, emboldenEm = 0, erodeEm = 0 }) {

    this.pad = Math.ceil(haloWidth) + 1;
  }
  font(px) { return `${this.weight} ${px}px ${this.family}`; }
  transform(t) { return this.caps ? t.toUpperCase() : t; }
}

/** Cached text measurement, truncation, balanced splitting and wrapping. */
class TextMeasurer {
  constructor() {
    this.ctx = document.createElement('canvas').getContext('2d');
    this.cache = new Map();
  }
  clear() { this.cache.clear(); }
  width(text, style, px) {
    const k = style.id + '|' + px + '|' + text;
    let w = this.cache.get(k);
    if (w !== undefined) return w;
    if (this.cache.size > 40000) this.cache.clear();
    const ctx = this.ctx, t = style.transform(text);
    ctx.font = style.font(px);
    if (style.tracking) {
      const chars = [...t]; w = 0;
      for (const ch of chars) w += ctx.measureText(ch).width;
      w += style.tracking * px * Math.max(0, chars.length - 1);
    } else w = ctx.measureText(t).width;
    this.cache.set(k, w);
    return w;
  }
  truncate(text, style, px, maxW) {
    if (this.width(text, style, px) <= maxW) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (this.width(text.slice(0, mid).trimEnd() + '…', style, px) <= maxW) lo = mid; else hi = mid - 1;
    }
    return text.slice(0, lo).trimEnd() + '…';
  }
  /** Split at the word boundary that minimises the wider half. */
  splitBalanced(text, style, px) {
    const words = text.split(' ');
    if (words.length < 2) return [text, ''];
    let best = null, bestW = Infinity;
    for (let i = 1; i < words.length; i++) {
      const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
      const w = Math.max(this.width(a, style, px), this.width(b, style, px));
      if (w < bestW) { bestW = w; best = [a, b]; }
    }
    return best;
  }
  /** "Cognitive Development & Meditation Subtopic:125" -> [title, "Subtopic:125"]. */
  semanticSplit(text) {
    const m = text.match(/^(.*\S)\s+([A-Za-z]+:\s*\S+)$/);
    return m ? [m[1], m[2]] : [text, ''];
  }
  /** Break points that carry meaning: after "&", "—", ":" or ",". */
  meaningfulBreaks(text) {
    const words = text.split(' '), out = [];
    for (let i = 1; i < words.length; i++)
      if (/(&|—|:|,)$/.test(words[i - 1])) out.push([words.slice(0, i).join(' '), words.slice(i).join(' ')]);
    return out;
  }
  wrap(text, style, px, maxW, maxLines, force = false) {
    if (maxLines <= 1 || (!force && this.width(text, style, px) <= maxW)) return [this.truncate(text, style, px, maxW)];
    const words = text.split(' ');
    if (maxLines === 2 || words.length <= 2) {
      const [a, b] = this.splitBalanced(text, style, px);
      if (!b) return [this.truncate(a, style, px, maxW)];
      return [this.truncate(a, style, px, maxW), this.truncate(b, style, px, maxW)];
    }
    const lines = []; let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (!cur || this.width(t, style, px) <= maxW) cur = t; else { lines.push(cur); cur = w; }
    }
    lines.push(cur);
    if (lines.length > maxLines) { const rest = lines.slice(maxLines - 1).join(' '); lines.length = maxLines - 1; lines.push(rest); }
    return lines.map(l => this.truncate(l, style, px, maxW));
  }
}

/** Pure geometry: decides what a label will look like, in layout units.
 *  The resulting layout's key identifies its sprite in the cache. */
class LabelLayouter {
  constructor(measurer) { this.m = measurer; }

  lines({ text, style, px, color, maxWidth, maxLines = 1, align = 'center', forceSplit = false }) {
    const lines = this.m.wrap(text, style, px, maxWidth, maxLines, forceSplit);
    const widths = lines.map(l => this.m.width(l, style, px));
    const pad = style.pad;
    const w = Math.ceil(Math.max(...widths) + 2 * pad);
    const h = Math.ceil(px * style.lineHeight * lines.length + 2 * pad);
    const keyBase = `L|${style.id}|${color}|${px}|${lines.join('\n')}`;
    return { type: 'lines', lines, widths, w, h, px, style, color, pad, align, keyBase, key: keyBase + '|' + align };
  }
  withAlign(layout, align) {
    if (layout.type !== 'lines' || layout.align === align) return layout;
    return { ...layout, align, key: layout.keyBase + '|' + align };
  }

  /** Text on a ring. The top track reads clockwise over the anchor, the
   *  bottom track counter-clockwise under it, so both read left to right.
   *  The ring reads like a sentence: top text, a space, a blob, a space,
   *  bottom text.  Filling is greedy, and the halves never overlap.
   *  meaning: split "Main title Subtopic:125" into title and qualifier, and
   *  prefer breaks after "&", "—", ":" or ",".  innerCont: straight, smaller
   *  text inside the ring below the star for whatever the ring can't hold. */
  ring({ text, style, px, color, clearRadius, baseRadius = 0, maxArcTop = 2.6, maxArcBottom = 2.6, grow = false, maxRadius = 260,
         meaning = true, innerCont = false, blob = 0, bandAlpha = 0, rimAlpha = 0 }) {
    const m = this.m, pad = style.pad;
    const band = px * style.lineHeight + 2 * pad;
    const W = t => t ? m.width(t, style, px) : 0;
    let R = Math.max(clearRadius + band / 2, baseRadius);
    if (grow) {
      const [a, b] = m.splitBalanced(text, style, px);
      R = Math.min(maxRadius, Math.max(R, (Math.max(W(a) / maxArcTop, W(b) / maxArcBottom)) + 2 * pad / maxArcTop));
    }
    R = Math.ceil(R);
    const space = m.width(' ', style, px);
    const sepLen = blob > 0 ? 2 * space + 2 * blob : 2 * space;
    const capTop = R * maxArcTop, capBot = R * maxArcBottom;
    const fits = (a, b) => W(a) <= capTop && W(b) <= capBot && W(a) / 2 + W(b) / 2 + sepLen <= Math.PI * R;

    let [main, qual] = meaning ? m.semanticSplit(text) : [text, ''];
    const ringText = innerCont && qual ? main : (qual ? main + ' ' + qual : main);
    let top = '', bottom = '', rest = '';
    const cands = [[ringText, '']];
    if (meaning) cands.push(...m.meaningfulBreaks(ringText));
    const ok = cands.find(([a, b]) => fits(a, b || ''));
    if (ok) { [top, bottom] = ok; bottom = bottom || ''; }
    else {
      const words = ringText.split(' ');
      let i = 0;
      while (i < words.length && (i === 0 || fits(words.slice(0, i + 1).join(' '), ''))) i++;
      top = words.slice(0, i).join(' ');
      let j = i;
      while (j < words.length && fits(top, words.slice(i, j + 1).join(' '))) j++;
      bottom = words.slice(i, j).join(' ');

        const room = Math.min(capBot, 2 * (Math.PI * R - sepLen) - W(top));
        bottom = m.truncate(bottom ? bottom + ' ' + rest : rest, style, px, Math.max(0, room));
        rest = '';
      }
      const topRoom = Math.min(capTop, 2 * (Math.PI * R - sepLen));

    }
    const tracks = [];
    if (top) tracks.push({ text: top, px, R, Rdraw: R, dir: 1, w: W(top), band });
    if (bottom) tracks.push({ text: bottom, px, R, Rdraw: R, dir: -1, w: W(bottom), band });

    const blobs = [];
    if (blob > 0 && top) {
      const th = (W(top) / 2 + space + blob) / R;
      blobs.push({ R, a: th, r: blob }, { R, a: -th, r: blob });
    }

    let innerBox = null;
    const innerText = innerCont ? [rest, qual].filter(Boolean).join(' ') : '';
    if (innerText) {
      const hole = R - band / 2 + pad;
      const y0 = clearRadius + 1;
      const tryLayout = (ipx, allowTrunc) => {
        const lh = ipx * style.lineHeight, lines = [], widths = [];
        let words = innerText.split(' '), y = y0;
        while (words.length && y + lh <= hole) {
          const avail = 2 * Math.sqrt(Math.max(0, hole * hole - (y + lh) ** 2)) - 2;
          if (avail < ipx * 2) break;
          let k = 0;
          while (k < words.length && m.width(words.slice(0, k + 1).join(' '), style, ipx) <= avail) k++;
          if (k === 0) { if (!allowTrunc) return null; k = 1; }
          let line = words.slice(0, k).join(' ');
          words = words.slice(k);
          const lastRow = y + 2 * lh > hole;
          if (lastRow && words.length) { if (!allowTrunc) return null; line += ' ' + words.join(' '); words = []; }
          line = m.truncate(line, style, ipx, avail);
          lines.push(line); widths.push(m.width(line, style, ipx));
          y += lh;
        }
        if (words.length && !allowTrunc) return null;
        return lines.length ? { lines, widths, px: ipx, lh } : null;
      };
      let fit = null;
      for (let ipx = Math.max(9, Math.round(px * 0.8)); ipx >= 8 && !fit; ipx--) fit = tryLayout(ipx, false);
      if (!fit) fit = tryLayout(8, true);
      if (fit) {
        const boxW = Math.max(...fit.widths) + 2 * pad, boxH = fit.lines.length * fit.lh + 2 * pad;
        innerBox = { ...fit, boxW, boxH, x: -boxW / 2, y: y0 - pad };
      }

    const inner = R - band / 2 + pad, outer = R + band / 2 - pad * 0.5;
    const size = Math.ceil(2 * (outer + pad + 2));

      (innerBox ? innerBox.px + '|' + innerBox.lines.join('/') + '|' + innerBox.y.toFixed(1) : '');
    return { type: 'ring', tracks, blobs, innerBox, inner, outer, size, w: size, h: size, Rc: R,

  }
}

/** Builds and caches label sprites in device pixels.
 *  Stage 1: straight text with halo, drawn offscreen.
 *  Stage 2 (rings): stage 1 is copied one vertical strip at a time onto the
 *  circle, each strip rotated to its own tangent, so glyphs bend smoothly. */
class LabelSpriteFactory {
  constructor({ capacity = 300, dpr = 1 } = {}) {
    this.cache = new RandomReplacementCache(capacity);
    this.dpr = dpr;
    this.scratch = document.createElement('canvas');
    this.sctx = this.scratch.getContext('2d');
    this.builtTotal = 0;
  }
  clear() { this.cache.clear(); }

  get(layout) {
    const s = this.cache.get(layout.key);
    if (s) return s;
    const recycled = this.cache.full ? this.cache.evictRandom() : null;
    const canvas = recycled ? recycled.canvas : document.createElement('canvas');
    const sprite = layout.type === 'ring' ? this._buildRing(layout, canvas) : this._buildLines(layout, canvas);
    this.cache.put(layout.key, sprite);
    this.builtTotal++;
    return sprite;
  }

  _paintLines(ctx, lines, widths, L, boxW, boxH) {
    const { style, px, color, pad } = L, D = this.dpr;
    const lh = px * style.lineHeight;
    const align = L.align || 'left';
    const setup = c => {
      c.setTransform(D, 0, 0, D, 0, 0);
      c.font = style.font(px); c.textBaseline = 'middle'; c.lineJoin = 'round'; c.miterLimit = 2;
    };

        const x = align === 'left' ? pad : align === 'right' ? boxW - pad - tw : (boxW - tw) / 2;

        this.layer.width = Math.max(this.layer.width, W); this.layer.height = Math.max(this.layer.height, H);
      }
      g = this.lctx;
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
      setup(g);

    g.fillStyle = color;
    each(g, false);
    if (style.emboldenEm > 0) { g.strokeStyle = color; g.lineWidth = style.emboldenEm * px; each(g, true); }

    if (!style.tracking) { stroke ? ctx.strokeText(t, x, y) : ctx.fillText(t, x, y); return; }
    const gap = style.tracking * px;
    for (const ch of t) {
      stroke ? ctx.strokeText(ch, x, y) : ctx.fillText(ch, x, y);
      x += ctx.measureText(ch).width + gap;
    }
  }
  _buildLines(L, canvas) {
    const D = this.dpr;

/* One constellation from the northern atlas: a region seal round it, stars
   inside, and a few outside to show the shapes.  Brightest first, because the
   label layer places in subtree order. */
class AnnularLabelModel {
  get name() { return 'Annular Labels · Rings'; }
  get displayType() { return '2d'; }
  get background() { return '#05070d'; }

  constructor() {
    this.visible = true;
    const STARS = [
      ['Molam', 1, 'B', 0, 0],
      ['Cognitive Development & Meditation Subtopic:125', 2, 'G', 0, -150],
      ['SQLite protein front end', 3, 'B', 145, -55],
      ['Alignment with structure', 3, 'B', -145, -55],
      ['Seqrius ellcari', 3.5, 'G', 95, 125],
      ['Annular labels', 4, 'B', -95, 125],
      ['Pathway viewer', 4.5, 'G', 0, 170],
      ['tRNA table', 5, 'G', 230, 120],
      ['Twilight zone', 3, 'G', -360, -300],
      ['Iter Quasicrystallinum — Quasicrystals', 5.6, 'G', 360, -300],
      ['Krebs world', 4, 'M', -380, 300],
      ['Catalase', 1.2, 'M', 380, 300],
    ].map(([text, mag, cls, x, y]) => SYS.makeNode('ring-label', {
      text, mag, cls, x, y, tooltip: { name: text, detail: `magnitude ${mag} · class ${cls}`, extra: '' },
    })).sort((a, b) => a.value.mag - b.value.mag);

    const seal = SYS.makeNode('ring-label', {
      x: 0, y: 0, region: true, extent: 380, text: 'Proteuchus — Molecular Tools', color: '#9fe0b4',
      tooltip: { name: 'Proteuchus', detail: 'region seal', extra: '' },
    });

    const rng = mulberry32(1017);
    const field = fieldStarData(rng, [], 320, 520);
    const fieldNode = makeArray('field-star', field, { getValue: (mix, n, p, i) => field[i], selectable: false });

    const layer = SYS.makeNode('label-layer', {}, [seal, ...STARS]);
    const group = SYS.makeNode('group', {}, [fieldNode, layer]);
    this.sceneRoot = makeZoomableCamera(group, { centerOrigin: true, zoom: 0.65 });

    const num = (id, label, min, max, step, value) => ({ id, label, min, max, step, value });
    const tick = (id, label, value) => ({ type: 'checkbox', id, label, value });
    this.controls = [
      { type: 'separator', label: 'Star labels' },
      { type: 'select', id: 'pointMode', label: 'Long label shape',
        options: [['auto', 'Auto'], ['straight', '1 line'], ['wrap', '2 lines'], ['ring', 'Ring']], value: 'ring' },
      num('longLabelPx', 'Ring when wider than', 0, 300, 5, 90),
      num('maxWidth', 'Max label width', 80, 260, 5, 150),
      num('labelScale', 'Text size', 0.6, 2, 0.05, 1),
      num('labelWeight', 'Weight', 50, 1000, 50, 300),
      num('labelOpacity', 'Opacity', 0.1, 1, 0.05, 0.85),
      { type: 'separator', label: 'Rings' },
      num('ringRadius', 'Ring radius', 20, 90, 1, 44),
      num('ringArcTop', 'Max arc, top', 60, 360, 5, 160),
      num('ringArcBottom', 'Max arc, bottom', 60, 360, 5, 200),
      tick('ringBlob', 'Blob separators', true),
      num('ringBlobSize', 'Blob size', 1, 5, 0.1, 2.4),
      tick('ringMeaning', 'Split by meaning', true),
      tick('ringInner', 'Inner continuation', true),
      num('ringBand', 'Band background', 0, 0.4, 0.01, 0.11),
      num('ringRim', 'Band rim', 0, 1, 0.05, 0.25),
      { type: 'separator', label: 'Region seal' },
      { type: 'select', id: 'regionMode', label: 'Shape', options: [['ring', 'Ring'], ['wrap', '2 lines'], ['straight', '1 line']], value: 'ring' },
      num('regionSize', 'Size', 0.5, 3, 0.05, 1.3),
      num('regionWeight', 'Weight', 50, 1000, 50, 300),
      num('regionOpacity', 'Opacity', 0.05, 1, 0.05, 0.4),
      { type: 'separator', label: 'Placement' },
      tick('collide', 'Avoid collisions', true),
      tick('screenConstant', 'Constant size on screen', true),
      tick('showStars', 'Draw stars', true),
      num('exposure', 'Star exposure', 0.2, 3, 0.05, 1),
    ];
  }

  onControl(id, val) {
    const c = id && this.controls.find(k => k.id === id);
    if (c) c.value = val;
  }
}
SYS.MODELS.push(new AnnularLabelModel());

class StockStripModel {
  get name() { return 'Stock Strip · Scene Graph'; }
  get displayType() { return '2d'; }
  get stockStripHeight() { return 170; }
  setArena( scene ){
    PipperNode.loadScene(this.arenaNode, scene, {});
    this.harness.draw();
  }
  constructor() {
    this.visible = true;
    this.controls = [];

    const models = SYS.MODELS.filter(m => m.getScene);
    const modelControls = models.map(m => ({ type: 'button', label: m.name, cls: m.btnClass, action: () => { this.setArena( m.getScene() )} }));

    this.controls.push(
      { type: 'separator', label: 'Model' },
      ...modelControls,
      { type: 'separator', label: 'Display' },
      { id: 'stripOpacity',     label: 'Strip Opacity', min: 0, max: 100, step: 1, value: SYS.P.stripOpacity || 100 },
      { type: 'checkbox', id: 'showHints', label: 'Show Hints', value: true },
      );
    this.edgeSnapController = typeof EdgeSnapController !== 'undefined' ? new EdgeSnapController() : null;
    this.raftSnapController = typeof RaftSnapController !== 'undefined' ? new RaftSnapController() : null;

    const arena = SYS.makeNode('pipper-node', {});
    arena.inst = {
      controllers: [
        this.edgeSnapController,
        this.raftSnapController,
      ].filter(Boolean),
    };
    arena.subtree = [
      SYS.makeNode('button-node', { x: -90, y: -40, width: 64, height: 64, label: 'あ', sub: 'a' }),
      SYS.makeNode('button-node', { x:  90, y: -40, width: 64, height: 64, label: 'う', sub: 'u' }),
      SYS.makeNode('button-node', { x:   0, y:  40, width: 64, height: 64, label: 'お', sub: 'o', color: '#8b6b4a', badge: 3 }),
    ];
    this.arenaNode = arena;
    const coneNode = SYS.makeNode('fracture-cone', {});
    coneNode.inst = { target: arena };
    const cam = makeZoomableCamera(
      SYS.makeNode('group', {}, [arena, coneNode]),
      { centerOrigin: true }
      );
    this.cameraNode = cam;
    const stock = SYS.makeNode('stock-strip', { height: 170 });
    stock.inst = { arenaNode: arena, cameraNode: cam };
    stock.subtree = [ 
      { type: 'word-node', value: { x:   80, y: 80, text: 'One',    fontSize: 32, fontWeight: 800, color: '#e4dac6' } },
      { type: 'word-node', value: { x:   480, y: 80, text: 'Word',   fontSize: 32, fontWeight: 800, color: '#e42a26' } },
      ...STOCK,
    ];

    const top   = SYS.makeNode('group', {});
    top.subtree = [ stock, cam ];

    this.sceneRoot = top;

    this.controls.push(
      ...CONTROLS,
      );
  }

  onControl(id, val, getValues, app) {
    if (id === 'enableEdgeSnap' || id === 'enableRaftSnap') {
      const v = getValues();
      this.arenaNode.inst.controllers = [
        v.enableEdgeSnap !== false && this.edgeSnapController,
        v.enableRaftSnap !== false && this.raftSnapController,
      ].filter(Boolean);
    }
  }
}
SYS.MODELS.push(new StockStripModel());

//>> import { SYS } from './sys.js';
//>> export { OrganiserModel };
class OrganiserModel {
  get name() { return 'Organiser'; }
  get displayType() { return 'none'; }

  constructor(models) {
    this.models = models;
    this.visible = true;
  }

  getControls(app) {
    const ctrls = [{ type: 'separator', label: 'Show / Hide Panels' }];
    this.models.forEach((m, i) => {
      if (m === this) return;
      let label = m.name || `Model ${i}`;
      label = label.split(/[.·]/)[0].trim();

      ctrls.push({
        type: 'checkbox',
        id: 'vis_' + i,
        label: label,
        value: m.visible !== false
      });
    });
    ctrls.push({ type: 'button', label: 'Apply Layout', cls: 'primary', action: () => app.buildLayout() });
    return ctrls;
  }
}
SYS.MODELS.push(new OrganiserModel(SYS.MODELS));

/* The page's one tooltip element, driven by whichever harness has the
   pointer.  It lives here rather than in a model so that a build without
   the organiser still has somewhere for a hit to report itself. */

function showTooltip(ex,ey,info){
  const ttEl=document.getElementById('tooltip');
  ttEl.querySelector('.tt-name').textContent=info.name||'';
  ttEl.querySelector('.tt-detail').textContent=info.detail||'';
  ttEl.querySelector('.tt-extra').textContent=info.extra||'';
  ttEl.querySelector('.tt-name').style.color=info.selected?'#daa02e':'#e4dac6';
  ttEl.style.display='block';ttEl.style.left=(ex+14)+'px';ttEl.style.top=(ey-10)+'px';
}
function hideTooltip(){
  document.getElementById('tooltip').style.display='none';
}

//<< import { DemoHarness2D } from './demo-harness2-d.js';
//-- file: ./demo-harness2-d.js --
//>> import { sceneRegistry } from './sys.js';
//>> import { Values } from './values.js';
//>> import { autoFitCamera } from './make-camera.js';
//>> import { hideTooltip, showTooltip } from './tooltip.js';
//>> export { DemoHarness2D };

/* ═══════════════════════════════════════════════════════════════════════════
DemoHarness2D — owns a 2D canvas pane: drawing, hit-testing, pan/zoom,
and control-value routing.

Changes from original:
- Seeds this.params from paneConfig.controls on construction so that
 control values (regionSet, showGrid, screenMode …) reach draw2d params
 immediately, not just after user interaction.
- applyControl(id, val, getValues) merges into params and redraws,
 fixing the bug where HUD controls displayed but had no effect on 2D.
- Adds getWH() to ctxMix (pane dims + camera state) so FrameNode's
 screenMode path works (it calls ctxMix.getWH(), distinct from getWH).
═══════════════════════════════════════════════════════════════════════════ */
class DemoHarness2D {
  constructor(canvas, paneConfig, app) {
    this.canvas = canvas;
    this.rawCtx = canvas.getContext('2d', { willReadFrequently: true });
    this.app = app;
    this.paneConfig = paneConfig;
    paneConfig.harness = this;

// Every 2D model provides a sceneRoot wrapped in a pane-camera node
    this.node = paneConfig.sceneRoot;

// ── Seed params from model controls so draw2d gets them on first frame ──
    this.params = {};
    if (paneConfig.controls) {
      for (const c of paneConfig.controls) {
        if (c.id && c.value !== undefined) this.params[c.id] = c.value;
      }
    }

    this.dragHit = null;
    this.selectedHit = null;   // an opaque handle: only ever called, never inspected
    this.hoveredHit = null;

// Pan state
    this.isPanning = false;
    this.lastMouseX = 0;
    this.lastMouseY = 0;

    this._resize();
    autoFitCamera(this.node, this.W, this.H);
    this._listen();
    this.draw();
    new ResizeObserver(() => { this._resize(); this.draw(); }).observe(canvas);
  }

/* ── control routing (called by App.handleHudChange) ───────────── */

  applyControl(id, val, getValues) {
    this.params[id] = val;
    if (this.paneConfig.onControl) {
      this.paneConfig.onControl(id, val, getValues, this.app);
    }
    this.draw();
  }

/* ── camera accessors ──────────────────────────────────────────── */

  get cam() { return (this.paneConfig.cameraNode || this.node).value; }

  _screenToWorldXXX(sx, sy) {
    const v = this.cam, z = v.zoom || 1;
    const cx = v.centerOrigin ? this.W / 2 : 0;
    const cy = v.centerOrigin ? this.H / 2 : 0;
    return { x: (sx - cx) / z + (v.scrollX || 0), y: (sy - cy) / z + (v.scrollY || 0) };
  }

/* ── sizing ────────────────────────────────────────────────────── */

  _resize() {
    this.dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.getBoundingClientRect();
    this.W = rect.width;
    this.H = rect.height;
    if (this.W === 0 || this.H === 0) return;
    this.canvas.width = rect.width * this.dpr;
    this.canvas.height = rect.height * this.dpr;
  }

/* ── ctxMix factory ────────────────────────────────────────────── */

  _ctxMix(hpScreen) {
    const cam = this.cam;
    return {
  // The value channel, taken whole.  A node that wants to rewrite what its
  // subtree reads overrides getValue here; nothing redefines it from scratch.
      ...Values,

      ctx: this.rawCtx,
      iterators: [],
      state: { index: 0, pass: 0, isHovered: false, isSelected: false },

  // Stable pane + camera info (never overwritten) — used by FrameNode screenMode
      getWH: () => ({
        W: this.W, H: this.H,
        Z: cam.zoom || 1,
        ox: cam.scrollX || 0,
        oy: cam.scrollY || 0,
      }),

      viewport: {
        x: cam.scrollX || 0, y: cam.scrollY || 0,
        w: this.W / (cam.zoom || 1), h: this.H / (cam.zoom || 1),
      },
      W: this.W,
      H: this.H,
      hitPoint: hpScreen || null,
      hitResult: null,
    };
  }

/* ── drawing ───────────────────────────────────────────────────── */

  draw() {
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => { this._raf = null; this.drawInRaf(); });
  }

  drawInRaf() {
    if (!this.W || !this.H) return;

// 1. Clear physical canvas
    this.rawCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.rawCtx.clearRect(0, 0, this.canvas.width, this.canvas.height);

// 2. Apply DPR base — PaneCameraNode multiplies zoom/scroll on top
    this.rawCtx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    /* Selection and hover live with the items themselves, reached through
       setValue, so nothing about them travels in params. */
    const ctxMix = this._ctxMix();
    sceneRegistry.walkPhase(ctxMix, 'layout', this.node, this.params);
    sceneRegistry.walkPhase(ctxMix, 'draw2d', this.node, this.params);
  }

/* ── hit-testing ───────────────────────────────────────────────── */

  hitTest(screenX, screenY) {
    const c = this._ctxMix({ x: screenX, y: screenY });
    sceneRegistry.walkPhase(c, 'hit_test', this.node, this.params);
    return c.hitResult;
  }

/* ── input listeners ───────────────────────────────────────────── */

  _listen() {
    const toL = e => {
      const r = this.canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top, ex: e.clientX, ey: e.clientY };
    };

// --- ZOOM ---
    this.canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const { x, y } = toL(e);
      const stripH = this.paneConfig.stockStripHeight || 0;
      if (stripH > 0 && y > this.H - stripH) return;
      const cam = this.cam;
      const oldZ = cam.zoom || 1;
      const newZ = Math.max(0.1, Math.min(10.0, oldZ * (e.deltaY > 0 ? 0.9 : 1.1)));
      const cx = cam.centerOrigin ? this.W / 2 : 0;
      const cy = cam.centerOrigin ? this.H / 2 : 0;
      cam.scrollX = (cam.scrollX || 0) + (x - cx) * (1 / oldZ - 1 / newZ);
      cam.scrollY = (cam.scrollY || 0) + (y - cy) * (1 / oldZ - 1 / newZ);
      cam.zoom = newZ;
      this.draw();
    }, { passive: false });

// --- MOUSE DOWN ---
    this.canvas.addEventListener('mousedown', e => {
      const { x, y, ex, ey } = toL(e);
      const stripH = this.paneConfig.stockStripHeight || 0;
      const overStrip = stripH > 0 && y > this.H - stripH;
      const hit = this.hitTest(x, y);

      // A node that can be dragged is selected singly; one that cannot —
      // a zone, a ring, a key — toggles, so a set can be built up.
      const access = hit ? Values.access(this._ctxMix(), hit, this.params) : null;

      /* Something draggable is selected singly; something only selectable —
         a ring, a key, a band — toggles, so a set can be built up. */
      const additive = e.shiftKey || e.metaKey || e.ctrlKey || (access && !access.draggable);

      if (!access) this.clearSelection();
      else if (!additive) { this.clearSelection(); access.setValue({ selected: true }); }
      else access.setValue({ selected: !access.getValue()?.selected });

      this.selectedHit = access?.getValue()?.selected ? hit : null;
      this.dragHit = hit;
      if (this.app?.selectNode) this.app.selectNode(this.selectedHit, this);

      if (!hit?.node && !overStrip) {
        this.isPanning = true;
        this.lastMouseX = e.clientX;
        this.lastMouseY = e.clientY;
        this.canvas.style.cursor = 'grabbing';
      }
      this.draw();
    });

// Selection lives with the items, so clearing it is a walk, not a set to empty.
    this.clearSelection = () => {
      const mix = this._ctxMix();
      sceneRegistry.walkPhase(mix, 'clear_selection', this.node, this.params);
      if (this.selectedHit) Values.access(mix, this.selectedHit, this.params).setValue({ selected: false });
      this.selectedHit = null;
    };

// --- MOUSE MOVE ---
    this.canvas.addEventListener('mousemove', e => {
      if (this.isPanning) {
        const cam = this.cam, z = cam.zoom || 1;
        cam.scrollX = (cam.scrollX || 0) - (e.clientX - this.lastMouseX) / z;
        cam.scrollY = (cam.scrollY || 0) - (e.clientY - this.lastMouseY) / z;
        this.lastMouseX = e.clientX;
        this.lastMouseY = e.clientY;
        this.draw();
        if (typeof hideTooltip !== 'undefined') hideTooltip();
        return;
      }

      const { x, y, ex, ey } = toL(e);

      if (this.dragHit) {
        if (this.dragHit.interactions?.applyDrag) {
      // Pass screen-local coords; PaneCameraNode's wrap converts
      // to the correct world space for whatever camera nesting exists.
          this.dragHit.interactions.applyDrag(x, y);
          this.draw();
        }
        return;
      }      

      const hit = this.hitTest(x, y);

      const mixNow = this._ctxMix();
      const prev = this.hoveredHit;
      if (prev && prev !== hit) Values.access(mixNow, prev, this.params).setValue({ hovered: false });

      const access = hit ? Values.access(mixNow, hit, this.params) : null;
      let changed = (prev == null) !== (hit == null);
      if (access) changed = access.setValue({ hovered: true }) || changed;
      this.hoveredHit = hit;
      if (changed) this.draw();

      const tip = access?.getTooltip();
      if (tip) showTooltip?.(ex, ey, { ...tip, selected: !!access.getValue()?.selected });
      else hideTooltip?.();

      this.canvas.style.cursor = access ? (access.draggable ? 'grab' : 'pointer') : 'default';
    });

// --- MOUSE UP ---

    this.canvas.addEventListener('mouseup', (e) => {
      if (this.dragHit) {
        if (this.dragHit.interactions?.endDrag) {
      // Detect if dropped over the stock-strip area
          const { y } = toL(e);
          const stripH = this.paneConfig.stockStripHeight || 0;
          const onStrip = stripH > 0 && y > this.H - stripH;
          this.dragHit.interactions.endDrag(onStrip);
        }
        this.dragHit = null;
        this.draw();
      }
      if (this.isPanning) {
        this.isPanning = false;
        this.canvas.style.cursor = this.hoveredHit ? 'pointer' : 'default';
      }
    });


// --- MOUSE LEAVE ---
    this.canvas.addEventListener('mouseleave', () => {
      if (this.hoveredHit) {
        Values.access(this._ctxMix(), this.hoveredHit, this.params).setValue({ hovered: false });
        this.hoveredHit = null;
        this.draw();
      }
      hideTooltip?.();
      if (this.dragHit) {
        if (this.dragHit.interactions?.endDrag) this.dragHit.interactions.endDrag(false);
        this.dragHit = null;
        this.draw();
      }
      this.isPanning = false;
      this.canvas.style.cursor = 'default';
    });
  }
}


/* ═══════════════════════════════════════════════════════════════════════════
DemoHarness3D — owns a 3D pane: init / re-attach, per-frame render,
resize, and control routing.

Extracted from the 3D branches previously scattered across
App.buildLayout, App.resize, and App.animate.
═══════════════════════════════════════════════════════════════════════════ */

//<< import { DemoHarness3D } from './demo-harness3-d.js';
//-- file: ./demo-harness3-d.js --
//>> export { DemoHarness3D };
class DemoHarness3D {
  constructor(div, paneConfig, app) {
    this.container = div;
    this.paneConfig = paneConfig;
    this.app = app;
    this.view = null;

    if (typeof paneConfig.init !== 'function') return;

    if (paneConfig._view) {
  // ── Re-attach an existing view (happens on layout rebuild) ──
      this.view = paneConfig._view;
      const title = div.querySelector('.pane-title-3d');
      div.insertBefore(this.view.renderer.domElement, title);
      if (this.view.ro) {
        this.view.ro.unobserve(this.view.container);
        this.view.ro.observe(div);
      }
      this.view.container = div;
    } else {
  // ── First-time init ──
      this.view = paneConfig.init(div);
      paneConfig._view = this.view;

  // Push initial control values through onControl
      if (this.view && paneConfig.onControl) {
        const initVals = {};
        (paneConfig.controls || []).forEach(c => { if (c.id) initVals[c.id] = c.value; });
        paneConfig.onControl(null, null, () => initVals, app);
      }
    }
  }

/* ── per-frame (called from App.animate) ───────────────────────── */

  animate() {
    const v = this.view;
    if (!v) return;
    v.controls.update();
    if (v.phyloNode) {
      v.phyloNode.value.group.rotation.z += 0.001;
      v.phyloNode.value.group.rotation.x = Math.sin(Date.now() * 0.0003) * 0.1;
    }
    v.renderer.render(v.scene, v.camera);
  }

/* ── resize (called from App.resize as a safety net;
    the ResizeObserver in make3DPane also fires) ──────────────── */

  resize() {
    const v = this.view;
    if (!v) return;
    const w = v.container.clientWidth, h = v.container.clientHeight;
    if (w > 0 && h > 0) {
      v.camera.aspect = w / h;
      v.camera.updateProjectionMatrix();
      v.renderer.setSize(w, h);
    }
  }

/* ── control routing (called by App.handleHudChange) ───────────── */

  applyControl(id, val, getValues) {
    if (this.paneConfig.onControl) {
      this.paneConfig.onControl(id, val, getValues, this.app);
    }
  }
}


//-- endfile --

//<< import { App } from './app.js';
//-- file: ./app.js --
//>> import { SYS } from './sys.js';
//>> import './organiser-model.js';   // self-registers the show/hide panel
//>> import { loadThree } from './three-boot.js';
//>> import { Values } from './values.js';
//>> import { Utils } from './utils.js';
//>> import { DemoHarness2D } from './demo-harness2-d.js';
//>> import { DemoHarness3D } from './demo-harness3-d.js';
//>> import { HudPanel } from './hud-panel.js';
//>> export { App };
/* ═══════════════════════════════════════════════════════════════════════════
App — the application shell.

Changes from original:
- this.views3D replaced by this.harnesses (holds both 2D and 3D).
- buildLayout creates DemoHarness2D / DemoHarness3D uniformly.
- resize / animate delegate to harnesses instead of inlining 3D logic.
- handleHudChange routes control changes through the active model's
 harness, so 2D controls now take effect (not just display).
═══════════════════════════════════════════════════════════════════════════ */
class App {
  constructor() {
    this.container = document.getElementById('container');
    this.paneEls = [];
    this.harnesses = [];
    this.hudState = {};

    SYS.MODELS.forEach((m, i) => {
      this.hudState['vis_' + i] = m.visible !== false;
      if (m.controls) {
        m.controls.forEach(c => {
          if (c.id && c.value !== undefined) this.hudState[c.id] = c.value;
        });
      }
    });

    this.activeModel = SYS.MODELS.find(m => (m.displayType || '2d') !== 'none' && m.visible !== false);
    this.buildHud();

    loadThree().then(() => {
      this.buildLayout();
      this.animate();
    });

    const handleResize = () => {
      if (this._resizeTimer) clearTimeout(this._resizeTimer);
      this._resizeTimer = setTimeout(() => this.resize(), 50);
    };
    new ResizeObserver(handleResize).observe(document.body);
    window.addEventListener('resize', handleResize);
  }

/* ── HUD ───────────────────────────────────────────────────────── */

  solo() {
    this._applyVisibility(
      SYS.MODELS.map(m => m === this.activeModel ?? 0),
      SYS.MODELS.map(m => m.visible !== false)
      );
  }

  unsolo() {
    this._applyVisibility(
      this._soloRestore ?? [], 
      null
      );
  }

  _applyVisibility(visibilities, saved) {
    SYS.MODELS.forEach((m, i) => this.hudState[`vis_${i}`] = m.visible = visibilities[i]);
    this._soloRestore = saved;
    this.buildHud();
    this.buildLayout();
  }

  buildHud() {
    let savedPosition = {
      top: parseInt(this?.hud?._root?.style?.top, 10) || 60,
      left: parseInt(this?.hud?._root?.style?.left, 10) || 12
    };
    this?.hud?.destroy?.();

    const controls = [];

    const dropdownModels = SYS.MODELS.filter(m => m.visible !== false);
    if (!dropdownModels.includes(this.activeModel) && dropdownModels.length > 0) {
      this.activeModel = dropdownModels[0];
    }

    if (dropdownModels.length > 0) {
      controls.push({ type: 'separator', label: 'Active Panel' });
      controls.push({
        type: 'select', id: 'activePanel', label: 'Controls For',
        options: dropdownModels.map(m => [
          String(SYS.MODELS.indexOf(m)),
          m.name?.split(/[.·]/)[0].trim() || 'Unnamed',
        ]),
        value: String(SYS.MODELS.indexOf(this.activeModel)),
      });
      controls.push(
      {
        type: 'button',
        label: this._soloRestore ? 'Unsolo' : 'Solo',
        action: () => this._soloRestore ? this.unsolo() : this.solo()
      }
      );

      controls.push(...(
        this.activeModel?.controls ?? 
        this.activeModel?.getControls?.(this) ?? 
        [])
      );
    }

    this.hud = new HudPanel({
      title: 'Zoned Elements',
      controls,
      position: savedPosition, 
      onChange: (id, val) => this.handleHudChange(id, val),
    });

    if (!this._selPanel) {
      this._selPanel = document.createElement('div');
      this._selPanel.className = 'hud-panel';
      this._selPanel.style.cssText = 'position:absolute; top:12px; right:12px; display:none; min-width:220px;';
      document.body.appendChild(this._selPanel);
    }
  }

/* ── selection ──────────────────────────────────────────────────── */

  selectNode(hit, harness) {
    this.selectedHit = hit;
    this.selectedNode = hit?.node ?? null;
    this.activeHarness = harness;
    this.updateSelectedPanel();
  }

  removeSelectedNode() {
    const node = this.selectedNode;
    if (!node) return;

    let params = {};
    const removeFrom = (parent) => {
      if (!parent.subtree) return false;
      const idx = parent.subtree.indexOf(node);
      if (idx >= 0) { Utils.removeChild(parent, node, params); return true; }
      for (const child of parent.subtree) {
        if (removeFrom(child)) return true;
      }
      return false;
    };

// Search the harness the node was selected from first,
// then fall back to all 2D non-zoned harnesses
    const candidates = this.activeHarness
    ? [this.activeHarness, ...this.harnesses.filter(h => h !== this.activeHarness)]
    : this.harnesses;

    for (const h of candidates) {
      if (!h.node)
        continue;
      params = h.params || {};
      if (removeFrom(h.node)) {
        this.selectedNode = null;
        this.selectedHit = null;
        this.activeHarness = null;
        this.updateSelectedPanel();
        h.selectedHit = null;
        h.hoveredHit = null;
        h.draw();
        return;
      }
    }
  }

  updateSelectedPanel() {
    const el = this._selPanel, node = this.selectedNode;
    const cls = node ? Utils.classOfNode(node) : null;
    const mixNow = this.activeHarness?._ctxMix();
    const shown = this.selectedHit && mixNow
      ? { ...node, value: Values.access(mixNow, this.selectedHit, this.activeHarness.params).getValue() }
      : node;
    const fields = cls?.meta?.editableFields?.(shown);
    if (!node ) { el.style.display = 'none'; return; }
//  if (!node || !fields || fields.length === 0) { el.style.display = 'none'; return; }
    el.style.display = 'block'; el.innerHTML = '';
    const header = document.createElement('h3');
    header.textContent = `SELECTED ${node.type.toUpperCase()}`;
    el.appendChild(header);

// Remove button
    const rmBtn = document.createElement('button');
    rmBtn.textContent = '✕ Remove Node';
    rmBtn.style.cssText = 'width:100%; margin:6px 0 4px; padding:5px 8px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.06); color:#999; border-radius:4px; letter-spacing:0.03em; transition:background 0.15s;';
    rmBtn.addEventListener('mouseenter', () => rmBtn.style.background = 'rgba(255,255,255,0.12)');
    rmBtn.addEventListener('mouseleave', () => rmBtn.style.background = 'rgba(255,255,255,0.06)');
    rmBtn.addEventListener('click', () => this.removeSelectedNode());
    el.appendChild(rmBtn);

    for (const f of fields ?? []) {
      const row = document.createElement('div'); row.className = 'sel-row';
      const span = document.createElement('span'); span.textContent = f.label; row.appendChild(span);
      const inp = document.createElement('input'); inp.type = f.type; inp.value = f.value;
      inp.addEventListener('input', () => {
        const v = f.type === 'number' ? Number(inp.value) : inp.value;
        // Through the interaction, so editing one item of a flyweight works
        // exactly as editing an ordinary node does.
        const mix = this.activeHarness?._ctxMix();
        const access = this.selectedHit && mix
          ? Values.access(mix, this.selectedHit, this.activeHarness.params) : null;
        if (access) access.setValue({ [f.key]: v });
        else node.value[f.key] = v;
        if (this.activeHarness) this.activeHarness.draw();
      });
      row.appendChild(inp); el.appendChild(row);
    }
  }


/* ── control dispatch ──────────────────────────────────────────── */

  handleHudChange(id, val) {
    this.hudState[id] = val;

    if (id === 'activePanel') {
      this.activeModel = SYS.MODELS[parseInt(val, 10)];
      this.buildHud();
    } else if (id.startsWith('vis_')) {
      const mIdx = parseInt(id.split('_')[1], 10);
      if (SYS.MODELS[mIdx]) SYS.MODELS[mIdx].visible = val;
    } else {
  // Route to the active model's harness — works for both 2D and 3D
      const harness = this.harnesses.find(h => h.paneConfig === this.activeModel);
      if (harness) {
        harness.applyControl(id, val, () => this.hudState);
      }
    }
  }

/* ── grid layout ───────────────────────────────────────────────── */

  bestGrid(n) {
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contW = Math.max(1, window.innerWidth);
    const contH = Math.max(1, window.innerHeight - headerH - 1);
    let bestCols = 1, bestScore = Infinity;
    for (let c = 1; c <= n; c++) {
      const r = Math.ceil(n / c), aspect = (contW / c) / (contH / r);
      const score = Math.abs(Math.log(aspect)) + (n - c * r !== 0 ? 0.3 : 0);
      if (score < bestScore) { bestScore = score; bestCols = c; }
    }
    return { cols: bestCols, rows: Math.ceil(n / bestCols) };
  }

/* ── build panes ───────────────────────────────────────────────── */

  buildLayout() {
    this.container.innerHTML = '';
    this.paneEls.length = 0;
    this.harnesses.length = 0;

    const visibleModels = SYS.MODELS.filter(p => (p.visible !== false) && (p.displayType || '2d') !== 'none');
    const N = visibleModels.length;
    document.getElementById('pane-count').textContent = `${N} of ${SYS.MODELS.length - 1} panels`;

    if (N === 0) { this.container.style.background = '#111210'; return; }

    const grid = this.bestGrid(N);
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contH = Math.max(1, window.innerHeight - headerH - 1);

    for (const pane of visibleModels) {
      const i = SYS.MODELS.indexOf(pane);
      const type = pane.displayType || '2d';
      const div = document.createElement('div');
      div.className = 'pane' + (type === '3d' ? ' pane-3d' : '');
      div.style.flexBasis = `calc(${100 / grid.cols}% - 1px)`;
      div.style.height = `${contH / grid.rows}px`;
      div.style.minWidth = '0';
      if (pane.background) div.style.background = pane.background;
      div.dataset.paneIndex = i;

      /* Clicking a pane's title makes it the active panel and solos it;
         clicking again restores the others. */
      const soloOnClick = (el) => {
        el.title = 'Click to solo this panel';
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (this._soloRestore) { this.unsolo(); return; }
          this.activeModel = pane;
          this.hudState.activePanel = String(i);
          this.solo();
        });
      };

      if (type === '2d') {
        const label = document.createElement('div');
        label.className = 'label'; label.textContent = pane.name;
        soloOnClick(label);
        div.appendChild(label);
        const canvas = document.createElement('canvas');
        div.appendChild(canvas);
        this.container.appendChild(div);

        if (pane.sceneRoot) {
          const harness = new DemoHarness2D(canvas, pane, this);
          canvas.harness = harness;
          this.harnesses.push(harness);
        }
      } else if (type === '3d') {
        const title = document.createElement('div');
        title.className = 'pane-title-3d'; title.textContent = pane.name;
        soloOnClick(title);
        div.appendChild(title);
        this.container.appendChild(div);

        const harness = new DemoHarness3D(div, pane, this);
        if (harness.view) this.harnesses.push(harness);
      }

      this.paneEls[i] = div;
    }
  }

/* ── resize ────────────────────────────────────────────────────── */

  resize() {
    const visibleModels = SYS.MODELS.filter(p => p.visible && (p.displayType || '2d') !== 'none');
    const N = visibleModels.length;
    if (!N) return;

    const grid = this.bestGrid(N);
    const headerEl = document.querySelector('header');
    const headerH = headerEl ? headerEl.getBoundingClientRect().height : 40;
    const contH = Math.max(1, window.innerHeight - headerH - 1);

// Adjust div sizes — individual harness ResizeObservers handle the rest
    for (const pane of visibleModels) {
      const i = SYS.MODELS.indexOf(pane);
      const el = this.paneEls[i];
      if (!el)
        continue;
      el.style.flexBasis = `calc(${100 / grid.cols}% - 1px)`;
      el.style.height = `${contH / grid.rows}px`;
    }
  }

/* ── render loop ───────────────────────────────────────────────── */

  animate() {
    requestAnimationFrame(() => this.animate());
    for (const h of this.harnesses) {
      if (h.animate) h.animate();
    }
  }
}

new App();

</script>
