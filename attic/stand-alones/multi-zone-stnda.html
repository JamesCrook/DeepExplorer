/* ─────────────────────────────────────────────────────────────────────────────
Chart-specific nodes — each reads dimensions from ctxMix.getWH()
──────────────────────────────────────────────────────────────────────────── */
const AXIS_DEFAULTS = Object.freeze({
  axisColor: '#504838', axisWidth: 1.5, tickLength: 5, tickWidth: 1,
  gridColor: 'rgba(255,255,255,0.04)', gridWidth: 0.5, showGrid: true,
});

class AxisNode {
  static draw2d(ctxMix, node, params) {
    const v = node.value || {}, p = { ...AXIS_DEFAULTS, ...params };
    const { W:cw, H:ch } = ctxMix.getWH();
    const left = -cw / 2, right = cw / 2, top = -ch / 2, bottom = ch / 2;
    const ctx = ctxMix.ctx, tL = p.tickLength || 5;

    ctx.save();
    const tempMin = v.tempMin ?? 0, tempMax = v.tempMax ?? 30, tempStep = v.tempStep ?? 5;
    for (let t = tempMin; t <= tempMax; t += tempStep) {
      const y = bottom - ((t - tempMin) / (tempMax - tempMin)) * ch;
      if (p.showGrid && t > tempMin) {
        ctx.strokeStyle = p.gridColor; ctx.lineWidth = p.gridWidth || 0.5;
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
      }
      ctx.strokeStyle = p.axisColor; ctx.lineWidth = p.tickWidth || 1;
      ctx.beginPath(); ctx.moveTo(left - tL, y); ctx.lineTo(left, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(right, y); ctx.lineTo(right + tL, y); ctx.stroke();
    }

    const months = v.months || 12, colW = cw / months;
    for (let i = 0; i <= months; i++) {
      const x = left + i * colW;
      ctx.strokeStyle = p.axisColor; ctx.lineWidth = p.tickWidth || 1;
      ctx.beginPath(); ctx.moveTo(x, bottom); ctx.lineTo(x, bottom + tL); ctx.stroke();
      if (i > 0 && i < months && p.showGrid) {
        ctx.strokeStyle = p.gridColor; ctx.lineWidth = p.gridWidth || 0.5;
        ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
      }
    }

    ctx.strokeStyle = p.axisColor; ctx.lineWidth = p.axisWidth || 1.5;
    ctx.beginPath();
    ctx.moveTo(left, top); ctx.lineTo(left, bottom);
    ctx.moveTo(left, bottom); ctx.lineTo(right, bottom);
    ctx.moveTo(right, top); ctx.lineTo(right, bottom);
    ctx.stroke();
    ctx.restore();
  }
}
SYS.NODE_CLASSES.push({ name: 'axis-node', cls: AxisNode });;
//-- endfile --

//<< import { BarElementNode } from './bar-element-node.js';
//-- file: ./bar-element-node.js --
//>> import { sceneRegistry } from './sys.js';
//>> export { BarElementNode };

const BAR_DEFAULTS = Object.freeze({
  barFill: '#4a90c4', barFillHi: '#6ab0e8', barOpacity: 0.72, barGap: 0.28,
  barRadius: 3, barStroke: 'rgba(90,160,220,0.25)', barStrokeW: 1,
});

class BarElementNode {
  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    if (!v) return;

    const p = { ...BAR_DEFAULTS, ...params };
    const ctx = ctxMix.ctx;
    const br = Math.min(p.barRadius || 0, v.bw / 2);

    ctx.save();
    ctx.globalAlpha *= (p.barOpacity || 0.72);
    ctx.fillStyle = v.isHi ? (p.barFillHi || p.barFill) : p.barFill;

    if (br > 0 && v.bh > br) {
      ctx.beginPath(); ctx.moveTo(v.bx, v.bottom); ctx.lineTo(v.bx, v.by + br);
      ctx.arcTo(v.bx, v.by, v.bx + br, v.by, br); ctx.lineTo(v.bx + v.bw - br, v.by);
      ctx.arcTo(v.bx + v.bw, v.by, v.bx + v.bw, v.by + br, br); ctx.lineTo(v.bx + v.bw, v.bottom);
      ctx.closePath(); ctx.fill();
    } else { 
      ctx.fillRect(v.bx, v.by, v.bw, v.bh); 
    }

    if (p.barStroke) {
      ctx.strokeStyle = p.barStroke; ctx.lineWidth = p.barStrokeW || 1;
      if (br > 0 && v.bh > br) ctx.stroke();
    }
    ctx.restore();
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt) return;
    const v = ctxMix.getValue(ctxMix, node, params);
    if (!v) return;

    if (pt.x >= v.bx && pt.x <= v.bx + v.bw && pt.y >= v.by && pt.y <= v.bottom) {
      ctxMix.hitResult = { node: v.originalNode, interactions: {} };
    }
  }
}
SYS.NODE_CLASSES.push({ name: 'bar-element', cls: BarElementNode });;
//-- endfile --

//<< import { LineDotNode } from './line-dot-node.js';
//-- file: ./line-dot-node.js --
//>> import { sceneRegistry } from './sys.js';
//>> export { LineDotNode };

const LINE_DEFAULTS = Object.freeze({
  lineColor: '#e05040', lineColorHi: '#ff7860', lineWidth: 2.5, dotRadius: 4.5,
  dotFill: '#e05040', dotFillHi: '#ff7860', dotStroke: '#1a1a16', dotStrokeWidth: 2,
  hitRadius: 12, smooth: 0.22,
});

class LineDotNode {
  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    if (!v) return;

    const p = { ...LINE_DEFAULTS, ...params };
    const ctx = ctxMix.ctx;

    ctx.beginPath(); ctx.arc(v.x, v.y, p.dotRadius || 4.5, 0, Math.PI * 2);
    ctx.fillStyle = v.isHi ? (p.dotFillHi || p.dotFill) : p.dotFill; 
    ctx.fill();

    ctx.strokeStyle = p.dotStroke; ctx.lineWidth = p.dotStrokeWidth || 2; 
    ctx.stroke();
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;
    if (!pt) return;
    const v = ctxMix.getValue(ctxMix, node, params);
    if (!v) return;

    const p = { ...LINE_DEFAULTS, ...params };
    const hr = p.hitRadius || 12;
    const dx = pt.x - v.x, dy = pt.y - v.y;

    if (dx * dx + dy * dy <= hr * hr) { 
      ctxMix.hitResult = { node: v.originalNode, interactions: {} }; 
    }
  }
}
SYS.NODE_CLASSES.push({ name: 'line-dot-element', cls: LineDotNode });;

//<< import { LineChartNode } from './line-chart-node.js';
//-- file: ./line-chart-node.js --
//>> import { sceneRegistry } from './sys.js';
//>> export { LineChartNode };
class LineChartNode {
  static _points(v, ctxMix) {
    const data = v.data || [], n = data.length, tMin = v.tempMin ?? 0, tMax = v.tempMax ?? 30;
    const { W:cw, H:ch } = ctxMix.getWH();
    const left = -cw / 2, bottom = ch / 2, colW = cw / n, pts = [];
    for (let i = 0; i < n; i++) pts.push({ x: left + (i + 0.5) * colW, y: bottom - ((data[i] - tMin) / (tMax - tMin)) * ch });
      return pts;
  }

  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params) || {};
    const p = { ...LINE_DEFAULTS, ...params }, pts = LineChartNode._points(v, ctxMix);
    if (!pts.length) return;

    const hi = !!(v.selected || v.hovered), sm = p.smooth || 0;
    const ctx = ctxMix.ctx;
    ctx.save(); ctx.strokeStyle = hi ? (p.lineColorHi || p.lineColor) : p.lineColor;
    ctx.lineWidth = p.lineWidth || 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();

    if (sm > 0 && pts.length > 2) {
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
        const cp1x = p1.x + (p2.x - p0.x) * sm, cp1y = p1.y + (p2.y - p0.y) * sm;
        const cp2x = p2.x - (p3.x - p1.x) * sm, cp2y = p2.y - (p3.y - p1.y) * sm;
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
      }
    } else {
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    }
  ctx.stroke();
  ctx.restore();
}
}
SYS.NODE_CLASSES.push({ name: 'line-chart-node', cls: LineChartNode });;

/* ─────────────────────────────────────────────────────────────────────────────
Value functions — read frame dimensions from ctxMix.getWH()
──────────────────────────────────────────────────────────────────────────── */

const barValueFn = (ctxMix, fwParent, params, index) => {
  const v = fwParent.value;
  const data = v.data || [];
  const val = data[index] || 0;
  const p = { ...BAR_DEFAULTS, ...params };

  const { W:cw, H:ch } = ctxMix.getWH();
  const left = -cw / 2;
  const bottom = ch / 2;

  const rMax = v.rainMax || 120;
  const n = data.length;
  const colW = cw / n;
  const gap = colW * (p.barGap || 0);

  const bw = colW - gap;
  const bh = (val / rMax) * ch;
  const bx = left + index * colW + gap / 2;
  const by = bottom - bh;

  /* A bar redirects its hit to the series node, so it is the series that
     carries the affordance and every bar reads it from there. */
  const series = v.originalNode || fwParent;
  const sv = ctxMix.getValue(ctxMix, series, params) || {};
  const isHi = !!(sv.selected || sv.hovered);

  return { bx, by, bw, bh, bottom, isHi, originalNode: series };
};

const lineDotValueFn = (ctxMix, fwParent, params, index) => {
  const v = fwParent.value;
  const data = v.data || [];
  const val = data[index] || 0;

  const { W:cw, H:ch } = ctxMix.getWH();
  const left = -cw / 2;
  const bottom = ch / 2;

  const tMin = v.tempMin ?? 0;
  const tMax = v.tempMax ?? 30;
  const n = data.length;
  const colW = cw / n;

  const x = left + (index + 0.5) * colW;
  const y = bottom - ((val - tMin) / (tMax - tMin)) * ch;

  /* A dot redirects its hit to the line it belongs to; the array itself may
     also be selected, and either indicates the whole series. */
  const series = v.originalNode || fwParent;
  const sv  = ctxMix.getValue(ctxMix, series, params) || {};
  const own = ctxMix.getValue(ctxMix, fwParent, params) || {};
  const isHi = !!(sv.selected || sv.hovered || own.selected || own.hovered);

  return { x, y, isHi, originalNode: series };
};

/* ─────────────────────────────────────────────────────────────────────────────
Camera — screen/world conversion and the canvas transform for a 2D pane.

Distinct from pane-camera-node, which is the scene-graph node that carries pan
and zoom as node value.  This is the plain object DemoHarness2D drives.
──────────────────────────────────────────────────────────────────────────── */

class Camera {
  constructor() { this.ox = 0; this.oy = 0; this.z = 1; }
  toWorld(sx, sy)  { return { x: sx / this.z + this.ox, y: sy / this.z + this.oy }; }
  toScreen(wx, wy) { return { x: (wx - this.ox) * this.z, y: (wy - this.oy) * this.z }; }
  apply(ctx) { ctx.setTransform(this.z, 0, 0, this.z, -this.ox * this.z, -this.oy * this.z); }
  reset(ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); }
  pan(dsx, dsy) { this.ox -= dsx / this.z; this.oy -= dsy / this.z; }
  zoomAt(sx, sy, factor) {
    const wp = this.toWorld(sx, sy);
    this.z = Math.max(0.15, Math.min(5, this.z * factor));
    this.ox = wp.x - sx / this.z; this.oy = wp.y - sy / this.z;
  }
}

//<< import { THREE, OrbitControls, loadThree, make3DPane } from './three-boot.js';
//-- file: ./three-boot.js --
//>> export { THREE, loadThree, make3DPane };

/* ─────────────────────────────────────────────────────────────────────────────
three-boot — the one place that knows Three.js exists.

THREE is a live binding: undefined until loadThree() resolves, and shared by
every 3D node thereafter.  Nodes import the binding, not a snapshot, so a
nugget may be read (and typed against) without Three.js being present at all.
A build with no 3D model drops this nugget and never touches the importmap.
──────────────────────────────────────────────────────────────────────────── */

let THREE, OrbitControls;
async function loadThree() {
  if (THREE) return;
  try {
    THREE = await import('three');
    OrbitControls = (await import('three/addons/controls/OrbitControls.js')).OrbitControls;
  } catch(e) { console.warn('Three.js failed to load.'); }
}

function make3DPane(container) {
  if (!THREE) return null;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, container.clientWidth / Math.max(1, container.clientHeight), 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const view = { scene, camera, renderer, controls, container };

  view.ro = new ResizeObserver(() => {
    if (view.container.clientWidth > 0 && view.container.clientHeight > 0) {
      view.camera.aspect = view.container.clientWidth / view.container.clientHeight;
      view.camera.updateProjectionMatrix();
      view.renderer.setSize(view.container.clientWidth, view.container.clientHeight);
    }
  });
  view.ro.observe(container);

  return view;
}
//-- endfile --


//<< import { HudPanel } from './hud-panel.js';
//-- file: ./hud-panel.js --
//>> export { HudPanel };

/* ─────────────────────────────────────────────────────────────────────────────
HudPanel — standalone floating panel using sceneRegistry.walkPhase

Compatible with OmniWidget conventions so hud-* node types work in either
system. The ctxMix shape matches what OmniWidgets expect:

  parentEl       current DOM parent (pushed/popped by containers)
  parentStack    push/pop array
  params         live params object (built from controls)
  sectionParams  null (no per-section params in HudPanelLite)
  setParam       (id, val) => write to params
  render         () => trigger redraw
  onParamChange  (id, val) => notification callback
  clearActivePreset  () => clear preset highlights
  panel          null (no OmniControlPanel)

Node conventions (same as OmniWidget):
  node.value     serialisable data (id, label, min, max, step, options, …)
  node.inst      non-serialisable (action callbacks)
  node.subtree   child nodes

Drop this file into an all-in-one stnda build by pasting after the
sceneRegistry definition. No imports needed.
──────────────────────────────────────────────────────────────────────────── */


// ═══════════════════════════════════════════════════════════════
//  NODE CLASSES — compatible with both HudPane and OmniWidget
// ═══════════════════════════════════════════════════════════════

class HudPanelNode {

  static before_mount(ctxMix, node, params) {
    const v = node.value || {};

    const root = document.createElement('div');
    root.className = 'hud-panel';
    root.style.top  = (v.position?.top  ?? 60) + 'px';
    root.style.left = (v.position?.left ?? 12) + 'px';

    const header = document.createElement('h3');
    header.innerHTML = `::: &nbsp; ${v.title || 'Controls'}`;
    root.appendChild(header);
    HudPanelNode._makeDraggable(root, header);

    node._el = root;

    ctxMix.parentStack.push(ctxMix.parentEl);
    ctxMix.parentEl = root;
  }

  static after_mount(ctxMix, node, params) {
    const container = ctxMix.parentStack.pop();
    container.appendChild(node._el);
    ctxMix.parentEl = container;
  }

  static _makeDraggable(root, handle) {
    let dragging = false, sx, sy, sl, st;
    handle.addEventListener('mousedown', e => {
      dragging = true; handle.style.cursor = 'grabbing';
      sx = e.clientX; sy = e.clientY;
      const r = root.getBoundingClientRect();
      sl = r.left; st = r.top;
      root.style.right = 'auto';
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      root.style.left = (sl + e.clientX - sx) + 'px';
      root.style.top  = (st + e.clientY - sy) + 'px';
    });
    window.addEventListener('mouseup', () => {
      if (dragging) { dragging = false; handle.style.cursor = 'grab'; }

}


class HudSliderNode {
  static mount(ctxMix, node, params) {
    const v = node.value || {};
    const { id, label, min = 0, max = 1, step = 0.01 } = v;
    const initVal = params[id] ?? v.value ?? min;

    // Capture params ref for closure safety (see OmniWidget writeParam pattern)
    const row = document.createElement('label');
    const span = document.createElement('span');
    span.textContent = label;
    row.appendChild(span);

    const input = document.createElement('input');
    Object.assign(input, { type: 'range', min, max, step, value: initVal });
    row.appendChild(input);

    const val = document.createElement('span');
    val.className = 'val';
    val.textContent = parseFloat(initVal).toFixed(step % 1 === 0 ? 0 : 2);
    row.appendChild(val);

    input.addEventListener('input', () => {
      const num = parseFloat(input.value);
      val.textContent = num.toFixed(step % 1 === 0 ? 0 : 2);
      ctxMix.setParam(id, num);
      ctxMix.onParamChange(id, num);
      ctxMix.render();
    });

    if (id) { input.id = id; val.id = `${id}-val`; }
    ctxMix.parentEl.appendChild(row);
  }
}

class HudCheckboxNode {

class HudSelectNode {
  static mount(ctxMix, node, params) {
    const v = node.value || {};
    const { id, label, options = [] } = v;
    const initVal = params[id] ?? v.value;

    const row = document.createElement('label');
    const span = document.createElement('span');
    span.textContent = label;
    row.appendChild(span);

    const select = document.createElement('select');
    for (const opt of options) {

      option.textContent = opt[1];
      if (opt[0] === String(initVal)) option.selected = true;

    select.addEventListener('change', () => {
      ctxMix.setParam(id, select.value);
      ctxMix.onParamChange(id, select.value);
      ctxMix.render();

    if (id) select.id = id;
    ctxMix.parentEl.appendChild(row);
  }

  button:         'hud-button',
  checkbox:       'hud-checkbox',

class HudPanel {

  /**
   * @param {Object}   opts
   * @param {string}   opts.title       — panel heading
   * @param {Element}  opts.container   — DOM parent for the floating panel
   * @param {Array}    opts.controls    — control definitions
   * @param {Function} opts.onChange     — (id, val) notification
   * @param {Function} [opts.onRender]  — () called after every param change
   * @param {Object}   [opts.position]  — { top, left }
   * @param {Object}   [opts.params]    — reuse an existing params object
   */
  constructor({
    title     = 'Controls',
    container = document.body,
    controls  = [],
    onChange,
    onRender,
    position  = { top: 60, left: 12 },
    params,
  } = {}) {
    this._onChange = onChange || (() => {});
    this._onRender = onRender || (() => {});

    HudPanel._injectStyles();

    // ── Build params from controls (or reuse provided) ──
    this.params = params || {};
    if (!params) {
      for (const c of controls) {
        if (c.id && c.value !== undefined) {
          this.params[c.id] = c.value;
        }
      }
    }

    // ── Coerce controls into AST ────────────────────────
    const children = controls.map(c => {
      const type = _HUD_TYPE_MAP[c.type] || 'hud-slider';
      // Separate serialisable from non-serialisable
      const { action, ...rest } = c;
      return {
        type,
        value:   rest,
        inst:    action ? { action } : {},
        subtree: [],
      };
    });

    const root = {
      type:    'hud-panel',
      value:   { title, position },
      subtree: children,
    };

    // ── Minimal WidgetContext-compatible ctxMix ──────────
    const self = this;

    const ctxMix = {
      parentEl:       container,
      parentStack:    [],
      iterators:      [],
      flyweight:      {},

      setParam(id, val) {
        self.params[id] = val;
      },
      render() {
        self._onRender();
      },
      onParamChange(id, val) {
        self._onChange(id, val);
      },
      clearActivePreset() {
        // Future: clear preset button highlights
      },
      closeMenu() {},
    };

    // ── Walk ─────────────────────────────────────────────
    sceneRegistry.runPhases(ctxMix, root, this.params, ['mount']);

    // ── Collect results ──────────────────────────────────
    this._root = root._el;
    this._ast  = root;  // retained for future update walks
  }

  destroy() {
    if (this._root?.parentNode) {
      this._root.parentNode.removeChild(this._root);
    }
  }

  /** Update a control's DOM to reflect a new value (e.g. from a preset). */
  updateControl(id, value) {
    this.params[id] = value;
    const input = document.getElementById(id);
    if (input) {
      if (input.type === 'checkbox') input.checked = !!value;
      else input.value = value;
    }
    const valEl = document.getElementById(`${id}-val`);
    if (valEl) {
      valEl.textContent = typeof value === 'number'
        ? value.toFixed(value % 1 === 0 ? 0 : 2) : String(value);
    }
  }

  /** Bulk update from a preset snapshot. */
  applyPreset(preset) {
    for (const [id, value] of Object.entries(preset)) {
      this.updateControl(id, value);
    }
  }

  static _injected = false;

  static _injectStyles() {
    if (HudPanel._injected) return;

    const s = document.createElement('style');
    s.id = 'hud-panel-css';
    s.textContent = `
  .hud-panel { position: absolute; background: rgba(18, 18, 22, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 14px 18px; color: #ddd; font: 11px/1.6 system-ui, sans-serif; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 1000; min-width: 260px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); user-select: none; max-height: calc(100vh - 40px); overflow-y: auto; }

  .hud-panel input[type=color]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; }
  .hud-panel select { flex: 1; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 4px; border-radius: 4px; font-size: 10px; outline: none; cursor: pointer; }
  .hud-panel .toggle-switch { position: relative; width: 28px; height: 16px; display: inline-block; flex-shrink: 0; }

  .hud-btn { display: block; width: 100%; margin: 4px 0; padding: 6px 0; background: rgba(0,0,0,0.4); color: #ccc; font-size: 11px; font-family: system-ui, sans-serif; text-align: center; border: 1px solid rgba(255,255,255,0.12); border-radius: 5px; cursor: pointer; transition: background .15s, border-color .15s; }

    `;

  static update3d(ctxMix, node, params) {

    if (!v.group) return;

    const radStart = -((params.wedgeStart??0)*Math.PI)/180;
    const rad1 = radStart - rotRad;
    v.clipPlane1.normal.set(Math.cos(rad1), 0, Math.sin(rad1));
    v.plane1.rotation.y = -radStart + Math.PI/2;
    const radEnd = radStart + Math.PI - ((params.wedgeAngle??90)*Math.PI)/180;
    const rad2 = radEnd - rotRad;
    v.clipPlane2.normal.set(Math.cos(rad2), 0, Math.sin(rad2));

      v.group.add(v.core);

//>> import { BondRenderer } from './bond-renderer.js';

class MolamBondNode {
  static build3d(ctxMix, node, params) {
    if (node.value.group) return;
    const v = node.value;
    v.group = new THREE.Group();
    const shim = { add: (obj) => v.group.add(obj), remove: (obj) => v.group.remove(obj) };
    v.renderer = new BondRenderer(THREE, shim);
    if (v._pendingData) {
      const { atoms, scale, chainColorMap } = v._pendingData;
      v._pendingData = null;
      v.renderer.detectAndSetBonds(atoms, scale, chainColorMap);
    }
  }
  static setData(node, atoms, scale, chainColorMap) {
    if (node.value.renderer) node.value.renderer.detectAndSetBonds(atoms, scale, chainColorMap);
    else node.value._pendingData = { atoms, scale, chainColorMap };
  }
  static update3d(ctxMix, node, params) {
    const v = node.value;
    if (!v.renderer) return;
    v.renderer.params = params;
    if (params.bondRadius !== undefined) v.renderer.setRadius(params.bondRadius);
    v.renderer.updateAllBondInstances();
    if (params.bondHalfColor !== undefined) v.renderer.setHalfColor(params.bondHalfColor);
    if (params.bondLightness !== undefined) v.renderer.setbondLightness(params.bondLightness);
    if (params.bondRingPink !== undefined) v.renderer.setRingPink(params.bondRingPink);
    v.renderer.setOpacity(params.bondOpacity ?? 1);
    v.renderer.setAtomRange(params.atomRangeStart ?? 0, params.atomRangeEnd ?? 100);
    v.renderer.setFade(params.sidechainFade || 0, params.referenceAxis || null);
  }
}

//<< import { PhyloNode } from './phylo-node.js';
//-- file: ./phylo-node.js --
//>> import { sceneRegistry } from './sys.js';
//>> import { THREE } from './three-boot.js';
//>> export { PhyloNode };
class PhyloNode {
  static build3d(ctxMix, node, params) {
    if (node.value.group) return;
    const v = node.value;
    v.group = new THREE.Group();
    v.MAX_INSTANCES = 200000;
    v.dummy = new THREE.Object3D();
    v.leafDummy = new THREE.Object3D();
    const g = new THREE.PlaneGeometry(1, 1);
    const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
    const gc = cv.getContext('2d');
    const gr = gc.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,'rgba(255,255,255,1)'); 
    gr.addColorStop(0.2,'rgba(255,255,255,0.8)');
    gr.addColorStop(0.5,'rgba(255,255,255,0.2)'); 
    gr.addColorStop(1,'rgba(255,255,255,0)');
    gc.fillStyle = gr; 
    gc.fillRect(0,0,64,64);
    const m = new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide});
    v.instancedMesh = new THREE.InstancedMesh(g, m, v.MAX_INSTANCES);
    v.group.add(v.instancedMesh);
    PhyloNode.update3d(ctxMix, node, params);
  }
  static update3d(ctxMix, node, params) {
    const v = node.value;
    if (!v.group || !params || !params.levels) return;
    let sd = [];
    const rm = new THREE.Matrix4();
    const rec = (depth, pm, ch) => {
      const lp = params.levels[depth];
      for (let n=1; n<=lp.count; n++) {
        let t = lp.count > 1 ? (n-1)/(lp.count-1) : 0;
        let theta = n * (lp.angle * Math.PI/180);
        let rl = lp.initialRadius*(1-t) + lp.finalRadius*t;
        let mx = Math.max(lp.initialRadius, lp.finalRadius);
        let ref = mx>0 ? mx : 5;
        let r = rl + (Math.sin(t*Math.PI)*lp.bulge*(ref*0.5));
        r = Math.max(0, r);
        v.dummy.position.set(r*Math.cos(theta), r*Math.sin(theta), t*lp.height);
        v.dummy.rotation.set(0,0,theta);
        v.dummy.rotateY(lp.tilt*Math.PI/180);
        v.dummy.updateMatrix();
        const wm = new THREE.Matrix4().multiplyMatrices(pm, v.dummy.matrix);
        let bh = ch + (lp.hueShift*t);
        bh = ((bh%1)+1)%1;
        if (depth < params.levels.length-1) rec(depth+1, wm, bh);
        else sd.push({matrix:wm.clone(), color:new THREE.Color().setHSL(bh, 0.85, 0.5)});
      }
    };
    rec(0, rm, params.baseHue);
    const ic = Math.min(sd.length, v.MAX_INSTANCES);
    v.instancedMesh.count = ic;
    for (let i=0; i<ic; i++) {
      v.leafDummy.position.setFromMatrixPosition(sd[i].matrix);
      v.leafDummy.quaternion.setFromRotationMatrix(sd[i].matrix);
      v.leafDummy.scale.set(params.splatSize*params.splatLength, params.splatSize*params.splatWidth, 1);
      v.leafDummy.updateMatrix();
      v.instancedMesh.setMatrixAt(i, v.leafDummy.matrix);
      v.instancedMesh.setColorAt(i, sd[i].color);
    }
    v.instancedMesh.instanceMatrix.needsUpdate = true;
    if (v.instancedMesh.instanceColor) v.instancedMesh.instanceColor.needsUpdate = true;
  }
}
SYS.NODE_CLASSES.push({ name: 'phylo-node', cls: PhyloNode });;

const STAIN_COLORS = { gneg:'#E8E0D0', gpos25:'#B0A890', gpos50:'#808068', gpos75:'#505040', gpos100:'#282820', acen:'#B84430', gvar:'#A0A090', stalk:'#707060' };

function chromosomePath(ctx, cx, topY, botY, cenY, armW, cenW, capR) {
  ctx.beginPath(); ctx.moveTo(cx-armW, topY+capR);
  ctx.quadraticCurveTo(cx-armW,topY,cx,topY); ctx.quadraticCurveTo(cx+armW,topY,cx+armW,topY+capR);
  ctx.lineTo(cx+armW,cenY-8); ctx.quadraticCurveTo(cx+cenW,cenY,cx+armW,cenY+8);
  ctx.lineTo(cx+armW,botY-capR); ctx.quadraticCurveTo(cx+armW,botY,cx,botY);
  ctx.quadraticCurveTo(cx-armW,botY,cx-armW,botY-capR); ctx.lineTo(cx-armW,cenY+8);
  ctx.quadraticCurveTo(cx-cenW,cenY,cx-armW,cenY-8); ctx.lineTo(cx-armW,topY+capR); ctx.closePath();
}

// Shared geometry, asked for by the model when it makes each band's value.
function chrGeometry(ctxMix, node, params, data) {
  const { W, H } = ctxMix.getWH(ctxMix, node, params);
  return chrLayout(W, H, data);
}

function chrLayout(W,H,data) {
  const margin=30, chrH=Math.max(1,H-margin*2), cx=W/2, topY=margin, botY=margin+chrH;
  const scale=chrH/data.length, cenY=topY+((data.cenStart+data.cenEnd)/2)*scale;
  const armW=Math.max(1,Math.min(28,W*0.14)), cenW=armW*0.35, capR=armW*0.7;
  return { cx, topY, botY, chrH, scale, cenY, armW, cenW, capR };
}

class ChromosomeBandNode {
  static getCount(data) { return data.bands.length; }
  /* A clip that brackets the bands, so it is a ClipNode path rather than a
     background that draws — the save/restore pair is structural. */
  static clipPath(ctxMix, node, params) {
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    const lo = chrLayout(W, H, node.value.data);
    chromosomePath(ctxMix.ctx, lo.cx, lo.topY, lo.botY, lo.cenY, lo.armW, lo.cenW, lo.capR);
  }
  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const ctx = ctxMix.ctx;
    const band=v;
    if(v.selected) ctx.fillStyle=v.hovered?'#E8B840':HIGHLIGHT;
    else if(v.hovered) ctx.fillStyle='#504838';
    else ctx.fillStyle=STAIN_COLORS[band.stain]||'#E8E0D0';
    ctx.fillRect(v.cx-60,v.y1,120,Math.max(v.y2-v.y1,0.5));
  }
  /* The restore that used to live here is the ClipNode's now: this only
     draws the outline and the label over the finished bands. */
  static drawOverlay(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    const lo = chrLayout(W, H, node.value.data);
    ctx.strokeStyle='#504838'; ctx.lineWidth=1;
    chromosomePath(ctx,lo.cx,lo.topY,lo.botY,lo.cenY,lo.armW,lo.cenW,lo.capR); ctx.stroke();
    ctx.fillStyle='#B84430'; ctx.beginPath(); ctx.arc(lo.cx,lo.cenY,lo.armW*0.28,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#908878'; ctx.font='600 12px monospace'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('chr1',lo.cx,lo.botY+8);
  }
  static hit_test(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const pt = ctxMix.hitPoint; if (!pt) return;
    if(v.stain==='acen') return;
    if(pt.y<v.y1||pt.y>v.y2) return; if(Math.abs(pt.x-v.cx)>v.armW+2) return;
    ctxMix.hitResult={node};
  }
}

//<< import { PianoKeyNode } from './piano-key-node.js';
//-- file: ./piano-key-zone.js --
//>> import { sceneRegistry } from './sys.js';
//>> import { HIGHLIGHT, rrPath } from './paint.js';
//>> export { PianoKeyNode, keyValue };

const BLACK_SET=new Set([1,3,6,8,10]), NOTE_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function noteOfIndex(data,idx){const midi=data.startMidi+idx;return{midi,black:BLACK_SET.has(midi%12)};}
/* A key knows its own note and where it sits among the whites; the keyboard
   as a whole supplies only the pane it is drawn in. */
function keyLayout(W,H,v){
  const margin=20, kbW=W-margin*2, kbH=H-margin*2;
  const wW=kbW/v.totalWhites, bW=wW*0.58, bH=kbH*0.6, topY=margin, leftX=margin;
  if(!v.black) return{black:v.black,midi:v.midi,x:leftX+v.whitesBefore*wW,y:topY,w:wW,h:kbH};
  return{black:v.black,midi:v.midi,x:leftX+v.whitesBefore*wW-bW/2,y:topY,w:bW,h:bH};
}

// The model's view of a key: everything one key needs, and no index.
function keyValue(data,idx){
  const midi=data.startMidi+idx, black=BLACK_SET.has(midi%12);
  let totalWhites=0, whitesBefore=0;
  for(let i=0;i<data.count;i++){
    if(BLACK_SET.has((data.startMidi+i)%12)) continue;
    totalWhites++;
    if(i<idx) whitesBefore++;
  }
  return {midi,black,whitesBefore,totalWhites};
}

class PianoKeyNode {
  static getCount(data) {
    return data.count;
  }

  // Whites first, then blacks over them: a draw order, not a pass counter.
  static _split(data, count) {
    const b = [];
    const w = [];
    
    for (let i = 0; i < count; i++) {
      if (BLACK_SET.has((data.startMidi + i) % 12)) {
        b.push(i);
      } else {
        w.push(i);
      }
    }
    
    return { b, w };
  }

  static getDrawOrder(data, count) {
    const { b, w } = PianoKeyNode._split(data, count);
    return w.concat(b);
  }

  static getHitOrder(data, count) {
    const { b, w } = PianoKeyNode._split(data, count);
    return b.concat(w);
  }

  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const ctx = ctxMix.ctx;
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    const lay = keyLayout(W, H, v);

    const decodeColor = [ '#1a1a18','#3a3830','#F0EDE4','#D8D0C0', HIGHLIGHT]
    const cIndex = v.selected ? 4 : ((lay.black ? 0:2) + (v.hovered ? 1 : 0));
    ctx.fillStyle = decodeColor[ cIndex ];

    if (lay.black) {
      rrPath(ctx, lay.x, lay.y, lay.w, lay.h, 0, 0, 3, 3);
      ctx.fill();
      ctx.fillStyle = v.selected ? '#E8B840' : '#2a2a28';
      ctx.fillRect(lay.x + 1, lay.y, lay.w - 2, lay.h * 0.04);
    } else {
      rrPath(ctx, lay.x + 0.5, lay.y, lay.w - 1, lay.h, 0, 0, 3, 3);
      ctx.fill();
      
      ctx.strokeStyle = '#B0A890';
      ctx.lineWidth = 0.5;
      rrPath(ctx, lay.x + 0.5, lay.y, lay.w - 1, lay.h, 0, 0, 3, 3);
      ctx.stroke();

      if (NOTE_NAMES[lay.midi % 12] === 'C') {
        const oct = Math.floor(lay.midi / 12) - 1;
        
        ctx.fillStyle = '#908878';
        ctx.font = '500 10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('C' + oct, lay.x + lay.w / 2, lay.y + lay.h - 6);
      }
    }
  }

  static hit_test(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const pt = ctxMix.hitPoint;
    
    if (!pt) return;
    
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    const lay = keyLayout(W, H, v);
    
    if (
      pt.x >= lay.x &&
      pt.x <= lay.x + lay.w &&
      pt.y >= lay.y &&
      pt.y <= lay.y + lay.h
    ) {
      ctxMix.hitResult = { node };
    }
  }
}

//<< import { BGAZone } from './bga-zone.js';

//>> import { sceneRegistry } from './sys.js';
//>> import { HIGHLIGHT } from './paint.js';
//>> export { BGAPinNode, ROW_LETTERS, pinLayout };

/* The same number as HEATMAP_ASPECT_RATIO, deliberately not shared: the two
   templates happen to agree today and neither should learn about the other. */
const BGA_ASPECT_RATIO = 500 / 700;
const ROW_LETTERS = 'ABCDEFGHJKLMNPRTUVWY';
const BGA_COLORS = {
  power: '#c0392b',
  ground: '#2c3e50',
  signal: '#27ae60',
  nc: '#3a3828'
};

function pinLayout(W, H, data, v) {
  const cols = data.cols;
  const row = v.row;
  const col = v.col;
  const margin = 30;
  
  const spacing = Math.min((W - margin * 2) / cols, (H - margin * 2) / data.rows);
  const gridW = spacing * cols;
  const gridH = spacing * data.rows;
  
  const ox = (W - gridW) / 2 + spacing / 2;
  const oy = (H - gridH) / 2 + spacing / 2;
  
  return {
    cx: ox + col * spacing,
    cy: oy + row * spacing,
    r: spacing * 0.32,
    row,
    col,
    pin: v.pin,
    name: v.name,
    spacing,
    gridW,
    gridH,
    ox: ox - spacing / 2,
    oy: oy - spacing / 2
  };
}

class BGAPinNode {
  static getCount(data) {
    return data.rows * data.cols;
  }

  static drawBackground(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    const lo = pinLayout(W, H, node.value.data, 0);
    const pad = lo.spacing * 0.45;
    
    ctx.fillStyle = '#1a1918';
    ctx.strokeStyle = '#333028';
    ctx.lineWidth = 1;
    
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(lo.ox - pad, lo.oy - pad, lo.gridW + pad * 2, lo.gridH + pad * 2, 6);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillRect(lo.ox - pad, lo.oy - pad, lo.gridW + pad * 2, lo.gridH + pad * 2);
      ctx.strokeRect(lo.ox - pad, lo.oy - pad, lo.gridW + pad * 2, lo.gridH + pad * 2);
    }
    
    ctx.fillStyle = '#5a5448';
    ctx.beginPath();
    ctx.arc(lo.ox - pad / 2, lo.oy - pad / 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const ctx = ctxMix.ctx;
    const lo = v;
    
    if (!lo.pin) return;
    
    let fill = BGA_COLORS[lo.pin.type] || '#555';
    
    if (v.selected) {
      fill = HIGHLIGHT;
    } else if (v.hovered) {
      fill = '#B0A070';
    }
    
    ctx.beginPath();
    ctx.arc(v.cx, lo.cy, lo.r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    
    if (!v.selected) {
      const g = ctx.createRadialGradient(v.cx - lo.r * 0.3, lo.cy - lo.r * 0.3, 0, v.cx, lo.cy, lo.r);
      g.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
      g.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = g;
      ctx.fill();
    }
  }

  static hit_test(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const pt = ctxMix.hitPoint;
    
    if (!pt) return;
    
    const lo = v;
    if (!lo.pin) return;
    
    const dx = pt.x - v.cx;
    const dy = pt.y - lo.cy;
    
    if (dx * dx + dy * dy <= lo.r * lo.r) {
      ctxMix.hitResult = { node };
    }
  }
}

class BGAModel {
  get name() { return 'BGA Package · 12×12'; }
  get displayType() { return '2d'; }
  constructor() {
    this.visible = true;
    const rows=12,cols=12;
    const pins=[];
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const cr=Math.max(Math.abs(r),Math.abs(r-rows+1))
        const cc=Math.max(Math.abs(c),Math.abs(c-cols+1));
        if(cr+cc<=1){
          pins.push(null);
          continue;
        }
        if(r===0||r===rows-1||c===0||c===cols-1)
          pins.push({
            type:(r+c)%2===0?'power':'ground',
            net:(r+c)%2===0?'VCC':'GND'});
        else if(r===1||r===rows-2||c===1||c===cols-2)
          pins.push({
            type:'ground',
            net:'GND'});
        else 
          pins.push({
            type:'signal',
            net:'IO_'+(r*cols+c)});
        }}
    const BGA = {rows,cols,pins};
    this.arrayNode = makeArray('bga-pin', BGA, {
      getValue: (mix, n, p, i) => {
        const row = Math.floor(i / cols), col = i % cols;
        const pin = pins[i], name = (ROW_LETTERS[row] || '?') + (col + 1);
        const { W, H } = mix.getWH(mix, n, p);
        const g = pinLayout(W, H, BGA, { row, col });
        return { row, col, pin, name, 
          cx: g.cx, 
          cy: g.cy, 
          r: g.r,
          tooltip: { name, 
            detail: pin ? (pin.net || pin.type) : 'no connect',
            extra: pin ? pin.type : '' } 
        };
      },
    });
    this.sceneRoot = makeZoomableCamera(this.arrayNode);
    this.controls = [];
  }
}
SYS.MODELS.push(new BGAModel());

/* Geometry for the heatmap's body template, asked for by the model when it
   makes an item's value. */
function organGeometry(ctxMix, node, params) {
  const { W, H } = ctxMix.getWH(ctxMix, node, params);
  
  if (W <= 0 || H <= 0) return { cw: 1, ch: 1, ox: 0, oy: 0, scale: 1 };
  
  let cw = Math.max(1, Math.round(Math.min(W, 500)));
  let ch = Math.max(1, Math.round(cw / HEATMAP_ASPECT_RATIO));
  
  if (ch > H) {
    ch = Math.max(1, Math.round(Math.min(H, 700)));
    cw = Math.max(1, Math.round(ch * HEATMAP_ASPECT_RATIO));
  }
  
  return { cw, ch, ox: (W - cw) / 2, oy: (H - ch) / 2, scale: ch / 700 };
}

function fillPoly(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}

function strokePoly(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.stroke();
}

function scalePts(pts, w, h) {
  return pts.map(p => [p[0] * w, p[1] * h]);
}

const hmTempCanvas1 = document.createElement('canvas');
const hmTempCanvas2 = document.createElement('canvas');

const COLORMAPS = {
  inferno: [
    [0, .001, .001, .016], [.14, .157, .043, .329], [.32, .396, 0, .659], [.50, .624, .165, .388],
    [.68, .831, .283, .259], [.82, .961, .490, .082], [.92, .980, .757, .153], [1, .988, 1, .643]
  ]
};

function sampleCmap(name, t) {
  const stops = COLORMAPS[name] || COLORMAPS.inferno;
  t = Math.max(0, Math.min(1, t));
  if (t <= stops[0][0]) return [stops[0][1] * 255, stops[0][2] * 255, stops[0][3] * 255];
  const last = stops[stops.length - 1];
  if (t >= last[0]) return [last[1] * 255, last[2] * 255, last[3] * 255];
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const a = stops[i - 1], b = stops[i], f = (t - a[0]) / (b[0] - a[0]);
      return [(a[1] + (b[1] - a[1]) * f) * 255, (a[2] + (b[2] - a[2]) * f) * 255, (a[3] + (b[3] - a[3]) * f) * 255];
    }
  }
  return [0, 0, 0];
}

function buildRegionLookup(mc, w, h) {
  const d = mc.getImageData(0, 0, w, h).data;
  const l = new Uint8Array(w * h);
  for (let i = 0, n = w * h; i < n; i++) {
    const r = d[i * 4];
    if (r >= 10) l[i] = Math.round(r / 20);
  }
  return l;
}

function buildValueField(lookup, rv, w, h, br) {
  hmTempCanvas1.width = w;
  hmTempCanvas1.height = h;
  const c1 = hmTempCanvas1.getContext('2d');
  const img = c1.createImageData(w, h);
  const d = img.data;
  for (let i = 0, n = w * h; i < n; i++) {
    const rid = lookup[i];
    if (rid > 0 && rv[rid - 1] !== undefined) {
      const v = Math.round(rv[rid - 1] * 255);
      d[i * 4] = v;
      d[i * 4 + 1] = v;
      d[i * 4 + 2] = v;
      d[i * 4 + 3] = 255;
    } else {
      d[i * 4 + 3] = 255;
    }
  }
  c1.putImageData(img, 0, 0);
  hmTempCanvas2.width = w;
  hmTempCanvas2.height = h;
  const c2 = hmTempCanvas2.getContext('2d');
  c2.clearRect(0, 0, w, h);
  if (br > 0) c2.filter = `blur(${br}px)`;
  c2.drawImage(hmTempCanvas1, 0, 0);
  c2.filter = 'none';
  const blurred = c2.getImageData(0, 0, w, h).data;
  const field = new Float32Array(w * h);
  let max = 0;
  for (let i = 0, n = w * h; i < n; i++) {
    field[i] = blurred[i * 4];
    if (field[i] > max) max = field[i];
  }
  if (max > 0) {
    for (let i = 0, n = w * h; i < n; i++) field[i] /= max;
  }
  return field;
}

function colormapField(field, w, h, cn) {
  const img = new ImageData(w, h);
  const d = img.data;
  for (let i = 0, n = w * h; i < n; i++) {
    const v = field[i];
    if (v < 0.005) {
      d[i * 4 + 3] = 0;
      continue;
    }
    const [r, g, b] = sampleCmap(cn, v);
    d[i * 4] = r;
    d[i * 4 + 1] = g;
    d[i * 4 + 2] = b;
    d[i * 4 + 3] = Math.min(255, v * 320);
  }
  return img;
}

function sampleRandom(field, w, h, count) {
  const pts = [];
  let att = 0;
  while (pts.length < count && att < count * 40) {
    att++;
    const x = Math.random() * w, y = Math.random() * h;
    const ix = ~~x, iy = ~~y;
    if (ix < 0 || ix >= w || iy < 0 || iy >= h) continue;
    const v = field[iy * w + ix];
    if (v > 0.03 && Math.random() < v) pts.push({ x, y, v });
  }
  return pts;
}

function drawSparkles(ctx, pts, size, cn, ga) {
  ctx.save();
  ctx.globalAlpha = ga;
  for (const p of pts) {
    const [r, g, b] = sampleCmap(cn, Math.min(1, p.v * 1.2 + 0.15));
    const a = 0.4 + p.v * 0.6;
    const sz = size * (0.7 + p.v * 0.6);
    ctx.globalAlpha = ga * a;
    ctx.fillStyle = `rgba(${~~r},${~~g},${~~b},0.2)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz * 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.6 + p.v * 0.4})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.5 + p.v * 0.5})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBodyMask(ctx, w, h) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < BODY.organs.length; i++) {
    const [cx, cy, rx, ry] = BODY.organs[i];
    ctx.fillStyle = `rgb(${(i + 1) * 20},0,0)`;
    ctx.beginPath();
    ctx.ellipse(cx * w, cy * h, rx * w, ry * h, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

class OrganRegionNode {
  static getCount(data) {
    return BODY_REGIONS.length;
  }

  static _ensureCache(node, cw, ch) {
    let c = node._hm;
    if (c && c.w === cw && c.h === ch) return c;
    const scale = ch / 700;
    if (!c) {
      c = node._hm = {
        maskCanvas: document.createElement('canvas'),
        baseCanvas: document.createElement('canvas'),
        overlayCanvas: document.createElement('canvas'),
        snap: {}
      };
      c.maskCtx = c.maskCanvas.getContext('2d', { willReadFrequently: true });
      c.baseCtx = c.baseCanvas.getContext('2d');
      c.overlayCtx = c.overlayCanvas.getContext('2d');
    }
    c.w = cw;
    c.h = ch;
    c.maskCanvas.width = cw;
    c.maskCanvas.height = ch;
    c.baseCanvas.width = cw;
    c.baseCanvas.height = ch;
    c.overlayCanvas.width = cw;
    c.overlayCanvas.height = ch;
    drawBodyMask(c.maskCtx, cw, ch);
    c.regionLookup = buildRegionLookup(c.maskCtx, cw, ch);
    c.baseCtx.fillStyle = '#10131a';
    c.baseCtx.fillRect(0, 0, cw, ch);
    const pts = scalePts(BODY.silhouette, cw, ch);
    c.baseCtx.shadowColor = 'rgba(0,0,0,0.8)';
    c.baseCtx.shadowBlur = 20 / scale;
    c.baseCtx.shadowOffsetY = 10 / scale;
    c.baseCtx.fillStyle = '#1c2028';
    fillPoly(c.baseCtx, pts);
    c.baseCtx.shadowBlur = 0;
    c.baseCtx.shadowOffsetY = 0;
    c.baseCtx.strokeStyle = '#3a4050';
    c.baseCtx.lineWidth = 1.3;
    strokePoly(c.baseCtx, pts);
    c.field = null;
    return c;
  }

  static drawBackground(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    if (W <= 0 || H <= 0) return;
    let cw = Math.max(1, Math.round(Math.min(W, 500)));
    let ch = Math.max(1, Math.round(cw / HEATMAP_ASPECT_RATIO));
    if (ch > H) {
      ch = Math.max(1, Math.round(Math.min(H, 700)));
      cw = Math.max(1, Math.round(ch * HEATMAP_ASPECT_RATIO));
    }
    const ox = (W - cw) / 2;
    const oy = (H - ch) / 2;
    const scale = ch / 700;
    const c = OrganRegionNode._ensureCache(node, cw, ch);
    const snap = c.snap;
    const rv = node.value.data.map(d => d.val);
    const blur = 18 * scale;
    const cmap = 'inferno';
    const sc = 500;
    const rm = snap.regionVals && rv.every((v, i) => v === snap.regionVals[i]);

    if (!c.field || blur !== snap.blur || !rm) {
      c.field = buildValueField(c.regionLookup, rv, cw, ch, blur);
      c.heatmapImg = colormapField(c.field, cw, ch, cmap);
      c.overlayCtx.clearRect(0, 0, cw, ch);
      c.overlayCtx.putImageData(c.heatmapImg, 0, 0);
      c.sparkles = sampleRandom(c.field, cw, ch, sc);
      snap.blur = blur;
      snap.regionVals = rv;
    }

    ctx.save();
    ctx.translate(ox, oy);
    ctx.drawImage(c.baseCanvas, 0, 0);
    ctx.globalAlpha = 0.7;
    ctx.drawImage(c.overlayCanvas, 0, 0);
    if (c.sparkles) drawSparkles(ctx, c.sparkles, 1.5 * scale, cmap, 1.0);
    ctx.restore();
  }

  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const ctx = ctxMix.ctx;
    const lo = v;

    ctx.save();
    ctx.translate(lo.ox, lo.oy);
    const organ = v.organ;
    const data = v;
    const [cx, cy, rx, ry] = organ;
    let fill = 'transparent';
    let stroke = '#2a3545';
    let textCol = '#3a4050';

    if (v.selected) {
      fill = data.hue + '80';
      stroke = '#fff';
      textCol = '#fff';
    } else if (v.hovered) {
      fill = data.hue + '40';
      stroke = '#888';
      textCol = '#ddd';
    }

    ctx.beginPath();
    ctx.ellipse(cx * lo.cw, cy * lo.ch, rx * lo.cw, ry * lo.ch, 0, 0, Math.PI * 2);
    if (v.selected || v.hovered) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5 * v.scale;
    ctx.stroke();
    ctx.font = `500 ${Math.max(8, lo.cw * 0.025)}px monospace`;
    ctx.fillStyle = textCol;
    ctx.textAlign = 'center';
    ctx.fillText(v.label, cx * lo.cw, cy * lo.ch + 4);
    ctx.restore();
  }

  static hit_test(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const pt = ctxMix.hitPoint;
    const lo = v;
    if (!pt) return;
    const organ = v.organ;
    const [cx, cy, rx, ry] = organ;
    const dx = (pt.x - lo.ox) - cx * lo.cw;
    const dy = (pt.y - lo.oy) - cy * lo.ch;
    const nx = dx / (rx * lo.cw);
    const ny = dy / (ry * lo.ch);
    if (nx * nx + ny * ny <= 1.2) ctxMix.hitResult = { node };
  }
}

function mouseGeometry(ctxMix, node, params) {
  const { W, H } = ctxMix.getWH(ctxMix, node, params);
  const pad = 30;
  const mh = Math.max(10, H - pad * 2);
  const scale = mh / 280;
  const mw = 160 * scale;
  
  return { mw, mh, ox: (W - mw) / 2, oy: (H - mh) / 2, scale };
}

function buildMouseBodyPath(ctx, mw, mh) {
  const pts = [
    [mw * 0.3, 0], [mw * 0.7, 0], [mw * 0.9, mh * 0.2], [mw, mh * 0.6],
    [mw * 0.8, mh], [mw * 0.2, mh], [0, mh * 0.6], [mw * 0.1, mh * 0.2]
  ];
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    const xc = (pts[i][0] + pts[i + 1][0]) / 2;
    const yc = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], xc, yc);
  }
  ctx.quadraticCurveTo(pts[pts.length - 1][0], pts[pts.length - 1][1], pts[0][0], pts[0][1]);
  ctx.closePath();
}

function buildZonePath(ctx, index, mw, mh, scale) {
  ctx.beginPath();
  if (index === 0) {
    const pts = [[mw * 0.05, mh * 0.05], [mw * 0.48, mh * 0.02], [mw * 0.45, mh * 0.4], [mw * 0.05, mh * 0.4]];
    ctx.moveTo(pts[0][0], pts[0][1]);
    ctx.quadraticCurveTo(pts[1][0], pts[1][1] - (mh * 0.05), pts[1][0], pts[1][1]);
    ctx.lineTo(pts[2][0], pts[2][1]);
    ctx.quadraticCurveTo(pts[3][0], pts[3][1] + (mh * 0.02), pts[3][0], pts[3][1]);
  } else if (index === 1) {
    const pts = [[mw * 0.52, mh * 0.02], [mw * 0.95, mh * 0.05], [mw * 0.95, mh * 0.4], [mw * 0.55, mh * 0.4]];

class MouseButtonNode {

    const lo = v;

    ctx.save();
    ctx.translate(lo.ox, lo.oy);
    buildZonePath(ctx, v.shape, lo.mw, lo.mh, v.scale);
    const isActive = v.selected || v.hovered;

    if (v.shape === 0 || v.shape === 1) {
      const gradient = ctx.createLinearGradient(0, 0, 0, lo.mh * 0.4);
      if (v.selected) {
        gradient.addColorStop(0, HIGHLIGHT);
        gradient.addColorStop(1, '#806020');
      } else if (v.hovered) {
        gradient.addColorStop(0, '#B0A070');
        gradient.addColorStop(1, '#504838');
      } else {
        gradient.addColorStop(0, '#2d3342');
        gradient.addColorStop(1, '#1e232d');

      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = isActive ? '#fff' : 'rgba(255,255,255,0.15)';

      ctx.stroke();
    } else if (v.shape === 2 || v.shape === 3) {
      ctx.fillStyle = v.selected ? HIGHLIGHT : v.hovered ? '#B0A070' : (v.shape === 2 ? '#334155' : '#475569');
      ctx.fill();
      if (v.shape === 2) {

      [lo.mw * 0.50, lo.mh * 0.175], [lo.mw * 0.50, lo.mh * 0.31],
      [lo.mw * 0.04, lo.mh * 0.47], [lo.mw * 0.02, lo.mh * 0.63]

      ctx.fill();

    ctx.restore();
  }

    const pt = ctxMix.hitPoint;
    const lo = v;

    ctx.restore();

function ringGeometry(ctxMix, node, params, data) {
  const { W, H } = ctxMix.getWH(ctxMix, node, params);
  const maxR = Math.max(0.1, Math.min(W, H) / 2 - 16);
  
  return { cx: W / 2, cy: H / 2, maxR, scale: maxR / data.totalR };
}


function ringLayout(W, H, data, idx) {
  const ring = data.rings[idx];
  const cx = W / 2;
  const cy = H / 2;
  const maxR = Math.max(0.1, Math.min(W, H) / 2 - 16);
  const scale = maxR / data.totalR;
  
  return {
    cx,
    cy,
    innerR: ring.innerR * scale,
    outerR: ring.outerR * scale,
    ring,
    maxR,
    scale
  };
}

class TreeRingNode {
  /* Shared geometry when used as a flyweight under a plate.  A ring used on
     its own in an ordinary model finds no plate and falls back to its own
     value, which carries everything a single ring needs. */

  /* The geometry of this one ring.  Under a plate it scales with the whole
     trunk; standing alone in an ordinary model it scales to its own extent,
     so a TreeRingNode can be dropped into any scene. */
  static _ring(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params) || {};
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    // Under an array the model supplies the trunk's scale; alone, the ring
    // scales to its own extent, so a TreeRingNode drops into any scene.
    const maxR = v.maxR ?? Math.max(0.1, Math.min(W, H) / 2 - 16);
    const scale = v.scale ?? maxR / (v.outerR || 1);
    
    return {
      cx: v.cx ?? W / 2,
      cy: v.cy ?? H / 2,
      maxR,
      scale,
      ring: v,
      innerR: v.innerR2 ?? (v.innerR || 0) * scale,
      outerR: v.outerR2 ?? (v.outerR || 0) * scale
    };
  }

  static getCount(data) {
    return data.rings.length;
  }

  static getHitOrder(data, count) {
    const o = [];
    for (let i = count - 1; i >= 0; i--) o.push(i);
    return o;
  }

  static drawBackground(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    const lo = ringLayout(W, H, node.value.data, 0);
    
    ctx.fillStyle = '#3a2818';
    ctx.beginPath();
    ctx.arc(lo.cx, lo.cy, lo.maxR + 4, 0, Math.PI * 2);
    ctx.fill();
  }

  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const ctx = ctxMix.ctx;
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    const lo = TreeRingNode._ring(ctxMix, node, params);
    const L = lo.ring.lightness || 0.5;
    
    let earlyCol;
    let lateCol;
    
    if (v.selected) {
      earlyCol = '#E8B840';
      lateCol = '#B08020';
    } else if (v.hovered) {
      earlyCol = '#907850';
      lateCol = '#685838';
    } else {
      earlyCol = `rgb(${140 + L * 80 | 0},${110 + L * 65 | 0},${60 + L * 40 | 0})`;
      lateCol = `rgb(${90 + L * 50 | 0},${65 + L * 35 | 0},${30 + L * 25 | 0})`;
    }
    
    ctx.beginPath();
    ctx.arc(v.cx, lo.cy, lo.outerR, 0, Math.PI * 2);
    ctx.arc(v.cx, lo.cy, lo.innerR, 0, Math.PI * 2, true);
    ctx.closePath();
    
    if (lo.outerR - lo.innerR > 1) {
      const g = ctx.createRadialGradient(v.cx, lo.cy, lo.innerR, v.cx, lo.cy, lo.outerR);
      g.addColorStop(0, earlyCol);
      g.addColorStop(1, lateCol);
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = lateCol;
    }
    
    ctx.fill();
  }

  static drawOverlay(ctxMix, node, params) {
    const ctx = ctxMix.ctx;
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    const lo = ringLayout(W, H, node.value.data, 0);
    const pithR = (node.value.data.rings[0]?.innerR || 3) * lo.maxR / node.value.data.totalR;
    
    ctx.fillStyle = '#6a4828';
    ctx.beginPath();
    ctx.arc(lo.cx, lo.cy, pithR, 0, Math.PI * 2);
    ctx.fill();
  }

  static hit_test(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const pt = ctxMix.hitPoint;
    
    if (!pt) return;
    
    const { W, H } = ctxMix.getWH(ctxMix, node, params);
    const lo = TreeRingNode._ring(ctxMix, node, params);
    const dx = pt.x - lo.cx;
    const dy = pt.y - lo.cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist >= lo.innerR && dist <= lo.outerR) {
      ctxMix.hitResult = { node };
    }
  }
}

function treeRingData(count) {
  const rings = [];
  let r = 5;
  
  for (let i = 0; i < count; i++) {
    const base = 2.5 + Math.sin(i * 0.7) * 1.2 + Math.cos(i * 1.3) * 0.8;
    const width = Math.max(0.8, base + (((i * 137) % 17) / 17 - 0.5) * 2);
    const lightness = 0.3 + (((i * 53) % 23) / 23) * 0.5;
    const year = 2026 - count + i;
    let note = '';
    
    if (width < 1.5) note = 'drought year';
    else if (width > 4) note = 'strong growth';
    
    rings.push({ innerR: r, outerR: r + width, width, year, lightness, note });
    r += width;
  }
  
  return { rings, totalR: r };
}

const isPrint = (b) => b >= 0x20 && b <= 0x7e;
const SYMBOLS = ['FIN', 'SYN', 'RST', 'PSH', 'ACK', 'URG', 'ECE', 'CWR'];

class HexChunkNode {
  static getCount(data) {
    const currentBPR = 1 << data.layoutConfig.log2;
    return Math.ceil(data.buffer.length / currentBPR);
  }

  static getChunkHeight(data) {
    let chunkH = 0;
    ['hex', 'ascii', 'bit10', 'bitsym'].forEach(t => {
      const c = data.configs[t];
      if (c.enabled) chunkH += (c.fontSize * 1.25) * (c.rowHeight / 100);
    });
    return chunkH;
  }

  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const ctx = ctxMix.ctx;
    const state = ctxMix.state;
    const data = v.data;
    const { W, H, Z } = ctxMix.getWH(ctxMix, node, params);

    const currentBPR = 1 << data.layoutConfig.log2;
    const chunkH = this.getChunkHeight(data);
    if (chunkH === 0) return;

    const startChunk = v.offset / currentBPR;
    const chunkStart = startChunk * currentBPR;
    const chunkBytes = data.buffer.slice(chunkStart, chunkStart + currentBPR);

    let currentY = 20 + startChunk * chunkH;

// Fast Pan/Zoom Culling logic
    if (params && params.zoom) {
      const viewportTop = -params.panY / params.zoom;
      const viewportBottom = (-params.panY + H) / params.zoom;
      if (currentY > viewportBottom + chunkH || currentY < viewportTop - chunkH * 2) return;
    } else {
      if (currentY > H + chunkH || currentY < -chunkH * 2) return;
    }

  let currentX = 60; // offset padding for labels
  let renderW = data.layoutConfig.renderW;
  let availableW = renderW - 80;

  // Draw Chunk Address Label
  ctx.font = `14px monospace`;
  ctx.fillStyle = '#64748b';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText(`0x${chunkStart.toString(16).padStart(4, '0').toUpperCase()}`, currentX - 10, currentY);

  // Draw active rows for this chunk
  const types = ['hex', 'ascii', 'bit10', 'bitsym'];
  types.forEach(type => {
    const config = data.configs[type];
    currentY += this.drawGenericRow(ctx, currentX, currentY, availableW, chunkBytes, currentBPR, type, config, data.layoutConfig.gap);
  });
  }

  static drawGenericRow(ctx, x, y, width, bytes, expectedLength, type, config, gap8) {
    if (!config.enabled) return 0;
    const baseH = config.fontSize * 1.25;
    const advanceY = baseH * (config.rowHeight / 100);
    const bgH = baseH * (config.bgHeight / 100);
    const flashH = baseH * (config.flashHeight / 100);

    // Backgrounds can explicitly overlap visually based on bgHeight/rowHeight ratio
    if (config.bgColor && config.bgColor !== 'transparent') {
      ctx.fillStyle = config.bgColor;
      ctx.fillRect(x, y, width, bgH);
    }

    ctx.font = `${config.fontSize}px "SF Mono", "Consolas", monospace`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    const textY = y + (bgH / 2);

    const isBitLevel = (type === 'bit10' || type === 'bitsym');
    const itemCount = isBitLevel ? bytes.length * 8 : bytes.length;

    const numGaps = Math.max(0, Math.floor((expectedLength - 1) / 8));
    const availableW = width - (numGaps * gap8);
    const byteW = availableW / expectedLength;

    for (let i = 0; i < itemCount; i++) {
      let itemX, itemW;
      const byteIdx = isBitLevel ? Math.floor(i / 8) : i;
      const gapOffset = Math.floor(byteIdx / 8) * gap8;
      const byteStartX = x + byteIdx * byteW + gapOffset;

      if (isBitLevel) {
        const groupGap = byteW * 0.15; 
        const activeByteW = byteW - groupGap;
        const bitW = activeByteW / 8;
        itemX = byteStartX + (i % 8) * bitW;
        itemW = bitW;
      } else {
        itemW = byteW;
        itemX = byteStartX;
      }

      const bitOffset = isBitLevel ? (7 - (i % 8)) : -1; 
      const b = bytes[byteIdx];
      if (b === undefined)
        continue;

      const val = isBitLevel ? ((b >> bitOffset) & 1) : b;

      if (flashH > 0) {
        let drawW;
        if (isBitLevel) {
          drawW = Math.max(1, itemW - 1);
          ctx.fillStyle = config.flashColor + (val ? '' : '66');
        } else {
          drawW = Math.max(1, itemW - 4);
          ctx.fillStyle = val !== 0 ? config.flashColor + '80' : 'rgba(255,255,255,0.03)';
        }
        ctx.fillRect(itemX, y, drawW, flashH);
      }

      let str = '';
      let color = '#ccc';
      let rotate = false;

      if (type === 'hex') {
        str = val.toString(16).padStart(2, '0').toUpperCase();
        if (val === 0) color = '#4a5468';
        else if (isPrint(val)) color = '#9ca8be';
        else color = '#7eaaef';
      } else if (type === 'ascii') {
        const print = isPrint(val);
        str = print ? String.fromCharCode(val) : '\u00b7';
        color = print ? '#e8b634' : '#2e2840';
      } else if (type === 'bit10') {
        str = val.toString();
        color = val ? '#c084fc' : '#586070';
      } else if (type === 'bitsym') {
        str = SYMBOLS[7 - bitOffset];
        color = val ? '#c084fc' : '#5a6278';
        rotate = true;
      }

      ctx.fillStyle = color;

      if (config.fontSize < 6) {
            // Minified representation
        const markW = Math.max(1, itemW * 0.5);
        const markH = Math.max(1, config.fontSize);
        ctx.fillRect(itemX + (itemW - markW) / 2, textY - markH / 2, markW, markH);
      } else {
        if (rotate) {
          ctx.save();
          ctx.translate(itemX + itemW / 2, textY);
          ctx.rotate(-Math.PI / 2);
          ctx.fillText(str, 0, 0);
          ctx.restore();
        } else {
          ctx.fillText(str, itemX + itemW / 2, textY);
        }
      }
    }
    return advanceY;
  }
  /* PaneCameraNode has already put the hit point into world space, so the
     test is just the chunk's own band of rows. */
  static hit_test(XXXctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params);
    const pt = ctxMix.hitPoint;
    if (!pt) return;
    if (!v.chunkH) return;
    if (pt.y >= v.top && pt.y <= v.top + v.chunkH) ctxMix.hitResult = { node };
  }

}

        ascii: { enabled: false, bgColor: '#2d1b0b', flashColor: '#5b8def', fontSize: 46, rowHeight: 70, bgHeight: 70, flashHeight: 0 },
        bit10: { enabled: false, bgColor: '#0c0a08', flashColor: '#1b22d6', fontSize: 8, rowHeight: 75, bgHeight: 100, flashHeight: 100 },
        bitsym: { enabled: false, bgColor: '#0c0a08', flashColor: '#1b22d6', fontSize: 6, rowHeight: 170, bgHeight: 170, flashHeight: 40 }
      }
    };

    this.arrayNode = makeArray('hex-chunk', hexData, {
      getValue: (mix, n, p, i) => {
        const bpr = 1 << hexData.layoutConfig.log2, offset = i * bpr;
        const bytes = hexData.buffer.slice(offset, offset + bpr);
        const printable = [...bytes].filter(b => b >= 0x20 && b <= 0x7e).length;
        const chunkH = HexChunkNode.getChunkHeight(hexData);
        return { offset, bpr, chunkH, top: 20 + i * chunkH, data: hexData,
                 tooltip: { name: 'Chunk 0x' + offset.toString(16).padStart(4, '0').toUpperCase(),
                            detail: bpr + ' bytes · offset ' + offset,
                            extra: printable + ' printable' } };
      },
      // A large dump must not instantiate a chunk per row that is off screen.
      visibleRange: (mix, node, params) => {
        const chunkH = HexChunkNode.getChunkHeight(hexData);
        if (!chunkH) return [0, node.value.count];
        const { H, oy, Z } = mix.getWH(mix, node, params);
        const top = (oy || 0), bottom = top + (H / (Z || 1));
        const from = Math.max(0, Math.floor((top - 20) / chunkH) - 1);
        const to = Math.min(node.value.count, Math.ceil((bottom - 20) / chunkH) + 1);
        return [from, Math.max(from, to)];
      },
    });
    this.sceneRoot = makeZoomableCamera(this.arrayNode, { scrollX: -20, scrollY: -20 });

    this.controls = [
      {type:'separator', label:'Layout Settings'},
      {id:'layout_renderW', label:'Width px', min:400, max:4000, step:10, value:hexData.layoutConfig.renderW},
      {id:'layout_log2', label:'Log2 B/R', min:2, max:8, step:1, value:hexData.layoutConfig.log2},
      {id:'layout_gap', label:'Gap / 8B', min:0, max:64, step:1, value:hexData.layoutConfig.gap}
    ];

    ['hex', 'ascii', 'bit10', 'bitsym'].forEach(t => {
      const c = hexData.configs[t];
      const isBit = (t === 'bit10' || t === 'bitsym');
      this.controls.push({type:'separator', label: t.toUpperCase() + ' Settings'});
      this.controls.push({id: t+'_enabled', type:'checkbox', label:'Enabled', value: c.enabled});
      this.controls.push({id: t+'_bgColor', type:'color', label:'Bg Color', value: c.bgColor});
      this.controls.push({id: t+'_flashColor', type:'color', label:'Flash Color', value: c.flashColor});
      this.controls.push({id: t+'_fontSize', label:'Font Size', min:isBit?1:6, max:isBit?22:64, step:1, value: c.fontSize});
      this.controls.push({id: t+'_rowHeight', label:'Row %', min:0, max:200, step:1, value: c.rowHeight});
      this.controls.push({id: t+'_bgHeight', label:'Bg %', min:0, max:200, step:1, value: c.bgHeight});
      this.controls.push({id: t+'_flashHeight', label:'Flash %', min:0, max:200, step:1, value: c.flashHeight});
    });
  }

  onControl(id, val, getValues, app) {
    const hexData = this.arrayNode.value.data;
    if (id.startsWith('layout_')) {
      const prop = id.replace('layout_', '');
      if (hexData.layoutConfig[prop] !== undefined) hexData.layoutConfig[prop] = val;
    } else {
      const parts = id.split('_');
      if (parts.length === 2) {
        const type = parts[0];
        const prop = parts[1];
        if (hexData.configs[type] && hexData.configs[type][prop] !== undefined) {
          hexData.configs[type][prop] = val;
        }
      }
    }

// Request a redraw on the specific pane's harness
    if (app && app.paneEls) {
      const i = SYS.MODELS.indexOf(this);
      const pane = app.paneEls[i];
      if (pane) {
        const canvas = pane.querySelector('canvas');
        canvas?.harness?.draw();
      }
    }
  }
}
SYS.MODELS.push(new HexViewModel());

//<< import { ButtonNode } from './button-node.js';
//-- file: ./button-node.js --
//>> import { sceneRegistry } from './sys.js';
//>> import { hexToRgb, roundRectPath, shiftColor } from './paint.js';
//>> import { PipKinds } from './pip-kind.js';
//>> import { Values } from './values.js';
//>> export { ButtonNode };

const BUTTON_DEFAULTS = Object.freeze({
  fill:           '#e0ddd4',
  color:          '#2a2a2a',
  cornerRadius:   12,
  borderWidth:    2.5,
  bevel:          1,
  bevelStrength:  0.38,
  lightAngle:     315,
  lightIntensity: 0.55,
  shadowColor:    'rgba(0,0,0,0.28)',
  shadowOffsetX:  2,
  shadowOffsetY:  3,
  shadowBlur:     6,
  fontSize:       32,
  subOffset:      0,
  badgeFill:      '#e74c3c',
  badgeColor:     '#ffffff',
  scale:          1.0,
  liftY:          0.0,
  brightness:     1.0,
  hoverScale:     1.08,
  hoverLift:      -2,
  pressScale:     0.96,
  pressDepth:     1,
});

class ButtonNode {
  static meta = {
    zOrder: 1,
    pipKind: PipKinds.JUNCTION,
    spawnOverrides: (wp) => ({ x: wp.x, y: wp.y, label: 'Btn', sub: '' }),
    editableFields: (node) => [
      { key: 'label', label: 'Label', type: 'text', value: node.value.label || '' },
      { key: 'sub', label: 'Subtext', type: 'text', value: node.value.sub || '' },
      { key: 'badge', label: 'Badge', type: 'number', value: node.value.badge || 0 },
      { key: 'color', label: 'Fill Color', type: 'color', value: node.value.color || BUTTON_DEFAULTS.fill },
      { key: 'fontSize', label: 'Font Size', type: 'number', value: node.value.fontSize || BUTTON_DEFAULTS.fontSize },
      { key: 'cornerRadius', label: 'Corner Radius', type: 'number', value: node.value.cornerRadius || BUTTON_DEFAULTS.cornerRadius },
      { key: 'borderWidth', label: 'Border Width', type: 'number', value: node.value.borderWidth || BUTTON_DEFAULTS.borderWidth },
      { key: 'bevel', label: 'Bevel', type: 'number', value: node.value.bevel ?? BUTTON_DEFAULTS.bevel },
      { key: 'bevelStrength', label: 'Bevel Strength', type: 'number', value: node.value.bevelStrength ?? BUTTON_DEFAULTS.bevelStrength },
      { key: 'scale', label: 'Scale', type: 'number', value: node.value.scale || BUTTON_DEFAULTS.scale },
      { key: 'brightness', label: 'Brightness', type: 'number', value: node.value.brightness ?? BUTTON_DEFAULTS.brightness },
    ],
  };

  static getCentreXY(res, node, params) {
    const v = res.getValue(res, node, params) || {};
    return { x: v.x || 0, y: v.y || 0 };
  }

  static draw2d(ctxMix, node, params) {
    const v = ctxMix.getValue(ctxMix, node, params) || {};
    const p = { ...BUTTON_DEFAULTS, ...params };
    const zoom = 1;

    const rawW   = v.width  || 64;
    const rawH   = v.height || 64;
    const sc     = v.scale ?? p.scale ?? 1;
    const w      = rawW * zoom * sc;
    const h      = rawH * zoom * sc;
    const screen = ButtonNode.getCentreXY(ctxMix, node, params);
    const cx     = screen.x;
    const cy     = screen.y + (v.liftY ?? p.liftY ?? 0) * zoom;
    const left   = cx - w / 2;
    const top    = cy - h / 2;
    const r      = (v.cornerRadius ?? p.cornerRadius ?? 0) * zoom * sc;
    const bw     = (v.borderWidth  ?? p.borderWidth  ?? 0) * zoom * sc;

    const fillHex = v.color || p.fill;

    const ctx = ctxMix.ctx;

    if (v.disabled) ctx.globalAlpha *= 0.42;

    if (p.shadowBlur > 0) {
      ctx.save();
      ctx.shadowColor   = p.shadowColor;
      ctx.shadowOffsetX = (p.shadowOffsetX || 0) * zoom;
      ctx.shadowOffsetY = (p.shadowOffsetY || 0) * zoom;
      ctx.shadowBlur    = (p.shadowBlur    || 0) * zoom;
      roundRectPath(ctx, left, top, w, h, r);
      ctx.fillStyle = fillHex;
      ctx.fill();
      ctx.restore();
    }

    const base    = hexToRgb(fillHex);
    const bevel   = p.bevel || 0;
    const bStr    = p.bevelStrength || 0;
    const lInt    = p.lightIntensity || 0;
    const angle   = p.lightAngle || 315;
    const rad     = angle * Math.PI / 180;
    const dx      = Math.sin(rad);
    const dy      = -Math.cos(rad);

    const faceLit = shiftColor(base,  lInt * 0.14 * bevel);
    const faceSh  = shiftColor(base, -lInt * 0.10 * bevel);

    const gx0 = cx + dx * w / 2;
    const gy0 = cy + dy * h / 2;
    const gx1 = cx - dx * w / 2;
    const gy1 = cy - dy * h / 2;

    const faceGrad = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
    faceGrad.addColorStop(0, faceLit);
    faceGrad.addColorStop(1, faceSh);

    roundRectPath(ctx, left, top, w, h, r);
    ctx.fillStyle = faceGrad;
    ctx.fill();

    if (bevel !== 0 && bStr > 0) {
      const litAmt = bStr * lInt * bevel;
      const hi     = shiftColor(base,  litAmt);
      const lo     = shiftColor(base, -litAmt);
      const edgeW  = bw * 1.4;

      ctx.save();
      roundRectPath(ctx, left, top, w, h, r);
      ctx.clip();

      ctx.strokeStyle = hi;
      ctx.lineWidth   = edgeW;
      roundRectPath(ctx, left + dx * bw * 0.5,
       top  + dy * bw * 0.5, w, h, r);
      ctx.stroke();

      ctx.strokeStyle = lo;
      ctx.lineWidth   = edgeW;
      roundRectPath(ctx, left - dx * bw * 0.5,
       top  - dy * bw * 0.5, w, h, r);
      ctx.stroke();

      ctx.restore();
    }

    if ((p.brightness || 1) < 1.0) {
      roundRectPath(ctx, left, top, w, h, r);
      ctx.fillStyle = `rgba(0,0,0,${(1 - p.brightness).toFixed(3)})`;
      ctx.fill();
    }

    const label = v.label ?? v.emoji ?? v.symbol
    ?? v.name?.substring(0, 2) ?? '';

    if (label) {
      const fSize = (p.fontSize || 32) * zoom * sc;
      ctx.fillStyle    = p.color;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.font         = `600 ${fSize.toFixed(1)}px "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif`;

      const labelY = v.sub ? cy - h * 0.06 : cy;
      ctx.fillText(label, cx, labelY);
    }

    if (v.sub) {
      const subSize = (p.fontSize || 32) * 0.36 * zoom * sc;
      ctx.fillStyle    = p.color;
      ctx.globalAlpha  = (v.disabled ? 0.42 : 1.0) * 0.65;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.font         = `400 ${subSize.toFixed(1)}px "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif`;

      const subY = cy + h * 0.22 + (p.subOffset || 0) * zoom;
      ctx.fillText(v.sub, cx, subY);
    }

    if (v.badge != null && v.badge !== '') {
      const badgeR = 10 * zoom;
      const badgeX = left + w - badgeR * 0.4;
      const badgeY = top  - badgeR * 0.4;

      ctx.globalAlpha = v.disabled ? 0.42 : 1.0;
      ctx.beginPath();
      ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
      ctx.fillStyle = p.badgeFill || '#e74c3c';
      ctx.fill();

      ctx.fillStyle    = p.badgeColor || '#fff';
      ctx.font         = `700 ${(11 * zoom).toFixed(1)}px system-ui, sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(v.badge), badgeX, badgeY + 0.5);
    }

    if (v.selected || v.hovered) {
      ctx.setLineDash([4 * zoom, 4 * zoom]);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth   = 2 * zoom;
      roundRectPath(ctx, left - 4 * zoom, top - 4 * zoom,
        w + 8 * zoom, h + 8 * zoom,
        r + 4 * zoom);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  static hit_test(ctxMix, node, params) {
    const pt = ctxMix.hitPoint;

    const v = ctxMix.getValue(ctxMix, node, params) || {};
    if (v.disabled) return;

    const p    = { ...BUTTON_DEFAULTS, ...params };
    const zoom = 1;

    const sc   = p.scale || 1;
    const rawW = v.width  || 64;
    const rawH = v.height || 64;
    const w    = rawW * zoom * sc;
    const h    = rawH * zoom * sc;
    const r    = Math.min((p.cornerRadius || 0) * zoom * sc, w / 2, h / 2);

    const screen = ButtonNode.getCentreXY(ctxMix, node, params);
    const sx   = screen.x;
    const sy   = screen.y + (p.liftY || 0) * zoom;
    const left = sx - w / 2;
    const top  = sy - h / 2;

    if (pt.x < left || pt.x > left + w ||
      pt.y < top  || pt.y > top  + h) return;

      const lx = pt.x - left;
    const ly = pt.y - top;
    if (lx < r && ly < r && (lx - r) ** 2 + (ly - r) ** 2 > r * r) return;
    if (lx > w - r && ly < r && (lx - (w - r)) ** 2 + (ly - r) ** 2 > r * r) return;
    if (lx < r && ly > h - r && (lx - r) ** 2 + (ly - (h - r)) ** 2 > r * r) return;
    if (lx > w - r && ly > h - r && (lx - (w - r)) ** 2 + (ly - (h - r)) ** 2 > r * r) return;

    const dxHit = pt.x - sx;
    const dyHit = pt.y - sy;

    ctxMix.hitResult = {
      node,
      interactions: {
        applyDrag(wx, wy) {
          Values.setValue(Values, node, params, { x: wx - dxHit, y: wy - dyHit });
          return node;
        },
      },
    };
  }
}

class PhylotaxisModel {
  constructor(label, state) {
    this._label = label;
    this.visible = true;
    this._phyloState = JSON.parse(JSON.stringify(state));
    this._currentLevel = 0;
    this._maxCounts = [20,20,500];
    this.controls = [
      {type:'separator',label:'Global'},{id:'baseHue',label:'Base Hue',min:0,max:1,step:0.01,value:state.baseHue},{id:'splatSize',label:'Splat Size',min:0.1,max:5,step:0.1,value:state.splatSize},{id:'splatLength',label:'Splat Len',min:0.1,max:10,step:0.1,value:state.splatLength},{id:'splatWidth',label:'Splat W',min:0.1,max:10,step:0.1,value:state.splatWidth},
      {type:'separator',label:'Level'},{id:'level',type:'select',label:'Target',options:[['0','Lvl 1'],['1','Lvl 2'],['2','Lvl 3']],value:'0'},
      {id:'count',label:'Count',min:1,max:this._maxCounts[0],step:1,value:state.levels[0].count},
      {id:'angle',label:'Div. Angle',min:100,max:180,step:0.1,value:state.levels[0].angle},
      {id:'height',label:'Height',min:0,max:50,step:0.1,value:state.levels[0].height},
      {id:'initialRadius',label:'Init R',min:0,max:30,step:0.1,value:state.levels[0].initialRadius},
      {id:'finalRadius',label:'Final R',min:0,max:30,step:0.1,value:state.levels[0].finalRadius},
      {id:'bulge',label:'Bulge',min:-2,max:2,step:0.01,value:state.levels[0].bulge},
      {id:'tilt',label:'Tilt',min:-90,max:90,step:1,value:state.levels[0].tilt},
      {id:'hueShift',label:'Hue Shift',min:-1,max:1,step:0.01,value:state.levels[0].hueShift}
    ];
  }
  get name() { return this._label; }
  get displayType() { return '3d'; }
  get background() { return '#090a0f'; }

  init(container) {
    const v = make3DPane(container);
    if (!v) return null;
    v.camera.position.set(0,-50,80);
    this.nv = SYS.makeNode('phylo-node', {}); 
    sceneRegistry.walkPhase({iterators:[]}, 'build3d', this.nv, this._phyloState); 
    v.scene.add(this.nv.value.group); 
    v.phyloNode = this.nv; 
    return v;
  }

  onControl(id, val, getValues, app) {
    if (id === 'level') {
      this._currentLevel = parseInt(val, 10);
      const l = this._phyloState.levels[this._currentLevel];
      this.controls.find(c => c.id === 'count').max = this._maxCounts[this._currentLevel];
      ['count','angle','height','initialRadius','finalRadius','bulge','tilt','hueShift'].forEach(k => {
        const ctrl = this.controls.find(c => c.id === k);
        if (ctrl) ctrl.value = l[k];
      });
      app.buildHud(); 
    } else if (['baseHue','splatSize','splatLength','splatWidth'].includes(id)) {
      this._phyloState[id] = val;
      if (this.nv && this.nv.value.group) sceneRegistry.walkPhase({iterators:[]}, 'update3d', this.nv, this._phyloState);
      const ctrl = this.controls.find(c => c.id === id);
      if (ctrl) ctrl.value = val;
